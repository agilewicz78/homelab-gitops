        clauses = []
        if not include_inactive:
            clauses.append("COALESCE(sc.is_active, TRUE) = TRUE")
        if user_visible_only:
            clauses.append("COALESCE(sc.user_visible, TRUE) = TRUE")
        where_sql = "WHERE " + " AND ".join(clauses) if clauses else ""
        cur.execute(f"""
            SELECT
              sc.id, sc.service_key, sc.name, COALESCE(sc.description, ''),
              sc.category, COALESCE(sc.subcategory, 'Inne'), sc.owner_email,
              COALESCE(sc.status, 'operational'), COALESCE(sc.criticality, 'medium'),
              COALESCE(sc.default_priority, 'Normalny'),
              COALESCE(sc.user_visible, TRUE), COALESCE(sc.is_active, TRUE),
              sc.updated_at,
              u.first_name,
              u.last_name,
              (
                SELECT COUNT(*)
                FROM tickets t
                WHERE t.service_id = sc.id
                  AND t.status NOT IN ('Rozwiązane', 'Zamknięte')
              ) AS open_ticket_count,
              (
                SELECT COUNT(DISTINCT i.id)
                FROM incidents i
                JOIN incident_tickets it ON it.incident_id = i.id
                JOIN tickets t ON t.id = it.ticket_id
                WHERE t.service_id = sc.id
                  AND i.status <> 'resolved'
              ) AS active_incident_count
            FROM service_catalog sc
            LEFT JOIN users u ON lower(u.email) = lower(sc.owner_email)
            {where_sql}
            ORDER BY
              CASE COALESCE(sc.status, 'operational')
                WHEN 'outage' THEN 1
                WHEN 'degraded' THEN 2
                WHEN 'maintenance' THEN 3
                ELSE 4
              END,
              lower(sc.name)
        """)
        return [service_row_payload(row) for row in cur.fetchall()]

    SIMILARITY_STOP_WORDS = {
        "aby", "ale", "bez", "blad", "brak", "byc", "czy", "dla", "dziala",
        "jest", "ktore", "ktory", "mam", "mozna", "nie", "oraz", "problem",
        "prosze", "przy", "sie", "ten", "tego", "tym", "witam", "zgloszenie",
    }

    def similarity_tokens(*values):
        text = " ".join(clean(value) for value in values)
        normalized = unicodedata.normalize("NFKD", text)
        ascii_text = "".join(
            character
            for character in normalized
            if not unicodedata.combining(character)
        ).lower()
        return {
            token
            for token in re.findall(r"[a-z0-9]+", ascii_text)
            if len(token) >= 3 and token not in SIMILARITY_STOP_WORDS
        }

    def similarity_score(
        source_tokens,
        candidate_tokens,
        same_category=False,
        same_subcategory=False,
    ):
        common_tokens = sorted(source_tokens & candidate_tokens)
        if not common_tokens:
            return 0, []
        score = min(60, len(common_tokens) * 24)
        reasons = [f"Wspólne słowa: {', '.join(common_tokens[:3])}"]
        if same_category:
            score += 20
            reasons.append("Ta sama kategoria")
        if same_subcategory:
            score += 20
            reasons.append("Ta sama podkategoria")
        return min(100, score), reasons

    # Waliduje rozszerzenie przesyłanego załącznika.
    def allowed_attachment(filename):
        if not filename or "." not in filename:
            return False
        ext = filename.rsplit(".", 1)[1].lower()
        return ext in ALLOWED_ATTACHMENT_EXTENSIONS

    # Wyznacza bezpieczną ścieżkę zapisu załącznika.
    def attachment_path(stored_filename):
        base = os.path.abspath(ATTACHMENTS_DIR)
        target = os.path.abspath(os.path.join(base, stored_filename))
        if not target.startswith(base + os.sep):
            raise ValueError("Invalid attachment path")
        return target

    # Pobiera politykę SLA dla priorytetu zgłoszenia.
    def sla_policy_for_priority(cur, priority):
        cur.execute("""
            SELECT first_response_hours, resolution_hours, warning_hours, COALESCE(is_active, TRUE)
            FROM sla_policies
            WHERE priority = %s
        """, (priority,))
        row = cur.fetchone()
        if row and row[3]:
            return {
                "first_response_hours": int(row[0] or 8),
                "resolution_hours": int(row[1] or SLA_HOURS.get(priority, 48)),
                "warning_hours": int(row[2] or 4),
            }
        defaults = {
            "Krytyczny": {"first_response_hours": 1, "resolution_hours": 4, "warning_hours": 1},
            "Wysoki": {"first_response_hours": 2, "resolution_hours": 8, "warning_hours": 2},
            "Normalny": {"first_response_hours": 8, "resolution_hours": 48, "warning_hours": 4},
            "Niski": {"first_response_hours": 24, "resolution_hours": 120, "warning_hours": 8},
        }
        return defaults.get(priority, {"first_response_hours": 8, "resolution_hours": 48, "warning_hours": 4})
    def sla_due_for_priority(priority):
        return datetime.now() + timedelta(hours=SLA_HOURS.get(priority, 48))

    # Wylicza terminy SLA reakcji i rozwiązania.
    def sla_times_for_priority(cur, priority):
        policy = sla_policy_for_priority(cur, priority)
        now = datetime.now()
        return now + timedelta(hours=policy["first_response_hours"]), now + timedelta(hours=policy["resolution_hours"])

    # Określa stan SLA rozwiązania: OK, ostrzeżenie albo przekroczenie.
    def sla_state(sla_due_at, status, warning_hours=4):
        if not sla_due_at:
            return "none"
        if status in ("Rozwiązane", "Zamknięte"):
            return "done"
        now = datetime.now()
        if sla_due_at < now:
            return "overdue"
        if sla_due_at - now <= timedelta(hours=warning_hours or 4):
            return "warning"
        return "ok"

    # Określa stan SLA pierwszej reakcji operatora.
    def first_response_state(first_response_due_at, first_response_at, status, warning_hours=4):
        if first_response_at:
            return "done"
        return sla_state(first_response_due_at, status, warning_hours=warning_hours)

    # Oznacza pierwszą reakcję operatora po dodaniu komentarza.
    def mark_first_response_if_needed(cur, ticket_id, user):
        if not is_staff(user):
            return False
        cur.execute("""
            UPDATE tickets
            SET first_response_at = NOW(), updated_at = NOW()
            WHERE id = %s
              AND first_response_at IS NULL
              AND status NOT IN ('Rozwiązane', 'Zamknięte')
            RETURNING first_response_at
        """, (ticket_id,))
        row = cur.fetchone()
        if row:
            add_ticket_event(cur, ticket_id, user, "sla_first_response", "Zarejestrowano pierwszą reakcję operatora dla SLA.")
            log_audit(cur, user, "sla_first_response", "ticket", ticket_id, {"first_response_at": str(row[0])})
            return True
        return False
