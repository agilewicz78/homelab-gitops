        function serviceContextRecommendation(service, summary, incidents) {
          const openTickets = Number(summary?.open_tickets || 0);
          const highPriority = Number(summary?.high_priority_open || 0);
          const incidentCount = Number((incidents || []).length);
          if (incidentCount > 0) {
            return "Usługa ma aktywny incydent. Najlepiej publikować komunikaty w incydencie, żeby aktualizacje trafiły do powiązanych zgłoszeń.";
          }
          if (openTickets >= 5 || highPriority >= 2 || isProblematicService(service)) {
            return "Warto rozważyć incydent zbiorczy: usługa ma wyraźny sygnał problemu albo wiele aktywnych zgłoszeń.";
          }
          if (openTickets > 0) {
            return "Na razie wygląda to na pojedyncze zgłoszenia. Obserwuj trend 7/30 dni i powtarzające się objawy.";
          }
          return "Brak aktywnych zgłoszeń dla tej usługi. Status i komunikat mogą wystarczyć użytkownikom.";
        }
    
        async function createServiceIncident(serviceId) {
          if (!confirm("Utworzyć incydent z aktywnych zgłoszeń tej usługi? Zgłoszenia już powiązane z aktywnym incydentem zostaną pominięte.")) return;
          suppressNextLiveRefresh = true;
          const res = await api(`/api/services/${Number(serviceId)}/incident`, {
            method: "POST",
            body: JSON.stringify({})
          });
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({})) : {};
            alert(err.error || "Nie udało się utworzyć incydentu z usługi.");
            return;
          }
          const created = await res.json();
          const skipped = Number(created.skipped_existing_incident_count || 0);
          showToast(
            `Utworzono incydent #${created.id}`,
            `Powiązano ${Number(created.linked_ticket_count || 0)} zgłoszeń${skipped ? `, pominięto ${skipped} już w incydencie` : ""}.`
          );
          await renderIncident(created.id);
        }
    
        function serviceIncidentActionButton(service, summary) {
