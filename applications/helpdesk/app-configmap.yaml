        async function exportWorkflowRuleExecutionsCsv(workflowId = "") {{
          try {{
            const filters = workflowRuleExecutionFilterValues(workflowId);
            const params = new URLSearchParams();
            if (filters.workflow_id) params.set("workflow_id", String(filters.workflow_id));
            if (filters.q) params.set("q", filters.q);
            if (filters.ticket_id) params.set("ticket_id", String(filters.ticket_id).replace(/^#/, ""));
            if (filters.event_type && filters.event_type !== "all") params.set("event_type", filters.event_type);
            if (filters.matched && filters.matched !== "all") params.set("matched", filters.matched);
            if (filters.actor) params.set("actor", filters.actor);
            if (filters.date_from) params.set("date_from", filters.date_from);
            if (filters.date_to) params.set("date_to", filters.date_to);
            const res = await fetch(`/api/admin/workflow-rule-executions.csv?${{params.toString()}}`, {{ headers: {{ "X-Helpdesk-Session": getSid() }} }});
            if (res.status === 401) {{ clearSid(); window.location.href = "/login"; return; }}
            if (!res.ok) {{
              let msg = "Nie udało się wyeksportować logu.";
              try {{ const data = await res.json(); msg = data.error || data.details || msg; }} catch (e) {{}}
              alert(msg);
              return;
            }}
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const stamp = new Date().toISOString().slice(0,19).replace(/[-:T]/g, "");
            a.href = url;
            a.download = `helpdesk-log-workflow-${{stamp}}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          }} catch (err) {{
            alert("Nie udało się wyeksportować logu: " + (err && err.message ? err.message : String(err)));
          }}
        }}
        function workflowRuleExecutionFilterValues(workflowId = "") {{
          const get = (id) => document.getElementById(id)?.value || "";
          return {{
            workflow_id: workflowId || get("wreWorkflowId"),
            q: get("wreSearch"),
            ticket_id: get("wreTicketId"),
            event_type: get("wreEventType") || "all",
            matched: get("wreMatched") || "all",
            actor: get("wreActor"),
            date_from: get("wreDateFrom"),
            date_to: get("wreDateTo"),
          }};
        }}
        function clearWorkflowRuleExecutionFilters(workflowId = "") {{
          ["wreSearch", "wreTicketId", "wreActor", "wreDateFrom", "wreDateTo"].forEach(id => {{ const el = document.getElementById(id); if (el) el.value = ""; }});
          const ev = document.getElementById("wreEventType"); if (ev) ev.value = "all";
          const mt = document.getElementById("wreMatched"); if (mt) mt.value = "all";
          renderWorkflowRuleExecutions(workflowId, 1, {{ workflow_id: workflowId }});
        }}
        function workflowRuleExecutionsShell(workflowId = "", returnedFilters = {{}}, pagination = {{}}) {{
          const page = Number(pagination.page || 1);
          const totalPages = Number(pagination.total_pages || 1);
          const totalFiltered = pagination.total_filtered ?? "—";
          const backTarget = workflowId ? `renderWorkflowManagement(${{Number(workflowId)}})` : "renderAdminWorkflows()";
          const backLabel = workflowId ? "← Proces" : "← Workflow";
          return `
            <section class="card">
              <button class="btn-secondary" onclick="${{backTarget}}">${{backLabel}}</button>
              <h2>Log automatyzacji workflow</h2>
              <p class="muted">Lista pokazuje, które reguły workflow zostały uruchomione, dla jakiego zgłoszenia i jakie akcje wykonały. Filtry ułatwiają debugowanie konkretnego zgłoszenia, zdarzenia albo operatora.</p>
            </section>
            <section class="card">
              <h3>Filtry logu automatyzacji</h3>
              <div class="grid two">
                <div><label>Szukaj</label><input id="wreSearch" placeholder="Nazwa reguły, workflow, akcja, powód..." value="${{esc(returnedFilters.q || "")}}"></div>
                <div><label>Numer zgłoszenia</label><input id="wreTicketId" placeholder="#123" value="${{esc(returnedFilters.ticket_id || "")}}"></div>
                <div><label>Zdarzenie</label><select id="wreEventType">
                  ${{["all", "ticket_created", "comment_added", "attachment_added", "status_changed", "ticket_assigned"].map(v => `<option value="${{v}}" ${{(returnedFilters.event_type || "all") === v ? "selected" : ""}}>${{esc(v === "all" ? "Wszystkie" : workflowAutomationRuleEventLabel(v))}}</option>`).join("")}}
                </select></div>
                <div><label>Wynik</label><select id="wreMatched">
                  <option value="all" ${{(returnedFilters.matched || "all") === "all" ? "selected" : ""}}>Wszystkie</option>
                  <option value="matched" ${{["matched", "true", "1"].includes(returnedFilters.matched || "") ? "selected" : ""}}>Dopasowane</option>
                  <option value="skipped" ${{["skipped", "false", "0"].includes(returnedFilters.matched || "") ? "selected" : ""}}>Niedopasowane</option>
                </select></div>
                <div><label>Wykonawca</label><input id="wreActor" placeholder="Imię, nazwisko lub e-mail" value="${{esc(returnedFilters.actor || "")}}"></div>
                <div><label>Od daty</label><input id="wreDateFrom" type="date" value="${{esc(returnedFilters.date_from || "")}}"></div>
                <div><label>Do daty</label><input id="wreDateTo" type="date" value="${{esc(returnedFilters.date_to || "")}}"></div>
              </div>
              <input type="hidden" id="wreWorkflowId" value="${{esc(returnedFilters.workflow_id || workflowId || "")}}">
              <div class="actions" style="margin-top:12px">
                <button onclick="renderWorkflowRuleExecutions('${{esc(workflowId || "")}}', 1)">Zastosuj filtry</button>
                <button class="btn-secondary" onclick="clearWorkflowRuleExecutionFilters('${{esc(workflowId || "")}}')">Wyczyść filtry</button>
                <button class="btn-secondary" onclick="exportWorkflowRuleExecutionsCsv('${{esc(workflowId || "")}}')">Eksport CSV</button>
              </div>
            </section>
            <section class="card">
              <div class="pagination-bar"><span>Wpisy: ${{totalFiltered}} · Strona ${{page}} z ${{totalPages}}</span><div class="actions"><button class="btn-secondary btn-small" ${{page <= 1 ? "disabled" : ""}} onclick="renderWorkflowRuleExecutions('${{esc(workflowId || "")}}', ${{page - 1}})">Poprzednia</button><button class="btn-secondary btn-small" ${{page >= totalPages ? "disabled" : ""}} onclick="renderWorkflowRuleExecutions('${{esc(workflowId || "")}}', ${{page + 1}})">Następna</button></div></div>
              <div id="workflowRuleExecutionContent"><p class="muted">Ładowanie logu automatyzacji...</p></div>
            </section>
          `;
        }}
        async function renderWorkflowRuleExecutions(workflowId = "", page = 1, explicitFilters = null) {{
          const backTarget = workflowId ? `renderWorkflowManagement(${{Number(workflowId)}})` : "renderAdminWorkflows()";
          const backLabel = workflowId ? "← Proces" : "← Workflow";
          try {{
            const me = await loadMe();
            if (!me || !isAdmin(me)) {{
              appEl.innerHTML = `<section class="card"><h2>Brak dostępu</h2><p class="muted">Log automatyzacji jest dostępny tylko dla administratora.</p></section>`;
              return;
            }}
            const filters = explicitFilters || workflowRuleExecutionFilterValues(workflowId);
            const params = new URLSearchParams();
            params.set("page", String(page || 1));
            params.set("page_size", "25");
            if (filters.workflow_id) params.set("workflow_id", String(filters.workflow_id));
            if (filters.q) params.set("q", filters.q);
            if (filters.ticket_id) params.set("ticket_id", String(filters.ticket_id).replace(/^#/, ""));
            if (filters.event_type && filters.event_type !== "all") params.set("event_type", filters.event_type);
            if (filters.matched && filters.matched !== "all") params.set("matched", filters.matched);
            if (filters.actor) params.set("actor", filters.actor);
            if (filters.date_from) params.set("date_from", filters.date_from);
            if (filters.date_to) params.set("date_to", filters.date_to);
            appEl.innerHTML = workflowRuleExecutionsShell(workflowId, filters, {{ page: page || 1, total_pages: 1, total_filtered: "—" }});
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            let res;
            try {{
              res = await fetch(`/api/admin/workflow-rule-executions?${{params.toString()}}`, {{ headers: {{ "X-Helpdesk-Session": getSid() }}, signal: controller.signal }});
            }} finally {{
              clearTimeout(timer);
            }}
            if (res.status === 401) {{
              clearSid();
              window.location.href = "/login";
              return;
            }}
            let data = {{}};
            try {{ data = await res.json(); }} catch (e) {{ data = {{ error: "Endpoint logu nie zwrócił poprawnego JSON." }}; }}
            if (!res.ok) {{
              const msg = data.error || data.details || "Nie udało się pobrać logu automatyzacji.";
              const content = document.getElementById("workflowRuleExecutionContent");
              if (content) content.innerHTML = `<div class="error"><strong>Błąd pobierania logu automatyzacji.</strong><br>${{esc(msg)}}</div><p class="muted">Sprawdź logi poda: <code>kubectl logs -n helpdesk deploy/helpdesk-app --tail=200</code></p>`;
              return;
            }}
            const returnedFilters = data.filters || filters || {{}};
            const pagination = data.pagination || {{ page: 1, total_pages: 1, total_filtered: 0 }};
            appEl.innerHTML = workflowRuleExecutionsShell(workflowId, returnedFilters, pagination);
            const rows = (data.executions || []).map(e => `
              <tr>
                <td><strong>${{esc(e.automation_name || "Reguła workflow")}}</strong><br><span class="muted">${{esc(e.workflow_name || e.workflow_key || "-")}}</span></td>
                <td>${{e.ticket_id ? `<button class="btn-link" onclick="renderTicket(${{Number(e.ticket_id)}})">#${{e.ticket_id}}</button>` : "-"}}<br><span class="muted">${{esc(e.ticket_title || "")}}</span></td>
                <td>${{esc(e.event_type || "-")}}<br><span class="muted">${{esc(e.current_status || "-")}}${{e.event_new_status ? " → " + esc(e.event_new_status) : ""}}</span></td>
                <td>${{esc(e.actor_name || e.actor_email || "System")}}<br><span class="muted">${{esc(e.actor_email || "")}}</span></td>
                <td>${{e.matched ? `<span class="status-badge status-new">Dopasowana</span>` : `<span class="status-badge status-closed">Niedopasowana</span>`}}</td>
                <td>
                  <div>${{esc(workflowRuleExecutionActionSummary(e.actions_executed))}}</div>
                  <details style="margin-top:6px"><summary>Szczegóły akcji</summary>${{workflowRuleExecutionActionDetails(e.actions_executed)}}</details>
                </td>
                <td>${{esc(e.reason || "")}}</td>
                <td>${{esc(e.created_at || "")}}</td>
              </tr>
            `).join("");
            const content = document.getElementById("workflowRuleExecutionContent");
            if (content) {{
              content.innerHTML = `<table><thead><tr><th>Reguła / workflow</th><th>Zgłoszenie</th><th>Zdarzenie / status</th><th>Wykonawca</th><th>Wynik</th><th>Akcje</th><th>Powód</th><th>Data</th></tr></thead><tbody>${{rows || `<tr><td colspan="8" class="muted">Brak wpisów logu.</td></tr>`}}</tbody></table>`;
            }}
          }} catch (err) {{
            const content = document.getElementById("workflowRuleExecutionContent");
            const msg = err && err.name === "AbortError" ? "Przekroczono czas oczekiwania na odpowiedź API logu." : (err && err.message ? err.message : String(err));
            if (content) {{
              content.innerHTML = `<div class="error"><strong>Nie udało się załadować logu automatyzacji.</strong><br>${{esc(msg)}}</div>`;
            }} else {{
              appEl.innerHTML = `<section class="card"><button class="btn-secondary" onclick="${{backTarget}}">${{backLabel}}</button><h2>Błąd logu automatyzacji</h2><p class="error">${{esc(msg)}}</p></section>`;
            }}
          }}
        }}
        function workflowAutomationCountSummary(workflow) {{
          const rules = Array.isArray(workflow.automations) ? workflow.automations : [];
          const active = rules.filter(rule => rule.is_active !== false).length;
          return {{
            total: rules.length,
            active,
            drafts: Math.max(0, rules.length - active),
          }};
        }}
        function workflowManagementMetric(label, value, hint = "") {{
          return `
            <div class="panel-soft">
              <strong>${{esc(value)}}</strong><br>
              <span class="muted">${{esc(label)}}</span>
