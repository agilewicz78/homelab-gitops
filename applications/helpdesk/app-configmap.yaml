    \ initial-scale=1\">\n      <title>INCoprp Helpdesk</title>\n      <style>{CSS}</style>\n\
    \    </head>\n    <body>\n      <main class=\"page\">\n        <header>\n    \
    \      <div>\n            <h1>INCoprp Helpdesk</h1>\n            <p class=\"subtitle\"\
    >Centrum zgłoszeń IT dla pracowników biurowych.</p>\n          </div>\n      \
    \    <div class=\"badge\">SessionStorage: <strong>per karta</strong></div>\n \
