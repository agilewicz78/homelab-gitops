    init_db()
    def esc(value):
        return html.escape(str(value or ""))
    def clean(value):
        return str(value or "").strip()

    def normalize_service_key(value):
        normalized = re.sub(r"[^a-z0-9]+", "-", clean(value).lower()).strip("-")
        return normalized or f"service-{uuid.uuid4().hex[:8]}"

    def service_row_payload(row):
        owner_name = " ".join(part for part in [row[13] or "", row[14] or ""] if part).strip()
        return {
            "id": row[0],
            "service_key": row[1],
            "name": row[2],
            "description": row[3] or "",
            "category": row[4],
            "subcategory": row[5] or "Inne",
            "owner_email": row[6] or "",
            "status": row[7] or "operational",
            "status_label": SERVICE_STATUS_LABELS.get(row[7] or "operational", row[7] or "operational"),
            "criticality": row[8] or "medium",
            "criticality_label": SERVICE_CRITICALITY_LABELS.get(row[8] or "medium", row[8] or "medium"),
            "default_priority": row[9] or "Normalny",
            "user_visible": bool(row[10]),
            "is_active": bool(row[11]),
            "updated_at": str(row[12]) if row[12] else "",
            "owner_name": owner_name or row[6] or "",
            "open_ticket_count": int(row[15] or 0),
            "active_incident_count": int(row[16] or 0),
        }

