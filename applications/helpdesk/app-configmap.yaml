    @app.delete("/api/tickets/<int:ticket_id>/watchers/<path:watcher_email>")
    @api_login_required
    def api_remove_watcher(user, ticket_id, watcher_email):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        watcher_email = clean(watcher_email).lower()
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT assigned_to_email, status FROM tickets WHERE id = %s", (ticket_id,))
        ticket_row = cur.fetchone()
        if not ticket_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        if ticket_row[1] == "Zamknięte":
            cur.close()
            conn.close()
            return jsonify({"error": "Zgłoszenie jest zamknięte i dostępne tylko do odczytu."}), 400
        if ticket_row[0] and watcher_email == ticket_row[0].lower():
            cur.close()
            conn.close()
            return jsonify({"error": "Przypisany operator pozostaje obserwatorem zgłoszenia."}), 400
        cur.execute("""
            SELECT first_name, last_name, email
            FROM users
            WHERE lower(email) = %s
        """, (watcher_email,))
        watcher_row = cur.fetchone()
        watcher_name = watcher_email
        if watcher_row:
            watcher_email = watcher_row[2]
            watcher_name = f"{watcher_row[0]} {watcher_row[1]}".strip()
        cur.execute("""
            DELETE FROM ticket_watchers
            WHERE ticket_id = %s AND lower(user_email) = %s
        """, (ticket_id, watcher_email.lower()))
        add_ticket_event(cur, ticket_id, user, "watcher_removed", f"Usunięto obserwatora: {watcher_name}")
        log_audit(cur, user, "ticket_watcher_removed", "ticket", ticket_id, {
            "watcher_email": watcher_email,
            "watcher_name": watcher_name,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} usunął obserwatora ze zgłoszenia #{ticket_id}: {watcher_name}", "watcher_changed", ticket_id)
        return jsonify({"status": "ok"})
    @app.post("/api/tickets/<int:ticket_id>/links")
    @api_login_required
    def api_add_ticket_link(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        linked_ticket_id_raw = payload.get("linked_ticket_id") or payload.get("ticket_id")
        try:
            linked_ticket_id = int(linked_ticket_id_raw)
        except Exception:
            return jsonify({"error": "Podaj poprawne ID zgłoszenia."}), 400
        if linked_ticket_id == ticket_id:
            return jsonify({"error": "Nie można powiązać zgłoszenia z samym sobą."}), 400
        relation_type = clean(payload.get("relation_type")) or "related"
        if relation_type not in ("related",):
            relation_type = "related"
        a_id = min(ticket_id, linked_ticket_id)
        b_id = max(ticket_id, linked_ticket_id)
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT id, title, status
            FROM tickets
            WHERE id IN (%s, %s)
        """, (ticket_id, linked_ticket_id))
        rows = cur.fetchall()
        titles = {r[0]: r[1] for r in rows}
        statuses = {r[0]: r[2] for r in rows}
        if ticket_id not in titles or linked_ticket_id not in titles:
            cur.close()
            conn.close()
            return jsonify({"error": "Nie znaleziono jednego ze zgłoszeń."}), 404
        if statuses.get(ticket_id) == "Zamknięte" or statuses.get(linked_ticket_id) == "Zamknięte":
            cur.close()
            conn.close()
            return jsonify({"error": "Nie można zmieniać powiązań zamkniętego zgłoszenia."}), 400
        cur.execute("""
            INSERT INTO ticket_links (ticket_id, linked_ticket_id, relation_type, created_by_email)
            VALUES (%s, %s, %s, %s)
            ON CONFLICT (ticket_id, linked_ticket_id, relation_type) DO NOTHING
            RETURNING id
        """, (a_id, b_id, relation_type, user["email"]))
        inserted = cur.fetchone()
        if not inserted:
            cur.close()
            conn.close()
            return jsonify({"error": "Te zgłoszenia są już powiązane."}), 409
        add_ticket_event(
            cur,
            ticket_id,
            user,
            "ticket_link_added",
            f"Powiązano ze zgłoszeniem #{linked_ticket_id}: {titles[linked_ticket_id]}"
        )
        add_ticket_event(
            cur,
            linked_ticket_id,
            user,
            "ticket_link_added",
            f"Powiązano ze zgłoszeniem #{ticket_id}: {titles[ticket_id]}"
        )
        log_audit(cur, user, "ticket_link_added", "ticket", ticket_id, {
            "linked_ticket_id": linked_ticket_id,
            "ticket_title": titles[ticket_id],
            "linked_ticket_title": titles[linked_ticket_id],
            "relation_type": relation_type,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "ticket_link_changed",
            f"Zgłoszenie #{ticket_id}: {titles[ticket_id]} powiązano ze zgłoszeniem #{linked_ticket_id}: {titles[linked_ticket_id]}.",
            actor_email=user["email"],
        )
        create_ticket_notifications(
            cur,
            linked_ticket_id,
            "ticket_link_changed",
            f"Zgłoszenie #{linked_ticket_id}: {titles[linked_ticket_id]} powiązano ze zgłoszeniem #{ticket_id}: {titles[ticket_id]}.",
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} powiązał zgłoszenie #{ticket_id} ze zgłoszeniem #{linked_ticket_id}", "ticket_link_changed", ticket_id)
        publish_event(f"{user['name']} powiązał zgłoszenie #{linked_ticket_id} ze zgłoszeniem #{ticket_id}", "ticket_link_changed", linked_ticket_id)
        return jsonify({"status": "ok"}), 201
