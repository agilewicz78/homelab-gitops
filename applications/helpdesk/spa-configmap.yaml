        async function renderAdminPermissions() {
          const me = await loadMe();
          if (!me) return;
          if (!canViewPermissions(me)) {
            appEl.innerHTML = `<section class="card"><h2>Brak dostępu</h2><p class="muted">Macierz uprawnień jest dostępna tylko dla administratora.</p></section>`;
            return;
          }
          const res = await api("/api/admin/permissions");
          if (!res) return;
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            appEl.innerHTML = `<section class="card"><h2>Nie udało się pobrać uprawnień</h2><p class="error">${esc(data.error || "Nieznany błąd")}</p></section>`;
            return;
          }
          const roles = data.roles || [];
          const allPermissions = data.all_permissions || [];
          const roleCards = roles.map(role => {
            const direct = new Set(role.direct_permission_codes || []);
            const locked = new Set(role.locked_permission_codes || []);
            const editable = new Set(role.editable_permission_codes || []);
            const rows = allPermissions.map(p => {
              const isDirect = direct.has(p.code);
              const isLocked = locked.has(p.code);
              const isEditable = editable.has(p.code);
              const disabled = (isLocked || !isEditable) ? "disabled" : "";
              const checked = isDirect ? "checked" : "";
              const hint = isLocked
                ? `<span class="badge">zablokowane</span>`
                : (!isEditable ? `<span class="muted">dziedziczone / niedostępne bezpośrednio</span>` : "");
              return `
                <tr>
                  <td><strong>${esc(p.label)}</strong><br><span class="muted">${esc(p.code)}</span></td>
                  <td style="text-align:center">
                    <input type="checkbox" data-role-permission="${esc(role.key)}" value="${esc(p.code)}" ${checked} ${disabled}>
                    ${hint}
                  </td>
                </tr>`;
            }).join("");
            return `
              <section class="card">
                <div class="flex-between">
                  <div>
                    <h3>${esc(role.label || role.key)}</h3>
                    <p class="muted">${esc(role.description || "")}</p>
                  </div>
                  <button onclick="saveRolePermissions('${esc(role.key)}')">Zapisz uprawnienia roli</button>
                </div>
                <p class="muted">Uprawnienia bezpośrednie tej roli. Role nadrzędne nadal dziedziczą uprawnienia ról niższych.</p>
                <table>
                  <thead><tr><th>Uprawnienie</th><th>Aktywne dla roli</th></tr></thead>
                  <tbody>${rows || `<tr><td colspan="2" class="muted">Brak uprawnień.</td></tr>`}</tbody>
                </table>
              </section>`;
          }).join("");
          appEl.innerHTML = `
            <section class="card">
              <button class="btn-secondary" onclick="renderHome()">← Powrót</button>
              <div class="flex-between">
                <div>
                  <h2>Role i uprawnienia</h2>
                  <p class="muted">Administrator może teraz edytować uprawnienia przypisane do ról. Zmianę roli konkretnego użytkownika wykonasz w sekcji <strong>Użytkownicy</strong>.</p>
                </div>
                <button class="btn-secondary" onclick="exportPermissionsCsv()">Eksport CSV</button>
              </div>
            </section>
            <section class="card">
              <h3>Ważne zasady</h3>
              <ul class="compact-list">
                <li>Uprawnienia oznaczone jako <strong>zablokowane</strong> chronią system przed przypadkowym odcięciem dostępu.</li>
                <li>Operator dziedziczy uprawnienia użytkownika, a administrator dziedziczy uprawnienia operatora i użytkownika.</li>
                <li>Zmiany są egzekwowane po stronie backendu, nie tylko w menu aplikacji.</li>
                <li>Menu jest dynamiczne: odebranie uprawnienia ukrywa powiązany moduł, a ponowne nadanie przywraca go po odświeżeniu danych użytkownika.</li>
                <li>Odmowy dostępu są zapisywane w audycie jako <code>permission_denied</code>, razem z nazwą endpointu i wymaganym uprawnieniem.</li>
              </ul>
            </section>
            ${roleCards}
          `;
        }
    
        async function saveRolePermissions(roleKey) {
          const inputs = Array.from(document.querySelectorAll(`input[data-role-permission="${roleKey}"]`));
          const permissionCodes = inputs.filter(i => i.checked).map(i => i.value);
          const res = await api("/api/admin/permissions", {
            method: "POST",
            body: JSON.stringify({ role_key: roleKey, permission_codes: permissionCodes })
          });
          const data = res ? await res.json().catch(() => ({})) : {};
          if (!res || !res.ok) {
            const detail = data.detail ? `
    
    Szczegóły: ${data.detail}` : "";
            alert((data.error || "Nie udało się zapisać uprawnień roli.") + detail);
            return;
          }
          alert("Uprawnienia roli zostały zapisane.");
          await renderAdminPermissions();
        }
    
        async function exportPermissionsCsv() {
          // Eksport CSV macierzy ról korzysta z aktualnych uprawnień administratora.
          // Sam eksport jest wykonywany przez backend, żeby zawartość CSV była zgodna
          // z danymi zapisanymi w tabeli role_permissions.
          const me = await loadMe();
          if (!me || !canViewPermissions(me)) {
            alert("Brak dostępu do eksportu uprawnień.");
            return;
          }
          window.location.href = "/api/admin/permissions.csv";
        }
    
