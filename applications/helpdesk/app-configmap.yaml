                </div>
                ${{cards}}
              </div>
            `;
            modal.querySelectorAll(".workflow-template-use").forEach(btn => {{
              btn.addEventListener("click", () => applyWorkflowAutomationTemplate(btn.dataset.templateId));
            }});
            const closeBtn = modal.querySelector('[data-template-close="1"]');
            if (closeBtn) closeBtn.addEventListener("click", closeWorkflowAutomationRuleForm);
            modal.classList.remove("hidden");
          }} catch (err) {{
            console.error("workflow template picker error", err);
            alert("Nie udało się otworzyć listy szablonów reguł workflow: " + (err && err.message ? err.message : err));
          }}
        }}
        function applyWorkflowAutomationTemplate(templateId) {{
          const template = workflowAutomationRuleTemplates().find(t => t.id === templateId);
          if (!template) return;
          const rule = JSON.parse(JSON.stringify(template.rule));
          rule.id = null;
          rule.priority = ((workflowAutomationEditor.length + 1) * 10);
          openWorkflowAutomationRuleForm(null, rule);
        }}
        async function refreshWorkflowAutomationRulesFromApi(workflowId) {{
          if (!workflowId) return;
          const res = await api(`/api/admin/workflows/${{workflowId}}/automations`);
          if (!res || !res.ok) {{
            const data = res ? await res.json().catch(() => ({{}})) : {{}};
            alert(data.error || "Nie udało się pobrać reguł automatyzacji workflow.");
            return;
          }}
          const data = await res.json();
          workflowAutomationEditor = Array.isArray(data.automations) ? data.automations : [];
          if (workflowAutomationEditorWorkflow) workflowAutomationEditorWorkflow.automations = workflowAutomationEditor;
          renderWorkflowAutomationRules();
        }}
        let workflowAutomationEditingIndex = null;
        function workflowAutomationEmptyRule() {{
          return {{
            name: "Nowa reguła",
            event_type: "comment_added",
            condition_status: "",
            condition_to_status: "",
            condition_role: "*",
            condition_comment_visibility: "*",
            assigned_state: "*",
            condition_priority: "*",
            condition_category: "*",
            condition_subcategory: "*",
            condition_sla_state: "*",
            condition_status_operator: "eq",
            condition_to_status_operator: "eq",
            condition_role_operator: "eq",
            condition_comment_visibility_operator: "eq",
            assigned_state_operator: "eq",
            condition_priority_operator: "eq",
