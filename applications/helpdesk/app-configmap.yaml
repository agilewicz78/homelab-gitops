        """

    CSS = """
      :root {
        --bg: #0f172a;
        --card: #111827;
        --card2: #1f2937;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #facc15;
        --border: rgba(148,163,184,.25);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 35%),
          radial-gradient(circle at bottom right, rgba(34,197,94,.12), transparent 35%),
          var(--bg);
        color: var(--text);
      }
      a { color: inherit; }
      .page { width: min(1220px, 94vw); margin: 0 auto; padding: 42px 0; }
      header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
      h1 { margin: 0 0 8px; font-size: clamp(34px, 5vw, 56px); line-height: 1; letter-spacing: -.05em; }
      .subtitle { margin: 0; color: var(--muted); font-size: 18px; }
      .badge { border: 1px solid var(--border); border-radius: 999px; padding: 10px 14px; color: var(--muted); white-space: nowrap; background: rgba(15,23,42,.65); }
      .badge strong { color: var(--green); }
      .card { background: linear-gradient(180deg, rgba(17,24,39,.96), rgba(15,23,42,.96)); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,.25); margin-bottom: 18px; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
      .stat { border: 1px solid var(--border); background: rgba(31,41,55,.72); border-radius: 18px; padding: 16px; }
      .stat .num { font-size: 32px; font-weight: 800; }
      .stat .label { color: var(--muted); font-size: 14px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
      .pill { display: inline-block; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); color: var(--text); background: rgba(31,41,55,.72); }
      .priority-Krytyczny { color: #fecaca; border-color: rgba(239,68,68,.45); }
      .priority-Wysoki { color: #fde68a; border-color: rgba(250,204,21,.45); }
      .priority-Normalny { color: #bae6fd; border-color: rgba(56,189,248,.45); }
      .priority-Niski { color: #bbf7d0; border-color: rgba(34,197,94,.45); }
      input, textarea, select { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 15px; }
      textarea { min-height: 120px; resize: vertical; }
      label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      button, .btn { display: inline-block; margin-top: 14px; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; color: white; background: linear-gradient(135deg, #0284c7, #22c55e); cursor: pointer; text-decoration: none; }
      .btn-secondary { background: rgba(31,41,55,.9); border: 1px solid var(--border); }
      .status-filter-btn { margin-top: 0; color: var(--muted); transition: border-color .15s ease, background .15s ease, color .15s ease, transform .15s ease; }
      .status-filter-btn:hover { transform: translateY(-1px); border-color: rgba(56,189,248,.55); color: var(--text); }
      .status-filter-btn.active { color: white; background: linear-gradient(135deg, #0284c7, #22c55e); border-color: rgba(56,189,248,.65); box-shadow: 0 0 0 3px rgba(56,189,248,.14); }
      .status-filter-btn.active::before { content: "✓ "; }
      .ticket-title { font-weight: 800; text-decoration: none; color: var(--text); background: none; padding: 0; margin: 0; }
      .muted { color: var(--muted); }
      .comment { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: rgba(31,41,55,.65); margin-top: 10px; }
      .login-box { width: min(520px, 100%); margin: 0 auto; }
      .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }
      .error { color: #fecaca; }
      .hidden { display: none; }
      @media (max-width: 860px) { header, .topbar { flex-direction: column; } .grid { grid-template-columns: 1fr; } table { font-size: 14px; } }
    """

    SPA_HTML = f"""
    <!doctype html>
    <html lang="pl">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>INCoprp Helpdesk</title>
      <style>{CSS}</style>
    </head>
    <body>
      <main class="page">
        <header>
          <div>
            <h1>INCoprp Helpdesk</h1>
            <p class="subtitle">Centrum zgłoszeń IT dla pracowników biurowych.</p>
          </div>
          <div id="userBadge" class="badge">Ładowanie...</div>
        </header>
        <div id="app"></div>
      </main>

      <script>
        const appEl = document.getElementById("app");
        const userBadge = document.getElementById("userBadge");

        function getSid() {{ return sessionStorage.getItem("helpdesk_sid") || ""; }}
        function setSid(sid) {{ sessionStorage.setItem("helpdesk_sid", sid); }}
        function clearSid() {{ sessionStorage.removeItem("helpdesk_sid"); }}

        async function api(path, options = {{}}) {{
          const headers = options.headers || {{}};
          headers["X-Helpdesk-Session"] = getSid();
          if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
          const res = await fetch(path, {{ ...options, headers }});
          if (res.status === 401) {{
            clearSid();
            window.location.href = "/login";
            return null;
          }}
          return res;
        }}

        function esc(value) {{
          return String(value ?? "").replace(/[&<>"']/g, ch => ({{
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
          }}[ch]));
        }}

        function priorityClass(priority) {{ return "priority-" + String(priority || "").replaceAll(" ", "-"); }}

        async function loadMe() {{
          const res = await api("/api/me");
          if (!res) return null;
          const data = await res.json();
          userBadge.innerHTML = `Zalogowany: <strong>${{esc(data.name)}}</strong> · ${{esc(data.department)}} · <a href="#" onclick="logout();return false;">Wyloguj</a>`;
          return data;
        }}

        async function logout() {{
          await api("/api/logout", {{ method: "POST" }});
          clearSid();
          window.location.href = "/login";
        }}

        async function renderHome(statusFilter = sessionStorage.getItem("helpdesk_status_filter") || "") {{
          const me = await loadMe();
          if (!me) return;

          sessionStorage.setItem("helpdesk_status_filter", statusFilter);

          const query = statusFilter ? `?status=${{encodeURIComponent(statusFilter)}}` : "";
          const res = await api(`/api/tickets${{query}}`);
          if (!res) return;
          const data = await res.json();
          const scope = me.role === "admin" ? "Wszystkie zgłoszenia" : "Moje zgłoszenia";
          const filteredLabel = statusFilter ? ` · status: ${{statusFilter}}` : "";

          const statusButtons = [`<button class="btn-secondary status-filter-btn${{statusFilter === "" ? " active" : ""}}" onclick="renderHome('')">Wszystkie</button>`]
            .concat(data.statuses.map(s => `<button class="btn-secondary status-filter-btn${{s === statusFilter ? " active" : ""}}" onclick="renderHome('${{esc(s)}}')">${{esc(s)}}</button>`))
            .join(" ");

          const rows = data.tickets.length ? data.tickets.map(t => `
            <tr>
              <td>#${{t.id}}</td>
              <td><a class="ticket-title" href="#" onclick="renderTicket(${{t.id}});return false;">${{esc(t.title)}}</a></td>
              <td>${{esc(t.requester_name)}}<br><span class="muted">${{esc(t.department)}}</span></td>
              <td>${{esc(t.category)}}</td>
              <td><span class="pill ${{priorityClass(t.priority)}}">${{esc(t.priority)}}</span></td>
              <td><span class="pill">${{esc(t.status)}}</span></td>
              <td class="muted">${{esc(t.created_at)}}</td>
            </tr>`).join("") : `<tr><td colspan="7" class="muted">Brak zgłoszeń dla wybranego statusu.</td></tr>`;

          appEl.innerHTML = `
            <section class="stats">
              <div class="stat"><div class="num">${{data.stats.total}}</div><div class="label">${{scope}}</div></div>
              <div class="stat"><div class="num">${{data.stats.new}}</div><div class="label">Nowe</div></div>
              <div class="stat"><div class="num">${{data.stats.in_progress}}</div><div class="label">W trakcie</div></div>
              <div class="stat"><div class="num">${{data.stats.high}}</div><div class="label">Wysoki / Krytyczny</div></div>
              <div class="stat"><div class="num">${{data.stats.resolved}}</div><div class="label">Rozwiązane / Zamknięte</div></div>
            </section>
            <section class="card">
              <button onclick="renderNewTicket()">Nowe zgłoszenie</button>
              <div style="margin-top:16px">
                <strong>Filtr statusu:</strong>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${{statusButtons}}</div>
              </div>
            </section>
            <section class="card">
              <h2>${{scope}}${{filteredLabel}}</h2>
              <table>
                <thead><tr><th>ID</th><th>Tytuł</th><th>Zgłaszający</th><th>Kategoria</th><th>Priorytet</th><th>Status</th><th>Utworzono</th></tr></thead>
                <tbody>${{rows}}</tbody>
              </table>
            </section>`;
        }}

        async function renderNewTicket() {{
          const me = await loadMe();
          if (!me) return;
          const metaRes = await api("/api/meta");
          const meta = await metaRes.json();
          appEl.innerHTML = `
            <section class="card">
              <h2>Nowe zgłoszenie</h2>
              <form id="ticketForm">
                <label>Tytuł problemu</label>
                <input name="title" required placeholder="Np. Outlook nie odbiera poczty">
                <label>Opis</label>
                <textarea name="description" required placeholder="Opisz problem, komunikat błędu, od kiedy występuje..."></textarea>
                <div class="grid">
                  <div><label>Zgłaszający</label><input value="${{esc(me.name)}}" disabled></div>
                  <div><label>E-mail</label><input value="${{esc(me.email)}}" disabled></div>
                </div>
                <div class="grid">
                  <div><label>Dział</label><input value="${{esc(me.department)}}" disabled></div>
                  <div><label>Kategoria</label><select name="category">${{meta.categories.map(x => `<option>${{esc(x)}}</option>`).join("")}}</select></div>
                </div>
                <label>Priorytet</label>
                <select name="priority">${{meta.priorities.map(x => `<option ${{x === "Normalny" ? "selected" : ""}}>${{esc(x)}}</option>`).join("")}}</select>
                <button type="submit">Utwórz zgłoszenie</button>
                <button type="button" class="btn-secondary" onclick="renderHome()">Anuluj</button>
              </form>
            </section>`;
          document.getElementById("ticketForm").addEventListener("submit", createTicket);
        }}

        async function createTicket(event) {{
          event.preventDefault();
          const form = event.target;
          const payload = Object.fromEntries(new FormData(form).entries());
          const res = await api("/api/tickets", {{ method: "POST", body: JSON.stringify(payload) }});
          if (!res) return;
          if (!res.ok) {{ alert("Nie udało się utworzyć zgłoszenia."); return; }}
          await renderHome();
        }}

        async function renderTicket(id) {{
          const me = await loadMe();
          if (!me) return;
          const res = await api(`/api/tickets/${{id}}`);
          if (!res) return;
          if (!res.ok) {{ appEl.innerHTML = `<section class="card"><h2>Brak dostępu albo brak zgłoszenia</h2></section>`; return; }}
          const data = await res.json();
          const t = data.ticket;
          const comments = data.comments.map(c => `
            <div class="comment"><div class="muted">${{esc(c.author)}} · ${{esc(c.created_at)}}</div><div>${{esc(c.content)}}</div></div>
          `).join("") || `<p class="muted">Brak komentarzy.</p>`;

          const statusPanel = me.role === "admin" ? `
            <section class="card">
              <h3>Zmień status</h3>
              <form id="statusForm">
                <label>Status</label>
                <select name="status">${{data.meta.statuses.map(s => `<option ${{s === t.status ? "selected" : ""}}>${{esc(s)}}</option>`).join("")}}</select>
                <button type="submit">Zapisz status</button>
              </form>
            </section>` : "";

          appEl.innerHTML = `
            <section class="card">
              <button class="btn-secondary" onclick="renderHome()">← Powrót</button>
              <h2>#${{t.id}} · ${{esc(t.title)}}</h2>
              <p class="muted">Utworzono: ${{esc(t.created_at)}} · Aktualizacja: ${{esc(t.updated_at)}}</p>
              <p><strong>Status:</strong> <span class="pill">${{esc(t.status)}}</span></p>
              <p><strong>Priorytet:</strong> <span class="pill ${{priorityClass(t.priority)}}">${{esc(t.priority)}}</span></p>
              <p><strong>Kategoria:</strong> ${{esc(t.category)}}</p>
              <p><strong>Zgłaszający:</strong> ${{esc(t.requester_name)}} · ${{esc(t.requester_email)}}</p>
              <p><strong>Dział:</strong> ${{esc(t.department)}}</p>
              <h3>Opis</h3><p>${{esc(t.description)}}</p>
            </section>
            ${{statusPanel}}
            <section class="card">
              <h3>Komentarze</h3>
              ${{comments}}
              <form id="commentForm">
                <label>Komentarz</label>
