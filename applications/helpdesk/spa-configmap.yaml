              err.textContent = data.error || "Nie udało się zapisać workflow.";
              err.classList.remove("hidden");
              return;
            }
            msg.classList.remove("hidden");
            setTimeout(() => {
              if (editing) renderWorkflowManagement(workflow.id);
              else renderAdminWorkflows();
            }, 600);
          });
