            cur.execute("""
                SELECT author, content, created_at, COALESCE(visibility, 'public') AS visibility
                FROM comments
                WHERE ticket_id = %s
                  AND COALESCE(visibility, 'public') = 'public'
                ORDER BY id ASC
            """, (ticket_id,))
