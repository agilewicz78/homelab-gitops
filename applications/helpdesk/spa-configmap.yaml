      .module-actions button { margin-top: 0; padding: 8px 10px; font-size: 13px; }
      .module-actions .primary-action { background: linear-gradient(135deg, #0284c7, #22c55e); color: white; border-color: transparent; }
      .operator-cockpit-shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
      .operator-sidebar { position: sticky; top: 14px; display: grid; gap: 10px; border: 1px solid var(--border); border-radius: 22px; padding: 14px; background: rgba(15,23,42,.76); box-shadow: 0 18px 40px rgba(0,0,0,.20); }
      .operator-sidebar-title { padding: 7px 8px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
      .operator-sidebar button { width: 100%; margin-top: 0; text-align: left; justify-content: flex-start; border-radius: 13px; padding: 10px 12px; background: transparent; border: 1px solid transparent; color: var(--muted); }
      .operator-sidebar button:hover { color: var(--text); border-color: rgba(56,189,248,.38); background: rgba(31,41,55,.55); }
      .operator-sidebar button.active { color: #fff; background: linear-gradient(135deg, rgba(2,132,199,.88), rgba(34,197,94,.76)); border-color: transparent; box-shadow: 0 12px 24px rgba(0,0,0,.22); }
      .operator-sidebar .sidebar-primary { margin-top: 8px; color: #fff; background: rgba(2,132,199,.26); border-color: rgba(56,189,248,.42); }
      .operator-cockpit-main { display: grid; gap: 14px; min-width: 0; }
      .operator-hero { border: 1px solid rgba(56,189,248,.32); border-radius: 24px; padding: 20px; background: radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 32%), linear-gradient(135deg, rgba(15,23,42,.95), rgba(31,41,55,.70)); box-shadow: 0 22px 54px rgba(0,0,0,.26); }
      .operator-hero h2 { margin: 0; }
      .operator-hero p { margin: 8px 0 0; color: var(--muted); max-width: 760px; line-height: 1.5; }
      .operator-command-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
      .operator-command-row .quick-search { flex: 1 1 320px; margin-top: 0; background: rgba(15,23,42,.78); border-color: rgba(56,189,248,.28); }
      .operator-summary-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .operator-summary-strip .dashboard-card { padding: 14px; border-radius: 17px; }
      .operator-summary-strip .dashboard-card .num { font-size: 28px; }
      .operator-board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); gap: 14px; align-items: start; }
      .operator-queues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .operator-work-card { border: 1px solid var(--border); border-radius: 20px; padding: 14px; background: rgba(31,41,55,.54); min-width: 0; }
      .operator-work-card.priority { border-color: rgba(248,113,113,.44); background: rgba(127,29,29,.16); }
      .operator-work-card.waiting { border-color: rgba(250,204,21,.40); background: rgba(113,63,18,.14); }
      .operator-work-card h3 { margin: 0; }
      .operator-work-card .notification-list { max-height: 330px; }
      .operator-side-panel { display: grid; gap: 14px; }
      .operator-side-panel .card { margin: 0; }
      .dashboard-list { display: grid; gap: 9px; }
      .dashboard-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--border); background: rgba(31,41,55,.52); border-radius: 14px; padding: 11px 12px; cursor: pointer; }
      .dashboard-row:hover { border-color: rgba(56,189,248,.55); }
      .dashboard-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dashboard-row .count { font-weight: 900; color: var(--text); }
      .dashboard-bar { grid-column: 1 / -1; height: 7px; border-radius: 999px; background: rgba(148,163,184,.18); overflow: hidden; }
      .dashboard-bar span { display:block; height:100%; border-radius:999px; background: linear-gradient(135deg, #0284c7, #22c55e); }
      .sla-calendar-grid { display: grid; gap: 14px; }
      .sla-calendar-section { border: 1px solid var(--border); border-radius: 18px; background: rgba(31,41,55,.42); padding: 14px; }
      .sla-calendar-section h3 { margin: 0 0 10px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
      .sla-calendar-count { color: var(--muted); font-size: 13px; font-weight: 800; }
      .sla-calendar-list { display: grid; gap: 10px; }
      .sla-calendar-item { width: 100%; text-align: left; margin: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: rgba(15,23,42,.62); color: var(--text); cursor: pointer; }
      .sla-calendar-item:hover { border-color: rgba(56,189,248,.62); background: rgba(31,41,55,.88); }
      .sla-calendar-title { font-weight: 900; line-height: 1.35; }
      .sla-calendar-meta { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }
      .sla-calendar-empty { color: var(--muted); margin: 0; }
      .hidden { display: none; }
      @media (max-width: 1100px) {
        .page { padding: 30px 18px; }
      }
      @media (max-width: 980px) {
        .operator-cockpit-shell,
        .operator-board,
        .operator-queues,
        .ticket-layout,
        .resolution-time-grid { grid-template-columns: 1fr; }
