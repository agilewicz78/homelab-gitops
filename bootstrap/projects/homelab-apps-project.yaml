apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-apps
  namespace: argocd
spec:
  description: Homelab user applications

  sourceRepos:
    - https://github.com/agilewicz78/homelab-gitops.git

  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc
    - namespace: nginx-demo
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
