    @app.get("/api/knowledge-articles")
    @api_login_required
    def api_knowledge_articles(user):
        query = clean(request.args.get("q"))
        requested_status = clean(request.args.get("status"))
        requested_quality = clean(request.args.get("quality"))
        quality = requested_quality if requested_quality in ("needs_review", "unrated") else "all"
        clauses = []
        params = []
        if is_staff(user):
            if requested_status in KNOWLEDGE_STATUSES:
                clauses.append("ka.status = %s")
                params.append(requested_status)
            if quality == "needs_review":
                clauses.append("""
                    COALESCE(feedback.not_helpful_count, 0) > 0
                    AND COALESCE(feedback.not_helpful_count, 0)
                        >= COALESCE(feedback.helpful_count, 0)
                """)
            elif quality == "unrated":
                clauses.append("COALESCE(feedback.total_count, 0) = 0")
        else:
            clauses.append("ka.status = 'published'")
            quality = "all"
        if query:
            pattern = f"%{query}%"
            clauses.append("""
                (
                  ka.title ILIKE %s OR ka.problem ILIKE %s OR
                  ka.solution ILIKE %s OR ka.category ILIKE %s OR
                  ka.subcategory ILIKE %s
                )
            """)
            params.extend([pattern] * 5)
        where_sql = "WHERE " + " AND ".join(clauses) if clauses else ""
        conn = get_conn()
        cur = conn.cursor()
        cur.execute(f"""
            SELECT
              ka.id, ka.title, ka.problem, ka.solution,
              ka.category, ka.subcategory, ka.status,
              ka.source_ticket_id,
              COALESCE(ka.updated_by_name, ka.created_by_name, ''),
              ka.updated_at, ka.published_at,
              COALESCE(feedback.helpful_count, 0),
              COALESCE(feedback.not_helpful_count, 0),
              COALESCE(reasons.reason_counts, '')
            FROM knowledge_articles ka
            LEFT JOIN (
              SELECT
                article_id,
                COUNT(*) FILTER (WHERE helpful = TRUE) AS helpful_count,
                COUNT(*) FILTER (WHERE helpful = FALSE) AS not_helpful_count,
                COUNT(*) AS total_count
              FROM knowledge_article_feedback
              GROUP BY article_id
            ) feedback ON feedback.article_id = ka.id
            LEFT JOIN (
              SELECT
                article_id,
                string_agg(reason_code || '=' || reason_count, ',' ORDER BY reason_count DESC, reason_code) AS reason_counts
              FROM (
                SELECT article_id, reason_code, COUNT(*) AS reason_count
                FROM knowledge_article_feedback
                WHERE helpful = FALSE AND reason_code IS NOT NULL
                GROUP BY article_id, reason_code
              ) grouped_reasons
              GROUP BY article_id
            ) reasons ON reasons.article_id = ka.id
            {where_sql}
            ORDER BY
              CASE ka.status WHEN 'published' THEN 1 WHEN 'draft' THEN 2 ELSE 3 END,
              ka.updated_at DESC,
              ka.id DESC
            LIMIT 250
        """, tuple(params))
        articles = [{
            "id": row[0],
            "title": row[1],
            "problem": row[2],
            "solution": row[3],
            "category": row[4],
            "subcategory": row[5],
            "status": row[6],
            "source_ticket_id": row[7] if is_staff(user) else None,
            "updated_by_name": row[8],
            "updated_at": str(row[9]),
            "published_at": str(row[10]) if row[10] else "",
            "helpful_count": int(row[11] or 0),
            "not_helpful_count": int(row[12] or 0),
            "reason_counts": [{
                "code": item.split("=", 1)[0],
                "label": KNOWLEDGE_FEEDBACK_REASONS.get(item.split("=", 1)[0], item.split("=", 1)[0]),
                "count": int(item.split("=", 1)[1]),
            } for item in str(row[13] or "").split(",") if "=" in item] if is_staff(user) else [],
        } for row in cur.fetchall()]
        cur.close()
        conn.close()
        return jsonify({
            "articles": articles,
            "filter": {"q": query, "status": requested_status, "quality": quality},
            "meta": {
                "statuses": KNOWLEDGE_STATUSES,
                "quality_filters": ["needs_review", "unrated"],
                "feedback_reasons": [
                    {"code": code, "label": label}
                    for code, label in KNOWLEDGE_FEEDBACK_REASONS.items()
                ],
                "categories": CATEGORIES,
                "subcategories": SUBCATEGORIES,
            },
        })

