        async function deleteAdminWorkflow(workflowId, ticketCount = 0) {{
          const message = ticketCount > 0
            ? "Ten workflow jest używany przez zgłoszenia, więc zostanie dezaktywowany. Kontynuować?"
            : "Usunąć workflow? Tej operacji nie można cofnąć.";
          if (!confirm(message)) return;
          const res = await api(`/api/admin/workflows/${{workflowId}}`, {{ method: "DELETE" }});
          if (!res || !res.ok) {{
            const data = res ? await res.json().catch(() => ({{}})) : {{}};
            alert(data.error || "Nie udało się usunąć/dezaktywować workflow.");
            return;
          }}
          await renderAdminWorkflows();
        }}
