    def workflow_comment_event_type(user):
        return "staff_comment_added" if is_staff(user) else "user_comment_added"
    def workflow_actor_role(user):
        if is_admin(user):
            return "admin"
        if is_operator(user):
            return "operator"
        return "user"
    WORKFLOW_CONDITION_OPERATORS = {"eq", "neq", "contains", "not_contains", "empty", "not_empty"}
    WORKFLOW_CONDITION_OPERATOR_LABELS = {
        "eq": "równa się",
        "neq": "nie równa się",
        "contains": "zawiera",
        "not_contains": "nie zawiera",
        "empty": "jest puste",
        "not_empty": "nie jest puste",
    }
    def normalize_workflow_condition_operator(value):
        value = clean(value) or "eq"
        aliases = {
            "equals": "eq",
            "not_equals": "neq",
            "ne": "neq",
            "is_empty": "empty",
            "is_not_empty": "not_empty",
        }
        value = aliases.get(value, value)
        return value if value in WORKFLOW_CONDITION_OPERATORS else "eq"
    def workflow_condition_operator_label(operator):
        return WORKFLOW_CONDITION_OPERATOR_LABELS.get(normalize_workflow_condition_operator(operator), "równa się")

    # Porównuje wartość warunku workflow z użyciem operatora warunku.
    def workflow_condition_matches_value(condition_value, actual_value, operator="eq", wildcard_values=("", "*", "any")):
        """
        Porównuje warunek workflow z wartością rzeczywistą.

        Ważne: w konfiguracji workflow wartości:
        - pusty string "",
        - None zapisany w bazie,
        - "*",
        - "any"

        oznaczają "dowolna wartość". Dzięki temu formularz workflow,
        API zapisu reguły, symulator reguł i właściwy silnik workflow
        interpretują warunki w ten sam sposób.
        """
        operator = normalize_workflow_condition_operator(operator)
        condition_value = clean(condition_value)
        actual_value = clean(actual_value)
        if operator == "empty":
            return actual_value == ""
        if operator == "not_empty":
            return actual_value != ""
        if condition_value in wildcard_values:
            return True
        if operator == "eq":
            return condition_value == actual_value
        if operator == "neq":
            return condition_value != actual_value
        if operator == "contains":
            return condition_value.lower() in actual_value.lower()
        if operator == "not_contains":
            return condition_value.lower() not in actual_value.lower()
        return condition_value == actual_value

    # Sprawdza, czy reguła workflow pasuje do danego zdarzenia i kontekstu.
    def workflow_automation_match_result(item, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None, ticket_context=None):
        condition_status = item.get("condition_status")
        condition_status_operator = item.get("condition_status_operator") or "eq"
        if condition_status or normalize_workflow_condition_operator(condition_status_operator) in ("empty", "not_empty"):
            if not workflow_condition_matches_value(condition_status, current_status, condition_status_operator):
                return False, f"status źródłowy nie pasuje: warunek '{workflow_condition_operator_label(condition_status_operator)} {condition_status or ''}', otrzymano '{current_status or ''}'"

        condition_to_status = item.get("condition_to_status")
        condition_to_status_operator = item.get("condition_to_status_operator") or "eq"
        if condition_to_status or normalize_workflow_condition_operator(condition_to_status_operator) in ("empty", "not_empty"):
            if not workflow_condition_matches_value(condition_to_status, event_new_status or "", condition_to_status_operator):
                return False, f"status docelowy nie pasuje: warunek '{workflow_condition_operator_label(condition_to_status_operator)} {condition_to_status or ''}', otrzymano '{event_new_status or ''}'"

        condition_role = item.get("condition_role")
        actor_role = workflow_actor_role(user)
        condition_role_operator = item.get("condition_role_operator") or "eq"
        if condition_role and condition_role not in ("*", ""):
            allowed_roles = []
            if condition_role == "staff":
                allowed_roles = ["staff", "operator", "admin"]
            elif condition_role == "user":
                allowed_roles = ["user"]
            elif condition_role == "operator":
                allowed_roles = ["operator"]
            elif condition_role == "admin":
                allowed_roles = ["admin"]
            if condition_role_operator == "neq":
                if actor_role in allowed_roles:
                    return False, f"rola wykonawcy nie pasuje: warunek 'nie równa się {condition_role}', otrzymano {actor_role}"
            elif not workflow_condition_matches_value(condition_role, actor_role, condition_role_operator):
                if condition_role == "staff" and is_staff(user):
                    pass
                else:
                    return False, f"rola wykonawcy nie pasuje: warunek '{workflow_condition_operator_label(condition_role_operator)} {condition_role}', otrzymano {actor_role}"

        condition_visibility = item.get("condition_comment_visibility")
        condition_visibility_operator = item.get("condition_comment_visibility_operator") or "eq"
        if condition_visibility and condition_visibility not in ("*", ""):
            if not workflow_condition_matches_value(condition_visibility, visibility or "", condition_visibility_operator):
                return False, f"typ komentarza nie pasuje: warunek '{workflow_condition_operator_label(condition_visibility_operator)} {condition_visibility}', otrzymano '{visibility or ''}'"

        assigned_state = item.get("assigned_state") or "*"
        assigned_state_operator = item.get("assigned_state_operator") or "eq"
        has_assignee = bool(assigned_to_email)
        actual_assigned_state = "assigned" if has_assignee else "unassigned"
        if assigned_state and assigned_state not in ("*", "any", ""):
            if not workflow_condition_matches_value(assigned_state, actual_assigned_state, assigned_state_operator):
                return False, f"przypisanie zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(assigned_state_operator)} {assigned_state}', otrzymano '{actual_assigned_state}'"

        ticket_context = ticket_context or {}
        condition_priority = item.get("condition_priority") or "*"
        condition_priority_operator = item.get("condition_priority_operator") or "eq"
        if condition_priority and condition_priority not in ("*", "any", ""):
            ticket_priority = ticket_context.get("priority") or ""
            if not workflow_condition_matches_value(condition_priority, ticket_priority, condition_priority_operator):
                return False, f"priorytet zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_priority_operator)} {condition_priority}', otrzymano '{ticket_priority or ''}'"

        condition_category = item.get("condition_category") or "*"
        condition_category_operator = item.get("condition_category_operator") or "eq"
        if condition_category and condition_category not in ("*", "any", ""):
            ticket_category = ticket_context.get("category") or ""
            if not workflow_condition_matches_value(condition_category, ticket_category, condition_category_operator):
                return False, f"kategoria zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_category_operator)} {condition_category}', otrzymano '{ticket_category or ''}'"

        condition_subcategory = item.get("condition_subcategory") or "*"
        condition_subcategory_operator = item.get("condition_subcategory_operator") or "eq"
        if condition_subcategory and condition_subcategory not in ("*", "any", ""):
            ticket_subcategory = ticket_context.get("subcategory") or ""
            if not workflow_condition_matches_value(condition_subcategory, ticket_subcategory, condition_subcategory_operator):
                return False, f"podkategoria zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_subcategory_operator)} {condition_subcategory}', otrzymano '{ticket_subcategory or ''}'"

        condition_sla_state = item.get("condition_sla_state") or "*"
        condition_sla_state_operator = item.get("condition_sla_state_operator") or "eq"
        if condition_sla_state and condition_sla_state not in ("*", "any", ""):
            ticket_sla_state = ticket_context.get("sla_state") or ""
            if not workflow_condition_matches_value(condition_sla_state, ticket_sla_state, condition_sla_state_operator):
                return False, f"SLA zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_sla_state_operator)} {condition_sla_state}', otrzymano '{ticket_sla_state or ''}'"
        return True, "reguła spełnia warunki"
    def workflow_automation_matches(item, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None, ticket_context=None):
        matched, _reason = workflow_automation_match_result(item, current_status, user, visibility, assigned_to_email, event_new_status, ticket_context=ticket_context)
        return matched
    WORKFLOW_EVENT_LABELS = {
        "ticket_created": "utworzono zgłoszenie",
        "comment_added": "dodano komentarz lub notatkę",
        "user_comment_added": "użytkownik dodał komentarz",
        "staff_comment_added": "operator lub admin dodał komentarz",
        "attachment_added": "dodano załącznik",
        "status_changed": "zmieniono status",
        "ticket_assigned": "przypisano zgłoszenie",
    }
    WORKFLOW_ACTION_LABELS = {
        "change_status": "zmień status",
        "change_priority": "zmień priorytet",
        "add_workflow_watchers": "dodaj operatorów workflow jako obserwatorów",
        "add_system_comment": "dodaj komentarz systemowy",
        "notify": "wyślij powiadomienie",
        "add_history": "dodaj wpis do historii",
        "require_comment": "wymagaj komentarza",
        "require_attachment": "wymagaj załącznika",
    }
    def workflow_wildcard_value(value):
        return clean(value) in ("", "*", "any")
    def workflow_event_label(event_type):
        return WORKFLOW_EVENT_LABELS.get(event_type or "", event_type or "zdarzenie")
    def workflow_action_label(action_type):
        return WORKFLOW_ACTION_LABELS.get(action_type or "change_status", action_type or "akcja")
    def workflow_condition_text(label, operator, value, any_text):
        operator = normalize_workflow_condition_operator(operator)
        value = clean(value)
        if operator == "empty":
            return f"{label}: jest puste"
        if operator == "not_empty":
            return f"{label}: nie jest puste"
        if workflow_wildcard_value(value):
            return f"{label}: {any_text}"
        return f"{label}: {workflow_condition_operator_label(operator)} {value}"
    def workflow_automation_action_summary(action):
        action_type = action.get("action_type") or "change_status"
        value = clean(action.get("action_value") or action.get("action_status"))
        if action_type == "change_status":
            return f"zmieni status na „{value or '—'}”"
        if action_type == "change_priority":
            return f"zmieni priorytet na „{value or '—'}”"
        if action_type == "add_system_comment":
            return f"doda komentarz systemowy: „{value or 'Reguła workflow została wykonana.'}”"
        return workflow_action_label(action_type)
    def workflow_automation_action_summaries(item):
        actions = item.get("actions") or [{
            "action_type": item.get("action_type") or "change_status",
            "action_value": item.get("action_status"),
            "is_active": True,
            "action_order": 1,
        }]
        active_actions = [a for a in actions if a.get("is_active") is not False]
        active_actions.sort(key=lambda a: int(a.get("action_order") or 1))
        return [workflow_automation_action_summary(a) for a in active_actions]
    def workflow_automation_condition_summary(item, workflow_category="*", workflow_subcategory="*"):
        event_type = item.get("event_type") or "comment_added"
        parts = [
            f"Zdarzenie: {workflow_event_label(event_type)}",
            workflow_condition_text("Status bieżący", item.get("condition_status_operator"), item.get("condition_status"), "dowolny"),
        ]
        if event_type == "status_changed" or not workflow_wildcard_value(item.get("condition_to_status")):
            parts.append(workflow_condition_text("Status docelowy", item.get("condition_to_status_operator"), item.get("condition_to_status"), "dowolny"))
        parts.append(workflow_condition_text("Rola wykonawcy", item.get("condition_role_operator"), item.get("condition_role"), "dowolna"))
        if event_type in ("comment_added", "user_comment_added", "staff_comment_added"):
            parts.append(workflow_condition_text("Typ komentarza", item.get("condition_comment_visibility_operator"), item.get("condition_comment_visibility"), "dowolny"))
        parts.append(workflow_condition_text("Przypisanie", item.get("assigned_state_operator"), item.get("assigned_state"), "dowolne"))
        parts.append(workflow_condition_text("Priorytet", item.get("condition_priority_operator"), item.get("condition_priority"), "dowolny"))
        if workflow_category and workflow_category != "*" and workflow_wildcard_value(item.get("condition_category")):
            parts.append(f"Kategoria: {workflow_category} (z workflow)")
        else:
            parts.append(workflow_condition_text("Kategoria", item.get("condition_category_operator"), item.get("condition_category"), "dowolna"))
        if workflow_subcategory and workflow_subcategory != "*" and workflow_wildcard_value(item.get("condition_subcategory")):
            parts.append(f"Podkategoria: {workflow_subcategory} (z workflow)")
        else:
            parts.append(workflow_condition_text("Podkategoria", item.get("condition_subcategory_operator"), item.get("condition_subcategory"), "dowolna"))
        parts.append(workflow_condition_text("SLA", item.get("condition_sla_state_operator"), item.get("condition_sla_state"), "dowolne"))
        return "; ".join(parts)
    def workflow_rule_is_broad(item, workflow_category="*", workflow_subcategory="*"):
        fields = [
            "condition_status", "condition_to_status", "condition_role",
            "condition_comment_visibility", "assigned_state",
            "condition_priority", "condition_sla_state",
        ]
        broad = all(workflow_wildcard_value(item.get(field)) for field in fields)
        category_broad = workflow_category == "*" and workflow_wildcard_value(item.get("condition_category"))
        subcategory_broad = workflow_subcategory == "*" and workflow_wildcard_value(item.get("condition_subcategory"))
        return broad and category_broad and subcategory_broad
    def workflow_automation_risk(item, workflow_category="*", workflow_subcategory="*"):
        if item.get("is_active") is False:
            return {"level": "low", "reasons": ["Reguła jest nieaktywna, więc nie wpływa na zgłoszenia."]}
        actions = [a for a in (item.get("actions") or []) if a.get("is_active") is not False]
        action_types = {a.get("action_type") or "change_status" for a in actions}
        reasons = []
        level = "low"
        if workflow_rule_is_broad(item, workflow_category, workflow_subcategory) and action_types.intersection({"change_status", "change_priority"}):
            level = "high"
            reasons.append("Reguła ma bardzo szeroki zakres i zmienia status lub priorytet.")
        elif action_types.intersection({"change_status", "change_priority"}):
            level = "medium"
            reasons.append("Reguła modyfikuje status lub priorytet zgłoszenia.")
        if item.get("stop_processing") is not False and actions:
            if level == "low":
                level = "medium"
            reasons.append("Po wykonaniu zatrzymuje kolejne pasujące reguły.")
        if action_types.intersection({"require_comment", "require_attachment"}):
            if level == "low":
                reasons.append("Reguła waliduje pracę operatora i może zablokować przejście.")
            else:
                reasons.append("Zawiera wymaganie komentarza lub załącznika.")
        if not reasons:
            reasons.append("Nie wykryto typowych ryzyk; reguła wykonuje akcje pomocnicze albo ma wąski zakres.")
        return {"level": level, "reasons": reasons}
    def workflow_simulation_user(actor_role):
        actor_role = clean(actor_role) or "user"
        if actor_role == "admin":
            roles = ["user", "admin"]
        elif actor_role in ("operator", "staff"):
            roles = ["user", "operator"]
        else:
            roles = ["user"]
            actor_role = "user"
        return {
            "email": f"{actor_role}@simulation.local",
            "name": f"Symulacja {actor_role}",
            "roles": roles,
            "role": role_label(roles),
        }
    def workflow_rule_event_matches(item, event_type, user):
        event_type = clean(event_type) or "comment_added"
        event_aliases = [event_type]
        if event_type == "comment_added":
            event_aliases.append(workflow_comment_event_type(user))
        if event_type in ("user_comment_added", "staff_comment_added"):
            event_aliases.append("comment_added")
        return item.get("event_type") in event_aliases
    def workflow_automation_actions_preview(item, matched, current_status, event_new_status, steps, sample):
        actions = [a for a in (item.get("actions") or [])]
        actions.sort(key=lambda a: int(a.get("action_order") or 1))
        missing_requirements = []
        if matched:
            if any(a.get("is_active") is not False and a.get("action_type") == "require_comment" for a in actions) and not sample.get("operator_added_comment"):
                missing_requirements.append("comment")
            if any(a.get("is_active") is not False and a.get("action_type") == "require_attachment" for a in actions) and not sample.get("operator_added_attachment"):
                missing_requirements.append("attachment")
        blocked = bool(missing_requirements)
        effective_status = event_new_status or current_status
        previews = []
        for action in actions:
            action_type = action.get("action_type") or "change_status"
            value = clean(action.get("action_value"))
            preview = {
                "action_type": action_type,
                "action_value": value,
                "would_execute": bool(matched and action.get("is_active") is not False and not blocked),
                "would_block_operation": False,
                "result": "nie zostanie wykonana, bo reguła nie pasuje" if not matched else "wykona się",
            }
            if action.get("is_active") is False:
                preview["would_execute"] = False
                preview["result"] = "pominięta — akcja nieaktywna"
            elif action_type == "require_comment":
                if not matched:
                    preview["result"] = "nie zostanie sprawdzona, bo reguła nie pasuje"
                elif sample.get("operator_added_comment"):
                    preview["result"] = "spełniona — operator dodał komentarz"
                else:
                    preview["would_execute"] = False
                    preview["would_block_operation"] = True
                    preview["result"] = "zablokowałaby operację — brakuje komentarza"
            elif action_type == "require_attachment":
                if not matched:
                    preview["result"] = "nie zostanie sprawdzona, bo reguła nie pasuje"
                elif sample.get("operator_added_attachment"):
                    preview["result"] = "spełniona — operator dodał załącznik"
                else:
                    preview["would_execute"] = False
                    preview["would_block_operation"] = True
                    preview["result"] = "zablokowałaby operację — brakuje załącznika"
            elif blocked:
                preview["would_execute"] = False
                preview["result"] = "nie wykona się, bo wcześniejsza walidacja blokuje operację"
            elif action_type == "change_status":
                if not value:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — brak statusu docelowego"
                elif steps and value not in steps:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — status nie istnieje w workflow"
                elif value == effective_status:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — status już ma tę wartość"
                elif matched:
                    preview["result"] = f"zmieniłaby status z „{effective_status}” na „{value}”"
                    effective_status = value
            elif action_type == "change_priority" and matched:
                preview["result"] = f"zmieniłaby priorytet zgłoszenia na „{value or '—'}”"
            elif action_type == "add_workflow_watchers" and matched:
                preview["result"] = "dodałaby operatorów workflow jako obserwatorów"
            elif action_type == "add_system_comment" and matched:
                preview["result"] = f"dodałaby komentarz systemowy: „{value or 'Reguła workflow została wykonana.'}”"
            elif action_type == "notify" and matched:
                preview["result"] = "wysłałaby powiadomienie"
            elif action_type == "add_history" and matched:
                preview["result"] = "dodałaby wpis do historii zgłoszenia"
            previews.append(preview)
        return previews, missing_requirements, effective_status
    def workflow_automation_candidates_for_event(cur, workflow_key, event_type, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None):
        workflow_id = workflow_id_by_key(cur, workflow_key)
        if not workflow_id:
            return []
        event_types = [event_type]
        if event_type == "comment_added":
            event_types.append(workflow_comment_event_type(user))
        cur.execute("""
            SELECT id, name, event_type, condition_status, condition_to_status, condition_role,
                   condition_comment_visibility, COALESCE(assigned_state, '*'), action_type,
                   action_status, is_active, COALESCE(stop_processing, TRUE), COALESCE(priority, 100),
                   COALESCE(condition_priority, '*'), COALESCE(condition_category, '*'),
                   COALESCE(condition_subcategory, '*'), COALESCE(condition_sla_state, '*'),
                   COALESCE(condition_status_operator, 'eq'), COALESCE(condition_to_status_operator, 'eq'),
                   COALESCE(condition_role_operator, 'eq'), COALESCE(condition_comment_visibility_operator, 'eq'),
                   COALESCE(assigned_state_operator, 'eq'), COALESCE(condition_priority_operator, 'eq'),
                   COALESCE(condition_category_operator, 'eq'), COALESCE(condition_subcategory_operator, 'eq'),
                   COALESCE(condition_sla_state_operator, 'eq')
            FROM workflow_automations
            WHERE workflow_id = %s
              AND event_type = ANY(%s)
              AND is_active = TRUE
            ORDER BY COALESCE(priority, 100) ASC, id ASC
        """, (workflow_id, event_types))
        result = []
        for r in cur.fetchall():
            actions = workflow_automation_action_entries(cur, r[0])
            if not actions:
                actions = [{
                    "action_type": r[8] or "change_status",
                    "action_value": r[9],
                    "is_active": True,
                    "action_order": 1,
                }]
            result.append({
                "id": r[0],
                "workflow_id": workflow_id,
                "workflow_key": workflow_key,
                "name": r[1] or "Reguła workflow",
                "event_type": r[2],
                "condition_status": r[3],
                "condition_to_status": r[4],
                "condition_role": r[5],
                "condition_comment_visibility": r[6],
                "assigned_state": r[7] or "*",
                "action_type": r[8],
                "action_status": r[9],
                "actions": actions,
                "is_active": bool(r[10]),
                "stop_processing": bool(r[11]),
                "priority": int(r[12] or 100),
                "condition_priority": r[13] or "*",
                "condition_category": r[14] or "*",
                "condition_subcategory": r[15] or "*",
                "condition_sla_state": r[16] or "*",
                "condition_status_operator": r[17] or "eq",
                "condition_to_status_operator": r[18] or "eq",
                "condition_role_operator": r[19] or "eq",
                "condition_comment_visibility_operator": r[20] or "eq",
                "assigned_state_operator": r[21] or "eq",
                "condition_priority_operator": r[22] or "eq",
                "condition_category_operator": r[23] or "eq",
                "condition_subcategory_operator": r[24] or "eq",
                "condition_sla_state_operator": r[25] or "eq",
            })
        return result

    # Zwraca reguły workflow pasujące do konkretnego zdarzenia.
    def workflow_automations_for_event(cur, workflow_key, event_type, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None, ticket_context=None):
        result = []
        for item in workflow_automation_candidates_for_event(cur, workflow_key, event_type, current_status, user, visibility, assigned_to_email, event_new_status):
            if workflow_automation_matches(item, current_status, user, visibility, assigned_to_email, event_new_status, ticket_context=ticket_context):
                result.append(item)
        return result
    def workflow_automation_for_comment(cur, workflow_key, current_status, user, visibility):
        rules = workflow_automations_for_event(cur, workflow_key, "comment_added", current_status, user, visibility)
        return rules[0] if rules else None
    def workflow_initial_status(cur, workflow_key):
        statuses = workflow_statuses(workflow_key)
        workflow_id = workflow_id_by_key(cur, workflow_key)
        if workflow_id:
            cur.execute("""
                SELECT COALESCE(waa.action_value, wa.action_status)
                FROM workflow_automations wa
                LEFT JOIN workflow_automation_actions waa
                  ON waa.automation_id = wa.id
                 AND waa.action_type = 'change_status'
                 AND COALESCE(waa.is_active, TRUE) = TRUE
                WHERE wa.workflow_id = %s
                  AND wa.event_type = 'ticket_created'
                  AND COALESCE(wa.is_active, TRUE) = TRUE
                  AND COALESCE(waa.action_value, wa.action_status) IS NOT NULL
                ORDER BY COALESCE(wa.priority, 100) ASC, COALESCE(waa.action_order, 1) ASC, wa.id ASC
                LIMIT 1
            """, (workflow_id,))
            row = cur.fetchone()
            if row and row[0] in statuses:
                return row[0]
        return "Nowe" if "Nowe" in statuses else (statuses[0] if statuses else "Nowe")
    def normalize_workflow_operator_emails(payload):
        raw = payload.get("operator_emails") or payload.get("operators") or []
        if isinstance(raw, str):
            raw = [x.strip() for x in raw.replace(";", ",").split(",")]
        result = []
        seen = set()
        for email in raw:
            email = clean(email).lower()
            if email and email not in seen:
                seen.add(email)
                result.append(email)
        return result
    def validate_workflow_operator_emails(cur, emails):
        if not emails:
            return []
        cur.execute("""
            SELECT lower(email), email
            FROM users
            WHERE lower(email) = ANY(%s)
              AND roles IS NOT NULL
              AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))
        """, (emails,))
        valid = {r[0]: r[1] for r in cur.fetchall()}
        missing = [email for email in emails if email not in valid]
        if missing:
            raise ValueError("Nieprawidłowi operatorzy workflow: " + ", ".join(missing))
        return [valid[email] for email in emails]
    def replace_workflow_operators(cur, workflow_id, operator_emails):
        cur.execute("DELETE FROM workflow_operators WHERE workflow_id = %s", (workflow_id,))
        for email in operator_emails:
            cur.execute("""
                INSERT INTO workflow_operators (workflow_id, user_email)
                VALUES (%s, %s)
                ON CONFLICT (workflow_id, user_email) DO NOTHING
            """, (workflow_id, email))

    # Dodaje operatorów workflow jako obserwatorów zgłoszenia.
    def add_workflow_watchers_to_ticket(cur, ticket_id, workflow_key):
        operator_emails = workflow_operator_emails_by_key(cur, workflow_key)
        added = []
        for email in operator_emails:
            add_ticket_watcher(cur, ticket_id, email, None)
            added.append(email)
        if added:
            add_ticket_event(
                cur,
                ticket_id,
                None,
                "workflow_watchers_added",
                "System dodał operatorów workflow jako obserwatorów: " + ", ".join(added),
            )
            cur.execute("""
                SELECT title, workflow_name
                FROM tickets
                WHERE id = %s
            """, (ticket_id,))
            ticket_row = cur.fetchone()
            ticket_title = ticket_row[0] if ticket_row and ticket_row[0] else f"#{ticket_id}"
            workflow_name = ticket_row[1] if ticket_row and ticket_row[1] else "workflow"
            create_notifications(
                cur,
                added,
                ticket_id,
                "workflow_watcher_added",
                f'Dodano Cię jako obserwatora zgłoszenia #{ticket_id}: {ticket_title} (workflow: {workflow_name})',
                actor_email=None,
            )
        return added
    def ticket_notification_recipients(cur, ticket_id, event_type):
        """Return notification recipients according to the helpdesk workflow.
        Workflow:
        - new ticket -> all operators and admins,
        - internal note -> all operators/admins plus staff watchers,
        - assigned ticket -> requester, assigned operator and watchers,
        - unassigned ticket -> requester, watchers plus all operators/admins.
        """
        recipients = set()
        requester_email, assigned_to_email = ticket_notification_participants(cur, ticket_id)
        if event_type == "ticket_created":
            recipients.update(staff_notification_recipients(cur))
            return recipients
        if event_type == "internal_note_added":
            recipients.update(staff_notification_recipients(cur))
            recipients.update(ticket_watcher_emails(cur, ticket_id, staff_only=True))
            return recipients
        recipients.update(ticket_watcher_emails(cur, ticket_id))
        if assigned_to_email:
            if requester_email:
                recipients.add(requester_email)
            recipients.add(assigned_to_email)
            return recipients
        if requester_email:
            recipients.add(requester_email)
        recipients.update(staff_notification_recipients(cur))
        return recipients

    # Tworzy powiadomienia aplikacyjne dla wskazanych odbiorców.
    def create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=None):
        for email in sorted({email for email in recipients if email}):
            if actor_email and email == actor_email:
                continue
            cur.execute("""
                INSERT INTO notifications (user_email, ticket_id, type, message)
                VALUES (%s, %s, %s, %s)
            """, (email, ticket_id, event_type, message))

    # Tworzy powiadomienia powiązane ze zgłoszeniem.
    def create_ticket_notifications(cur, ticket_id, event_type, message, actor_email=None, staff_only=False):
        recipients = ticket_notification_recipients(cur, ticket_id, event_type)
        create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=actor_email)

    # Dekorator ograniczający endpoint do administratorów.
    def api_admin_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not has_permission(user, "system.admin"):
                return api_forbidden("Wymagane uprawnienia administratora.", "system.admin")
            return fn(user, *args, **kwargs)
        return wrapper

    # Dekorator ograniczający endpoint do operatorów i administratorów.
    def api_staff_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not has_permission(user, "tickets.work"):
                return api_forbidden("Wymagane uprawnienia operatora albo administratora.", "tickets.work")
            return fn(user, *args, **kwargs)
        return wrapper
