        async function exportWorkflowRuleExecutionsCsv(workflowId = "") {
          try {
            const filters = workflowRuleExecutionFilterValues(workflowId);
            const params = new URLSearchParams();
            if (filters.workflow_id) params.set("workflow_id", String(filters.workflow_id));
            if (filters.q) params.set("q", filters.q);
            if (filters.ticket_id) params.set("ticket_id", String(filters.ticket_id).replace(/^#/, ""));
            if (filters.event_type && filters.event_type !== "all") params.set("event_type", filters.event_type);
            if (filters.matched && filters.matched !== "all") params.set("matched", filters.matched);
            if (filters.actor) params.set("actor", filters.actor);
            if (filters.date_from) params.set("date_from", filters.date_from);
            if (filters.date_to) params.set("date_to", filters.date_to);
            const res = await fetch(`/api/admin/workflow-rule-executions.csv?${params.toString()}`, { headers: { "X-Helpdesk-Session": getSid() } });
            if (res.status === 401) { clearSid(); window.location.href = "/login"; return; }
            if (!res.ok) {
              let msg = "Nie udało się wyeksportować logu.";
              try { const data = await res.json(); msg = data.error || data.details || msg; } catch (e) {}
              alert(msg);
              return;
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const stamp = new Date().toISOString().slice(0,19).replace(/[-:T]/g, "");
            a.href = url;
            a.download = `helpdesk-log-workflow-${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          } catch (err) {
            alert("Nie udało się wyeksportować logu: " + (err && err.message ? err.message : String(err)));
          }
        }
        function workflowRuleExecutionFilterValues(workflowId = "") {
