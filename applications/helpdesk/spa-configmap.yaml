        function workflowChangeHistoryAutomationContext(details, action = "") {
          if (!String(action || "").startsWith("workflow_automation_")) return "";
          const source = details || {};
          const before = source.before && typeof source.before === "object" ? source.before : {};
          const after = source.after && typeof source.after === "object" ? source.after : {};
          const automation = source.automation && typeof source.automation === "object" ? source.automation : {};
          const ruleName = source.automation_name || after.name || before.name || automation.name || "Reguła workflow";
          const ruleId = source.automation_id || after.id || before.id || automation.id || "";
          const eventType = after.event_type || before.event_type || automation.event_type || "";
          const previousName = before.name && after.name && before.name !== after.name ? before.name : "";
          const meta = [
            ruleId ? `ID reguły: ${esc(ruleId)}` : "",
            eventType ? `Zdarzenie: ${esc(workflowAutomationRuleEventLabel(eventType))}` : "",
