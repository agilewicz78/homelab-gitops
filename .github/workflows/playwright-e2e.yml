name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Helpdesk URL reachable from the homelab runner
        required: true
        default: https://helpdesk.lab.local
        type: string
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

jobs:
  e2e:
    runs-on:
      - self-hosted
      - linux
      - homelab
    timeout-minutes: 20
    env:
      HELPDESK_URL: ${{ inputs.base_url || 'https://helpdesk.lab.local' }}
      HELPDESK_IGNORE_TLS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
