    @app.post("/api/admin/sla-policies")
    @api_login_required
    @api_admin_required
    def api_admin_update_sla_policies(user):
        payload = request.get_json(silent=True) or {}
        policies = payload.get("policies") or []
        conn = get_conn()
        cur = conn.cursor()
        updated = []
        for item in policies:
            priority = clean(item.get("priority"))
            if priority not in PRIORITIES:
                continue
            try:
                first_response_hours = max(1, min(int(item.get("first_response_hours") or 1), 24 * 30))
                resolution_hours = max(first_response_hours, min(int(item.get("resolution_hours") or first_response_hours), 24 * 365))
                warning_hours = max(1, min(int(item.get("warning_hours") or 4), resolution_hours))
            except Exception:
                cur.close()
                conn.close()
                return jsonify({"error": f"Nieprawidłowa wartość SLA dla priorytetu {priority}."}), 400
            cur.execute("""
                INSERT INTO sla_policies (priority, first_response_hours, resolution_hours, warning_hours, is_active, updated_at)
                VALUES (%s, %s, %s, %s, TRUE, NOW())
                ON CONFLICT (priority) DO UPDATE SET
                    first_response_hours = EXCLUDED.first_response_hours,
                    resolution_hours = EXCLUDED.resolution_hours,
                    warning_hours = EXCLUDED.warning_hours,
                    is_active = TRUE,
                    updated_at = NOW()
            """, (priority, first_response_hours, resolution_hours, warning_hours))
            updated.append(priority)
        log_audit(cur, user, "sla_policies_updated", "sla_policies", None, {"priorities": updated})
        conn.commit()
        cur.close()
        conn.close()
        publish_event("Zaktualizowano polityki SLA", "sla_policies_updated", None, staff_only=True)
        return jsonify({"status": "ok", "updated": updated})
    @app.post("/api/sla/check")
    @api_login_required
    @api_staff_required

    # Ręczne sprawdzenie SLA i utworzenie powiadomień.
    def api_sla_check(user):
        """Ręczne sprawdzenie SLA i wygenerowanie powiadomień dla operatorów.
        Docelowo ten endpoint można wywoływać cyklicznie z CronJob w Kubernetes.
        """
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT
              t.id,
              t.title,
              t.priority,
              t.status,
              t.first_response_due_at,
              t.first_response_at,
              t.sla_due_at,
              t.first_response_warning_notified_at,
              t.first_response_overdue_notified_at,
              t.sla_warning_notified_at,
              t.sla_overdue_notified_at
            FROM tickets t
            WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')
              AND (t.first_response_due_at IS NOT NULL OR t.sla_due_at IS NOT NULL)
            ORDER BY COALESCE(t.sla_due_at, t.first_response_due_at) ASC, t.id ASC
        """)
        rows = cur.fetchall()
        now = datetime.now()
        counters = {
            "first_response_warning": 0,
            "first_response_overdue": 0,
            "resolution_warning": 0,
            "resolution_overdue": 0,
        }
        for row in rows:
            ticket_id, title, priority, status, first_due, first_at, resolution_due, first_warn_sent, first_over_sent, resolution_warn_sent, resolution_over_sent = row
            policy = sla_policy_for_priority(cur, priority)
            warning_delta = timedelta(hours=policy["warning_hours"])
            recipients = ticket_notification_recipients(cur, ticket_id, "sla")
            if first_due and not first_at:
                if first_due < now and not first_over_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_first_response_overdue", f"SLA reakcji przekroczone dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_first_response_overdue", "Przekroczono SLA pierwszej reakcji.")
                    cur.execute("UPDATE tickets SET first_response_overdue_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["first_response_overdue"] += 1
                elif first_due - now <= warning_delta and not first_warn_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_first_response_warning", f"Zbliża się SLA reakcji dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_first_response_warning", "Zbliża się termin SLA pierwszej reakcji.")
                    cur.execute("UPDATE tickets SET first_response_warning_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["first_response_warning"] += 1
            if resolution_due:
                if resolution_due < now and not resolution_over_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_resolution_overdue", f"SLA rozwiązania przekroczone dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_resolution_overdue", "Przekroczono SLA rozwiązania zgłoszenia.")
                    cur.execute("UPDATE tickets SET sla_overdue_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["resolution_overdue"] += 1
                elif resolution_due - now <= warning_delta and not resolution_warn_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_resolution_warning", f"Zbliża się SLA rozwiązania dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_resolution_warning", "Zbliża się termin SLA rozwiązania zgłoszenia.")
                    cur.execute("UPDATE tickets SET sla_warning_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["resolution_warning"] += 1
        log_audit(cur, user, "sla_check_run", "sla", None, counters)
        conn.commit()
        cur.close()
        conn.close()
        publish_event("Sprawdzono SLA zgłoszeń", "sla_check_run", None, staff_only=True)
        return jsonify({"status": "ok", "notifications": counters})
    @app.post("/api/tickets")
