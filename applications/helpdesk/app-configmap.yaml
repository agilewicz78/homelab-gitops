                    <div><label>Status</label><select name="status">${{(data.meta?.statuses || []).map(s => `<option value="${{esc(s)}}" ${{s === i.status ? "selected" : ""}}>${{esc(incidentStatusLabel(s))}}</option>`).join("")}}</select></div>
