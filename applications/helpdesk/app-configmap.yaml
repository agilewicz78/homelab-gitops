      <script>
        const appEl = document.getElementById("app");
        const userBadge = document.getElementById("userBadge");
        const notificationButton = document.getElementById("notificationButton");
        const notificationCount = document.getElementById("notificationCount");
        const notificationPanel = document.getElementById("notificationPanel");
        const notificationList = document.getElementById("notificationList");
        const wsStatus = document.getElementById("wsStatus");
        const wsClients = document.getElementById("wsClients");
        const wsTime = document.getElementById("wsTime");
        const wsEvent = document.getElementById("wsEvent");
        let liveSocket = null;
        let liveReconnectTimer = null;
        let lastLiveEventId = null;
        let currentView = {{ name: "home", ticketId: null }};
        let incidentListFilter = "active";
        let suppressNextLiveRefresh = false;
        let closeTicketId = null;
        let reopenTicketId = null;
        let incidentCreationContext = null;
        let knowledgeArticleContext = null;
        let knowledgeFeedbackContext = null;
        let knowledgeSuggestionTimer = null;
        let knowledgeSuggestionRequest = 0;
        function getSid() {{ return sessionStorage.getItem("helpdesk_sid") || ""; }}
        function setSid(sid) {{ sessionStorage.setItem("helpdesk_sid", sid); }}
        function clearSid() {{ sessionStorage.removeItem("helpdesk_sid"); }}
        async function api(path, options = {{}}) {{
          const headers = options.headers || {{}};
          headers["X-Helpdesk-Session"] = getSid();
          if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
          const res = await fetch(path, {{ ...options, headers }});
          if (res.status === 401) {{
            clearSid();
            window.location.href = "/login";
            return null;
          }}
          return res;
        }}
        function esc(value) {{
          return String(value ?? "").replace(/[&<>"']/g, ch => ({{
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
          }}[ch]));
        }}
        function formatBytes(bytes) {{
          const value = Number(bytes || 0);
          if (value < 1024) return value + " B";
          if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " KB";
          return (value / (1024 * 1024)).toFixed(1) + " MB";
        }}
        function formatResolutionMinutes(totalMinutes) {{
          const value = Number(totalMinutes || 0);
          const hours = Math.floor(value / 60);
          const minutes = value % 60;
          if (hours && minutes) return `${{hours}}h ${{minutes}}m`;
          if (hours) return `${{hours}}h`;
          return `${{minutes}}m`;
        }}
        function openCloseTicketModal(ticketId) {{
          closeTicketId = ticketId;
          const modal = document.getElementById("closeTicketModal");
          const subtitle = document.getElementById("closeTicketModalSubtitle");
          const form = document.getElementById("closeTicketForm");
          if (form) form.reset();
          if (subtitle) subtitle.textContent = "Zamknięcie zgłoszenia #" + ticketId;
          if (modal) modal.classList.remove("hidden");
        }}
        function closeCloseTicketModal() {{
          closeTicketId = null;
          const modal = document.getElementById("closeTicketModal");
          if (modal) modal.classList.add("hidden");
        }}
        function openReopenTicketModal(ticketId) {{
          reopenTicketId = ticketId;
          const modal = document.getElementById("reopenTicketModal");
          const subtitle = document.getElementById("reopenTicketModalSubtitle");
          const form = document.getElementById("reopenTicketForm");
          if (form) form.reset();
          if (subtitle) subtitle.textContent = "Ponowne otwarcie zgłoszenia #" + ticketId;
          if (modal) modal.classList.remove("hidden");
        }}
        function closeReopenTicketModal() {{
          reopenTicketId = null;
          const modal = document.getElementById("reopenTicketModal");
          if (modal) modal.classList.add("hidden");
        }}
        function openIncidentFromTicketsModal() {{
          const context = incidentCreationContext;
          if (!context || !Array.isArray(context.tickets) || context.tickets.length < 2) {{
            alert("Najpierw powiąż co najmniej dwa otwarte zgłoszenia.");
            return;
          }}
          const modal = document.getElementById("incidentFromTicketsModal");
          const form = document.getElementById("incidentFromTicketsForm");
          const list = document.getElementById("incidentFromTicketsList");
          const severity = document.getElementById("incidentFromTicketsSeverity");
          const commander = document.getElementById("incidentFromTicketsCommander");
          if (!modal || !form || !list || !severity || !commander) return;
          form.reset();
          form.elements.title.value = `Incydent: ${{context.sourceTitle}}`;
          form.elements.summary.value = `Problem został zgłoszony w ${{context.tickets.length}} powiązanych zgłoszeniach. Zgłoszenie źródłowe #${{context.sourceTicketId}}: ${{context.sourceTitle}}`;
          severity.innerHTML = (context.severities || ["SEV1", "SEV2", "SEV3", "SEV4"])
            .map(value => `<option ${{value === "SEV2" ? "selected" : ""}}>${{esc(value)}}</option>`)
            .join("");
          commander.innerHTML = `<option value="">Ja</option>${{(context.commanders || []).map(item =>
            `<option value="${{esc(item.email)}}">${{esc(item.name)}} · ${{esc(item.email)}}</option>`
          ).join("")}}`;
          list.innerHTML = context.tickets.map(ticket => `
            <label class="watcher-item incident-ticket-choice">
              <input type="checkbox" data-ticket-id="${{ticket.id}}" checked ${{ticket.id === context.sourceTicketId ? "disabled" : ""}}>
              <span>
                <strong>#${{ticket.id}} · ${{esc(ticket.title)}}</strong>
                <span class="watcher-meta"><span class="pill ${{statusClass(ticket.status)}}">${{esc(ticket.status)}}</span></span>
              </span>
            </label>
          `).join("");
          modal.classList.remove("hidden");
        }}
        function closeIncidentFromTicketsModal() {{
          const modal = document.getElementById("incidentFromTicketsModal");
          if (modal) modal.classList.add("hidden");
        }}
        function updateKnowledgeSubcategories(selected = "") {{
          const categorySelect = document.getElementById("knowledgeArticleCategory");
          const subcategorySelect = document.getElementById("knowledgeArticleSubcategory");
          if (!categorySelect || !subcategorySelect || !knowledgeArticleContext) return;
          const values = knowledgeArticleContext.subcategories?.[categorySelect.value] || ["Inne"];
          subcategorySelect.innerHTML = values.map(value =>
            `<option value="${{esc(value)}}" ${{value === selected ? "selected" : ""}}>${{esc(value)}}</option>`
          ).join("");
        }}
        function openKnowledgeArticleModal() {{
          const context = knowledgeArticleContext;
          if (!context) return;
          const modal = document.getElementById("knowledgeArticleModal");
          const form = document.getElementById("knowledgeArticleForm");
          const heading = document.getElementById("knowledgeArticleModalTitle");
          const categorySelect = document.getElementById("knowledgeArticleCategory");
          if (!modal || !form || !heading || !categorySelect) return;
          form.reset();
          const article = context.article || {{}};
          heading.textContent = context.mode === "edit" ? `Edytuj artykuł #${{article.id}}` : "Utwórz artykuł z rozwiązania";
          form.elements.title.value = article.title || context.title || "";
          form.elements.problem.value = article.problem || context.problem || "";
          form.elements.solution.value = article.solution || context.solution || "";
          form.elements.status.value = article.status || "published";
          categorySelect.innerHTML = (context.categories || []).map(value =>
            `<option value="${{esc(value)}}" ${{value === (article.category || context.category) ? "selected" : ""}}>${{esc(value)}}</option>`
          ).join("");
          updateKnowledgeSubcategories(article.subcategory || context.subcategory || "Inne");
          categorySelect.onchange = () => updateKnowledgeSubcategories("Inne");
          modal.classList.remove("hidden");
        }}
        function closeKnowledgeArticleModal() {{
          const modal = document.getElementById("knowledgeArticleModal");
          if (modal) modal.classList.add("hidden");
        }}
        async function downloadAttachment(id, filename) {{
          const res = await fetch(`/api/attachments/${{id}}/download`, {{
            headers: {{ "X-Helpdesk-Session": getSid() }}
          }});
          if (res.status === 401) {{
            clearSid();
            window.location.href = "/login";
            return;
          }}
          if (!res.ok) {{
            alert("Nie udało się pobrać załącznika.");
            return;
          }}
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename || "attachment";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }}
        function showToast(message, details = "") {{
          const toast = document.getElementById("toast");
          if (!toast) return;
          const small = details ? "<small>" + esc(details) + "</small>" : "";
          toast.innerHTML = "<div>" + esc(message) + "</div>" + small;
          toast.classList.add("show");
          clearTimeout(window.__helpdeskToastTimer);
          window.__helpdeskToastTimer = setTimeout(() => {{
            toast.classList.remove("show");
          }}, 4200);
        }}
        function notificationTypeLabel(type) {{
          const map = {{
            ticket_created: "Nowe zgłoszenie",
            status_changed: "Zmiana statusu",
            comment_added: "Komentarz",
            incident_update: "Aktualizacja incydentu",
            incident_linked: "Powiązanie z incydentem",
            internal_note_added: "Notatka wewnętrzna",
            assignment_changed: "Przypisanie",
            attachment_added: "Załącznik",
            ticket_link_changed: "Powiązanie zgłoszeń"
          }};
          return map[type] || "Powiadomienie";
        }}
        let notificationFilter = "all";
        function setNotificationFilter(filter) {{
          notificationFilter = filter === "unread" ? "unread" : "all";
          const allTab = document.getElementById("notificationTabAll");
          const unreadTab = document.getElementById("notificationTabUnread");
          if (allTab) allTab.classList.toggle("active", notificationFilter === "all");
          if (unreadTab) unreadTab.classList.toggle("active", notificationFilter === "unread");
          loadNotifications();
        }}
        async function loadNotifications() {{
          if (!getSid()) return;
          const unreadOnly = notificationFilter === "unread" ? "?unread=1" : "";
          const res = await api("/api/notifications" + unreadOnly);
          if (!res || !res.ok) return;
          const data = await res.json();
          const unread = Number(data.unread_count || 0);
          notificationCount.textContent = unread;
          notificationCount.classList.toggle("hidden", unread <= 0);
          notificationButton.classList.toggle("has-unread", unread > 0);
          const items = data.notifications || [];
          if (!items.length) {{
            const label = notificationFilter === "unread" ? "Brak nieprzeczytanych powiadomień." : "Brak powiadomień.";
            notificationList.innerHTML = `<p class="muted">${{label}}</p>`;
            return;
          }}
          notificationList.innerHTML = items.map(n => `
            <div class="notification-card ${{n.is_read ? "" : "unread"}}">
              <button class="notification-open" onclick="openNotification(${{n.id}}, ${{n.ticket_id || "null"}}); return false;">
                ${{n.ticket_id ? `<div class="notification-ticket">#${{n.ticket_id}} · ${{esc(n.ticket_title || "Bez tytułu")}}</div>` : ""}}
                <div class="notification-message">${{esc(n.message)}}</div>
                <div class="notification-meta">${{esc(notificationTypeLabel(n.type))}} · ${{esc(n.created_at)}}${{n.is_read ? "" : " · nieprzeczytane"}}</div>
              </button>
              <div class="notification-item-actions">
                ${{n.is_read
                  ? `<button class="btn-secondary btn-small" title="Oznacz jako nieprzeczytane" onclick="markNotificationUnread(${{n.id}}); return false;">Nieprzecz.</button>`
                  : `<button class="btn-secondary btn-small" title="Oznacz jako przeczytane" onclick="markNotificationRead(${{n.id}}); return false;">Przecz.</button>`}}
                <button class="btn-danger btn-small" title="Usuń powiadomienie" onclick="deleteNotification(${{n.id}}); return false;">Usuń</button>
              </div>
            </div>
          `).join("");
        }}
        function toggleNotifications() {{
          notificationPanel.classList.toggle("hidden");
          if (!notificationPanel.classList.contains("hidden")) loadNotifications();
        }}
        async function openNotification(id, ticketId) {{
          await api(`/api/notifications/${{id}}/read`, {{ method: "POST" }});
          await loadNotifications();
          notificationPanel.classList.add("hidden");
          if (ticketId) {{
            await renderTicket(ticketId);
          }}
        }}
        async function markNotificationRead(id) {{
          await api(`/api/notifications/${{id}}/read`, {{ method: "POST" }});
          await loadNotifications();
        }}
        async function markNotificationUnread(id) {{
          await api(`/api/notifications/${{id}}/unread`, {{ method: "POST" }});
          await loadNotifications();
        }}
        async function deleteNotification(id) {{
          if (!confirm("Usunąć to powiadomienie?")) return;
          await api(`/api/notifications/${{id}}`, {{ method: "DELETE" }});
          await loadNotifications();
        }}
        async function markAllNotificationsRead() {{
          await api("/api/notifications/read-all", {{ method: "POST" }});
          await loadNotifications();
        }}
        async function deleteReadNotifications() {{
          if (!confirm("Usunąć wszystkie przeczytane powiadomienia?")) return;
          await api("/api/notifications/delete-read", {{ method: "POST" }});
          await loadNotifications();
        }}
        function priorityClass(priority) {{ return "priority-" + String(priority || "").replaceAll(" ", "-"); }}
        function hasRole(user, role) {{
          return Array.isArray(user?.roles) && user.roles.includes(role);
        }}
        function isAdmin(user) {{ return hasRole(user, "admin"); }}
        function isOperator(user) {{ return hasRole(user, "operator"); }}
        // Centralne funkcje uprawnień po stronie UI.
        // Menu i ekrany modułów korzystają z tych samych kodów uprawnień,
        // które backend zwraca w /api/me i egzekwuje na endpointach API.
        function canWorkTickets(user) {{
          if (Array.isArray(user?.permissions)) {{
            return user.permissions.includes("tickets.work") || user.permissions.includes("system.admin");
          }}
          return !!(user && (isOperator(user) || isAdmin(user)));
        }}
        function userHasPermission(user, permissionCode) {{
          if (Array.isArray(user?.permissions)) return user.permissions.includes(permissionCode);
          if (permissionCode.startsWith("workflow.") || permissionCode.startsWith("audit.") || permissionCode.startsWith("users.") || permissionCode === "permissions.view") return isAdmin(user);
          if (permissionCode.startsWith("reports.") || permissionCode.startsWith("sla.") || permissionCode.startsWith("tickets.") || permissionCode === "dashboard.operator") return canWorkTickets(user) || permissionCode.includes("own") || permissionCode === "tickets.create";
          return false;
        }}
        function canViewDashboard(user) {{ return userHasPermission(user, "dashboard.operator"); }}
        function canViewReports(user) {{ return userHasPermission(user, "reports.view"); }}
        function canViewSlaCalendar(user) {{ return userHasPermission(user, "sla.view") || userHasPermission(user, "sla.manage"); }}
        function canManageUsers(user) {{ return userHasPermission(user, "users.manage"); }}
        function canManageWorkflow(user) {{ return userHasPermission(user, "workflow.manage"); }}
        function canViewAudit(user) {{ return userHasPermission(user, "audit.view"); }}
        function canViewPermissions(user) {{ return userHasPermission(user, "permissions.view"); }}
        function roleBadges(roles) {{
          const list = Array.isArray(roles) && roles.length ? roles : ["user"];
          return list.map(r => `<span class="pill">${{esc(r)}}</span>`).join(" ");
        }}
        function slaClass(state) {{
          const map = {{
            "ok": "sla-ok",
            "warning": "sla-warning",
            "overdue": "sla-overdue",
            "done": "sla-done",
            "none": "sla-none"
          }};
          return map[state] || "sla-none";
        }}
        function slaLabel(state) {{
          const map = {{
            "ok": "SLA OK",
            "warning": "Blisko SLA",
            "overdue": "SLA przekroczone",
            "done": "Zakończone",
            "none": "Brak SLA"
          }};
          return map[state] || "Brak SLA";
        }}
        function statusClass(status) {{
          return "status-" + String(status || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replaceAll("ł", "l")
            .replaceAll("Ł", "L")
            .replace(/[^a-zA-Z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
        }}
        function subcategoriesForCategory(meta, category) {{
          const all = meta?.subcategories || {{}};
          return all[category] || all["Inne"] || ["Inne"];
        }}
        function updateSubcategorySelect(meta) {{
          const categorySelect = document.getElementById("new-ticket-category");
          const subcategorySelect = document.getElementById("new-ticket-subcategory");
          if (!categorySelect || !subcategorySelect) return;
          const values = subcategoriesForCategory(meta, categorySelect.value);
          subcategorySelect.innerHTML = values.map(x => `<option>${{esc(x)}}</option>`).join("");
        }}
        function setWsStatus(text, connected) {{
          wsStatus.textContent = text;
          wsStatus.className = connected ? "live-value ws-connected" : "live-value ws-disconnected";
        }}
        function connectLive() {{
          const sid = getSid();
          if (!sid) return;
          if (liveSocket && (liveSocket.readyState === WebSocket.OPEN || liveSocket.readyState === WebSocket.CONNECTING)) return;
          const scheme = window.location.protocol === "https:" ? "wss" : "ws";
          liveSocket = new WebSocket(`${{scheme}}://${{window.location.host}}/ws`);
          setWsStatus("connecting", false);
          liveSocket.onopen = () => {{
            setWsStatus("connected", true);
            liveSocket.send(JSON.stringify({{ type: "auth", sid }}));
          }};
          liveSocket.onmessage = (event) => {{
            const data = JSON.parse(event.data);
            handleLivePayload(data);
          }};
          liveSocket.onclose = () => {{
            setWsStatus("disconnected", false);
            if (getSid()) {{
              clearTimeout(liveReconnectTimer);
              liveReconnectTimer = setTimeout(connectLive, 2000);
            }}
          }};
          liveSocket.onerror = () => {{
            try {{ liveSocket.close(); }} catch (e) {{}}
          }};
        }}
        async function handleLivePayload(data) {{
          wsClients.textContent = data.active_clients ?? "-";
          wsTime.textContent = data.server_time ?? "-";
          const liveEvent = data.event || null;
          wsEvent.textContent = liveEvent?.message || data.message || "-";
          if (!liveEvent || !liveEvent.id || liveEvent.id === lastLiveEventId) return;
          lastLiveEventId = liveEvent.id;
          await loadNotifications();
          const refreshEvents = [
            "ticket_created",
            "status_changed",
            "auto_status_changed",
            "workflow_rule_status_changed",
            "workflow_rule_notification",
            "workflow_rule_history",
            "comment_added",
            "internal_note_added",
            "assignment_changed",
            "attachment_added",
            "watcher_changed",
            "ticket_link_changed",
            "ticket_closed",
            "ticket_reopened",
            "incident_created",
            "incident_updated",
            "incident_update",
            "incident_ticket_linked",
            "incident_ticket_unlinked",
            "knowledge_article_changed"
          ];
          if (!refreshEvents.includes(liveEvent.type)) return;
          if (["status_changed", "auto_status_changed", "workflow_rule_status_changed", "ticket_closed", "ticket_reopened"].includes(liveEvent.type) && !suppressNextLiveRefresh) {{
            showToast(
              "Zmieniono status zgłoszenia #" + liveEvent.ticket_id,
              liveEvent.message || ""
            );
          }}
          if (liveEvent.type === "internal_note_added" && !suppressNextLiveRefresh) {{
            showToast(
              "Dodano notatkę wewnętrzną do zgłoszenia #" + liveEvent.ticket_id,
              liveEvent.message || ""
            );
          }}
          const shouldSuppress = suppressNextLiveRefresh;
          if (suppressNextLiveRefresh) {{
            suppressNextLiveRefresh = false;
          }}
          const affectedTicketIds = Array.isArray(liveEvent.ticket_ids)
            ? liveEvent.ticket_ids.map(Number)
            : [];
          // Nawet gdy pomijamy popup po własnej akcji, odświeżamy aktywny widok,
          // żeby lista zgłoszeń, dashboard i kalendarz SLA dostały aktualny status.
          if (
            currentView.name === "ticket"
            && (
              Number(currentView.ticketId) === Number(liveEvent.ticket_id)
              || affectedTicketIds.includes(Number(currentView.ticketId))
            )
          ) {{
            await renderTicket(currentView.ticketId, true);
            return;
          }}
          if (currentView.name === "home") {{
            await renderHome(loadStatusFilters(), true);
          }}
          if (currentView.name === "dashboard") {{
            await renderDashboard();
          }}
          if (currentView.name === "sla-calendar") {{
            await renderSlaCalendar();
          }}
          if (currentView.name === "incidents") {{
            await renderIncidents(incidentListFilter);
          }}
          if (currentView.name === "incident" && currentView.incidentId) {{
            await renderIncident(currentView.incidentId);
          }}
          if (currentView.name === "knowledge") {{
            await renderKnowledgeArticles();
          }}
          if (currentView.name === "knowledge-article" && currentView.articleId) {{
            await renderKnowledgeArticle(currentView.articleId);
          }}
        }}
