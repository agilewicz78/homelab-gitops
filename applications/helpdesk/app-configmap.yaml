            const parsed = JSON.parse(details);
            return Object.entries(parsed)
              .map(([key, value]) => `<div><span class="muted">${{esc(key)}}:</span> ${{esc(Array.isArray(value) ? value.join(", ") : String(value ?? ""))}}</div>`)
              .join("");
          }} catch (e) {{
            return esc(details);
          }}
        }}
        function auditPaginationControls(pagination) {{
          const page = Number(pagination.page || 1);
          const totalPages = Number(pagination.total_pages || 1);
          const disabledPrev = page <= 1 ? "disabled" : "";
          const disabledNext = page >= totalPages ? "disabled" : "";
          return `
            <div class="pagination">
              <div class="pagination-info">
                <strong>Wyświetlanie audytu</strong><br>
                <span>Strona ${{page}} z ${{totalPages}} · rekordów: ${{pagination.total_filtered || 0}}</span>
              </div>
              <div class="pagination-pages">
                <button class="btn-secondary btn-small" ${{disabledPrev}} onclick="renderAudit(1)">« Pierwsza</button>
                <button class="btn-secondary btn-small" ${{disabledPrev}} onclick="renderAudit(${{Math.max(1, page - 1)}})">‹ Poprzednia</button>
                <button class="btn-secondary btn-small" ${{disabledNext}} onclick="renderAudit(${{Math.min(totalPages, page + 1)}})">Następna ›</button>
                <button class="btn-secondary btn-small" ${{disabledNext}} onclick="renderAudit(${{totalPages}})">Ostatnia »</button>
              </div>
            </div>
          `;
        }}
