    @app.post("/api/tickets/<int:ticket_id>/comments")
    @api_login_required

    # Dodanie komentarza lub notatki wewnętrznej do zgłoszenia.
    def api_add_comment(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        content = clean(payload.get("content"))
        visibility = clean(payload.get("visibility")) or "public"
        if not is_staff(user):
            visibility = "public"
        if visibility not in ("public", "internal"):
            visibility = "public"
        if not content:
            return jsonify({"error": "content is required"}), 400
        conn = get_conn()
        cur = conn.cursor()
        ok, ticket_status, error_code = ensure_ticket_mutable(cur, ticket_id)
        if not ok:
            cur.close()
            conn.close()
            return ticket_status, error_code
        event_type = "internal_note_added" if visibility == "internal" else "comment_added"
        event_message = (
            "Dodano notatkę wewnętrzną."
            if visibility == "internal"
            else f"Dodano komentarz publiczny: {content[:120]}"
        )
        cur.execute("""
            INSERT INTO comments (ticket_id, author, author_email, content, visibility)
            VALUES (%s, %s, %s, %s, %s)
        """, (ticket_id, user["name"], user["email"], content, visibility))
        first_response_registered = mark_first_response_if_needed(cur, ticket_id, user)
        cur.execute("UPDATE tickets SET updated_at = NOW() WHERE id = %s", (ticket_id,))
        add_ticket_event(cur, ticket_id, user, event_type, event_message)
        auto_status_change = apply_auto_status_after_comment(cur, ticket_id, user, ticket_status, visibility)
        if visibility == "internal":
            log_audit(cur, user, "internal_note_added", "ticket", ticket_id, {
                "content_preview": content[:120],
            })
        create_ticket_notifications(
            cur,
            ticket_id,
            event_type,
            (
                f"Dodano notatkę wewnętrzną do zgłoszenia #{ticket_id}."
                if visibility == "internal"
                else f"Dodano komentarz do zgłoszenia #{ticket_id}."
            ),
            actor_email=user["email"],
            staff_only=(visibility == "internal"),
        )
        conn.commit()
        cur.close()
        conn.close()
        if visibility == "public":
            publish_event(f"{user['name']} dodał komentarz do zgłoszenia #{ticket_id}", "comment_added", ticket_id)
        else:
            # Nie publikujemy treści notatki wewnętrznej globalnie do zwykłych użytkowników.
            # Widok operatorów/adminów odświeży się po wejściu w zgłoszenie albo po kolejnej akcji.
            publish_event(f"{user['name']} dodał notatkę wewnętrzną do zgłoszenia #{ticket_id}", "internal_note_added", ticket_id, staff_only=True)
        if auto_status_change:
            publish_event(
                f"Status zgłoszenia #{ticket_id} zmieniono automatycznie z {auto_status_change['old_status']} na {auto_status_change['new_status']}",
                "auto_status_changed",
                ticket_id,
            )
        return jsonify({"status": "ok", "visibility": visibility, "auto_status_change": auto_status_change, "first_response_registered": first_response_registered})
    @app.get("/api/tickets/<int:ticket_id>/attachments")
    @api_login_required
    def api_ticket_attachments(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT id, original_filename, content_type, size_bytes, uploaded_by_name, created_at
            FROM attachments
            WHERE ticket_id = %s
            ORDER BY id DESC
        """, (ticket_id,))
        rows = cur.fetchall()
        cur.close()
        conn.close()
        return jsonify({
            "attachments": [
                {
                    "id": r[0],
                    "original_filename": r[1],
                    "content_type": r[2] or "",
                    "size_bytes": r[3],
                    "uploaded_by_name": r[4] or "",
                    "created_at": str(r[5]),
                }
                for r in rows
            ]
        })
    @app.post("/api/tickets/<int:ticket_id>/attachments")
    @api_login_required

    # Przesyłanie i zapis załącznika do zgłoszenia.
    def api_upload_attachment(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        if "file" not in request.files:
            return jsonify({"error": "Brak pliku."}), 400
        uploaded_file = request.files["file"]
        original_filename = uploaded_file.filename or ""
        safe_filename = secure_filename(original_filename)
        if not safe_filename:
            return jsonify({"error": "Nieprawidłowa nazwa pliku."}), 400
        if not allowed_attachment(safe_filename):
            return jsonify({"error": "Niedozwolony typ pliku."}), 400
        file_bytes = uploaded_file.read()
        size_bytes = len(file_bytes)
        if size_bytes <= 0:
            return jsonify({"error": "Pusty plik."}), 400
        if size_bytes > MAX_ATTACHMENT_SIZE:
            return jsonify({"error": "Plik jest za duży. Maksymalny rozmiar to 10 MB."}), 400
        conn = get_conn()
        cur = conn.cursor()
        ok, ticket_status, error_code = ensure_ticket_mutable(cur, ticket_id)
        if not ok:
            cur.close()
            conn.close()
            return ticket_status, error_code
        ticket_dir = os.path.join(ATTACHMENTS_DIR, str(ticket_id))
        os.makedirs(ticket_dir, exist_ok=True)
        stored_basename = f"{uuid.uuid4().hex}_{safe_filename}"
        stored_filename = f"{ticket_id}/{stored_basename}"
        target_path = attachment_path(stored_filename)
        with open(target_path, "wb") as f:
            f.write(file_bytes)
        cur.execute("""
            INSERT INTO attachments (
                ticket_id,
                original_filename,
                stored_filename,
                content_type,
                size_bytes,
                uploaded_by_email,
                uploaded_by_name
            )
            VALUES (%s, %s, %s, %s, %s, %s, %s)
            RETURNING id
        """, (
            ticket_id,
            original_filename,
            stored_filename,
            uploaded_file.content_type,
            size_bytes,
            user["email"],
            user["name"],
        ))
        attachment_id = cur.fetchone()[0]
        cur.execute("UPDATE tickets SET updated_at = NOW() WHERE id = %s", (ticket_id,))
        add_ticket_event(cur, ticket_id, user, "attachment_added", f"Dodano załącznik: {original_filename}")
        log_audit(cur, user, "attachment_added", "ticket", ticket_id, {
            "attachment_id": attachment_id,
            "original_filename": original_filename,
            "size_bytes": size_bytes,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "attachment_added",
            f"Dodano załącznik do zgłoszenia #{ticket_id}: {original_filename}.",
            actor_email=user["email"],
        )
        apply_workflow_event_rules(cur, ticket_id, user, "attachment_added", ticket_status, None)
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} dodał załącznik do zgłoszenia #{ticket_id}: {original_filename}", "attachment_added", ticket_id)
        return jsonify({"status": "ok", "attachment_id": attachment_id}), 201
    @app.get("/api/attachments/<int:attachment_id>/download")
    @api_login_required

    # Bezpieczne pobieranie załącznika ze zgłoszenia.
    def api_download_attachment(user, attachment_id):
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT ticket_id, original_filename, stored_filename, content_type
            FROM attachments
            WHERE id = %s
        """, (attachment_id,))
        row = cur.fetchone()
        cur.close()
        conn.close()
        if not row:
            return jsonify({"error": "not found"}), 404
        ticket_id, original_filename, stored_filename, content_type = row
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        try:
            target_path = attachment_path(stored_filename)
        except ValueError:
            return jsonify({"error": "invalid attachment path"}), 400
        if not os.path.exists(target_path):
            return jsonify({"error": "file not found"}), 404
        return send_file(
            target_path,
            as_attachment=True,
            download_name=original_filename,
            mimetype=content_type or "application/octet-stream",
        )
