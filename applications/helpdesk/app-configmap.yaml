                WHERE tw.ticket_id = %s
                  AND u.roles IS NOT NULL
                  AND ('operator' = ANY(u.roles) OR 'admin' = ANY(u.roles))
            """, (ticket_id,))
        else:
            cur.execute("""
                SELECT user_email
                FROM ticket_watchers
