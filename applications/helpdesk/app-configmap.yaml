    @app.get("/api/admin/permissions.csv")
    @api_login_required
    @api_admin_required

    def api_admin_permissions_csv(user):
        """Eksportuje macierz uprawnień ról do CSV.

        Funkcja korzysta z tego samego payloadu co ekran Uprawnienia, dlatego eksport
        pokazuje bieżącą konfigurację zapisaną w tabeli role_permissions oraz
        uwzględnia uprawnienia dziedziczone i zablokowane.
        """
        payload = role_permissions_payload()
        permissions = payload.get("all_permissions") or []
        roles = payload.get("roles") or []

        output = io.StringIO()
        writer = csv.writer(output, delimiter=";")
        writer.writerow(["Kod uprawnienia", "Nazwa uprawnienia"] + [r.get("label") or r.get("key") for r in roles])

        for permission in permissions:
            code = permission.get("code")
            row = [code, permission.get("label") or code]
            for role in roles:
                direct = set(role.get("direct_permission_codes") or [])
                inherited = set(role.get("inherited_permission_codes") or [])
                locked = set(role.get("locked_permission_codes") or [])
                if code in locked:
                    value = "TAK - zablokowane"
                elif code in direct:
                    value = "TAK - bezpośrednie"
                elif code in inherited:
                    value = "TAK - dziedziczone"
                else:
                    value = "NIE"
                row.append(value)
            writer.writerow(row)

        filename = "helpdesk-uprawnienia-rol.csv"
        return Response(
            output.getvalue(),
            mimetype="text/csv; charset=utf-8",
            headers={"Content-Disposition": f"attachment; filename={filename}"},
        )



    @app.post("/api/admin/permissions")
    @api_login_required
    @api_admin_required

    def api_admin_update_permissions(user):
        """Aktualizuje bezpośrednie uprawnienia wybranej roli.

        Zablokowane uprawnienia ochronne pozostają zawsze aktywne, żeby administrator
        nie odciął sobie przypadkowo dostępu do systemu.
        """
        data = request.get_json(force=True, silent=True) or {}
        role_key = clean(data.get("role_key"))
        if role_key not in VALID_ROLES:
            return jsonify({"error": "Nieprawidłowa rola."}), 400
        requested_codes = data.get("permission_codes") or []
        if not isinstance(requested_codes, list):
            return jsonify({"error": "permission_codes musi być listą."}), 400

        allowed_codes = set(ROLE_PERMISSION_CODES.get(role_key, set()))
        enabled_codes = {clean(code) for code in requested_codes if clean(code) in allowed_codes}
        enabled_codes.update(LOCKED_ROLE_PERMISSION_CODES.get(role_key, set()))

        conn = None
        cur = None
        try:
            conn = get_conn()
            cur = conn.cursor()
            ensure_role_permissions_schema(cur)
            for code in allowed_codes:
                cur.execute("""
                    INSERT INTO role_permissions (role_key, permission_code, enabled, updated_at)
                    VALUES (%s, %s, %s, NOW())
                    ON CONFLICT (role_key, permission_code) DO UPDATE
                    SET enabled = EXCLUDED.enabled, updated_at = NOW()
                """, (role_key, code, code in enabled_codes))

            # Poprawka: w aplikacji funkcja audytu nazywa się log_audit,
            # a wcześniejsza wersja błędnie wywoływała nieistniejące audit(...),
            # co powodowało błąd 500 i komunikat „Nie można zapisać”.
            log_audit(cur, user, "permissions_updated", "role", role_key, {
                "enabled_permission_codes": sorted(enabled_codes),
            })
            conn.commit()
            invalidate_role_permission_cache()
            return jsonify(role_permissions_payload())
        except Exception as exc:
            if conn:
                conn.rollback()
            print(f"permissions update failed for role {role_key}: {exc}", flush=True)
            return jsonify({
                "error": "Nie udało się zapisać uprawnień roli.",
                "detail": str(exc),
            }), 500
        finally:
            if cur:
                cur.close()
            if conn:
                conn.close()
