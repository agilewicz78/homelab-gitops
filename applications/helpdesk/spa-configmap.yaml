                  `).join("")}
                </select>
                <div id="newTicketServiceHint" class="hidden"></div>
                <div class="grid">
                  <div><label>Zgłaszający</label><input value="${esc(me.name)}" disabled></div>
                  <div><label>E-mail</label><input value="${esc(me.email)}" disabled></div>
                </div>
                <div class="grid">
                  <div><label>Dział</label><input value="${esc(me.department)}" disabled></div>
                  <div>
                    <label>Kategoria</label>
                    <select id="new-ticket-category" name="category">
                      ${meta.categories.map(x => `<option>${esc(x)}</option>`).join("")}
