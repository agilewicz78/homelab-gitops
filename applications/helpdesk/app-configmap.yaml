    # Migracje startowe i inicjalizacja schematu bazy danych.
    def init_db():
        for _ in range(40):
            try:
                conn = get_conn()
                cur = conn.cursor()
                cur.execute("""
                    CREATE TABLE IF NOT EXISTS users (
                        id SERIAL PRIMARY KEY,
                        first_name TEXT NOT NULL,
                        last_name TEXT NOT NULL,
                        email TEXT UNIQUE NOT NULL,
                        department TEXT NOT NULL,
                        role TEXT NOT NULL DEFAULT 'user',
                        password_hash TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)
                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS first_name TEXT")
                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS last_name TEXT")
                cur.execute("""
                    SELECT EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_name = 'users' AND column_name = 'full_name'
                    )
                """)
                has_full_name = cur.fetchone()[0]
                if has_full_name:
                    cur.execute("""
                        UPDATE users
                        SET
                          first_name = COALESCE(NULLIF(first_name, ''), split_part(full_name, ' ', 1)),
                          last_name = COALESCE(
                            NULLIF(last_name, ''),
                            NULLIF(trim(substr(full_name, length(split_part(full_name, ' ', 1)) + 1)), ''),
                            '-'
                          )
                        WHERE first_name IS NULL OR first_name = '' OR last_name IS NULL OR last_name = ''
                    """)
                    cur.execute("ALTER TABLE users DROP COLUMN IF EXISTS full_name")
                cur.execute("UPDATE users SET first_name = 'Nieznane' WHERE first_name IS NULL OR first_name = ''")
                cur.execute("UPDATE users SET last_name = '-' WHERE last_name IS NULL OR last_name = ''")
                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS roles TEXT[]")
                cur.execute("UPDATE users SET role = 'operator' WHERE role = 'agent'")
                cur.execute("""
                    UPDATE users
                    SET first_name = 'Helpdesk', last_name = 'Operator'
                    WHERE email IN ('agent@incoprp.local', 'operator@incoprp.local')
                      AND lower(first_name) = 'helpdesk'
                """)
                cur.execute("""
                    UPDATE users
                    SET roles = CASE
                        WHEN role = 'admin' THEN ARRAY['user','admin','operator']
                        WHEN role = 'operator' THEN ARRAY['user','operator']
                        ELSE ARRAY['user']
                    END
                    WHERE roles IS NULL OR array_length(roles, 1) IS NULL
