    # -----------------------------------------------------------------------------
    # Walidacja wymagań workflow przed zmianą statusu
    # -----------------------------------------------------------------------------
    # Założenie funkcjonalne:
    # - akcja "Wymagaj komentarza" blokuje zmianę statusu, dopóki zgłoszenie
    #   nie ma przynajmniej jednego wpisu w sekcji Komentarze,
    # - akcja "Wymagaj załącznika" blokuje zmianę statusu, dopóki zgłoszenie
    #   nie ma przynajmniej jednego pliku w sekcji Załączniki,
    # - komentarz / załącznik dodajemy w standardowych sekcjach zgłoszenia,
    #   a nie w formularzu zmiany statusu.
    #
    # Ten kod celowo nie polega wyłącznie na funkcji wykonującej automatyzacje,
    # ponieważ akcje require_comment / require_attachment są walidacjami blokującymi,
    # a nie akcjami wykonywanymi po zmianie statusu.
    
    
    def workflow_requirement_normalize(value):
        """Zamienia dowolny zapis akcji/warunku na prosty tekst do porównywania."""
        text = clean(value).lower()
        if not text:
            return ""
        replacements = {
            "ą": "a",
            "ć": "c",
            "ę": "e",
            "ł": "l",
            "ń": "n",
            "ó": "o",
            "ś": "s",
            "ż": "z",
            "ź": "z",
            "-": "_",
            " ": "_",
            "/": "_",
        }
        for source, target in replacements.items():
            text = text.replace(source, target)
        while "__" in text:
            text = text.replace("__", "_")
        return text.strip("_")
    
    
    def workflow_requirement_type_from_value(value):
        """
        Rozpoznaje wymóg workflow niezależnie od tego, gdzie i jak został zapisany.
    
        Obsługiwane są między innymi:
        - require_comment / require_attachment,
        - Wymagaj komentarza / Wymagaj załącznika,
        - starsze zapisy w workflow_automations.action_type / action_status,
        - nowsze zapisy w workflow_automation_actions.action_type / action_value.
        """
        text = workflow_requirement_normalize(value)
        if not text:
            return None
    
        comment_tokens = {
            "require_comment",
            "required_comment",
            "comment_required",
            "require_comments",
            "comments_required",
            "wymagaj_komentarza",
            "wymaga_komentarza",
            "wymagany_komentarz",
            "komentarz_wymagany",
        }
        attachment_tokens = {
            "require_attachment",
            "required_attachment",
            "attachment_required",
            "require_attachments",
            "attachments_required",
            "wymagaj_zalacznika",
            "wymaga_zalacznika",
            "wymagany_zalacznik",
            "zalacznik_wymagany",
            "wymagaj_pliku",
            "wymaga_pliku",
            "plik_wymagany",
        }
    
        if text in comment_tokens:
            return "comment"
        if text in attachment_tokens:
            return "attachment"
    
        requires = any(token in text for token in ("require", "required", "wymagaj", "wymaga", "wymagany"))
        mentions_comment = any(token in text for token in ("comment", "comments", "komentarz", "komentarza"))
        mentions_attachment = any(token in text for token in ("attachment", "attachments", "zalacznik", "zalacznika", "plik", "pliku"))
    
        if requires and mentions_comment:
            return "comment"
        if requires and mentions_attachment:
            return "attachment"
    
        return None
    
    
    def workflow_condition_is_any(value):
        """Czy warunek workflow oznacza dowolną wartość."""
        return workflow_requirement_normalize(value) in ("", "*", "any", "dowolny", "dowolna")
    
    
    def workflow_status_requirement_rule_matches(rule, old_status, new_status, user, assigned_to_email=None):
        """Sprawdza, czy reguła status_changed dotyczy tej konkretnej zmiany statusu."""
        if not rule.get("is_active", True):
            return False
    
        condition_status = clean(rule.get("condition_status"))
        condition_to_status = clean(rule.get("condition_to_status"))
    
        has_from = not workflow_condition_is_any(condition_status)
        has_to = not workflow_condition_is_any(condition_to_status)
    
        # Normalny zapis: status źródłowy + status docelowy.
        if has_from and has_to:
            if condition_status != old_status or condition_to_status != new_status:
                return False
        elif has_to:
            # Reguła dla dowolnego statusu źródłowego do konkretnego statusu docelowego.
            if condition_to_status != new_status:
                return False
        elif has_from:
            # Starszy formularz miał tylko jedno pole statusu. W praktyce bywało używane
            # jako status źródłowy albo docelowy, więc celowo akceptujemy oba warianty.
            if condition_status not in (old_status, new_status):
                return False
    
        condition_role = workflow_requirement_normalize(rule.get("condition_role"))
        if condition_role not in ("", "*", "any", "dowolna", "dowolny"):
            if condition_role == "staff" and not is_staff(user):
                return False
            if condition_role == "user" and is_staff(user):
                return False
            if condition_role == "operator" and not is_operator(user):
                return False
            if condition_role == "admin" and not is_admin(user):
                return False
    
        assigned_state = workflow_requirement_normalize(rule.get("assigned_state")) or "*"
        has_assignee = bool(assigned_to_email)
        if assigned_state == "assigned" and not has_assignee:
            return False
        if assigned_state == "unassigned" and has_assignee:
            return False
    
        return True
    
    # Wyszukuje reguły wymagające komentarza lub załącznika dla przejścia statusu.
    def workflow_status_requirement_rules(cur, workflow_key, old_status, new_status, user, assigned_to_email=None, ticket_context=None):
        """
        Zwraca aktywne reguły status_changed, które wymagają komentarza i/lub załącznika.
    
        Funkcja jest celowo bardziej defensywna niż zwykły silnik automatyzacji:
        wymagania komentarza/załącznika są walidacją bezpieczeństwa przed zmianą statusu,
        więc nie mogą zostać pominięte przez drobną różnicę zapisu po migracji.
        """
        workflow_id = workflow_id_by_key(cur, workflow_key)
    
        if workflow_id:
            cur.execute("""
                SELECT
                    wa.id,
                    wa.name,
                    wa.condition_status,
                    wa.condition_to_status,
                    wa.condition_role,
                    COALESCE(wa.assigned_state, '*') AS assigned_state,
                    COALESCE(wa.condition_priority, '*') AS condition_priority,
                    COALESCE(wa.condition_category, '*') AS condition_category,
                    COALESCE(wa.condition_subcategory, '*') AS condition_subcategory,
                    COALESCE(wa.condition_sla_state, '*') AS condition_sla_state,
                    COALESCE(wa.is_active, TRUE) AS rule_is_active,
                    wa.action_type AS legacy_action_type,
                    wa.action_status AS legacy_action_status,
                    waa.action_type AS action_type,
                    waa.action_value AS action_value,
                    COALESCE(waa.is_active, TRUE) AS action_is_active
                FROM workflow_automations wa
                LEFT JOIN workflow_automation_actions waa
                       ON waa.automation_id = wa.id
                WHERE wa.workflow_id = %s
                  AND wa.event_type = 'status_changed'
                  AND COALESCE(wa.is_active, TRUE) = TRUE
                ORDER BY COALESCE(wa.priority, 100) ASC,
                         wa.id ASC,
                         COALESCE(waa.action_order, 1) ASC,
                         waa.id ASC
            """, (workflow_id,))
        else:
            # Awaryjnie: jeżeli workflow_key z ticketu nie ma rekordu workflow, nie odpuszczamy
            # walidacji całkowicie, tylko patrzymy na aktywne reguły status_changed.
            cur.execute("""
                SELECT
                    wa.id,
                    wa.name,
                    wa.condition_status,
                    wa.condition_to_status,
                    wa.condition_role,
                    COALESCE(wa.assigned_state, '*') AS assigned_state,
                    COALESCE(wa.condition_priority, '*') AS condition_priority,
                    COALESCE(wa.condition_category, '*') AS condition_category,
                    COALESCE(wa.condition_subcategory, '*') AS condition_subcategory,
                    COALESCE(wa.condition_sla_state, '*') AS condition_sla_state,
                    COALESCE(wa.is_active, TRUE) AS rule_is_active,
                    wa.action_type AS legacy_action_type,
                    wa.action_status AS legacy_action_status,
                    waa.action_type AS action_type,
                    waa.action_value AS action_value,
                    COALESCE(waa.is_active, TRUE) AS action_is_active
                FROM workflow_automations wa
                LEFT JOIN workflow_automation_actions waa
                       ON waa.automation_id = wa.id
                WHERE wa.event_type = 'status_changed'
                  AND COALESCE(wa.is_active, TRUE) = TRUE
                ORDER BY COALESCE(wa.priority, 100) ASC,
                         wa.id ASC,
                         COALESCE(waa.action_order, 1) ASC,
                         waa.id ASC
            """)
    
        rules_by_id = {}
        for row in cur.fetchall():
            rule_id = row[0]
            rule = rules_by_id.setdefault(rule_id, {
                "id": rule_id,
                "name": row[1] or "Reguła workflow",
                "condition_status": row[2],
                "condition_to_status": row[3],
                "condition_role": row[4],
                "assigned_state": row[5] or "*",
                "condition_priority": row[6] or "*",
                "condition_category": row[7] or "*",
                "condition_subcategory": row[8] or "*",
                "condition_sla_state": row[9] or "*",
                "is_active": bool(row[10]),
                "requirement_types": set(),
                "debug_actions": [],
            })
    
            # Stary zapis w workflow_automations.
            for value in (row[11], row[12]):
                requirement_type = workflow_requirement_type_from_value(value)
                if requirement_type:
                    rule["requirement_types"].add(requirement_type)
                    rule["debug_actions"].append(clean(value))
    
            # Nowy zapis w workflow_automation_actions.
            if bool(row[15]):
                for value in (row[13], row[14]):
                    requirement_type = workflow_requirement_type_from_value(value)
                    if requirement_type:
                        rule["requirement_types"].add(requirement_type)
                        rule["debug_actions"].append(clean(value))
    
        matched_rules = []
        for rule in rules_by_id.values():
            if not rule["requirement_types"]:
                continue
            if not workflow_status_requirement_rule_matches(rule, old_status, new_status, user, assigned_to_email):
                continue
            if ticket_context:
                matched_extra, _extra_reason = workflow_automation_match_result(
                    rule,
                    old_status,
                    user,
                    visibility=None,
                    assigned_to_email=assigned_to_email,
                    event_new_status=new_status,
                    ticket_context=ticket_context,
                )
                if not matched_extra:
                    continue
            rule["requirement_types"] = sorted(rule["requirement_types"])
            matched_rules.append(rule)
    
        # Bezpiecznik: jeżeli mamy aktywne reguły wymagające komentarza/załącznika,
        # ale nie dopasowały się przez starszy/niejednoznaczny zapis warunku statusu,
        # dopasuj reguły, które wskazują status docelowy albo mają warunek "dowolny".
        if not matched_rules:
            for rule in rules_by_id.values():
                if not rule["requirement_types"]:
                    continue
                condition_status = clean(rule.get("condition_status"))
                condition_to_status = clean(rule.get("condition_to_status"))
                condition_role = workflow_requirement_normalize(rule.get("condition_role"))
                if condition_role not in ("", "*", "any", "dowolna", "dowolny"):
                    if condition_role == "staff" and not is_staff(user):
                        continue
                    if condition_role == "user" and is_staff(user):
                        continue
                    if condition_role == "operator" and not is_operator(user):
                        continue
                    if condition_role == "admin" and not is_admin(user):
                        continue
                status_matches = (
                    workflow_condition_is_any(condition_status)
                    and workflow_condition_is_any(condition_to_status)
                ) or condition_to_status == new_status or condition_status == new_status or condition_status == old_status
                if not status_matches:
                    continue
                if ticket_context:
                    matched_extra, _extra_reason = workflow_automation_match_result(
                        rule,
                        old_status,
                        user,
                        visibility=None,
                        assigned_to_email=assigned_to_email,
                        event_new_status=new_status,
                        ticket_context=ticket_context,
                    )
                    if not matched_extra:
                        continue
                rule["requirement_types"] = sorted(rule["requirement_types"])
                rule["fallback_matched"] = True
                matched_rules.append(rule)
    
        return matched_rules
    
    # Ustala moment wejścia zgłoszenia w aktualny status.
    def ticket_current_status_started_at(cur, ticket_id):
        """
        Zwraca moment wejścia zgłoszenia w obecny status.
    
        Najpierw korzystamy z uporządkowanej tabeli ticket_status_history,
        potem awaryjnie z ticket_events, a na końcu z tickets.created_at.
        Dzięki temu stare komentarze/załączniki nie spełniają wymagań dla
        bieżącej zmiany statusu.
        """
        cur.execute("""
            SELECT status
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        status_row = cur.fetchone()
        current_status = status_row[0] if status_row else None
    
        cur.execute("""
            SELECT COALESCE(
                (
                    SELECT tsh.created_at
                    FROM ticket_status_history tsh
                    WHERE tsh.ticket_id = %s
                      AND (%s IS NULL OR tsh.new_status = %s)
                    ORDER BY tsh.created_at DESC, tsh.id DESC
                    LIMIT 1
                ),
                (
                    SELECT te.created_at
                    FROM ticket_events te
                    WHERE te.ticket_id = %s
                      AND te.event_type IN ('status_changed', 'auto_status_changed', 'ticket_reopened')
                    ORDER BY te.created_at DESC, te.id DESC
                    LIMIT 1
                ),
                (
                    SELECT t.created_at
                    FROM tickets t
                    WHERE t.id = %s
                ),
                TIMESTAMP '1970-01-01 00:00:00'
            )
        """, (ticket_id, current_status, current_status, ticket_id, ticket_id))
        row = cur.fetchone()
        return row[0] if row else None
    
    # Sprawdza, czy aktualny operator dodał nowy komentarz w obecnym statusie.
    def operator_added_comment_for_current_status(cur, ticket_id, user, status_started_at):
        """
        Sprawdza, czy aktualny operator dodał komentarz/notatkę dla bieżącego statusu.
    
        Dla nowych komentarzy używamy author_email.
        Dla starszych danych zostawiamy awaryjne dopasowanie po nazwie autora.
        """
        cur.execute("""
            SELECT EXISTS (
                SELECT 1
                FROM comments
                WHERE ticket_id = %s
                  AND created_at >= %s
                  AND COALESCE(NULLIF(TRIM(content), ''), '') <> ''
                  AND (
                        lower(COALESCE(author_email, '')) = lower(%s)
                        OR (
                            COALESCE(author_email, '') = ''
                            AND lower(COALESCE(author, '')) = lower(%s)
                        )
                  )
            )
        """, (
            ticket_id,
            status_started_at,
            user.get("email") or "",
            user.get("name") or "",
        ))
        return bool(cur.fetchone()[0])
    
    
    # Sprawdza, czy aktualny operator dodał nowy załącznik w obecnym statusie.
    def operator_added_attachment_for_current_status(cur, ticket_id, user, status_started_at):
        """Sprawdza, czy aktualny operator dodał załącznik dla bieżącego statusu."""
        cur.execute("""
            SELECT EXISTS (
                SELECT 1
                FROM attachments
                WHERE ticket_id = %s
                  AND created_at >= %s
                  AND (
                        lower(COALESCE(uploaded_by_email, '')) = lower(%s)
                        OR (
                            COALESCE(uploaded_by_email, '') = ''
                            AND lower(COALESCE(uploaded_by_name, '')) = lower(%s)
                        )
                  )
            )
        """, (
            ticket_id,
            status_started_at,
            user.get("email") or "",
            user.get("name") or "",
        ))
        return bool(cur.fetchone()[0])
    
    
    # Blokuje zmianę statusu, jeśli brakuje wymaganego komentarza lub załącznika.
    def validate_workflow_status_transition_requirements(cur, ticket_id, user, old_status, new_status):
        """
        Blokuje zmianę statusu, jeżeli reguła workflow wymaga komentarza/załącznika,
        a operator nie dodał wymaganego elementu dla tej konkretnej próby przejścia.
    
        Obowiązujące zachowanie:
        - stare komentarze nie spełniają wymogu komentarza,
        - stare załączniki nie spełniają wymogu załącznika,
        - liczy się element dodany przez aktualnego operatora po wejściu zgłoszenia
          w obecny status,
        - endpoint podpowiedzi i właściwy zapis statusu używają tej samej funkcji.
        """
        if old_status == new_status:
            return True, None, [], {
                "required": [],
                "missing": [],
                "rule_names": [],
                "comment_validated": False,
                "attachment_validated": False,
                "status_started_at": None,
            }
    
        cur.execute("""
            SELECT COALESCE(workflow_key, 'default'), assigned_to_email, priority, category, subcategory, sla_due_at, status
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        row = cur.fetchone()
        workflow_key = row[0] if row else "default"
        assigned_to_email = row[1] if row else None
        ticket_context = {
            "priority": row[2] if row and row[2] else None,
            "category": row[3] if row and row[3] else None,
            "subcategory": row[4] if row and row[4] else None,
            "sla_state": sla_state(row[5] if row and row[5] else None, row[6] if row and row[6] else old_status),
        }
    
        requirement_rules = workflow_status_requirement_rules(
            cur,
            workflow_key,
            old_status,
            new_status,
            user,
            assigned_to_email,
            ticket_context=ticket_context,
        )
    
        required = set()
        rule_names = []
        fallback_rules = []
        for rule in requirement_rules:
            required.update(rule.get("requirement_types") or [])
            rule_name = rule.get("name") or "Reguła workflow"
            rule_names.append(rule_name)
            if rule.get("fallback_matched"):
                fallback_rules.append(rule_name)
    
        status_started_at = ticket_current_status_started_at(cur, ticket_id)
        operator_has_comment = (
            operator_added_comment_for_current_status(cur, ticket_id, user, status_started_at)
            if "comment" in required
            else False
        )
        operator_has_attachment = (
            operator_added_attachment_for_current_status(cur, ticket_id, user, status_started_at)
            if "attachment" in required
            else False
        )
    
        missing_requirements = []
        if "comment" in required and not operator_has_comment:
            missing_requirements.append("comment")
        if "attachment" in required and not operator_has_attachment:
            missing_requirements.append("attachment")
    
        validation_details = {
            "required": sorted(required),
            "missing": list(missing_requirements),
            "rule_names": rule_names,
            "fallback_rules": fallback_rules,
            "comment_validated": bool(operator_has_comment),
            "attachment_validated": bool(operator_has_attachment),
            "status_started_at": str(status_started_at),
        }
    
        print(
            "workflow status validation:",
            {
                "ticket_id": ticket_id,
                "workflow_key": workflow_key,
                "old_status": old_status,
                "new_status": new_status,
                "status_started_at": str(status_started_at),
                "operator_email": user.get("email"),
                "operator_name": user.get("name"),
                "required": sorted(required),
                "operator_added_comment_for_current_status": operator_has_comment,
                "operator_added_attachment_for_current_status": operator_has_attachment,
                "missing": missing_requirements,
                "rules": rule_names,
                "fallback_rules": fallback_rules,
            },
            flush=True,
        )
    
        if not missing_requirements:
            return True, None, [], validation_details
    
        labels = []
        if "comment" in missing_requirements:
            labels.append("nowego komentarza")
        if "attachment" in missing_requirements:
            labels.append("nowego załącznika")
    
        unique_rule_names = []
        for name in rule_names:
            if name and name not in unique_rule_names:
                unique_rule_names.append(name)
    
        message = status_requirement_guidance(missing_requirements, old_status, new_status)
        if unique_rule_names:
            message += " Reguła: " + ", ".join(unique_rule_names)
    
        validation_details["missing"] = list(missing_requirements)
        validation_details["guidance"] = status_requirement_guidance(missing_requirements, old_status, new_status)
        return False, message, missing_requirements, validation_details
    
    def status_requirement_guidance(missing_requirements, old_status=None, new_status=None):
        parts = []
        if old_status and new_status:
            parts.append(f"Nie można zmienić statusu z „{old_status}” na „{new_status}”.")
        else:
            parts.append("Nie można zmienić statusu.")
        if "comment" in (missing_requirements or []):
            parts.append("Dodaj nowy komentarz w sekcji Komentarze.")
        if "attachment" in (missing_requirements or []):
            parts.append("Dodaj nowy załącznik w sekcji Załączniki.")
        parts.append("Liczy się element dodany przez aktualnego operatora po wejściu zgłoszenia w obecny status.")
        return " ".join(parts)
    
    
    @app.get("/api/tickets/<int:ticket_id>/status-requirements")
    @api_login_required
    
    # Endpoint podpowiadający wymagania przed zmianą statusu.
    def api_ticket_status_requirements(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        requested_status = clean(request.args.get("status"))
        conn = get_conn()
        cur = conn.cursor()
        ok, old_status, error_code = ensure_ticket_mutable(cur, ticket_id)
        if not ok:
            cur.close()
            conn.close()
            return old_status, error_code
        cur.execute("SELECT COALESCE(workflow_key, 'default') FROM tickets WHERE id = %s", (ticket_id,))
        workflow_row = cur.fetchone()
        workflow_key = workflow_row[0] if workflow_row else "default"
        allowed_statuses = workflow_statuses(workflow_key)
        if not requested_status:
            requested_status = old_status
        if requested_status not in allowed_statuses:
            cur.close()
            conn.close()
            return jsonify({"error": "Status nie jest dostępny w workflow tego zgłoszenia.", "allowed_statuses": allowed_statuses}), 400
        validation_ok, validation_error, missing_requirements, validation_details = validate_workflow_status_transition_requirements(cur, ticket_id, user, old_status, requested_status)
        guidance = status_requirement_guidance(missing_requirements, old_status, requested_status) if missing_requirements else "Wymagania workflow dla tego przejścia są spełnione."
        cur.close()
        conn.close()
        return jsonify({
            "ticket_id": ticket_id,
            "current_status": old_status,
            "requested_status": requested_status,
            "valid": validation_ok,
            "error": validation_error,
            "guidance": guidance,
            "missing_requirements": missing_requirements,
            "required": validation_details.get("required") or [],
            "missing": validation_details.get("missing") or [],
            "rule_names": validation_details.get("rule_names") or [],
            "comment_validated": validation_details.get("comment_validated", False),
            "attachment_validated": validation_details.get("attachment_validated", False),
        })
    
    
    @app.post("/api/tickets/<int:ticket_id>/status")
    @api_login_required
    
    # Zmiana statusu zgłoszenia z walidacją workflow.
    def api_update_status(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        status = clean(payload.get("status")) or "Nowe"
        if status == "Zamknięte":
            return jsonify({"error": "Do zamykania zgłoszenia użyj formularza zamknięcia."}), 400
        conn = get_conn()
        cur = conn.cursor()
        ok, old_status, error_code = ensure_ticket_mutable(cur, ticket_id)
        if not ok:
            cur.close()
            conn.close()
            return old_status, error_code
        cur.execute("SELECT COALESCE(workflow_key, 'default') FROM tickets WHERE id = %s", (ticket_id,))
        workflow_row = cur.fetchone()
        workflow_key = workflow_row[0] if workflow_row else "default"
        allowed_statuses = workflow_statuses(workflow_key)
        if status not in allowed_statuses:
            cur.close()
            conn.close()
            return jsonify({"error": "Status nie jest dostępny w workflow tego zgłoszenia.", "allowed_statuses": allowed_statuses}), 400
        validation_ok, validation_error, missing_requirements, validation_details = validate_workflow_status_transition_requirements(cur, ticket_id, user, old_status, status)
        if not validation_ok:
            cur.close()
            conn.close()
            return jsonify({
                "error": validation_error,
                "missing_requirements": missing_requirements,
                "guidance": validation_details.get("guidance") or status_requirement_guidance(missing_requirements, old_status, status),
                "validation": validation_details,
            }), 409
        cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (status, ticket_id))
        add_ticket_status_history(
            cur,
            ticket_id,
            user,
            old_status,
            status,
            workflow_rule_names=validation_details.get("rule_names") or [],
            required_comment="comment" in (validation_details.get("required") or []),
            required_attachment="attachment" in (validation_details.get("required") or []),
            comment_validated=validation_details.get("comment_validated", False),
            attachment_validated=validation_details.get("attachment_validated", False),
            source="manual",
        )
        add_ticket_event(cur, ticket_id, user, "status_changed", f"Status zmieniony z {old_status} na {status}")
        log_audit(cur, user, "ticket_status_changed", "ticket", ticket_id, {
            "old_status": old_status,
            "new_status": status,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "status_changed",
            f"Status zgłoszenia #{ticket_id} zmieniono z {old_status} na {status}.",
            actor_email=user["email"],
        )
        apply_workflow_event_rules(cur, ticket_id, user, "status_changed", old_status, None, event_new_status=status)
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} zmienił status zgłoszenia #{ticket_id} z {old_status} na {status}", "status_changed", ticket_id)
        return jsonify({"status": "ok"})
    @app.post("/api/tickets/<int:ticket_id>/assign")
    @api_login_required
    
    # Przypisanie zgłoszenia do operatora.
    def api_assign_ticket(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        assigned_to_email = clean(payload.get("assigned_to_email")).lower()
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT assigned_to_email, status FROM tickets WHERE id = %s", (ticket_id,))
        ticket_row = cur.fetchone()
        if not ticket_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        if ticket_row[1] == "Zamknięte":
            cur.close()
            conn.close()
            return jsonify({"error": "Zgłoszenie jest zamknięte i dostępne tylko do odczytu."}), 400
        old_assigned = ticket_row[0]
        assigned_to_name = "Nieprzypisane"
        if assigned_to_email:
            cur.execute("""
                SELECT first_name, last_name, email, roles
                FROM users
                WHERE lower(email) = %s AND 'operator' = ANY(roles)
            """, (assigned_to_email,))
            operator_row = cur.fetchone()
            if not operator_row:
                cur.close()
                conn.close()
                return jsonify({"error": "Można przypisać tylko do operatora."}), 400
            assigned_to_email = operator_row[2]
            assigned_to_name = f"{operator_row[0]} {operator_row[1]}".strip()
        cur.execute("""
            UPDATE tickets
            SET assigned_to_email = %s, updated_at = NOW()
            WHERE id = %s
        """, (assigned_to_email or None, ticket_id))
        if assigned_to_email:
            add_ticket_watcher(cur, ticket_id, assigned_to_email, user["email"])
        assignment_message = f"Przypisanie zmienione z {old_assigned or 'Nieprzypisane'} na {assigned_to_name}"
        add_ticket_event(
            cur,
            ticket_id,
            user,
            "assignment_changed",
            assignment_message
        )
        log_audit(cur, user, "ticket_assigned", "ticket", ticket_id, {
            "old_assigned_to_email": old_assigned,
            "new_assigned_to_email": assigned_to_email or None,
            "new_assigned_to_name": assigned_to_name,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "assignment_changed",
            f"Zmieniono przypisanie zgłoszenia #{ticket_id}: {assigned_to_name}.",
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} przypisał zgłoszenie #{ticket_id} do: {assigned_to_name}", "assignment_changed", ticket_id)
        return jsonify({"status": "ok"})
