    def default_automation_target(statuses, preferred):
        for candidate in preferred:
            if candidate in statuses:
                return candidate
        for candidate in statuses:
            if candidate not in ("Nowe", "Zamknięte", "Rozwiązane", "Zrealizowane"):
                return candidate
        return statuses[0] if statuses else "Nowe"
    def seed_workflow_automations(cur, workflow_id, statuses):
        cur.execute("SELECT COUNT(*) FROM workflow_automations WHERE workflow_id = %s", (workflow_id,))
        if cur.fetchone()[0] > 0:
            return
        initial_status = statuses[0] if statuses else "Nowe"
        user_target = default_automation_target(statuses, ("Otwarte", "W trakcie", "Diagnostyka", "W realizacji", "Nowe"))
        staff_target = default_automation_target(statuses, ("W trakcie", "Diagnostyka", "Weryfikacja wniosku", "Analiza", "W realizacji", "Otwarte"))
        defaults = [
            ("Status początkowy", "ticket_created", None, None, None, "*", "change_status", initial_status, True, True, 10),
            ("Użytkownik odpowiedział", "comment_added", "Oczekuje na użytkownika", "user", "public", "*", "change_status", user_target, True, True, 20),
            ("Operator rozpoczął obsługę", "comment_added", "Nowe", "staff", "*", "*", "change_status", staff_target, True, True, 30),
        ]
        for name, event_type, condition_status, condition_role, condition_visibility, assigned_state, action_type, action_status, is_active, stop_processing, priority in defaults:
            if action_status and action_status in statuses:
                cur.execute("""
                    INSERT INTO workflow_automations (
                        workflow_id, name, event_type, condition_status, condition_to_status, condition_role,
                        condition_comment_visibility, assigned_state, action_type, action_status,
                        is_active, stop_processing, priority
                    )
                    VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
                    RETURNING id
                """, (
                    workflow_id, name, event_type, condition_status, None, condition_role,
                    condition_visibility, assigned_state, action_type, action_status,
                    is_active, stop_processing, priority,
                ))
                automation_id = cur.fetchone()[0]
                cur.execute("""
                    INSERT INTO workflow_automation_actions (
                        automation_id, action_order, action_type, action_value, is_active
                    )
                    VALUES (%s, 1, %s, %s, TRUE)
                """, (automation_id, action_type, action_status))
    def seed_workflows(cur):
        for key, workflow in WORKFLOWS.items():
            match = workflow.get("match") or {}
            category = match.get("category") or "*"
            subcategory = match.get("subcategory") or "*"
            name = workflow.get("name") or key
            is_default = (key == "default")
            cur.execute("""
                INSERT INTO workflow_definitions (
                    workflow_key, name, category, subcategory, is_default, is_active
                )
                VALUES (%s, %s, %s, %s, %s, TRUE)
                ON CONFLICT (workflow_key) DO NOTHING
            """, (key, name, category, subcategory, is_default))
            cur.execute("SELECT id FROM workflow_definitions WHERE workflow_key = %s", (key,))
            row = cur.fetchone()
            if not row:
                continue
            workflow_id = row[0]
            cur.execute("SELECT COUNT(*) FROM workflow_steps WHERE workflow_id = %s", (workflow_id,))
            statuses = list(workflow.get("statuses") or STANDARD_STATUSES)
            if cur.fetchone()[0] == 0:
                for idx, step_name in enumerate(statuses, start=1):
                    cur.execute("""
                        INSERT INTO workflow_steps (workflow_id, step_name, step_order, is_final)
                        VALUES (%s, %s, %s, %s)
                        ON CONFLICT (workflow_id, step_name) DO NOTHING
                    """, (workflow_id, step_name, idx, step_name == "Zamknięte"))
            seed_workflow_automations(cur, workflow_id, statuses)
    def db_workflow_statuses(workflow_key):
        workflow_key = clean(workflow_key) or "default"
        try:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("""
                SELECT ws.step_name
                FROM workflow_definitions wd
                JOIN workflow_steps ws ON ws.workflow_id = wd.id
                WHERE wd.workflow_key = %s
                  AND wd.is_active = TRUE
                ORDER BY ws.step_order ASC, ws.id ASC
            """, (workflow_key,))
            rows = [r[0] for r in cur.fetchall()]
            cur.close()
            conn.close()
            if rows:
                if "Zamknięte" not in rows:
                    rows.append("Zamknięte")
                return rows
        except Exception:
            pass
        return None
    def workflow_statuses(workflow_key):
        db_statuses = db_workflow_statuses(workflow_key)
        if db_statuses:
            return db_statuses
        workflow = WORKFLOWS.get(workflow_key) or WORKFLOWS["default"]
        statuses = list(workflow.get("statuses") or STANDARD_STATUSES)
        if "Zamknięte" not in statuses:
            statuses.append("Zamknięte")
        return statuses
    def all_statuses():
        values = []
        try:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("""
                SELECT DISTINCT ws.step_name
                FROM workflow_steps ws
                JOIN workflow_definitions wd ON wd.id = ws.workflow_id
                WHERE wd.is_active = TRUE
                ORDER BY ws.step_name
            """)
            for (status,) in cur.fetchall():
                if status not in values:
                    values.append(status)
            cur.close()
            conn.close()
        except Exception:
            values = []
        for workflow in WORKFLOWS.values():
            for status in workflow.get("statuses") or STANDARD_STATUSES:
                if status not in values:
                    values.append(status)
        if "Zamknięte" not in values:
            values.append("Zamknięte")
        return values
    def choose_workflow(category, subcategory):
        category = str(category or "").strip()
        subcategory = str(subcategory or "").strip() or "Inne"
        try:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("""
                SELECT workflow_key, name
                FROM workflow_definitions
                WHERE is_active = TRUE
                  AND category = %s
                  AND subcategory = %s
                ORDER BY is_default ASC, id ASC
                LIMIT 1
            """, (category, subcategory))
            row = cur.fetchone()
            if not row:
                cur.execute("""
                    SELECT workflow_key, name
                    FROM workflow_definitions
                    WHERE is_active = TRUE
                      AND category = %s
                      AND subcategory = '*'
                    ORDER BY is_default ASC, id ASC
                    LIMIT 1
                """, (category,))
                row = cur.fetchone()
            if not row:
                cur.execute("""
                    SELECT workflow_key, name
                    FROM workflow_definitions
                    WHERE is_active = TRUE
                      AND is_default = TRUE
                    ORDER BY id ASC
                    LIMIT 1
                """)
                row = cur.fetchone()
            cur.close()
            conn.close()
            if row:
                return row[0], row[1]
        except Exception:
            pass
        for key, workflow in WORKFLOWS.items():
            if key == "default":
                continue
            match = workflow.get("match") or {}
            if match.get("category") == category and match.get("subcategory") == subcategory:
                return key, workflow["name"]
        for key, workflow in WORKFLOWS.items():
            if key == "default":
                continue
            match = workflow.get("match") or {}
            if match.get("category") == category and match.get("subcategory") == "*":
                return key, workflow["name"]
        return "default", WORKFLOWS["default"]["name"]
    def reopen_status_for_workflow(workflow_key):
        statuses = workflow_statuses(workflow_key)
        if "Otwarte" in statuses:
            return "Otwarte"
        if "Nowe" in statuses:
            return "Nowe"
        for status in statuses:
            if status != "Zamknięte":
                return status
        return "Nowe"
    def workflow_key_from_name(name):
        value = clean(name).lower()
        replacements = {
            "ą": "a", "ć": "c", "ę": "e", "ł": "l", "ń": "n",
            "ó": "o", "ś": "s", "ż": "z", "ź": "z",
        }
        for src, dst in replacements.items():
            value = value.replace(src, dst)
        value = re_sub_non_alnum(value)
        return value or f"workflow_{uuid.uuid4().hex[:8]}"
    def re_sub_non_alnum(value):
        import re
        value = re.sub(r"[^a-z0-9]+", "_", value)
        value = re.sub(r"_+", "_", value).strip("_")
        return value
