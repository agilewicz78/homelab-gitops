        log_audit(cur, user, "ticket_assigned", "ticket", ticket_id, {
            "old_assigned_to_email": old_assigned,
            "new_assigned_to_email": assigned_to_email or None,
            "new_assigned_to_name": assigned_to_name,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "assignment_changed",
            f"Zmieniono przypisanie zgłoszenia #{ticket_id}: {assigned_to_name}.",
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} przypisał zgłoszenie #{ticket_id} do: {assigned_to_name}", "assignment_changed", ticket_id)
        return jsonify({"status": "ok"})
