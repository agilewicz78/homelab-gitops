    \                    ON CONFLICT (email) DO NOTHING\n                \"\"\", (first_name,\
    \ last_name, email, department, role, password_hash))\n\n            cur.execute(\"\
    SELECT COUNT(*) FROM tickets\")\n            count = cur.fetchone()[0]\n     \
    \       if count == 0:\n                for ticket in SEED_TICKETS:\n        \
    \            priority = ticket[6]\n                    sla_due_at = datetime.now()\
    \ + timedelta(hours=SLA_HOURS.get(priority, 48))\n                    cur.execute(\"\
    \"\"\n                        INSERT INTO tickets (\n                        \
    \    title, description, requester_name, requester_email,\n                  \
    \          department, category, priority, status, sla_due_at\n              \
    \          )\n                        VALUES (%s, %s, %s, %s, %s, %s, %s, %s,\
    \ %s)\n                    \"\"\", ticket + (sla_due_at,))\n\n            conn.commit()\n\
    \            cur.close()\n            conn.close()\n            return\n     \
    \   except Exception as e:\n            print(f\"Waiting for database: {e}\",\
