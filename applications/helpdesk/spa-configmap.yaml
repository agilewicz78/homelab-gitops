        function buildPaginationButtons(pagination) {
          const page = Number(pagination.page || 1);
          const totalPages = Number(pagination.total_pages || 1);
          const buttons = [];
          function addButton(label, targetPage, disabled = false, active = false) {
            buttons.push(`
              <button
                class="pagination-btn ${active ? "active" : ""}"
                ${disabled ? "disabled" : ""}
                onclick="goTicketPage(${targetPage})"
              >${label}</button>
            `);
          }
          addButton("«", 1, page <= 1);
          addButton("‹", Math.max(1, page - 1), page <= 1);
          const candidates = [1, totalPages, page - 2, page - 1, page, page + 1, page + 2]
            .filter(p => p >= 1 && p <= totalPages);
          const pages = [...new Set(candidates)].sort((a, b) => a - b);
          let previous = 0;
          for (const p of pages) {
            if (previous && p - previous > 1) {
              buttons.push(`<span class="pagination-ellipsis">…</span>`);
            }
            addButton(String(p), p, false, p === page);
