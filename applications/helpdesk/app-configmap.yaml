    @app.delete("/api/admin/workflows/<int:workflow_id>")
    @api_login_required
    def api_admin_delete_workflow(user, workflow_id):
        if not can_manage_workflow_backend(user):
            return api_forbidden("Brak uprawnienia do zarządzania workflow.", "workflow.manage")
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT workflow_key, is_default FROM workflow_definitions WHERE id = %s", (workflow_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        workflow_key, is_default_workflow = row
        if is_default_workflow:
            cur.close()
            conn.close()
            return jsonify({"error": "Nie można usunąć workflow domyślnego."}), 400
        cur.execute("SELECT COUNT(*) FROM tickets WHERE workflow_key = %s", (workflow_key,))
        ticket_count = cur.fetchone()[0]
        if ticket_count:
            cur.execute("""
                UPDATE workflow_definitions
                SET is_active = FALSE, updated_at = NOW()
                WHERE id = %s
            """, (workflow_id,))
            action = "workflow_deactivated"
        else:
            cur.execute("DELETE FROM workflow_definitions WHERE id = %s", (workflow_id,))
            action = "workflow_deleted"
        log_audit(cur, user, action, "workflow", workflow_id, {
            "workflow_key": workflow_key,
            "ticket_count": ticket_count,
        })
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"status": "ok", "action": action})
