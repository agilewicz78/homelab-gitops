    @app.get("/api/tickets")
    @api_login_required
    
    # Lista zgłoszeń z wyszukiwaniem, filtrowaniem i paginacją.
    def api_tickets(user):
        raw_statuses = clean(request.args.get("statuses")) or clean(request.args.get("status"))
        status_filters = []
        if raw_statuses:
            status_filters = [s.strip() for s in raw_statuses.split(",") if s.strip()]
            invalid = [s for s in status_filters if s not in all_statuses()]
            if invalid:
                return jsonify({"error": "invalid status filter", "invalid": invalid}), 400
        assigned_filter = clean(request.args.get("assigned")) or ""
        priority_filter = clean(request.args.get("priority")) or "all"
        sla_filter = clean(request.args.get("sla")) or "all"
        category_filter = clean(request.args.get("category")) or "all"
        subcategory_filter = clean(request.args.get("subcategory")) or "all"
        requester_filter = clean(request.args.get("requester")) or ""
        created_from = clean(request.args.get("created_from")) or ""
        created_to = clean(request.args.get("created_to")) or ""
        updated_from = clean(request.args.get("updated_from")) or ""
        updated_to = clean(request.args.get("updated_to")) or ""
        search_query = clean(request.args.get("q") or request.args.get("search")) or ""
        sort_by = clean(request.args.get("sort")) or "created_at"
        sort_order = (clean(request.args.get("order")) or "desc").lower()
        if sort_order not in ("asc", "desc"):
            sort_order = "desc"
        try:
            page = max(1, int(request.args.get("page", "1")))
        except ValueError:
            page = 1
        try:
            page_size = int(request.args.get("page_size", "10"))
        except ValueError:
            page_size = 10
        if page_size not in (10, 25, 50):
            page_size = 10
        if priority_filter not in (["all"] + PRIORITIES):
            return jsonify({"error": "invalid priority filter"}), 400
        valid_sla_filters = ["all", "ok", "warning", "overdue", "done", "none"]
        if sla_filter not in valid_sla_filters:
            return jsonify({"error": "invalid sla filter"}), 400
        if category_filter != "all" and category_filter not in CATEGORIES:
            return jsonify({"error": "invalid category filter"}), 400
        all_subcategories = sorted({s for values in SUBCATEGORIES.values() for s in values})
        if subcategory_filter != "all" and subcategory_filter not in all_subcategories:
            return jsonify({"error": "invalid subcategory filter"}), 400
        def valid_date_filter(value):
            if not value:
                return True
            try:
                datetime.strptime(value, "%Y-%m-%d")
                return True
            except ValueError:
                return False
        for date_value in (created_from, created_to, updated_from, updated_to):
            if not valid_date_filter(date_value):
                return jsonify({"error": "invalid date filter"}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT first_name, last_name, email, role, roles
            FROM users
            WHERE 'operator' = ANY(roles)
            ORDER BY last_name, first_name
        """)
        operators = [
            {"name": f"{r[0]} {r[1]}".strip(), "email": r[2], "role": role_label(list(r[4] or ["user"])), "roles": list(r[4] or ["user"])}
            for r in cur.fetchall()
        ]
        operator_emails = {op["email"].lower() for op in operators}
        if is_staff(user):
            if not assigned_filter:
                assigned_filter = "me" if is_operator(user) else "all"
        else:
            assigned_filter = "all"
        base_clauses = []
        base_params = []
        if not is_staff(user):
            base_clauses.append("""(
                lower(t.requester_email) = lower(%s)
                OR EXISTS (
                    SELECT 1
                    FROM ticket_watchers tw
                    WHERE tw.ticket_id = t.id
                      AND lower(tw.user_email) = lower(%s)
                )
            )""")
            base_params.extend([user["email"], user["email"]])
        else:
            if assigned_filter == "me":
                base_clauses.append("lower(t.assigned_to_email) = lower(%s)")
                base_params.append(user["email"])
            elif assigned_filter == "unassigned":
                base_clauses.append("(t.assigned_to_email IS NULL OR t.assigned_to_email = '')")
            elif assigned_filter and assigned_filter != "all":
                if assigned_filter.lower() not in operator_emails:
                    cur.close()
                    conn.close()
                    return jsonify({"error": "invalid assigned filter"}), 400
                base_clauses.append("lower(t.assigned_to_email) = lower(%s)")
                base_params.append(assigned_filter)
        if priority_filter != "all":
            base_clauses.append("t.priority = %s")
            base_params.append(priority_filter)
        if category_filter != "all":
            base_clauses.append("t.category = %s")
            base_params.append(category_filter)
        if subcategory_filter != "all":
            base_clauses.append("COALESCE(t.subcategory, 'Inne') = %s")
            base_params.append(subcategory_filter)
        if requester_filter:
            requester_like = f"%{requester_filter}%"
            base_clauses.append("(t.requester_name ILIKE %s OR t.requester_email ILIKE %s)")
            base_params.extend([requester_like, requester_like])
        if created_from:
            base_clauses.append("t.created_at >= %s::date")
            base_params.append(created_from)
        if created_to:
            base_clauses.append("t.created_at < (%s::date + INTERVAL '1 day')")
            base_params.append(created_to)
        if updated_from:
            base_clauses.append("t.updated_at >= %s::date")
            base_params.append(updated_from)
        if updated_to:
            base_clauses.append("t.updated_at < (%s::date + INTERVAL '1 day')")
            base_params.append(updated_to)
        if sla_filter == "none":
            base_clauses.append("t.sla_due_at IS NULL")
        elif sla_filter == "done":
            base_clauses.append("t.status IN ('Rozwiązane', 'Zamknięte')")
        elif sla_filter == "overdue":
            base_clauses.append("t.status NOT IN ('Rozwiązane', 'Zamknięte') AND t.sla_due_at IS NOT NULL AND t.sla_due_at < NOW()")
        elif sla_filter == "warning":
            base_clauses.append("t.status NOT IN ('Rozwiązane', 'Zamknięte') AND t.sla_due_at IS NOT NULL AND t.sla_due_at >= NOW() AND t.sla_due_at <= NOW() + INTERVAL '4 hours'")
        elif sla_filter == "ok":
            base_clauses.append("t.status NOT IN ('Rozwiązane', 'Zamknięte') AND t.sla_due_at IS NOT NULL AND t.sla_due_at > NOW() + INTERVAL '4 hours'")
        base_where_sql = "WHERE " + " AND ".join(base_clauses) if base_clauses else ""
        filtered_clauses = list(base_clauses)
        filtered_params = list(base_params)
        if status_filters:
            placeholders = ",".join(["%s"] * len(status_filters))
            filtered_clauses.append(f"t.status IN ({placeholders})")
            filtered_params.extend(status_filters)
        if search_query:
            search_terms = []
            search_params = []
            numeric_match = None
            normalized_search = search_query.strip()
            if normalized_search.startswith("#"):
                normalized_search = normalized_search[1:].strip()
            if normalized_search.isdigit():
                numeric_match = int(normalized_search)
            if numeric_match is not None:
                search_terms.append("t.id = %s")
                search_params.append(numeric_match)
            like = f"%{search_query}%"
            search_terms.extend([
                "CAST(t.id AS TEXT) ILIKE %s",
                "t.title ILIKE %s",
                "t.description ILIKE %s",
                "t.requester_name ILIKE %s",
                "t.requester_email ILIKE %s",
                "t.department ILIKE %s",
                "t.category ILIKE %s",
                "COALESCE(t.subcategory, '') ILIKE %s",
                "COALESCE(t.workflow_name, '') ILIKE %s",
                "t.status ILIKE %s",
                "t.priority ILIKE %s",
                "COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email, '') ILIKE %s",
                "COALESCE(t.assigned_to_email, '') ILIKE %s",
            ])
            search_params.extend([like] * 13)
            filtered_clauses.append("(" + " OR ".join(search_terms) + ")")
            filtered_params.extend(search_params)
        filtered_where_sql = "WHERE " + " AND ".join(filtered_clauses) if filtered_clauses else ""
        cur.execute(f"""
            SELECT
              COUNT(*),
              COUNT(*) FILTER (WHERE t.status = 'Nowe'),
              COUNT(*) FILTER (WHERE t.status = 'W trakcie'),
              COUNT(*) FILTER (WHERE t.priority IN ('Wysoki', 'Krytyczny')),
              COUNT(*) FILTER (WHERE t.status IN ('Rozwiązane', 'Zamknięte'))
            FROM tickets t
            {base_where_sql}
        """, tuple(base_params))
        total, new_count, in_progress, high_count, resolved_count = cur.fetchone()
        cur.execute(f"""
            SELECT COUNT(*)
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            {filtered_where_sql}
        """, tuple(filtered_params))
        total_filtered = cur.fetchone()[0] or 0
        total_pages = max(1, (total_filtered + page_size - 1) // page_size)
        if page > total_pages:
            page = total_pages
        offset = (page - 1) * page_size
        sort_map = {
            "id": "t.id",
            "created_at": "t.created_at",
            "updated_at": "t.updated_at",
            "priority": "CASE t.priority WHEN 'Krytyczny' THEN 1 WHEN 'Wysoki' THEN 2 WHEN 'Normalny' THEN 3 WHEN 'Niski' THEN 4 ELSE 5 END",
            "status": "t.status",
            "sla": "t.sla_due_at",
            "requester": "t.requester_name",
            "operator": "COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email, '')",
        }
        sort_expr = sort_map.get(sort_by, "t.created_at")
        nulls = "NULLS LAST"
        cur.execute(f"""
            SELECT t.id, t.title, t.requester_name, t.requester_email, t.department, t.category, COALESCE(t.subcategory, 'Inne') AS subcategory,
                   t.priority, t.status, t.created_at, t.updated_at, t.assigned_to_email,
                   COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
                   t.sla_due_at,
                   t.resolution_minutes,
                   t.closed_at,
                   t.closed_by_email,
                   COALESCE(NULLIF(trim(concat(cu.first_name, ' ', cu.last_name)), ''), t.closed_by_email) AS closed_by_name,
                   t.resolution_summary,
                   COALESCE(t.workflow_key, 'default') AS workflow_key,
                   COALESCE(t.workflow_name, %s) AS workflow_name,
                   t.first_response_due_at,
                   t.first_response_at
            FROM tickets t
            LEFT JOIN users cu ON lower(cu.email) = lower(t.closed_by_email)
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            {filtered_where_sql}
            ORDER BY {sort_expr} {sort_order.upper()} {nulls}, t.id DESC
            LIMIT %s OFFSET %s
        """, tuple([WORKFLOWS["default"]["name"]] + filtered_params + [page_size, offset]))
        rows = cur.fetchall()
        cur.close()
        conn.close()
        tickets = []
        for row in rows:
            tickets.append({
                "id": row[0],
                "title": row[1],
                "requester_name": row[2],
                "requester_email": row[3],
                "department": row[4],
                "category": row[5],
                "subcategory": row[6],
                "priority": row[7],
                "status": row[8],
                "created_at": str(row[9]),
                "updated_at": str(row[10]),
                "assigned_to_email": row[11],
                "assigned_to_name": row[12],
                "sla_due_at": str(row[13]) if row[13] else "",
                "workflow_key": row[19] or "default",
                "workflow_name": row[20] or WORKFLOWS["default"]["name"],
                "sla_state": sla_state(row[13], row[8]),
            })
        return jsonify({
            "stats": {
                "total": total,
                "new": new_count,
                "in_progress": in_progress,
                "high": high_count,
                "resolved": resolved_count,
            },
            "tickets": tickets,
            "statuses": all_statuses(),
            "priorities": PRIORITIES,
            "categories": SUBCATEGORIES,
            "operators": operators,
            "sla_options": ["all", "ok", "warning", "overdue", "done", "none"],
            "selected_statuses": status_filters,
            "selected_assigned": assigned_filter,
            "selected_priority": priority_filter,
            "selected_sla": sla_filter,
            "selected_category": category_filter,
            "selected_subcategory": subcategory_filter,
            "requester": requester_filter,
            "created_from": created_from,
            "created_to": created_to,
            "updated_from": updated_from,
            "updated_to": updated_to,
            "search": search_query,
            "sort": sort_by,
            "order": sort_order,
            "pagination": {
                "page": page,
                "page_size": page_size,
                "total_filtered": total_filtered,
                "total_pages": total_pages,
            },
        })
    @app.get("/api/dashboard")
    @api_login_required
    
    # Dane dashboardu głównego.
    def api_dashboard(user):
        # Dashboard jest kontrolowany tym samym uprawnieniem, które steruje menu UI.
        if not has_permission(user, "dashboard.operator"):
            return api_forbidden("Brak uprawnienia do dashboardu.", "dashboard.operator")
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT
              COUNT(*),
              COUNT(*) FILTER (WHERE status = 'Nowe'),
              COUNT(*) FILTER (WHERE status = 'W trakcie'),
              COUNT(*) FILTER (WHERE status NOT IN ('Rozwiązane', 'Zamknięte') AND sla_due_at IS NOT NULL AND sla_due_at < NOW()),
              COUNT(*) FILTER (WHERE assigned_to_email IS NULL OR assigned_to_email = '')
            FROM tickets
        """)
        total, new_count, in_progress_count, overdue_sla_count, unassigned_count = cur.fetchone()
        cur.execute("""
            SELECT status, COUNT(*)
            FROM tickets
            GROUP BY status
            ORDER BY array_position(ARRAY['Nowe','Otwarte','W trakcie','Oczekuje na użytkownika','Oczekuje na dostawcę','Rozwiązane','Zamknięte'], status)
        """)
        by_status = [{"label": r[0], "value": r[0], "count": r[1]} for r in cur.fetchall()]
        cur.execute("""
            SELECT priority, COUNT(*)
            FROM tickets
            GROUP BY priority
            ORDER BY CASE priority
              WHEN 'Krytyczny' THEN 1
              WHEN 'Wysoki' THEN 2
              WHEN 'Normalny' THEN 3
              WHEN 'Niski' THEN 4
              ELSE 5
            END
        """)
        by_priority = [{"label": r[0], "value": r[0], "count": r[1]} for r in cur.fetchall()]
        cur.execute("""
            SELECT sla_state, COUNT(*)
            FROM (
              SELECT
                CASE
                  WHEN status IN ('Rozwiązane', 'Zamknięte') THEN 'done'
                  WHEN sla_due_at IS NULL THEN 'none'
                  WHEN sla_due_at < NOW() THEN 'overdue'
                  WHEN sla_due_at <= NOW() + INTERVAL '4 hours' THEN 'warning'
                  ELSE 'ok'
                END AS sla_state
              FROM tickets
            ) x
            GROUP BY sla_state
            ORDER BY CASE sla_state
              WHEN 'overdue' THEN 1
              WHEN 'warning' THEN 2
              WHEN 'ok' THEN 3
              WHEN 'done' THEN 4
              ELSE 5
            END
        """)
        by_sla = [{"label": r[0], "value": r[0], "count": r[1]} for r in cur.fetchall()]
        cur.execute("""
            SELECT COALESCE(NULLIF(category, ''), 'Brak kategorii') AS label, COUNT(*)
            FROM tickets
            GROUP BY label
            ORDER BY COUNT(*) DESC, label ASC
            LIMIT 12
        """)
        by_category = [{"label": r[0], "value": r[0], "count": r[1]} for r in cur.fetchall()]
        cur.execute("""
            SELECT COALESCE(NULLIF(subcategory, ''), 'Inne') AS label, COUNT(*)
            FROM tickets
            GROUP BY label
            ORDER BY COUNT(*) DESC, label ASC
            LIMIT 12
        """)
        by_subcategory = [{"label": r[0], "value": r[0], "count": r[1]} for r in cur.fetchall()]
        cur.execute("""
            SELECT COALESCE(NULLIF(department, ''), 'Brak działu') AS label, COUNT(*)
            FROM tickets
            GROUP BY label
            ORDER BY COUNT(*) DESC, label ASC
            LIMIT 12
        """)
        by_department = [{"label": r[0], "value": r[0], "count": r[1]} for r in cur.fetchall()]
        cur.execute("""
            SELECT
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), NULLIF(t.assigned_to_email, ''), 'Nieprzypisane') AS label,
              COALESCE(NULLIF(t.assigned_to_email, ''), 'unassigned') AS value,
              COUNT(*)
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            GROUP BY label, value
            ORDER BY COUNT(*) DESC, label ASC
        """)
        by_operator = [{"label": r[0], "value": r[1], "count": r[2]} for r in cur.fetchall()]
        cur.close()
        conn.close()
        return jsonify({
            "summary": {
                "total": total,
                "new": new_count,
                "in_progress": in_progress_count,
                "overdue_sla": overdue_sla_count,
                "unassigned": unassigned_count,
            },
            "by_status": by_status,
            "by_priority": by_priority,
            "by_sla": by_sla,
            "by_category": by_category,
            "by_subcategory": by_subcategory,
            "by_department": by_department,
            "by_operator": by_operator,
        })
    
    # Buduje dane raportowe dla zakresu dat.
    def build_reports_payload(date_from_arg=None, date_to_arg=None):
        def parse_report_date(value, fallback):
            try:
                if not value:
                    return fallback
                return datetime.strptime(value[:10], "%Y-%m-%d")
            except Exception:
                return fallback
    
        today = datetime.now().replace(hour=0, minute=0, second=0, microsecond=0)
        date_to = parse_report_date(date_to_arg, today)
        date_from = parse_report_date(date_from_arg, date_to - timedelta(days=29))
        if date_from > date_to:
            date_from, date_to = date_to, date_from
        date_to_exclusive = date_to + timedelta(days=1)
    
        conn = get_conn()
        cur = conn.cursor()
    
        cur.execute("SELECT COUNT(*) FROM tickets")
        total_now = cur.fetchone()[0]
    
        cur.execute("""
            SELECT
              COUNT(*) FILTER (WHERE created_at >= %s AND created_at < %s) AS created_count,
              COUNT(*) FILTER (WHERE status NOT IN ('Rozwiązane', 'Zamknięte')) AS open_now,
              COUNT(*) FILTER (WHERE status NOT IN ('Rozwiązane', 'Zamknięte') AND sla_due_at IS NOT NULL AND sla_due_at < NOW()) AS overdue_sla_now,
              ROUND(AVG(EXTRACT(EPOCH FROM (first_response_at - created_at)) / 3600.0) FILTER (
                WHERE created_at >= %s AND created_at < %s AND first_response_at IS NOT NULL
              )::numeric, 2) AS avg_first_response_hours
            FROM tickets
        """, (date_from, date_to_exclusive, date_from, date_to_exclusive))
        created_count, open_now, overdue_sla_now, avg_first_response_hours = cur.fetchone()
    
        cur.execute("""
            WITH resolved AS (
              SELECT ticket_id, MIN(created_at) AS resolved_at
              FROM ticket_status_history
              WHERE new_status IN ('Rozwiązane', 'Zamknięte')
              GROUP BY ticket_id
            )
            SELECT
              COUNT(*) FILTER (WHERE r.resolved_at >= %s AND r.resolved_at < %s) AS resolved_count,
              ROUND(AVG(EXTRACT(EPOCH FROM (r.resolved_at - t.created_at)) / 3600.0) FILTER (
                WHERE r.resolved_at >= %s AND r.resolved_at < %s
              )::numeric, 2) AS avg_resolution_hours
            FROM resolved r
            JOIN tickets t ON t.id = r.ticket_id
        """, (date_from, date_to_exclusive, date_from, date_to_exclusive))
        resolved_count, avg_resolution_hours = cur.fetchone()
    
        cur.execute("""
            SELECT priority AS label, priority AS value, COUNT(*) AS count
            FROM tickets
            WHERE created_at >= %s AND created_at < %s
            GROUP BY priority
            ORDER BY CASE priority
              WHEN 'Krytyczny' THEN 1
              WHEN 'Wysoki' THEN 2
              WHEN 'Normalny' THEN 3
              WHEN 'Niski' THEN 4
              ELSE 5
            END
        """, (date_from, date_to_exclusive))
        by_priority = [{"label": r[0], "value": r[1], "count": r[2]} for r in cur.fetchall()]
    
        cur.execute("""
            SELECT COALESCE(NULLIF(category, ''), 'Brak kategorii') AS label,
                   COALESCE(NULLIF(category, ''), 'Brak kategorii') AS value,
                   COUNT(*) AS count
            FROM tickets
            WHERE created_at >= %s AND created_at < %s
            GROUP BY label, value
            ORDER BY count DESC, label ASC
            LIMIT 15
        """, (date_from, date_to_exclusive))
        by_category = [{"label": r[0], "value": r[1], "count": r[2]} for r in cur.fetchall()]
    
        cur.execute("""
            SELECT status AS label, status AS value, COUNT(*) AS count
            FROM tickets
            GROUP BY status
            ORDER BY array_position(ARRAY['Nowe','Otwarte','W trakcie','Oczekuje na użytkownika','Oczekuje na dostawcę','Rozwiązane','Zamknięte'], status)
        """)
        by_status = [{"label": r[0], "value": r[1], "count": r[2]} for r in cur.fetchall()]
    
        cur.execute("""
            SELECT
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), NULLIF(t.assigned_to_email, ''), 'Nieprzypisane') AS label,
              COALESCE(NULLIF(t.assigned_to_email, ''), 'unassigned') AS value,
              COUNT(*) AS count
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            GROUP BY label, value
            ORDER BY count DESC, label ASC
        """)
        by_operator = [{"label": r[0], "value": r[1], "count": r[2]} for r in cur.fetchall()]
    
        cur.execute("""
            WITH days AS (
              SELECT generate_series(%s::date, %s::date, interval '1 day')::date AS day
            ), created AS (
              SELECT created_at::date AS day, COUNT(*) AS count
              FROM tickets
              WHERE created_at >= %s AND created_at < %s
              GROUP BY created_at::date
            ), resolved AS (
              SELECT created_at::date AS day, COUNT(DISTINCT ticket_id) AS count
              FROM ticket_status_history
              WHERE new_status IN ('Rozwiązane', 'Zamknięte')
                AND created_at >= %s AND created_at < %s
              GROUP BY created_at::date
            )
            SELECT days.day::text, COALESCE(created.count, 0), COALESCE(resolved.count, 0)
            FROM days
            LEFT JOIN created ON created.day = days.day
            LEFT JOIN resolved ON resolved.day = days.day
            ORDER BY days.day ASC
        """, (date_from.date(), date_to.date(), date_from, date_to_exclusive, date_from, date_to_exclusive))
        by_day = [{"day": r[0], "created": r[1], "resolved": r[2]} for r in cur.fetchall()]
    
        cur.close()
        conn.close()
    
        return {
            "date_from": date_from.strftime("%Y-%m-%d"),
            "date_to": date_to.strftime("%Y-%m-%d"),
            "summary": {
                "total_now": total_now,
                "created": created_count or 0,
                "resolved": resolved_count or 0,
                "open_now": open_now or 0,
                "overdue_sla_now": overdue_sla_now or 0,
                "avg_first_response_hours": float(avg_first_response_hours) if avg_first_response_hours is not None else None,
                "avg_resolution_hours": float(avg_resolution_hours) if avg_resolution_hours is not None else None,
            },
            "by_priority": by_priority,
            "by_category": by_category,
            "by_status": by_status,
            "by_operator": by_operator,
            "by_day": by_day,
        }
    
