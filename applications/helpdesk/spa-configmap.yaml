      .module-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 14px 0 4px; }
      .module-card { display: grid; gap: 10px; align-content: start; border: 1px solid var(--border); border-radius: 18px; padding: 15px; background: rgba(31,41,55,.58); }
      .module-card.active { border-color: rgba(56,189,248,.78); background: linear-gradient(135deg, rgba(2,132,199,.24), rgba(31,41,55,.74)); box-shadow: 0 16px 32px rgba(0,0,0,.22); }
      .module-card h3 { margin: 0; }
