          position: static;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          align-items: stretch;
        }
        .operator-sidebar-title { grid-column: 1 / -1; }
        .ticket-side-column { position: static; }
        .operator-side-panel { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      }
      @media (max-width: 860px) {
        header,
        .topbar,
        .ticket-top-actions,
        .ticket-section-title,
        .switch-row,
        .attachment-item,
        .watcher-item {
          flex-direction: column;
          align-items: stretch;
        }
        .header-actions,
        .notification-wrapper { align-items: stretch; justify-content: stretch; }
        .badge,
        .live-panel { width: 100%; min-width: 0; white-space: normal; }
        .grid,
        .filter-grid { grid-template-columns: 1fr; }
        .notification-card { grid-template-columns: 1fr; }
        .notification-item-actions { justify-content: flex-start; }
        table { font-size: 14px; }
      }
      @media (max-width: 720px) {
        .page { padding: 20px 10px; }
        .card,
        .operator-hero,
        .modal-card { padding: 16px; border-radius: 18px; }
