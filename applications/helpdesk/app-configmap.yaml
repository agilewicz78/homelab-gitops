    @api_login_required
    @api_admin_required
    def api_admin_update_sla_policies(user):
        payload = request.get_json(silent=True) or {}
        policies = payload.get("policies") or []
        conn = get_conn()
        cur = conn.cursor()
        updated = []
        for item in policies:
            priority = clean(item.get("priority"))
            if priority not in PRIORITIES:
                continue
            try:
                first_response_hours = max(1, min(int(item.get("first_response_hours") or 1), 24 * 30))
                resolution_hours = max(first_response_hours, min(int(item.get("resolution_hours") or first_response_hours), 24 * 365))
                warning_hours = max(1, min(int(item.get("warning_hours") or 4), resolution_hours))
            except Exception:
                cur.close()
                conn.close()
                return jsonify({"error": f"Nieprawidłowa wartość SLA dla priorytetu {priority}."}), 400
            cur.execute("""
                INSERT INTO sla_policies (priority, first_response_hours, resolution_hours, warning_hours, is_active, updated_at)
                VALUES (%s, %s, %s, %s, TRUE, NOW())
                ON CONFLICT (priority) DO UPDATE SET
                    first_response_hours = EXCLUDED.first_response_hours,
                    resolution_hours = EXCLUDED.resolution_hours,
                    warning_hours = EXCLUDED.warning_hours,
                    is_active = TRUE,
                    updated_at = NOW()
            """, (priority, first_response_hours, resolution_hours, warning_hours))
            updated.append(priority)
        log_audit(cur, user, "sla_policies_updated", "sla_policies", None, {"priorities": updated})
        conn.commit()
        cur.close()
        conn.close()
        publish_event("Zaktualizowano polityki SLA", "sla_policies_updated", None, staff_only=True)
        return jsonify({"status": "ok", "updated": updated})
    @app.post("/api/sla/check")
    @api_login_required
    @api_staff_required
    
    # Ręczne sprawdzenie SLA i utworzenie powiadomień.
    def api_sla_check(user):
        """Ręczne sprawdzenie SLA i wygenerowanie powiadomień dla operatorów.
        Docelowo ten endpoint można wywoływać cyklicznie z CronJob w Kubernetes.
        """
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT
              t.id,
              t.title,
              t.priority,
              t.status,
              t.first_response_due_at,
              t.first_response_at,
              t.sla_due_at,
              t.first_response_warning_notified_at,
              t.first_response_overdue_notified_at,
              t.sla_warning_notified_at,
              t.sla_overdue_notified_at
            FROM tickets t
            WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')
              AND (t.first_response_due_at IS NOT NULL OR t.sla_due_at IS NOT NULL)
            ORDER BY COALESCE(t.sla_due_at, t.first_response_due_at) ASC, t.id ASC
        """)
        rows = cur.fetchall()
        now = datetime.now()
        counters = {
            "first_response_warning": 0,
            "first_response_overdue": 0,
            "resolution_warning": 0,
            "resolution_overdue": 0,
        }
        for row in rows:
            ticket_id, title, priority, status, first_due, first_at, resolution_due, first_warn_sent, first_over_sent, resolution_warn_sent, resolution_over_sent = row
            policy = sla_policy_for_priority(cur, priority)
            warning_delta = timedelta(hours=policy["warning_hours"])
            recipients = ticket_notification_recipients(cur, ticket_id, "sla")
            if first_due and not first_at:
                if first_due < now and not first_over_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_first_response_overdue", f"SLA reakcji przekroczone dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_first_response_overdue", "Przekroczono SLA pierwszej reakcji.")
                    cur.execute("UPDATE tickets SET first_response_overdue_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["first_response_overdue"] += 1
                elif first_due - now <= warning_delta and not first_warn_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_first_response_warning", f"Zbliża się SLA reakcji dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_first_response_warning", "Zbliża się termin SLA pierwszej reakcji.")
                    cur.execute("UPDATE tickets SET first_response_warning_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["first_response_warning"] += 1
            if resolution_due:
                if resolution_due < now and not resolution_over_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_resolution_overdue", f"SLA rozwiązania przekroczone dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_resolution_overdue", "Przekroczono SLA rozwiązania zgłoszenia.")
                    cur.execute("UPDATE tickets SET sla_overdue_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["resolution_overdue"] += 1
                elif resolution_due - now <= warning_delta and not resolution_warn_sent:
                    create_notifications(cur, recipients, ticket_id, "sla_resolution_warning", f"Zbliża się SLA rozwiązania dla zgłoszenia #{ticket_id}: {title}", actor_email=None)
                    add_ticket_event(cur, ticket_id, None, "sla_resolution_warning", "Zbliża się termin SLA rozwiązania zgłoszenia.")
                    cur.execute("UPDATE tickets SET sla_warning_notified_at = NOW() WHERE id = %s", (ticket_id,))
                    counters["resolution_warning"] += 1
        log_audit(cur, user, "sla_check_run", "sla", None, counters)
        conn.commit()
        cur.close()
        conn.close()
        publish_event("Sprawdzono SLA zgłoszeń", "sla_check_run", None, staff_only=True)
        return jsonify({"status": "ok", "notifications": counters})
    @app.post("/api/tickets")
    @api_login_required
    
    # Tworzenie nowego zgłoszenia wraz z workflow i SLA.
    def api_create_ticket(user):
        payload = request.get_json(silent=True) or {}
        title = clean(payload.get("title"))
        description = clean(payload.get("description"))
        category = clean(payload.get("category"))
        subcategory = clean(payload.get("subcategory")) or "Inne"
        priority = clean(payload.get("priority")) or "Normalny"
        if not title or not description:
            return jsonify({"error": "title and description are required"}), 400
        if priority not in PRIORITIES:
            return jsonify({"error": "Nieprawidłowy priorytet."}), 400
        if category not in CATEGORIES:
            return jsonify({"error": "Nieprawidłowa kategoria."}), 400
        if subcategory not in SUBCATEGORIES.get(category, ["Inne"]):
            return jsonify({"error": "Nieprawidłowa podkategoria."}), 400
        conn = get_conn()
        cur = conn.cursor()
        first_response_due_at, sla_due_at = sla_times_for_priority(cur, priority)
        workflow_key, workflow_name = choose_workflow(category, subcategory)
        initial_status = workflow_initial_status(cur, workflow_key)
        cur.execute("""
            INSERT INTO tickets (
                title, description, requester_name, requester_email,
                department, category, subcategory, priority, status,
                first_response_due_at, sla_due_at,
                workflow_key, workflow_name
            )
            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
            RETURNING id
        """, (
            title, description, user["name"], user["email"],
            user["department"], category, subcategory, priority, initial_status,
            first_response_due_at, sla_due_at,
            workflow_key, workflow_name,
        ))
        ticket_id = cur.fetchone()[0]
        workflow_watchers = add_workflow_watchers_to_ticket(cur, ticket_id, workflow_key)
        add_ticket_event(cur, ticket_id, user, "ticket_created", f"Utworzono zgłoszenie: {title}")
        log_audit(cur, user, "ticket_created", "ticket", ticket_id, {
            "title": title,
            "category": category,
            "subcategory": subcategory,
            "priority": priority,
            "workflow_key": workflow_key,
            "workflow_name": workflow_name,
            "workflow_watchers": workflow_watchers,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "ticket_created",
            f"Utworzono zgłoszenie #{ticket_id}: {title}",
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} utworzył zgłoszenie #{ticket_id}: {title}", "ticket_created", ticket_id)
        return jsonify({"id": ticket_id}), 201
    
    # Sprawdza, czy użytkownik może zobaczyć dane zgłoszenie.
    def can_view_ticket(user, ticket_id):
        if not user:
            return False
        # Operatorzy i admini mogą widzieć wszystkie zgłoszenia oraz ich załączniki.
        if is_staff(user):
            return True
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT
              requester_email,
              assigned_to_email,
              EXISTS (
                SELECT 1
                FROM ticket_watchers tw
                WHERE tw.ticket_id = tickets.id
                  AND lower(tw.user_email) = lower(%s)
              ) AS is_watcher
            FROM tickets
            WHERE id = %s
        """, (user.get("email") or "", ticket_id))
        row = cur.fetchone()
        cur.close()
        conn.close()
        if not row:
            return False
        requester_email, assigned_to_email, is_watcher = row
        user_email = (user.get("email") or "").lower()
        return bool(
            user_email
            and (
                user_email == (requester_email or "").lower()
                or user_email == (assigned_to_email or "").lower()
                or is_watcher
            )
        )
    def get_ticket_status_for_update(cur, ticket_id):
        cur.execute("SELECT status FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        if not row:
            return None
        return row[0]
    def ensure_ticket_mutable(cur, ticket_id):
        status = get_ticket_status_for_update(cur, ticket_id)
        if status is None:
            return False, jsonify({"error": "not found"}), 404
        if status == "Zamknięte":
            return False, jsonify({"error": "Zgłoszenie jest zamknięte i dostępne tylko do odczytu."}), 400
        return True, status, None
    def workflow_first_active_status_after_new(statuses):
        skipped = {"Nowe", "Zamknięte", "Rozwiązane", "Zrealizowane"}
        for candidate in statuses:
            if candidate not in skipped:
                return candidate
        return None
    
    # Główny silnik wykonywania reguł workflow dla zdarzeń.
    def apply_workflow_event_rules(cur, ticket_id, user, event_type, current_status, visibility=None, event_new_status=None):
        """
        Elastyczne reguły workflow: zdarzenie + warunki + wiele akcji.
        Logujemy zarówno reguły dopasowane, jak i niedopasowane, żeby administrator
        widział dlaczego automatyzacja wykonała się albo została pominięta.
        """
        if current_status == "Zamknięte":
            return []
        cur.execute("""
            SELECT COALESCE(workflow_key, 'default'), assigned_to_email, priority, category, subcategory, sla_due_at, status
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        row = cur.fetchone()
        workflow_key = row[0] if row else "default"
        assigned_to_email = row[1] if row else None
        current_priority = row[2] if row and row[2] else None
        ticket_category = row[3] if row and row[3] else None
        ticket_subcategory = row[4] if row and row[4] else None
        ticket_sla_due_at = row[5] if row and row[5] else None
        ticket_sla_state = sla_state(ticket_sla_due_at, row[6] if row and row[6] else current_status)
        ticket_context = {
            "priority": current_priority,
            "category": ticket_category,
            "subcategory": ticket_subcategory,
            "sla_state": ticket_sla_state,
        }
        workflow_id = workflow_id_by_key(cur, workflow_key)
        statuses = workflow_statuses(workflow_key)
        rules = workflow_automation_candidates_for_event(cur, workflow_key, event_type, current_status, user, visibility, assigned_to_email, event_new_status)
        executed = []
        effective_status = event_new_status or current_status
        stopped_by_rule = None
        for rule in rules:
            rule_name = rule.get("name") or "Reguła workflow"
            if stopped_by_rule:
                log_workflow_rule_execution(
                    cur,
                    rule.get("id"),
                    rule.get("workflow_id") or workflow_id,
                    rule.get("workflow_key") or workflow_key,
                    ticket_id,
                    event_type,
                    matched=False,
                    actions_executed=[],
                    reason=f"pominięta, bo wcześniejsza reguła zatrzymała przetwarzanie: {stopped_by_rule}",
                    user=user,
                    current_status=current_status,
                    event_new_status=event_new_status,
                )
                continue
            matched, match_reason = workflow_automation_match_result(rule, current_status, user, visibility, assigned_to_email, event_new_status, ticket_context=ticket_context)
            if not matched:
                log_workflow_rule_execution(
                    cur,
                    rule.get("id"),
                    rule.get("workflow_id") or workflow_id,
                    rule.get("workflow_key") or workflow_key,
                    ticket_id,
                    event_type,
                    matched=False,
                    actions_executed=[],
                    reason=match_reason,
                    user=user,
                    current_status=current_status,
                    event_new_status=event_new_status,
                )
                continue
            action_executed = False
            action_results = []
            actions = rule.get("actions") or [{
                "action_type": rule.get("action_type") or "change_status",
                "action_value": rule.get("action_status"),
                "is_active": True,
                "action_order": 1,
            }]
            for action in actions:
                if action.get("is_active") is False:
                    action_results.append({
                        "action_type": action.get("action_type") or "change_status",
                        "result": "skipped",
                        "reason": "akcja nieaktywna",
                    })
                    continue
                action_type = action.get("action_type") or "change_status"
                if action_type == "change_status":
                    target_status = action.get("action_value") or rule.get("action_status")
                    if not target_status:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "brak statusu docelowego"})
                        continue
                    if target_status not in statuses:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "status docelowy nie istnieje w workflow", "target_status": target_status})
                        continue
                    if target_status == effective_status:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "status docelowy jest taki sam", "target_status": target_status})
                        continue
                    old_status = effective_status
                    cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (target_status, ticket_id))
                    add_ticket_status_history(
                        cur,
                        ticket_id,
                        user,
                        old_status,
                        target_status,
                        workflow_rule_names=[rule_name],
                        source="workflow_rule",
                    )
                    message = f"Reguła workflow „{rule_name}” zmieniła status z {old_status} na {target_status}."
                    add_ticket_event(cur, ticket_id, user, "workflow_rule_status_changed", message)
                    log_audit(cur, user, "workflow_rule_status_changed", "ticket", ticket_id, {
                        "rule": rule_name,
                        "event_type": event_type,
                        "old_status": old_status,
                        "new_status": target_status,
                        "workflow_key": workflow_key,
                    })
                    create_ticket_notifications(
                        cur,
                        ticket_id,
                        "workflow_rule_status_changed",
                        f"Status zgłoszenia #{ticket_id} został automatycznie zmieniony z {old_status} na {target_status}.",
                        actor_email=user["email"],
                    )
                    executed.append({
                        "rule": rule_name,
                        "action_type": action_type,
                        "old_status": old_status,
                        "new_status": target_status,
                    })
                    action_results.append({
                        "action_type": action_type,
                        "result": "executed",
                        "old_status": old_status,
                        "new_status": target_status,
                    })
                    action_executed = True
                    effective_status = target_status
                elif action_type == "change_priority":
                    target_priority = action.get("action_value")
                    if not target_priority:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "brak priorytetu docelowego"})
                        continue
                    if target_priority not in PRIORITIES:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "priorytet docelowy nie istnieje", "target_priority": target_priority})
                        continue
                    if target_priority == current_priority:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "priorytet docelowy jest taki sam", "target_priority": target_priority})
                        continue
                    old_priority = current_priority
                    cur.execute("UPDATE tickets SET priority = %s, updated_at = NOW() WHERE id = %s", (target_priority, ticket_id))
                    add_ticket_event(cur, ticket_id, user, "workflow_rule_priority_changed", f"Reguła workflow „{rule_name}” zmieniła priorytet z {old_priority or '—'} na {target_priority}.")
                    log_audit(cur, user, "workflow_rule_priority_changed", "ticket", ticket_id, {
                        "rule": rule_name,
                        "event_type": event_type,
                        "old_priority": old_priority,
                        "new_priority": target_priority,
                        "workflow_key": workflow_key,
                    })
                    create_ticket_notifications(
                        cur,
                        ticket_id,
                        "workflow_rule_priority_changed",
                        f"Priorytet zgłoszenia #{ticket_id} został automatycznie zmieniony z {old_priority or '—'} na {target_priority}.",
                        actor_email=user["email"],
                    )
                    executed.append({"rule": rule_name, "action_type": action_type, "old_priority": old_priority, "new_priority": target_priority})
                    action_results.append({"action_type": action_type, "result": "executed", "old_priority": old_priority, "new_priority": target_priority})
                    action_executed = True
                    current_priority = target_priority
                elif action_type == "add_workflow_watchers":
                    added = add_workflow_watchers_to_ticket(cur, ticket_id, workflow_key)
                    executed.append({"rule": rule_name, "action_type": action_type, "added_watchers": added})
                    action_results.append({"action_type": action_type, "result": "executed", "added_watchers": added})
                    action_executed = True
                elif action_type == "add_system_comment":
                    comment_text = action.get("action_value") or "Reguła workflow została wykonana."
                    cur.execute("""
                        INSERT INTO comments (ticket_id, author, author_email, content, visibility)
                        VALUES (%s, %s, %s, %s, %s)
                    """, (ticket_id, "System workflow", None, comment_text, "internal"))
                    add_ticket_event(cur, ticket_id, user, "workflow_rule_system_comment", f"Reguła workflow „{rule_name}” dodała komentarz systemowy: {comment_text[:120]}")
                    executed.append({"rule": rule_name, "action_type": action_type, "comment": comment_text})
                    action_results.append({"action_type": action_type, "result": "executed", "comment": comment_text})
                    action_executed = True
                elif action_type == "notify":
                    create_ticket_notifications(
                        cur,
                        ticket_id,
                        "workflow_rule_notification",
                        f"Reguła workflow „{rule_name}” została uruchomiona dla zgłoszenia #{ticket_id}.",
                        actor_email=user["email"],
                    )
                    executed.append({"rule": rule_name, "action_type": action_type})
                    action_results.append({"action_type": action_type, "result": "executed"})
                    action_executed = True
                elif action_type == "add_history":
                    add_ticket_event(cur, ticket_id, user, "workflow_rule_history", f"Uruchomiono regułę workflow „{rule_name}”.")
                    executed.append({"rule": rule_name, "action_type": action_type})
                    action_results.append({"action_type": action_type, "result": "executed"})
                    action_executed = True
                elif action_type in ("require_comment", "require_attachment"):
                    action_results.append({"action_type": action_type, "result": "validated", "reason": "warunek walidacyjny spełniony przed zmianą statusu"})
                    action_executed = True
                else:
                    action_results.append({"action_type": action_type, "result": "skipped", "reason": "nieobsługiwany typ akcji"})
            execution_result = "wykonano akcje" if action_executed else "nie wykonano żadnej akcji"
            reason = f"{match_reason}; {execution_result}"
            log_workflow_rule_execution(
                cur,
                rule.get("id"),
                rule.get("workflow_id") or workflow_id,
                rule.get("workflow_key") or workflow_key,
                ticket_id,
                event_type,
                matched=True,
                actions_executed=action_results,
                reason=reason,
                user=user,
                current_status=current_status,
                event_new_status=event_new_status,
            )
            if action_executed and rule.get("stop_processing", True):
                stopped_by_rule = rule_name
        return executed
    
    # Automatyczne reguły po dodaniu komentarza.
    def apply_auto_status_after_comment(cur, ticket_id, user, current_status, visibility):
        """
        Zgodność wsteczna: komentarz/notatka uruchamia elastyczne reguły workflow.
        Jeżeli workflow nie ma reguł, działa fallback zgodny z wcześniejszym MVP.
        """
        executed = apply_workflow_event_rules(cur, ticket_id, user, "comment_added", current_status, visibility)
        for item in executed:
            if item.get("action_type") == "change_status":
                return {
                    "old_status": item.get("old_status"),
                    "new_status": item.get("new_status"),
                    "reason": item.get("rule"),
                }
        if current_status == "Zamknięte":
            return None
        cur.execute("SELECT COALESCE(workflow_key, 'default') FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        workflow_key = row[0] if row else "default"
        statuses = workflow_statuses(workflow_key)
        target_status = None
        reason = None
        if (not is_staff(user)) and visibility == "public" and current_status == "Oczekuje na użytkownika":
            for candidate in ("Otwarte", "W trakcie", "Diagnostyka", "W realizacji", "Nowe"):
                if candidate in statuses and candidate != current_status:
                    target_status = candidate
                    break
            reason = "fallback: użytkownik dodał komentarz publiczny"
        elif is_staff(user) and current_status == "Nowe":
            for candidate in ("W trakcie", "Diagnostyka", "Weryfikacja wniosku", "Analiza", "W realizacji", "Otwarte"):
                if candidate in statuses and candidate != current_status:
                    target_status = candidate
                    break
            if not target_status:
                target_status = workflow_first_active_status_after_new(statuses)
            reason = "fallback: operator/admin dodał komentarz lub notatkę"
        if not target_status or target_status == current_status:
            return None
        cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (target_status, ticket_id))
        add_ticket_status_history(
            cur,
            ticket_id,
            user,
            current_status,
            target_status,
            workflow_rule_names=[reason] if reason else [],
            source="auto_comment",
        )
        message = f"Automatyczna zmiana statusu z {current_status} na {target_status}: {reason}."
        add_ticket_event(cur, ticket_id, user, "auto_status_changed", message)
        log_audit(cur, user, "ticket_status_auto_changed", "ticket", ticket_id, {
            "old_status": current_status,
            "new_status": target_status,
            "reason": reason,
            "workflow_key": workflow_key,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "auto_status_changed",
            f"Status zgłoszenia #{ticket_id} został automatycznie zmieniony z {current_status} na {target_status}.",
            actor_email=user["email"],
        )
        return {
            "old_status": current_status,
            "new_status": target_status,
            "reason": reason,
        }
    @app.get("/api/tickets/<int:ticket_id>")
