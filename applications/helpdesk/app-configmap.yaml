        if automation_id.isdigit():
            clauses.append("wre.automation_id = %s")
            params.append(int(automation_id))
        if matched_filter in ("matched", "true", "1"):
            clauses.append("COALESCE(wre.matched, TRUE) = TRUE")
        elif matched_filter in ("skipped", "false", "0"):
            clauses.append("COALESCE(wre.matched, TRUE) = FALSE")
        if event_type_filter and event_type_filter != "all":
            clauses.append("wre.event_type = %s")
            params.append(event_type_filter)
        if actor_filter:
            like = f"%{actor_filter}%"
            clauses.append("(COALESCE(wre.actor_name, '') ILIKE %s OR COALESCE(wre.actor_email, '') ILIKE %s)")
            params.extend([like, like])
        if date_from:
            clauses.append("wre.created_at >= %s::date")
            params.append(date_from)
        if date_to:
            clauses.append("wre.created_at < (%s::date + INTERVAL '1 day')")
            params.append(date_to)
        if q:
            like = f"%{q}%"
            clauses.append("(" + " OR ".join([
                "COALESCE(wa.name, '') ILIKE %s",
                "COALESCE(wd.name, '') ILIKE %s",
                "COALESCE(t.title, '') ILIKE %s",
                "COALESCE(wre.event_type, '') ILIKE %s",
                "COALESCE(wre.reason, '') ILIKE %s",
                "COALESCE(wre.actions_executed, '') ILIKE %s",
            ]) + ")")
            params.extend([like] * 6)
        where_sql = "WHERE " + " AND ".join(clauses) if clauses else ""

        def action_text(actions_raw):
            try:
                actions = json.loads(actions_raw or "[]") if isinstance(actions_raw, str) else actions_raw
            except Exception:
                return str(actions_raw or "")
            if not isinstance(actions, list):
                return json.dumps(actions, ensure_ascii=False)
            parts = []
            for action in actions:
                if not isinstance(action, dict):
                    parts.append(str(action))
                    continue
                action_type = action.get("action_type") or "akcja"
                result = action.get("result") or ""
                details = []
                for key, value in action.items():
                    if key in ("action_type", "result"):
                        continue
                    if isinstance(value, (dict, list)):
                        value = json.dumps(value, ensure_ascii=False)
                    details.append(f"{key}={value}")
                parts.append(f"{action_type}: {result}" + (" (" + ", ".join(details) + ")" if details else ""))
            return " | ".join(parts)

        conn = None
        cur = None
        try:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("SET LOCAL statement_timeout = '10000ms'")
            cur.execute(f"""
                SELECT
                    wre.id,
                    wre.automation_id,
                    COALESCE(wa.name, 'Reguła usunięta') AS automation_name,
                    wre.workflow_id,
                    COALESCE(wd.name, wre.workflow_key, 'Workflow usunięty') AS workflow_name,
                    COALESCE(wd.workflow_key, wre.workflow_key, '') AS workflow_key,
                    wre.ticket_id,
                    COALESCE(t.title, '') AS ticket_title,
                    COALESCE(wre.event_type, '') AS event_type,
                    COALESCE(wre.matched, TRUE) AS matched,
                    COALESCE(wre.actions_executed, '[]') AS actions_executed,
                    COALESCE(wre.reason, '') AS reason,
                    COALESCE(wre.actor_email, '') AS actor_email,
                    COALESCE(wre.actor_name, '') AS actor_name,
                    COALESCE(wre.current_status, '') AS current_status,
                    COALESCE(wre.event_new_status, '') AS event_new_status,
                    COALESCE(wre.created_at, NOW()) AS created_at
                FROM workflow_rule_executions wre
                LEFT JOIN workflow_automations wa ON wa.id = wre.automation_id
                LEFT JOIN workflow_definitions wd ON wd.id = wre.workflow_id
                LEFT JOIN tickets t ON t.id = wre.ticket_id
                {where_sql}
                ORDER BY wre.id DESC
                LIMIT 10000
            """, tuple(params))
            rows = cur.fetchall()
            output = io.StringIO()
            output.write("\ufeff")
            writer = csv.writer(output, delimiter=";")
            writer.writerow(["ID", "Reguła", "Workflow", "Zgłoszenie", "Tytuł zgłoszenia", "Zdarzenie", "Status z", "Status na", "Wynik", "Akcje", "Powód", "Wykonawca", "E-mail wykonawcy", "Data"])
            for r in rows:
                writer.writerow([
                    r[0],
                    r[2],
                    r[4],
                    f"#{r[6]}" if r[6] else "",
                    r[7],
                    r[8],
                    r[14],
                    r[15],
                    "dopasowana" if bool(r[9]) else "niedopasowana",
                    action_text(r[10]),
                    r[11],
                    r[13] or "System",
                    r[12],
                    str(r[16]),
                ])
            filename = "helpdesk-log-workflow.csv"
            return Response(
                output.getvalue(),
                mimetype="text/csv; charset=utf-8",
                headers={"Content-Disposition": f"attachment; filename={filename}"}
            )
        except Exception as e:
            try:
                if conn:
                    conn.rollback()
            except Exception:
                pass
            print("workflow rule executions CSV API error:", repr(e), flush=True)
            return jsonify({
                "error": "Nie udało się wyeksportować logu automatyzacji.",
                "details": str(e),
            }), 500
        finally:
            try:
                if cur:
                    cur.close()
            except Exception:
                pass
            try:
                if conn:
                    conn.close()
            except Exception:
                pass

    def incident_commander(cur, email):
        email = clean(email).lower()
        if not email:
            return None, None
        cur.execute("""
            SELECT
              email,
              COALESCE(NULLIF(trim(concat(first_name, ' ', last_name)), ''), email)
            FROM users
            WHERE lower(email) = %s
              AND roles IS NOT NULL
              AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))
        """, (email,))
        row = cur.fetchone()
        return (row[0], row[1]) if row else (None, None)

    def incident_resolution_check(cur, incident_id):
        cur.execute("""
            SELECT
              COUNT(*) AS task_count,
              COUNT(*) FILTER (WHERE status <> 'done') AS open_task_count
            FROM incident_tasks
            WHERE incident_id = %s
        """, (incident_id,))
        task_count, open_task_count = cur.fetchone()
        cur.execute("""
            SELECT
              COUNT(*) AS linked_ticket_count,
              COUNT(*) FILTER (
                WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')
              ) AS active_ticket_count
            FROM incident_tickets it
            JOIN tickets t ON t.id = it.ticket_id
            WHERE it.incident_id = %s
        """, (incident_id,))
        linked_ticket_count, active_ticket_count = cur.fetchone()
        cur.execute("""
            SELECT COUNT(*)
            FROM incident_updates
            WHERE incident_id = %s
              AND COALESCE(is_public, FALSE) = TRUE
        """, (incident_id,))
        public_update_count = cur.fetchone()[0]
        task_count = int(task_count or 0)
        open_task_count = int(open_task_count or 0)
        linked_ticket_count = int(linked_ticket_count or 0)
        active_ticket_count = int(active_ticket_count or 0)
        public_update_count = int(public_update_count or 0)
        warnings = []
        if open_task_count:
            warnings.append(
                f"Masz {open_task_count} otwarte zadania w checkliście incydentu."
            )
        if linked_ticket_count and public_update_count == 0:
            warnings.append(
                "Nie opublikowano jeszcze żadnego publicznego komunikatu do powiązanych zgłoszeń."
            )
        if active_ticket_count:
            warnings.append(
                f"{active_ticket_count} powiązanych zgłoszeń nadal nie ma statusu Rozwiązane albo Zamknięte."
            )
        cur.execute("""
            SELECT
              t.id,
              t.title,
              t.status,
              COALESCE(t.requester_name, ''),
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email, ''),
              t.updated_at
            FROM incident_tickets it
            JOIN tickets t ON t.id = it.ticket_id
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            WHERE it.incident_id = %s
              AND t.status NOT IN ('Rozwiązane', 'Zamknięte')
            ORDER BY t.updated_at DESC, t.id DESC
            LIMIT 25
        """, (incident_id,))
        active_tickets = [{
            "id": ticket[0],
            "title": ticket[1],
            "status": ticket[2],
            "requester_name": ticket[3],
            "assigned_to_name": ticket[4],
            "updated_at": str(ticket[5]),
        } for ticket in cur.fetchall()]
        return {
            "ready": not warnings,
            "warnings": warnings,
            "task_count": task_count,
            "open_task_count": open_task_count,
            "linked_ticket_count": linked_ticket_count,
            "active_ticket_count": active_ticket_count,
            "active_tickets": active_tickets,
            "public_update_count": public_update_count,
        }

    def resolve_incident_active_tickets(cur, incident_id, incident_title, user):
        cur.execute("""
            SELECT t.id, t.title, t.status
            FROM incident_tickets it
            JOIN tickets t ON t.id = it.ticket_id
            WHERE it.incident_id = %s
              AND t.status NOT IN ('Rozwiązane', 'Zamknięte')
            ORDER BY t.updated_at DESC, t.id DESC
        """, (incident_id,))
        rows = cur.fetchall()
        resolved_ticket_ids = []
        for ticket_id, ticket_title, old_status in rows:
            resolution_summary = (
                f"Zgłoszenie oznaczono jako rozwiązane razem z incydentem "
                f"#{incident_id}: {incident_title}."
            )
            cur.execute("""
                UPDATE tickets
                SET status = 'Rozwiązane',
                    updated_at = NOW(),
                    resolution_summary = COALESCE(NULLIF(resolution_summary, ''), %s),
                    resolution_feedback_decision = NULL,
                    resolution_feedback_comment = NULL,
                    resolution_feedback_by_email = NULL,
                    resolution_feedback_by_name = NULL,
                    resolution_feedback_at = NULL
                WHERE id = %s
                  AND status NOT IN ('Rozwiązane', 'Zamknięte')
            """, (resolution_summary, ticket_id))
            if not cur.rowcount:
                continue
            add_ticket_status_history(
                cur,
                ticket_id,
                user,
                old_status,
                "Rozwiązane",
                source="incident_resolution",
            )
            public_comment = (
                f"Incydent #{incident_id} ({incident_title}) został oznaczony jako rozwiązany. "
                "To zgłoszenie oznaczono jako Rozwiązane. "
                "Jeżeli problem nadal występuje, odrzuć rozwiązanie albo dopisz komentarz."
            )
            cur.execute("""
                INSERT INTO comments (
                  ticket_id, author, author_email, content, visibility
                )
                VALUES (%s, %s, %s, %s, 'public')
            """, (
                ticket_id,
                f"Incident Command Center · {user['name']}",
                user["email"],
                public_comment,
            ))
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "status_changed",
                f"Incydent #{incident_id} oznaczył zgłoszenie jako Rozwiązane.",
            )
            create_ticket_notifications(
                cur,
                ticket_id,
                "status_changed",
                f"Zgłoszenie #{ticket_id} oznaczono jako Rozwiązane razem z incydentem #{incident_id}: {incident_title}.",
                actor_email=user["email"],
            )
            resolved_ticket_ids.append(ticket_id)
        return resolved_ticket_ids

    def reopen_resolved_incidents_for_ticket(cur, ticket_id, ticket_title, user):
        cur.execute("""
            SELECT i.id, i.title
            FROM incident_tickets it
            JOIN incidents i ON i.id = it.incident_id
            WHERE it.ticket_id = %s
              AND i.status = 'resolved'
            ORDER BY i.updated_at DESC, i.id DESC
        """, (ticket_id,))
        incidents = cur.fetchall()
        reopened_incident_ids = []
        affected_ticket_ids = set()
        for incident_id, incident_title in incidents:
            cur.execute("""
                UPDATE incidents
                SET status = 'monitoring',
                    updated_at = NOW(),
                    resolved_at = NULL
                WHERE id = %s
                  AND status = 'resolved'
            """, (incident_id,))
            if not cur.rowcount:
                continue
            reopened_incident_ids.append(incident_id)
            cur.execute("""
                INSERT INTO incident_updates (
                  incident_id, update_type, message, is_public,
                  created_by_email, created_by_name
                )
                VALUES (%s, 'ticket_resolution_rejected', %s, TRUE, %s, %s)
            """, (
                incident_id,
                (
                    "Jeden z użytkowników zgłosił, że problem nadal występuje. "
                    "Incydent cofnięto do monitorowania."
                ),
                user["email"],
                user["name"],
            ))
            cur.execute("""
                SELECT ticket_id
                FROM incident_tickets
                WHERE incident_id = %s
            """, (incident_id,))
            for row in cur.fetchall():
                if row and row[0]:
                    affected_ticket_ids.add(int(row[0]))
        return reopened_incident_ids, sorted(affected_ticket_ids)

    @app.get("/api/incidents")
    @api_login_required
    @api_staff_required
    def api_incidents(user):
        status_filter = clean(request.args.get("status")) or "active"
        if status_filter not in INCIDENT_STATUSES + ["active", "all"]:
            return jsonify({"error": "invalid incident status"}), 400
        clauses = []
        params = []
        if status_filter == "active":
            clauses.append("i.status <> 'resolved'")
        elif status_filter != "all":
            clauses.append("i.status = %s")
            params.append(status_filter)
        where_sql = "WHERE " + " AND ".join(clauses) if clauses else ""
        conn = get_conn()
        cur = conn.cursor()
        cur.execute(f"""
            SELECT
              i.id, i.title, i.summary, COALESCE(i.impact, ''),
              i.severity, i.status,
              COALESCE(i.commander_email, ''),
              COALESCE(i.commander_name, i.commander_email, ''),
              i.created_at, i.updated_at, i.resolved_at,
              COUNT(DISTINCT it.ticket_id) AS ticket_count,
              COUNT(DISTINCT NULLIF(t.department, '')) AS department_count,
              COUNT(DISTINCT task.id) AS task_count,
              COUNT(DISTINCT task.id) FILTER (WHERE task.status = 'done') AS done_task_count
            FROM incidents i
            LEFT JOIN incident_tickets it ON it.incident_id = i.id
            LEFT JOIN tickets t ON t.id = it.ticket_id
            LEFT JOIN incident_tasks task ON task.incident_id = i.id
            {where_sql}
            GROUP BY i.id
            ORDER BY
              CASE i.status WHEN 'resolved' THEN 2 ELSE 1 END,
              CASE i.severity WHEN 'SEV1' THEN 1 WHEN 'SEV2' THEN 2 WHEN 'SEV3' THEN 3 ELSE 4 END,
              i.updated_at DESC
        """, tuple(params))
        incidents = [{
            "id": row[0],
            "title": row[1],
            "summary": row[2],
            "impact": row[3],
            "severity": row[4],
            "status": row[5],
            "commander_email": row[6],
            "commander_name": row[7],
            "created_at": str(row[8]),
            "updated_at": str(row[9]),
            "resolved_at": str(row[10]) if row[10] else "",
            "ticket_count": row[11],
            "department_count": row[12],
            "task_count": row[13],
            "done_task_count": row[14],
        } for row in cur.fetchall()]
        cur.execute("""
            SELECT first_name, last_name, email, roles
            FROM users
            WHERE roles IS NOT NULL
              AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))
            ORDER BY lower(last_name), lower(first_name), lower(email)
        """)
        commanders = [{
            "name": f"{row[0]} {row[1]}".strip(),
            "email": row[2],
            "roles": list(row[3] or ["user"]),
        } for row in cur.fetchall()]
        cur.close()
        conn.close()
        return jsonify({
            "incidents": incidents,
            "filter": status_filter,
            "meta": {
                "severities": INCIDENT_SEVERITIES,
                "statuses": INCIDENT_STATUSES,
                "commanders": commanders,
            },
        })

    @app.post("/api/incidents")
    @api_login_required
    @api_staff_required
    def api_create_incident(user):
        payload = request.get_json(silent=True) or {}
        title = clean(payload.get("title"))
        summary = clean(payload.get("summary"))
        impact = clean(payload.get("impact"))
        user_status_summary = clean(payload.get("user_status_summary"))
        user_current_action = clean(payload.get("user_current_action"))
        next_update_hint = clean(payload.get("next_update_hint"))
        severity = clean(payload.get("severity")) or "SEV3"
        commander_email = clean(payload.get("commander_email")).lower()
        raw_ticket_ids = payload.get("ticket_ids") or []
        source_ticket_id_raw = payload.get("source_ticket_id")
        if not title or not summary:
            return jsonify({"error": "Tytuł i opis incydentu są wymagane."}), 400
        if severity not in INCIDENT_SEVERITIES:
            return jsonify({"error": "Nieprawidłowy poziom SEV."}), 400
        if not isinstance(raw_ticket_ids, list):
            return jsonify({"error": "Lista zgłoszeń ma nieprawidłowy format."}), 400
        try:
            ticket_ids = sorted({
                int(ticket_id)
                for ticket_id in raw_ticket_ids
                if int(ticket_id) > 0
            })
            source_ticket_id = (
                int(source_ticket_id_raw)
                if source_ticket_id_raw not in (None, "")
                else None
            )
        except Exception:
            return jsonify({"error": "Lista zawiera nieprawidłowe ID zgłoszenia."}), 400
        if len(ticket_ids) > 50:
            return jsonify({"error": "Do jednego incydentu można dołączyć maksymalnie 50 zgłoszeń."}), 400
        if ticket_ids and (len(ticket_ids) < 2 or source_ticket_id not in ticket_ids):
            return jsonify({
                "error": "Wybierz zgłoszenie źródłowe i co najmniej jedno powiązane zgłoszenie.",
            }), 400
        conn = get_conn()
        cur = conn.cursor()
        resolved_commander_email, commander_name = incident_commander(cur, commander_email)
        if commander_email and not resolved_commander_email:
            cur.close()
            conn.close()
            return jsonify({"error": "Dowódca incydentu musi być operatorem lub administratorem."}), 400
        if not resolved_commander_email:
            resolved_commander_email = user["email"]
            commander_name = user["name"]
        ticket_rows = {}
        if ticket_ids:
            cur.execute("""
                SELECT id, title, status
                FROM tickets
                WHERE id = ANY(%s)
            """, (ticket_ids,))
            ticket_rows = {
                ticket_row[0]: {
                    "title": ticket_row[1],
                    "status": ticket_row[2],
                }
                for ticket_row in cur.fetchall()
            }
            missing_ticket_ids = sorted(set(ticket_ids) - set(ticket_rows))
            if missing_ticket_ids:
                cur.close()
                conn.close()
                return jsonify({
                    "error": f"Nie znaleziono zgłoszeń: {', '.join(str(item) for item in missing_ticket_ids)}.",
                }), 404
            closed_ticket_ids = sorted(
                ticket_id
                for ticket_id, ticket_data in ticket_rows.items()
                if ticket_data["status"] == "Zamknięte"
            )
            if closed_ticket_ids:
                cur.close()
                conn.close()
                return jsonify({
                    "error": f"Zamknięte zgłoszenia nie mogą zostać dołączone: {', '.join(str(item) for item in closed_ticket_ids)}.",
                }), 400
            cur.execute("""
                SELECT
                  CASE
                    WHEN ticket_id = %s THEN linked_ticket_id
                    ELSE ticket_id
                  END AS linked_id
                FROM ticket_links
                WHERE ticket_id = %s OR linked_ticket_id = %s
            """, (source_ticket_id, source_ticket_id, source_ticket_id))
            related_ticket_ids = {related[0] for related in cur.fetchall()}
            unrelated_ticket_ids = sorted(
                set(ticket_ids) - {source_ticket_id} - related_ticket_ids
            )
            if unrelated_ticket_ids:
                cur.close()
                conn.close()
                return jsonify({
                    "error": f"Zgłoszenia nie są bezpośrednio powiązane ze zgłoszeniem źródłowym: {', '.join(str(item) for item in unrelated_ticket_ids)}.",
                }), 400
        cur.execute("""
            INSERT INTO incidents (
              title, summary, impact, severity, status,
              commander_email, commander_name, created_by_email, created_by_name,
              user_status_summary, user_current_action, next_update_hint
            )
            VALUES (%s, %s, %s, %s, 'investigating', %s, %s, %s, %s, %s, %s, %s)
            RETURNING id
        """, (
            title, summary, impact, severity,
            resolved_commander_email, commander_name,
            user["email"], user["name"],
            user_status_summary, user_current_action, next_update_hint,
        ))
        incident_id = cur.fetchone()[0]
        cur.execute("""
            INSERT INTO incident_updates (
              incident_id, update_type, message, is_public,
              created_by_email, created_by_name
            )
            VALUES (%s, 'created', %s, FALSE, %s, %s)
        """, (
            incident_id,
            f"Utworzono incydent {severity}: {title}",
            user["email"],
            user["name"],
        ))
        for ticket_id in ticket_ids:
            cur.execute("""
                INSERT INTO incident_tickets (incident_id, ticket_id, linked_by_email)
                VALUES (%s, %s, %s)
            """, (incident_id, ticket_id, user["email"]))
            public_comment = (
                f"Twoje zgłoszenie zostało powiązane z incydentem "
                f"{severity} #{incident_id}: {title}. "
                "Dalsze publiczne aktualizacje operatora będą automatycznie "
                "dodawane do tego zgłoszenia."
            )
            cur.execute("""
                INSERT INTO comments (
                  ticket_id, author, author_email, content, visibility
                )
                VALUES (%s, %s, %s, %s, %s)
            """, (
                ticket_id,
                f"Incident Command Center · {user['name']}",
                user["email"],
                public_comment,
                "public",
            ))
            mark_first_response_if_needed(cur, ticket_id, user)
            cur.execute(
                "UPDATE tickets SET updated_at = NOW() WHERE id = %s",
                (ticket_id,),
            )
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "incident_linked",
                f"Zgłoszenie powiązano z incydentem #{incident_id}: {title}",
            )
            create_ticket_notifications(
                cur,
                ticket_id,
                "incident_linked",
                f"Zgłoszenie #{ticket_id} powiązano z incydentem #{incident_id}: {title}",
                actor_email=user["email"],
            )
        log_audit(cur, user, "incident_created", "incident", incident_id, {
            "title": title,
            "severity": severity,
            "commander_email": resolved_commander_email,
            "ticket_ids": ticket_ids,
            "user_status_summary": user_status_summary,
            "user_current_action": user_current_action,
            "next_update_hint": next_update_hint,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"{user['name']} utworzył incydent #{incident_id}: {title}",
            "incident_created",
            None,
            staff_only=not bool(ticket_ids),
            ticket_ids=ticket_ids or None,
        )
        return jsonify({
            "id": incident_id,
            "linked_ticket_count": len(ticket_ids),
        }), 201

