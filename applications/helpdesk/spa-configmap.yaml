apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-spa
  namespace: helpdesk
data:
  spa.html: |
    
    <!doctype html>
    <html lang="pl">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>INCoprp Helpdesk</title>
      <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --card2: #1f2937;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #facc15;
        --border: rgba(148,163,184,.25);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 35%),
          radial-gradient(circle at bottom right, rgba(34,197,94,.12), transparent 35%),
          var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      a { color: inherit; }
      img, svg, canvas, video { max-width: 100%; height: auto; }
      .page { width: 100%; max-width: none; margin: 0; padding: 42px clamp(16px, 2.2vw, 42px); }
      header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
      h1 { margin: 0 0 8px; font-size: clamp(34px, 5vw, 56px); line-height: 1; letter-spacing: -.05em; }
      .subtitle { margin: 0; color: var(--muted); font-size: 18px; }
      .badge { border: 1px solid var(--border); border-radius: 999px; padding: 10px 14px; color: var(--muted); white-space: nowrap; background: rgba(15,23,42,.65); }
      .badge strong { color: var(--green); }
      .card { background: linear-gradient(180deg, rgba(17,24,39,.96), rgba(15,23,42,.96)); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,.25); margin-bottom: 18px; }
      .panel-soft { background: rgba(15,23,42,.55); border: 1px solid rgba(148,163,184,.18); border-radius: 16px; padding: 12px; }
      .ticket-context-card { border-left: 5px solid #38bdf8; }
      .ticket-context-grid { display: grid; gap: 8px; margin-top: 10px; }
      .ticket-context-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid rgba(148,163,184,.14); }
      .ticket-context-row:last-child { border-bottom: 0; }
      .ticket-context-label { color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; }
      .ticket-context-value { text-align: right; font-weight: 800; line-height: 1.35; }
      .ticket-context-mini { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 3px; }
      .ticket-context-card details { margin-top: 12px; }
      .ticket-context-card summary { cursor: pointer; color: var(--text); }
      .ticket-context-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; margin-top: 12px; }
      .ticket-context-actions button { width: 100%; margin-top: 0; padding: 9px 10px; font-size: 13px; }
      .ticket-recommendation-list { display: grid; gap: 10px; margin-top: 10px; }
      .ticket-recommendation { border-left: 4px solid rgba(56,189,248,.65); }
      .ticket-recommendation-warning { border-left-color: rgba(250,204,21,.8); background: rgba(250,204,21,.08); }
      .ticket-recommendation-danger { border-left-color: rgba(239,68,68,.85); background: rgba(239,68,68,.08); }
      .ticket-recommendation-success { border-left-color: rgba(34,197,94,.8); background: rgba(34,197,94,.08); }
      .ticket-recommendation-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .ticket-recommendation-actions button { margin-top: 0; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
      .stat { border: 1px solid var(--border); background: rgba(31,41,55,.72); border-radius: 18px; padding: 16px; }
      .stat .num { font-size: 32px; font-weight: 800; }
      .stat .label { color: var(--muted); font-size: 14px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
      .pill { display: inline-block; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); color: var(--text); background: rgba(31,41,55,.72); }
      .priority-Krytyczny { color: #fecaca; border-color: rgba(239,68,68,.45); }
      .priority-Wysoki { color: #fde68a; border-color: rgba(250,204,21,.45); }
      .priority-Normalny { color: #bae6fd; border-color: rgba(56,189,248,.45); }
      .priority-Niski { color: #bbf7d0; border-color: rgba(34,197,94,.45); }
      input, textarea, select { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 15px; }
      textarea { min-height: 120px; resize: vertical; }
      label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      button, .btn { display: inline-block; margin-top: 14px; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; color: white; background: linear-gradient(135deg, #0284c7, #22c55e); cursor: pointer; text-decoration: none; }
      .btn-secondary { background: rgba(31,41,55,.9); border: 1px solid var(--border); }
      .btn-danger { background: rgba(239,68,68,.18); border: 1px solid rgba(239,68,68,.45); color: #fecaca; }
      .btn-small { margin-top: 0; padding: 8px 11px; border-radius: 10px; font-size: 13px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 14px; align-items: end; }
      .filter-field label { margin-top: 0; }
      .filter-field select { min-height: 44px; }
      .work-views { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 16px; }
      .work-view-btn { border: 1px solid var(--border); background: rgba(31,41,55,.72); color: var(--text); border-radius: 999px; padding: 9px 12px; font-weight: 800; cursor: pointer; }
      .work-view-btn:hover { border-color: rgba(56,189,248,.55); background: rgba(31,41,55,.92); }
      .work-view-btn.active { background: linear-gradient(135deg, #0284c7, #22c55e); border-color: rgba(56,189,248,.75); color: #fff; box-shadow: 0 12px 24px rgba(0,0,0,.22); }
      .combo { position: relative; }
      .combo summary { list-style: none; cursor: pointer; width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 15px; min-height: 44px; }
      .combo summary::-webkit-details-marker { display: none; }
      .combo summary::after { content: "▼"; float: right; color: var(--muted); font-size: 12px; margin-top: 3px; }
      .combo[open] summary { border-color: rgba(56,189,248,.55); box-shadow: 0 0 0 3px rgba(56,189,248,.10); }
      .combo-menu { position: absolute; z-index: 30; left: 0; right: 0; margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: #111827; box-shadow: 0 20px 40px rgba(0,0,0,.35); max-height: 300px; overflow: auto; }
      .combo-option { display: flex; align-items: center; gap: 8px; padding: 8px 6px; color: var(--text); border-radius: 10px; }
      .combo-option:hover { background: rgba(31,41,55,.9); }
      .combo-option input { width: auto; }
      .active-filter-count { color: var(--muted); font-size: 13px; margin-top: 10px; }
      .pagination {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .pagination-info {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .pagination-pages {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
      }
      .pagination-btn {
        margin-top: 0;
        padding: 8px 11px;
        min-width: 38px;
        border-radius: 10px;
        background: rgba(31,41,55,.9);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .pagination-btn.active {
        color: white;
        border-color: rgba(56,189,248,.65);
        background: linear-gradient(135deg, #0284c7, #22c55e);
        box-shadow: 0 0 0 3px rgba(56,189,248,.14);
      }
      .pagination-btn:disabled {
        opacity: .42;
        cursor: not-allowed;
      }
      .pagination-ellipsis {
        color: var(--muted);
        padding: 0 4px;
      }
      .status-filter-btn { margin-top: 0; color: var(--muted); transition: border-color .15s ease, background .15s ease, color .15s ease, transform .15s ease; }
      .status-filter-btn:hover { transform: translateY(-1px); border-color: rgba(56,189,248,.55); color: var(--text); }
      .status-filter-btn.active { color: white; background: linear-gradient(135deg, #0284c7, #22c55e); border-color: rgba(56,189,248,.65); box-shadow: 0 0 0 3px rgba(56,189,248,.14); }
      .status-filter-btn.active::before { content: "✓ "; }
      .status-filter-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
      .status-filter-hint { margin-top:8px; color:var(--muted); font-size:13px; }
      .status-Nowe { color:#bbf7d0; border-color:rgba(34,197,94,.55); background:rgba(34,197,94,.14); }
      .status-Otwarte { color:#fed7aa; border-color:rgba(249,115,22,.58); background:rgba(249,115,22,.14); }
      .status-W-trakcie { color:#bae6fd; border-color:rgba(56,189,248,.55); background:rgba(56,189,248,.14); }
      .status-Oczekuje-na-uzytkownika { color:#fecaca; border-color:rgba(239,68,68,.58); background:rgba(239,68,68,.14); }
      .status-Oczekuje-na-dostawce { color:#ddd6fe; border-color:rgba(168,85,247,.58); background:rgba(168,85,247,.14); }
      .status-Rozwiazane { color:#c7d2fe; border-color:rgba(99,102,241,.55); background:rgba(99,102,241,.14); }
      .status-Zamkniete { color:#e5e7eb; border-color:rgba(156,163,175,.55); background:rgba(156,163,175,.14); }
     .sla-badge { display: inline-block; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 800; border: 1px solid var(--border); background: rgba(31,41,55,.72); } .sla-ok { color:#bbf7d0; border-color:rgba(34,197,94,.55); background:rgba(34,197,94,.13); } .sla-warning { color:#fef08a; border-color:rgba(250,204,21,.6); background:rgba(250,204,21,.14); } .sla-overdue { color:#fecaca; border-color:rgba(239,68,68,.6); background:rgba(239,68,68,.15); } .sla-done { color:#c7d2fe; border-color:rgba(129,140,248,.55); background:rgba(129,140,248,.13); } .sla-none { color:#cbd5e1; border-color:rgba(148,163,184,.35); background:rgba(148,163,184,.10); } .ticket-title { font-weight: 800; text-decoration: none; color: var(--text); background: none; padding: 0; margin: 0; transition: color .15s ease, opacity .15s ease; }
      .ticket-title:hover { opacity: .82; }
      .ticket-title.status-Nowe, .ticket-heading.status-Nowe { color:#22c55e; background:transparent; border-color:transparent; }
      .ticket-title.status-Otwarte, .ticket-heading.status-Otwarte { color:#fb923c; background:transparent; border-color:transparent; }
      .ticket-title.status-W-trakcie, .ticket-heading.status-W-trakcie { color:#38bdf8; background:transparent; border-color:transparent; }
      .ticket-title.status-Oczekuje-na-uzytkownika, .ticket-heading.status-Oczekuje-na-uzytkownika { color:#ef4444; background:transparent; border-color:transparent; }
      .ticket-title.status-Oczekuje-na-dostawce, .ticket-heading.status-Oczekuje-na-dostawce { color:#a78bfa; background:transparent; border-color:transparent; }
      .ticket-title.status-Rozwiazane, .ticket-heading.status-Rozwiazane { color:#818cf8; background:transparent; border-color:transparent; }
      .ticket-title.status-Zamkniete, .ticket-heading.status-Zamkniete { color:#94a3b8; background:transparent; border-color:transparent; }
      .ticket-title.status-default, .ticket-heading.status-default { color:var(--text); background:transparent; border-color:transparent; }
      .muted { color: var(--muted); }
      .comment { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: rgba(31,41,55,.65); margin-top: 10px; }
      .comment.internal { border-color: rgba(250,204,21,.55); background: rgba(250,204,21,.10); }
      .comment-type { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 800; border: 1px solid var(--border); }
      .comment-type.public { color: #bbf7d0; border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.12); }
      .comment-type.internal { color: #fef08a; border-color: rgba(250,204,21,.55); background: rgba(250,204,21,.14); }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 14px 0 4px;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(31,41,55,.55);
      }
      .switch-row strong { display: block; color: var(--text); font-size: 14px; }
      .switch-row small { display: block; color: var(--muted); margin-top: 3px; line-height: 1.35; }
      .switch { position: relative; display: inline-block; width: 58px; height: 32px; flex: 0 0 auto; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: rgba(148,163,184,.28);
        border: 1px solid rgba(148,163,184,.35);
        transition: .2s;
        border-radius: 999px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 24px;
        width: 24px;
        left: 3px;
        bottom: 3px;
        background: #f8fafc;
        transition: .2s;
        border-radius: 50%;
        box-shadow: 0 6px 14px rgba(0,0,0,.28);
      }
      .switch input:checked + .slider {
        background: rgba(250,204,21,.38);
        border-color: rgba(250,204,21,.70);
      }
      .switch input:checked + .slider:before {
        transform: translateX(26px);
        background: #fef08a;
      }
      .attachment-list { display: grid; gap: 10px; margin-top: 12px; }
      .attachment-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: rgba(31,41,55,.58); }
      .attachment-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .attachment-upload-hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
      .watcher-list { display: grid; gap: 10px; margin: 12px 0 16px; }
      .watcher-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; background: rgba(31,41,55,.58); }
      .watcher-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
    
      .ticket-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
      .ticket-main-column, .ticket-side-column { display: grid; gap: 18px; }
      .ticket-side-column { position: sticky; top: 18px; }
      .ticket-summary-card { padding-bottom: 18px; }
      .ticket-top-actions { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
      .ticket-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 16px 0; }
      .ticket-summary-item { border: 1px solid var(--border); border-radius: 16px; padding: 12px; background: rgba(31,41,55,.46); }
      .ticket-summary-item .label { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
      .ticket-summary-item .value { color: var(--text); font-weight: 750; line-height: 1.45; overflow-wrap: anywhere; }
      .ticket-description { white-space: pre-wrap; line-height: 1.65; padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: rgba(31,41,55,.38); }
      .ticket-section-title { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
      .ticket-section-title h3 { margin: 0; }
      .ticket-section-title .counter { color: var(--muted); font-size: 13px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; background: rgba(31,41,55,.55); white-space: nowrap; }
      .status-action-card { border-color: rgba(56,189,248,.40); }
      .status-action-card select { margin-bottom: 8px; }
      .workflow-hint { border: 1px solid rgba(56,189,248,.28); border-radius: 16px; padding: 12px; background: rgba(56,189,248,.08); color: var(--muted); font-size: 13px; line-height: 1.55; margin-top: 12px; }
      .workflow-hint strong { color: var(--text); }
      .status-requirements-panel { margin-top: 12px; display: grid; gap: 8px; }
      .requirement-box { border: 1px solid var(--border); border-radius: 16px; padding: 12px; background: rgba(31,41,55,.54); font-size: 13px; line-height: 1.45; }
      .requirement-box.ok { border-color: rgba(34,197,94,.48); background: rgba(34,197,94,.08); }
      .requirement-box.blocked { border-color: rgba(248,113,113,.58); background: rgba(248,113,113,.10); }
      .requirement-box.neutral { border-color: rgba(148,163,184,.30); background: rgba(31,41,55,.38); }
      .requirement-box strong { color: var(--text); }
      .requirement-list { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
      .requirement-list li { margin: 4px 0; }
      .requirement-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .requirement-actions button { margin-top: 0; }
      .compact-list { margin: 0; padding-left: 18px; }
      .compact-list li { margin: 3px 0; }
      .form-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .form-actions button { margin-top: 14px; }
      .section-focus { animation: sectionFocus 1.6s ease; }
      @keyframes sectionFocus { 0% { box-shadow: 0 0 0 0 rgba(56,189,248,.0); border-color: var(--border); } 30% { box-shadow: 0 0 0 4px rgba(56,189,248,.18); border-color: rgba(56,189,248,.72); } 100% { box-shadow: 0 20px 40px rgba(0,0,0,.25); border-color: var(--border); } }
      @media (max-width: 980px) { .ticket-layout { grid-template-columns: 1fr; } .ticket-side-column { position: static; } }
    
      .login-box { width: min(520px, 100%); margin: 0 auto; }
      .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }
      .error { color: #fecaca; }
      .success { color: #bbf7d0; }
      .live-panel { border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; background: rgba(15,23,42,.65); color: var(--muted); min-width: 280px; }
      .live-panel .live-row { display:flex; justify-content:space-between; gap:12px; margin:4px 0; }
      .live-panel .live-value { color: var(--text); font-weight: 800; }
      .live-panel .ws-connected { color: #22c55e; }
      .live-panel .ws-disconnected { color: #ef4444; }
      .header-actions { display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
      .notification-wrapper { position: relative; width: 100%; display: flex; justify-content: flex-end; }
      .notification-btn { margin-top: 0; background: rgba(31,41,55,.9); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 999px; }
      .notification-btn.has-unread { border-color: rgba(250,204,21,.65); box-shadow: 0 0 0 3px rgba(250,204,21,.12); }
      .notification-count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: #ef4444; color: white; font-size: 12px; font-weight: 900; }
      .notification-panel { position: absolute; top: 48px; right: 0; width: min(540px, 94vw); z-index: 60; border: 1px solid var(--border); border-radius: 18px; background: #111827; box-shadow: 0 24px 48px rgba(0,0,0,.38); padding: 14px; }
      .notification-panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
      .notification-panel-header h3 { margin: 0; }
      .notification-panel-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .notification-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
      .notification-tab { margin: 0; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--border); background: rgba(31,41,55,.72); color: var(--muted); font-weight: 800; }
      .notification-tab.active { color: var(--text); border-color: rgba(56,189,248,.65); background: rgba(56,189,248,.13); }
      .notification-list { display: grid; gap: 8px; max-height: 420px; overflow: auto; }
      .notification-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; margin: 0; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--border); background: rgba(31,41,55,.62); color: var(--text); }
      .notification-card.unread { border-color: rgba(56,189,248,.55); background: rgba(56,189,248,.10); }
      .notification-card:hover { border-color: rgba(56,189,248,.65); }
      .notification-open { text-align: left; width: 100%; margin: 0; padding: 0; border: 0; background: transparent; color: var(--text); }
      .notification-ticket { margin-bottom: 5px; color: #bae6fd; font-size: 13px; font-weight: 900; line-height: 1.35; }
      .notification-message { font-weight: 800; line-height: 1.35; }
      .notification-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
      .notification-item-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .notification-item-actions button { margin-top: 0; padding: 6px 8px; font-size: 12px; }
      .toast { position: fixed; right: 24px; bottom: 24px; z-index: 9999; min-width: 280px; max-width: 440px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(135deg, rgba(2,132,199,.96), rgba(34,197,94,.96)); color: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.35); font-weight: 700; opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
