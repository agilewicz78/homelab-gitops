            operational: "status-new",
            degraded: "status-wait",
            outage: "status-closed",
            maintenance: "status-open",
          };
          return `<span class="status-badge ${classes[status] || "status-open"}">${esc(service?.status_label || labels[status] || status)}</span>`;
        }
    
        function serviceCriticalityBadge(service) {
          const criticality = service?.criticality || "medium";
          const labels = {
            low: "Niska",
            medium: "Średnia",
            high: "Wysoka",
            critical: "Krytyczna",
          };
          const classes = {
            low: "priority-Niski",
            medium: "priority-Normalny",
            high: "priority-Wysoki",
            critical: "priority-Krytyczny",
          };
          return `<span class="pill ${classes[criticality] || ""}">${esc(service?.criticality_label || labels[criticality] || criticality)}</span>`;
        }
    
        function serviceStatusMessage(service) {
          const status = service?.status || "operational";
          const messages = {
            operational: "Usługa działa prawidłowo. Jeżeli problem występuje tylko u Ciebie, utwórz zgłoszenie.",
            degraded: "Usługa działa częściowo wolniej albo niestabilnie. Problem może być już znany helpdeskowi.",
            outage: "Trwa awaria usługi. Problem może być już znany, więc warto sprawdzić komunikaty i aktywne incydenty.",
            maintenance: "Trwają prace serwisowe. Część funkcji może być chwilowo niedostępna.",
          };
          return messages[status] || messages.operational;
        }
    
        function isProblematicService(service) {
          return ["degraded", "outage", "maintenance"].includes(service?.status || "");
        }
    
        function adminServiceOptionList(options, selected, labelKey = "label", valueKey = "value") {
          return (options || []).map(option => {
            const value = option?.[valueKey] ?? option;
            const label = option?.[labelKey] ?? option;
            return `<option value="${esc(value)}" ${String(value) === String(selected) ? "selected" : ""}>${esc(label)}</option>`;
          }).join("");
        }
    
        function updateAdminServiceSubcategories(selected = "Inne") {
          const categorySelect = document.getElementById("adminServiceCategory");
          const subcategorySelect = document.getElementById("adminServiceSubcategory");
          if (!categorySelect || !subcategorySelect || !adminServiceCatalogCache) return;
          const values = adminServiceCatalogCache.subcategories?.[categorySelect.value] || ["Inne"];
          const effective = values.includes(selected) ? selected : (values.includes("Inne") ? "Inne" : values[0]);
          subcategorySelect.innerHTML = values.map(value =>
