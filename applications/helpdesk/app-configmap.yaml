        function openWorkflowAutomationTemplatePicker() {{
          const modal = document.getElementById("workflowAutomationRuleModal");
          if (!modal) {{
            alert("Nie znaleziono okna szablonów reguł workflow. Odśwież stronę i spróbuj ponownie.");
            return;
          }}
          try {{
            const templates = workflowAutomationRuleTemplates();
            const cards = templates.map(t => `
              <div class="card" style="padding:12px;margin:10px 0">
                <h4 style="margin:0 0 6px">${{esc(t.title)}}</h4>
                <p class="muted" style="margin:0 0 8px">${{esc(t.description)}}</p>
                <div class="attachment-upload-hint" style="margin-bottom:8px">${{esc(workflowAutomationRuleSummary(t.rule))}}</div>
                <button type="button" class="btn-secondary btn-small workflow-template-use" data-template-id="${{esc(t.id)}}">Użyj tego szablonu</button>
              </div>
            `).join("");
            modal.innerHTML = `
              <div class="modal-card">
                <div class="modal-header">
                  <div>
                    <h2>Dodaj regułę z szablonu</h2>
                    <p class="muted">Szablon otworzy formularz reguły z uzupełnionymi polami. Przed zapisem możesz zmienić statusy, warunki i akcje oraz użyć testu reguły.</p>
