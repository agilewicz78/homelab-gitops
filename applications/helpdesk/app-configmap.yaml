    \    conn.close()\n    if visibility == \"public\":\n        publish_event(f\"{user['name']} dodał komentarz do zgłoszenia #{ticket_id}\", \"comment_added\", ticket_id)\n    else:\n        # Nie publikujemy treści notatki wewnętrznej globalnie do zwykłych użytkowników.\n        # Widok operatorów/adminów odświeży się po wejściu w zgłoszenie albo po kolejnej akcji.\n        publish_event(f\"{user['name']} dodał notatkę wewnętrzną do zgłoszenia #{ticket_id}\", \"internal_note_added\", ticket_id, staff_only=True)\n    if auto_status_change:\n        publish_event(\n            f\"Status zgłoszenia #{ticket_id} zmieniono automatycznie z {auto_status_change['old_status']} na {auto_status_change['new_status']}\",\n            \"auto_status_changed\",\n            ticket_id,\n        )\n    return jsonify({\"status\": \"ok\", \"visibility\": visibility, \"auto_status_change\": auto_status_change})\n@app.get(\"/api/tickets/<int:ticket_id>/attachments\")\n@api_login_required\ndef api_ticket_attachments(user,\
    \ ticket_id):\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT id, original_filename, content_type, size_bytes, uploaded_by_name, created_at\n        FROM attachments\n        WHERE ticket_id = %s\n        ORDER BY id DESC\n    \"\"\", (ticket_id,))\n    rows = cur.fetchall()\n    cur.close()\n    conn.close()\n    return jsonify({\n        \"attachments\": [\n            {\n                \"id\": r[0],\n                \"original_filename\": r[1],\n                \"content_type\": r[2] or \"\",\n                \"size_bytes\": r[3],\n                \"uploaded_by_name\": r[4] or \"\",\n                \"created_at\": str(r[5]),\n            }\n            for r in rows\n        ]\n    })\n@app.post(\"/api/tickets/<int:ticket_id>/attachments\")\n@api_login_required\ndef api_upload_attachment(user, ticket_id):\n    if not can_view_ticket(user,\
    \ ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    if \"file\" not in request.files:\n        return jsonify({\"error\": \"Brak pliku.\"}), 400\n    uploaded_file = request.files[\"file\"]\n    original_filename = uploaded_file.filename or \"\"\n    safe_filename = secure_filename(original_filename)\n    if not safe_filename:\n        return jsonify({\"error\": \"Nieprawidłowa nazwa pliku.\"}), 400\n    if not allowed_attachment(safe_filename):\n        return jsonify({\"error\": \"Niedozwolony typ pliku.\"}), 400\n    file_bytes = uploaded_file.read()\n    size_bytes = len(file_bytes)\n    if size_bytes <= 0:\n        return jsonify({\"error\": \"Pusty plik.\"}), 400\n    if size_bytes > MAX_ATTACHMENT_SIZE:\n        return jsonify({\"error\": \"Plik jest za duży. Maksymalny rozmiar to 10 MB.\"}), 400\n    conn = get_conn()\n    cur = conn.cursor()\n    ok, ticket_status, error_code = ensure_ticket_mutable(cur, ticket_id)\n    if not ok:\n        cur.close()\n\
