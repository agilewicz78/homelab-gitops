apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-content
  namespace: homepage
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Homelab</title>
      <style>
        body {
          font-family: system-ui, sans-serif;
          background: #111827;
          color: #f9fafb;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
        }
        .card {
          background: #1f2937;
          padding: 40px;
          border-radius: 16px;
          box-shadow: 0 20px 40px rgba(0,0,0,.3);
          max-width: 720px;
        }
        h1 {
          margin-top: 0;
          color: #93c5fd;
        }
        code {
          background: #374151;
          padding: 2px 6px;
          border-radius: 6px;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Homelab platform działa 🚀</h1>
        <p>Ta aplikacja jest wdrożona przez <strong>Argo CD</strong>.</p>
        <p>Ingress: <code>homepage.lab.local</code></p>
        <p>Storage, TLS, GitOps, backupy i monitoring są gotowe.</p>
      </div>
    </body>
    </html>
