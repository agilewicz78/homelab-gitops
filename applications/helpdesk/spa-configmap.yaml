          if (assignedFilter === "unassigned" && !statusKey && noPriority && slaFilter === "all" && noFirstResponse && noSearch) return "unassigned";
          if (assignedFilter === "all" && statusKey === "Nowe" && noPriority && slaFilter === "all" && noFirstResponse && noSearch) return "new";
          if (assignedFilter === "all" && !statusKey && noPriority && slaFilter === "overdue" && noFirstResponse && noSearch) return "overdue";
          if (assignedFilter === "all" && statusKey === "Oczekuje na użytkownika" && noPriority && slaFilter === "all" && noFirstResponse && noSearch) return "waiting_user";
          if (assignedFilter === "all" && !statusKey && noPriority && slaFilter === "all" && firstResponseFilter === "no_response" && noSearch) return "no_response";
