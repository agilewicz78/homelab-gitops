                <div><label>Od daty</label><input id="wreDateFrom" type="date" value="${esc(returnedFilters.date_from || "")}"></div>
                <div><label>Do daty</label><input id="wreDateTo" type="date" value="${esc(returnedFilters.date_to || "")}"></div>
              </div>
              <input type="hidden" id="wreWorkflowId" value="${esc(returnedFilters.workflow_id || workflowId || "")}">
              <div class="actions" style="margin-top:12px">
