            <option value="">Wybierz powód...</option>
            ${{context.reasons.map(reason =>
              `<option value="${{esc(reason.code)}}">${{esc(reason.label)}}</option>`
            ).join("")}}
          `;
          reasonSelect.value = context.myReason || "";
          commentInput.value = context.myComment || "";
