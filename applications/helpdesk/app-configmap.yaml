    \ w historii zgłoszenia i audycie.</div>\n        <div class=\"modal-actions\">\n          <button type=\"button\" class=\"btn-secondary\" onclick=\"closeReopenTicketModal(); return false;\">Anuluj</button>\n          <button type=\"submit\">Otwórz ponownie</button>\n        </div>\n      </form>\n    </div>\n  </div>\n  <script>\n    const appEl = document.getElementById(\"app\");\n    const userBadge = document.getElementById(\"userBadge\");\n    const notificationButton = document.getElementById(\"notificationButton\");\n    const notificationCount = document.getElementById(\"notificationCount\");\n    const notificationPanel = document.getElementById(\"notificationPanel\");\n    const notificationList = document.getElementById(\"notificationList\");\n    const wsStatus = document.getElementById(\"wsStatus\");\n    const wsClients = document.getElementById(\"wsClients\");\n    const wsTime = document.getElementById(\"wsTime\");\n    const wsEvent = document.getElementById(\"wsEvent\"\
    );\n    let liveSocket = null;\n    let liveReconnectTimer = null;\n    let lastLiveEventId = null;\n    let currentView = {{ name: \"home\", ticketId: null }};\n    let suppressNextLiveRefresh = false;\n    let closeTicketId = null;\n    let reopenTicketId = null;\n    function getSid() {{ return sessionStorage.getItem(\"helpdesk_sid\") || \"\"; }}\n    function setSid(sid) {{ sessionStorage.setItem(\"helpdesk_sid\", sid); }}\n    function clearSid() {{ sessionStorage.removeItem(\"helpdesk_sid\"); }}\n    async function api(path, options = {{}}) {{\n      const headers = options.headers || {{}};\n      headers[\"X-Helpdesk-Session\"] = getSid();\n      if (options.body && !headers[\"Content-Type\"]) headers[\"Content-Type\"] = \"application/json\";\n      const res = await fetch(path, {{ ...options, headers }});\n      if (res.status === 401) {{\n        clearSid();\n        window.location.href = \"/login\";\n        return null;\n      }}\n      return res;\n    }}\n    function esc(value)\
    \ {{\n      return String(value ?? \"\").replace(/[&<>\"']/g, ch => ({{\n        \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#039;\"\n      }}[ch]));\n    }}\n    function formatBytes(bytes) {{\n      const value = Number(bytes || 0);\n      if (value < 1024) return value + \" B\";\n      if (value < 1024 * 1024) return (value / 1024).toFixed(1) + \" KB\";\n      return (value / (1024 * 1024)).toFixed(1) + \" MB\";\n    }}\n    function formatResolutionMinutes(totalMinutes) {{\n      const value = Number(totalMinutes || 0);\n      const hours = Math.floor(value / 60);\n      const minutes = value % 60;\n      if (hours && minutes) return `${{hours}}h ${{minutes}}m`;\n      if (hours) return `${{hours}}h`;\n      return `${{minutes}}m`;\n    }}\n    function openCloseTicketModal(ticketId) {{\n      closeTicketId = ticketId;\n      const modal = document.getElementById(\"closeTicketModal\");\n      const subtitle = document.getElementById(\"closeTicketModalSubtitle\"\
    );\n      const form = document.getElementById(\"closeTicketForm\");\n      if (form) form.reset();\n      if (subtitle) subtitle.textContent = \"Zamknięcie zgłoszenia #\" + ticketId;\n      if (modal) modal.classList.remove(\"hidden\");\n    }}\n    function closeCloseTicketModal() {{\n      closeTicketId = null;\n      const modal = document.getElementById(\"closeTicketModal\");\n      if (modal) modal.classList.add(\"hidden\");\n    }}\n    function openReopenTicketModal(ticketId) {{\n      reopenTicketId = ticketId;\n      const modal = document.getElementById(\"reopenTicketModal\");\n      const subtitle = document.getElementById(\"reopenTicketModalSubtitle\");\n      const form = document.getElementById(\"reopenTicketForm\");\n      if (form) form.reset();\n      if (subtitle) subtitle.textContent = \"Ponowne otwarcie zgłoszenia #\" + ticketId;\n      if (modal) modal.classList.remove(\"hidden\");\n    }}\n    function closeReopenTicketModal() {{\n      reopenTicketId = null;\n\
    \      const modal = document.getElementById(\"reopenTicketModal\");\n      if (modal) modal.classList.add(\"hidden\");\n    }}\n    async function downloadAttachment(id, filename) {{\n      const res = await fetch(`/api/attachments/${{id}}/download`, {{\n        headers: {{ \"X-Helpdesk-Session\": getSid() }}\n      }});\n      if (res.status === 401) {{\n        clearSid();\n        window.location.href = \"/login\";\n        return;\n      }}\n      if (!res.ok) {{\n        alert(\"Nie udało się pobrać załącznika.\");\n        return;\n      }}\n      const blob = await res.blob();\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement(\"a\");\n      a.href = url;\n      a.download = filename || \"attachment\";\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      URL.revokeObjectURL(url);\n    }}\n    function showToast(message, details = \"\") {{\n      const toast = document.getElementById(\"toast\");\n      if (!toast)\
    \ return;\n      const small = details ? \"<small>\" + esc(details) + \"</small>\" : \"\";\n      toast.innerHTML = \"<div>\" + esc(message) + \"</div>\" + small;\n      toast.classList.add(\"show\");\n      clearTimeout(window.__helpdeskToastTimer);\n      window.__helpdeskToastTimer = setTimeout(() => {{\n        toast.classList.remove(\"show\");\n      }}, 4200);\n    }}\n    function notificationTypeLabel(type) {{\n      const map = {{\n        ticket_created: \"Nowe zgłoszenie\",\n        status_changed: \"Zmiana statusu\",\n        comment_added: \"Komentarz\",\n        internal_note_added: \"Notatka wewnętrzna\",\n        assignment_changed: \"Przypisanie\",\n        attachment_added: \"Załącznik\",\n        ticket_link_changed: \"Powiązanie zgłoszeń\"\n      }};\n      return map[type] || \"Powiadomienie\";\n    }}\n    async function loadNotifications() {{\n      if (!getSid()) return;\n      const res = await api(\"/api/notifications\");\n      if (!res || !res.ok) return;\n\
    \      const data = await res.json();\n      const unread = Number(data.unread_count || 0);\n      notificationCount.textContent = unread;\n      notificationCount.classList.toggle(\"hidden\", unread <= 0);\n      notificationButton.classList.toggle(\"has-unread\", unread > 0);\n      const items = data.notifications || [];\n      if (!items.length) {{\n        notificationList.innerHTML = `<p class=\"muted\">Brak powiadomień.</p>`;\n        return;\n      }}\n      notificationList.innerHTML = items.map(n => `\n        <button class=\"notification-item ${{n.is_read ? \"\" : \"unread\"}}\" onclick=\"openNotification(${{n.id}}, ${{n.ticket_id || \"null\"}}); return false;\">\n          ${{n.ticket_id ? `<div class=\"notification-ticket\">#${{n.ticket_id}} · ${{esc(n.ticket_title || \"Bez tytułu\")}}</div>` : \"\"}}\n          <div class=\"notification-message\">${{esc(n.message)}}</div>\n          <div class=\"notification-meta\">${{esc(notificationTypeLabel(n.type))}} · ${{esc(n.created_at)}}${{n.is_read\
    \ ? \"\" : \" · nieprzeczytane\"}}</div>\n        </button>\n      `).join(\"\");\n    }}\n    function toggleNotifications() {{\n      notificationPanel.classList.toggle(\"hidden\");\n      if (!notificationPanel.classList.contains(\"hidden\")) loadNotifications();\n    }}\n    async function openNotification(id, ticketId) {{\n      await api(`/api/notifications/${{id}}/read`, {{ method: \"POST\" }});\n      await loadNotifications();\n      notificationPanel.classList.add(\"hidden\");\n      if (ticketId) {{\n        await renderTicket(ticketId);\n      }}\n    }}\n    async function markAllNotificationsRead() {{\n      await api(\"/api/notifications/read-all\", {{ method: \"POST\" }});\n      await loadNotifications();\n    }}\n    function priorityClass(priority) {{ return \"priority-\" + String(priority || \"\").replaceAll(\" \", \"-\"); }}\n    function hasRole(user, role) {{\n      return Array.isArray(user?.roles) && user.roles.includes(role);\n    }}\n    function isAdmin(user)\
    \ {{ return hasRole(user, \"admin\"); }}\n    function isOperator(user) {{ return hasRole(user, \"operator\"); }}\n    function canWorkTickets(user) {{\n      return !!(user && (isOperator(user) || isAdmin(user)));\n    }}\n    function roleBadges(roles) {{\n      const list = Array.isArray(roles) && roles.length ? roles : [\"user\"];\n      return list.map(r => `<span class=\"pill\">${{esc(r)}}</span>`).join(\" \");\n    }}\n    function slaClass(state) {{\n      const map = {{\n        \"ok\": \"sla-ok\",\n        \"warning\": \"sla-warning\",\n        \"overdue\": \"sla-overdue\",\n        \"done\": \"sla-done\",\n        \"none\": \"sla-none\"\n      }};\n      return map[state] || \"sla-none\";\n    }}\n    function slaLabel(state) {{\n      const map = {{\n        \"ok\": \"SLA OK\",\n        \"warning\": \"Blisko SLA\",\n        \"overdue\": \"SLA przekroczone\",\n        \"done\": \"Zakończone\",\n        \"none\": \"Brak SLA\"\n      }};\n      return map[state] || \"Brak SLA\"\
    ;\n    }}\n    function statusClass(status) {{\n      return \"status-\" + String(status || \"\")\n        .normalize(\"NFD\")\n        .replace(/[\\u0300-\\u036f]/g, \"\")\n        .replaceAll(\"ł\", \"l\")\n        .replaceAll(\"Ł\", \"L\")\n        .replace(/[^a-zA-Z0-9]+/g, \"-\")\n        .replace(/^-|-$/g, \"\");\n    }}\n    function subcategoriesForCategory(meta, category) {{\n      const all = meta?.subcategories || {{}};\n      return all[category] || all[\"Inne\"] || [\"Inne\"];\n    }}\n    function updateSubcategorySelect(meta) {{\n      const categorySelect = document.getElementById(\"new-ticket-category\");\n      const subcategorySelect = document.getElementById(\"new-ticket-subcategory\");\n      if (!categorySelect || !subcategorySelect) return;\n      const values = subcategoriesForCategory(meta, categorySelect.value);\n      subcategorySelect.innerHTML = values.map(x => `<option>${{esc(x)}}</option>`).join(\"\");\n    }}\n    function setWsStatus(text, connected)\
    \ {{\n      wsStatus.textContent = text;\n      wsStatus.className = connected ? \"live-value ws-connected\" : \"live-value ws-disconnected\";\n    }}\n    function connectLive() {{\n      const sid = getSid();\n      if (!sid) return;\n      if (liveSocket && (liveSocket.readyState === WebSocket.OPEN || liveSocket.readyState === WebSocket.CONNECTING)) return;\n      const scheme = window.location.protocol === \"https:\" ? \"wss\" : \"ws\";\n      liveSocket = new WebSocket(`${{scheme}}://${{window.location.host}}/ws`);\n      setWsStatus(\"connecting\", false);\n      liveSocket.onopen = () => {{\n        setWsStatus(\"connected\", true);\n        liveSocket.send(JSON.stringify({{ type: \"auth\", sid }}));\n      }};\n      liveSocket.onmessage = (event) => {{\n        const data = JSON.parse(event.data);\n        handleLivePayload(data);\n      }};\n      liveSocket.onclose = () => {{\n        setWsStatus(\"disconnected\", false);\n        if (getSid()) {{\n          clearTimeout(liveReconnectTimer);\n\
    \          liveReconnectTimer = setTimeout(connectLive, 2000);\n        }}\n      }};\n      liveSocket.onerror = () => {{\n        try {{ liveSocket.close(); }} catch (e) {{}}\n      }};\n    }}\n    async function handleLivePayload(data) {{\n      wsClients.textContent = data.active_clients ?? \"-\";\n      wsTime.textContent = data.server_time ?? \"-\";\n      const liveEvent = data.event || null;\n      wsEvent.textContent = liveEvent?.message || data.message || \"-\";\n      if (!liveEvent || !liveEvent.id || liveEvent.id === lastLiveEventId) return;\n      lastLiveEventId = liveEvent.id;\n      await loadNotifications();\n      const refreshEvents = [\n        \"ticket_created\",\n        \"status_changed\",\n        \"auto_status_changed\",\n        \"workflow_rule_status_changed\",\n        \"workflow_rule_notification\",\n        \"workflow_rule_history\",\n        \"comment_added\",\n        \"internal_note_added\",\n        \"assignment_changed\",\n        \"attachment_added\"\
    ,\n        \"watcher_changed\",\n        \"ticket_link_changed\",\n        \"ticket_closed\",\n        \"ticket_reopened\"\n      ];\n      if (!refreshEvents.includes(liveEvent.type)) return;\n      if ([\"status_changed\", \"auto_status_changed\", \"workflow_rule_status_changed\", \"ticket_closed\", \"ticket_reopened\"].includes(liveEvent.type) && !suppressNextLiveRefresh) {{\n        showToast(\n          \"Zmieniono status zgłoszenia #\" + liveEvent.ticket_id,\n          liveEvent.message || \"\"\n        );\n      }}\n      if (liveEvent.type === \"internal_note_added\" && !suppressNextLiveRefresh) {{\n        showToast(\n          \"Dodano notatkę wewnętrzną do zgłoszenia #\" + liveEvent.ticket_id,\n          liveEvent.message || \"\"\n        );\n      }}\n      const shouldSuppress = suppressNextLiveRefresh;\n      if (suppressNextLiveRefresh) {{\n        suppressNextLiveRefresh = false;\n      }}\n      // Nawet gdy pomijamy popup po własnej akcji, odświeżamy aktywny widok,\n\
    \      // żeby lista zgłoszeń, dashboard i kalendarz SLA dostały aktualny status.\n      if (currentView.name === \"ticket\" && Number(currentView.ticketId) === Number(liveEvent.ticket_id)) {{\n        await renderTicket(liveEvent.ticket_id, true);\n        return;\n      }}\n      if (currentView.name === \"home\") {{\n        await renderHome(loadStatusFilters(), true);\n      }}\n      if (currentView.name === \"dashboard\") {{\n        await renderDashboard();\n      }}\n      if (currentView.name === \"sla-calendar\") {{\n        await renderSlaCalendar();\n      }}\n    }}\n    function disconnectLive() {{\n      clearTimeout(liveReconnectTimer);\n      if (liveSocket) {{\n        try {{ liveSocket.close(); }} catch (e) {{}}\n      }}\n      liveSocket = null;\n      setWsStatus(\"disconnected\", false);\n      wsClients.textContent = \"-\";\n      wsTime.textContent = \"-\";\n      wsEvent.textContent = \"-\";\n    }}\n    function loadStatusFilters() {{\n      try {{ return JSON.parse(sessionStorage.getItem(\"\
    helpdesk_status_filters\") || \"[]\"); }}\n      catch {{ return []; }}\n    }}\n    function saveStatusFilters(filters) {{\n      sessionStorage.setItem(\"helpdesk_status_filters\", JSON.stringify(filters));\n    }}\n    function loadAssignedFilter(user = null) {{\n      const stored = sessionStorage.getItem(\"helpdesk_assigned_filter\");\n      if (stored) return stored;\n      if (user && canWorkTickets(user) && isOperator(user)) return \"me\";\n      if (user && canWorkTickets(user)) return \"all\";\n      return \"all\";\n    }}\n    function saveAssignedFilter(value) {{ sessionStorage.setItem(\"helpdesk_assigned_filter\", value || \"all\"); }}\n    function loadPriorityFilter() {{ return sessionStorage.getItem(\"helpdesk_priority_filter\") || \"all\"; }}\n    function savePriorityFilter(value) {{ sessionStorage.setItem(\"helpdesk_priority_filter\", value || \"all\"); }}\n    function loadSlaFilter() {{ return sessionStorage.getItem(\"helpdesk_sla_filter\") || \"all\"; }}\n    function\
    \ saveSlaFilter(value) {{ sessionStorage.setItem(\"helpdesk_sla_filter\", value || \"all\"); }}\n    function loadTicketSearch() {{ return sessionStorage.getItem(\"helpdesk_ticket_search\") || \"\"; }}\n    function saveTicketSearch(value) {{ sessionStorage.setItem(\"helpdesk_ticket_search\", value || \"\"); }}\n    function loadTicketSort() {{ return sessionStorage.getItem(\"helpdesk_ticket_sort\") || \"created_at\"; }}\n    function saveTicketSort(value) {{ sessionStorage.setItem(\"helpdesk_ticket_sort\", value || \"created_at\"); }}\n    function loadTicketOrder() {{ return sessionStorage.getItem(\"helpdesk_ticket_order\") || \"desc\"; }}\n    function saveTicketOrder(value) {{ sessionStorage.setItem(\"helpdesk_ticket_order\", value || \"desc\"); }}\n    function loadTicketPage() {{ return Number(sessionStorage.getItem(\"helpdesk_ticket_page\") || \"1\") || 1; }}\n    function saveTicketPage(value) {{ sessionStorage.setItem(\"helpdesk_ticket_page\", String(Math.max(1, Number(value)\
    \ || 1))); }}\n    function loadTicketPageSize() {{ return Number(sessionStorage.getItem(\"helpdesk_ticket_page_size\") || \"10\") || 10; }}\n    function saveTicketPageSize(value) {{ sessionStorage.setItem(\"helpdesk_ticket_page_size\", String(Number(value) || 10)); }}\n    function resetTicketPage() {{ saveTicketPage(1); }}\n    function toggleStatusFilter(status) {{\n      const filters = loadStatusFilters();\n      const next = filters.includes(status) ? filters.filter(s => s !== status) : filters.concat([status]);\n      saveStatusFilters(next);\n      resetTicketPage();\n      renderHome(next);\n    }}\n    function clearStatusFilters() {{\n      saveStatusFilters([]);\n      resetTicketPage();\n      renderHome([]);\n    }}\n    function setAssignedFilter(value) {{ saveAssignedFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setPriorityFilter(value) {{ savePriorityFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function\
    \ setSlaFilter(value) {{ saveSlaFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function applyTicketSearch(event) {{\n      if (event) event.preventDefault();\n      const input = document.getElementById(\"ticket-search-input\");\n      saveTicketSearch(input ? input.value.trim() : \"\");\n      resetTicketPage();\n      renderHome(loadStatusFilters());\n    }}\n    function setTicketSort(value) {{ saveTicketSort(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setTicketOrder(value) {{ saveTicketOrder(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setTicketPageSize(value) {{ saveTicketPageSize(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function goTicketPage(page) {{ saveTicketPage(page); renderHome(loadStatusFilters()); }}\n    function buildPaginationButtons(pagination) {{\n      const page = Number(pagination.page || 1);\n      const totalPages = Number(pagination.total_pages\
    \ || 1);\n      const buttons = [];\n      function addButton(label, targetPage, disabled = false, active = false) {{\n        buttons.push(`\n          <button\n            class=\"pagination-btn ${{active ? \"active\" : \"\"}}\"\n            ${{disabled ? \"disabled\" : \"\"}}\n            onclick=\"goTicketPage(${{targetPage}})\"\n          >${{label}}</button>\n        `);\n      }}\n      addButton(\"«\", 1, page <= 1);\n      addButton(\"‹\", Math.max(1, page - 1), page <= 1);\n      const candidates = [1, totalPages, page - 2, page - 1, page, page + 1, page + 2]\n        .filter(p => p >= 1 && p <= totalPages);\n      const pages = [...new Set(candidates)].sort((a, b) => a - b);\n      let previous = 0;\n      for (const p of pages) {{\n        if (previous && p - previous > 1) {{\n          buttons.push(`<span class=\"pagination-ellipsis\">…</span>`);\n        }}\n        addButton(String(p), p, false, p === page);\n        previous = p;\n      }}\n      addButton(\"›\", Math.min(totalPages,\
    \ page + 1), page >= totalPages);\n      addButton(\"»\", totalPages, page >= totalPages);\n      return buttons.join(\"\");\n    }}\n    function clearAllFilters() {{\n      saveStatusFilters([]);\n      savePriorityFilter(\"all\");\n      saveSlaFilter(\"all\");\n      saveTicketSearch(\"\");\n      saveTicketSort(\"created_at\");\n      saveTicketOrder(\"desc\");\n      saveTicketPageSize(10);\n      saveTicketPage(1);\n      sessionStorage.removeItem(\"helpdesk_assigned_filter\");\n      renderHome([]);\n    }}\n    function applyWorkView(view) {{\n      saveStatusFilters([]);\n      savePriorityFilter(\"all\");\n      saveSlaFilter(\"all\");\n      saveTicketSearch(\"\");\n      resetTicketPage();\n      if (view === \"queue\") {{\n        saveAssignedFilter(\"me\");\n      }} else if (view === \"unassigned\") {{\n        saveAssignedFilter(\"unassigned\");\n      }} else if (view === \"new\") {{\n        saveAssignedFilter(\"all\");\n        saveStatusFilters([\"Nowe\"]);\n   \
    \   }} else if (view === \"overdue\") {{\n        saveAssignedFilter(\"all\");\n        saveSlaFilter(\"overdue\");\n      }} else if (view === \"waiting_user\") {{\n        saveAssignedFilter(\"all\");\n        saveStatusFilters([\"Oczekuje na użytkownika\"]);\n      }} else {{\n        saveAssignedFilter(\"all\");\n      }}\n      renderHome(loadStatusFilters());\n    }}\n    function detectWorkView(me, filters, assignedFilter, priorityFilter, slaFilter, searchQuery) {{\n      if (!canWorkTickets(me)) return \"\";\n      const statusKey = (filters || []).join(\"|\");\n      const noPriority = priorityFilter === \"all\";\n      const noSearch = !searchQuery;\n      if (assignedFilter === \"me\" && !statusKey && noPriority && slaFilter === \"all\" && noSearch) return \"queue\";\n      if (assignedFilter === \"unassigned\" && !statusKey && noPriority && slaFilter === \"all\" && noSearch) return \"unassigned\";\n      if (assignedFilter === \"all\" && statusKey === \"Nowe\" && noPriority\
