              ${{reportMetricCard("Otwarte teraz", summary.open_now || 0, "aktualnie")}}
              ${{reportMetricCard("Przekroczone SLA", summary.overdue_sla_now || 0, "aktualnie")}}
              ${{reportMetricCard("Śr. pierwsza reakcja", summary.avg_first_response_hours ? `${{summary.avg_first_response_hours}} h` : "-", "w zakresie")}}
              ${{reportMetricCard("Śr. rozwiązanie", summary.avg_resolution_hours ? `${{summary.avg_resolution_hours}} h` : "-", "w zakresie")}}
            </section>
            <div class="grid">
              ${{reportRows("Utworzone według priorytetu", data.by_priority || [], totalCreated, "priority")}}
              ${{reportRows("Utworzone według kategorii", data.by_category || [], totalCreated, "category")}}
            </div>
            <div class="grid">
              ${{reportRows("Aktualny stan według statusu", data.by_status || [], Number(summary.total_now || 0), "status")}}
              ${{reportRows("Aktualny stan według operatora", data.by_operator || [], Number(summary.total_now || 0), "operator")}}
