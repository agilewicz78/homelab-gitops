            FROM users
            WHERE roles IS NOT NULL
              AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))
        """)
        return {row[0] for row in cur.fetchall() if row and row[0]}
    def ticket_notification_participants(cur, ticket_id):
        cur.execute("""
            SELECT requester_email, assigned_to_email
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
