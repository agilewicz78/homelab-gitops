          document.getElementById("workflowSubcategorySelect").addEventListener("change", (e) => {
            if (workflowAutomationEditorWorkflow) workflowAutomationEditorWorkflow.subcategory = e.target.value;
          });
          if (draftAutomationRule && editing) {
