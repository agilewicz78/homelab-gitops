              </form>
            </section>
            <section class="card">
              <h3>Zmiana hasła</h3>
              <p id="passwordMessage" class="success hidden">Hasło zostało zmienione.</p>
              <p id="passwordError" class="error hidden">Nie udało się zmienić hasła.</p>
              <form id="passwordForm">
                <label>Obecne hasło</label>
                <input name="current_password" type="password" required>
                <label>Nowe hasło</label>
                <input name="new_password" type="password" minlength="8" required>
                <label>Powtórz nowe hasło</label>
                <input name="confirm_password" type="password" minlength="8" required>
                <button type="submit">Zmień hasło</button>
              </form>
            </section>`;
          document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = Object.fromEntries(new FormData(e.target).entries());
            const res = await api("/api/profile", { method: "PUT", body: JSON.stringify(payload) });
            if (!res || !res.ok) { alert("Nie udało się zapisać profilu."); return; }
            document.getElementById("profileMessage").classList.remove("hidden");
            await loadMe();
          });
          document.getElementById("passwordForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = Object.fromEntries(new FormData(e.target).entries());
            const msg = document.getElementById("passwordMessage");
            const err = document.getElementById("passwordError");
            msg.classList.add("hidden");
            err.classList.add("hidden");
            if (payload.new_password !== payload.confirm_password) {
              err.textContent = "Nowe hasła nie są takie same.";
              err.classList.remove("hidden");
              return;
            }
            const res = await api("/api/profile/password", { method: "POST", body: JSON.stringify(payload) });
            if (!res || !res.ok) {
              const data = res ? await res.json().catch(() => ({})) : {};
              err.textContent = data.error || "Nie udało się zmienić hasła.";
              err.classList.remove("hidden");
              return;
            }
            e.target.reset();
            msg.classList.remove("hidden");
          });
        }
