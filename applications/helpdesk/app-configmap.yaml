        async function submitKnowledgeFeedback(articleId, helpful, reasonCode = "", reasonComment = "") {{
          suppressNextLiveRefresh = true;
          const res = await api(`/api/knowledge-articles/${{articleId}}/feedback`, {{
            method: "POST",
            body: JSON.stringify({{
              helpful,
              reason_code: reasonCode,
              reason_comment: reasonComment
            }})
          }});
          if (!res || !res.ok) {{
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({{}})) : {{}};
            alert(err.error || "Nie udało się zapisać oceny artykułu.");
            return;
          }}
          closeKnowledgeFeedbackModal();
          showToast(helpful ? "Dziękujemy za pozytywną ocenę" : "Dziękujemy za informację");
