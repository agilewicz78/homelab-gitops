        async function unlinkIncidentTicket(incidentId, ticketId) {{
          if (!confirm("Odłączyć zgłoszenie od incydentu?")) return;
          const res = await api(`/api/incidents/${{incidentId}}/tickets/${{ticketId}}`, {{ method: "DELETE" }});
          if (!res || !res.ok) {{
            const err = res ? await res.json().catch(() => ({{}})) : {{}};
            alert(err.error || "Nie udało się odłączyć zgłoszenia.");
            return;
          }}
          showToast("Odłączono zgłoszenie #" + ticketId);
