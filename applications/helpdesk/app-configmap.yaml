              Komentarz operatora w obecnym statusie: ${{data.sample?.operator_added_comment ? "tak" : "nie"}}. Załącznik operatora w obecnym statusie: ${{data.sample?.operator_added_attachment ? "tak" : "nie"}}.
            </div>
            ${{missing ? `<div class="error" style="margin-top:8px">Symulacja blokady: brak ${{esc(missing)}}.</div>` : ""}}
            <h4>Powód</h4>
            <ul>${{reasons}}</ul>
            <h4>Podgląd akcji</h4>
            <ul>${{actions || "<li>Brak akcji.</li>"}}</ul>
            <div class="attachment-upload-hint" style="margin-top:8px">Status końcowy w symulacji: ${{esc(data.final_status || data.sample?.event_new_status || data.sample?.current_status || "—")}}</div>
          `;
        }}
        async function saveWorkflowAutomationRuleForm(e) {{
          e.preventDefault();
