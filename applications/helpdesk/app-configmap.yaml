    def can_view_ticket(user, ticket_id):
        if not user:
            return False
        # Operatorzy i admini mogą widzieć wszystkie zgłoszenia oraz ich załączniki.
        if is_staff(user):
            return True
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT
              requester_email,
              assigned_to_email,
              EXISTS (
                SELECT 1
                FROM ticket_watchers tw
                WHERE tw.ticket_id = tickets.id
                  AND lower(tw.user_email) = lower(%s)
              ) AS is_watcher
            FROM tickets
            WHERE id = %s
        """, (user.get("email") or "", ticket_id))
        row = cur.fetchone()
        cur.close()
        conn.close()
        if not row:
            return False
        requester_email, assigned_to_email, is_watcher = row
        user_email = (user.get("email") or "").lower()
        return bool(
            user_email
            and (
                user_email == (requester_email or "").lower()
                or user_email == (assigned_to_email or "").lower()
                or is_watcher
            )
        )
    def get_ticket_status_for_update(cur, ticket_id):
        cur.execute("SELECT status FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        if not row:
            return None
        return row[0]
    def ensure_ticket_mutable(cur, ticket_id):
        status = get_ticket_status_for_update(cur, ticket_id)
        if status is None:
            return False, jsonify({"error": "not found"}), 404
        if status == "Zamknięte":
            return False, jsonify({"error": "Zgłoszenie jest zamknięte i dostępne tylko do odczytu."}), 400
        return True, status, None
    def workflow_first_active_status_after_new(statuses):
        skipped = {"Nowe", "Zamknięte", "Rozwiązane", "Zrealizowane"}
        for candidate in statuses:
            if candidate not in skipped:
                return candidate
        return None
    def apply_workflow_event_rules(cur, ticket_id, user, event_type, current_status, visibility=None, event_new_status=None):
        """
        Elastyczne reguły workflow: zdarzenie + warunki + wiele akcji.
        Obsługiwane akcje MVP: change_status, notify, add_history.
        Każde dopasowanie reguły zapisujemy w workflow_rule_executions.
        """
        if current_status == "Zamknięte":
            return []
        cur.execute("SELECT COALESCE(workflow_key, 'default'), assigned_to_email FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        workflow_key = row[0] if row else "default"
        assigned_to_email = row[1] if row else None
        workflow_id = workflow_id_by_key(cur, workflow_key)
        statuses = workflow_statuses(workflow_key)
        rules = workflow_automations_for_event(cur, workflow_key, event_type, current_status, user, visibility, assigned_to_email, event_new_status)
        executed = []
        effective_status = event_new_status or current_status
        for rule in rules:
            rule_name = rule.get("name") or "Reguła workflow"
            action_executed = False
            action_results = []
            actions = rule.get("actions") or [{
                "action_type": rule.get("action_type") or "change_status",
                "action_value": rule.get("action_status"),
                "is_active": True,
                "action_order": 1,
            }]
            for action in actions:
                if action.get("is_active") is False:
                    action_results.append({
                        "action_type": action.get("action_type") or "change_status",
                        "result": "skipped",
                        "reason": "akcja nieaktywna",
                    })
                    continue
                action_type = action.get("action_type") or "change_status"
                if action_type == "change_status":
                    target_status = action.get("action_value") or rule.get("action_status")
                    if not target_status:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "brak statusu docelowego"})
                        continue
                    if target_status not in statuses:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "status docelowy nie istnieje w workflow", "target_status": target_status})
                        continue
                    if target_status == effective_status:
                        action_results.append({"action_type": action_type, "result": "skipped", "reason": "status docelowy jest taki sam", "target_status": target_status})
                        continue
                    old_status = effective_status
                    cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (target_status, ticket_id))
                    message = f"Reguła workflow „{rule_name}” zmieniła status z {old_status} na {target_status}."
                    add_ticket_event(cur, ticket_id, user, "workflow_rule_status_changed", message)
                    log_audit(cur, user, "workflow_rule_status_changed", "ticket", ticket_id, {
                        "rule": rule_name,
                        "event_type": event_type,
                        "old_status": old_status,
                        "new_status": target_status,
                        "workflow_key": workflow_key,
                    })
                    create_ticket_notifications(
                        cur,
                        ticket_id,
                        "workflow_rule_status_changed",
                        f"Status zgłoszenia #{ticket_id} został automatycznie zmieniony z {old_status} na {target_status}.",
                        actor_email=user["email"],
                    )
                    executed.append({
                        "rule": rule_name,
                        "action_type": action_type,
                        "old_status": old_status,
                        "new_status": target_status,
                    })
                    action_results.append({
                        "action_type": action_type,
                        "result": "executed",
                        "old_status": old_status,
                        "new_status": target_status,
                    })
                    action_executed = True
                    effective_status = target_status
                    current_status = target_status
                elif action_type == "notify":
                    create_ticket_notifications(
                        cur,
                        ticket_id,
                        "workflow_rule_notification",
                        f"Reguła workflow „{rule_name}” została uruchomiona dla zgłoszenia #{ticket_id}.",
                        actor_email=user["email"],
                    )
                    executed.append({"rule": rule_name, "action_type": action_type})
                    action_results.append({"action_type": action_type, "result": "executed"})
                    action_executed = True
                elif action_type == "add_history":
                    add_ticket_event(cur, ticket_id, user, "workflow_rule_history", f"Uruchomiono regułę workflow „{rule_name}”.")
                    executed.append({"rule": rule_name, "action_type": action_type})
                    action_results.append({"action_type": action_type, "result": "executed"})
                    action_executed = True
                else:
                    action_results.append({"action_type": action_type, "result": "skipped", "reason": "nieobsługiwany typ akcji"})
            reason = "wykonano" if action_executed else "reguła pasowała, ale żadna akcja nie została wykonana"
            log_workflow_rule_execution(
                cur,
                rule.get("id"),
                rule.get("workflow_id") or workflow_id,
                rule.get("workflow_key") or workflow_key,
                ticket_id,
                event_type,
                matched=True,
                actions_executed=action_results,
                reason=reason,
            )
            if action_executed and rule.get("stop_processing", True):
                break
        return executed
    def apply_auto_status_after_comment(cur, ticket_id, user, current_status, visibility):
        """
        Zgodność wsteczna: komentarz/notatka uruchamia elastyczne reguły workflow.
        Jeżeli workflow nie ma reguł, działa fallback zgodny z wcześniejszym MVP.
        """
        executed = apply_workflow_event_rules(cur, ticket_id, user, "comment_added", current_status, visibility)
        for item in executed:
            if item.get("action_type") == "change_status":
                return {
                    "old_status": item.get("old_status"),
                    "new_status": item.get("new_status"),
                    "reason": item.get("rule"),
                }
        if current_status == "Zamknięte":
            return None
        cur.execute("SELECT COALESCE(workflow_key, 'default') FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        workflow_key = row[0] if row else "default"
        statuses = workflow_statuses(workflow_key)
        target_status = None
        reason = None
        if (not is_staff(user)) and visibility == "public" and current_status == "Oczekuje na użytkownika":
            for candidate in ("Otwarte", "W trakcie", "Diagnostyka", "W realizacji", "Nowe"):
                if candidate in statuses and candidate != current_status:
                    target_status = candidate
                    break
            reason = "fallback: użytkownik dodał komentarz publiczny"
        elif is_staff(user) and current_status == "Nowe":
            for candidate in ("W trakcie", "Diagnostyka", "Weryfikacja wniosku", "Analiza", "W realizacji", "Otwarte"):
                if candidate in statuses and candidate != current_status:
                    target_status = candidate
                    break
            if not target_status:
                target_status = workflow_first_active_status_after_new(statuses)
            reason = "fallback: operator/admin dodał komentarz lub notatkę"
        if not target_status or target_status == current_status:
            return None
        cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (target_status, ticket_id))
        message = f"Automatyczna zmiana statusu z {current_status} na {target_status}: {reason}."
        add_ticket_event(cur, ticket_id, user, "auto_status_changed", message)
        log_audit(cur, user, "ticket_status_auto_changed", "ticket", ticket_id, {
            "old_status": current_status,
            "new_status": target_status,
            "reason": reason,
            "workflow_key": workflow_key,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "auto_status_changed",
            f"Status zgłoszenia #{ticket_id} został automatycznie zmieniony z {current_status} na {target_status}.",
            actor_email=user["email"],
        )
        return {
            "old_status": current_status,
            "new_status": target_status,
            "reason": reason,
        }
