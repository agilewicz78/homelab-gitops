              ${{workViewButton("unassigned", "Nieprzypisane", activeView)}}
              ${{workViewButton("new", "Nowe", activeView)}}
              ${{workViewButton("overdue", "SLA przekroczone", activeView)}}
              ${{workViewButton("waiting_user", "Oczekuje na użytkownika", activeView)}}
              ${{workViewButton("all", "Wszystkie", activeView)}}
            </div>
          `;
        }}
