    </head>
    <body>
      <main class="page">
        <header>
          <div>
            <h1>INCoprp Helpdesk</h1>
            <p class="subtitle">Centrum zgłoszeń IT dla pracowników biurowych.</p>
          </div>
          <div class="header-actions">
            <div id="userBadge" class="badge">Ładowanie...</div>
            <div class="notification-wrapper">
              <button id="notificationButton" class="notification-btn" onclick="toggleNotifications(); return false;">
                🔔 Powiadomienia <span id="notificationCount" class="notification-count hidden">0</span>
              </button>
              <div id="notificationPanel" class="notification-panel hidden">
                <div class="notification-panel-header">
                  <div>
                    <h3>Powiadomienia</h3>
                    <p class="muted" style="margin:4px 0 0">Centrum ostatnich zdarzeń przypisanych do Twojego konta.</p>
                  </div>
                  <div class="notification-panel-actions">
                    <button class="btn-secondary btn-small" onclick="loadNotifications(); return false;">Odśwież</button>
                    <button class="btn-secondary btn-small" onclick="markAllNotificationsRead(); return false;">Oznacz wszystkie</button>
                    <button class="btn-secondary btn-small" onclick="deleteReadNotifications(); return false;">Usuń przeczytane</button>
                  </div>
                </div>
                <div class="notification-tabs">
                  <button id="notificationTabAll" class="notification-tab active" onclick="setNotificationFilter('all'); return false;">Wszystkie</button>
                  <button id="notificationTabUnread" class="notification-tab" onclick="setNotificationFilter('unread'); return false;">Nieprzeczytane</button>
                </div>
                <div id="notificationList" class="notification-list">
                  <p class="muted">Brak powiadomień.</p>
                </div>
              </div>
            </div>
            <div id="livePanel" class="live-panel">
              <div class="live-row"><span>WebSocket</span><span id="wsStatus" class="live-value ws-disconnected">disconnected</span></div>
              <div class="live-row"><span>Aktywni</span><span id="wsClients" class="live-value">-</span></div>
              <div class="live-row"><span>Czas serwera</span><span id="wsTime" class="live-value">-</span></div>
              <div class="live-row"><span>Ostatnie zdarzenie</span><span id="wsEvent" class="live-value">-</span></div>
            </div>
          </div>
        </header>
        <div id="app"></div>
      </main>
      <div id="toast" class="toast"></div>
      <div id="closeTicketModal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <h2>Zamknięcie zgłoszenia</h2>
              <p id="closeTicketModalSubtitle" class="muted">Uzupełnij podsumowanie przed zamknięciem zgłoszenia.</p>
            </div>
            <button class="btn-secondary btn-small" onclick="closeCloseTicketModal(); return false;">✕</button>
          </div>
          <form id="closeTicketForm" enctype="multipart/form-data">
            <div class="resolution-time-grid">
              <div>
                <label>Czas rozwiązania — godziny</label>
                <input name="resolution_hours" type="number" min="0" max="999" value="0">
              </div>
              <div>
                <label>Czas rozwiązania — minuty</label>
                <input name="resolution_minutes" type="number" min="0" max="59" value="0">
              </div>
            </div>
            <label>Komentarz końcowy / opis rozwiązania</label>
            <textarea name="resolution_summary" rows="5" placeholder="Opisz, co zostało wykonane i jak rozwiązano zgłoszenie."></textarea>
            <div id="closeCommentVisibilityBox" class="switch-row">
              <div>
                <strong>Notatka wewnętrzna</strong>
                <small>Włącz, jeśli komentarz końcowy ma być widoczny tylko dla operatorów i administratorów.</small>
              </div>
              <label class="switch">
                <input id="close-comment-internal" name="internal_note" type="checkbox">
                <span class="slider"></span>
              </label>
            </div>
            <label>Załącznik opcjonalny</label>
            <input name="file" type="file">
            <div class="attachment-upload-hint">Dozwolone: png, jpg, jpeg, gif, pdf, txt, log, csv, xlsx, docx. Maksymalnie 10 MB.</div>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" onclick="closeCloseTicketModal(); return false;">Anuluj</button>
              <button type="submit">Zamknij zgłoszenie</button>
            </div>
          </form>
        </div>
      </div>
      <div id="reopenTicketModal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <h2>Ponowne otwarcie zgłoszenia</h2>
              <p id="reopenTicketModalSubtitle" class="muted">Podaj powód ponownego otwarcia zgłoszenia.</p>
            </div>
            <button class="btn-secondary btn-small" onclick="closeReopenTicketModal(); return false;">✕</button>
          </div>
          <form id="reopenTicketForm">
            <label>Powód ponownego otwarcia</label>
            <textarea name="reason" rows="5" placeholder="Opisz, dlaczego zamknięte zgłoszenie powinno zostać otwarte ponownie." required></textarea>
            <div class="attachment-upload-hint">Powód zostanie zapisany w historii zgłoszenia i audycie.</div>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" onclick="closeReopenTicketModal(); return false;">Anuluj</button>
              <button type="submit">Otwórz ponownie</button>
            </div>
          </form>
        </div>
      </div>
      <div id="incidentFromTicketsModal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <h2>Utwórz incydent z powiązanych zgłoszeń</h2>
              <p class="muted">Sprawdź listę ticketów. Incydent i wszystkie wybrane powiązania zostaną zapisane razem.</p>
            </div>
            <button class="btn-secondary btn-small" onclick="closeIncidentFromTicketsModal(); return false;">✕</button>
          </div>
          <form id="incidentFromTicketsForm">
            <div class="grid">
              <div>
                <label>Tytuł</label>
                <input name="title" required>
              </div>
              <div>
                <label>Poziom</label>
                <select name="severity" id="incidentFromTicketsSeverity"></select>
              </div>
            </div>
            <label>Dowódca incydentu</label>
            <select name="commander_email" id="incidentFromTicketsCommander"></select>
            <label>Opis sytuacji</label>
            <textarea name="summary" rows="4" required></textarea>
            <label>Wpływ na organizację</label>
            <textarea name="impact" rows="3" placeholder="Kogo dotyczy problem i jakie procesy są zablokowane?"></textarea>
            <div class="panel-soft">
              <h4>Status dla użytkowników</h4>
              <p class="muted">Te pola pojawią się w każdym powiązanym zgłoszeniu jako prosty opis sytuacji.</p>
              <label>Co już wiemy?</label>
              <textarea name="user_status_summary" rows="3" placeholder="Np. Problem dotyczy wielu użytkowników i powoduje błędy wysyłania poczty."></textarea>
              <label>Co robimy teraz?</label>
              <textarea name="user_current_action" rows="3" placeholder="Np. Sprawdzamy kolejki pocztowe i konfigurację bramy SMTP."></textarea>
              <label>Kolejna aktualizacja</label>
              <input name="next_update_hint" placeholder="Np. Około 14:30 albo po potwierdzeniu dostawcy.">
            </div>
            <label>Dołączone zgłoszenia</label>
            <div id="incidentFromTicketsList" class="watcher-list"></div>
            <div class="attachment-upload-hint">Zgłoszenie źródłowe jest wymagane. Zamknięte tickety nie mogą zostać dołączone.</div>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" onclick="closeIncidentFromTicketsModal(); return false;">Anuluj</button>
              <button type="submit">Utwórz incydent i powiąż zgłoszenia</button>
            </div>
          </form>
        </div>
      </div>
      <div id="knowledgeArticleModal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <h2 id="knowledgeArticleModalTitle">Artykuł bazy wiedzy</h2>
              <p class="muted">Sprawdź treść przed publikacją. Dane innych użytkowników nie powinny trafiać do rozwiązania.</p>
            </div>
            <button class="btn-secondary btn-small" onclick="closeKnowledgeArticleModal(); return false;">✕</button>
          </div>
          <form id="knowledgeArticleForm">
            <label>Tytuł artykułu</label>
            <input name="title" required>
            <label>Opis problemu</label>
            <textarea name="problem" rows="4" required></textarea>
            <label>Rozwiązanie krok po kroku</label>
            <textarea name="solution" rows="7" required></textarea>
            <div class="grid">
              <div>
                <label>Kategoria</label>
                <select name="category" id="knowledgeArticleCategory"></select>
              </div>
              <div>
                <label>Podkategoria</label>
                <select name="subcategory" id="knowledgeArticleSubcategory"></select>
              </div>
            </div>
            <label>Status</label>
            <select name="status">
              <option value="published">Opublikowany</option>
              <option value="draft">Szkic</option>
              <option value="archived">Archiwalny</option>
            </select>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" onclick="closeKnowledgeArticleModal(); return false;">Anuluj</button>
              <button type="submit">Zapisz artykuł</button>
            </div>
          </form>
        </div>
      </div>
      <div id="knowledgeFeedbackModal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <h2>Dlaczego artykuł nie pomógł?</h2>
              <p class="muted">Ta informacja trafi do operatorów i pomoże poprawić instrukcję.</p>
            </div>
            <button class="btn-secondary btn-small" onclick="closeKnowledgeFeedbackModal(); return false;">✕</button>
          </div>
          <form id="knowledgeFeedbackForm">
            <label>Powód</label>
            <select name="reason_code" id="knowledgeFeedbackReason" required></select>
            <label>Co konkretnie warto poprawić? <span class="muted">(opcjonalnie)</span></label>
            <textarea name="reason_comment" id="knowledgeFeedbackComment" rows="4" maxlength="500" placeholder="Np. krok 3 nie odpowiada aktualnemu wyglądowi aplikacji."></textarea>
            <div class="attachment-upload-hint">Komentarz jest widoczny tylko dla operatorów i administratorów.</div>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" onclick="closeKnowledgeFeedbackModal(); return false;">Anuluj</button>
              <button type="submit">Wyślij opinię</button>
            </div>
          </form>
        </div>
      </div>
      <script>
        const appEl = document.getElementById("app");
        const userBadge = document.getElementById("userBadge");
        const notificationButton = document.getElementById("notificationButton");
        const notificationCount = document.getElementById("notificationCount");
        const notificationPanel = document.getElementById("notificationPanel");
        const notificationList = document.getElementById("notificationList");
        const wsStatus = document.getElementById("wsStatus");
        const wsClients = document.getElementById("wsClients");
        const wsTime = document.getElementById("wsTime");
        const wsEvent = document.getElementById("wsEvent");
        let liveSocket = null;
        let liveReconnectTimer = null;
        let lastLiveEventId = null;
        let currentView = { name: "home", ticketId: null };
        let incidentListFilter = "active";
        let suppressNextLiveRefresh = false;
        let closeTicketId = null;
        let reopenTicketId = null;
        let incidentCreationContext = null;
        let knowledgeArticleContext = null;
        let knowledgeFeedbackContext = null;
        let knowledgeSuggestionTimer = null;
        let knowledgeSuggestionRequest = 0;
        let adminServiceCatalogCache = null;
        let pendingNewTicketServiceId = null;
        function getSid() { return sessionStorage.getItem("helpdesk_sid") || ""; }
        function setSid(sid) { sessionStorage.setItem("helpdesk_sid", sid); }
        function clearSid() { sessionStorage.removeItem("helpdesk_sid"); }
        async function api(path, options = {}) {
          const headers = options.headers || {};
          headers["X-Helpdesk-Session"] = getSid();
          if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
          const res = await fetch(path, { ...options, headers });
          if (res.status === 401) {
            clearSid();
            window.location.href = "/login";
            return null;
          }
          return res;
        }
        function esc(value) {
          return String(value ?? "").replace(/[&<>"']/g, ch => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
          }[ch]));
        }
        function formatBytes(bytes) {
          const value = Number(bytes || 0);
          if (value < 1024) return value + " B";
          if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " KB";
          return (value / (1024 * 1024)).toFixed(1) + " MB";
        }
        function formatResolutionMinutes(totalMinutes) {
          const value = Number(totalMinutes || 0);
          const hours = Math.floor(value / 60);
          const minutes = value % 60;
          if (hours && minutes) return `${hours}h ${minutes}m`;
          if (hours) return `${hours}h`;
          return `${minutes}m`;
        }
        function openCloseTicketModal(ticketId) {
          closeTicketId = ticketId;
          const modal = document.getElementById("closeTicketModal");
          const subtitle = document.getElementById("closeTicketModalSubtitle");
          const form = document.getElementById("closeTicketForm");
          if (form) form.reset();
          if (subtitle) subtitle.textContent = "Zamknięcie zgłoszenia #" + ticketId;
          if (modal) modal.classList.remove("hidden");
        }
        function closeCloseTicketModal() {
          closeTicketId = null;
          const modal = document.getElementById("closeTicketModal");
          if (modal) modal.classList.add("hidden");
        }
        function openReopenTicketModal(ticketId) {
          reopenTicketId = ticketId;
          const modal = document.getElementById("reopenTicketModal");
          const subtitle = document.getElementById("reopenTicketModalSubtitle");
          const form = document.getElementById("reopenTicketForm");
          if (form) form.reset();
          if (subtitle) subtitle.textContent = "Ponowne otwarcie zgłoszenia #" + ticketId;
          if (modal) modal.classList.remove("hidden");
        }
        function closeReopenTicketModal() {
          reopenTicketId = null;
          const modal = document.getElementById("reopenTicketModal");
          if (modal) modal.classList.add("hidden");
        }
        function openIncidentFromTicketsModal() {
          const context = incidentCreationContext;
          if (!context || !Array.isArray(context.tickets) || context.tickets.length < 2) {
            alert("Najpierw powiąż co najmniej dwa otwarte zgłoszenia.");
            return;
          }
          const modal = document.getElementById("incidentFromTicketsModal");
          const form = document.getElementById("incidentFromTicketsForm");
          const list = document.getElementById("incidentFromTicketsList");
          const severity = document.getElementById("incidentFromTicketsSeverity");
          const commander = document.getElementById("incidentFromTicketsCommander");
          if (!modal || !form || !list || !severity || !commander) return;
          form.reset();
          form.elements.title.value = `Incydent: ${context.sourceTitle}`;
          form.elements.summary.value = `Problem został zgłoszony w ${context.tickets.length} powiązanych zgłoszeniach. Zgłoszenie źródłowe #${context.sourceTicketId}: ${context.sourceTitle}`;
          form.elements.user_status_summary.value = `Problem dotyczy ${context.tickets.length} powiązanych zgłoszeń. Helpdesk obsługuje go jako incydent zbiorczy.`;
          form.elements.user_current_action.value = "Analizujemy zgłoszenia i ustalamy przyczynę problemu.";
          form.elements.next_update_hint.value = "Kolejna aktualizacja pojawi się po potwierdzeniu wpływu i przyczyny.";
          severity.innerHTML = (context.severities || ["SEV1", "SEV2", "SEV3", "SEV4"])
            .map(value => `<option ${value === "SEV2" ? "selected" : ""}>${esc(value)}</option>`)
            .join("");
          commander.innerHTML = `<option value="">Ja</option>${(context.commanders || []).map(item =>
            `<option value="${esc(item.email)}">${esc(item.name)} · ${esc(item.email)}</option>`
          ).join("")}`;
          list.innerHTML = context.tickets.map(ticket => `
            <label class="watcher-item incident-ticket-choice">
              <input type="checkbox" data-ticket-id="${ticket.id}" checked ${ticket.id === context.sourceTicketId ? "disabled" : ""}>
              <span>
                <strong>#${ticket.id} · ${esc(ticket.title)}</strong>
                <span class="watcher-meta"><span class="pill ${statusClass(ticket.status)}">${esc(ticket.status)}</span></span>
              </span>
            </label>
          `).join("");
          modal.classList.remove("hidden");
        }
        function closeIncidentFromTicketsModal() {
          const modal = document.getElementById("incidentFromTicketsModal");
          if (modal) modal.classList.add("hidden");
        }
        function updateKnowledgeSubcategories(selected = "") {
          const categorySelect = document.getElementById("knowledgeArticleCategory");
          const subcategorySelect = document.getElementById("knowledgeArticleSubcategory");
          if (!categorySelect || !subcategorySelect || !knowledgeArticleContext) return;
          const values = knowledgeArticleContext.subcategories?.[categorySelect.value] || ["Inne"];
          subcategorySelect.innerHTML = values.map(value =>
            `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(value)}</option>`
          ).join("");
        }
        function openKnowledgeArticleModal() {
          const context = knowledgeArticleContext;
          if (!context) return;
          const modal = document.getElementById("knowledgeArticleModal");
          const form = document.getElementById("knowledgeArticleForm");
          const heading = document.getElementById("knowledgeArticleModalTitle");
          const categorySelect = document.getElementById("knowledgeArticleCategory");
          if (!modal || !form || !heading || !categorySelect) return;
          form.reset();
          const article = context.article || {};
          heading.textContent = context.mode === "edit" ? `Edytuj artykuł #${article.id}` : "Utwórz artykuł z rozwiązania";
          form.elements.title.value = article.title || context.title || "";
          form.elements.problem.value = article.problem || context.problem || "";
          form.elements.solution.value = article.solution || context.solution || "";
          form.elements.status.value = article.status || "published";
          categorySelect.innerHTML = (context.categories || []).map(value =>
            `<option value="${esc(value)}" ${value === (article.category || context.category) ? "selected" : ""}>${esc(value)}</option>`
          ).join("");
          updateKnowledgeSubcategories(article.subcategory || context.subcategory || "Inne");
          categorySelect.onchange = () => updateKnowledgeSubcategories("Inne");
          modal.classList.remove("hidden");
        }
        function closeKnowledgeArticleModal() {
          const modal = document.getElementById("knowledgeArticleModal");
          if (modal) modal.classList.add("hidden");
        }
        async function downloadAttachment(id, filename) {
          const res = await fetch(`/api/attachments/${id}/download`, {
            headers: { "X-Helpdesk-Session": getSid() }
          });
          if (res.status === 401) {
            clearSid();
            window.location.href = "/login";
            return;
          }
          if (!res.ok) {
            alert("Nie udało się pobrać załącznika.");
            return;
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename || "attachment";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }
        function showToast(message, details = "") {
          const toast = document.getElementById("toast");
          if (!toast) return;
          const small = details ? "<small>" + esc(details) + "</small>" : "";
          toast.innerHTML = "<div>" + esc(message) + "</div>" + small;
          toast.classList.add("show");
          clearTimeout(window.__helpdeskToastTimer);
          window.__helpdeskToastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 4200);
        }
        function notificationTypeLabel(type) {
          const map = {
            ticket_created: "Nowe zgłoszenie",
            status_changed: "Zmiana statusu",
            comment_added: "Komentarz",
            incident_update: "Aktualizacja incydentu",
            incident_linked: "Powiązanie z incydentem",
            internal_note_added: "Notatka wewnętrzna",
            assignment_changed: "Przypisanie",
            attachment_added: "Załącznik",
            ticket_link_changed: "Powiązanie zgłoszeń",
            sla_first_response_overdue: "SLA reakcji przekroczone",
            sla_first_response_warning: "SLA reakcji blisko terminu",
            sla_resolution_overdue: "SLA rozwiązania przekroczone",
            sla_resolution_warning: "SLA rozwiązania blisko terminu",
            resolution_feedback_accepted: "Rozwiązanie potwierdzone",
            resolution_feedback_rejected: "Rozwiązanie odrzucone",
            workflow_rule_notification: "Automatyzacja workflow"
          };
          return map[type] || "Powiadomienie";
        }
        let notificationFilter = "all";
        function setNotificationFilter(filter) {
          notificationFilter = filter === "unread" ? "unread" : "all";
          const allTab = document.getElementById("notificationTabAll");
          const unreadTab = document.getElementById("notificationTabUnread");
          if (allTab) allTab.classList.toggle("active", notificationFilter === "all");
          if (unreadTab) unreadTab.classList.toggle("active", notificationFilter === "unread");
          loadNotifications();
        }
        async function loadNotifications() {
          if (!getSid()) return;
          const unreadOnly = notificationFilter === "unread" ? "?unread=1" : "";
          const res = await api("/api/notifications" + unreadOnly);
          if (!res || !res.ok) return;
          const data = await res.json();
          const unread = Number(data.unread_count || 0);
          notificationCount.textContent = unread;
          notificationCount.classList.toggle("hidden", unread <= 0);
          notificationButton.classList.toggle("has-unread", unread > 0);
          const items = data.notifications || [];
          if (!items.length) {
            const label = notificationFilter === "unread" ? "Brak nieprzeczytanych powiadomień." : "Brak powiadomień.";
            notificationList.innerHTML = `<p class="muted">${label}</p>`;
            return;
          }
          notificationList.innerHTML = items.map(n => `
            <div class="notification-card ${n.is_read ? "" : "unread"}">
              <button class="notification-open" onclick="openNotification(${n.id}, ${n.ticket_id || "null"}); return false;">
                ${n.ticket_id ? `<div class="notification-ticket">#${n.ticket_id} · ${esc(n.ticket_title || "Bez tytułu")}</div>` : ""}
                <div class="notification-message">${esc(n.message)}</div>
                <div class="notification-meta">${esc(notificationTypeLabel(n.type))} · ${esc(n.created_at)}${n.is_read ? "" : " · nieprzeczytane"}</div>
              </button>
              <div class="notification-item-actions">
                ${n.is_read
                  ? `<button class="btn-secondary btn-small" title="Oznacz jako nieprzeczytane" onclick="markNotificationUnread(${n.id}); return false;">Nieprzecz.</button>`
                  : `<button class="btn-secondary btn-small" title="Oznacz jako przeczytane" onclick="markNotificationRead(${n.id}); return false;">Przecz.</button>`}
                <button class="btn-danger btn-small" title="Usuń powiadomienie" onclick="deleteNotification(${n.id}); return false;">Usuń</button>
              </div>
            </div>
          `).join("");
        }
        function toggleNotifications() {
          notificationPanel.classList.toggle("hidden");
          if (!notificationPanel.classList.contains("hidden")) loadNotifications();
        }
        async function openNotification(id, ticketId) {
          await api(`/api/notifications/${id}/read`, { method: "POST" });
          await loadNotifications();
          notificationPanel.classList.add("hidden");
          if (ticketId) {
            await renderTicket(ticketId);
          }
        }
        async function markNotificationRead(id) {
          await api(`/api/notifications/${id}/read`, { method: "POST" });
          await loadNotifications();
        }
        async function markNotificationUnread(id) {
          await api(`/api/notifications/${id}/unread`, { method: "POST" });
          await loadNotifications();
        }
        async function deleteNotification(id) {
          if (!confirm("Usunąć to powiadomienie?")) return;
          await api(`/api/notifications/${id}`, { method: "DELETE" });
          await loadNotifications();
        }
        async function markAllNotificationsRead() {
          await api("/api/notifications/read-all", { method: "POST" });
          await loadNotifications();
        }
        async function deleteReadNotifications() {
          if (!confirm("Usunąć wszystkie przeczytane powiadomienia?")) return;
          await api("/api/notifications/delete-read", { method: "POST" });
          await loadNotifications();
        }
        function priorityClass(priority) { return "priority-" + String(priority || "").replaceAll(" ", "-"); }
        function hasRole(user, role) {
          return Array.isArray(user?.roles) && user.roles.includes(role);
        }
        function isAdmin(user) { return hasRole(user, "admin"); }
        function isOperator(user) { return hasRole(user, "operator"); }
        // Centralne funkcje uprawnień po stronie UI.
        // Menu i ekrany modułów korzystają z tych samych kodów uprawnień,
        // które backend zwraca w /api/me i egzekwuje na endpointach API.
        function canWorkTickets(user) {
          if (Array.isArray(user?.permissions)) {
            return user.permissions.includes("tickets.work") || user.permissions.includes("system.admin");
          }
          return !!(user && (isOperator(user) || isAdmin(user)));
        }
        function userHasPermission(user, permissionCode) {
          if (Array.isArray(user?.permissions)) return user.permissions.includes(permissionCode);
          if (permissionCode.startsWith("workflow.") || permissionCode.startsWith("audit.") || permissionCode.startsWith("users.") || permissionCode.startsWith("service_catalog.") || permissionCode === "permissions.view") return isAdmin(user);
          if (permissionCode.startsWith("reports.") || permissionCode.startsWith("sla.") || permissionCode.startsWith("tickets.") || permissionCode === "dashboard.operator") return canWorkTickets(user) || permissionCode.includes("own") || permissionCode === "tickets.create";
          return false;
        }
        function canViewDashboard(user) { return userHasPermission(user, "dashboard.operator"); }
        function canViewUserPortal(user) { return !!user && userHasPermission(user, "tickets.view_own"); }
        function canViewOperatorCenter(user) { return canViewDashboard(user); }
        function canViewReports(user) { return userHasPermission(user, "reports.view"); }
        function canViewSlaCalendar(user) { return userHasPermission(user, "sla.view") || userHasPermission(user, "sla.manage"); }
        function canManageUsers(user) { return userHasPermission(user, "users.manage"); }
        function canManageWorkflow(user) { return userHasPermission(user, "workflow.manage"); }
        function canManageServiceCatalog(user) { return userHasPermission(user, "service_catalog.manage"); }
        function canViewServiceCatalog(user) { return userHasPermission(user, "service_catalog.view") || canManageServiceCatalog(user); }
        function canViewAudit(user) { return userHasPermission(user, "audit.view"); }
        function canViewPermissions(user) { return userHasPermission(user, "permissions.view"); }
        function moduleAction(label, action, primary = false) {
          const cls = primary ? "primary-action" : "btn-secondary";
          return `<button class="${cls}" onclick="${action}">${esc(label)}</button>`;
        }
        function moduleCard(key, title, description, actions, active = "") {
          const visibleActions = (actions || []).filter(Boolean);
          if (!visibleActions.length) return "";
          const activeClass = active === key ? " active" : "";
          return `
            <section class="module-card${activeClass}">
              <h3>${esc(title)}</h3>
              <p>${esc(description)}</p>
              <div class="module-actions">${visibleActions.join("")}</div>
            </section>
          `;
        }
        function renderAppNavigation(me, active = "") {
          const cards = [
            moduleCard("user-work", "Moja praca", "Osobiste zgłoszenia, profil użytkownika i centrum operatora, jeżeli masz taką rolę.", [
              canViewUserPortal(me) ? moduleAction("Portal użytkownika", "renderUserPortal();return false;", active === "user-work") : "",
              canViewOperatorCenter(me) ? moduleAction("Centrum operatora", "renderOperatorCenter();return false;", active === "operator-work") : "",
              moduleAction("Mój profil", "renderProfile();return false;")
            ], active),
            moduleCard("tickets", "Zgłoszenia", "Lista ticketów, nowe zgłoszenie, filtry i widoki robocze.", [
              moduleAction("Lista zgłoszeń", "renderHome();return false;", active === "tickets"),
              moduleAction("Nowe zgłoszenie", "renderNewTicket();return false;"),
              (canWorkTickets(me) && canViewServiceCatalog(me)) ? moduleAction("Usługi IT", "renderAdminServices();return false;", active === "services") : ""
            ], active),
            moduleCard("incidents", "Incydenty", "Dowodzenie incydentami, komunikaty i zgłoszenia powiązane z awarią.", [
              canWorkTickets(me) ? moduleAction("Centrum incydentów", "renderIncidents();return false;", active === "incidents") : ""
            ], active),
            moduleCard("knowledge", "Baza wiedzy", "Instrukcje, rozwiązania i artykuły podpowiadane przy podobnych zgłoszeniach.", [
              moduleAction("Baza wiedzy", "renderKnowledgeArticles();return false;", active === "knowledge")
            ], active),
            moduleCard("reports", "Raporty", "Dashboard, raporty i kalendarz SLA w jednym spokojniejszym miejscu.", [
              canViewDashboard(me) ? moduleAction("Dashboard", "renderDashboard();return false;", active === "reports") : "",
              canViewReports(me) ? moduleAction("Raporty", "renderReports();return false;", active === "reports") : "",
              canViewSlaCalendar(me) ? moduleAction("Kalendarz SLA", "renderSlaCalendar();return false;", active === "reports") : ""
            ], active),
            moduleCard("administration", "Administracja", "Konfiguracja systemu, workflow, automatyzacji, SLA, użytkowników i audytu.", [
              (canManageUsers(me) || canViewPermissions(me) || canManageWorkflow(me) || canManageServiceCatalog(me) || canViewAudit(me) || canViewSlaCalendar(me))
                ? moduleAction("Centrum administracji", "renderAdministration();return false;", active === "administration")
                : ""
            ], active)
          ].filter(Boolean).join("");
          return `
            <section class="card">
              <div class="ticket-section-title">
                <div>
                  <h2>Nawigacja</h2>
                  <p class="muted">Widoki są pogrupowane według pracy użytkownika, operatora i administracji.</p>
                </div>
              </div>
              <div class="module-nav">${cards}</div>
            </section>
          `;
        }
        function sidebarItem(key, label, action, active = "", visible = true) {
          if (!visible) return "";
          const activeClass = active === key ? " active" : "";
          return `<button class="${activeClass}" onclick="${action}">${esc(label)}</button>`;
        }
        function renderAppSidebar(me, active = "") {
          const canOpenAdmin = canManageUsers(me) || canViewPermissions(me) || canManageWorkflow(me) || canManageServiceCatalog(me) || canViewAudit(me) || canViewSlaCalendar(me);
          return `
            <aside class="operator-sidebar">
              <div class="operator-sidebar-title">Helpdesk</div>
