            "after": after_snapshot,
            "changes": workflow_audit_changes({}, after_snapshot, workflow_audit_labels()),
        }
        log_audit(cur, user, "workflow_created", "workflow", workflow_id, audit_details)
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"id": workflow_id}), 201
