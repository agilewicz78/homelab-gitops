              <td>#${{t.id}}</td>
              <td><a class="ticket-title ${{statusClass(t.status)}}" href="#" onclick="renderTicket(${{t.id}});return false;">${{esc(t.title)}}</a></td>
              <td>${{esc(t.requester_name)}}<br><span class="muted">${{esc(t.department)}}</span></td>
              <td>${{esc(t.category)}}<br><span class="muted">${{esc(t.subcategory || "Inne")}}</span></td>
              <td><span class="pill ${{priorityClass(t.priority)}}">${{esc(t.priority)}}</span></td>
              <td><span class="pill ${{statusClass(t.status)}}">${{esc(t.status)}}</span></td>
              <td>${{t.assigned_to_name ? esc(t.assigned_to_name) : '<span class="muted">Nieprzypisane</span>'}}</td>
              <td><span class="sla-badge ${{slaClass(t.sla_state)}}">${{slaLabel(t.sla_state)}}</span><br><span class="muted">${{esc(t.sla_due_at || "")}}</span></td>
              <td class="muted">${{esc(t.created_at)}}</td>
            </tr>`).join("") : `<tr><td colspan="9" class="muted">Brak zgłoszeń dla wybranych filtrów.</td></tr>`;
          const totalFiltered = Number(pagination.total_filtered || 0);
          const currentPage = Number(pagination.page || 1);
          const currentPageSize = Number(pagination.page_size || pageSize || 10);
          const totalPages = Number(pagination.total_pages || 1);
          const firstItem = totalFiltered === 0 ? 0 : ((currentPage - 1) * currentPageSize) + 1;
          const lastItem = Math.min(totalFiltered, currentPage * currentPageSize);
          const pageControls = `
            <div class="pagination">
              <div class="pagination-info">
                <strong>Wyświetlanie ${{firstItem}}–${{lastItem}} z ${{totalFiltered}} zgłoszeń</strong><br>
                <span>Strona ${{currentPage}} z ${{totalPages}}</span>
              </div>
              <div class="pagination-pages">
                ${{buildPaginationButtons(pagination)}}
              </div>
            </div>`;
          appEl.innerHTML = `
            <section class="stats">
              <div class="stat"><div class="num">${{data.stats.total}}</div><div class="label">${{scope}}</div></div>
              <div class="stat"><div class="num">${{data.stats.new}}</div><div class="label">Nowe</div></div>
              <div class="stat"><div class="num">${{data.stats.in_progress}}</div><div class="label">W trakcie</div></div>
              <div class="stat"><div class="num">${{data.stats.high}}</div><div class="label">Wysoki / Krytyczny</div></div>
              <div class="stat"><div class="num">${{data.stats.resolved}}</div><div class="label">Rozwiązane / Zamknięte</div></div>
            </section>
            <section class="card">
              <button onclick="renderNewTicket()">Nowe zgłoszenie</button>
              <button class="btn-secondary" onclick="renderProfile()">Mój profil</button>
              ${{canWorkTickets(me) ? `<button class="btn-secondary" onclick="renderDashboard()">Dashboard</button>` : ""}}
              ${{isAdmin(me) ? `<button class="btn-secondary" onclick="renderAdminUsers()">Zarządzanie użytkownikami</button> <button class="btn-secondary" onclick="renderAdminWorkflows()">Workflow</button> <button class="btn-secondary" onclick="renderAudit()">Audyt</button>` : ""}}
              <div style="margin-top:16px">
                <strong>Widoki robocze:</strong>
                ${{workViewsHtml}}
                <strong>Filtry zgłoszeń:</strong>
                <div class="filter-grid">
                  <div class="filter-field">
                    <label>Status</label>
                    <details class="combo">
                      <summary>${{esc(statusFilterLabel(filters))}}</summary>
                      <div class="combo-menu">
                        <label class="combo-option">
                          <input type="checkbox" ${{filters.length === 0 ? "checked" : ""}} onchange="clearStatusFilters()">
                          <span>Wszystkie statusy</span>
                        </label>
                        ${{statusChecks}}
                      </div>
                    </details>
                  </div>
                  ${{assignedSelect}}
                  ${{prioritySelect}}
                  ${{slaSelect}}
                  <div class="filter-field">
                    <label>&nbsp;</label>
                    <button class="btn-secondary" onclick="clearAllFilters()">Wyczyść filtry</button>
                  </div>
                </div>
                ${{searchSortControls}}
                <div class="active-filter-count">Aktywne filtry: ${{activeFilterCount}}${{canWorkTickets(me) ? ` · domyślnie operator widzi: ${{assignedFilterLabel(loadAssignedFilter(me), data.operators || [])}}` : ""}}</div>
              </div>
            </section>
            <section class="card">
              <h2>${{scope}}${{filteredLabel}}</h2>
              ${{pageControls}}
              <table>
                <thead><tr><th>ID</th><th>Tytuł</th><th>Zgłaszający</th><th>Kategoria</th><th>Priorytet</th><th>Status</th><th>Przypisane do</th><th>SLA</th><th>Utworzono</th></tr></thead>
                <tbody>${{rows}}</tbody>
              </table>
              ${{pageControls}}
            </section>`;
        }}
        async function renderNewTicket() {{
          currentView = {{ name: "new-ticket", ticketId: null }};
          const me = await loadMe();
          if (!me) return;
          const metaRes = await api("/api/meta");
          const meta = await metaRes.json();
          appEl.innerHTML = `
            <section class="card">
              <h2>Nowe zgłoszenie</h2>
              <form id="ticketForm">
                <label>Tytuł problemu</label>
                <input name="title" required placeholder="Np. Outlook nie odbiera poczty">
                <label>Opis</label>
                <textarea name="description" required placeholder="Opisz problem, komunikat błędu, od kiedy występuje..."></textarea>
                <div class="grid">
                  <div><label>Zgłaszający</label><input value="${{esc(me.name)}}" disabled></div>
                  <div><label>E-mail</label><input value="${{esc(me.email)}}" disabled></div>
                </div>
                <div class="grid">
                  <div><label>Dział</label><input value="${{esc(me.department)}}" disabled></div>
                  <div>
                    <label>Kategoria</label>
                    <select id="new-ticket-category" name="category">
                      ${{meta.categories.map(x => `<option>${{esc(x)}}</option>`).join("")}}
                    </select>
                  </div>
                </div>
                <div class="grid">
                  <div>
                    <label>Podkategoria</label>
                    <select id="new-ticket-subcategory" name="subcategory"></select>
                  </div>
                </div>
                <label>Priorytet</label>
                <select name="priority">${{meta.priorities.map(x => `<option ${{x === "Normalny" ? "selected" : ""}}>${{esc(x)}}</option>`).join("")}}</select>
                <label>Załączniki opcjonalne</label>
                <input type="file" name="attachments" multiple accept=".png,.jpg,.jpeg,.gif,.pdf,.txt,.log,.csv,.xlsx,.docx">
                <p class="muted">Możesz dodać screenshot, PDF, log lub dokument. Maksymalnie 10 MB na plik. Załączniki zostaną zapisane automatycznie po kliknięciu „Utwórz zgłoszenie”.</p>
                <button type="submit">Utwórz zgłoszenie</button>
                <button type="button" class="btn-secondary" onclick="renderHome()">Anuluj</button>
              </form>
            </section>`;
          updateSubcategorySelect(meta);
          document.getElementById("new-ticket-category").addEventListener("change", () => updateSubcategorySelect(meta));
          document.getElementById("ticketForm").addEventListener("submit", createTicket);
        }}
        async function createTicket(event) {{
          event.preventDefault();
          const form = event.target;
          const formData = new FormData(form);
          const files = formData.getAll("attachments").filter(file => file && file.name);
          const payload = {{
            title: formData.get("title") || "",
            description: formData.get("description") || "",
            category: formData.get("category") || "",
            subcategory: formData.get("subcategory") || "Inne",
            priority: formData.get("priority") || "Normalny"
          }};
          suppressNextLiveRefresh = true;
          const res = await api("/api/tickets", {{ method: "POST", body: JSON.stringify(payload) }});
          if (!res) return;
          if (!res.ok) {{ alert("Nie udało się utworzyć zgłoszenia."); return; }}
          const created = await res.json();
          const ticketId = created.id;
          if (files.length > 0) {{
            for (const file of files) {{
              const uploadData = new FormData();
              uploadData.append("file", file);
              const uploadRes = await fetch(`/api/tickets/${{ticketId}}/attachments`, {{
                method: "POST",
                headers: {{ "X-Helpdesk-Session": getSid() }},
                body: uploadData
              }});
              if (!uploadRes.ok) {{
                const err = await uploadRes.json().catch(() => ({{ error: "Nie udało się dodać załącznika." }}));
                showToast("Zgłoszenie utworzone, ale nie dodano załącznika", err.error || "Błąd uploadu");
              }}
            }}
          }}
          showToast("Zgłoszenie zostało utworzone", files.length ? `Dodano załączniki: ${{files.length}}` : "");
          await renderHome();
        }}
        async function renderTicket(id, fromLive = false) {{
          currentView = {{ name: "ticket", ticketId: Number(id) }};
          const me = await loadMe();
          if (!me) return;
          const res = await api(`/api/tickets/${{id}}`);
          if (!res) return;
          if (!res.ok) {{ appEl.innerHTML = `<section class="card"><h2>Brak dostępu albo brak zgłoszenia</h2></section>`; return; }}
          const data = await res.json();
          const t = data.ticket;
          const isClosed = t.status === "Zamknięte";
          const comments = data.comments.map(c => `
            <div class="comment ${{c.visibility === "internal" ? "internal" : ""}}">
              <div class="muted">
                ${{esc(c.author)}} · ${{esc(c.created_at)}}
                <span class="comment-type ${{c.visibility === "internal" ? "internal" : "public"}}">${{c.visibility === "internal" ? "Wewnętrzny" : "Publiczny"}}</span>
              </div>
              <div>${{esc(c.content)}}</div>
            </div>
          `).join("") || `<p class="muted">Brak komentarzy.</p>`;
          const statusPanel = canWorkTickets(me) && !isClosed ? `
            <section class="card">
              <h3>Zmień status</h3>
              <form id="statusForm">
                <label>Status</label>
                <select name="status">${{data.meta.statuses.map(s => `<option ${{s === t.status ? "selected" : ""}}>${{esc(s)}}</option>`).join("")}}</select>
                <button type="submit">Zapisz status</button>
              </form>
            </section>` : "";
          const assignmentPanel = canWorkTickets(me) && !isClosed ? `
            <section class="card">
              <h3>Przypisanie zgłoszenia</h3>
              <form id="assignmentForm">
                <label>Agent</label>
                <select name="assigned_to_email">
                  <option value="">Nieprzypisane</option>
                  ${{data.meta.operators.map(a => `<option value="${{esc(a.email)}}" ${{a.email === t.assigned_to_email ? "selected" : ""}}>${{esc(a.name)}} (${{esc(a.role)}})</option>`).join("")}}
                </select>
                <button type="submit">Zapisz przypisanie</button>
              </form>
            </section>` : "";
          const reopenPanel = isClosed && isAdmin(me) ? `
            <section class="card">
              <h3>Ponowne otwarcie zgłoszenia</h3>
              <p class="muted">Tylko administrator może otworzyć zamknięte zgłoszenie ponownie. Wymagany jest powód, który zostanie zapisany w historii i audycie.</p>
              <button onclick="openReopenTicketModal(${{t.id}})">Otwórz ponownie</button>
            </section>` : "";
          const watcherEmails = new Set((data.watchers || []).map(w => String(w.email || "").toLowerCase()));
          const watcherList = (data.watchers || []).length
            ? `<div class="watcher-list">${{data.watchers.map(w => `
                <div class="watcher-item">
                  <div>
                    <strong>${{esc(w.name || w.email)}}</strong>
                    <div class="watcher-meta">${{esc(w.email)}} · ${{esc(w.department || "")}} · ${{roleBadges(w.roles)}}</div>
                  </div>
                  ${{canWorkTickets(me) && !isClosed ? `<button class="btn-secondary btn-small" onclick="removeWatcher(${{t.id}}, '${{esc(w.email)}}')">Usuń</button>` : ""}}
                </div>`).join("")}}</div>`
            : `<p class="muted">Brak dodatkowych obserwatorów.</p>`;
          const watcherOptions = (data.meta.watcher_candidates || [])
            .filter(w => !watcherEmails.has(String(w.email || "").toLowerCase()) && String(w.email || "").toLowerCase() !== String(t.requester_email || "").toLowerCase())
            .map(w => `<option value="${{esc(w.email)}}">${{esc(w.name)}} · ${{esc(w.email)}} · ${{esc((w.roles || []).join(", "))}}</option>`)
            .join("");
          const linkedTickets = (data.linked_tickets || []).length
            ? `<div class="watcher-list">${{data.linked_tickets.map(l => `
                <div class="watcher-item">
                  <div>
                    <strong><a href="#" onclick="renderTicket(${{l.id}}); return false;">#${{l.id}} · ${{esc(l.title)}}</a></strong>
                    <div class="watcher-meta">
                      <span class="pill ${{statusClass(l.status)}}">${{esc(l.status)}}</span>
                      ${{l.assigned_to_name ? " · " + esc(l.assigned_to_name) : ""}}
                      ${{l.requester_name ? " · zgłaszający: " + esc(l.requester_name) : ""}}
                    </div>
                  </div>
                  ${{canWorkTickets(me) && !isClosed ? `<button class="btn-secondary btn-small" onclick="removeTicketLink(${{t.id}}, ${{l.id}})">Usuń</button>` : ""}}
                </div>`).join("")}}</div>`
            : `<p class="muted">Brak powiązanych zgłoszeń.</p>`;
          const linkedTicketsPanel = `
            <section class="card">
              <h3>Powiązane zgłoszenia</h3>
              <p class="muted">Powiązania pomagają łączyć zgłoszenia dotyczące tego samego problemu, duplikatów albo wspólnego incydentu.</p>
              ${{linkedTickets}}
              ${{canWorkTickets(me) && !isClosed ? `
                <form id="ticketLinkForm">
                  <label>Dodaj powiązanie po ID zgłoszenia</label>
                  <input name="linked_ticket_id" type="number" min="1" placeholder="Np. 12" required>
                  <button type="submit">Dodaj powiązanie</button>
                </form>
              ` : ""}}
            </section>`;
          const watcherPanel = `
            <section class="card">
              <h3>Obserwatorzy</h3>
              <p class="muted">Obserwatorzy mogą widzieć zgłoszenie i dodawać komentarze. Operator/admin widzi także notatki wewnętrzne. Przypisany operator jest dodawany automatycznie.</p>
              ${{watcherList}}
              ${{canWorkTickets(me) && !isClosed ? `
                <form id="watcherForm">
                  <label>Dodaj obserwatora</label>
                  <select name="user_email">
                    <option value="">Wybierz użytkownika...</option>
                    ${{watcherOptions}}
                  </select>
                  <button type="submit">Dodaj obserwatora</button>
                </form>
              ` : ""}}
            </section>`;
          const eventHistory = (data.events || []).length
            ? `<div class="timeline">${{data.events.map(e => `
                <div class="event-item">
                  <strong>${{esc(e.actor_name || "System")}}</strong>
                  <span class="muted"> · ${{esc(e.created_at)}} · ${{esc(e.event_type)}}</span>
                  <div>${{esc(e.message)}}</div>
                </div>`).join("")}}</div>`
            : `<p class="muted">Brak historii zmian.</p>`;
          const attachmentList = (data.attachments || []).length
            ? `<div class="attachment-list">${{data.attachments.map(a => `
                <div class="attachment-item">
                  <div>
                    <strong>${{esc(a.original_filename)}}</strong>
                    <div class="attachment-meta">
                      ${{formatBytes(a.size_bytes)}} · ${{esc(a.uploaded_by_name || "Nieznany")}} · ${{esc(a.created_at)}}
                    </div>
                  </div>
                  <button class="btn-secondary btn-small" onclick="downloadAttachment(${{a.id}})">Pobierz</button>
                </div>`).join("")}}</div>`
            : `<p class="muted">Brak załączników.</p>`;
          appEl.innerHTML = `
            <section class="card">
              <button class="btn-secondary" onclick="renderHome()">← Powrót</button>
              <h2 class="ticket-heading ${{statusClass(t.status)}}">#${{t.id}} · ${{esc(t.title)}}</h2>
              <p class="muted">Utworzono: ${{esc(t.created_at)}} · Aktualizacja: ${{esc(t.updated_at)}}</p>
              <p><strong>Status:</strong> <span class="pill ${{statusClass(t.status)}}">${{esc(t.status)}}</span></p>
              ${{t.status === "Zamknięte" ? `
                <div class="resolution-box">
                  <strong>Podsumowanie zamknięcia</strong>
                  <div class="muted">
                    Zamknięte: ${{esc(t.closed_at || "brak danych")}}
                    ${{t.closed_by_name ? " · przez " + esc(t.closed_by_name) : ""}}
                    ${{t.resolution_minutes ? " · czas rozwiązania: " + formatResolutionMinutes(t.resolution_minutes) : ""}}
                  </div>
                  ${{t.resolution_summary ? `<p>${{esc(t.resolution_summary)}}</p>` : ""}}
                </div>
              ` : ""}}
              <p><strong>Priorytet:</strong> <span class="pill ${{priorityClass(t.priority)}}">${{esc(t.priority)}}</span></p>
              <p><strong>SLA:</strong> <span class="sla-badge ${{slaClass(t.sla_state)}}">${{slaLabel(t.sla_state)}}</span> <span class="muted">${{esc(t.sla_due_at || "")}}</span></p>
              <p><strong>Przypisane do:</strong> ${{t.assigned_to_name ? esc(t.assigned_to_name) : '<span class="muted">Nieprzypisane</span>'}}</p>
              <p><strong>Kategoria:</strong> ${{esc(t.category)}} / ${{esc(t.subcategory || "Inne")}}</p>
              <p><strong>Workflow:</strong> ${{esc(t.workflow_name || "Standardowy workflow zgłoszenia")}}</p>
              <p><strong>Zgłaszający:</strong> ${{esc(t.requester_name)}} · ${{esc(t.requester_email)}}</p>
              <p><strong>Dział:</strong> ${{esc(t.department)}}</p>
              <h3>Opis</h3><p>${{esc(t.description)}}</p>
              ${{isClosed ? `<div class="readonly-box"><strong>Zgłoszenie zamknięte — tylko do odczytu.</strong><br><span>Nie można zmieniać statusu, przypisania, komentarzy, załączników, obserwatorów ani powiązań.</span></div>` : ""}}
            </section>
            ${{statusPanel}}
            ${{assignmentPanel}}
            ${{reopenPanel}}
            ${{linkedTicketsPanel}}
            ${{watcherPanel}}
            <section class="card">
              <h3>Historia zmian</h3>
              ${{eventHistory}}
            </section>
            <section class="card">
              <h3>Załączniki</h3>
              ${{attachmentList}}
              ${{!isClosed ? `
                <form id="attachmentForm" enctype="multipart/form-data">
                  <label>Dodaj załącznik</label>
                  <input type="file" name="file" required>
                  <div class="attachment-upload-hint">Dozwolone: png, jpg, jpeg, gif, pdf, txt, log, csv, xlsx, docx. Maksymalnie 10 MB.</div>
                  <button type="submit">Dodaj załącznik</button>
                </form>
              ` : `<p class="muted">Zgłoszenie zamknięte — dodawanie załączników jest zablokowane.</p>`}}
            </section>
            <section class="card">
              <h3>Komentarze</h3>
              ${{comments}}
              ${{!isClosed ? `
                <form id="commentForm">
                  <label>Komentarz</label>
                  <textarea name="content" required></textarea>
                  ${{canWorkTickets(me) ? `
                    <div class="switch-row">
                      <div>
                        <strong>Notatka wewnętrzna</strong>
                        <small>Widoczna tylko dla operatorów i administratorów.</small>
                      </div>
                      <label class="switch">
                        <input id="comment-internal" name="internal_note" type="checkbox">
                        <span class="slider"></span>
                      </label>
                    </div>
                  ` : `<input type="hidden" name="visibility" value="public">`}}
                  <button type="submit">Dodaj komentarz</button>
                </form>
              ` : `<p class="muted">Zgłoszenie zamknięte — dodawanie komentarzy jest zablokowane.</p>`}}
            </section>`;
          const attachmentForm = document.getElementById("attachmentForm");
          if (attachmentForm) {{
            attachmentForm.addEventListener("submit", async (e) => {{
              e.preventDefault();
            const formData = new FormData(attachmentForm);
            suppressNextLiveRefresh = true;
            const res = await fetch(`/api/tickets/${{id}}/attachments`, {{
              method: "POST",
              headers: {{ "X-Helpdesk-Session": getSid() }},
              body: formData
            }});
            if (res.status === 401) {{
              clearSid();
              window.location.href = "/login";
              return;
            }}
            if (!res.ok) {{
              suppressNextLiveRefresh = false;
              const err = await res.json().catch(() => ({{ error: "Nie udało się dodać załącznika." }}));
              alert(err.error || "Nie udało się dodać załącznika.");
              return;
            }}
              showToast("Dodano załącznik do zgłoszenia #" + id);
              await renderTicket(id);
            }});
          }}
          const commentForm = document.getElementById("commentForm");
          if (commentForm) {{
            commentForm.addEventListener("submit", async (e) => {{
              e.preventDefault();
            const payload = Object.fromEntries(new FormData(commentForm).entries());
            const internalToggle = document.getElementById("comment-internal");
            payload.visibility = internalToggle && internalToggle.checked ? "internal" : "public";
            delete payload.internal_note;
            suppressNextLiveRefresh = true;
              await api(`/api/tickets/${{id}}/comments`, {{ method: "POST", body: JSON.stringify(payload) }});
              await renderTicket(id);
            }});
          }}
          const statusForm = document.getElementById("statusForm");
          if (statusForm) {{
            statusForm.addEventListener("submit", async (e) => {{
              e.preventDefault();
              const payload = Object.fromEntries(new FormData(statusForm).entries());
              const newStatus = payload.status || "";
              if (newStatus === "Zamknięte") {{
                openCloseTicketModal(id);
                return;
              }}
              suppressNextLiveRefresh = true;
              const res = await api(`/api/tickets/${{id}}/status`, {{ method: "POST", body: JSON.stringify(payload) }});
              if (!res || !res.ok) {{
                suppressNextLiveRefresh = false;
                alert("Nie udało się zmienić statusu.");
                return;
              }}
              showToast(
                "Status zgłoszenia #" + id + " został zmieniony",
                "Nowy status: " + newStatus
              );
              await renderTicket(id);
            }});
          }}
          const assignmentForm = document.getElementById("assignmentForm");
          if (assignmentForm) {{
            assignmentForm.addEventListener("submit", async (e) => {{
              e.preventDefault();
              const payload = Object.fromEntries(new FormData(assignmentForm).entries());
              suppressNextLiveRefresh = true;
              const res = await api(`/api/tickets/${{id}}/assign`, {{ method: "POST", body: JSON.stringify(payload) }});
              if (!res || !res.ok) {{
                suppressNextLiveRefresh = false;
                alert("Nie udało się zmienić przypisania.");
                return;
              }}
              showToast("Zmieniono przypisanie zgłoszenia #" + id, payload.assigned_to_email || "Nieprzypisane");
              await renderTicket(id);
            }});
          }}
          const ticketLinkForm = document.getElementById("ticketLinkForm");
          if (ticketLinkForm) {{
            ticketLinkForm.addEventListener("submit", async (e) => {{
              e.preventDefault();
              const payload = Object.fromEntries(new FormData(ticketLinkForm).entries());
              if (!payload.linked_ticket_id) {{
                alert("Podaj ID zgłoszenia do powiązania.");
                return;
              }}
              suppressNextLiveRefresh = true;
              const res = await api(`/api/tickets/${{id}}/links`, {{ method: "POST", body: JSON.stringify(payload) }});
              if (!res || !res.ok) {{
                suppressNextLiveRefresh = false;
                const err = res ? await res.json().catch(() => ({{ error: "Nie udało się dodać powiązania." }})) : {{ error: "Nie udało się dodać powiązania." }};
                alert(err.error || "Nie udało się dodać powiązania.");
                return;
              }}
              showToast("Dodano powiązanie do zgłoszenia #" + id);
              await renderTicket(id);
            }});
          }}
