          const viewMode = sessionStorage.getItem("helpdesk_workflow_automation_view") === "list" ? "list" : "diagram";
          const rules = workflowAutomationEditor
            .map((rule, idx) => viewMode === "diagram"
              ? workflowAutomationRuleDiagramCard(rule, idx)
              : workflowAutomationRuleListItem(rule, idx))
            .join("");
          box.innerHTML = rules || `<p class="muted">Brak reguł automatyzacji. Kliknij „Dodaj regułę automatyzacji”, aby utworzyć pierwszą regułę.</p>`;
          const listButton = document.getElementById("workflowAutomationListViewButton");
