    \         continue\n                old_status = effective_status\n                cur.execute(\"UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s\", (target_status, ticket_id))\n                message = f\"Reguła workflow „{rule_name}” zmieniła status z {old_status} na {target_status}.\"\n                add_ticket_event(cur, ticket_id, user, \"workflow_rule_status_changed\", message)\n                log_audit(cur, user, \"workflow_rule_status_changed\", \"ticket\", ticket_id, {\n                    \"rule\": rule_name,\n                    \"event_type\": event_type,\n                    \"old_status\": old_status,\n                    \"new_status\": target_status,\n                    \"workflow_key\": workflow_key,\n                })\n                create_ticket_notifications(\n                    cur,\n                    ticket_id,\n                    \"workflow_rule_status_changed\",\n                    f\"Status zgłoszenia #{ticket_id} został automatycznie\
