    def get_sid_from_request():
        return request.headers.get("X-Helpdesk-Session", "").strip()
    def get_user_by_sid(sid):
        if not sid:
            return None
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT u.first_name, u.last_name, u.email, u.department, u.role, u.roles
            FROM user_sessions s
            JOIN users u ON u.email = s.user_email
            WHERE s.sid = %s
        """, (sid,))
        row = cur.fetchone()
        if row:
            cur.execute("""
                UPDATE user_sessions
                SET last_seen = NOW()
                WHERE sid = %s
                  AND last_seen < NOW() - INTERVAL '60 seconds'
            """, (sid,))
            if cur.rowcount:
                conn.commit()
        cur.close()
        conn.close()
        if not row:
            return None
        return {
            "first_name": row[0],
            "last_name": row[1],
            "name": f"{row[0]} {row[1]}".strip(),
            "email": row[2],
            "department": row[3],
            "role": row[4],
            "roles": list(row[5] or ["user"]),
            "permissions": user_permission_codes({"roles": list(row[5] or ["user"])}),
        }

    # Odczytuje aktualnego użytkownika na podstawie sesji.
    def current_user():
        return get_user_by_sid(get_sid_from_request())

    # Dekorator wymagający zalogowania do endpointu API.
    def api_login_required(fn):
        @wraps(fn)
        def wrapper(*args, **kwargs):
            user = current_user()
            if not user:
                return jsonify({"error": "unauthorized"}), 401
            return fn(user, *args, **kwargs)
        return wrapper
    def has_role(user, role):
        if not user:
            return False
        roles = user.get("roles") or []
        if isinstance(roles, str):
            roles = [roles]
        return role in roles
    def role_label(roles):
        roles = roles or ["user"]
        if "admin" in roles:
            return "admin"
        if "operator" in roles:
            return "operator"
        return "user"
    def normalize_roles(raw_roles):
        if raw_roles is None:
            roles = ["user"]
        elif isinstance(raw_roles, list):
            roles = [clean(r) for r in raw_roles]
        else:
            roles = [clean(raw_roles)]
        roles = [r for r in roles if r in VALID_ROLES]
        if "user" not in roles:
            roles.insert(0, "user")
        # keep stable order
        return [r for r in VALID_ROLES if r in roles]
    def is_admin(user):
        return has_role(user, "admin")
    def is_operator(user):
        return has_role(user, "operator")
    def is_staff(user):
        return bool(user and (is_operator(user) or is_admin(user)))

    def user_permission_codes(user):
        """Zwraca techniczne kody uprawnień wynikające z ról użytkownika.

        Uprawnienia są pobierane z edytowalnej tabeli role_permissions, a następnie
        składane zgodnie z dziedziczeniem ról. W razie problemu z bazą następuje
        bezpieczny fallback do wartości domyślnych zaszytych w kodzie.
        """
        if not user:
            return []
        roles = user.get("roles") or [user.get("role") or "user"]
        if isinstance(roles, str):
            roles = [roles]
        effective_roles = {
            inherited_role
            for role in roles
            for inherited_role in ROLE_INHERITANCE.get(role, [role])
        }
        permissions = set()
        for role in VALID_ROLES:
            if role in effective_roles:
                permissions.update(role_direct_permission_codes(role))
        return sorted(permissions)

    def has_permission(user, permission_code):
        """Centralna kontrola pojedynczego uprawnienia po stronie backendu."""
        permissions = user.get("permissions") if user else None
        if permissions is None:
            permissions = user_permission_codes(user)
        return permission_code in permissions

    def api_forbidden(message="Brak uprawnień do wykonania tej operacji.", permission=None):
        """Zwraca spójną odpowiedź 403 dla frontendu i narzędzi API."""
        payload = {"error": "forbidden", "message": message}
        if permission:
            payload["permission"] = permission
        return jsonify(payload), 403

    # Audyt odmów dostępu.
    # Każda próba użycia endpointu bez wymaganego uprawnienia trafia do audit_log
    # jako permission_denied. Dzięki temu administrator widzi nie tylko zmiany,
    # ale też próby wejścia do modułów, do których użytkownik nie ma dostępu.
    def log_permission_denied_attempt(user, permission_code, message=None):
        try:
            conn = get_conn()
            cur = conn.cursor()
            log_audit(cur, user, "permission_denied", "permission", permission_code, {
                "permission": permission_code,
                "message": message or "Brak wymaganego uprawnienia.",
                "method": request.method,
                "path": request.path,
                "endpoint": request.endpoint,
                "remote_addr": request.headers.get("X-Forwarded-For") or request.remote_addr,
            })
            conn.commit()
            cur.close()
            conn.close()
        except Exception as exc:
            # Audyt nie może blokować właściwej odpowiedzi 403.
            print(f"permission denied audit failed: {exc}", flush=True)


    def api_permission_required(permission_code, message=None):
        """Dekorator do endpointów kontrolowanych kodem uprawnienia.

        Dekorator wykonuje dwie rzeczy:
        1. blokuje dostęp, gdy użytkownik nie ma wymaganego uprawnienia,
        2. zapisuje odmowę w audycie jako permission_denied.
        """
        def decorator(fn):
            @wraps(fn)
            def wrapper(user, *args, **kwargs):
                if not has_permission(user, permission_code):
                    denial_message = message or "Brak wymaganego uprawnienia."
                    log_permission_denied_attempt(user, permission_code, denial_message)
                    return api_forbidden(denial_message, permission_code)
                return fn(user, *args, **kwargs)
            return wrapper
        return decorator

