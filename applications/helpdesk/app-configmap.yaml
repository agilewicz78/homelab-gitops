                <span class="chip">${{esc(article.subcategory)}}</span>
                ${{article.source_ticket_id ? `<button class="btn-secondary btn-small" onclick="renderTicket(${{article.source_ticket_id}})">Zgłoszenie źródłowe #${{article.source_ticket_id}}</button>` : ""}}
              </div>
              <h3>Objawy i problem</h3>
              <div class="panel-soft knowledge-solution">${{esc(article.problem)}}</div>
              <h3>Rozwiązanie</h3>
              <div class="panel-soft knowledge-solution">${{esc(article.solution)}}</div>
              ${{article.status === "published" ? `
                <section class="panel-soft">
