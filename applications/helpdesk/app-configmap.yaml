        function openKnowledgeFeedbackModal() {{
          const context = knowledgeFeedbackContext;
          const modal = document.getElementById("knowledgeFeedbackModal");
          const form = document.getElementById("knowledgeFeedbackForm");
          const reasonSelect = document.getElementById("knowledgeFeedbackReason");
          const commentInput = document.getElementById("knowledgeFeedbackComment");
          if (!context || !modal || !form || !reasonSelect || !commentInput) return;
