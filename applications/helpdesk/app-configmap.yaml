    # Pobiera reguły automatyzacji workflow wraz z akcjami.
    def workflow_automation_entries(cur, workflow_id):
        cur.execute("""
            SELECT id, name, event_type, condition_status, condition_to_status, condition_role,
                   condition_comment_visibility, COALESCE(assigned_state, '*'), action_type,
                   action_status, is_active, COALESCE(stop_processing, TRUE), COALESCE(priority, 100),
                   COALESCE(condition_priority, '*'), COALESCE(condition_category, '*'),
                   COALESCE(condition_subcategory, '*'), COALESCE(condition_sla_state, '*'),
                   COALESCE(condition_status_operator, 'eq'), COALESCE(condition_to_status_operator, 'eq'),
                   COALESCE(condition_role_operator, 'eq'), COALESCE(condition_comment_visibility_operator, 'eq'),
                   COALESCE(assigned_state_operator, 'eq'), COALESCE(condition_priority_operator, 'eq'),
                   COALESCE(condition_category_operator, 'eq'), COALESCE(condition_subcategory_operator, 'eq'),
                   COALESCE(condition_sla_state_operator, 'eq')
            FROM workflow_automations
            WHERE workflow_id = %s
            ORDER BY COALESCE(priority, 100) ASC, id ASC
        """, (workflow_id,))
        result = []
        for r in cur.fetchall():
            actions = workflow_automation_action_entries(cur, r[0])
            if not actions:
                actions = [{
                    "action_type": r[8] or "change_status",
                    "action_value": r[9],
                    "is_active": True,
                    "action_order": 1,
                }]
            result.append({
                "id": r[0],
                "name": r[1] or "",
                "event_type": r[2],
                "condition_status": r[3],
                "condition_to_status": r[4],
                "condition_role": r[5],
                "condition_comment_visibility": r[6],
                "assigned_state": r[7] or "*",
                "action_type": r[8],
                "action_status": r[9],
                "actions": actions,
                "is_active": bool(r[10]),
                "stop_processing": bool(r[11]),
                "priority": int(r[12] or 100),
                "condition_priority": r[13] or "*",
                "condition_category": r[14] or "*",
                "condition_subcategory": r[15] or "*",
                "condition_sla_state": r[16] or "*",
                "condition_status_operator": r[17] or "eq",
                "condition_to_status_operator": r[18] or "eq",
                "condition_role_operator": r[19] or "eq",
                "condition_comment_visibility_operator": r[20] or "eq",
                "assigned_state_operator": r[21] or "eq",
                "condition_priority_operator": r[22] or "eq",
                "condition_category_operator": r[23] or "eq",
                "condition_subcategory_operator": r[24] or "eq",
                "condition_sla_state_operator": r[25] or "eq",
            })
        return result
    def workflow_audit_changes(before, after, labels):
        changes = []
        for field, label in labels.items():
            old_value = before.get(field)
            new_value = after.get(field)
            if old_value != new_value:
                changes.append({
                    "field": field,
                    "label": label,
                    "before": old_value,
                    "after": new_value,
                })
        return changes
