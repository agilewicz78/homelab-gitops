        function ticketSubcategoryOptions(categories, selectedCategory, selectedSubcategory) {{
          const source = categories || {{}};
          let values = [];
          if (Array.isArray(source)) {{
            values = [];
          }} else if (selectedCategory && selectedCategory !== "all" && Array.isArray(source[selectedCategory])) {{
            values = source[selectedCategory];
          }} else {{
            const seen = new Set();
            Object.values(source).forEach(list => {{
              if (!Array.isArray(list)) return;
              list.forEach(x => {{
                if (!seen.has(x)) {{
                  seen.add(x);
                  values.push(x);
                }}
              }});
            }});
          }}
          return [`<option value="all" ${{selectedSubcategory === "all" ? "selected" : ""}}>Wszystkie podkategorie</option>`]
            .concat(values.map(x => `<option value="${{esc(x)}}" ${{selectedSubcategory === x ? "selected" : ""}}>${{esc(x)}}</option>`))
            .join("");
        }}
