    @sock.route("/ws")
    def websocket(ws):
        client_id = id(ws)
        user = None
        try:
            raw = ws.receive()
            auth = json.loads(raw or "{}")
            sid = clean(auth.get("sid"))
            user = get_user_by_sid(sid)
            if not user:
                ws.send(json.dumps({"error": "unauthorized"}))
                return
            active_ws_clients.add(client_id)
            publish_event(f"{user['name']} połączony z live helpdesk", "presence")
            while True:
                event = last_live_event
                if event and event.get("staff_only") and not is_staff(user):
                    event = None
                ws.send(json.dumps({
                    "server_time": time.strftime("%Y-%m-%d %H:%M:%S"),
                    "active_clients": len(active_ws_clients),
                    "user": {
                        "name": user["name"],
                        "email": user["email"],
                        "role": user["role"],
                        "roles": user.get("roles", ["user"]),
                    },
                    "event": event,
                }))
                time.sleep(1)
        except Exception:
            pass
        finally:
            active_ws_clients.discard(client_id)
