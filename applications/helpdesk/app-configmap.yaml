            SELECT workflow_key, name, category, subcategory, is_default, is_active
            FROM workflow_definitions
            WHERE id = %s
        """, (workflow_id,))
        existing = cur.fetchone()
        if not existing:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        before_snapshot = {
            "workflow_key": existing[0],
            "name": existing[1],
            "category": existing[2],
            "subcategory": existing[3],
            "is_default": bool(existing[4]),
            "is_active": bool(existing[5]),
