    @app.post("/api/login")
    def api_login():
        payload = request.get_json(silent=True) or {}
        email = clean(payload.get("email")).lower()
        password = str(payload.get("password") or "")

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT full_name, email, department, role, password_hash
            FROM users
            WHERE lower(email) = %s
        """, (email,))
        user = cur.fetchone()
        if not user:
            cur.close()
            conn.close()
            return jsonify({"error": "invalid credentials"}), 401

        full_name, user_email, department, role, password_hash = user
        if not check_password_hash(password_hash, password):
            cur.close()
            conn.close()
            return jsonify({"error": "invalid credentials"}), 401

        sid = str(uuid.uuid4())
        cur.execute("INSERT INTO user_sessions (sid, user_email) VALUES (%s, %s)", (sid, user_email))
        conn.commit()
        cur.close()
        conn.close()

        return jsonify({
            "sid": sid,
            "user": {
                "name": full_name,
                "email": user_email,
                "department": department,
                "role": role,
            }
        })

