                  <h2>Zgłoszenia</h2>
                  <p class="muted">Lista i filtry są tu skupione tylko na obsłudze ticketów. Pozostałe moduły są w nawigacji powyżej.</p>
                </div>
                <button onclick="renderNewTicket()">Nowe zgłoszenie</button>
              </div>
              <div style="margin-top:16px">
                <strong>Widoki robocze:</strong>
                ${workViewsHtml}
                <strong>Filtry zgłoszeń:</strong>
                <div class="filter-grid">
                  <div class="filter-field">
                    <label>Status</label>
                    <details class="combo">
                      <summary>${esc(statusFilterLabel(filters))}</summary>
                      <div class="combo-menu">
                        <label class="combo-option">
                          <input type="checkbox" ${filters.length === 0 ? "checked" : ""} onchange="clearStatusFilters()">
