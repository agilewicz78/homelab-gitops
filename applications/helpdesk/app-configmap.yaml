    @app.get("/healthz")
    def healthz():
        return {"status": "ok"}

    @app.get("/")
    def index():
        conn = get_conn()
        cur = conn.cursor()

        cur.execute("""
            SELECT
              COUNT(*),
              COUNT(*) FILTER (WHERE status = 'Nowe'),
              COUNT(*) FILTER (WHERE status = 'W trakcie'),
              COUNT(*) FILTER (WHERE priority IN ('Wysoki', 'Krytyczny')),
              COUNT(*) FILTER (WHERE status IN ('Rozwiązane', 'Zamknięte'))
            FROM tickets
        """)
        total, new_count, in_progress, high_count, resolved_count = cur.fetchone()

        cur.execute("""
            SELECT id, title, requester_name, department, category, priority, status, created_at
            FROM tickets
            ORDER BY id DESC
        """)
        rows = cur.fetchall()

        cur.close()
        conn.close()

        table_rows = ""
        for row in rows:
            ticket_id, title, requester, department, category, priority, status, created_at = row
            priority_class = "priority-" + priority.replace(" ", "-")
            table_rows += f"""
            <tr>
              <td>#{ticket_id}</td>
              <td><a class="ticket-title" href="/tickets/{ticket_id}">{esc(title)}</a></td>
              <td>{esc(requester)}<br><span class="muted">{esc(department)}</span></td>
              <td>{esc(category)}</td>
              <td><span class="pill {esc(priority_class)}">{esc(priority)}</span></td>
              <td><span class="pill">{esc(status)}</span></td>
              <td class="muted">{esc(created_at)}</td>
            </tr>
            """

        content = f"""
        <section class="stats">
          <div class="stat"><div class="num">{total}</div><div class="label">Wszystkie zgłoszenia</div></div>
          <div class="stat"><div class="num">{new_count}</div><div class="label">Nowe</div></div>
          <div class="stat"><div class="num">{in_progress}</div><div class="label">W trakcie</div></div>
          <div class="stat"><div class="num">{high_count}</div><div class="label">Wysoki / Krytyczny</div></div>
          <div class="stat"><div class="num">{resolved_count}</div><div class="label">Rozwiązane / Zamknięte</div></div>
        </section>

        <section class="card">
          <a class="btn" href="/tickets/new">Nowe zgłoszenie</a>
        </section>

        <section class="card">
          <h2>Lista zgłoszeń</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Tytuł</th>
                <th>Zgłaszający</th>
                <th>Kategoria</th>
                <th>Priorytet</th>
                <th>Status</th>
                <th>Utworzono</th>
              </tr>
            </thead>
            <tbody>
              {table_rows}
            </tbody>
          </table>
        </section>
        """

        return Response(layout(content), mimetype="text/html")

    @app.get("/tickets/new")
    def new_ticket():
        content = f"""
        <section class="card">
          <h2>Nowe zgłoszenie</h2>
          <form method="post" action="/tickets">
            <label>Tytuł problemu</label>
            <input name="title" required placeholder="Np. Outlook nie odbiera poczty">

            <label>Opis</label>
            <textarea name="description" required placeholder="Opisz problem, komunikat błędu, od kiedy występuje..."></textarea>

            <div class="grid">
              <div>
                <label>Imię i nazwisko</label>
                <input name="requester_name" required placeholder="Anna Kowalska">
              </div>
              <div>
                <label>E-mail</label>
                <input name="requester_email" type="email" required placeholder="anna.kowalska@incoprp.local">
              </div>
            </div>

            <div class="grid">
              <div>
                <label>Dział</label>
                <select name="department">{options(DEPARTMENTS)}</select>
              </div>
              <div>
                <label>Kategoria</label>
                <select name="category">{options(CATEGORIES)}</select>
              </div>
            </div>

            <label>Priorytet</label>
            <select name="priority">{options(PRIORITIES, "Normalny")}</select>

            <button type="submit">Utwórz zgłoszenie</button>
            <a class="btn btn-secondary" href="/">Anuluj</a>
          </form>
        </section>
        """

        return Response(layout(content), mimetype="text/html")

    @app.post("/tickets")
    def create_ticket():
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            INSERT INTO tickets (
                title,
                description,
                requester_name,
                requester_email,
                department,
                category,
                priority,
                status
            )
            VALUES (%s, %s, %s, %s, %s, %s, %s, 'Nowe')
        """, (
            request.form.get("title", "").strip(),
            request.form.get("description", "").strip(),
            request.form.get("requester_name", "").strip(),
            request.form.get("requester_email", "").strip(),
            request.form.get("department", "").strip(),
            request.form.get("category", "").strip(),
            request.form.get("priority", "Normalny").strip(),
        ))
        conn.commit()
        cur.close()
        conn.close()
        return redirect("/")

    @app.get("/tickets/<int:ticket_id>")
    def ticket_detail(ticket_id):
        conn = get_conn()
        cur = conn.cursor()

        cur.execute("""
            SELECT id, title, description, requester_name, requester_email, department,
                   category, priority, status, created_at, updated_at
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        ticket = cur.fetchone()

        if not ticket:
            cur.close()
            conn.close()
            return Response(layout("<section class='card'><h2>Nie znaleziono zgłoszenia</h2></section>"), status=404)

        cur.execute("""
            SELECT author, content, created_at
            FROM comments
            WHERE ticket_id = %s
            ORDER BY id ASC
        """, (ticket_id,))
        comments = cur.fetchall()

        cur.close()
        conn.close()

        (
            tid, title, description, requester_name, requester_email,
            department, category, priority, status, created_at, updated_at
        ) = ticket

        comments_html = ""
        for author, content, created in comments:
            comments_html += f"""
            <div class="comment">
              <div class="muted">{esc(author)} · {esc(created)}</div>
              <div>{esc(content)}</div>
            </div>
            """

        content = f"""
        <section class="card">
          <a class="btn btn-secondary" href="/">← Powrót</a>
          <h2>#{tid} · {esc(title)}</h2>
          <p class="muted">Utworzono: {esc(created_at)} · Aktualizacja: {esc(updated_at)}</p>

          <p><strong>Status:</strong> <span class="pill">{esc(status)}</span></p>
          <p><strong>Priorytet:</strong> <span class="pill priority-{esc(priority)}">{esc(priority)}</span></p>
          <p><strong>Kategoria:</strong> {esc(category)}</p>
          <p><strong>Zgłaszający:</strong> {esc(requester_name)} · {esc(requester_email)}</p>
          <p><strong>Dział:</strong> {esc(department)}</p>

          <h3>Opis</h3>
          <p>{esc(description)}</p>
        </section>

        <section class="card">
          <h3>Zmień status</h3>
          <form method="post" action="/tickets/{tid}/status">
            <label>Status</label>
            <select name="status">{options(STATUSES, status)}</select>
            <button type="submit">Zapisz status</button>
          </form>
        </section>

        <section class="card">
          <h3>Komentarze</h3>
          {comments_html if comments_html else "<p class='muted'>Brak komentarzy.</p>"}
          <form method="post" action="/tickets/{tid}/comments">
            <label>Autor</label>
            <input name="author" value="Helpdesk IT">
            <label>Komentarz</label>
            <textarea name="content" required></textarea>
            <button type="submit">Dodaj komentarz</button>
          </form>
        </section>
        """

        return Response(layout(content), mimetype="text/html")

    @app.post("/tickets/<int:ticket_id>/status")
    def update_status(ticket_id):
        status = request.form.get("status", "Nowe")
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            UPDATE tickets
            SET status = %s, updated_at = NOW()
            WHERE id = %s
        """, (status, ticket_id))
        conn.commit()
        cur.close()
        conn.close()
        return redirect(f"/tickets/{ticket_id}")

    @app.post("/tickets/<int:ticket_id>/comments")
    def add_comment(ticket_id):
        author = request.form.get("author", "Helpdesk IT").strip()
        content = request.form.get("content", "").strip()

        if content:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("""
                INSERT INTO comments (ticket_id, author, content)
                VALUES (%s, %s, %s)
            """, (ticket_id, author, content))
            cur.execute("""
                UPDATE tickets
                SET updated_at = NOW()
                WHERE id = %s
            """, (ticket_id,))
            conn.commit()
            cur.close()
            conn.close()

        return redirect(f"/tickets/{ticket_id}")
