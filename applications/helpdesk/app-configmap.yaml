          const adminLink = isAdmin(data) ? ` · <a href="#" onclick="renderAdminUsers();return false;">Użytkownicy</a> · <a href="#" onclick="renderAdminWorkflows();return false;">Workflow</a> · <a href="#" onclick="renderAudit();return false;">Audyt</a>` : "";
