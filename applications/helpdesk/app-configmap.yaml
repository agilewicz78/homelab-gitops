    \   \"\"\"\n\nCSS = \"\"\"\n  :root {\n    --bg: #0f172a;\n    --card: #111827;\n\
    \    --card2: #1f2937;\n    --text: #f8fafc;\n    --muted: #94a3b8;\n    --accent:\
