    def normalize_workflow_automation_actions(item, steps):
        valid_actions = {"change_status", "notify", "add_history"}
        raw_actions = item.get("actions")
        if isinstance(raw_actions, str):
            try:
                raw_actions = json.loads(raw_actions)
            except Exception:
                raw_actions = []
        if not isinstance(raw_actions, list) or not raw_actions:
            raw_actions = [{
                "action_type": item.get("action_type") or "change_status",
                "action_value": item.get("action_status") or item.get("action_value"),
                "is_active": True,
                "action_order": 1,
            }]
        actions = []
        for idx, action in enumerate(raw_actions):
            if not isinstance(action, dict):
                continue
            action_type = clean(action.get("action_type")) or "change_status"
            action_value = clean(action.get("action_value"))
            if not action_value:
                action_value = clean(action.get("action_status"))
            if action_type not in valid_actions:
                continue
            if action_type == "change_status":
                if not action_value or action_value not in steps:
                    continue
            else:
                action_value = action_value or None
            try:
                action_order = int(action.get("action_order", idx + 1))
            except Exception:
                action_order = idx + 1
            actions.append({
                "action_type": action_type,
                "action_value": action_value,
                "is_active": bool(action.get("is_active", True)),
                "action_order": max(1, min(action_order, 9999)),
            })
        return actions
    def normalize_workflow_automations(payload, steps):
        raw = payload.get("automations") or []
        if isinstance(raw, str):
            try:
                raw = json.loads(raw)
            except Exception:
                raw = []
        normalized = []
        valid_events = {
            "ticket_created",
            "comment_added",
            "user_comment_added",
            "staff_comment_added",
            "attachment_added",
            "status_changed",
        }
        valid_roles = {"user", "staff", "operator", "admin", "*", "any", ""}
        valid_visibility = {"public", "internal", "*", "any", ""}
        valid_assigned_states = {"*", "any", "assigned", "unassigned", ""}
        for item in raw:
            if not isinstance(item, dict):
                continue
            name = clean(item.get("name")) or "Reguła workflow"
            event_type = clean(item.get("event_type"))
            condition_status = clean(item.get("condition_status")) or None
            condition_to_status = clean(item.get("condition_to_status")) or None
            condition_role = clean(item.get("condition_role")) or None
            condition_visibility = clean(item.get("condition_comment_visibility")) or None
            assigned_state = clean(item.get("assigned_state")) or "*"
            is_active = bool(item.get("is_active", True))
            stop_processing = bool(item.get("stop_processing", True))
            try:
                priority = int(item.get("priority", 100))
            except Exception:
                priority = 100
            priority = max(1, min(priority, 9999))
            if event_type not in valid_events:
                continue
            if condition_role and condition_role not in valid_roles:
                condition_role = None
            if condition_role == "any":
                condition_role = "*"
            if condition_visibility and condition_visibility not in valid_visibility:
                condition_visibility = None
            if condition_visibility == "any":
                condition_visibility = "*"
            if assigned_state not in valid_assigned_states:
                assigned_state = "*"
            if assigned_state == "any":
                assigned_state = "*"
            if condition_status and condition_status not in steps:
                continue
            if condition_to_status and condition_to_status not in steps:
                continue
            actions = normalize_workflow_automation_actions(item, steps)
            if not actions:
                continue
            primary = actions[0]
            normalized.append({
                "name": name,
                "event_type": event_type,
                "condition_status": condition_status,
                "condition_to_status": condition_to_status,
                "condition_role": condition_role,
                "condition_comment_visibility": condition_visibility,
                "assigned_state": assigned_state,
                "action_type": primary.get("action_type") or "change_status",
                "action_status": primary.get("action_value"),
                "actions": actions,
                "is_active": is_active,
                "stop_processing": stop_processing,
                "priority": priority,
            })
        return normalized
    def replace_workflow_automations(cur, workflow_id, automations):
        cur.execute("DELETE FROM workflow_automations WHERE workflow_id = %s", (workflow_id,))
        for item in automations:
            cur.execute("""
                INSERT INTO workflow_automations (
                    workflow_id, name, event_type, condition_status, condition_to_status, condition_role,
                    condition_comment_visibility, assigned_state, action_type, action_status,
                    is_active, stop_processing, priority
                )
                VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
                RETURNING id
            """, (
                workflow_id,
                item.get("name") or "Reguła workflow",
                item.get("event_type"),
                item.get("condition_status"),
                item.get("condition_to_status"),
                item.get("condition_role"),
                item.get("condition_comment_visibility"),
                item.get("assigned_state") or "*",
                item.get("action_type") or "change_status",
                item.get("action_status"),
                bool(item.get("is_active", True)),
                bool(item.get("stop_processing", True)),
                int(item.get("priority", 100) or 100),
            ))
            automation_id = cur.fetchone()[0]
            for action in item.get("actions") or []:
                cur.execute("""
                    INSERT INTO workflow_automation_actions (
                        automation_id, action_order, action_type, action_value, is_active
                    )
                    VALUES (%s, %s, %s, %s, %s)
                """, (
                    automation_id,
                    int(action.get("action_order", 1) or 1),
                    action.get("action_type") or "change_status",
                    action.get("action_value"),
                    bool(action.get("is_active", True)),
                ))
    def workflow_steps_for_id(cur, workflow_id):
        cur.execute("""
            SELECT step_name
            FROM workflow_steps
            WHERE workflow_id = %s
            ORDER BY step_order ASC, id ASC
        """, (workflow_id,))
        return [r[0] for r in cur.fetchall()]
    def save_workflow_automation(cur, workflow_id, payload, automation_id=None):
        steps = workflow_steps_for_id(cur, workflow_id)
        normalized = normalize_workflow_automations({"automations": [payload]}, steps)
        if not normalized:
            raise ValueError("Nieprawidłowa reguła automatyzacji.")
        item = normalized[0]
        if automation_id is not None:
            cur.execute("""
                SELECT id
                FROM workflow_automations
                WHERE id = %s AND workflow_id = %s
            """, (automation_id, workflow_id))
            if not cur.fetchone():
                raise LookupError("Reguła automatyzacji nie istnieje.")
            cur.execute("""
                UPDATE workflow_automations
                SET name = %s,
                    event_type = %s,
                    condition_status = %s,
                    condition_to_status = %s,
                    condition_role = %s,
                    condition_comment_visibility = %s,
                    assigned_state = %s,
                    action_type = %s,
                    action_status = %s,
                    is_active = %s,
                    stop_processing = %s,
                    priority = %s
                WHERE id = %s AND workflow_id = %s
            """, (
                item.get("name") or "Reguła workflow",
                item.get("event_type"),
                item.get("condition_status"),
                item.get("condition_to_status"),
                item.get("condition_role"),
                item.get("condition_comment_visibility"),
                item.get("assigned_state") or "*",
                item.get("action_type") or "change_status",
                item.get("action_status"),
                bool(item.get("is_active", True)),
                bool(item.get("stop_processing", True)),
                int(item.get("priority", 100) or 100),
                automation_id,
                workflow_id,
            ))
            saved_id = automation_id
        else:
            cur.execute("""
                INSERT INTO workflow_automations (
                    workflow_id, name, event_type, condition_status, condition_to_status, condition_role,
                    condition_comment_visibility, assigned_state, action_type, action_status,
                    is_active, stop_processing, priority
                )
                VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
                RETURNING id
            """, (
                workflow_id,
                item.get("name") or "Reguła workflow",
                item.get("event_type"),
                item.get("condition_status"),
                item.get("condition_to_status"),
                item.get("condition_role"),
                item.get("condition_comment_visibility"),
                item.get("assigned_state") or "*",
                item.get("action_type") or "change_status",
                item.get("action_status"),
                bool(item.get("is_active", True)),
                bool(item.get("stop_processing", True)),
                int(item.get("priority", 100) or 100),
            ))
            saved_id = cur.fetchone()[0]
        cur.execute("DELETE FROM workflow_automation_actions WHERE automation_id = %s", (saved_id,))
        for action in item.get("actions") or []:
            cur.execute("""
                INSERT INTO workflow_automation_actions (
                    automation_id, action_order, action_type, action_value, is_active
                )
                VALUES (%s, %s, %s, %s, %s)
            """, (
                saved_id,
                int(action.get("action_order", 1) or 1),
                action.get("action_type") or "change_status",
                action.get("action_value"),
                bool(action.get("is_active", True)),
            ))
        return saved_id
    def workflow_comment_event_type(user):
        return "staff_comment_added" if is_staff(user) else "user_comment_added"
    def workflow_actor_role(user):
        if is_admin(user):
            return "admin"
        if is_operator(user):
            return "operator"
        return "user"
    def workflow_automation_matches(item, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None):
        if not item.get("is_active"):
            return False
        condition_status = item.get("condition_status")
        if condition_status and condition_status != current_status:
            return False
        condition_to_status = item.get("condition_to_status")
        if condition_to_status and condition_to_status != (event_new_status or ""):
            return False
        condition_role = item.get("condition_role")
        if condition_role and condition_role not in ("*", ""):
            if condition_role == "staff" and not is_staff(user):
                return False
            if condition_role == "user" and is_staff(user):
                return False
            if condition_role == "operator" and not is_operator(user):
                return False
            if condition_role == "admin" and not is_admin(user):
                return False
        condition_visibility = item.get("condition_comment_visibility")
        if condition_visibility and condition_visibility not in ("*", "") and condition_visibility != visibility:
            return False
        assigned_state = item.get("assigned_state") or "*"
        has_assignee = bool(assigned_to_email)
        if assigned_state == "assigned" and not has_assignee:
            return False
        if assigned_state == "unassigned" and has_assignee:
            return False
        return True
    def workflow_automations_for_event(cur, workflow_key, event_type, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None):
        workflow_id = workflow_id_by_key(cur, workflow_key)
        if not workflow_id:
            return []
        event_types = [event_type]
        if event_type == "comment_added":
            event_types.append(workflow_comment_event_type(user))
        cur.execute("""
            SELECT id, name, event_type, condition_status, condition_to_status, condition_role,
                   condition_comment_visibility, COALESCE(assigned_state, '*'), action_type,
                   action_status, is_active, COALESCE(stop_processing, TRUE), COALESCE(priority, 100)
            FROM workflow_automations
            WHERE workflow_id = %s
              AND event_type = ANY(%s)
              AND is_active = TRUE
            ORDER BY COALESCE(priority, 100) ASC, id ASC
        """, (workflow_id, event_types))
        result = []
        for r in cur.fetchall():
            actions = workflow_automation_action_entries(cur, r[0])
            if not actions:
                actions = [{
                    "action_type": r[8] or "change_status",
                    "action_value": r[9],
                    "is_active": True,
                    "action_order": 1,
                }]
            item = {
                "id": r[0],
                "workflow_id": workflow_id,
                "workflow_key": workflow_key,
                "name": r[1] or "Reguła workflow",
                "event_type": r[2],
                "condition_status": r[3],
                "condition_to_status": r[4],
                "condition_role": r[5],
                "condition_comment_visibility": r[6],
                "assigned_state": r[7] or "*",
                "action_type": r[8],
                "action_status": r[9],
                "actions": actions,
                "is_active": bool(r[10]),
                "stop_processing": bool(r[11]),
                "priority": int(r[12] or 100),
            }
            if workflow_automation_matches(item, current_status, user, visibility, assigned_to_email, event_new_status):
                result.append(item)
        return result
    def workflow_automation_for_comment(cur, workflow_key, current_status, user, visibility):
        rules = workflow_automations_for_event(cur, workflow_key, "comment_added", current_status, user, visibility)
        return rules[0] if rules else None
    def workflow_initial_status(cur, workflow_key):
        statuses = workflow_statuses(workflow_key)
        workflow_id = workflow_id_by_key(cur, workflow_key)
        if workflow_id:
            cur.execute("""
                SELECT COALESCE(waa.action_value, wa.action_status)
                FROM workflow_automations wa
                LEFT JOIN workflow_automation_actions waa
                  ON waa.automation_id = wa.id
                 AND waa.action_type = 'change_status'
                 AND COALESCE(waa.is_active, TRUE) = TRUE
                WHERE wa.workflow_id = %s
                  AND wa.event_type = 'ticket_created'
                  AND COALESCE(wa.is_active, TRUE) = TRUE
                  AND COALESCE(waa.action_value, wa.action_status) IS NOT NULL
                ORDER BY COALESCE(wa.priority, 100) ASC, COALESCE(waa.action_order, 1) ASC, wa.id ASC
                LIMIT 1
            """, (workflow_id,))
            row = cur.fetchone()
            if row and row[0] in statuses:
                return row[0]
        return "Nowe" if "Nowe" in statuses else (statuses[0] if statuses else "Nowe")
    def normalize_workflow_operator_emails(payload):
        raw = payload.get("operator_emails") or payload.get("operators") or []
        if isinstance(raw, str):
            raw = [x.strip() for x in raw.replace(";", ",").split(",")]
        result = []
        seen = set()
        for email in raw:
            email = clean(email).lower()
            if email and email not in seen:
                seen.add(email)
                result.append(email)
        return result
    def validate_workflow_operator_emails(cur, emails):
        if not emails:
            return []
        cur.execute("""
            SELECT lower(email), email
            FROM users
            WHERE lower(email) = ANY(%s)
              AND roles IS NOT NULL
              AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))
        """, (emails,))
        valid = {r[0]: r[1] for r in cur.fetchall()}
        missing = [email for email in emails if email not in valid]
        if missing:
            raise ValueError("Nieprawidłowi operatorzy workflow: " + ", ".join(missing))
        return [valid[email] for email in emails]
    def replace_workflow_operators(cur, workflow_id, operator_emails):
        cur.execute("DELETE FROM workflow_operators WHERE workflow_id = %s", (workflow_id,))
        for email in operator_emails:
            cur.execute("""
                INSERT INTO workflow_operators (workflow_id, user_email)
                VALUES (%s, %s)
                ON CONFLICT (workflow_id, user_email) DO NOTHING
            """, (workflow_id, email))
    def add_workflow_watchers_to_ticket(cur, ticket_id, workflow_key):
        operator_emails = workflow_operator_emails_by_key(cur, workflow_key)
        added = []
        for email in operator_emails:
            add_ticket_watcher(cur, ticket_id, email, None)
            added.append(email)
        if added:
            add_ticket_event(
                cur,
                ticket_id,
                None,
                "workflow_watchers_added",
                "System dodał operatorów workflow jako obserwatorów: " + ", ".join(added),
            )
            cur.execute("""
                SELECT title, workflow_name
                FROM tickets
                WHERE id = %s
            """, (ticket_id,))
            ticket_row = cur.fetchone()
            ticket_title = ticket_row[0] if ticket_row and ticket_row[0] else f"#{ticket_id}"
            workflow_name = ticket_row[1] if ticket_row and ticket_row[1] else "workflow"
            create_notifications(
                cur,
                added,
                ticket_id,
                "workflow_watcher_added",
                f'Dodano Cię jako obserwatora zgłoszenia #{ticket_id}: {ticket_title} (workflow: {workflow_name})',
                actor_email=None,
            )
        return added
    def ticket_notification_recipients(cur, ticket_id, event_type):
        """Return notification recipients according to the helpdesk workflow.
        Workflow:
        - new ticket -> all operators and admins,
        - internal note -> all operators/admins plus staff watchers,
        - assigned ticket -> requester, assigned operator and watchers,
        - unassigned ticket -> requester, watchers plus all operators/admins.
        """
        recipients = set()
        requester_email, assigned_to_email = ticket_notification_participants(cur, ticket_id)
        if event_type == "ticket_created":
            recipients.update(staff_notification_recipients(cur))
            return recipients
        if event_type == "internal_note_added":
            recipients.update(staff_notification_recipients(cur))
            recipients.update(ticket_watcher_emails(cur, ticket_id, staff_only=True))
            return recipients
        recipients.update(ticket_watcher_emails(cur, ticket_id))
        if assigned_to_email:
            if requester_email:
                recipients.add(requester_email)
            recipients.add(assigned_to_email)
            return recipients
        if requester_email:
            recipients.add(requester_email)
        recipients.update(staff_notification_recipients(cur))
        return recipients
    def create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=None):
        for email in sorted({email for email in recipients if email}):
            if actor_email and email == actor_email:
                continue
            cur.execute("""
                INSERT INTO notifications (user_email, ticket_id, type, message)
                VALUES (%s, %s, %s, %s)
            """, (email, ticket_id, event_type, message))
    def create_ticket_notifications(cur, ticket_id, event_type, message, actor_email=None, staff_only=False):
        recipients = ticket_notification_recipients(cur, ticket_id, event_type)
        create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=actor_email)
    def api_admin_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not is_admin(user):
                return jsonify({"error": "admin required"}), 403
            return fn(user, *args, **kwargs)
        return wrapper
    def api_staff_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not is_staff(user):
                return jsonify({"error": "operator or admin required"}), 403
            return fn(user, *args, **kwargs)
        return wrapper
