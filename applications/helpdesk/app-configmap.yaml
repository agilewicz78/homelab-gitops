        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404

        cur.execute("""
            SELECT author, content, created_at
            FROM comments
            WHERE ticket_id = %s
            ORDER BY id ASC
        """, (ticket_id,))
        comment_rows = cur.fetchall()
        cur.close()
        conn.close()

