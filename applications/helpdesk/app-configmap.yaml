    # Pobiera reguły automatyzacji workflow wraz z akcjami.
    def workflow_automation_entries(cur, workflow_id):
        cur.execute("""
            SELECT id, name, event_type, condition_status, condition_to_status, condition_role,
                   condition_comment_visibility, COALESCE(assigned_state, '*'), action_type,
                   action_status, is_active, COALESCE(stop_processing, TRUE), COALESCE(priority, 100),
                   COALESCE(condition_priority, '*'), COALESCE(condition_category, '*'),
                   COALESCE(condition_subcategory, '*'), COALESCE(condition_sla_state, '*'),
                   COALESCE(condition_status_operator, 'eq'), COALESCE(condition_to_status_operator, 'eq'),
                   COALESCE(condition_role_operator, 'eq'), COALESCE(condition_comment_visibility_operator, 'eq'),
                   COALESCE(assigned_state_operator, 'eq'), COALESCE(condition_priority_operator, 'eq'),
                   COALESCE(condition_category_operator, 'eq'), COALESCE(condition_subcategory_operator, 'eq'),
                   COALESCE(condition_sla_state_operator, 'eq')
            FROM workflow_automations
            WHERE workflow_id = %s
            ORDER BY COALESCE(priority, 100) ASC, id ASC
        """, (workflow_id,))
        result = []
