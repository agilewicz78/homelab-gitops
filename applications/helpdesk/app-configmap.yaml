                <button type="submit">Utwórz zgłoszenie</button>
                <button type="button" class="btn-secondary" onclick="renderHome()">Anuluj</button>
              </form>
            </section>`;
          document.getElementById("ticketForm").addEventListener("submit", createTicket);
        }}

        async function createTicket(event) {{
          event.preventDefault();
          const form = event.target;
          const formData = new FormData(form);
          const files = formData.getAll("attachments").filter(file => file && file.name);
          const payload = {{
            title: formData.get("title") || "",
            description: formData.get("description") || "",
            category: formData.get("category") || "",
            priority: formData.get("priority") || "Normalny"
          }};

          suppressNextLiveRefresh = true;
          const res = await api("/api/tickets", {{ method: "POST", body: JSON.stringify(payload) }});
          if (!res) return;
          if (!res.ok) {{ alert("Nie udało się utworzyć zgłoszenia."); return; }}

          const created = await res.json();
          const ticketId = created.id;

          if (files.length > 0) {{
            for (const file of files) {{
              const uploadData = new FormData();
              uploadData.append("file", file);

              const uploadRes = await fetch(`/api/tickets/${{ticketId}}/attachments`, {{
                method: "POST",
                headers: {{ "X-Helpdesk-Session": getSid() }},
                body: uploadData
              }});

              if (!uploadRes.ok) {{
                const err = await uploadRes.json().catch(() => ({{ error: "Nie udało się dodać załącznika." }}));
                showToast("Zgłoszenie utworzone, ale nie dodano załącznika", err.error || "Błąd uploadu");
              }}
            }}
          }}

          showToast("Zgłoszenie zostało utworzone", files.length ? `Dodano załączniki: ${{files.length}}` : "");
          await renderHome();
        }}

        async function renderTicket(id, fromLive = false) {{
          currentView = {{ name: "ticket", ticketId: Number(id) }};
          const me = await loadMe();
          if (!me) return;
          const res = await api(`/api/tickets/${{id}}`);
          if (!res) return;
          if (!res.ok) {{ appEl.innerHTML = `<section class="card"><h2>Brak dostępu albo brak zgłoszenia</h2></section>`; return; }}
          const data = await res.json();
          const t = data.ticket;
          const comments = data.comments.map(c => `
            <div class="comment ${{c.visibility === "internal" ? "internal" : ""}}">
              <div class="muted">
                ${{esc(c.author)}} · ${{esc(c.created_at)}}
                <span class="comment-type ${{c.visibility === "internal" ? "internal" : "public"}}">${{c.visibility === "internal" ? "Wewnętrzny" : "Publiczny"}}</span>
              </div>
