              <div class="pagination-pages">
                ${buildPaginationButtons(pagination)}
              </div>
            </div>`;
          const homeContent = `
            <section class="stats">
              <div class="stat"><div class="num">${data.stats.total}</div><div class="label">${scope}</div></div>
              <div class="stat"><div class="num">${data.stats.new}</div><div class="label">Nowe</div></div>
              <div class="stat"><div class="num">${data.stats.in_progress}</div><div class="label">W trakcie</div></div>
              <div class="stat"><div class="num">${data.stats.high}</div><div class="label">Wysoki / Krytyczny</div></div>
              <div class="stat"><div class="num">${data.stats.resolved}</div><div class="label">Rozwiązane / Zamknięte</div></div>
