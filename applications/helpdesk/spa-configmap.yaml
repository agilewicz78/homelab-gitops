            renderNewTicketServiceHint(null);
            updateSubcategorySelect(meta);
            scheduleNewTicketKnowledgeSuggestions();
          });
          document.getElementById("new-ticket-subcategory").addEventListener("change", () => {
            const serviceSelect = document.getElementById("new-ticket-service");
            if (serviceSelect) serviceSelect.value = "";
