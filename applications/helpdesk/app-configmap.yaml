    def role_permissions_payload():
        """Buduje payload macierzy uprawnień dla UI administratora."""
        conn = get_conn()
        cur = conn.cursor()
        ensure_role_permissions_schema(cur)
        conn.commit()
        cur.execute("""
            SELECT role_key, permission_code, enabled
            FROM role_permissions
            ORDER BY role_key, permission_code
        """)
        rows = cur.fetchall()
        cur.close()
        conn.close()
        direct = {role: set() for role in VALID_ROLES}
        disabled = {role: set() for role in VALID_ROLES}
        for role_key, permission_code, enabled in rows:
            if role_key not in direct:
                continue
            if enabled:
                direct[role_key].add(permission_code)
            else:
                disabled[role_key].add(permission_code)
        for role_key, locked in LOCKED_ROLE_PERMISSION_CODES.items():
            direct.setdefault(role_key, set()).update(locked)
        return {
            "all_permissions": [
                {
                    "code": code,
                    "label": PERMISSION_LABELS.get(code, code),
                }
                for code in all_permission_codes()
            ],
            "roles": [
                {
                    "key": key,
                    "label": ROLE_PERMISSION_MATRIX.get(key, {}).get("label", key),
                    "description": ROLE_PERMISSION_MATRIX.get(key, {}).get("description", ""),
                    "permissions": ROLE_PERMISSION_MATRIX.get(key, {}).get("permissions") or [],
                    "direct_permission_codes": sorted(direct.get(key, set())),
                    "editable_permission_codes": sorted(ROLE_PERMISSION_CODES.get(key, set())),
                    "locked_permission_codes": sorted(LOCKED_ROLE_PERMISSION_CODES.get(key, set())),
                    "inherited_permission_codes": sorted({
                        code
                        for inherited_role in ROLE_INHERITANCE.get(key, [key])
                        for code in direct.get(inherited_role, set())
                    }),
                    "permission_codes": sorted({
                        code
                        for inherited_role in ROLE_INHERITANCE.get(key, [key])
                        for code in direct.get(inherited_role, set())
                    }),
                }
                for key in VALID_ROLES
            ]
        }
    
    
