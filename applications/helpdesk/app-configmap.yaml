    @app.get("/api/audit")
    @api_login_required
    @api_permission_required("audit.view", "Brak uprawnienia do audytu.")

    # Widok audytu z filtrowaniem.
    def api_audit(user):
        q = clean(request.args.get("q") or "")
        action_filter = clean(request.args.get("action") or "all")
        actor_filter = clean(request.args.get("actor") or "all")
        try:
            page = max(1, int(request.args.get("page", "1")))
        except ValueError:
            page = 1
        try:
            page_size = int(request.args.get("page_size", "25"))
        except ValueError:
            page_size = 25
        if page_size not in (25, 50, 100):
            page_size = 25
        clauses = []
        params = []
        if action_filter and action_filter != "all":
            clauses.append("action = %s")
            params.append(action_filter)
        if actor_filter and actor_filter != "all":
            clauses.append("lower(actor_email) = lower(%s)")
            params.append(actor_filter)
        if q:
            like = f"%{q.lower()}%"
            clauses.append("""(
                lower(coalesce(actor_email, '')) LIKE %s
                OR lower(coalesce(actor_name, '')) LIKE %s
                OR lower(coalesce(action, '')) LIKE %s
                OR lower(coalesce(target_type, '')) LIKE %s
                OR lower(coalesce(target_id, '')) LIKE %s
                OR lower(coalesce(details, '')) LIKE %s
            )""")
            params.extend([like, like, like, like, like, like])
        where_sql = ("WHERE " + " AND ".join(clauses)) if clauses else ""
        offset = (page - 1) * page_size
        conn = get_conn()
        cur = conn.cursor()
        cur.execute(f"SELECT COUNT(*) FROM audit_log {where_sql}", params)
        total = cur.fetchone()[0]
        total_pages = max(1, (total + page_size - 1) // page_size)
        if page > total_pages:
            page = total_pages
            offset = (page - 1) * page_size
        cur.execute(f"""
            SELECT id, actor_email, actor_name, action, target_type, target_id, details, created_at
            FROM audit_log
            {where_sql}
            ORDER BY created_at DESC, id DESC
            LIMIT %s OFFSET %s
        """, params + [page_size, offset])
        rows = cur.fetchall()
        cur.execute("""
            SELECT DISTINCT action
            FROM audit_log
            ORDER BY action
        """)
        actions = [r[0] for r in cur.fetchall()]
        cur.execute("""
            SELECT DISTINCT actor_email
            FROM audit_log
            WHERE actor_email IS NOT NULL AND actor_email <> ''
            ORDER BY actor_email
        """)
        actors = [r[0] for r in cur.fetchall()]
        cur.close()
        conn.close()
        return jsonify({
            "audit": [
                {
                    "id": r[0],
                    "actor_email": r[1] or "",
                    "actor_name": r[2] or "System",
                    "action": r[3],
                    "target_type": r[4],
                    "target_id": r[5] or "",
                    "details": r[6] or "",
                    "created_at": str(r[7]),
                }
                for r in rows
            ],
            "actions": actions,
            "actors": actors,
            "pagination": {
                "page": page,
                "page_size": page_size,
                "total_filtered": total,
                "total_pages": total_pages,
            },
            "filters": {
                "q": q,
                "action": action_filter,
                "actor": actor_filter,
            },
        })

