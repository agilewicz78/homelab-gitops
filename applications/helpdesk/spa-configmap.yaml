        function resolutionFeedbackPanel(ticket) {
          const decision = ticket.resolution_feedback_decision || "";
          if (decision === "accepted") {
            return `
              <div class="panel-soft resolution-feedback-panel">
                <strong>Rozwiązanie potwierdzone przez użytkownika.</strong>
                <div class="attachment-upload-hint">
                  ${esc(ticket.resolution_feedback_by_name || "Użytkownik")} · ${esc(ticket.resolution_feedback_at || "")}
                  ${ticket.resolution_feedback_comment ? " · " + esc(ticket.resolution_feedback_comment) : ""}
                </div>
              </div>
            `;
          }
          if (ticket.status !== "Rozwiązane") return "";
          const rejectedHint = decision === "rejected"
            ? `<p class="muted">Wcześniej zgłoszono, że rozwiązanie nie pomogło. Jeżeli operator poprawił rozwiązanie, możesz ocenić je ponownie.</p>`
            : "";
          return `
            <div class="panel-soft resolution-feedback-panel">
              <strong>Czy problem został rozwiązany?</strong>
              <p class="muted">Twoja odpowiedź zamyka pętlę obsługi. Jeśli wszystko działa, zgłoszenie zostanie zamknięte. Jeśli nadal jest problem, wróci do operatora.</p>
              ${rejectedHint}
              <label>Dodatkowy komentarz opcjonalny przy potwierdzeniu, wymagany przy odrzuceniu</label>
              <textarea id="resolutionFeedbackComment" placeholder="Np. Działa po restarcie usługi albo: problem nadal występuje na laptopie..."></textarea>
              <div class="form-actions">
                <button type="button" onclick="submitResolutionFeedback(${Number(ticket.id)}, 'accepted')">Tak, działa</button>
                <button type="button" class="btn-danger" onclick="submitResolutionFeedback(${Number(ticket.id)}, 'rejected')">Nie, nadal mam problem</button>
              </div>
            </div>
          `;
        }
        async function submitResolutionFeedback(ticketId, decision) {
          const comment = document.getElementById("resolutionFeedbackComment")?.value || "";
          if (decision === "rejected" && comment.trim().length < 5) {
            alert("Napisz krótko, co nadal nie działa. Operator od razu dostanie tę informację.");
            return;
          }
          const accepted = decision === "accepted";
          const message = accepted
            ? "Potwierdzić rozwiązanie i zamknąć zgłoszenie?"
            : "Odesłać zgłoszenie do operatora z Twoim komentarzem?";
          if (!confirm(message)) return;
          suppressNextLiveRefresh = true;
          const res = await api(`/api/tickets/${ticketId}/resolution-feedback`, {
            method: "POST",
            body: JSON.stringify({ decision, comment })
          });
          const data = res ? await res.json().catch(() => ({})) : {};
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            alert(data.error || "Nie udało się zapisać oceny rozwiązania.");
            return;
          }
          showToast(
            accepted ? "Dziękujemy za potwierdzenie rozwiązania" : "Zgłoszenie wróciło do operatora",
            data.ticket_status ? `Aktualny status: ${data.ticket_status}` : ""
          );
          await renderTicket(ticketId);
        }
        function ticketAssistantDiagnosis(ticket, articles = [], similarTickets = [], incidents = []) {
          if (incidents.length) {
            const top = incidents[0];
            return `Możliwy incydent: ${top.severity || "SEV"} #${top.id} · ${top.title || "bez tytułu"}. Sprawdź, czy zgłoszenie nie jest częścią większego problemu.`;
          }
          if (similarTickets.length >= 3) {
            return `To wygląda podobnie do ${similarTickets.length} zgłoszeń od innych użytkowników. Warto rozważyć powiązanie ticketów albo utworzenie incydentu.`;
          }
          if (similarTickets.length) {
            return `Znaleziono ${similarTickets.length} podobne zgłoszenie od innego użytkownika. Sprawdź historię przed odpowiedzią.`;
          }
          if (articles.length) {
            return `Baza wiedzy ma ${articles.length} pasujące rozwiązanie. Otwórz artykuł i wykorzystaj go w odpowiedzi.`;
          }
          return "Brak mocnych sugestii. Obsłuż zgłoszenie standardowo i uzupełnij wiedzę, jeśli pojawi się powtarzalny wzorzec.";
        }
        function ticketAssistantPriorityHint(ticket, similarTickets = [], incidents = []) {
          const incidentSeverity = incidents[0]?.severity || "";
          if (incidentSeverity === "SEV1" || ticket.priority === "Krytyczny") return "Krytyczny · możliwy wpływ na wielu użytkowników albo już ustawiony krytyczny priorytet.";
          if (incidentSeverity === "SEV2" || similarTickets.length >= 3) return "Wysoki · kilka podobnych spraw sugeruje szerszy problem.";
          if (ticket.sla_state === "overdue" || ticket.first_response_state === "overdue") return `${ticket.priority || "Normalny"} · SLA jest przekroczone, potraktuj jako pilne.`;
          if (ticket.sla_state === "warning" || ticket.first_response_state === "warning") return `${ticket.priority || "Normalny"} · SLA zbliża się do terminu.`;
          return `${ticket.priority || "Normalny"} · brak dodatkowych sygnałów do podniesienia priorytetu.`;
        }
        function ticketAssistantWorkflowHint(ticket, articles = [], similarTickets = []) {
          const candidates = [];
          [...similarTickets, ...articles].forEach(item => {
            const category = item.category || "";
            const subcategory = item.subcategory || "Inne";
            if (category) candidates.push(`${category} / ${subcategory}`);
          });
          const counts = candidates.reduce((acc, key) => {
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});
          const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
          const current = `${ticket.category || "-"} / ${ticket.subcategory || "Inne"}`;
          if (best && best[0] !== current && best[1] >= 2) {
            return `Sprawdź kategorię: ${best[0]}. Kilka podobnych elementów wskazuje ten kierunek. Aktualny workflow: ${ticket.workflow_name || "standardowy"}.`;
          }
          return `Aktualny workflow: ${ticket.workflow_name || "standardowy"} · kategoria: ${current}.`;
        }
        function ticketAssistantArticleList(articles = []) {
          if (!articles.length) return `<p class="muted">Brak pasujących artykułów.</p>`;
          return `
            <div class="watcher-list">${articles.map(article => `
              <div class="watcher-item">
