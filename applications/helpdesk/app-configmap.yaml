apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-app
  namespace: helpdesk
data:
  app.py: "import os\nimport time\nimport html\nfrom datetime import datetime, timedelta\nimport uuid\nimport json\nimport psycopg2\nfrom functools import wraps\nfrom flask import Flask, request, redirect, Response, jsonify, send_file\nfrom flask_sock import Sock\nfrom werkzeug.security import generate_password_hash, check_password_hash\nfrom werkzeug.utils import secure_filename\n\napp = Flask(__name__)\napp.secret_key = os.getenv(\"FLASK_SECRET_KEY\", \"change-me\")\nsock = Sock(app)\nactive_ws_clients = set()\nlast_live_event = {\"id\": str(uuid.uuid4()), \"type\": \"system\", \"message\": \"System gotowy\", \"ticket_id\": None}\n\n\nDB_HOST = os.getenv(\"DB_HOST\", \"helpdesk-postgres\")\nDB_PORT = os.getenv(\"DB_PORT\", \"5432\")\nDB_NAME = os.getenv(\"POSTGRES_DB\", \"helpdeskdb\")\nDB_USER = os.getenv(\"POSTGRES_USER\", \"helpdeskuser\")\nDB_PASSWORD = os.getenv(\"POSTGRES_PASSWORD\")\n\nATTACHMENTS_DIR = os.getenv(\"ATTACHMENTS_DIR\", \"/data/attachments\")\nMAX_ATTACHMENT_SIZE = 10 * 1024 * 1024\nALLOWED_ATTACHMENT_EXTENSIONS = {\n    \"png\", \"jpg\", \"jpeg\", \"gif\", \"pdf\", \"txt\", \"log\", \"csv\", \"xlsx\", \"docx\"\n}\n\n\nINITIAL_PASSWORD = \"Incoprp123!\"\n\nDEPARTMENTS = [\n    \"HR\",\n    \"Finanse\",\n    \"Sprzedaż\",\n    \"Marketing\",\n    \"Obsługa klienta\",\n    \"Administracja\",\n    \"IT\",\n    \"Zarząd\",\n    \"Logistyka\",\n    \"Księgowość\",\n]\n\nSUBCATEGORIES = {\n    \"Komputer i laptop\": [\n        \"Wolne działanie\",\n        \"Awaria sprzętu\",\n        \"Aktualizacja systemu\",\n        \"Oprogramowanie\",\n        \"Stacja dokująca / monitor\",\n        \"Inne\",\n    ],\n    \"Poczta e-mail\": [\n        \"Outlook\",\n        \"Webmail\",\n        \"Skrzynka współdzielona\",\n        \"Spam / phishing\",\n        \"Załączniki\",\n        \"Inne\",\n    ],\n    \"Drukarki i skanery\": [\n        \"Brak wydruku\",\n        \"Brak tonera\",\n        \"Skanowanie\",\n        \"Kolejka wydruku\",\n        \"Sterownik\",\n        \"Inne\",\n    ],\n    \"Microsoft 365 / Office\": [\n        \"Word\",\n        \"Excel\",\n        \"Teams\",\n        \"OneDrive\",\n        \"SharePoint\",\n        \"Licencja\",\n        \"Inne\",\n    ],\n    \"Sieć i Wi-Fi\": [\n        \"Brak połączenia\",\n        \"Słaby zasięg\",\n        \"DNS / dostęp do stron\",\n        \"LAN / kabel\",\n        \"Inne\",\n    ],\n    \"VPN i praca zdalna\": [\n        \"Brak połączenia\",\n        \"MFA\",\n        \"Wolne połączenie\",\n        \"Certyfikat\",\n        \"Dostęp z domu\",\n        \"Inne\",\n    ],\n    \"Konta i hasła\": [\n        \"Reset hasła\",\n        \"Blokada konta\",\n        \"MFA\",\n        \"Uprawnienia\",\n        \"Nowe konto\",\n        \"Inne\",\n    ],\n    \"Telefon / Teams / wideokonferencje\": [\n        \"Mikrofon\",\n        \"Kamera\",\n        \"Słuchawki\",\n        \"Połączenia Teams\",\n        \"Telefon służbowy\",\n        \"Inne\",\n    ],\n    \"Dostępy do systemów\": [\n        \"Nowy dostęp\",\n        \"Brak dostępu\",\n        \"Zmiana uprawnień\",\n        \"Folder sieciowy\",\n        \"Aplikacja biznesowa\",\n        \"Inne\",\n    ],\n    \"Sprzęt biurowy\": [\n        \"Klawiatura / mysz\",\n        \"Monitor\",\n        \"Telefon\",\n        \"Akcesoria\",\n        \"Inne\",\n    ],\n    \"Inne\": [\n        \"Inne\",\n    ],\n}\n\nCATEGORIES = list(SUBCATEGORIES.keys())\n\nPRIORITIES = [\"Niski\", \"Normalny\", \"Wysoki\", \"Krytyczny\"]\n\nSTATUSES = [\n    \"Nowe\",\n    \"Otwarte\",\n    \"W trakcie\",\n    \"Oczekuje na użytkownika\",\n    \"Oczekuje na dostawcę\",\n    \"Rozwiązane\",\n    \"Zamknięte\",\n]\n\nSLA_HOURS = {\n    \"Krytyczny\": 4,\n    \"Wysoki\": 8,\n    \"Normalny\": 48,\n    \"Niski\": 120,\n}\n\nVALID_ROLES = [\"user\", \"operator\", \"admin\"]\n\nSEED_USERS = [\n    (\"Anna\", \"Kowalska\", \"anna.kowalska@incoprp.local\", \"HR\", \"user\"),\n    (\"Piotr\", \"Nowak\", \"piotr.nowak@incoprp.local\", \"Finanse\", \"user\"),\n    (\"Magdalena\", \"Zielińska\", \"magdalena.zielinska@incoprp.local\", \"Sprzedaż\", \"user\"),\n    (\"Tomasz\", \"Wiśniewski\", \"tomasz.wisniewski@incoprp.local\", \"Marketing\", \"user\"),\n    (\"Karolina\", \"Wójcik\", \"karolina.wojcik@incoprp.local\", \"Obsługa klienta\", \"user\"),\n    (\"Joanna\", \"Lewandowska\", \"joanna.lewandowska@incoprp.local\", \"Księgowość\", \"user\"),\n    (\"Helpdesk\", \"Operator\", \"operator@incoprp.local\", \"IT\", \"operator\"),\n    (\"Helpdesk\", \"Admin\", \"admin@incoprp.local\", \"IT\", \"admin\"),\n]\n\nSEED_TICKETS = [\n    (\n        \"Outlook nie odbiera poczty\",\n        \"Od rana Outlook nie synchronizuje nowych wiadomości. Webmail działa, ale aplikacja pokazuje błąd połączenia.\",\n        \"Anna Kowalska\",\n        \"anna.kowalska@incoprp.local\",\n        \"HR\",\n        \"Poczta e-mail\",\n        \"Wysoki\",\n        \"Otwarte\",\n    ),\n    (\n        \"Drukarka w księgowości nie drukuje faktur\",\n        \"Drukarka pokazuje zadania w kolejce, ale nic nie wychodzi. Problem dotyczy faktur PDF.\",\n        \"Joanna Lewandowska\",\n        \"joanna.lewandowska@incoprp.local\",\n        \"Księgowość\",\n        \"Drukarki i skanery\",\n        \"Wysoki\",\n        \"W trakcie\",\n    ),\n    (\n        \"Problem z połączeniem VPN z domu\",\n        \"Po wpisaniu hasła VPN rozłącza się po kilku sekundach. Problem występuje od ostatniej aktualizacji laptopa.\",\n        \"Piotr Nowak\",\n        \"piotr.nowak@incoprp.local\",\n        \"Finanse\",\n        \"VPN i praca zdalna\",\n        \"Normalny\",\n        \"Nowe\",\n    ),\n    (\n        \"Teams nie wykrywa mikrofonu\",\n        \"Podczas spotkań w Teams mikrofon nie jest dostępny, mimo że działa w ustawieniach systemu.\",\n        \"Tomasz Wiśniewski\",\n        \"tomasz.wisniewski@incoprp.local\",\n        \"Marketing\",\n        \"Telefon / Teams / wideokonferencje\",\n        \"Normalny\",\n        \"Oczekuje na użytkownika\",\n    ),\n    (\n        \"Brak dostępu do folderu Sprzedaż\",\n        \"Po zmianie stanowiska użytkownik nie widzi folderu współdzielonego Sprzedaż na dysku sieciowym.\",\n        \"Magdalena Zielińska\",\n        \"magdalena.zielinska@incoprp.local\",\n        \"Sprzedaż\",\n        \"Dostępy do systemów\",\n        \"Wysoki\",\n        \"Otwarte\",\n    ),\n    (\n        \"Laptop działa bardzo wolno po aktualizacji\",\n        \"Po ostatniej aktualizacji systemu laptop uruchamia się długo, a Excel i Outlook zawieszają się kilka razy dziennie.\",\n        \"Karolina Wójcik\",\n        \"karolina.wojcik@incoprp.local\",\n        \"Obsługa klienta\",\n        \"Komputer i laptop\",\n        \"Normalny\",\n        \"Nowe\",\n    ),\n]\n\ndef get_conn():\n    return psycopg2.connect(\n        host=DB_HOST,\n        port=DB_PORT,\n        dbname=DB_NAME,\n        user=DB_USER,\n        password=DB_PASSWORD,\n    )\n\ndef init_db():\n    for _ in range(40):\n        try:\n            conn = get_conn()\n            cur = conn.cursor()\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS users (\n                    id SERIAL PRIMARY KEY,\n                    first_name TEXT NOT NULL,\n                    last_name TEXT NOT NULL,\n                    email TEXT UNIQUE NOT NULL,\n                    department TEXT NOT NULL,\n                    role TEXT NOT NULL DEFAULT 'user',\n                    password_hash TEXT NOT NULL,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n            cur.execute(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS first_name TEXT\")\n            cur.execute(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS last_name TEXT\")\n            cur.execute(\"\"\"\n                SELECT EXISTS (\n                  SELECT 1\n                  FROM information_schema.columns\n                  WHERE table_name = 'users' AND column_name = 'full_name'\n                )\n            \"\"\")\n            has_full_name = cur.fetchone()[0]\n            if has_full_name:\n                cur.execute(\"\"\"\n                    UPDATE users\n                    SET\n                      first_name = COALESCE(NULLIF(first_name, ''), split_part(full_name, ' ', 1)),\n                      last_name = COALESCE(\n                        NULLIF(last_name, ''),\n                        NULLIF(trim(substr(full_name, length(split_part(full_name, ' ', 1)) + 1)), ''),\n                        '-'\n                      )\n                    WHERE first_name IS NULL OR first_name = '' OR last_name IS NULL OR last_name = ''\n                \"\"\")\n                cur.execute(\"ALTER TABLE users DROP COLUMN IF EXISTS full_name\")\n            cur.execute(\"UPDATE users SET first_name = 'Nieznane' WHERE first_name IS NULL OR first_name = ''\")\n            cur.execute(\"UPDATE users SET last_name = '-' WHERE last_name IS NULL OR last_name = ''\")\n\n            cur.execute(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS roles TEXT[]\")\n            cur.execute(\"UPDATE users SET role = 'operator' WHERE role = 'agent'\")\n            cur.execute(\"\"\"\n                UPDATE users\n                SET first_name = 'Helpdesk', last_name = 'Operator'\n                WHERE email IN ('agent@incoprp.local', 'operator@incoprp.local')\n                  AND lower(first_name) = 'helpdesk'\n            \"\"\")\n            cur.execute(\"\"\"\n                UPDATE users\n                SET roles = CASE\n                    WHEN role = 'admin' THEN ARRAY['user','admin','operator']\n                    WHEN role = 'operator' THEN ARRAY['user','operator']\n                    ELSE ARRAY['user']\n                END\n                WHERE roles IS NULL OR array_length(roles, 1) IS NULL\n            \"\"\")\n            cur.execute(\"UPDATE users SET roles = ARRAY['user'] WHERE NOT ('user' = ANY(roles))\")\n            cur.execute(\"\"\"\n                UPDATE users\n                SET role = CASE\n                    WHEN 'admin' = ANY(roles) THEN 'admin'\n                    WHEN 'operator' = ANY(roles) THEN 'operator'\n                    ELSE 'user'\n                END\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS user_sessions (\n                    sid TEXT PRIMARY KEY,\n                    user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,\n                    created_at TIMESTAMP DEFAULT NOW(),\n                    last_seen TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS tickets (\n                    id SERIAL PRIMARY KEY,\n                    title TEXT NOT NULL,\n                    description TEXT NOT NULL,\n                    requester_name TEXT NOT NULL,\n                    requester_email TEXT NOT NULL,\n                    department TEXT NOT NULL,\n                    category TEXT NOT NULL,\n                    subcategory TEXT DEFAULT 'Inne',\n                    priority TEXT NOT NULL,\n                    status TEXT NOT NULL,\n                    created_at TIMESTAMP DEFAULT NOW(),\n                    updated_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS comments (\n                    id SERIAL PRIMARY KEY,\n                    ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    author TEXT NOT NULL,\n                    content TEXT NOT NULL,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE comments\n                ADD COLUMN IF NOT EXISTS visibility TEXT DEFAULT 'public'\n            \"\"\")\n            cur.execute(\"\"\"\n                UPDATE comments\n                SET visibility = 'public'\n                WHERE visibility IS NULL OR visibility NOT IN ('public', 'internal')\n            \"\"\")\n\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS assigned_to_email TEXT REFERENCES users(email) ON DELETE SET NULL\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS subcategory TEXT DEFAULT 'Inne'\n            \"\"\")\n            cur.execute(\"\"\"\n                UPDATE tickets\n                SET subcategory = 'Inne'\n                WHERE subcategory IS NULL OR trim(subcategory) = ''\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS sla_due_at TIMESTAMP\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS resolution_minutes INTEGER\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS closed_at TIMESTAMP\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS closed_by_email TEXT REFERENCES users(email) ON DELETE SET NULL\n            \"\"\")\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS resolution_summary TEXT\n            \"\"\")\n            cur.execute(\"\"\"\n                UPDATE tickets\n                SET sla_due_at = created_at + CASE priority\n                    WHEN 'Krytyczny' THEN INTERVAL '4 hours'\n                    WHEN 'Wysoki' THEN INTERVAL '8 hours'\n                    WHEN 'Normalny' THEN INTERVAL '48 hours'\n                    WHEN 'Niski' THEN INTERVAL '120 hours'\n                    ELSE INTERVAL '48 hours'\n                END\n                WHERE sla_due_at IS NULL\n            \"\"\")\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS ticket_events (\n                    id SERIAL PRIMARY KEY,\n                    ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    actor_email TEXT,\n                    actor_name TEXT,\n                    event_type TEXT NOT NULL,\n                    message TEXT NOT NULL,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS attachments (\n                    id SERIAL PRIMARY KEY,\n                    ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    original_filename TEXT NOT NULL,\n                    stored_filename TEXT NOT NULL,\n                    content_type TEXT,\n                    size_bytes INTEGER NOT NULL,\n                    uploaded_by_email TEXT,\n                    uploaded_by_name TEXT,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS notifications (\n                    id SERIAL PRIMARY KEY,\n                    user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,\n                    ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    type TEXT NOT NULL,\n                    message TEXT NOT NULL,\n                    is_read BOOLEAN DEFAULT FALSE,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS ticket_watchers (\n                    id SERIAL PRIMARY KEY,\n                    ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,\n                    added_by_email TEXT REFERENCES users(email) ON DELETE SET NULL,\n                    created_at TIMESTAMP DEFAULT NOW(),\n                    UNIQUE(ticket_id, user_email)\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS ticket_links (\n                    id SERIAL PRIMARY KEY,\n                    ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    linked_ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    relation_type TEXT NOT NULL DEFAULT 'related',\n                    created_by_email TEXT REFERENCES users(email) ON DELETE SET NULL,\n                    created_at TIMESTAMP DEFAULT NOW(),\n                    UNIQUE(ticket_id, linked_ticket_id, relation_type),\n                    CHECK (ticket_id <> linked_ticket_id)\n                );\n            \"\"\")\n\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS audit_log (\n                    id SERIAL PRIMARY KEY,\n                    actor_email TEXT,\n                    actor_name TEXT,\n                    action TEXT NOT NULL,\n                    target_type TEXT NOT NULL,\n                    target_id TEXT,\n                    details TEXT,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n\n            password_hash = generate_password_hash(INITIAL_PASSWORD)\n            for first_name, last_name, email, department, role in SEED_USERS:\n                cur.execute(\"\"\"\n                    INSERT INTO users (first_name, last_name, email, department, role, password_hash)\n                    VALUES (%s, %s, %s, %s, %s, %s)\n                    ON CONFLICT (email) DO NOTHING\n                \"\"\", (first_name, last_name, email, department, role, password_hash))\n\n                cur.execute(\"\"\"\n                    UPDATE users\n                    SET roles = CASE\n                        WHEN %s = 'admin' THEN ARRAY['user','admin','operator']\n                        WHEN %s = 'operator' THEN ARRAY['user','operator']\n                        ELSE ARRAY['user']\n                    END,\n                    role = CASE\n                        WHEN %s = 'admin' THEN 'admin'\n                        WHEN %s = 'operator' THEN 'operator'\n                        ELSE 'user'\n                    END\n                    WHERE email = %s AND (roles IS NULL OR array_length(roles, 1) IS NULL)\n                \"\"\", (role, role, role, role, email))\n\n            cur.execute(\"SELECT COUNT(*) FROM tickets\")\n            count = cur.fetchone()[0]\n            if count == 0:\n                for ticket in SEED_TICKETS:\n                    priority = ticket[6]\n                    sla_due_at = datetime.now() + timedelta(hours=SLA_HOURS.get(priority, 48))\n                    cur.execute(\"\"\"\n                        INSERT INTO tickets (\n                            title, description, requester_name, requester_email,\n                            department, category, subcategory, priority, status, sla_due_at\n                        )\n                        VALUES (%s, %s, %s, %s, %s, %s, 'Inne', %s, %s, %s)\n                    \"\"\", ticket + (sla_due_at,))\n\n            conn.commit()\n            cur.close()\n            conn.close()\n            return\n        except Exception as e:\n            print(f\"Waiting for database: {e}\", flush=True)\n            time.sleep(1)\n    raise RuntimeError(\"Database unavailable\")\n\ninit_db()\n\ndef esc(value):\n    return html.escape(str(value or \"\"))\n\ndef clean(value):\n    return str(value or \"\").strip()\n\n\ndef allowed_attachment(filename):\n    if not filename or \".\" not in filename:\n        return False\n    ext = filename.rsplit(\".\", 1)[1].lower()\n    return ext in ALLOWED_ATTACHMENT_EXTENSIONS\n\ndef attachment_path(stored_filename):\n    base = os.path.abspath(ATTACHMENTS_DIR)\n    target = os.path.abspath(os.path.join(base, stored_filename))\n    if not target.startswith(base + os.sep):\n        raise ValueError(\"Invalid attachment path\")\n    return target\n\n\ndef sla_due_for_priority(priority):\n    return datetime.now() + timedelta(hours=SLA_HOURS.get(priority, 48))\n\ndef sla_state(sla_due_at, status):\n    if not sla_due_at:\n        return \"none\"\n    if status in (\"Rozwiązane\", \"Zamknięte\"):\n        return \"done\"\n    now = datetime.now()\n    if sla_due_at < now:\n        return \"overdue\"\n    if sla_due_at - now <= timedelta(hours=4):\n        return \"warning\"\n    return \"ok\"\n\ndef event_message(actor_name, text):\n    return f\"{actor_name}: {text}\"\n\ndef add_ticket_event(cur, ticket_id, user, event_type, message):\n    cur.execute(\"\"\"\n        INSERT INTO ticket_events (ticket_id, actor_email, actor_name, event_type, message)\n        VALUES (%s, %s, %s, %s, %s)\n    \"\"\", (\n        ticket_id,\n        user.get(\"email\") if user else None,\n        user.get(\"name\") if user else \"System\",\n        event_type,\n        message,\n    ))\n\ndef log_audit(cur, user, action, target_type, target_id=None, details=None):\n    if isinstance(details, (dict, list)):\n        details = json.dumps(details, ensure_ascii=False)\n    elif details is None:\n        details = \"\"\n    else:\n        details = str(details)\n\n    cur.execute(\"\"\"\n        INSERT INTO audit_log (\n            actor_email,\n            actor_name,\n            action,\n            target_type,\n            target_id,\n            details\n        )\n        VALUES (%s, %s, %s, %s, %s, %s)\n    \"\"\", (\n        user.get(\"email\") if user else None,\n        user.get(\"name\") if user else \"System\",\n        action,\n        target_type,\n        str(target_id) if target_id is not None else None,\n        details,\n    ))\n\ndef get_sid_from_request():\n    return request.headers.get(\"X-Helpdesk-Session\", \"\").strip()\n\ndef get_user_by_sid(sid):\n    if not sid:\n        return None\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT u.first_name, u.last_name, u.email, u.department, u.role, u.roles\n        FROM user_sessions s\n        JOIN users u ON u.email = s.user_email\n        WHERE s.sid = %s\n    \"\"\", (sid,))\n    row = cur.fetchone()\n    if row:\n        cur.execute(\"UPDATE user_sessions SET last_seen = NOW() WHERE sid = %s\", (sid,))\n        conn.commit()\n    cur.close()\n    conn.close()\n    if not row:\n        return None\n    return {\n        \"first_name\": row[0],\n        \"last_name\": row[1],\n        \"name\": f\"{row[0]} {row[1]}\".strip(),\n        \"email\": row[2],\n        \"department\": row[3],\n        \"role\": row[4],\n        \"roles\": list(row[5] or [\"user\"]),\n    }\n\ndef current_user():\n    return get_user_by_sid(get_sid_from_request())\n\ndef api_login_required(fn):\n    @wraps(fn)\n    def wrapper(*args, **kwargs):\n        user = current_user()\n        if not user:\n            return jsonify({\"error\": \"unauthorized\"}), 401\n        return fn(user, *args, **kwargs)\n    return wrapper\n\ndef has_role(user, role):\n    if not user:\n        return False\n    roles = user.get(\"roles\") or []\n    if isinstance(roles, str):\n        roles = [roles]\n    return role in roles\n\ndef role_label(roles):\n    roles = roles or [\"user\"]\n    if \"admin\" in roles:\n        return \"admin\"\n    if \"operator\" in roles:\n        return \"operator\"\n    return \"user\"\n\ndef normalize_roles(raw_roles):\n    if raw_roles is None:\n        roles = [\"user\"]\n    elif isinstance(raw_roles, list):\n        roles = [clean(r) for r in raw_roles]\n    else:\n        roles = [clean(raw_roles)]\n    roles = [r for r in roles if r in VALID_ROLES]\n    if \"user\" not in roles:\n        roles.insert(0, \"user\")\n    # keep stable order\n    return [r for r in VALID_ROLES if r in roles]\n\ndef is_admin(user):\n    return has_role(user, \"admin\")\n\ndef is_operator(user):\n    return has_role(user, \"operator\")\n\ndef is_staff(user):\n    return bool(user and (is_operator(user) or is_admin(user)))\n\ndef publish_event(message, event_type=\"info\", ticket_id=None, staff_only=False):\n    global last_live_event\n    last_live_event = {\n        \"id\": str(uuid.uuid4()),\n        \"type\": event_type,\n        \"message\": message,\n        \"ticket_id\": ticket_id,\n        \"timestamp\": time.strftime(\"%Y-%m-%d %H:%M:%S\"),\n        \"staff_only\": staff_only,\n    }\n\ndef staff_notification_recipients(cur):\n    cur.execute(\"\"\"\n        SELECT email\n        FROM users\n        WHERE roles IS NOT NULL\n          AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))\n    \"\"\")\n    return {row[0] for row in cur.fetchall() if row and row[0]}\n\n\ndef ticket_notification_participants(cur, ticket_id):\n    cur.execute(\"\"\"\n        SELECT requester_email, assigned_to_email\n        FROM tickets\n        WHERE id = %s\n    \"\"\", (ticket_id,))\n    row = cur.fetchone()\n\n    if not row:\n        return None, None\n\n    requester_email, assigned_to_email = row\n    return requester_email, assigned_to_email\n\n\ndef ticket_watcher_emails(cur, ticket_id, staff_only=False):\n    if staff_only:\n        cur.execute(\"\"\"\n            SELECT tw.user_email\n            FROM ticket_watchers tw\n            JOIN users u ON lower(u.email) = lower(tw.user_email)\n            WHERE tw.ticket_id = %s\n              AND u.roles IS NOT NULL\n              AND ('operator' = ANY(u.roles) OR 'admin' = ANY(u.roles))\n        \"\"\", (ticket_id,))\n    else:\n        cur.execute(\"\"\"\n            SELECT user_email\n            FROM ticket_watchers\n            WHERE ticket_id = %s\n        \"\"\", (ticket_id,))\n    return {row[0] for row in cur.fetchall() if row and row[0]}\n\n\ndef add_ticket_watcher(cur, ticket_id, user_email, added_by_email=None):\n    if not user_email:\n        return\n    cur.execute(\"\"\"\n        INSERT INTO ticket_watchers (ticket_id, user_email, added_by_email)\n        VALUES (%s, %s, %s)\n        ON CONFLICT (ticket_id, user_email) DO NOTHING\n    \"\"\", (ticket_id, user_email, added_by_email))\n\n\ndef ticket_notification_recipients(cur, ticket_id, event_type):\n    \"\"\"Return notification recipients according to the helpdesk workflow.\n\n    Workflow:\n    - new ticket -> all operators and admins,\n    - internal note -> all operators/admins plus staff watchers,\n    - assigned ticket -> requester, assigned operator and watchers,\n    - unassigned ticket -> requester, watchers plus all operators/admins.\n    \"\"\"\n    recipients = set()\n    requester_email, assigned_to_email = ticket_notification_participants(cur, ticket_id)\n\n    if event_type == \"ticket_created\":\n        recipients.update(staff_notification_recipients(cur))\n        return recipients\n\n    if event_type == \"internal_note_added\":\n        recipients.update(staff_notification_recipients(cur))\n        recipients.update(ticket_watcher_emails(cur, ticket_id, staff_only=True))\n        return recipients\n\n    recipients.update(ticket_watcher_emails(cur, ticket_id))\n\n    if assigned_to_email:\n        if requester_email:\n            recipients.add(requester_email)\n        recipients.add(assigned_to_email)\n        return recipients\n\n    if requester_email:\n        recipients.add(requester_email)\n    recipients.update(staff_notification_recipients(cur))\n    return recipients\n\n\ndef create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=None):\n    for email in sorted({email for email in recipients if email}):\n        if actor_email and email == actor_email:\n            continue\n        cur.execute(\"\"\"\n            INSERT INTO notifications (user_email, ticket_id, type, message)\n            VALUES (%s, %s, %s, %s)\n        \"\"\", (email, ticket_id, event_type, message))\n\n\ndef create_ticket_notifications(cur, ticket_id, event_type, message, actor_email=None, staff_only=False):\n    recipients = ticket_notification_recipients(cur, ticket_id, event_type)\n    create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=actor_email)\n\n\ndef api_admin_required(fn):\n    @wraps(fn)\n    def wrapper(user, *args, **kwargs):\n        if not is_admin(user):\n            return jsonify({\"error\": \"admin required\"}), 403\n        return fn(user, *args, **kwargs)\n    return wrapper\n\ndef api_staff_required(fn):\n    @wraps(fn)\n    def wrapper(user, *args, **kwargs):\n        if not is_staff(user):\n            return jsonify({\"error\": \"operator or admin required\"}), 403\n        return fn(user, *args, **kwargs)\n    return wrapper\n\ndef public_html(body):\n    return f\"\"\"\n    <!doctype html>\n    <html lang=\"pl\">\n    <head>\n      <meta charset=\"utf-8\">\n      <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n      <title>INCoprp Helpdesk</title>\n      <style>{CSS}</style>\n    </head>\n    <body>\n      <main class=\"page\">\n        <header>\n          <div>\n            <h1>INCoprp Helpdesk</h1>\n            <p class=\"subtitle\">Centrum zgłoszeń IT dla pracowników biurowych.</p>\n          </div>\n          <div class=\"badge\">SessionStorage: <strong>per karta</strong></div>\n        </header>\n        {body}\n      </main>\n    </body>\n    </html>\n    \"\"\"\n\nCSS = \"\"\"\n  :root {\n    --bg: #0f172a;\n    --card: #111827;\n    --card2: #1f2937;\n    --text: #f8fafc;\n    --muted: #94a3b8;\n    --accent: #38bdf8;\n    --green: #22c55e;\n    --red: #ef4444;\n    --yellow: #facc15;\n    --border: rgba(148,163,184,.25);\n  }\n  * { box-sizing: border-box; }\n  body {\n    margin: 0;\n    font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n    background:\n      radial-gradient(circle at top left, rgba(56,189,248,.16), transparent 35%),\n      radial-gradient(circle at bottom right, rgba(34,197,94,.12), transparent 35%),\n      var(--bg);\n    color: var(--text);\n  }\n  a { color: inherit; }\n  .page { width: min(1220px, 94vw); margin: 0 auto; padding: 42px 0; }\n  header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 24px; }\n  h1 { margin: 0 0 8px; font-size: clamp(34px, 5vw, 56px); line-height: 1; letter-spacing: -.05em; }\n  .subtitle { margin: 0; color: var(--muted); font-size: 18px; }\n  .badge { border: 1px solid var(--border); border-radius: 999px; padding: 10px 14px; color: var(--muted); white-space: nowrap; background: rgba(15,23,42,.65); }\n  .badge strong { color: var(--green); }\n  .card { background: linear-gradient(180deg, rgba(17,24,39,.96), rgba(15,23,42,.96)); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,.25); margin-bottom: 18px; }\n  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }\n  .stat { border: 1px solid var(--border); background: rgba(31,41,55,.72); border-radius: 18px; padding: 16px; }\n  .stat .num { font-size: 32px; font-weight: 800; }\n  .stat .label { color: var(--muted); font-size: 14px; }\n  table { width: 100%; border-collapse: collapse; }\n  th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }\n  th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }\n  .pill { display: inline-block; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); color: var(--text); background: rgba(31,41,55,.72); }\n  .priority-Krytyczny { color: #fecaca; border-color: rgba(239,68,68,.45); }\n  .priority-Wysoki { color: #fde68a; border-color: rgba(250,204,21,.45); }\n  .priority-Normalny { color: #bae6fd; border-color: rgba(56,189,248,.45); }\n  .priority-Niski { color: #bbf7d0; border-color: rgba(34,197,94,.45); }\n  input, textarea, select { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 15px; }\n  textarea { min-height: 120px; resize: vertical; }\n  label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }\n  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }\n  button, .btn { display: inline-block; margin-top: 14px; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; color: white; background: linear-gradient(135deg, #0284c7, #22c55e); cursor: pointer; text-decoration: none; }\n  .btn-secondary { background: rgba(31,41,55,.9); border: 1px solid var(--border); }\n  .btn-danger { background: rgba(239,68,68,.18); border: 1px solid rgba(239,68,68,.45); color: #fecaca; }\n  .btn-small { margin-top: 0; padding: 8px 11px; border-radius: 10px; font-size: 13px; }\n  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }\n\n  .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 14px; align-items: end; }\n  .filter-field label { margin-top: 0; }\n  .filter-field select { min-height: 44px; }\n  .work-views { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 16px; }\n  .work-view-btn { border: 1px solid var(--border); background: rgba(31,41,55,.72); color: var(--text); border-radius: 999px; padding: 9px 12px; font-weight: 800; cursor: pointer; }\n  .work-view-btn:hover { border-color: rgba(56,189,248,.55); background: rgba(31,41,55,.92); }\n  .work-view-btn.active { background: linear-gradient(135deg, #0284c7, #22c55e); border-color: rgba(56,189,248,.75); color: #fff; box-shadow: 0 12px 24px rgba(0,0,0,.22); }\n  .combo { position: relative; }\n  .combo summary { list-style: none; cursor: pointer; width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 15px; min-height: 44px; }\n  .combo summary::-webkit-details-marker { display: none; }\n  .combo summary::after { content: \"▼\"; float: right; color: var(--muted); font-size: 12px; margin-top: 3px; }\n  .combo[open] summary { border-color: rgba(56,189,248,.55); box-shadow: 0 0 0 3px rgba(56,189,248,.10); }\n  .combo-menu { position: absolute; z-index: 30; left: 0; right: 0; margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: #111827; box-shadow: 0 20px 40px rgba(0,0,0,.35); max-height: 300px; overflow: auto; }\n  .combo-option { display: flex; align-items: center; gap: 8px; padding: 8px 6px; color: var(--text); border-radius: 10px; }\n  .combo-option:hover { background: rgba(31,41,55,.9); }\n  .combo-option input { width: auto; }\n  .active-filter-count { color: var(--muted); font-size: 13px; margin-top: 10px; }\n\n  .pagination {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    align-items: center;\n    justify-content: space-between;\n    margin-top: 16px;\n    padding-top: 14px;\n    border-top: 1px solid var(--border);\n  }\n  .pagination-info {\n    color: var(--muted);\n    font-size: 14px;\n    line-height: 1.5;\n  }\n  .pagination-pages {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 6px;\n    align-items: center;\n    justify-content: flex-end;\n  }\n  .pagination-btn {\n    margin-top: 0;\n    padding: 8px 11px;\n    min-width: 38px;\n    border-radius: 10px;\n    background: rgba(31,41,55,.9);\n    border: 1px solid var(--border);\n    color: var(--text);\n  }\n  .pagination-btn.active {\n    color: white;\n    border-color: rgba(56,189,248,.65);\n    background: linear-gradient(135deg, #0284c7, #22c55e);\n    box-shadow: 0 0 0 3px rgba(56,189,248,.14);\n  }\n  .pagination-btn:disabled {\n    opacity: .42;\n    cursor: not-allowed;\n  }\n  .pagination-ellipsis {\n    color: var(--muted);\n    padding: 0 4px;\n  }\n  .status-filter-btn { margin-top: 0; color: var(--muted); transition: border-color .15s ease, background .15s ease, color .15s ease, transform .15s ease; }\n  .status-filter-btn:hover { transform: translateY(-1px); border-color: rgba(56,189,248,.55); color: var(--text); }\n  .status-filter-btn.active { color: white; background: linear-gradient(135deg, #0284c7, #22c55e); border-color: rgba(56,189,248,.65); box-shadow: 0 0 0 3px rgba(56,189,248,.14); }\n  .status-filter-btn.active::before { content: \"✓ \"; }\n  .status-filter-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }\n  .status-filter-hint { margin-top:8px; color:var(--muted); font-size:13px; }\n  .status-Nowe { color:#bbf7d0; border-color:rgba(34,197,94,.55); background:rgba(34,197,94,.14); }\n  .status-Otwarte { color:#fed7aa; border-color:rgba(249,115,22,.58); background:rgba(249,115,22,.14); }\n  .status-W-trakcie { color:#bae6fd; border-color:rgba(56,189,248,.55); background:rgba(56,189,248,.14); }\n  .status-Oczekuje-na-uzytkownika { color:#fecaca; border-color:rgba(239,68,68,.58); background:rgba(239,68,68,.14); }\n  .status-Oczekuje-na-dostawce { color:#ddd6fe; border-color:rgba(168,85,247,.58); background:rgba(168,85,247,.14); }\n  .status-Rozwiazane { color:#c7d2fe; border-color:rgba(99,102,241,.55); background:rgba(99,102,241,.14); }\n  .status-Zamkniete { color:#e5e7eb; border-color:rgba(156,163,175,.55); background:rgba(156,163,175,.14); }\n .sla-badge { display: inline-block; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 800; border: 1px solid var(--border); background: rgba(31,41,55,.72); } .sla-ok { color:#bbf7d0; border-color:rgba(34,197,94,.55); background:rgba(34,197,94,.13); } .sla-warning { color:#fef08a; border-color:rgba(250,204,21,.6); background:rgba(250,204,21,.14); } .sla-overdue { color:#fecaca; border-color:rgba(239,68,68,.6); background:rgba(239,68,68,.15); } .sla-done { color:#c7d2fe; border-color:rgba(129,140,248,.55); background:rgba(129,140,248,.13); } .sla-none { color:#cbd5e1; border-color:rgba(148,163,184,.35); background:rgba(148,163,184,.10); } .ticket-title { font-weight: 800; text-decoration: none; color: var(--text); background: none; padding: 0; margin: 0; transition: color .15s ease, opacity .15s ease; }\n  .ticket-title:hover { opacity: .82; }\n  .ticket-title.status-Nowe, .ticket-heading.status-Nowe { color:#22c55e; background:transparent; border-color:transparent; }\n  .ticket-title.status-Otwarte, .ticket-heading.status-Otwarte { color:#fb923c; background:transparent; border-color:transparent; }\n  .ticket-title.status-W-trakcie, .ticket-heading.status-W-trakcie { color:#38bdf8; background:transparent; border-color:transparent; }\n  .ticket-title.status-Oczekuje-na-uzytkownika, .ticket-heading.status-Oczekuje-na-uzytkownika { color:#ef4444; background:transparent; border-color:transparent; }\n  .ticket-title.status-Oczekuje-na-dostawce, .ticket-heading.status-Oczekuje-na-dostawce { color:#a78bfa; background:transparent; border-color:transparent; }\n  .ticket-title.status-Rozwiazane, .ticket-heading.status-Rozwiazane { color:#818cf8; background:transparent; border-color:transparent; }\n  .ticket-title.status-Zamkniete, .ticket-heading.status-Zamkniete { color:#94a3b8; background:transparent; border-color:transparent; }\n  .ticket-title.status-default, .ticket-heading.status-default { color:var(--text); background:transparent; border-color:transparent; }\n  .muted { color: var(--muted); }\n  .comment { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: rgba(31,41,55,.65); margin-top: 10px; }\n  .comment.internal { border-color: rgba(250,204,21,.55); background: rgba(250,204,21,.10); }\n  .comment-type { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 800; border: 1px solid var(--border); }\n  .comment-type.public { color: #bbf7d0; border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.12); }\n  .comment-type.internal { color: #fef08a; border-color: rgba(250,204,21,.55); background: rgba(250,204,21,.14); }\n  .switch-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n    margin: 14px 0 4px;\n    padding: 13px 14px;\n    border: 1px solid var(--border);\n    border-radius: 16px;\n    background: rgba(31,41,55,.55);\n  }\n  .switch-row strong { display: block; color: var(--text); font-size: 14px; }\n  .switch-row small { display: block; color: var(--muted); margin-top: 3px; line-height: 1.35; }\n  .switch { position: relative; display: inline-block; width: 58px; height: 32px; flex: 0 0 auto; }\n  .switch input { opacity: 0; width: 0; height: 0; }\n  .slider {\n    position: absolute;\n    cursor: pointer;\n    inset: 0;\n    background: rgba(148,163,184,.28);\n    border: 1px solid rgba(148,163,184,.35);\n    transition: .2s;\n    border-radius: 999px;\n  }\n  .slider:before {\n    position: absolute;\n    content: \"\";\n    height: 24px;\n    width: 24px;\n    left: 3px;\n    bottom: 3px;\n    background: #f8fafc;\n    transition: .2s;\n    border-radius: 50%;\n    box-shadow: 0 6px 14px rgba(0,0,0,.28);\n  }\n  .switch input:checked + .slider {\n    background: rgba(250,204,21,.38);\n    border-color: rgba(250,204,21,.70);\n  }\n  .switch input:checked + .slider:before {\n    transform: translateX(26px);\n    background: #fef08a;\n  }\n  .attachment-list { display: grid; gap: 10px; margin-top: 12px; }\n  .attachment-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: rgba(31,41,55,.58); }\n  .attachment-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }\n  .attachment-upload-hint { color: var(--muted); font-size: 13px; margin-top: 8px; }\n  .watcher-list { display: grid; gap: 10px; margin: 12px 0 16px; }\n  .watcher-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; background: rgba(31,41,55,.58); }\n  .watcher-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }\n  .login-box { width: min(520px, 100%); margin: 0 auto; }\n  .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }\n  .error { color: #fecaca; }\n  .success { color: #bbf7d0; }\n  .live-panel { border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; background: rgba(15,23,42,.65); color: var(--muted); min-width: 280px; }\n  .live-panel .live-row { display:flex; justify-content:space-between; gap:12px; margin:4px 0; }\n  .live-panel .live-value { color: var(--text); font-weight: 800; }\n  .live-panel .ws-connected { color: #22c55e; }\n  .live-panel .ws-disconnected { color: #ef4444; }\n  .header-actions { display:flex; flex-direction:column; gap:10px; align-items:flex-end; }\n  .notification-wrapper { position: relative; width: 100%; display: flex; justify-content: flex-end; }\n  .notification-btn { margin-top: 0; background: rgba(31,41,55,.9); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 999px; }\n  .notification-btn.has-unread { border-color: rgba(250,204,21,.65); box-shadow: 0 0 0 3px rgba(250,204,21,.12); }\n  .notification-count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: #ef4444; color: white; font-size: 12px; font-weight: 900; }\n  .notification-panel { position: absolute; top: 48px; right: 0; width: min(440px, 92vw); z-index: 60; border: 1px solid var(--border); border-radius: 18px; background: #111827; box-shadow: 0 24px 48px rgba(0,0,0,.38); padding: 14px; }\n  .notification-panel-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }\n  .notification-panel-header h3 { margin: 0; }\n  .notification-list { display: grid; gap: 8px; max-height: 360px; overflow: auto; }\n  .notification-item { display: block; text-align: left; width: 100%; margin: 0; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--border); background: rgba(31,41,55,.62); color: var(--text); }\n  .notification-item.unread { border-color: rgba(56,189,248,.55); background: rgba(56,189,248,.10); }\n  .notification-item:hover { border-color: rgba(56,189,248,.65); }\n  .notification-ticket { margin-bottom: 5px; color: #bae6fd; font-size: 13px; font-weight: 900; line-height: 1.35; }\n  .notification-message { font-weight: 800; line-height: 1.35; }\n  .notification-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }\n  .toast { position: fixed; right: 24px; bottom: 24px; z-index: 9999; min-width: 280px; max-width: 440px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(135deg, rgba(2,132,199,.96), rgba(34,197,94,.96)); color: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.35); font-weight: 700; opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }\n  .toast.show { opacity: 1; transform: translateY(0); }\n  .toast small { display: block; margin-top: 4px; opacity: .85; font-weight: 500; }\n\n  .modal-backdrop { position: fixed; inset: 0; z-index: 9998; background: rgba(2,6,23,.72); display: grid; place-items: center; padding: 18px; }\n  .modal-backdrop.hidden { display: none; }\n  .modal-card { width: min(720px, 96vw); max-height: 92vh; overflow: auto; border: 1px solid var(--border); border-radius: 22px; background: #111827; box-shadow: 0 28px 80px rgba(0,0,0,.55); padding: 22px; }\n  .modal-header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }\n  .modal-header h2 { margin: 0; }\n  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }\n  .resolution-time-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n  .resolution-box { margin: 14px 0; padding: 14px; border: 1px solid rgba(34,197,94,.35); border-radius: 16px; background: rgba(34,197,94,.08); }\n  .readonly-box { margin-top: 16px; padding: 14px; border: 1px solid rgba(148,163,184,.35); border-radius: 16px; background: rgba(148,163,184,.10); color: var(--text); }\n  .readonly-box span { color: var(--muted); }\n\n\n  .dashboard-section-title { margin: 4px 0 14px; color: var(--muted); font-size: 14px; }\n  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }\n  .dashboard-card { border: 1px solid var(--border); background: rgba(31,41,55,.65); border-radius: 18px; padding: 16px; cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease; }\n  .dashboard-card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,.55); background: rgba(31,41,55,.88); }\n  .dashboard-card.active { border-color: rgba(34,197,94,.75); background: linear-gradient(135deg, rgba(2,132,199,.30), rgba(34,197,94,.22)); box-shadow: 0 14px 28px rgba(0,0,0,.22); }\n  .dashboard-card .num { font-size: 34px; font-weight: 900; line-height: 1; }\n  .dashboard-card .label { margin-top: 7px; color: var(--muted); font-size: 14px; }\n  .dashboard-list { display: grid; gap: 9px; }\n  .dashboard-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--border); background: rgba(31,41,55,.52); border-radius: 14px; padding: 11px 12px; cursor: pointer; }\n  .dashboard-row:hover { border-color: rgba(56,189,248,.55); }\n  .dashboard-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .dashboard-row .count { font-weight: 900; color: var(--text); }\n  .dashboard-bar { grid-column: 1 / -1; height: 7px; border-radius: 999px; background: rgba(148,163,184,.18); overflow: hidden; }\n  .dashboard-bar span { display:block; height:100%; border-radius:999px; background: linear-gradient(135deg, #0284c7, #22c55e); }\n\n  .sla-calendar-grid { display: grid; gap: 14px; }\n  .sla-calendar-section { border: 1px solid var(--border); border-radius: 18px; background: rgba(31,41,55,.42); padding: 14px; }\n  .sla-calendar-section h3 { margin: 0 0 10px; display:flex; justify-content:space-between; gap:12px; align-items:center; }\n  .sla-calendar-count { color: var(--muted); font-size: 13px; font-weight: 800; }\n  .sla-calendar-list { display: grid; gap: 10px; }\n  .sla-calendar-item { width: 100%; text-align: left; margin: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: rgba(15,23,42,.62); color: var(--text); cursor: pointer; }\n  .sla-calendar-item:hover { border-color: rgba(56,189,248,.62); background: rgba(31,41,55,.88); }\n  .sla-calendar-title { font-weight: 900; line-height: 1.35; }\n  .sla-calendar-meta { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }\n  .sla-calendar-empty { color: var(--muted); margin: 0; }\n  .hidden { display: none; }\n  @media (max-width: 860px) { header, .topbar { flex-direction: column; } .grid { grid-template-columns: 1fr; } table { font-size: 14px; } }\n\"\"\"\n\nSPA_HTML = f\"\"\"\n<!doctype html>\n<html lang=\"pl\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>INCoprp Helpdesk</title>\n  <style>{CSS}</style>\n</head>\n<body>\n  <main class=\"page\">\n    <header>\n      <div>\n        <h1>INCoprp Helpdesk</h1>\n        <p class=\"subtitle\">Centrum zgłoszeń IT dla pracowników biurowych.</p>\n      </div>\n      <div class=\"header-actions\">\n        <div id=\"userBadge\" class=\"badge\">Ładowanie...</div>\n        <div class=\"notification-wrapper\">\n          <button id=\"notificationButton\" class=\"notification-btn\" onclick=\"toggleNotifications(); return false;\">\n            \U0001F514 Powiadomienia <span id=\"notificationCount\" class=\"notification-count hidden\">0</span>\n          </button>\n          <div id=\"notificationPanel\" class=\"notification-panel hidden\">\n            <div class=\"notification-panel-header\">\n              <h3>Powiadomienia</h3>\n              <button class=\"btn-secondary btn-small\" onclick=\"markAllNotificationsRead(); return false;\">Oznacz wszystkie</button>\n            </div>\n            <div id=\"notificationList\" class=\"notification-list\">\n              <p class=\"muted\">Brak powiadomień.</p>\n            </div>\n          </div>\n        </div>\n        <div id=\"livePanel\" class=\"live-panel\">\n          <div class=\"live-row\"><span>WebSocket</span><span id=\"wsStatus\" class=\"live-value ws-disconnected\">disconnected</span></div>\n          <div class=\"live-row\"><span>Aktywni</span><span id=\"wsClients\" class=\"live-value\">-</span></div>\n          <div class=\"live-row\"><span>Czas serwera</span><span id=\"wsTime\" class=\"live-value\">-</span></div>\n          <div class=\"live-row\"><span>Ostatnie zdarzenie</span><span id=\"wsEvent\" class=\"live-value\">-</span></div>\n        </div>\n      </div>\n    </header>\n    <div id=\"app\"></div>\n  </main>\n\n  <div id=\"toast\" class=\"toast\"></div>\n\n  <div id=\"closeTicketModal\" class=\"modal-backdrop hidden\">\n    <div class=\"modal-card\">\n      <div class=\"modal-header\">\n        <div>\n          <h2>Zamknięcie zgłoszenia</h2>\n          <p id=\"closeTicketModalSubtitle\" class=\"muted\">Uzupełnij podsumowanie przed zamknięciem zgłoszenia.</p>\n        </div>\n        <button class=\"btn-secondary btn-small\" onclick=\"closeCloseTicketModal(); return false;\">✕</button>\n      </div>\n      <form id=\"closeTicketForm\" enctype=\"multipart/form-data\">\n        <div class=\"resolution-time-grid\">\n          <div>\n            <label>Czas rozwiązania — godziny</label>\n            <input name=\"resolution_hours\" type=\"number\" min=\"0\" max=\"999\" value=\"0\">\n          </div>\n          <div>\n            <label>Czas rozwiązania — minuty</label>\n            <input name=\"resolution_minutes\" type=\"number\" min=\"0\" max=\"59\" value=\"0\">\n          </div>\n        </div>\n        <label>Komentarz końcowy / opis rozwiązania</label>\n        <textarea name=\"resolution_summary\" rows=\"5\" placeholder=\"Opisz, co zostało wykonane i jak rozwiązano zgłoszenie.\"></textarea>\n        <div id=\"closeCommentVisibilityBox\" class=\"switch-row\">\n          <div>\n            <strong>Notatka wewnętrzna</strong>\n            <small>Włącz, jeśli komentarz końcowy ma być widoczny tylko dla operatorów i administratorów.</small>\n          </div>\n          <label class=\"switch\">\n            <input id=\"close-comment-internal\" name=\"internal_note\" type=\"checkbox\">\n            <span class=\"slider\"></span>\n          </label>\n        </div>\n        <label>Załącznik opcjonalny</label>\n        <input name=\"file\" type=\"file\">\n        <div class=\"attachment-upload-hint\">Dozwolone: png, jpg, jpeg, gif, pdf, txt, log, csv, xlsx, docx. Maksymalnie 10 MB.</div>\n        <div class=\"modal-actions\">\n          <button type=\"button\" class=\"btn-secondary\" onclick=\"closeCloseTicketModal(); return false;\">Anuluj</button>\n          <button type=\"submit\">Zamknij zgłoszenie</button>\n        </div>\n      </form>\n    </div>\n  </div>\n\n  <div id=\"reopenTicketModal\" class=\"modal-backdrop hidden\">\n    <div class=\"modal-card\">\n      <div class=\"modal-header\">\n        <div>\n          <h2>Ponowne otwarcie zgłoszenia</h2>\n          <p id=\"reopenTicketModalSubtitle\" class=\"muted\">Podaj powód ponownego otwarcia zgłoszenia.</p>\n        </div>\n        <button class=\"btn-secondary btn-small\" onclick=\"closeReopenTicketModal(); return false;\">✕</button>\n      </div>\n      <form id=\"reopenTicketForm\">\n        <label>Powód ponownego otwarcia</label>\n        <textarea name=\"reason\" rows=\"5\" placeholder=\"Opisz, dlaczego zamknięte zgłoszenie powinno zostać otwarte ponownie.\" required></textarea>\n        <div class=\"attachment-upload-hint\">Powód zostanie zapisany w historii zgłoszenia i audycie.</div>\n        <div class=\"modal-actions\">\n          <button type=\"button\" class=\"btn-secondary\" onclick=\"closeReopenTicketModal(); return false;\">Anuluj</button>\n          <button type=\"submit\">Otwórz ponownie</button>\n        </div>\n      </form>\n    </div>\n  </div>\n\n  <script>\n    const appEl = document.getElementById(\"app\");\n    const userBadge = document.getElementById(\"userBadge\");\n    const notificationButton = document.getElementById(\"notificationButton\");\n    const notificationCount = document.getElementById(\"notificationCount\");\n    const notificationPanel = document.getElementById(\"notificationPanel\");\n    const notificationList = document.getElementById(\"notificationList\");\n    const wsStatus = document.getElementById(\"wsStatus\");\n    const wsClients = document.getElementById(\"wsClients\");\n    const wsTime = document.getElementById(\"wsTime\");\n    const wsEvent = document.getElementById(\"wsEvent\");\n    let liveSocket = null;\n    let liveReconnectTimer = null;\n    let lastLiveEventId = null;\n    let currentView = {{ name: \"home\", ticketId: null }};\n    let suppressNextLiveRefresh = false;\n    let closeTicketId = null;\n    let reopenTicketId = null;\n\n    function getSid() {{ return sessionStorage.getItem(\"helpdesk_sid\") || \"\"; }}\n    function setSid(sid) {{ sessionStorage.setItem(\"helpdesk_sid\", sid); }}\n    function clearSid() {{ sessionStorage.removeItem(\"helpdesk_sid\"); }}\n\n    async function api(path, options = {{}}) {{\n      const headers = options.headers || {{}};\n      headers[\"X-Helpdesk-Session\"] = getSid();\n      if (options.body && !headers[\"Content-Type\"]) headers[\"Content-Type\"] = \"application/json\";\n      const res = await fetch(path, {{ ...options, headers }});\n      if (res.status === 401) {{\n        clearSid();\n        window.location.href = \"/login\";\n        return null;\n      }}\n      return res;\n    }}\n\n    function esc(value) {{\n      return String(value ?? \"\").replace(/[&<>\"']/g, ch => ({{\n        \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#039;\"\n      }}[ch]));\n    }}\n\n\n\n\n    function formatBytes(bytes) {{\n      const value = Number(bytes || 0);\n      if (value < 1024) return value + \" B\";\n      if (value < 1024 * 1024) return (value / 1024).toFixed(1) + \" KB\";\n      return (value / (1024 * 1024)).toFixed(1) + \" MB\";\n    }}\n\n    function formatResolutionMinutes(totalMinutes) {{\n      const value = Number(totalMinutes || 0);\n      const hours = Math.floor(value / 60);\n      const minutes = value % 60;\n      if (hours && minutes) return `${{hours}}h ${{minutes}}m`;\n      if (hours) return `${{hours}}h`;\n      return `${{minutes}}m`;\n    }}\n\n    function openCloseTicketModal(ticketId) {{\n      closeTicketId = ticketId;\n      const modal = document.getElementById(\"closeTicketModal\");\n      const subtitle = document.getElementById(\"closeTicketModalSubtitle\");\n      const form = document.getElementById(\"closeTicketForm\");\n      if (form) form.reset();\n      if (subtitle) subtitle.textContent = \"Zamknięcie zgłoszenia #\" + ticketId;\n      if (modal) modal.classList.remove(\"hidden\");\n    }}\n\n    function closeCloseTicketModal() {{\n      closeTicketId = null;\n      const modal = document.getElementById(\"closeTicketModal\");\n      if (modal) modal.classList.add(\"hidden\");\n    }}\n\n    function openReopenTicketModal(ticketId) {{\n      reopenTicketId = ticketId;\n      const modal = document.getElementById(\"reopenTicketModal\");\n      const subtitle = document.getElementById(\"reopenTicketModalSubtitle\");\n      const form = document.getElementById(\"reopenTicketForm\");\n      if (form) form.reset();\n      if (subtitle) subtitle.textContent = \"Ponowne otwarcie zgłoszenia #\" + ticketId;\n      if (modal) modal.classList.remove(\"hidden\");\n    }}\n\n    function closeReopenTicketModal() {{\n      reopenTicketId = null;\n      const modal = document.getElementById(\"reopenTicketModal\");\n      if (modal) modal.classList.add(\"hidden\");\n    }}\n\n    async function downloadAttachment(id, filename) {{\n      const res = await fetch(`/api/attachments/${{id}}/download`, {{\n        headers: {{ \"X-Helpdesk-Session\": getSid() }}\n      }});\n      if (res.status === 401) {{\n        clearSid();\n        window.location.href = \"/login\";\n        return;\n      }}\n      if (!res.ok) {{\n        alert(\"Nie udało się pobrać załącznika.\");\n        return;\n      }}\n      const blob = await res.blob();\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement(\"a\");\n      a.href = url;\n      a.download = filename || \"attachment\";\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      URL.revokeObjectURL(url);\n    }}\n\n    function showToast(message, details = \"\") {{\n      const toast = document.getElementById(\"toast\");\n      if (!toast) return;\n\n      const small = details ? \"<small>\" + esc(details) + \"</small>\" : \"\";\n      toast.innerHTML = \"<div>\" + esc(message) + \"</div>\" + small;\n\n      toast.classList.add(\"show\");\n\n      clearTimeout(window.__helpdeskToastTimer);\n      window.__helpdeskToastTimer = setTimeout(() => {{\n        toast.classList.remove(\"show\");\n      }}, 4200);\n    }}\n\n    function notificationTypeLabel(type) {{\n      const map = {{\n        ticket_created: \"Nowe zgłoszenie\",\n        status_changed: \"Zmiana statusu\",\n        comment_added: \"Komentarz\",\n        internal_note_added: \"Notatka wewnętrzna\",\n        assignment_changed: \"Przypisanie\",\n        attachment_added: \"Załącznik\",\n        ticket_link_changed: \"Powiązanie zgłoszeń\"\n      }};\n      return map[type] || \"Powiadomienie\";\n    }}\n\n    async function loadNotifications() {{\n      if (!getSid()) return;\n      const res = await api(\"/api/notifications\");\n      if (!res || !res.ok) return;\n      const data = await res.json();\n      const unread = Number(data.unread_count || 0);\n\n      notificationCount.textContent = unread;\n      notificationCount.classList.toggle(\"hidden\", unread <= 0);\n      notificationButton.classList.toggle(\"has-unread\", unread > 0);\n\n      const items = data.notifications || [];\n      if (!items.length) {{\n        notificationList.innerHTML = `<p class=\"muted\">Brak powiadomień.</p>`;\n        return;\n      }}\n\n      notificationList.innerHTML = items.map(n => `\n        <button class=\"notification-item ${{n.is_read ? \"\" : \"unread\"}}\" onclick=\"openNotification(${{n.id}}, ${{n.ticket_id || \"null\"}}); return false;\">\n          ${{n.ticket_id ? `<div class=\"notification-ticket\">#${{n.ticket_id}} · ${{esc(n.ticket_title || \"Bez tytułu\")}}</div>` : \"\"}}\n          <div class=\"notification-message\">${{esc(n.message)}}</div>\n          <div class=\"notification-meta\">${{esc(notificationTypeLabel(n.type))}} · ${{esc(n.created_at)}}${{n.is_read ? \"\" : \" · nieprzeczytane\"}}</div>\n        </button>\n      `).join(\"\");\n    }}\n\n    function toggleNotifications() {{\n      notificationPanel.classList.toggle(\"hidden\");\n      if (!notificationPanel.classList.contains(\"hidden\")) loadNotifications();\n    }}\n\n    async function openNotification(id, ticketId) {{\n      await api(`/api/notifications/${{id}}/read`, {{ method: \"POST\" }});\n      await loadNotifications();\n      notificationPanel.classList.add(\"hidden\");\n      if (ticketId) {{\n        await renderTicket(ticketId);\n      }}\n    }}\n\n    async function markAllNotificationsRead() {{\n      await api(\"/api/notifications/read-all\", {{ method: \"POST\" }});\n      await loadNotifications();\n    }}\n\n    function priorityClass(priority) {{ return \"priority-\" + String(priority || \"\").replaceAll(\" \", \"-\"); }}\n\n    function hasRole(user, role) {{\n      return Array.isArray(user?.roles) && user.roles.includes(role);\n    }}\n    function isAdmin(user) {{ return hasRole(user, \"admin\"); }}\n    function isOperator(user) {{ return hasRole(user, \"operator\"); }}\n    function canWorkTickets(user) {{\n      return !!(user && (isOperator(user) || isAdmin(user)));\n    }}\n    function roleBadges(roles) {{\n      const list = Array.isArray(roles) && roles.length ? roles : [\"user\"];\n      return list.map(r => `<span class=\"pill\">${{esc(r)}}</span>`).join(\" \");\n    }}\n\n    function slaClass(state) {{\n      const map = {{\n        \"ok\": \"sla-ok\",\n        \"warning\": \"sla-warning\",\n        \"overdue\": \"sla-overdue\",\n        \"done\": \"sla-done\",\n        \"none\": \"sla-none\"\n      }};\n      return map[state] || \"sla-none\";\n    }}\n\n    function slaLabel(state) {{\n      const map = {{\n        \"ok\": \"SLA OK\",\n        \"warning\": \"Blisko SLA\",\n        \"overdue\": \"SLA przekroczone\",\n        \"done\": \"Zakończone\",\n        \"none\": \"Brak SLA\"\n      }};\n      return map[state] || \"Brak SLA\";\n    }}\n\n    function statusClass(status) {{\n      return \"status-\" + String(status || \"\")\n        .normalize(\"NFD\")\n        .replace(/[\\u0300-\\u036f]/g, \"\")\n        .replaceAll(\"ł\", \"l\")\n        .replaceAll(\"Ł\", \"L\")\n        .replace(/[^a-zA-Z0-9]+/g, \"-\")\n        .replace(/^-|-$/g, \"\");\n    }}\n    function subcategoriesForCategory(meta, category) {{\n      const all = meta?.subcategories || {{}};\n      return all[category] || all[\"Inne\"] || [\"Inne\"];\n    }}\n\n    function updateSubcategorySelect(meta) {{\n      const categorySelect = document.getElementById(\"new-ticket-category\");\n      const subcategorySelect = document.getElementById(\"new-ticket-subcategory\");\n      if (!categorySelect || !subcategorySelect) return;\n      const values = subcategoriesForCategory(meta, categorySelect.value);\n      subcategorySelect.innerHTML = values.map(x => `<option>${{esc(x)}}</option>`).join(\"\");\n    }}\n\n    function setWsStatus(text, connected) {{\n      wsStatus.textContent = text;\n      wsStatus.className = connected ? \"live-value ws-connected\" : \"live-value ws-disconnected\";\n    }}\n\n    function connectLive() {{\n      const sid = getSid();\n      if (!sid) return;\n      if (liveSocket && (liveSocket.readyState === WebSocket.OPEN || liveSocket.readyState === WebSocket.CONNECTING)) return;\n\n      const scheme = window.location.protocol === \"https:\" ? \"wss\" : \"ws\";\n      liveSocket = new WebSocket(`${{scheme}}://${{window.location.host}}/ws`);\n      setWsStatus(\"connecting\", false);\n\n      liveSocket.onopen = () => {{\n        setWsStatus(\"connected\", true);\n        liveSocket.send(JSON.stringify({{ type: \"auth\", sid }}));\n      }};\n\n      liveSocket.onmessage = (event) => {{\n        const data = JSON.parse(event.data);\n        handleLivePayload(data);\n      }};\n\n      liveSocket.onclose = () => {{\n        setWsStatus(\"disconnected\", false);\n        if (getSid()) {{\n          clearTimeout(liveReconnectTimer);\n          liveReconnectTimer = setTimeout(connectLive, 2000);\n        }}\n      }};\n\n      liveSocket.onerror = () => {{\n        try {{ liveSocket.close(); }} catch (e) {{}}\n      }};\n    }}\n\n    async function handleLivePayload(data) {{\n      wsClients.textContent = data.active_clients ?? \"-\";\n      wsTime.textContent = data.server_time ?? \"-\";\n\n      const liveEvent = data.event || null;\n      wsEvent.textContent = liveEvent?.message || data.message || \"-\";\n\n      if (!liveEvent || !liveEvent.id || liveEvent.id === lastLiveEventId) return;\n      lastLiveEventId = liveEvent.id;\n\n      await loadNotifications();\n\n      if (![\"ticket_created\", \"status_changed\", \"comment_added\", \"internal_note_added\", \"assignment_changed\", \"attachment_added\", \"watcher_changed\", \"ticket_link_changed\"].includes(liveEvent.type)) return;\n\n      if (liveEvent.type === \"status_changed\" && !suppressNextLiveRefresh) {{\n        showToast(\n          \"Zmieniono status zgłoszenia #\" + liveEvent.ticket_id,\n          liveEvent.message || \"\"\n        );\n      }}\n\n      if (liveEvent.type === \"internal_note_added\" && !suppressNextLiveRefresh) {{\n        showToast(\n          \"Dodano notatkę wewnętrzną do zgłoszenia #\" + liveEvent.ticket_id,\n          liveEvent.message || \"\"\n        );\n      }}\n\n      if (suppressNextLiveRefresh) {{\n        suppressNextLiveRefresh = false;\n        return;\n      }}\n\n      if (currentView.name === \"ticket\" && Number(currentView.ticketId) === Number(liveEvent.ticket_id)) {{\n        await renderTicket(liveEvent.ticket_id, true);\n        return;\n      }}\n\n      if (currentView.name === \"home\") {{\n        await renderHome(loadStatusFilters(), true);\n      }}\n\n      if (currentView.name === \"sla-calendar\") {{\n        await renderSlaCalendar();\n      }}\n    }}\n\n    function disconnectLive() {{\n      clearTimeout(liveReconnectTimer);\n      if (liveSocket) {{\n        try {{ liveSocket.close(); }} catch (e) {{}}\n      }}\n      liveSocket = null;\n      setWsStatus(\"disconnected\", false);\n      wsClients.textContent = \"-\";\n      wsTime.textContent = \"-\";\n      wsEvent.textContent = \"-\";\n    }}\n\n    function loadStatusFilters() {{\n      try {{ return JSON.parse(sessionStorage.getItem(\"helpdesk_status_filters\") || \"[]\"); }}\n      catch {{ return []; }}\n    }}\n    function saveStatusFilters(filters) {{\n      sessionStorage.setItem(\"helpdesk_status_filters\", JSON.stringify(filters));\n    }}\n    function loadAssignedFilter(user = null) {{\n      const stored = sessionStorage.getItem(\"helpdesk_assigned_filter\");\n      if (stored) return stored;\n      if (user && canWorkTickets(user) && isOperator(user)) return \"me\";\n      if (user && canWorkTickets(user)) return \"all\";\n      return \"all\";\n    }}\n    function saveAssignedFilter(value) {{ sessionStorage.setItem(\"helpdesk_assigned_filter\", value || \"all\"); }}\n    function loadPriorityFilter() {{ return sessionStorage.getItem(\"helpdesk_priority_filter\") || \"all\"; }}\n    function savePriorityFilter(value) {{ sessionStorage.setItem(\"helpdesk_priority_filter\", value || \"all\"); }}\n    function loadSlaFilter() {{ return sessionStorage.getItem(\"helpdesk_sla_filter\") || \"all\"; }}\n    function saveSlaFilter(value) {{ sessionStorage.setItem(\"helpdesk_sla_filter\", value || \"all\"); }}\n    function loadTicketSearch() {{ return sessionStorage.getItem(\"helpdesk_ticket_search\") || \"\"; }}\n    function saveTicketSearch(value) {{ sessionStorage.setItem(\"helpdesk_ticket_search\", value || \"\"); }}\n    function loadTicketSort() {{ return sessionStorage.getItem(\"helpdesk_ticket_sort\") || \"created_at\"; }}\n    function saveTicketSort(value) {{ sessionStorage.setItem(\"helpdesk_ticket_sort\", value || \"created_at\"); }}\n    function loadTicketOrder() {{ return sessionStorage.getItem(\"helpdesk_ticket_order\") || \"desc\"; }}\n    function saveTicketOrder(value) {{ sessionStorage.setItem(\"helpdesk_ticket_order\", value || \"desc\"); }}\n    function loadTicketPage() {{ return Number(sessionStorage.getItem(\"helpdesk_ticket_page\") || \"1\") || 1; }}\n    function saveTicketPage(value) {{ sessionStorage.setItem(\"helpdesk_ticket_page\", String(Math.max(1, Number(value) || 1))); }}\n    function loadTicketPageSize() {{ return Number(sessionStorage.getItem(\"helpdesk_ticket_page_size\") || \"10\") || 10; }}\n    function saveTicketPageSize(value) {{ sessionStorage.setItem(\"helpdesk_ticket_page_size\", String(Number(value) || 10)); }}\n    function resetTicketPage() {{ saveTicketPage(1); }}\n\n    function toggleStatusFilter(status) {{\n      const filters = loadStatusFilters();\n      const next = filters.includes(status) ? filters.filter(s => s !== status) : filters.concat([status]);\n      saveStatusFilters(next);\n      resetTicketPage();\n      renderHome(next);\n    }}\n    function clearStatusFilters() {{\n      saveStatusFilters([]);\n      resetTicketPage();\n      renderHome([]);\n    }}\n    function setAssignedFilter(value) {{ saveAssignedFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setPriorityFilter(value) {{ savePriorityFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setSlaFilter(value) {{ saveSlaFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function applyTicketSearch(event) {{\n      if (event) event.preventDefault();\n      const input = document.getElementById(\"ticket-search-input\");\n      saveTicketSearch(input ? input.value.trim() : \"\");\n      resetTicketPage();\n      renderHome(loadStatusFilters());\n    }}\n    function setTicketSort(value) {{ saveTicketSort(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setTicketOrder(value) {{ saveTicketOrder(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function setTicketPageSize(value) {{ saveTicketPageSize(value); resetTicketPage(); renderHome(loadStatusFilters()); }}\n    function goTicketPage(page) {{ saveTicketPage(page); renderHome(loadStatusFilters()); }}\n\n    function buildPaginationButtons(pagination) {{\n      const page = Number(pagination.page || 1);\n      const totalPages = Number(pagination.total_pages || 1);\n      const buttons = [];\n\n      function addButton(label, targetPage, disabled = false, active = false) {{\n        buttons.push(`\n          <button\n            class=\"pagination-btn ${{active ? \"active\" : \"\"}}\"\n            ${{disabled ? \"disabled\" : \"\"}}\n            onclick=\"goTicketPage(${{targetPage}})\"\n          >${{label}}</button>\n        `);\n      }}\n\n      addButton(\"«\", 1, page <= 1);\n      addButton(\"‹\", Math.max(1, page - 1), page <= 1);\n\n      const candidates = [1, totalPages, page - 2, page - 1, page, page + 1, page + 2]\n        .filter(p => p >= 1 && p <= totalPages);\n      const pages = [...new Set(candidates)].sort((a, b) => a - b);\n\n      let previous = 0;\n      for (const p of pages) {{\n        if (previous && p - previous > 1) {{\n          buttons.push(`<span class=\"pagination-ellipsis\">…</span>`);\n        }}\n        addButton(String(p), p, false, p === page);\n        previous = p;\n      }}\n\n      addButton(\"›\", Math.min(totalPages, page + 1), page >= totalPages);\n      addButton(\"»\", totalPages, page >= totalPages);\n\n      return buttons.join(\"\");\n    }}\n    function clearAllFilters() {{\n      saveStatusFilters([]);\n      savePriorityFilter(\"all\");\n      saveSlaFilter(\"all\");\n      saveTicketSearch(\"\");\n      saveTicketSort(\"created_at\");\n      saveTicketOrder(\"desc\");\n      saveTicketPageSize(10);\n      saveTicketPage(1);\n      sessionStorage.removeItem(\"helpdesk_assigned_filter\");\n      renderHome([]);\n    }}\n\n    function applyWorkView(view) {{\n      saveStatusFilters([]);\n      savePriorityFilter(\"all\");\n      saveSlaFilter(\"all\");\n      saveTicketSearch(\"\");\n      resetTicketPage();\n\n      if (view === \"queue\") {{\n        saveAssignedFilter(\"me\");\n      }} else if (view === \"unassigned\") {{\n        saveAssignedFilter(\"unassigned\");\n      }} else if (view === \"new\") {{\n        saveAssignedFilter(\"all\");\n        saveStatusFilters([\"Nowe\"]);\n      }} else if (view === \"overdue\") {{\n        saveAssignedFilter(\"all\");\n        saveSlaFilter(\"overdue\");\n      }} else if (view === \"waiting_user\") {{\n        saveAssignedFilter(\"all\");\n        saveStatusFilters([\"Oczekuje na użytkownika\"]);\n      }} else {{\n        saveAssignedFilter(\"all\");\n      }}\n\n      renderHome(loadStatusFilters());\n    }}\n\n    function detectWorkView(me, filters, assignedFilter, priorityFilter, slaFilter, searchQuery) {{\n      if (!canWorkTickets(me)) return \"\";\n      const statusKey = (filters || []).join(\"|\");\n      const noPriority = priorityFilter === \"all\";\n      const noSearch = !searchQuery;\n\n      if (assignedFilter === \"me\" && !statusKey && noPriority && slaFilter === \"all\" && noSearch) return \"queue\";\n      if (assignedFilter === \"unassigned\" && !statusKey && noPriority && slaFilter === \"all\" && noSearch) return \"unassigned\";\n      if (assignedFilter === \"all\" && statusKey === \"Nowe\" && noPriority && slaFilter === \"all\" && noSearch) return \"new\";\n      if (assignedFilter === \"all\" && !statusKey && noPriority && slaFilter === \"overdue\" && noSearch) return \"overdue\";\n      if (assignedFilter === \"all\" && statusKey === \"Oczekuje na użytkownika\" && noPriority && slaFilter === \"all\" && noSearch) return \"waiting_user\";\n      if (assignedFilter === \"all\" && !statusKey && noPriority && slaFilter === \"all\" && noSearch) return \"all\";\n\n      return \"\";\n    }}\n\n    function workViewButton(view, label, activeView) {{\n      return `<button type=\"button\" class=\"work-view-btn ${{activeView === view ? \"active\" : \"\"}}\" onclick=\"applyWorkView('${{view}}')\">${{label}}</button>`;\n    }}\n\n    function renderWorkViews(me, filters, assignedFilter, priorityFilter, slaFilter, searchQuery) {{\n      if (!canWorkTickets(me)) return \"\";\n      const activeView = detectWorkView(me, filters, assignedFilter, priorityFilter, slaFilter, searchQuery);\n\n      return `\n        <div class=\"work-views\">\n          ${{workViewButton(\"queue\", \"Moja kolejka\", activeView)}}\n          ${{workViewButton(\"unassigned\", \"Nieprzypisane\", activeView)}}\n          ${{workViewButton(\"new\", \"Nowe\", activeView)}}\n          ${{workViewButton(\"overdue\", \"SLA przekroczone\", activeView)}}\n          ${{workViewButton(\"waiting_user\", \"Oczekuje na użytkownika\", activeView)}}\n          ${{workViewButton(\"all\", \"Wszystkie\", activeView)}}\n        </div>\n      `;\n    }}\n\n    function statusFilterLabel(filters) {{\n      if (!filters || !filters.length) return \"Wszystkie statusy\";\n      if (filters.length === 1) return filters[0];\n      return `${{filters.length}} statusy: ${{filters.join(\", \")}}`;\n    }}\n    function assignedFilterLabel(value, operators) {{\n      if (value === \"me\") return \"Moje zgłoszenia\";\n      if (value === \"all\") return \"Wszystkie\";\n      if (value === \"unassigned\") return \"Nieprzypisane\";\n      const op = (operators || []).find(o => String(o.email).toLowerCase() === String(value).toLowerCase());\n      return op ? op.name : value;\n    }}\n    function slaFilterLabel(value) {{\n      const map = {{ all: \"Wszystkie SLA\", ok: \"OK\", warning: \"Blisko terminu\", overdue: \"Przekroczone\", done: \"Zakończone\", none: \"Brak SLA\" }};\n      return map[value] || \"Wszystkie SLA\";\n    }}\n\n    async function loadMe() {{\n      const res = await api(\"/api/me\");\n      if (!res) return null;\n      const data = await res.json();\n      const dashboardLink = canWorkTickets(data) ? ` · <a href=\"#\" onclick=\"renderDashboard();return false;\">Dashboard</a> · <a href=\"#\" onclick=\"renderSlaCalendar();return false;\">Kalendarz SLA</a>` : \"\";\n      const adminLink = isAdmin(data) ? ` · <a href=\"#\" onclick=\"renderAdminUsers();return false;\">Użytkownicy</a> · <a href=\"#\" onclick=\"renderAudit();return false;\">Audyt</a>` : \"\";\n      userBadge.innerHTML = `Zalogowany: <strong>${{esc(data.name)}}</strong> · ${{esc(data.department)}} · <a href=\"#\" onclick=\"renderProfile();return false;\">Profil</a>${{dashboardLink}}${{adminLink}} · <a href=\"#\" onclick=\"logout();return false;\">Wyloguj</a>`;\n      connectLive();\n      await loadNotifications();\n      return data;\n    }}\n\n    async function logout() {{\n      await api(\"/api/logout\", {{ method: \"POST\" }});\n      clearSid();\n      disconnectLive();\n      notificationPanel.classList.add(\"hidden\");\n      notificationCount.classList.add(\"hidden\");\n      window.location.href = \"/login\";\n    }}\n\n\n    function dashboardPercent(count, total) {{\n      const c = Number(count || 0);\n      const t = Math.max(1, Number(total || 0));\n      return Math.min(100, Math.round((c / t) * 100));\n    }}\n\n    function dashboardRow(item, total, kind) {{\n      const label = item.label || \"Brak danych\";\n      const value = item.value || item.label || \"\";\n      const count = Number(item.count || 0);\n      return `\n        <div class=\"dashboard-row\" onclick=\"applyDashboardFilter('${{kind}}', '${{encodeURIComponent(value)}}')\">\n          <strong>${{esc(label)}}</strong>\n          <span class=\"count\">${{count}}</span>\n          <div class=\"dashboard-bar\"><span style=\"width:${{dashboardPercent(count, total)}}%\"></span></div>\n        </div>\n      `;\n    }}\n\n    function dashboardList(title, items, total, kind) {{\n      const rows = (items || []).length\n        ? items.map(item => dashboardRow(item, total, kind)).join(\"\")\n        : `<p class=\"muted\">Brak danych.</p>`;\n\n      return `\n        <section class=\"card\">\n          <h3>${{esc(title)}}</h3>\n          <div class=\"dashboard-list\">${{rows}}</div>\n        </section>\n      `;\n    }}\n\n    function applyDashboardFilter(kind, encodedValue) {{\n      const value = decodeURIComponent(encodedValue || \"\");\n      saveStatusFilters([]);\n      saveAssignedFilter(\"all\");\n      savePriorityFilter(\"all\");\n      saveSlaFilter(\"all\");\n      saveTicketSearch(\"\");\n      resetTicketPage();\n\n      if (kind === \"status\") {{\n        saveStatusFilters([value]);\n      }} else if (kind === \"priority\") {{\n        savePriorityFilter(value);\n      }} else if (kind === \"sla\") {{\n        saveSlaFilter(value);\n      }} else if (kind === \"operator\") {{\n        saveAssignedFilter(value === \"unassigned\" ? \"unassigned\" : value);\n      }} else if (kind === \"category\" || kind === \"subcategory\" || kind === \"department\") {{\n        saveTicketSearch(value);\n      }} else if (kind === \"unassigned\") {{\n        saveAssignedFilter(\"unassigned\");\n      }} else if (kind === \"overdue\") {{\n        saveSlaFilter(\"overdue\");\n      }} else if (kind === \"new\") {{\n        saveStatusFilters([\"Nowe\"]);\n      }} else if (kind === \"progress\") {{\n        saveStatusFilters([\"W trakcie\"]);\n      }}\n      renderHome(loadStatusFilters());\n    }}\n\n    async function renderDashboard() {{\n      currentView = {{ name: \"dashboard\", ticketId: null }};\n      const me = await loadMe();\n      if (!me) return;\n      if (!canWorkTickets(me)) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Brak dostępu</h2><p class=\"muted\">Dashboard jest dostępny dla operatorów i administratorów.</p></section>`;\n        return;\n      }}\n\n      const res = await api(\"/api/dashboard\");\n      if (!res) return;\n      const data = await res.json();\n      if (!res.ok) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Nie udało się pobrać dashboardu</h2><p class=\"error\">${{esc(data.error || \"Nieznany błąd\")}}</p></section>`;\n        return;\n      }}\n\n      const summary = data.summary || {{}};\n      const total = Number(summary.total || 0);\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderHome()\">← Lista zgłoszeń</button>\n          <h2>Dashboard Helpdesk</h2>\n          <p class=\"dashboard-section-title\">Raport operacyjny dla operatorów i administratorów. Kliknij kafelek lub wiersz, aby przejść do listy zgłoszeń z odpowiednim filtrem.</p>\n        </section>\n\n        <section class=\"dashboard-grid\">\n          <div class=\"dashboard-card\" onclick=\"applyDashboardFilter('all','')\">\n            <div class=\"num\">${{summary.total || 0}}</div>\n            <div class=\"label\">Wszystkie zgłoszenia</div>\n          </div>\n          <div class=\"dashboard-card\" onclick=\"applyDashboardFilter('new','Nowe')\">\n            <div class=\"num\">${{summary.new || 0}}</div>\n            <div class=\"label\">Nowe</div>\n          </div>\n          <div class=\"dashboard-card\" onclick=\"applyDashboardFilter('progress','W trakcie')\">\n            <div class=\"num\">${{summary.in_progress || 0}}</div>\n            <div class=\"label\">W trakcie</div>\n          </div>\n          <div class=\"dashboard-card\" onclick=\"applyDashboardFilter('overdue','overdue')\">\n            <div class=\"num\">${{summary.overdue_sla || 0}}</div>\n            <div class=\"label\">Przekroczone SLA</div>\n          </div>\n          <div class=\"dashboard-card\" onclick=\"applyDashboardFilter('unassigned','unassigned')\">\n            <div class=\"num\">${{summary.unassigned || 0}}</div>\n            <div class=\"label\">Nieprzypisane</div>\n          </div>\n        </section>\n\n        <div class=\"grid\">\n          ${{dashboardList(\"Według statusu\", data.by_status || [], total, \"status\")}}\n          ${{dashboardList(\"Według priorytetu\", data.by_priority || [], total, \"priority\")}}\n        </div>\n\n        <div class=\"grid\">\n          ${{dashboardList(\"Według SLA\", (data.by_sla || []).map(x => ({{...x, label: slaLabel(x.value)}})), total, \"sla\")}}\n          ${{dashboardList(\"Według operatora\", data.by_operator || [], total, \"operator\")}}\n        </div>\n\n        <div class=\"grid\">\n          ${{dashboardList(\"Według kategorii\", data.by_category || [], total, \"category\")}}\n          ${{dashboardList(\"Według podkategorii\", data.by_subcategory || [], total, \"subcategory\")}}\n          ${{dashboardList(\"Według działu\", data.by_department || [], total, \"department\")}}\n        </div>\n      `;\n    }}\n\n\n    function slaCalendarItem(t) {{\n      const assigned = t.assigned_to_name || \"Nieprzypisane\";\n      const due = t.sla_due_at || \"-\";\n      return `\n        <button class=\"sla-calendar-item\" onclick=\"renderTicket(${{Number(t.id)}}); return false;\">\n          <div class=\"sla-calendar-title\">\n            <span class=\"ticket-title ${{statusClass(t.status)}}\">#${{t.id}} · ${{esc(t.title)}}</span>\n          </div>\n          <div class=\"sla-calendar-meta\">\n            <span class=\"sla-badge ${{slaClass(t.sla_state)}}\">${{slaLabel(t.sla_state)}}</span>\n            <span class=\"pill priority-${{esc(t.priority)}}\">${{esc(t.priority)}}</span>\n            <span class=\"pill\">${{esc(t.status)}}</span>\n            <br>\n            SLA: <strong>${{esc(due)}}</strong> · Operator: ${{esc(assigned)}} · Zgłaszający: ${{esc(t.requester_name || \"-\")}}\n            <br>\n            ${{esc(t.category || \"-\")}} / ${{esc(t.subcategory || \"Inne\")}}\n          </div>\n        </button>\n      `;\n    }}\n\n    function slaCalendarSection(title, items) {{\n      const rows = (items || []).length\n        ? items.map(slaCalendarItem).join(\"\")\n        : `<p class=\"sla-calendar-empty\">Brak zgłoszeń w tej sekcji.</p>`;\n\n      return `\n        <section class=\"sla-calendar-section\">\n          <h3>${{esc(title)}} <span class=\"sla-calendar-count\">${{(items || []).length}}</span></h3>\n          <div class=\"sla-calendar-list\">${{rows}}</div>\n        </section>\n      `;\n    }}\n\n    async function renderSlaCalendar(selectedSection = \"overdue\") {{\n      currentView = {{ name: \"sla-calendar\", ticketId: null }};\n      const me = await loadMe();\n      if (!me) return;\n      if (!canWorkTickets(me)) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Brak dostępu</h2><p class=\"muted\">Kalendarz SLA jest dostępny dla operatorów i administratorów.</p></section>`;\n        return;\n      }}\n\n      const res = await api(\"/api/sla-calendar\");\n      if (!res) return;\n      const data = await res.json();\n\n      if (!res.ok) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Nie udało się pobrać kalendarza SLA</h2><p class=\"error\">${{esc(data.error || \"Nieznany błąd\")}}</p></section>`;\n        return;\n      }}\n\n      const scopeText = data.scope === \"admin\"\n        ? \"Administrator widzi wszystkie aktywne zgłoszenia z terminem SLA.\"\n        : \"Operator widzi zgłoszenia przypisane do siebie oraz nieprzypisane zgłoszenia z terminem SLA.\";\n\n      const sections = {{\n        overdue: {{ title: \"Przekroczone SLA\", items: data.overdue || [], count: data.counts?.overdue || 0 }},\n        today: {{ title: \"Dzisiaj\", items: data.today || [], count: data.counts?.today || 0 }},\n        tomorrow: {{ title: \"Jutro\", items: data.tomorrow || [], count: data.counts?.tomorrow || 0 }},\n        next_7_days: {{ title: \"Następne 7 dni\", items: data.next_7_days || [], count: data.counts?.next_7_days || 0 }},\n        next_30_days: {{ title: \"Następne 30 dni\", items: data.next_30_days || [], count: data.counts?.next_30_days || 0 }}\n      }};\n\n      if (!sections[selectedSection]) {{\n        selectedSection = \"overdue\";\n      }}\n\n      const selected = sections[selectedSection];\n\n      function slaCalendarCard(key, label, count) {{\n        return `\n          <div class=\"dashboard-card ${{selectedSection === key ? \"active\" : \"\"}}\" onclick=\"renderSlaCalendar('${{key}}')\">\n            <div class=\"num\">${{count || 0}}</div>\n            <div class=\"label\">${{esc(label)}}</div>\n          </div>\n        `;\n      }}\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderHome()\">← Lista zgłoszeń</button>\n          <button class=\"btn-secondary\" onclick=\"renderDashboard()\">Dashboard</button>\n          <h2>\U0001F4C5 Kalendarz SLA</h2>\n          <p class=\"dashboard-section-title\">${{scopeText}}</p>\n          <p class=\"muted\">Kliknij sekcję, aby wyświetlić odpowiadającą jej listę zgłoszeń.</p>\n        </section>\n\n        <section class=\"dashboard-grid\">\n          ${{slaCalendarCard(\"overdue\", \"Przekroczone\", sections.overdue.count)}}\n          ${{slaCalendarCard(\"today\", \"Dzisiaj\", sections.today.count)}}\n          ${{slaCalendarCard(\"tomorrow\", \"Jutro\", sections.tomorrow.count)}}\n          ${{slaCalendarCard(\"next_7_days\", \"Następne 7 dni\", sections.next_7_days.count)}}\n          ${{slaCalendarCard(\"next_30_days\", \"Następne 30 dni\", sections.next_30_days.count)}}\n        </section>\n\n        <section class=\"sla-calendar-grid\">\n          ${{slaCalendarSection(selected.title, selected.items)}}\n        </section>\n      `;\n    }}\n\n    async function renderProfile() {{\n      const me = await loadMe();\n      if (!me) return;\n      const metaRes = await api(\"/api/meta\");\n      const meta = await metaRes.json();\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderHome()\">← Powrót</button>\n          <h2>Mój profil</h2>\n          <p class=\"muted\">Zmień dane profilu albo hasło zalogowanego użytkownika. Sesja pozostaje osobna dla tej karty przeglądarki.</p>\n        </section>\n\n        <section class=\"card\">\n          <h3>Dane użytkownika</h3>\n          <p id=\"profileMessage\" class=\"success hidden\">Profil został zapisany.</p>\n          <form id=\"profileForm\">\n            <div class=\"grid\">\n              <div>\n                <label>Imię</label>\n                <input name=\"first_name\" value=\"${{esc(me.first_name)}}\" required>\n              </div>\n              <div>\n                <label>Nazwisko</label>\n                <input name=\"last_name\" value=\"${{esc(me.last_name)}}\" required>\n              </div>\n            </div>\n\n            <label>E-mail</label>\n            <input value=\"${{esc(me.email)}}\" disabled>\n\n            <label>Dział</label>\n            <select name=\"department\">${{meta.departments.map(x => `<option ${{x === me.department ? \"selected\" : \"\"}}>${{esc(x)}}</option>`).join(\"\")}}</select>\n\n            <button type=\"submit\">Zapisz profil</button>\n          </form>\n        </section>\n\n        <section class=\"card\">\n          <h3>Zmiana hasła</h3>\n          <p id=\"passwordMessage\" class=\"success hidden\">Hasło zostało zmienione.</p>\n          <p id=\"passwordError\" class=\"error hidden\">Nie udało się zmienić hasła.</p>\n          <form id=\"passwordForm\">\n            <label>Obecne hasło</label>\n            <input name=\"current_password\" type=\"password\" required>\n\n            <label>Nowe hasło</label>\n            <input name=\"new_password\" type=\"password\" minlength=\"8\" required>\n\n            <label>Powtórz nowe hasło</label>\n            <input name=\"confirm_password\" type=\"password\" minlength=\"8\" required>\n\n            <button type=\"submit\">Zmień hasło</button>\n          </form>\n        </section>`;\n\n      document.getElementById(\"profileForm\").addEventListener(\"submit\", async (e) => {{\n        e.preventDefault();\n        const payload = Object.fromEntries(new FormData(e.target).entries());\n        const res = await api(\"/api/profile\", {{ method: \"PUT\", body: JSON.stringify(payload) }});\n        if (!res || !res.ok) {{ alert(\"Nie udało się zapisać profilu.\"); return; }}\n        document.getElementById(\"profileMessage\").classList.remove(\"hidden\");\n        await loadMe();\n      }});\n\n      document.getElementById(\"passwordForm\").addEventListener(\"submit\", async (e) => {{\n        e.preventDefault();\n        const payload = Object.fromEntries(new FormData(e.target).entries());\n        const msg = document.getElementById(\"passwordMessage\");\n        const err = document.getElementById(\"passwordError\");\n        msg.classList.add(\"hidden\");\n        err.classList.add(\"hidden\");\n        if (payload.new_password !== payload.confirm_password) {{\n          err.textContent = \"Nowe hasła nie są takie same.\";\n          err.classList.remove(\"hidden\");\n          return;\n        }}\n        const res = await api(\"/api/profile/password\", {{ method: \"POST\", body: JSON.stringify(payload) }});\n        if (!res || !res.ok) {{\n          const data = res ? await res.json().catch(() => ({{}})) : {{}};\n          err.textContent = data.error || \"Nie udało się zmienić hasła.\";\n          err.classList.remove(\"hidden\");\n          return;\n        }}\n        e.target.reset();\n        msg.classList.remove(\"hidden\");\n      }});\n    }}\n\n    async function renderAdminUsers() {{\n      const me = await loadMe();\n      if (!me) return;\n      if (!isAdmin(me)) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Brak dostępu</h2><p class=\"muted\">Tylko administrator może zarządzać użytkownikami.</p></section>`;\n        return;\n      }}\n\n      const res = await api(\"/api/admin/users\");\n      if (!res) return;\n      if (!res.ok) {{ appEl.innerHTML = `<section class=\"card\"><h2>Błąd pobierania użytkowników</h2></section>`; return; }}\n      const data = await res.json();\n\n      const rows = data.users.map(u => `\n        <tr>\n          <td><strong>${{esc(u.first_name)}} ${{esc(u.last_name)}}</strong><br><span class=\"muted\">${{esc(u.email)}}</span></td>\n          <td>${{esc(u.department)}}</td>\n          <td>${{roleBadges(u.roles)}}</td>\n          <td class=\"muted\">${{esc(u.created_at)}}</td>\n          <td>\n            <div class=\"actions\">\n              <button class=\"btn-secondary btn-small\" onclick=\"renderAdminUserForm('${{encodeURIComponent(u.email)}}')\">Edytuj</button>\n              <button class=\"btn-secondary btn-small\" onclick=\"renderAdminPasswordForm('${{encodeURIComponent(u.email)}}')\">Hasło</button>\n              <button class=\"btn-danger btn-small\" onclick=\"deleteAdminUser('${{encodeURIComponent(u.email)}}')\">Usuń</button>\n            </div>\n          </td>\n        </tr>`).join(\"\");\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderHome()\">← Powrót</button>\n          <h2>Zarządzanie użytkownikami</h2>\n          <p class=\"muted\">Panel administratora: dodawanie użytkowników, edycja profilu, reset hasła i usuwanie kont.</p>\n          <button onclick=\"renderAdminUserForm()\">Dodaj użytkownika</button>\n        </section>\n        <section class=\"card\">\n          <h3>Użytkownicy INCoprp</h3>\n          <table>\n            <thead><tr><th>Użytkownik</th><th>Dział</th><th>Role</th><th>Utworzono</th><th>Akcje</th></tr></thead>\n            <tbody>${{rows}}</tbody>\n          </table>\n        </section>`;\n    }}\n\n    async function renderAdminUserForm(encodedEmail = null) {{\n      const me = await loadMe();\n      if (!me || !isAdmin(me)) return;\n      const metaRes = await api(\"/api/meta\");\n      const meta = await metaRes.json();\n\n      let user = {{ first_name: \"\", last_name: \"\", email: \"\", department: meta.departments[0], role: \"user\" }};\n      const editing = !!encodedEmail;\n\n      if (editing) {{\n        const email = decodeURIComponent(encodedEmail);\n        const res = await api(`/api/admin/users/${{encodeURIComponent(email)}}`);\n        if (!res || !res.ok) {{ alert(\"Nie udało się pobrać użytkownika.\"); return; }}\n        user = await res.json();\n      }}\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderAdminUsers()\">← Użytkownicy</button>\n          <h2>${{editing ? \"Edytuj użytkownika\" : \"Dodaj użytkownika\"}}</h2>\n          <p id=\"adminUserMessage\" class=\"success hidden\">Zapisano użytkownika.</p>\n          <p id=\"adminUserError\" class=\"error hidden\">Nie udało się zapisać użytkownika.</p>\n          <form id=\"adminUserForm\">\n            <div class=\"grid\">\n              <div>\n                <label>Imię</label>\n                <input name=\"first_name\" value=\"${{esc(user.first_name)}}\" required>\n              </div>\n              <div>\n                <label>Nazwisko</label>\n                <input name=\"last_name\" value=\"${{esc(user.last_name)}}\" required>\n              </div>\n            </div>\n\n            <label>E-mail</label>\n            <input name=\"email\" type=\"email\" value=\"${{esc(user.email)}}\" ${{editing ? \"disabled\" : \"required\"}} placeholder=\"jan.kowalski@incoprp.local\">\n\n            <label>Dział</label>\n            <select name=\"department\">${{meta.departments.map(x => `<option ${{x === user.department ? \"selected\" : \"\"}}>${{esc(x)}}</option>`).join(\"\")}}</select>\n\n            <label>Role</label>\n            <div class=\"card\" style=\"padding:12px;margin-bottom:12px\">\n              <input type=\"hidden\" name=\"roles\" value=\"user\">\n              <label><input type=\"checkbox\" checked disabled> user <span class=\"muted\">— podstawowa rola każdego konta</span></label>\n              <label><input type=\"checkbox\" name=\"roles\" value=\"operator\" ${{(user.roles || []).includes(\"operator\") ? \"checked\" : \"\"}}> operator <span class=\"muted\">— obsługa i przypisywanie zgłoszeń</span></label>\n              <label><input type=\"checkbox\" name=\"roles\" value=\"admin\" ${{(user.roles || []).includes(\"admin\") ? \"checked\" : \"\"}}> admin <span class=\"muted\">— zarządzanie użytkownikami</span></label>\n            </div>\n\n            ${{editing ? \"\" : `\n              <label>Hasło startowe</label>\n              <input name=\"password\" type=\"password\" minlength=\"8\" required placeholder=\"minimum 8 znaków\">\n            `}}\n\n            <button type=\"submit\">Zapisz</button>\n            <button type=\"button\" class=\"btn-secondary\" onclick=\"renderAdminUsers()\">Anuluj</button>\n          </form>\n        </section>`;\n\n      document.getElementById(\"adminUserForm\").addEventListener(\"submit\", async (e) => {{\n        e.preventDefault();\n        const formData = new FormData(e.target);\n        const payload = Object.fromEntries(formData.entries());\n        payload.roles = formData.getAll(\"roles\");\n        const endpoint = editing ? `/api/admin/users/${{encodeURIComponent(user.email)}}` : \"/api/admin/users\";\n        const method = editing ? \"PUT\" : \"POST\";\n        const res = await api(endpoint, {{ method, body: JSON.stringify(payload) }});\n        const msg = document.getElementById(\"adminUserMessage\");\n        const err = document.getElementById(\"adminUserError\");\n        msg.classList.add(\"hidden\");\n        err.classList.add(\"hidden\");\n        if (!res || !res.ok) {{\n          const data = res ? await res.json().catch(() => ({{}})) : {{}};\n          err.textContent = data.error || \"Nie udało się zapisać użytkownika.\";\n          err.classList.remove(\"hidden\");\n          return;\n        }}\n        msg.classList.remove(\"hidden\");\n        setTimeout(renderAdminUsers, 500);\n      }});\n    }}\n\n    async function renderAdminPasswordForm(encodedEmail) {{\n      const me = await loadMe();\n      if (!me || !isAdmin(me)) return;\n      const email = decodeURIComponent(encodedEmail);\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderAdminUsers()\">← Użytkownicy</button>\n          <h2>Reset hasła</h2>\n          <p class=\"muted\">Ustaw nowe hasło dla konta: <strong>${{esc(email)}}</strong></p>\n          <p id=\"adminPasswordMessage\" class=\"success hidden\">Hasło zostało zmienione.</p>\n          <p id=\"adminPasswordError\" class=\"error hidden\">Nie udało się zmienić hasła.</p>\n          <form id=\"adminPasswordForm\">\n            <label>Nowe hasło</label>\n            <input name=\"new_password\" type=\"password\" minlength=\"8\" required>\n            <label>Powtórz nowe hasło</label>\n            <input name=\"confirm_password\" type=\"password\" minlength=\"8\" required>\n            <button type=\"submit\">Zmień hasło</button>\n            <button type=\"button\" class=\"btn-secondary\" onclick=\"renderAdminUsers()\">Anuluj</button>\n          </form>\n        </section>`;\n      document.getElementById(\"adminPasswordForm\").addEventListener(\"submit\", async (e) => {{\n        e.preventDefault();\n        const payload = Object.fromEntries(new FormData(e.target).entries());\n        const msg = document.getElementById(\"adminPasswordMessage\");\n        const err = document.getElementById(\"adminPasswordError\");\n        msg.classList.add(\"hidden\");\n        err.classList.add(\"hidden\");\n        if (payload.new_password !== payload.confirm_password) {{\n          err.textContent = \"Hasła nie są takie same.\";\n          err.classList.remove(\"hidden\");\n          return;\n        }}\n        const res = await api(`/api/admin/users/${{encodeURIComponent(email)}}/password`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n        if (!res || !res.ok) {{\n          const data = res ? await res.json().catch(() => ({{}})) : {{}};\n          err.textContent = data.error || \"Nie udało się zmienić hasła.\";\n          err.classList.remove(\"hidden\");\n          return;\n        }}\n        e.target.reset();\n        msg.classList.remove(\"hidden\");\n      }});\n    }}\n\n    async function deleteAdminUser(encodedEmail) {{\n      const email = decodeURIComponent(encodedEmail);\n      if (!confirm(`Usunąć użytkownika ${{email}}? Tej operacji nie można cofnąć.`)) return;\n      const res = await api(`/api/admin/users/${{encodeURIComponent(email)}}`, {{ method: \"DELETE\" }});\n      if (!res || !res.ok) {{\n        const data = res ? await res.json().catch(() => ({{}})) : {{}};\n        alert(data.error || \"Nie udało się usunąć użytkownika.\");\n        return;\n      }}\n      await renderAdminUsers();\n    }}\n\n\n    function auditActionLabel(action) {{\n      const map = {{\n        \"user_created\": \"Utworzono użytkownika\",\n        \"user_updated\": \"Zmieniono użytkownika / role\",\n        \"user_password_reset\": \"Zresetowano hasło\",\n        \"user_deleted\": \"Usunięto użytkownika\",\n        \"ticket_status_changed\": \"Zmieniono status zgłoszenia\",\n        \"ticket_assigned\": \"Przypisano zgłoszenie\",\n        \"ticket_watcher_added\": \"Dodano obserwatora\",\n        \"ticket_watcher_removed\": \"Usunięto obserwatora\",\n        \"internal_note_added\": \"Dodano notatkę wewnętrzną\",\n        \"attachment_added\": \"Dodano załącznik\"\n      }};\n      return map[action] || action;\n    }}\n\n    function formatAuditDetails(details) {{\n      if (!details) return \"\";\n      try {{\n        const parsed = JSON.parse(details);\n        return Object.entries(parsed)\n          .map(([key, value]) => `<div><span class=\"muted\">${{esc(key)}}:</span> ${{esc(Array.isArray(value) ? value.join(\", \") : String(value ?? \"\"))}}</div>`)\n          .join(\"\");\n      }} catch (e) {{\n        return esc(details);\n      }}\n    }}\n\n    function auditPaginationControls(pagination) {{\n      const page = Number(pagination.page || 1);\n      const totalPages = Number(pagination.total_pages || 1);\n      const disabledPrev = page <= 1 ? \"disabled\" : \"\";\n      const disabledNext = page >= totalPages ? \"disabled\" : \"\";\n\n      return `\n        <div class=\"pagination\">\n          <div class=\"pagination-info\">\n            <strong>Wyświetlanie audytu</strong><br>\n            <span>Strona ${{page}} z ${{totalPages}} · rekordów: ${{pagination.total_filtered || 0}}</span>\n          </div>\n          <div class=\"pagination-pages\">\n            <button class=\"btn-secondary btn-small\" ${{disabledPrev}} onclick=\"renderAudit(1)\">« Pierwsza</button>\n            <button class=\"btn-secondary btn-small\" ${{disabledPrev}} onclick=\"renderAudit(${{Math.max(1, page - 1)}})\">‹ Poprzednia</button>\n            <button class=\"btn-secondary btn-small\" ${{disabledNext}} onclick=\"renderAudit(${{Math.min(totalPages, page + 1)}})\">Następna ›</button>\n            <button class=\"btn-secondary btn-small\" ${{disabledNext}} onclick=\"renderAudit(${{totalPages}})\">Ostatnia »</button>\n          </div>\n        </div>\n      `;\n    }}\n\n    async function renderAudit(page = 1) {{\n      currentView = {{ name: \"audit\", ticketId: null }};\n      const me = await loadMe();\n      if (!me) return;\n      if (!isAdmin(me)) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Brak dostępu</h2><p class=\"muted\">Audyt jest dostępny tylko dla administratorów.</p></section>`;\n        return;\n      }}\n\n      const q = sessionStorage.getItem(\"helpdesk_audit_q\") || \"\";\n      const action = sessionStorage.getItem(\"helpdesk_audit_action\") || \"all\";\n      const actor = sessionStorage.getItem(\"helpdesk_audit_actor\") || \"all\";\n      const pageSize = sessionStorage.getItem(\"helpdesk_audit_page_size\") || \"25\";\n\n      const params = new URLSearchParams();\n      if (q) params.set(\"q\", q);\n      if (action && action !== \"all\") params.set(\"action\", action);\n      if (actor && actor !== \"all\") params.set(\"actor\", actor);\n      params.set(\"page\", String(page));\n      params.set(\"page_size\", String(pageSize));\n\n      const res = await api(`/api/audit?${{params.toString()}}`);\n      if (!res) return;\n      const data = await res.json();\n      if (!res.ok) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Błąd pobierania audytu</h2><p class=\"error\">${{esc(data.error || \"Nieznany błąd\")}}</p></section>`;\n        return;\n      }}\n\n      const rows = (data.audit || []).length\n        ? data.audit.map(a => `\n          <tr>\n            <td class=\"muted\">#${{a.id}}<br>${{esc(a.created_at)}}</td>\n            <td><strong>${{esc(a.actor_name || \"System\")}}</strong><br><span class=\"muted\">${{esc(a.actor_email || \"\")}}</span></td>\n            <td><span class=\"pill\">${{esc(auditActionLabel(a.action))}}</span><br><span class=\"muted\">${{esc(a.action)}}</span></td>\n            <td>${{esc(a.target_type)}}<br><span class=\"muted\">${{esc(a.target_id || \"\")}}</span></td>\n            <td>${{formatAuditDetails(a.details)}}</td>\n          </tr>\n        `).join(\"\")\n        : `<tr><td colspan=\"5\" class=\"muted\">Brak wpisów audytu dla wybranych filtrów.</td></tr>`;\n\n      const actionOptions = [`<option value=\"all\">Wszystkie akcje</option>`]\n        .concat((data.actions || []).map(a => `<option value=\"${{esc(a)}}\" ${{a === action ? \"selected\" : \"\"}}>${{esc(auditActionLabel(a))}}</option>`))\n        .join(\"\");\n\n      const actorOptions = [`<option value=\"all\">Wszyscy aktorzy</option>`]\n        .concat((data.actors || []).map(a => `<option value=\"${{esc(a)}}\" ${{a === actor ? \"selected\" : \"\"}}>${{esc(a)}}</option>`))\n        .join(\"\");\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderHome()\">← Lista zgłoszeń</button>\n          <h2>Audyt działań</h2>\n          <p class=\"muted\">Ślad działań administracyjnych i operatorskich: użytkownicy, role, przypisania, obserwatorzy, statusy, notatki wewnętrzne i załączniki.</p>\n        </section>\n\n        <section class=\"card\">\n          <h3>Filtry audytu</h3>\n          <div class=\"filter-grid\">\n            <div class=\"filter-field\" style=\"grid-column: span 2\">\n              <label>Szukaj</label>\n              <form id=\"auditSearchForm\" style=\"display:flex; gap:8px\">\n                <input id=\"audit-search-input\" value=\"${{esc(q)}}\" placeholder=\"e-mail, akcja, obiekt, szczegóły...\" style=\"margin-top:0\">\n                <button type=\"submit\" style=\"margin-top:0\">Szukaj</button>\n              </form>\n            </div>\n            <div class=\"filter-field\">\n              <label>Akcja</label>\n              <select id=\"audit-action-filter\">${{actionOptions}}</select>\n            </div>\n            <div class=\"filter-field\">\n              <label>Aktor</label>\n              <select id=\"audit-actor-filter\">${{actorOptions}}</select>\n            </div>\n            <div class=\"filter-field\">\n              <label>Na stronie</label>\n              <select id=\"audit-page-size\">\n                <option value=\"25\" ${{String(pageSize) === \"25\" ? \"selected\" : \"\"}}>25</option>\n                <option value=\"50\" ${{String(pageSize) === \"50\" ? \"selected\" : \"\"}}>50</option>\n                <option value=\"100\" ${{String(pageSize) === \"100\" ? \"selected\" : \"\"}}>100</option>\n              </select>\n            </div>\n            <div class=\"filter-field\">\n              <label>&nbsp;</label>\n              <button class=\"btn-secondary\" onclick=\"clearAuditFilters()\">Wyczyść filtry</button>\n            </div>\n          </div>\n        </section>\n\n        <section class=\"card\">\n          <h3>Wpisy audytu</h3>\n          ${{auditPaginationControls(data.pagination || {{ page: 1, total_pages: 1, total_filtered: 0 }})}}\n          <table>\n            <thead>\n              <tr><th>ID / czas</th><th>Aktor</th><th>Akcja</th><th>Obiekt</th><th>Szczegóły</th></tr>\n            </thead>\n            <tbody>${{rows}}</tbody>\n          </table>\n          ${{auditPaginationControls(data.pagination || {{ page: 1, total_pages: 1, total_filtered: 0 }})}}\n        </section>\n      `;\n\n      document.getElementById(\"auditSearchForm\").addEventListener(\"submit\", (e) => {{\n        e.preventDefault();\n        sessionStorage.setItem(\"helpdesk_audit_q\", document.getElementById(\"audit-search-input\").value.trim());\n        renderAudit(1);\n      }});\n\n      document.getElementById(\"audit-action-filter\").addEventListener(\"change\", (e) => {{\n        sessionStorage.setItem(\"helpdesk_audit_action\", e.target.value);\n        renderAudit(1);\n      }});\n\n      document.getElementById(\"audit-actor-filter\").addEventListener(\"change\", (e) => {{\n        sessionStorage.setItem(\"helpdesk_audit_actor\", e.target.value);\n        renderAudit(1);\n      }});\n\n      document.getElementById(\"audit-page-size\").addEventListener(\"change\", (e) => {{\n        sessionStorage.setItem(\"helpdesk_audit_page_size\", e.target.value);\n        renderAudit(1);\n      }});\n    }}\n\n    function clearAuditFilters() {{\n      sessionStorage.removeItem(\"helpdesk_audit_q\");\n      sessionStorage.removeItem(\"helpdesk_audit_action\");\n      sessionStorage.removeItem(\"helpdesk_audit_actor\");\n      sessionStorage.removeItem(\"helpdesk_audit_page_size\");\n      renderAudit(1);\n    }}\n\n\n    async function renderHome(statusFilters = loadStatusFilters(), fromLive = false) {{\n      currentView = {{ name: \"home\", ticketId: null }};\n      const me = await loadMe();\n      if (!me) return;\n\n      const filters = Array.isArray(statusFilters) ? statusFilters : [];\n      saveStatusFilters(filters);\n\n      const assignedFilter = canWorkTickets(me) ? loadAssignedFilter(me) : \"all\";\n      const priorityFilter = loadPriorityFilter();\n      const slaFilter = loadSlaFilter();\n      const searchQuery = loadTicketSearch();\n      const sortBy = loadTicketSort();\n      const sortOrder = loadTicketOrder();\n      const page = loadTicketPage();\n      const pageSize = loadTicketPageSize();\n\n      const params = new URLSearchParams();\n      if (filters.length) params.set(\"statuses\", filters.join(\",\"));\n      if (canWorkTickets(me)) params.set(\"assigned\", assignedFilter);\n      if (priorityFilter && priorityFilter !== \"all\") params.set(\"priority\", priorityFilter);\n      if (slaFilter && slaFilter !== \"all\") params.set(\"sla\", slaFilter);\n      if (searchQuery) params.set(\"q\", searchQuery);\n      params.set(\"sort\", sortBy);\n      params.set(\"order\", sortOrder);\n      params.set(\"page\", String(page));\n      params.set(\"page_size\", String(pageSize));\n\n      const query = params.toString() ? `?${{params.toString()}}` : \"\";\n      const res = await api(`/api/tickets${{query}}`);\n      if (!res) return;\n      const data = await res.json();\n      if (!res.ok) {{\n        appEl.innerHTML = `<section class=\"card\"><h2>Błąd pobierania zgłoszeń</h2><p class=\"error\">${{esc(data.error || \"Nieznany błąd\")}}</p></section>`;\n        return;\n      }}\n\n      const scope = canWorkTickets(me) ? \"Zgłoszenia\" : \"Moje zgłoszenia\";\n      const activeFilterCount = filters.length + (canWorkTickets(me) && assignedFilter !== \"all\" ? 1 : 0) + (priorityFilter !== \"all\" ? 1 : 0) + (slaFilter !== \"all\" ? 1 : 0) + (searchQuery ? 1 : 0);\n      const filterSummary = [];\n      if (filters.length) filterSummary.push(`status: ${{filters.join(\", \")}}`);\n      if (canWorkTickets(me) && assignedFilter !== \"all\") filterSummary.push(`operator: ${{assignedFilterLabel(assignedFilter, data.operators || [])}}`);\n      if (priorityFilter !== \"all\") filterSummary.push(`priorytet: ${{priorityFilter}}`);\n      if (slaFilter !== \"all\") filterSummary.push(`SLA: ${{slaFilterLabel(slaFilter)}}`);\n      if (searchQuery) filterSummary.push(`szukaj: ${{searchQuery}}`);\n      const filteredLabel = filterSummary.length ? ` · ${{filterSummary.join(\" · \")}}` : \"\";\n      const pagination = data.pagination || {{ page: 1, page_size: pageSize, total_pages: 1, total_filtered: data.tickets.length }};\n      if (pagination.page !== page) saveTicketPage(pagination.page);\n\n      const statusChecks = data.statuses.map(s => `\n        <label class=\"combo-option\">\n          <input type=\"checkbox\" ${{filters.includes(s) ? \"checked\" : \"\"}} onchange=\"toggleStatusFilter('${{esc(s)}}')\">\n          <span class=\"pill ${{statusClass(s)}}\">${{esc(s)}}</span>\n        </label>`).join(\"\");\n\n      const assignedSelect = canWorkTickets(me) ? `\n        <div class=\"filter-field\">\n          <label>Przypisane do</label>\n          <select onchange=\"setAssignedFilter(this.value)\">\n            <option value=\"me\" ${{assignedFilter === \"me\" ? \"selected\" : \"\"}}>Moje zgłoszenia</option>\n            <option value=\"all\" ${{assignedFilter === \"all\" ? \"selected\" : \"\"}}>Wszystkie</option>\n            <option value=\"unassigned\" ${{assignedFilter === \"unassigned\" ? \"selected\" : \"\"}}>Nieprzypisane</option>\n            ${{(data.operators || []).map(op => `<option value=\"${{esc(op.email)}}\" ${{assignedFilter === op.email ? \"selected\" : \"\"}}>${{esc(op.name)}} · ${{esc(op.email)}}</option>`).join(\"\")}}\n          </select>\n        </div>` : \"\";\n\n      const prioritySelect = `\n        <div class=\"filter-field\">\n          <label>Priorytet</label>\n          <select onchange=\"setPriorityFilter(this.value)\">\n            <option value=\"all\" ${{priorityFilter === \"all\" ? \"selected\" : \"\"}}>Wszystkie priorytety</option>\n            ${{(data.priorities || []).map(p => `<option value=\"${{esc(p)}}\" ${{priorityFilter === p ? \"selected\" : \"\"}}>${{esc(p)}}</option>`).join(\"\")}}\n          </select>\n        </div>`;\n\n      const slaSelect = `\n        <div class=\"filter-field\">\n          <label>SLA</label>\n          <select onchange=\"setSlaFilter(this.value)\">\n            <option value=\"all\" ${{slaFilter === \"all\" ? \"selected\" : \"\"}}>Wszystkie SLA</option>\n            <option value=\"ok\" ${{slaFilter === \"ok\" ? \"selected\" : \"\"}}>OK</option>\n            <option value=\"warning\" ${{slaFilter === \"warning\" ? \"selected\" : \"\"}}>Blisko terminu</option>\n            <option value=\"overdue\" ${{slaFilter === \"overdue\" ? \"selected\" : \"\"}}>Przekroczone</option>\n            <option value=\"done\" ${{slaFilter === \"done\" ? \"selected\" : \"\"}}>Zakończone</option>\n            <option value=\"none\" ${{slaFilter === \"none\" ? \"selected\" : \"\"}}>Brak SLA</option>\n          </select>\n        </div>`;\n\n      const workViewsHtml = renderWorkViews(me, filters, assignedFilter, priorityFilter, slaFilter, searchQuery);\n\n      const searchSortControls = `\n        <div class=\"filter-grid\" style=\"margin-top:14px\">\n          <div class=\"filter-field\" style=\"grid-column: span 2\">\n            <label>Szukaj</label>\n            <form id=\"ticketSearchForm\" onsubmit=\"applyTicketSearch(event)\" style=\"display:flex; gap:8px\">\n              <input id=\"ticket-search-input\" value=\"${{esc(searchQuery)}}\" placeholder=\"ID, #12, tytuł, opis, zgłaszający, dział, kategoria, podkategoria, operator...\" style=\"margin-top:0\">\n              <button type=\"submit\" style=\"margin-top:0\">Szukaj</button>\n            </form>\n          </div>\n          <div class=\"filter-field\">\n            <label>Sortuj według</label>\n            <select onchange=\"setTicketSort(this.value)\">\n              <option value=\"created_at\" ${{sortBy === \"created_at\" ? \"selected\" : \"\"}}>Data utworzenia</option>\n              <option value=\"updated_at\" ${{sortBy === \"updated_at\" ? \"selected\" : \"\"}}>Data aktualizacji</option>\n              <option value=\"id\" ${{sortBy === \"id\" ? \"selected\" : \"\"}}>ID zgłoszenia</option>\n              <option value=\"priority\" ${{sortBy === \"priority\" ? \"selected\" : \"\"}}>Priorytet</option>\n              <option value=\"status\" ${{sortBy === \"status\" ? \"selected\" : \"\"}}>Status</option>\n              <option value=\"sla\" ${{sortBy === \"sla\" ? \"selected\" : \"\"}}>SLA</option>\n              <option value=\"requester\" ${{sortBy === \"requester\" ? \"selected\" : \"\"}}>Zgłaszający</option>\n              <option value=\"operator\" ${{sortBy === \"operator\" ? \"selected\" : \"\"}}>Operator</option>\n            </select>\n          </div>\n          <div class=\"filter-field\">\n            <label>Kierunek</label>\n            <select onchange=\"setTicketOrder(this.value)\">\n              <option value=\"desc\" ${{sortOrder === \"desc\" ? \"selected\" : \"\"}}>Malejąco</option>\n              <option value=\"asc\" ${{sortOrder === \"asc\" ? \"selected\" : \"\"}}>Rosnąco</option>\n            </select>\n          </div>\n          <div class=\"filter-field\">\n            <label>Na stronie</label>\n            <select onchange=\"setTicketPageSize(this.value)\">\n              <option value=\"10\" ${{pageSize === 10 ? \"selected\" : \"\"}}>10</option>\n              <option value=\"25\" ${{pageSize === 25 ? \"selected\" : \"\"}}>25</option>\n              <option value=\"50\" ${{pageSize === 50 ? \"selected\" : \"\"}}>50</option>\n            </select>\n          </div>\n        </div>`;\n\n      const rows = data.tickets.length ? data.tickets.map(t => `\n        <tr>\n          <td>#${{t.id}}</td>\n          <td><a class=\"ticket-title ${{statusClass(t.status)}}\" href=\"#\" onclick=\"renderTicket(${{t.id}});return false;\">${{esc(t.title)}}</a></td>\n          <td>${{esc(t.requester_name)}}<br><span class=\"muted\">${{esc(t.department)}}</span></td>\n          <td>${{esc(t.category)}}<br><span class=\"muted\">${{esc(t.subcategory || \"Inne\")}}</span></td>\n          <td><span class=\"pill ${{priorityClass(t.priority)}}\">${{esc(t.priority)}}</span></td>\n          <td><span class=\"pill ${{statusClass(t.status)}}\">${{esc(t.status)}}</span></td>\n          <td>${{t.assigned_to_name ? esc(t.assigned_to_name) : '<span class=\"muted\">Nieprzypisane</span>'}}</td>\n          <td><span class=\"sla-badge ${{slaClass(t.sla_state)}}\">${{slaLabel(t.sla_state)}}</span><br><span class=\"muted\">${{esc(t.sla_due_at || \"\")}}</span></td>\n          <td class=\"muted\">${{esc(t.created_at)}}</td>\n        </tr>`).join(\"\") : `<tr><td colspan=\"9\" class=\"muted\">Brak zgłoszeń dla wybranych filtrów.</td></tr>`;\n\n      const totalFiltered = Number(pagination.total_filtered || 0);\n      const currentPage = Number(pagination.page || 1);\n      const currentPageSize = Number(pagination.page_size || pageSize || 10);\n      const totalPages = Number(pagination.total_pages || 1);\n      const firstItem = totalFiltered === 0 ? 0 : ((currentPage - 1) * currentPageSize) + 1;\n      const lastItem = Math.min(totalFiltered, currentPage * currentPageSize);\n\n      const pageControls = `\n        <div class=\"pagination\">\n          <div class=\"pagination-info\">\n            <strong>Wyświetlanie ${{firstItem}}–${{lastItem}} z ${{totalFiltered}} zgłoszeń</strong><br>\n            <span>Strona ${{currentPage}} z ${{totalPages}}</span>\n          </div>\n          <div class=\"pagination-pages\">\n            ${{buildPaginationButtons(pagination)}}\n          </div>\n        </div>`;\n\n      appEl.innerHTML = `\n        <section class=\"stats\">\n          <div class=\"stat\"><div class=\"num\">${{data.stats.total}}</div><div class=\"label\">${{scope}}</div></div>\n          <div class=\"stat\"><div class=\"num\">${{data.stats.new}}</div><div class=\"label\">Nowe</div></div>\n          <div class=\"stat\"><div class=\"num\">${{data.stats.in_progress}}</div><div class=\"label\">W trakcie</div></div>\n          <div class=\"stat\"><div class=\"num\">${{data.stats.high}}</div><div class=\"label\">Wysoki / Krytyczny</div></div>\n          <div class=\"stat\"><div class=\"num\">${{data.stats.resolved}}</div><div class=\"label\">Rozwiązane / Zamknięte</div></div>\n        </section>\n        <section class=\"card\">\n          <button onclick=\"renderNewTicket()\">Nowe zgłoszenie</button>\n          <button class=\"btn-secondary\" onclick=\"renderProfile()\">Mój profil</button>\n          ${{canWorkTickets(me) ? `<button class=\"btn-secondary\" onclick=\"renderDashboard()\">Dashboard</button>` : \"\"}}\n          ${{isAdmin(me) ? `<button class=\"btn-secondary\" onclick=\"renderAdminUsers()\">Zarządzanie użytkownikami</button> <button class=\"btn-secondary\" onclick=\"renderAudit()\">Audyt</button>` : \"\"}}\n          <div style=\"margin-top:16px\">\n            <strong>Widoki robocze:</strong>\n            ${{workViewsHtml}}\n            <strong>Filtry zgłoszeń:</strong>\n            <div class=\"filter-grid\">\n              <div class=\"filter-field\">\n                <label>Status</label>\n                <details class=\"combo\">\n                  <summary>${{esc(statusFilterLabel(filters))}}</summary>\n                  <div class=\"combo-menu\">\n                    <label class=\"combo-option\">\n                      <input type=\"checkbox\" ${{filters.length === 0 ? \"checked\" : \"\"}} onchange=\"clearStatusFilters()\">\n                      <span>Wszystkie statusy</span>\n                    </label>\n                    ${{statusChecks}}\n                  </div>\n                </details>\n              </div>\n              ${{assignedSelect}}\n              ${{prioritySelect}}\n              ${{slaSelect}}\n              <div class=\"filter-field\">\n                <label>&nbsp;</label>\n                <button class=\"btn-secondary\" onclick=\"clearAllFilters()\">Wyczyść filtry</button>\n              </div>\n            </div>\n            ${{searchSortControls}}\n            <div class=\"active-filter-count\">Aktywne filtry: ${{activeFilterCount}}${{canWorkTickets(me) ? ` · domyślnie operator widzi: ${{assignedFilterLabel(loadAssignedFilter(me), data.operators || [])}}` : \"\"}}</div>\n          </div>\n        </section>\n        <section class=\"card\">\n          <h2>${{scope}}${{filteredLabel}}</h2>\n          ${{pageControls}}\n          <table>\n            <thead><tr><th>ID</th><th>Tytuł</th><th>Zgłaszający</th><th>Kategoria</th><th>Priorytet</th><th>Status</th><th>Przypisane do</th><th>SLA</th><th>Utworzono</th></tr></thead>\n            <tbody>${{rows}}</tbody>\n          </table>\n          ${{pageControls}}\n        </section>`;\n    }}\n\n    async function renderNewTicket() {{\n      currentView = {{ name: \"new-ticket\", ticketId: null }};\n      const me = await loadMe();\n      if (!me) return;\n      const metaRes = await api(\"/api/meta\");\n      const meta = await metaRes.json();\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <h2>Nowe zgłoszenie</h2>\n          <form id=\"ticketForm\">\n            <label>Tytuł problemu</label>\n            <input name=\"title\" required placeholder=\"Np. Outlook nie odbiera poczty\">\n            <label>Opis</label>\n            <textarea name=\"description\" required placeholder=\"Opisz problem, komunikat błędu, od kiedy występuje...\"></textarea>\n            <div class=\"grid\">\n              <div><label>Zgłaszający</label><input value=\"${{esc(me.name)}}\" disabled></div>\n              <div><label>E-mail</label><input value=\"${{esc(me.email)}}\" disabled></div>\n            </div>\n            <div class=\"grid\">\n              <div><label>Dział</label><input value=\"${{esc(me.department)}}\" disabled></div>\n              <div>\n                <label>Kategoria</label>\n                <select id=\"new-ticket-category\" name=\"category\">\n                  ${{meta.categories.map(x => `<option>${{esc(x)}}</option>`).join(\"\")}}\n                </select>\n              </div>\n            </div>\n            <div class=\"grid\">\n              <div>\n                <label>Podkategoria</label>\n                <select id=\"new-ticket-subcategory\" name=\"subcategory\"></select>\n              </div>\n            </div>\n            <label>Priorytet</label>\n            <select name=\"priority\">${{meta.priorities.map(x => `<option ${{x === \"Normalny\" ? \"selected\" : \"\"}}>${{esc(x)}}</option>`).join(\"\")}}</select>\n\n            <label>Załączniki opcjonalne</label>\n            <input type=\"file\" name=\"attachments\" multiple accept=\".png,.jpg,.jpeg,.gif,.pdf,.txt,.log,.csv,.xlsx,.docx\">\n            <p class=\"muted\">Możesz dodać screenshot, PDF, log lub dokument. Maksymalnie 10 MB na plik. Załączniki zostaną zapisane automatycznie po kliknięciu „Utwórz zgłoszenie”.</p>\n\n            <button type=\"submit\">Utwórz zgłoszenie</button>\n            <button type=\"button\" class=\"btn-secondary\" onclick=\"renderHome()\">Anuluj</button>\n          </form>\n        </section>`;\n      updateSubcategorySelect(meta);\n      document.getElementById(\"new-ticket-category\").addEventListener(\"change\", () => updateSubcategorySelect(meta));\n      document.getElementById(\"ticketForm\").addEventListener(\"submit\", createTicket);\n    }}\n\n    async function createTicket(event) {{\n      event.preventDefault();\n      const form = event.target;\n      const formData = new FormData(form);\n      const files = formData.getAll(\"attachments\").filter(file => file && file.name);\n      const payload = {{\n        title: formData.get(\"title\") || \"\",\n        description: formData.get(\"description\") || \"\",\n        category: formData.get(\"category\") || \"\",\n        subcategory: formData.get(\"subcategory\") || \"Inne\",\n        priority: formData.get(\"priority\") || \"Normalny\"\n      }};\n\n      suppressNextLiveRefresh = true;\n      const res = await api(\"/api/tickets\", {{ method: \"POST\", body: JSON.stringify(payload) }});\n      if (!res) return;\n      if (!res.ok) {{ alert(\"Nie udało się utworzyć zgłoszenia.\"); return; }}\n\n      const created = await res.json();\n      const ticketId = created.id;\n\n      if (files.length > 0) {{\n        for (const file of files) {{\n          const uploadData = new FormData();\n          uploadData.append(\"file\", file);\n\n          const uploadRes = await fetch(`/api/tickets/${{ticketId}}/attachments`, {{\n            method: \"POST\",\n            headers: {{ \"X-Helpdesk-Session\": getSid() }},\n            body: uploadData\n          }});\n\n          if (!uploadRes.ok) {{\n            const err = await uploadRes.json().catch(() => ({{ error: \"Nie udało się dodać załącznika.\" }}));\n            showToast(\"Zgłoszenie utworzone, ale nie dodano załącznika\", err.error || \"Błąd uploadu\");\n          }}\n        }}\n      }}\n\n      showToast(\"Zgłoszenie zostało utworzone\", files.length ? `Dodano załączniki: ${{files.length}}` : \"\");\n      await renderHome();\n    }}\n\n    async function renderTicket(id, fromLive = false) {{\n      currentView = {{ name: \"ticket\", ticketId: Number(id) }};\n      const me = await loadMe();\n      if (!me) return;\n      const res = await api(`/api/tickets/${{id}}`);\n      if (!res) return;\n      if (!res.ok) {{ appEl.innerHTML = `<section class=\"card\"><h2>Brak dostępu albo brak zgłoszenia</h2></section>`; return; }}\n      const data = await res.json();\n      const t = data.ticket;\n      const isClosed = t.status === \"Zamknięte\";\n      const comments = data.comments.map(c => `\n        <div class=\"comment ${{c.visibility === \"internal\" ? \"internal\" : \"\"}}\">\n          <div class=\"muted\">\n            ${{esc(c.author)}} · ${{esc(c.created_at)}}\n            <span class=\"comment-type ${{c.visibility === \"internal\" ? \"internal\" : \"public\"}}\">${{c.visibility === \"internal\" ? \"Wewnętrzny\" : \"Publiczny\"}}</span>\n          </div>\n          <div>${{esc(c.content)}}</div>\n        </div>\n      `).join(\"\") || `<p class=\"muted\">Brak komentarzy.</p>`;\n\n      const statusPanel = canWorkTickets(me) && !isClosed ? `\n        <section class=\"card\">\n          <h3>Zmień status</h3>\n          <form id=\"statusForm\">\n            <label>Status</label>\n            <select name=\"status\">${{data.meta.statuses.map(s => `<option ${{s === t.status ? \"selected\" : \"\"}}>${{esc(s)}}</option>`).join(\"\")}}</select>\n            <button type=\"submit\">Zapisz status</button>\n          </form>\n        </section>` : \"\";\n\n      const assignmentPanel = canWorkTickets(me) && !isClosed ? `\n        <section class=\"card\">\n          <h3>Przypisanie zgłoszenia</h3>\n          <form id=\"assignmentForm\">\n            <label>Agent</label>\n            <select name=\"assigned_to_email\">\n              <option value=\"\">Nieprzypisane</option>\n              ${{data.meta.operators.map(a => `<option value=\"${{esc(a.email)}}\" ${{a.email === t.assigned_to_email ? \"selected\" : \"\"}}>${{esc(a.name)}} (${{esc(a.role)}})</option>`).join(\"\")}}\n            </select>\n            <button type=\"submit\">Zapisz przypisanie</button>\n          </form>\n        </section>` : \"\";\n\n      const reopenPanel = isClosed && isAdmin(me) ? `\n        <section class=\"card\">\n          <h3>Ponowne otwarcie zgłoszenia</h3>\n          <p class=\"muted\">Tylko administrator może otworzyć zamknięte zgłoszenie ponownie. Wymagany jest powód, który zostanie zapisany w historii i audycie.</p>\n          <button onclick=\"openReopenTicketModal(${{t.id}})\">Otwórz ponownie</button>\n        </section>` : \"\";\n\n      const watcherEmails = new Set((data.watchers || []).map(w => String(w.email || \"\").toLowerCase()));\n      const watcherList = (data.watchers || []).length\n        ? `<div class=\"watcher-list\">${{data.watchers.map(w => `\n            <div class=\"watcher-item\">\n              <div>\n                <strong>${{esc(w.name || w.email)}}</strong>\n                <div class=\"watcher-meta\">${{esc(w.email)}} · ${{esc(w.department || \"\")}} · ${{roleBadges(w.roles)}}</div>\n              </div>\n              ${{canWorkTickets(me) && !isClosed ? `<button class=\"btn-secondary btn-small\" onclick=\"removeWatcher(${{t.id}}, '${{esc(w.email)}}')\">Usuń</button>` : \"\"}}\n            </div>`).join(\"\")}}</div>`\n        : `<p class=\"muted\">Brak dodatkowych obserwatorów.</p>`;\n\n      const watcherOptions = (data.meta.watcher_candidates || [])\n        .filter(w => !watcherEmails.has(String(w.email || \"\").toLowerCase()) && String(w.email || \"\").toLowerCase() !== String(t.requester_email || \"\").toLowerCase())\n        .map(w => `<option value=\"${{esc(w.email)}}\">${{esc(w.name)}} · ${{esc(w.email)}} · ${{esc((w.roles || []).join(\", \"))}}</option>`)\n        .join(\"\");\n\n      const linkedTickets = (data.linked_tickets || []).length\n        ? `<div class=\"watcher-list\">${{data.linked_tickets.map(l => `\n            <div class=\"watcher-item\">\n              <div>\n                <strong><a href=\"#\" onclick=\"renderTicket(${{l.id}}); return false;\">#${{l.id}} · ${{esc(l.title)}}</a></strong>\n                <div class=\"watcher-meta\">\n                  <span class=\"pill ${{statusClass(l.status)}}\">${{esc(l.status)}}</span>\n                  ${{l.assigned_to_name ? \" · \" + esc(l.assigned_to_name) : \"\"}}\n                  ${{l.requester_name ? \" · zgłaszający: \" + esc(l.requester_name) : \"\"}}\n                </div>\n              </div>\n              ${{canWorkTickets(me) && !isClosed ? `<button class=\"btn-secondary btn-small\" onclick=\"removeTicketLink(${{t.id}}, ${{l.id}})\">Usuń</button>` : \"\"}}\n            </div>`).join(\"\")}}</div>`\n        : `<p class=\"muted\">Brak powiązanych zgłoszeń.</p>`;\n\n      const linkedTicketsPanel = `\n        <section class=\"card\">\n          <h3>Powiązane zgłoszenia</h3>\n          <p class=\"muted\">Powiązania pomagają łączyć zgłoszenia dotyczące tego samego problemu, duplikatów albo wspólnego incydentu.</p>\n          ${{linkedTickets}}\n          ${{canWorkTickets(me) && !isClosed ? `\n            <form id=\"ticketLinkForm\">\n              <label>Dodaj powiązanie po ID zgłoszenia</label>\n              <input name=\"linked_ticket_id\" type=\"number\" min=\"1\" placeholder=\"Np. 12\" required>\n              <button type=\"submit\">Dodaj powiązanie</button>\n            </form>\n          ` : \"\"}}\n        </section>`;\n\n      const watcherPanel = `\n        <section class=\"card\">\n          <h3>Obserwatorzy</h3>\n          <p class=\"muted\">Obserwatorzy mogą widzieć zgłoszenie i dodawać komentarze. Operator/admin widzi także notatki wewnętrzne. Przypisany operator jest dodawany automatycznie.</p>\n          ${{watcherList}}\n          ${{canWorkTickets(me) && !isClosed ? `\n            <form id=\"watcherForm\">\n              <label>Dodaj obserwatora</label>\n              <select name=\"user_email\">\n                <option value=\"\">Wybierz użytkownika...</option>\n                ${{watcherOptions}}\n              </select>\n              <button type=\"submit\">Dodaj obserwatora</button>\n            </form>\n          ` : \"\"}}\n        </section>`;\n\n      const eventHistory = (data.events || []).length\n        ? `<div class=\"timeline\">${{data.events.map(e => `\n            <div class=\"event-item\">\n              <strong>${{esc(e.actor_name || \"System\")}}</strong>\n              <span class=\"muted\"> · ${{esc(e.created_at)}} · ${{esc(e.event_type)}}</span>\n              <div>${{esc(e.message)}}</div>\n            </div>`).join(\"\")}}</div>`\n        : `<p class=\"muted\">Brak historii zmian.</p>`;\n\n      const attachmentList = (data.attachments || []).length\n        ? `<div class=\"attachment-list\">${{data.attachments.map(a => `\n            <div class=\"attachment-item\">\n              <div>\n                <strong>${{esc(a.original_filename)}}</strong>\n                <div class=\"attachment-meta\">\n                  ${{formatBytes(a.size_bytes)}} · ${{esc(a.uploaded_by_name || \"Nieznany\")}} · ${{esc(a.created_at)}}\n                </div>\n              </div>\n              <button class=\"btn-secondary btn-small\" onclick=\"downloadAttachment(${{a.id}})\">Pobierz</button>\n            </div>`).join(\"\")}}</div>`\n        : `<p class=\"muted\">Brak załączników.</p>`;\n\n      appEl.innerHTML = `\n        <section class=\"card\">\n          <button class=\"btn-secondary\" onclick=\"renderHome()\">← Powrót</button>\n          <h2 class=\"ticket-heading ${{statusClass(t.status)}}\">#${{t.id}} · ${{esc(t.title)}}</h2>\n          <p class=\"muted\">Utworzono: ${{esc(t.created_at)}} · Aktualizacja: ${{esc(t.updated_at)}}</p>\n          <p><strong>Status:</strong> <span class=\"pill ${{statusClass(t.status)}}\">${{esc(t.status)}}</span></p>\n          ${{t.status === \"Zamknięte\" ? `\n            <div class=\"resolution-box\">\n              <strong>Podsumowanie zamknięcia</strong>\n              <div class=\"muted\">\n                Zamknięte: ${{esc(t.closed_at || \"brak danych\")}}\n                ${{t.closed_by_name ? \" · przez \" + esc(t.closed_by_name) : \"\"}}\n                ${{t.resolution_minutes ? \" · czas rozwiązania: \" + formatResolutionMinutes(t.resolution_minutes) : \"\"}}\n              </div>\n              ${{t.resolution_summary ? `<p>${{esc(t.resolution_summary)}}</p>` : \"\"}}\n            </div>\n          ` : \"\"}}\n          <p><strong>Priorytet:</strong> <span class=\"pill ${{priorityClass(t.priority)}}\">${{esc(t.priority)}}</span></p>\n          <p><strong>SLA:</strong> <span class=\"sla-badge ${{slaClass(t.sla_state)}}\">${{slaLabel(t.sla_state)}}</span> <span class=\"muted\">${{esc(t.sla_due_at || \"\")}}</span></p>\n          <p><strong>Przypisane do:</strong> ${{t.assigned_to_name ? esc(t.assigned_to_name) : '<span class=\"muted\">Nieprzypisane</span>'}}</p>\n          <p><strong>Kategoria:</strong> ${{esc(t.category)}} / ${{esc(t.subcategory || \"Inne\")}}</p>\n          <p><strong>Zgłaszający:</strong> ${{esc(t.requester_name)}} · ${{esc(t.requester_email)}}</p>\n          <p><strong>Dział:</strong> ${{esc(t.department)}}</p>\n          <h3>Opis</h3><p>${{esc(t.description)}}</p>\n          ${{isClosed ? `<div class=\"readonly-box\"><strong>Zgłoszenie zamknięte — tylko do odczytu.</strong><br><span>Nie można zmieniać statusu, przypisania, komentarzy, załączników, obserwatorów ani powiązań.</span></div>` : \"\"}}\n        </section>\n        ${{statusPanel}}\n        ${{assignmentPanel}}\n        ${{reopenPanel}}\n        ${{linkedTicketsPanel}}\n        ${{watcherPanel}}\n        <section class=\"card\">\n          <h3>Historia zmian</h3>\n          ${{eventHistory}}\n        </section>\n        <section class=\"card\">\n          <h3>Załączniki</h3>\n          ${{attachmentList}}\n          ${{!isClosed ? `\n            <form id=\"attachmentForm\" enctype=\"multipart/form-data\">\n              <label>Dodaj załącznik</label>\n              <input type=\"file\" name=\"file\" required>\n              <div class=\"attachment-upload-hint\">Dozwolone: png, jpg, jpeg, gif, pdf, txt, log, csv, xlsx, docx. Maksymalnie 10 MB.</div>\n              <button type=\"submit\">Dodaj załącznik</button>\n            </form>\n          ` : `<p class=\"muted\">Zgłoszenie zamknięte — dodawanie załączników jest zablokowane.</p>`}}\n        </section>\n        <section class=\"card\">\n          <h3>Komentarze</h3>\n          ${{comments}}\n          ${{!isClosed ? `\n            <form id=\"commentForm\">\n              <label>Komentarz</label>\n              <textarea name=\"content\" required></textarea>\n              ${{canWorkTickets(me) ? `\n                <div class=\"switch-row\">\n                  <div>\n                    <strong>Notatka wewnętrzna</strong>\n                    <small>Widoczna tylko dla operatorów i administratorów.</small>\n                  </div>\n                  <label class=\"switch\">\n                    <input id=\"comment-internal\" name=\"internal_note\" type=\"checkbox\">\n                    <span class=\"slider\"></span>\n                  </label>\n                </div>\n              ` : `<input type=\"hidden\" name=\"visibility\" value=\"public\">`}}\n              <button type=\"submit\">Dodaj komentarz</button>\n            </form>\n          ` : `<p class=\"muted\">Zgłoszenie zamknięte — dodawanie komentarzy jest zablokowane.</p>`}}\n        </section>`;\n\n      const attachmentForm = document.getElementById(\"attachmentForm\");\n      if (attachmentForm) {{\n        attachmentForm.addEventListener(\"submit\", async (e) => {{\n          e.preventDefault();\n        const formData = new FormData(attachmentForm);\n        suppressNextLiveRefresh = true;\n        const res = await fetch(`/api/tickets/${{id}}/attachments`, {{\n          method: \"POST\",\n          headers: {{ \"X-Helpdesk-Session\": getSid() }},\n          body: formData\n        }});\n        if (res.status === 401) {{\n          clearSid();\n          window.location.href = \"/login\";\n          return;\n        }}\n        if (!res.ok) {{\n          suppressNextLiveRefresh = false;\n          const err = await res.json().catch(() => ({{ error: \"Nie udało się dodać załącznika.\" }}));\n          alert(err.error || \"Nie udało się dodać załącznika.\");\n          return;\n        }}\n          showToast(\"Dodano załącznik do zgłoszenia #\" + id);\n          await renderTicket(id);\n        }});\n      }}\n\n      const commentForm = document.getElementById(\"commentForm\");\n      if (commentForm) {{\n        commentForm.addEventListener(\"submit\", async (e) => {{\n          e.preventDefault();\n        const payload = Object.fromEntries(new FormData(commentForm).entries());\n        const internalToggle = document.getElementById(\"comment-internal\");\n        payload.visibility = internalToggle && internalToggle.checked ? \"internal\" : \"public\";\n        delete payload.internal_note;\n        suppressNextLiveRefresh = true;\n          await api(`/api/tickets/${{id}}/comments`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n          await renderTicket(id);\n        }});\n      }}\n\n      const statusForm = document.getElementById(\"statusForm\");\n      if (statusForm) {{\n        statusForm.addEventListener(\"submit\", async (e) => {{\n          e.preventDefault();\n          const payload = Object.fromEntries(new FormData(statusForm).entries());\n          const newStatus = payload.status || \"\";\n          if (newStatus === \"Zamknięte\") {{\n            openCloseTicketModal(id);\n            return;\n          }}\n          suppressNextLiveRefresh = true;\n          const res = await api(`/api/tickets/${{id}}/status`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n          if (!res || !res.ok) {{\n            suppressNextLiveRefresh = false;\n            alert(\"Nie udało się zmienić statusu.\");\n            return;\n          }}\n          showToast(\n            \"Status zgłoszenia #\" + id + \" został zmieniony\",\n            \"Nowy status: \" + newStatus\n          );\n          await renderTicket(id);\n        }});\n      }}\n\n      const assignmentForm = document.getElementById(\"assignmentForm\");\n      if (assignmentForm) {{\n        assignmentForm.addEventListener(\"submit\", async (e) => {{\n          e.preventDefault();\n          const payload = Object.fromEntries(new FormData(assignmentForm).entries());\n          suppressNextLiveRefresh = true;\n          const res = await api(`/api/tickets/${{id}}/assign`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n          if (!res || !res.ok) {{\n            suppressNextLiveRefresh = false;\n            alert(\"Nie udało się zmienić przypisania.\");\n            return;\n          }}\n          showToast(\"Zmieniono przypisanie zgłoszenia #\" + id, payload.assigned_to_email || \"Nieprzypisane\");\n          await renderTicket(id);\n        }});\n      }}\n\n      const ticketLinkForm = document.getElementById(\"ticketLinkForm\");\n      if (ticketLinkForm) {{\n        ticketLinkForm.addEventListener(\"submit\", async (e) => {{\n          e.preventDefault();\n          const payload = Object.fromEntries(new FormData(ticketLinkForm).entries());\n          if (!payload.linked_ticket_id) {{\n            alert(\"Podaj ID zgłoszenia do powiązania.\");\n            return;\n          }}\n          suppressNextLiveRefresh = true;\n          const res = await api(`/api/tickets/${{id}}/links`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n          if (!res || !res.ok) {{\n            suppressNextLiveRefresh = false;\n            const err = res ? await res.json().catch(() => ({{ error: \"Nie udało się dodać powiązania.\" }})) : {{ error: \"Nie udało się dodać powiązania.\" }};\n            alert(err.error || \"Nie udało się dodać powiązania.\");\n            return;\n          }}\n          showToast(\"Dodano powiązanie do zgłoszenia #\" + id);\n          await renderTicket(id);\n        }});\n      }}\n\n      const watcherForm = document.getElementById(\"watcherForm\");\n      if (watcherForm) {{\n        watcherForm.addEventListener(\"submit\", async (e) => {{\n          e.preventDefault();\n          const payload = Object.fromEntries(new FormData(watcherForm).entries());\n          if (!payload.user_email) {{\n            alert(\"Wybierz obserwatora.\");\n            return;\n          }}\n          suppressNextLiveRefresh = true;\n          const res = await api(`/api/tickets/${{id}}/watchers`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n          if (!res || !res.ok) {{\n            suppressNextLiveRefresh = false;\n            const err = res ? await res.json().catch(() => ({{ error: \"Nie udało się dodać obserwatora.\" }})) : {{ error: \"Nie udało się dodać obserwatora.\" }};\n            alert(err.error || \"Nie udało się dodać obserwatora.\");\n            return;\n          }}\n          showToast(\"Dodano obserwatora do zgłoszenia #\" + id);\n          await renderTicket(id);\n        }});\n      }}\n    }}\n\n    async function removeTicketLink(ticketId, linkedTicketId) {{\n      if (!confirm(\"Usunąć powiązanie z tym zgłoszeniem?\")) return;\n      suppressNextLiveRefresh = true;\n      const res = await api(`/api/tickets/${{ticketId}}/links/${{linkedTicketId}}`, {{ method: \"DELETE\" }});\n      if (!res || !res.ok) {{\n        suppressNextLiveRefresh = false;\n        const err = res ? await res.json().catch(() => ({{ error: \"Nie udało się usunąć powiązania.\" }})) : {{ error: \"Nie udało się usunąć powiązania.\" }};\n        alert(err.error || \"Nie udało się usunąć powiązania.\");\n        return;\n      }}\n      showToast(\"Usunięto powiązanie ze zgłoszenia #\" + ticketId);\n      await renderTicket(ticketId);\n    }}\n\n    async function removeWatcher(ticketId, email) {{\n      if (!confirm(\"Usunąć obserwatora z tego zgłoszenia?\")) return;\n      suppressNextLiveRefresh = true;\n      const res = await api(`/api/tickets/${{ticketId}}/watchers/${{encodeURIComponent(email)}}`, {{ method: \"DELETE\" }});\n      if (!res || !res.ok) {{\n        suppressNextLiveRefresh = false;\n        const err = res ? await res.json().catch(() => ({{ error: \"Nie udało się usunąć obserwatora.\" }})) : {{ error: \"Nie udało się usunąć obserwatora.\" }};\n        alert(err.error || \"Nie udało się usunąć obserwatora.\");\n        return;\n      }}\n      showToast(\"Usunięto obserwatora ze zgłoszenia #\" + ticketId);\n      await renderTicket(ticketId);\n    }}\n\n    const closeTicketForm = document.getElementById(\"closeTicketForm\");\n    if (closeTicketForm) {{\n      closeTicketForm.addEventListener(\"submit\", async (e) => {{\n        e.preventDefault();\n        if (!closeTicketId) return;\n\n        const formData = new FormData(closeTicketForm);\n        const internalToggle = document.getElementById(\"close-comment-internal\");\n        formData.set(\"visibility\", internalToggle && internalToggle.checked ? \"internal\" : \"public\");\n\n        suppressNextLiveRefresh = true;\n        const res = await fetch(`/api/tickets/${{closeTicketId}}/close`, {{\n          method: \"POST\",\n          headers: {{ \"X-Helpdesk-Session\": getSid() }},\n          body: formData\n        }});\n\n        if (res.status === 401) {{\n          clearSid();\n          window.location.href = \"/login\";\n          return;\n        }}\n\n        if (!res.ok) {{\n          suppressNextLiveRefresh = false;\n          const err = await res.json().catch(() => ({{ error: \"Nie udało się zamknąć zgłoszenia.\" }}));\n          alert(err.error || \"Nie udało się zamknąć zgłoszenia.\");\n          return;\n        }}\n\n        const closedId = closeTicketId;\n        closeCloseTicketModal();\n        showToast(\"Zgłoszenie #\" + closedId + \" zostało zamknięte\");\n        await renderTicket(closedId);\n      }});\n    }}\n\n    const reopenTicketForm = document.getElementById(\"reopenTicketForm\");\n    if (reopenTicketForm) {{\n      reopenTicketForm.addEventListener(\"submit\", async (e) => {{\n        e.preventDefault();\n        if (!reopenTicketId) return;\n\n        const payload = Object.fromEntries(new FormData(reopenTicketForm).entries());\n        payload.reason = String(payload.reason || \"\").trim();\n\n        if (!payload.reason) {{\n          alert(\"Podaj powód ponownego otwarcia zgłoszenia.\");\n          return;\n        }}\n\n        suppressNextLiveRefresh = true;\n        const res = await api(`/api/tickets/${{reopenTicketId}}/reopen`, {{ method: \"POST\", body: JSON.stringify(payload) }});\n        if (!res || !res.ok) {{\n          suppressNextLiveRefresh = false;\n          const err = res ? await res.json().catch(() => ({{ error: \"Nie udało się otworzyć zgłoszenia ponownie.\" }})) : {{ error: \"Nie udało się otworzyć zgłoszenia ponownie.\" }};\n          alert(err.error || \"Nie udało się otworzyć zgłoszenia ponownie.\");\n          return;\n        }}\n\n        const reopenedId = reopenTicketId;\n        closeReopenTicketModal();\n        showToast(\"Zgłoszenie #\" + reopenedId + \" zostało otwarte ponownie\");\n        await renderTicket(reopenedId);\n      }});\n    }}\n\n    renderHome();\n  </script>\n</body>\n</html>\n\"\"\"\n\nLOGIN_HTML = f\"\"\"\n<!doctype html>\n<html lang=\"pl\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>INCoprp Helpdesk — Logowanie</title>\n  <style>{CSS}</style>\n</head>\n<body>\n  <main class=\"page\">\n    <header>\n      <div>\n        <h1>INCoprp Helpdesk</h1>\n        <p class=\"subtitle\">Logowanie do systemu zgłoszeń IT.</p>\n      </div>\n      <div class=\"badge\">Sesja: <strong>ukryta w sessionStorage</strong></div>\n    </header>\n    <section class=\"card login-box\">\n      <h2>Logowanie</h2>\n      <p id=\"error\" class=\"error hidden\">Nieprawidłowy e-mail albo hasło.</p>\n      <form id=\"loginForm\">\n        <label>E-mail</label>\n        <input name=\"email\" type=\"email\" required placeholder=\"anna.kowalska@incoprp.local\">\n        <label>Hasło</label>\n        <input name=\"password\" type=\"password\" required placeholder=\"Incoprp123!\">\n        <button type=\"submit\">Zaloguj</button>\n      </form>\n      <p class=\"muted\">\n        Konta testowe: anna.kowalska@incoprp.local, piotr.nowak@incoprp.local,\n        operator@incoprp.local, admin@incoprp.local. Hasło startowe: Incoprp123!\n      </p>\n    </section>\n  </main>\n  <script>\n    document.getElementById(\"loginForm\").addEventListener(\"submit\", async (event) => {{\n      event.preventDefault();\n      const payload = Object.fromEntries(new FormData(event.target).entries());\n      const res = await fetch(\"/api/login\", {{\n        method: \"POST\",\n        headers: {{ \"Content-Type\": \"application/json\" }},\n        body: JSON.stringify(payload)\n      }});\n      if (!res.ok) {{\n        document.getElementById(\"error\").classList.remove(\"hidden\");\n        return;\n      }}\n      const data = await res.json();\n      sessionStorage.setItem(\"helpdesk_sid\", data.sid);\n      window.location.href = \"/\";\n    }});\n  </script>\n</body>\n</html>\n\"\"\"\n\n@sock.route(\"/ws\")\ndef websocket(ws):\n    client_id = id(ws)\n    user = None\n    try:\n        raw = ws.receive()\n        auth = json.loads(raw or \"{}\")\n        sid = clean(auth.get(\"sid\"))\n        user = get_user_by_sid(sid)\n        if not user:\n            ws.send(json.dumps({\"error\": \"unauthorized\"}))\n            return\n\n        active_ws_clients.add(client_id)\n        publish_event(f\"{user['name']} połączony z live helpdesk\", \"presence\")\n\n        while True:\n            event = last_live_event\n            if event and event.get(\"staff_only\") and not is_staff(user):\n                event = None\n\n            ws.send(json.dumps({\n                \"server_time\": time.strftime(\"%Y-%m-%d %H:%M:%S\"),\n                \"active_clients\": len(active_ws_clients),\n                \"user\": {\n                    \"name\": user[\"name\"],\n                    \"email\": user[\"email\"],\n                    \"role\": user[\"role\"],\n                    \"roles\": user.get(\"roles\", [\"user\"]),\n                },\n                \"event\": event,\n            }))\n            time.sleep(1)\n    except Exception:\n        pass\n    finally:\n        active_ws_clients.discard(client_id)\n\n@app.get(\"/healthz\")\ndef healthz():\n    return {\"status\": \"ok\"}\n\n@app.get(\"/login\")\ndef login_page():\n    return Response(LOGIN_HTML, mimetype=\"text/html\")\n\n@app.get(\"/\")\ndef spa_page():\n    return Response(SPA_HTML, mimetype=\"text/html\")\n\n@app.post(\"/api/login\")\ndef api_login():\n    payload = request.get_json(silent=True) or {}\n    email = clean(payload.get(\"email\")).lower()\n    password = str(payload.get(\"password\") or \"\")\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email, department, role, password_hash, roles\n        FROM users\n        WHERE lower(email) = %s\n    \"\"\", (email,))\n    user = cur.fetchone()\n    if not user:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"invalid credentials\"}), 401\n\n    first_name, last_name, user_email, department, role, password_hash, roles = user\n    roles = list(roles or [\"user\"])\n    if not check_password_hash(password_hash, password):\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"invalid credentials\"}), 401\n\n    sid = str(uuid.uuid4())\n    cur.execute(\"INSERT INTO user_sessions (sid, user_email) VALUES (%s, %s)\", (sid, user_email))\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    return jsonify({\n        \"sid\": sid,\n        \"user\": {\n            \"first_name\": first_name,\n            \"last_name\": last_name,\n            \"name\": f\"{first_name} {last_name}\".strip(),\n            \"email\": user_email,\n            \"department\": department,\n            \"role\": role_label(roles),\n            \"roles\": roles,\n        }\n    })\n\n@app.post(\"/api/logout\")\ndef api_logout():\n    sid = get_sid_from_request()\n    if sid:\n        conn = get_conn()\n        cur = conn.cursor()\n        cur.execute(\"DELETE FROM user_sessions WHERE sid = %s\", (sid,))\n        conn.commit()\n        cur.close()\n        conn.close()\n    return jsonify({\"status\": \"ok\"})\n\n@app.get(\"/api/me\")\n@api_login_required\ndef api_me(user):\n    return jsonify(user)\n\n@app.put(\"/api/profile\")\n@api_login_required\ndef api_update_profile(user):\n    payload = request.get_json(silent=True) or {}\n    first_name = clean(payload.get(\"first_name\"))\n    last_name = clean(payload.get(\"last_name\"))\n    department = clean(payload.get(\"department\"))\n\n    if not first_name or not last_name:\n        return jsonify({\"error\": \"Imię i nazwisko są wymagane.\"}), 400\n    if department not in DEPARTMENTS:\n        return jsonify({\"error\": \"invalid department\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        UPDATE users\n        SET first_name = %s, last_name = %s, department = %s\n        WHERE email = %s\n    \"\"\", (first_name, last_name, department, user[\"email\"]))\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    return jsonify({\"status\": \"ok\"})\n\n@app.post(\"/api/profile/password\")\n@api_login_required\ndef api_change_password(user):\n    payload = request.get_json(silent=True) or {}\n    current_password = str(payload.get(\"current_password\") or \"\")\n    new_password = str(payload.get(\"new_password\") or \"\")\n    confirm_password = str(payload.get(\"confirm_password\") or \"\")\n\n    if len(new_password) < 8:\n        return jsonify({\"error\": \"Nowe hasło musi mieć co najmniej 8 znaków.\"}), 400\n    if new_password != confirm_password:\n        return jsonify({\"error\": \"Nowe hasła nie są takie same.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT password_hash FROM users WHERE email = %s\", (user[\"email\"],))\n    row = cur.fetchone()\n    if not row or not check_password_hash(row[0], current_password):\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Obecne hasło jest nieprawidłowe.\"}), 400\n\n    cur.execute(\"\"\"\n        UPDATE users\n        SET password_hash = %s\n        WHERE email = %s\n    \"\"\", (generate_password_hash(new_password), user[\"email\"]))\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    return jsonify({\"status\": \"ok\"})\n\n@app.get(\"/api/admin/users\")\n@api_login_required\n@api_admin_required\ndef api_admin_users(user):\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email, department, role, roles, created_at\n        FROM users\n        ORDER BY lower(last_name), lower(first_name), lower(email)\n    \"\"\")\n    rows = cur.fetchall()\n    cur.close()\n    conn.close()\n    return jsonify({\n        \"users\": [\n            {\n                \"first_name\": r[0],\n                \"last_name\": r[1],\n                \"full_name\": f\"{r[0]} {r[1]}\".strip(),\n                \"email\": r[2],\n                \"department\": r[3],\n                \"role\": role_label(list(r[5] or [\"user\"])),\n                \"roles\": list(r[5] or [\"user\"]),\n                \"created_at\": str(r[6]),\n            }\n            for r in rows\n        ]\n    })\n\n@app.get(\"/api/admin/users/<path:email>\")\n@api_login_required\n@api_admin_required\ndef api_admin_get_user(user, email):\n    email = clean(email).lower()\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email, department, role, roles, created_at\n        FROM users\n        WHERE lower(email) = %s\n    \"\"\", (email,))\n    row = cur.fetchone()\n    cur.close()\n    conn.close()\n    if not row:\n        return jsonify({\"error\": \"user not found\"}), 404\n    return jsonify({\n        \"first_name\": row[0],\n        \"last_name\": row[1],\n        \"full_name\": f\"{row[0]} {row[1]}\".strip(),\n        \"email\": row[2],\n        \"department\": row[3],\n        \"role\": role_label(list(row[5] or [\"user\"])),\n        \"roles\": list(row[5] or [\"user\"]),\n        \"created_at\": str(row[6]),\n    })\n\n@app.post(\"/api/admin/users\")\n@api_login_required\n@api_admin_required\ndef api_admin_create_user(user):\n    payload = request.get_json(silent=True) or {}\n    first_name = clean(payload.get(\"first_name\"))\n    last_name = clean(payload.get(\"last_name\"))\n    email = clean(payload.get(\"email\")).lower()\n    department = clean(payload.get(\"department\"))\n    roles = normalize_roles(payload.get(\"roles\") or payload.get(\"role\") or [\"user\"])\n    role = role_label(roles)\n    password = str(payload.get(\"password\") or \"\")\n\n    if not first_name or not last_name or not email:\n        return jsonify({\"error\": \"Imię, nazwisko oraz e-mail są wymagane.\"}), 400\n    if department not in DEPARTMENTS:\n        return jsonify({\"error\": \"Nieprawidłowy dział.\"}), 400\n    if not roles:\n        return jsonify({\"error\": \"Nieprawidłowa rola.\"}), 400\n    if len(password) < 8:\n        return jsonify({\"error\": \"Hasło musi mieć co najmniej 8 znaków.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT 1 FROM users WHERE lower(email) = %s\", (email,))\n    if cur.fetchone():\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Użytkownik o takim adresie e-mail już istnieje.\"}), 409\n\n    cur.execute(\"\"\"\n        INSERT INTO users (first_name, last_name, email, department, role, roles, password_hash)\n        VALUES (%s, %s, %s, %s, %s, %s, %s)\n    \"\"\", (first_name, last_name, email, department, role, roles, generate_password_hash(password)))\n    log_audit(cur, user, \"user_created\", \"user\", email, {\n        \"email\": email,\n        \"first_name\": first_name,\n        \"last_name\": last_name,\n        \"department\": department,\n        \"roles\": roles,\n    })\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"status\": \"ok\"}), 201\n\n@app.put(\"/api/admin/users/<path:email>\")\n@api_login_required\n@api_admin_required\ndef api_admin_update_user(user, email):\n    target_email = clean(email).lower()\n    payload = request.get_json(silent=True) or {}\n    first_name = clean(payload.get(\"first_name\"))\n    last_name = clean(payload.get(\"last_name\"))\n    department = clean(payload.get(\"department\"))\n    roles = normalize_roles(payload.get(\"roles\") or payload.get(\"role\") or [\"user\"])\n    role = role_label(roles)\n\n    if not first_name or not last_name:\n        return jsonify({\"error\": \"Imię i nazwisko są wymagane.\"}), 400\n    if department not in DEPARTMENTS:\n        return jsonify({\"error\": \"Nieprawidłowy dział.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT roles FROM users WHERE lower(email) = %s\", (target_email,))\n    row = cur.fetchone()\n    if not row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie znaleziono użytkownika.\"}), 404\n\n    old_roles = list(row[0] or [\"user\"])\n    if \"admin\" in old_roles and \"admin\" not in roles:\n        cur.execute(\"SELECT COUNT(*) FROM users WHERE 'admin' = ANY(roles)\")\n        admin_count = cur.fetchone()[0]\n        if admin_count <= 1:\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Nie można odebrać roli ostatniemu administratorowi.\"}), 400\n\n    cur.execute(\"\"\"\n        UPDATE users\n        SET first_name = %s, last_name = %s, department = %s, role = %s, roles = %s\n        WHERE lower(email) = %s\n    \"\"\", (first_name, last_name, department, role, roles, target_email))\n    log_audit(cur, user, \"user_updated\", \"user\", target_email, {\n        \"email\": target_email,\n        \"first_name\": first_name,\n        \"last_name\": last_name,\n        \"department\": department,\n        \"old_roles\": old_roles,\n        \"new_roles\": roles,\n    })\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"status\": \"ok\"})\n\n@app.post(\"/api/admin/users/<path:email>/password\")\n@api_login_required\n@api_admin_required\ndef api_admin_reset_password(user, email):\n    target_email = clean(email).lower()\n    payload = request.get_json(silent=True) or {}\n    new_password = str(payload.get(\"new_password\") or \"\")\n    confirm_password = str(payload.get(\"confirm_password\") or \"\")\n\n    if len(new_password) < 8:\n        return jsonify({\"error\": \"Nowe hasło musi mieć co najmniej 8 znaków.\"}), 400\n    if new_password != confirm_password:\n        return jsonify({\"error\": \"Nowe hasła nie są takie same.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT 1 FROM users WHERE lower(email) = %s\", (target_email,))\n    if not cur.fetchone():\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie znaleziono użytkownika.\"}), 404\n    cur.execute(\"UPDATE users SET password_hash = %s WHERE lower(email) = %s\", (generate_password_hash(new_password), target_email))\n    cur.execute(\"DELETE FROM user_sessions WHERE lower(user_email) = %s\", (target_email,))\n    log_audit(cur, user, \"user_password_reset\", \"user\", target_email, {\n        \"email\": target_email,\n        \"sessions_revoked\": True,\n    })\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"status\": \"ok\"})\n\n@app.delete(\"/api/admin/users/<path:email>\")\n@api_login_required\n@api_admin_required\ndef api_admin_delete_user(user, email):\n    target_email = clean(email).lower()\n    if target_email == user[\"email\"].lower():\n        return jsonify({\"error\": \"Nie możesz usunąć własnego konta.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT roles FROM users WHERE lower(email) = %s\", (target_email,))\n    row = cur.fetchone()\n    if not row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie znaleziono użytkownika.\"}), 404\n\n    if row[0] and \"admin\" in row[0]:\n        cur.execute(\"SELECT COUNT(*) FROM users WHERE 'admin' = ANY(roles)\")\n        admin_count = cur.fetchone()[0]\n        if admin_count <= 1:\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Nie można usunąć ostatniego administratora.\"}), 400\n\n    cur.execute(\"DELETE FROM user_sessions WHERE lower(user_email) = %s\", (target_email,))\n    cur.execute(\"DELETE FROM users WHERE lower(email) = %s\", (target_email,))\n    log_audit(cur, user, \"user_deleted\", \"user\", target_email, {\n        \"email\": target_email,\n        \"roles\": list(row[0] or []),\n    })\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"status\": \"ok\"})\n\n@app.get(\"/api/notifications\")\n@api_login_required\ndef api_notifications(user):\n    conn = get_conn()\n    cur = conn.cursor()\n\n    cur.execute(\"\"\"\n        SELECT COUNT(*)\n        FROM notifications\n        WHERE user_email = %s AND is_read = FALSE\n    \"\"\", (user[\"email\"],))\n    unread_count = cur.fetchone()[0]\n\n    cur.execute(\"\"\"\n        SELECT n.id, n.ticket_id, n.type, n.message, n.is_read, n.created_at, t.title\n        FROM notifications n\n        LEFT JOIN tickets t ON t.id = n.ticket_id\n        WHERE n.user_email = %s\n        ORDER BY n.created_at DESC, n.id DESC\n        LIMIT 50\n    \"\"\", (user[\"email\"],))\n    rows = cur.fetchall()\n\n    cur.close()\n    conn.close()\n\n    return jsonify({\n        \"unread_count\": unread_count,\n        \"notifications\": [\n            {\n                \"id\": r[0],\n                \"ticket_id\": r[1],\n                \"type\": r[2],\n                \"message\": r[3],\n                \"is_read\": bool(r[4]),\n                \"created_at\": str(r[5]),\n                \"ticket_title\": r[6] or \"\",\n            }\n            for r in rows\n        ],\n    })\n\n\n@app.post(\"/api/notifications/<int:notification_id>/read\")\n@api_login_required\ndef api_notification_read(user, notification_id):\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        UPDATE notifications\n        SET is_read = TRUE\n        WHERE id = %s AND user_email = %s\n    \"\"\", (notification_id, user[\"email\"]))\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"status\": \"ok\"})\n\n\n@app.post(\"/api/notifications/read-all\")\n@api_login_required\ndef api_notifications_read_all(user):\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        UPDATE notifications\n        SET is_read = TRUE\n        WHERE user_email = %s AND is_read = FALSE\n    \"\"\", (user[\"email\"],))\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"status\": \"ok\"})\n\n\n@app.get(\"/api/audit\")\n@api_login_required\n@api_admin_required\ndef api_audit(user):\n    q = clean(request.args.get(\"q\") or \"\")\n    action_filter = clean(request.args.get(\"action\") or \"all\")\n    actor_filter = clean(request.args.get(\"actor\") or \"all\")\n\n    try:\n        page = max(1, int(request.args.get(\"page\", \"1\")))\n    except ValueError:\n        page = 1\n\n    try:\n        page_size = int(request.args.get(\"page_size\", \"25\"))\n    except ValueError:\n        page_size = 25\n\n    if page_size not in (25, 50, 100):\n        page_size = 25\n\n    clauses = []\n    params = []\n\n    if action_filter and action_filter != \"all\":\n        clauses.append(\"action = %s\")\n        params.append(action_filter)\n\n    if actor_filter and actor_filter != \"all\":\n        clauses.append(\"lower(actor_email) = lower(%s)\")\n        params.append(actor_filter)\n\n    if q:\n        like = f\"%{q.lower()}%\"\n        clauses.append(\"\"\"(\n            lower(coalesce(actor_email, '')) LIKE %s\n            OR lower(coalesce(actor_name, '')) LIKE %s\n            OR lower(coalesce(action, '')) LIKE %s\n            OR lower(coalesce(target_type, '')) LIKE %s\n            OR lower(coalesce(target_id, '')) LIKE %s\n            OR lower(coalesce(details, '')) LIKE %s\n        )\"\"\")\n        params.extend([like, like, like, like, like, like])\n\n    where_sql = (\"WHERE \" + \" AND \".join(clauses)) if clauses else \"\"\n    offset = (page - 1) * page_size\n\n    conn = get_conn()\n    cur = conn.cursor()\n\n    cur.execute(f\"SELECT COUNT(*) FROM audit_log {where_sql}\", params)\n    total = cur.fetchone()[0]\n    total_pages = max(1, (total + page_size - 1) // page_size)\n    if page > total_pages:\n        page = total_pages\n        offset = (page - 1) * page_size\n\n    cur.execute(f\"\"\"\n        SELECT id, actor_email, actor_name, action, target_type, target_id, details, created_at\n        FROM audit_log\n        {where_sql}\n        ORDER BY created_at DESC, id DESC\n        LIMIT %s OFFSET %s\n    \"\"\", params + [page_size, offset])\n    rows = cur.fetchall()\n\n    cur.execute(\"\"\"\n        SELECT DISTINCT action\n        FROM audit_log\n        ORDER BY action\n    \"\"\")\n    actions = [r[0] for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT DISTINCT actor_email\n        FROM audit_log\n        WHERE actor_email IS NOT NULL AND actor_email <> ''\n        ORDER BY actor_email\n    \"\"\")\n    actors = [r[0] for r in cur.fetchall()]\n\n    cur.close()\n    conn.close()\n\n    return jsonify({\n        \"audit\": [\n            {\n                \"id\": r[0],\n                \"actor_email\": r[1] or \"\",\n                \"actor_name\": r[2] or \"System\",\n                \"action\": r[3],\n                \"target_type\": r[4],\n                \"target_id\": r[5] or \"\",\n                \"details\": r[6] or \"\",\n                \"created_at\": str(r[7]),\n            }\n            for r in rows\n        ],\n        \"actions\": actions,\n        \"actors\": actors,\n        \"pagination\": {\n            \"page\": page,\n            \"page_size\": page_size,\n            \"total_filtered\": total,\n            \"total_pages\": total_pages,\n        },\n        \"filters\": {\n            \"q\": q,\n            \"action\": action_filter,\n            \"actor\": actor_filter,\n        },\n    })\n\n\n\n@app.get(\"/api/meta\")\n@api_login_required\ndef api_meta(user):\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email, role, roles\n        FROM users\n        WHERE 'operator' = ANY(roles)\n        ORDER BY last_name, first_name\n    \"\"\")\n    operators = [\n        {\"name\": f\"{r[0]} {r[1]}\".strip(), \"email\": r[2], \"role\": role_label(list(r[4] or [\"user\"])), \"roles\": list(r[4] or [\"user\"])}\n        for r in cur.fetchall()\n    ]\n    cur.close()\n    conn.close()\n    return jsonify({\n        \"departments\": DEPARTMENTS,\n        \"categories\": CATEGORIES,\n        \"subcategories\": SUBCATEGORIES,\n        \"priorities\": PRIORITIES,\n        \"statuses\": STATUSES,\n        \"roles\": VALID_ROLES,\n        \"operators\": operators,\n    })\n\n@app.get(\"/api/tickets\")\n@api_login_required\ndef api_tickets(user):\n    raw_statuses = clean(request.args.get(\"statuses\")) or clean(request.args.get(\"status\"))\n    status_filters = []\n    if raw_statuses:\n        status_filters = [s.strip() for s in raw_statuses.split(\",\") if s.strip()]\n        invalid = [s for s in status_filters if s not in STATUSES]\n        if invalid:\n            return jsonify({\"error\": \"invalid status filter\", \"invalid\": invalid}), 400\n\n    assigned_filter = clean(request.args.get(\"assigned\")) or \"\"\n    priority_filter = clean(request.args.get(\"priority\")) or \"all\"\n    sla_filter = clean(request.args.get(\"sla\")) or \"all\"\n    search_query = clean(request.args.get(\"q\") or request.args.get(\"search\")) or \"\"\n\n    sort_by = clean(request.args.get(\"sort\")) or \"created_at\"\n    sort_order = (clean(request.args.get(\"order\")) or \"desc\").lower()\n    if sort_order not in (\"asc\", \"desc\"):\n        sort_order = \"desc\"\n\n    try:\n        page = max(1, int(request.args.get(\"page\", \"1\")))\n    except ValueError:\n        page = 1\n\n    try:\n        page_size = int(request.args.get(\"page_size\", \"10\"))\n    except ValueError:\n        page_size = 10\n\n    if page_size not in (10, 25, 50):\n        page_size = 10\n\n    if priority_filter not in ([\"all\"] + PRIORITIES):\n        return jsonify({\"error\": \"invalid priority filter\"}), 400\n\n    valid_sla_filters = [\"all\", \"ok\", \"warning\", \"overdue\", \"done\", \"none\"]\n    if sla_filter not in valid_sla_filters:\n        return jsonify({\"error\": \"invalid sla filter\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email, role, roles\n        FROM users\n        WHERE 'operator' = ANY(roles)\n        ORDER BY last_name, first_name\n    \"\"\")\n    operators = [\n        {\"name\": f\"{r[0]} {r[1]}\".strip(), \"email\": r[2], \"role\": role_label(list(r[4] or [\"user\"])), \"roles\": list(r[4] or [\"user\"])}\n        for r in cur.fetchall()\n    ]\n    operator_emails = {op[\"email\"].lower() for op in operators}\n\n    if is_staff(user):\n        if not assigned_filter:\n            assigned_filter = \"me\" if is_operator(user) else \"all\"\n    else:\n        assigned_filter = \"all\"\n\n    base_clauses = []\n    base_params = []\n\n    if not is_staff(user):\n        base_clauses.append(\"\"\"(\n            lower(t.requester_email) = lower(%s)\n            OR EXISTS (\n                SELECT 1\n                FROM ticket_watchers tw\n                WHERE tw.ticket_id = t.id\n                  AND lower(tw.user_email) = lower(%s)\n            )\n        )\"\"\")\n        base_params.extend([user[\"email\"], user[\"email\"]])\n    else:\n        if assigned_filter == \"me\":\n            base_clauses.append(\"lower(t.assigned_to_email) = lower(%s)\")\n            base_params.append(user[\"email\"])\n        elif assigned_filter == \"unassigned\":\n            base_clauses.append(\"(t.assigned_to_email IS NULL OR t.assigned_to_email = '')\")\n        elif assigned_filter and assigned_filter != \"all\":\n            if assigned_filter.lower() not in operator_emails:\n                cur.close()\n                conn.close()\n                return jsonify({\"error\": \"invalid assigned filter\"}), 400\n            base_clauses.append(\"lower(t.assigned_to_email) = lower(%s)\")\n            base_params.append(assigned_filter)\n\n    if priority_filter != \"all\":\n        base_clauses.append(\"t.priority = %s\")\n        base_params.append(priority_filter)\n\n    if sla_filter == \"none\":\n        base_clauses.append(\"t.sla_due_at IS NULL\")\n    elif sla_filter == \"done\":\n        base_clauses.append(\"t.status IN ('Rozwiązane', 'Zamknięte')\")\n    elif sla_filter == \"overdue\":\n        base_clauses.append(\"t.status NOT IN ('Rozwiązane', 'Zamknięte') AND t.sla_due_at IS NOT NULL AND t.sla_due_at < NOW()\")\n    elif sla_filter == \"warning\":\n        base_clauses.append(\"t.status NOT IN ('Rozwiązane', 'Zamknięte') AND t.sla_due_at IS NOT NULL AND t.sla_due_at >= NOW() AND t.sla_due_at <= NOW() + INTERVAL '4 hours'\")\n    elif sla_filter == \"ok\":\n        base_clauses.append(\"t.status NOT IN ('Rozwiązane', 'Zamknięte') AND t.sla_due_at IS NOT NULL AND t.sla_due_at > NOW() + INTERVAL '4 hours'\")\n\n    base_where_sql = \"WHERE \" + \" AND \".join(base_clauses) if base_clauses else \"\"\n\n    filtered_clauses = list(base_clauses)\n    filtered_params = list(base_params)\n    if status_filters:\n        placeholders = \",\".join([\"%s\"] * len(status_filters))\n        filtered_clauses.append(f\"t.status IN ({placeholders})\")\n        filtered_params.extend(status_filters)\n\n    if search_query:\n        search_terms = []\n        search_params = []\n\n        numeric_match = None\n        normalized_search = search_query.strip()\n        if normalized_search.startswith(\"#\"):\n            normalized_search = normalized_search[1:].strip()\n        if normalized_search.isdigit():\n            numeric_match = int(normalized_search)\n\n        if numeric_match is not None:\n            search_terms.append(\"t.id = %s\")\n            search_params.append(numeric_match)\n\n        like = f\"%{search_query}%\"\n        search_terms.extend([\n            \"CAST(t.id AS TEXT) ILIKE %s\",\n            \"t.title ILIKE %s\",\n            \"t.description ILIKE %s\",\n            \"t.requester_name ILIKE %s\",\n            \"t.requester_email ILIKE %s\",\n            \"t.department ILIKE %s\",\n            \"t.category ILIKE %s\",\n            \"COALESCE(t.subcategory, '') ILIKE %s\",\n            \"t.status ILIKE %s\",\n            \"t.priority ILIKE %s\",\n            \"COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email, '') ILIKE %s\",\n            \"COALESCE(t.assigned_to_email, '') ILIKE %s\",\n        ])\n        search_params.extend([like] * 12)\n\n        filtered_clauses.append(\"(\" + \" OR \".join(search_terms) + \")\")\n        filtered_params.extend(search_params)\n\n    filtered_where_sql = \"WHERE \" + \" AND \".join(filtered_clauses) if filtered_clauses else \"\"\n\n    cur.execute(f\"\"\"\n        SELECT\n          COUNT(*),\n          COUNT(*) FILTER (WHERE t.status = 'Nowe'),\n          COUNT(*) FILTER (WHERE t.status = 'W trakcie'),\n          COUNT(*) FILTER (WHERE t.priority IN ('Wysoki', 'Krytyczny')),\n          COUNT(*) FILTER (WHERE t.status IN ('Rozwiązane', 'Zamknięte'))\n        FROM tickets t\n        {base_where_sql}\n    \"\"\", tuple(base_params))\n    total, new_count, in_progress, high_count, resolved_count = cur.fetchone()\n\n    cur.execute(f\"\"\"\n        SELECT COUNT(*)\n        FROM tickets t\n        LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)\n        {filtered_where_sql}\n    \"\"\", tuple(filtered_params))\n    total_filtered = cur.fetchone()[0] or 0\n\n    total_pages = max(1, (total_filtered + page_size - 1) // page_size)\n    if page > total_pages:\n        page = total_pages\n    offset = (page - 1) * page_size\n\n    sort_map = {\n        \"id\": \"t.id\",\n        \"created_at\": \"t.created_at\",\n        \"updated_at\": \"t.updated_at\",\n        \"priority\": \"CASE t.priority WHEN 'Krytyczny' THEN 1 WHEN 'Wysoki' THEN 2 WHEN 'Normalny' THEN 3 WHEN 'Niski' THEN 4 ELSE 5 END\",\n        \"status\": \"t.status\",\n        \"sla\": \"t.sla_due_at\",\n        \"requester\": \"t.requester_name\",\n        \"operator\": \"COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email, '')\",\n    }\n    sort_expr = sort_map.get(sort_by, \"t.created_at\")\n    nulls = \"NULLS LAST\"\n\n    cur.execute(f\"\"\"\n        SELECT t.id, t.title, t.requester_name, t.requester_email, t.department, t.category, COALESCE(t.subcategory, 'Inne') AS subcategory,\n               t.priority, t.status, t.created_at, t.updated_at, t.assigned_to_email,\n               COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,\n               t.sla_due_at,\n               t.resolution_minutes,\n               t.closed_at,\n               t.closed_by_email,\n               COALESCE(NULLIF(trim(concat(cu.first_name, ' ', cu.last_name)), ''), t.closed_by_email) AS closed_by_name,\n               t.resolution_summary\n        FROM tickets t\n        LEFT JOIN users cu ON lower(cu.email) = lower(t.closed_by_email)\n        LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)\n        {filtered_where_sql}\n        ORDER BY {sort_expr} {sort_order.upper()} {nulls}, t.id DESC\n        LIMIT %s OFFSET %s\n    \"\"\", tuple(filtered_params + [page_size, offset]))\n    rows = cur.fetchall()\n    cur.close()\n    conn.close()\n\n    tickets = []\n    for row in rows:\n        tickets.append({\n            \"id\": row[0],\n            \"title\": row[1],\n            \"requester_name\": row[2],\n            \"requester_email\": row[3],\n            \"department\": row[4],\n            \"category\": row[5],\n            \"subcategory\": row[6],\n            \"priority\": row[7],\n            \"status\": row[8],\n            \"created_at\": str(row[9]),\n            \"updated_at\": str(row[10]),\n            \"assigned_to_email\": row[11],\n            \"assigned_to_name\": row[12],\n            \"sla_due_at\": str(row[13]) if row[13] else \"\",\n            \"sla_state\": sla_state(row[13], row[8]),\n        })\n\n    return jsonify({\n        \"stats\": {\n            \"total\": total,\n            \"new\": new_count,\n            \"in_progress\": in_progress,\n            \"high\": high_count,\n            \"resolved\": resolved_count,\n        },\n        \"tickets\": tickets,\n        \"statuses\": STATUSES,\n        \"priorities\": PRIORITIES,\n        \"operators\": operators,\n        \"sla_options\": [\"all\", \"ok\", \"warning\", \"overdue\", \"done\", \"none\"],\n        \"selected_statuses\": status_filters,\n        \"selected_assigned\": assigned_filter,\n        \"selected_priority\": priority_filter,\n        \"selected_sla\": sla_filter,\n        \"search\": search_query,\n        \"sort\": sort_by,\n        \"order\": sort_order,\n        \"pagination\": {\n            \"page\": page,\n            \"page_size\": page_size,\n            \"total_filtered\": total_filtered,\n            \"total_pages\": total_pages,\n        },\n    })\n\n\n@app.get(\"/api/dashboard\")\n@api_login_required\ndef api_dashboard(user):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    conn = get_conn()\n    cur = conn.cursor()\n\n    cur.execute(\"\"\"\n        SELECT\n          COUNT(*),\n          COUNT(*) FILTER (WHERE status = 'Nowe'),\n          COUNT(*) FILTER (WHERE status = 'W trakcie'),\n          COUNT(*) FILTER (WHERE status NOT IN ('Rozwiązane', 'Zamknięte') AND sla_due_at IS NOT NULL AND sla_due_at < NOW()),\n          COUNT(*) FILTER (WHERE assigned_to_email IS NULL OR assigned_to_email = '')\n        FROM tickets\n    \"\"\")\n    total, new_count, in_progress_count, overdue_sla_count, unassigned_count = cur.fetchone()\n\n    cur.execute(\"\"\"\n        SELECT status, COUNT(*)\n        FROM tickets\n        GROUP BY status\n        ORDER BY array_position(ARRAY['Nowe','Otwarte','W trakcie','Oczekuje na użytkownika','Oczekuje na dostawcę','Rozwiązane','Zamknięte'], status)\n    \"\"\")\n    by_status = [{\"label\": r[0], \"value\": r[0], \"count\": r[1]} for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT priority, COUNT(*)\n        FROM tickets\n        GROUP BY priority\n        ORDER BY CASE priority\n          WHEN 'Krytyczny' THEN 1\n          WHEN 'Wysoki' THEN 2\n          WHEN 'Normalny' THEN 3\n          WHEN 'Niski' THEN 4\n          ELSE 5\n        END\n    \"\"\")\n    by_priority = [{\"label\": r[0], \"value\": r[0], \"count\": r[1]} for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT sla_state, COUNT(*)\n        FROM (\n          SELECT\n            CASE\n              WHEN status IN ('Rozwiązane', 'Zamknięte') THEN 'done'\n              WHEN sla_due_at IS NULL THEN 'none'\n              WHEN sla_due_at < NOW() THEN 'overdue'\n              WHEN sla_due_at <= NOW() + INTERVAL '4 hours' THEN 'warning'\n              ELSE 'ok'\n            END AS sla_state\n          FROM tickets\n        ) x\n        GROUP BY sla_state\n        ORDER BY CASE sla_state\n          WHEN 'overdue' THEN 1\n          WHEN 'warning' THEN 2\n          WHEN 'ok' THEN 3\n          WHEN 'done' THEN 4\n          ELSE 5\n        END\n    \"\"\")\n    by_sla = [{\"label\": r[0], \"value\": r[0], \"count\": r[1]} for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT COALESCE(NULLIF(category, ''), 'Brak kategorii') AS label, COUNT(*)\n        FROM tickets\n        GROUP BY label\n        ORDER BY COUNT(*) DESC, label ASC\n        LIMIT 12\n    \"\"\")\n    by_category = [{\"label\": r[0], \"value\": r[0], \"count\": r[1]} for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT COALESCE(NULLIF(subcategory, ''), 'Inne') AS label, COUNT(*)\n        FROM tickets\n        GROUP BY label\n        ORDER BY COUNT(*) DESC, label ASC\n        LIMIT 12\n    \"\"\")\n    by_subcategory = [{\"label\": r[0], \"value\": r[0], \"count\": r[1]} for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT COALESCE(NULLIF(department, ''), 'Brak działu') AS label, COUNT(*)\n        FROM tickets\n        GROUP BY label\n        ORDER BY COUNT(*) DESC, label ASC\n        LIMIT 12\n    \"\"\")\n    by_department = [{\"label\": r[0], \"value\": r[0], \"count\": r[1]} for r in cur.fetchall()]\n\n    cur.execute(\"\"\"\n        SELECT\n          COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), NULLIF(t.assigned_to_email, ''), 'Nieprzypisane') AS label,\n          COALESCE(NULLIF(t.assigned_to_email, ''), 'unassigned') AS value,\n          COUNT(*)\n        FROM tickets t\n        LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)\n        GROUP BY label, value\n        ORDER BY COUNT(*) DESC, label ASC\n    \"\"\")\n    by_operator = [{\"label\": r[0], \"value\": r[1], \"count\": r[2]} for r in cur.fetchall()]\n\n    cur.close()\n    conn.close()\n\n    return jsonify({\n        \"summary\": {\n            \"total\": total,\n            \"new\": new_count,\n            \"in_progress\": in_progress_count,\n            \"overdue_sla\": overdue_sla_count,\n            \"unassigned\": unassigned_count,\n        },\n        \"by_status\": by_status,\n        \"by_priority\": by_priority,\n        \"by_sla\": by_sla,\n        \"by_category\": by_category,\n        \"by_subcategory\": by_subcategory,\n        \"by_department\": by_department,\n        \"by_operator\": by_operator,\n    })\n\n\n@app.get(\"/api/sla-calendar\")\n@api_login_required\ndef api_sla_calendar(user):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    conn = get_conn()\n    cur = conn.cursor()\n\n    params = []\n    where = [\n        \"t.sla_due_at IS NOT NULL\",\n        \"t.status NOT IN ('Rozwiązane', 'Zamknięte')\",\n    ]\n\n    scope = \"admin\" if is_admin(user) else \"operator\"\n    if not is_admin(user):\n        where.append(\"(lower(COALESCE(t.assigned_to_email, '')) = lower(%s) OR t.assigned_to_email IS NULL OR t.assigned_to_email = '')\")\n        params.append(user.get(\"email\") or \"\")\n\n    cur.execute(f\"\"\"\n        SELECT\n          t.id,\n          t.title,\n          t.status,\n          t.priority,\n          t.sla_due_at,\n          t.assigned_to_email,\n          COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,\n          t.requester_name,\n          t.category,\n          COALESCE(t.subcategory, 'Inne') AS subcategory\n        FROM tickets t\n        LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)\n        WHERE {' AND '.join(where)}\n        ORDER BY t.sla_due_at ASC, t.id ASC\n    \"\"\", tuple(params))\n\n    rows = cur.fetchall()\n    cur.close()\n    conn.close()\n\n    now = datetime.now()\n    today = now.date()\n    tomorrow = today + timedelta(days=1)\n    next_7 = today + timedelta(days=7)\n    next_30 = today + timedelta(days=30)\n\n    result = {\n        \"scope\": scope,\n        \"overdue\": [],\n        \"today\": [],\n        \"tomorrow\": [],\n        \"next_7_days\": [],\n        \"next_30_days\": [],\n    }\n\n    def row_to_dict(row):\n        due_at = row[4]\n        return {\n            \"id\": row[0],\n            \"title\": row[1],\n            \"status\": row[2],\n            \"priority\": row[3],\n            \"sla_due_at\": str(due_at) if due_at else None,\n            \"sla_state\": sla_state(due_at, row[2]),\n            \"assigned_to_email\": row[5],\n            \"assigned_to_name\": row[6],\n            \"requester_name\": row[7],\n            \"category\": row[8],\n            \"subcategory\": row[9],\n        }\n\n    for row in rows:\n        due_at = row[4]\n        item = row_to_dict(row)\n        if not due_at:\n            continue\n        due_date = due_at.date()\n\n        if due_at < now:\n            result[\"overdue\"].append(item)\n        elif due_date == today:\n            result[\"today\"].append(item)\n        elif due_date == tomorrow:\n            result[\"tomorrow\"].append(item)\n        elif due_date <= next_7:\n            result[\"next_7_days\"].append(item)\n        elif due_date <= next_30:\n            result[\"next_30_days\"].append(item)\n\n    result[\"counts\"] = {\n        \"overdue\": len(result[\"overdue\"]),\n        \"today\": len(result[\"today\"]),\n        \"tomorrow\": len(result[\"tomorrow\"]),\n        \"next_7_days\": len(result[\"next_7_days\"]),\n        \"next_30_days\": len(result[\"next_30_days\"]),\n    }\n\n    return jsonify(result)\n\n\n@app.post(\"/api/tickets\")\n@api_login_required\ndef api_create_ticket(user):\n    payload = request.get_json(silent=True) or {}\n    title = clean(payload.get(\"title\"))\n    description = clean(payload.get(\"description\"))\n    category = clean(payload.get(\"category\"))\n    subcategory = clean(payload.get(\"subcategory\")) or \"Inne\"\n    priority = clean(payload.get(\"priority\")) or \"Normalny\"\n\n    if not title or not description:\n        return jsonify({\"error\": \"title and description are required\"}), 400\n    if priority not in PRIORITIES:\n        return jsonify({\"error\": \"Nieprawidłowy priorytet.\"}), 400\n    if category not in CATEGORIES:\n        return jsonify({\"error\": \"Nieprawidłowa kategoria.\"}), 400\n    if subcategory not in SUBCATEGORIES.get(category, [\"Inne\"]):\n        return jsonify({\"error\": \"Nieprawidłowa podkategoria.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    sla_due_at = sla_due_for_priority(priority)\n    cur.execute(\"\"\"\n        INSERT INTO tickets (\n            title, description, requester_name, requester_email,\n            department, category, subcategory, priority, status, sla_due_at\n        )\n        VALUES (%s, %s, %s, %s, %s, %s, %s, %s, 'Nowe', %s)\n        RETURNING id\n    \"\"\", (\n        title, description, user[\"name\"], user[\"email\"],\n        user[\"department\"], category, subcategory, priority, sla_due_at,\n    ))\n    ticket_id = cur.fetchone()[0]\n    add_ticket_event(cur, ticket_id, user, \"ticket_created\", f\"Utworzono zgłoszenie: {title}\")\n    log_audit(cur, user, \"ticket_created\", \"ticket\", ticket_id, {\n        \"title\": title,\n        \"category\": category,\n        \"subcategory\": subcategory,\n        \"priority\": priority,\n    })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"ticket_created\",\n        f\"Utworzono zgłoszenie #{ticket_id}: {title}\",\n        actor_email=user[\"email\"],\n    )\n    conn.commit()\n    cur.close()\n    conn.close()\n    publish_event(f\"{user['name']} utworzył zgłoszenie #{ticket_id}: {title}\", \"ticket_created\", ticket_id)\n    return jsonify({\"id\": ticket_id}), 201\n\ndef can_view_ticket(user, ticket_id):\n    if not user:\n        return False\n\n    # Operatorzy i admini mogą widzieć wszystkie zgłoszenia oraz ich załączniki.\n    if is_staff(user):\n        return True\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT\n          requester_email,\n          assigned_to_email,\n          EXISTS (\n            SELECT 1\n            FROM ticket_watchers tw\n            WHERE tw.ticket_id = tickets.id\n              AND lower(tw.user_email) = lower(%s)\n          ) AS is_watcher\n        FROM tickets\n        WHERE id = %s\n    \"\"\", (user.get(\"email\") or \"\", ticket_id))\n    row = cur.fetchone()\n    cur.close()\n    conn.close()\n\n    if not row:\n        return False\n\n    requester_email, assigned_to_email, is_watcher = row\n    user_email = (user.get(\"email\") or \"\").lower()\n\n    return bool(\n        user_email\n        and (\n            user_email == (requester_email or \"\").lower()\n            or user_email == (assigned_to_email or \"\").lower()\n            or is_watcher\n        )\n    )\n\n\ndef get_ticket_status_for_update(cur, ticket_id):\n    cur.execute(\"SELECT status FROM tickets WHERE id = %s\", (ticket_id,))\n    row = cur.fetchone()\n    if not row:\n        return None\n    return row[0]\n\n\ndef ensure_ticket_mutable(cur, ticket_id):\n    status = get_ticket_status_for_update(cur, ticket_id)\n    if status is None:\n        return False, jsonify({\"error\": \"not found\"}), 404\n    if status == \"Zamknięte\":\n        return False, jsonify({\"error\": \"Zgłoszenie jest zamknięte i dostępne tylko do odczytu.\"}), 400\n    return True, status, None\n\n@app.get(\"/api/tickets/<int:ticket_id>\")\n@api_login_required\ndef api_ticket_detail(user, ticket_id):\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT t.id, t.title, t.description, t.requester_name, t.requester_email, t.department,\n               t.category, COALESCE(t.subcategory, 'Inne') AS subcategory, t.priority, t.status, t.created_at, t.updated_at, t.assigned_to_email,\n               COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,\n               t.sla_due_at,\n               t.resolution_minutes,\n               t.closed_at,\n               t.closed_by_email,\n               COALESCE(NULLIF(trim(concat(cu.first_name, ' ', cu.last_name)), ''), t.closed_by_email) AS closed_by_name,\n               t.resolution_summary\n        FROM tickets t\n        LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)\n        LEFT JOIN users cu ON lower(cu.email) = lower(t.closed_by_email)\n        WHERE t.id = %s\n    \"\"\", (ticket_id,))\n    row = cur.fetchone()\n    if not row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n\n    if is_staff(user):\n        cur.execute(\"\"\"\n            SELECT author, content, created_at, COALESCE(visibility, 'public') AS visibility\n            FROM comments\n            WHERE ticket_id = %s\n            ORDER BY id ASC\n        \"\"\", (ticket_id,))\n    else:\n        cur.execute(\"\"\"\n            SELECT author, content, created_at, COALESCE(visibility, 'public') AS visibility\n            FROM comments\n            WHERE ticket_id = %s\n              AND COALESCE(visibility, 'public') = 'public'\n            ORDER BY id ASC\n        \"\"\", (ticket_id,))\n    comment_rows = cur.fetchall()\n\n    cur.execute(\"\"\"\n        SELECT actor_name, event_type, message, created_at\n        FROM ticket_events\n        WHERE ticket_id = %s\n        ORDER BY id ASC\n    \"\"\", (ticket_id,))\n    event_rows = cur.fetchall()\n\n    cur.execute(\"\"\"\n        SELECT id, original_filename, content_type, size_bytes, uploaded_by_name, created_at\n        FROM attachments\n        WHERE ticket_id = %s\n        ORDER BY id DESC\n    \"\"\", (ticket_id,))\n    attachment_rows = cur.fetchall()\n\n    cur.execute(\"\"\"\n        SELECT\n          u.first_name,\n          u.last_name,\n          u.email,\n          u.department,\n          u.role,\n          u.roles,\n          tw.created_at\n        FROM ticket_watchers tw\n        JOIN users u ON lower(u.email) = lower(tw.user_email)\n        WHERE tw.ticket_id = %s\n        ORDER BY lower(u.last_name), lower(u.first_name), lower(u.email)\n    \"\"\", (ticket_id,))\n    watcher_rows = cur.fetchall()\n\n    watcher_candidate_rows = []\n    if is_staff(user):\n        cur.execute(\"\"\"\n            SELECT first_name, last_name, email, department, role, roles\n            FROM users\n            ORDER BY lower(last_name), lower(first_name), lower(email)\n        \"\"\")\n        watcher_candidate_rows = cur.fetchall()\n\n    cur.execute(\"\"\"\n        SELECT\n          l.id,\n          l.linked_id,\n          t.title,\n          t.status,\n          t.requester_name,\n          COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,\n          l.relation_type,\n          l.created_by_email,\n          l.created_at\n        FROM (\n          SELECT\n            id,\n            ticket_id,\n            linked_ticket_id,\n            relation_type,\n            created_by_email,\n            created_at,\n            CASE\n              WHEN ticket_id = %s THEN linked_ticket_id\n              ELSE ticket_id\n            END AS linked_id\n          FROM ticket_links\n          WHERE ticket_id = %s OR linked_ticket_id = %s\n        ) l\n        JOIN tickets t ON t.id = l.linked_id\n        LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)\n        ORDER BY l.created_at DESC\n    \"\"\", (ticket_id, ticket_id, ticket_id))\n    link_rows = cur.fetchall()\n\n    cur.close()\n    conn.close()\n\n    ticket = {\n        \"id\": row[0],\n        \"title\": row[1],\n        \"description\": row[2],\n        \"requester_name\": row[3],\n        \"requester_email\": row[4],\n        \"department\": row[5],\n        \"category\": row[6],\n        \"subcategory\": row[7],\n        \"priority\": row[8],\n        \"status\": row[9],\n        \"created_at\": str(row[10]),\n        \"updated_at\": str(row[11]),\n        \"assigned_to_email\": row[12],\n        \"assigned_to_name\": row[13],\n        \"sla_due_at\": str(row[14]) if row[14] else \"\",\n        \"resolution_minutes\": row[15],\n        \"closed_at\": str(row[16]) if row[16] else \"\",\n        \"closed_by_email\": row[17] or \"\",\n        \"closed_by_name\": row[18] or \"\",\n        \"resolution_summary\": row[19] or \"\",\n        \"sla_state\": sla_state(row[14], row[9]),\n    }\n    comments = [\n        {\"author\": c[0], \"content\": c[1], \"created_at\": str(c[2]), \"visibility\": c[3] or \"public\"}\n        for c in comment_rows\n    ]\n    events = [\n        {\"actor_name\": e[0], \"event_type\": e[1], \"message\": e[2], \"created_at\": str(e[3])}\n        for e in event_rows\n    ]\n    attachments = [\n        {\n            \"id\": a[0],\n            \"original_filename\": a[1],\n            \"content_type\": a[2] or \"\",\n            \"size_bytes\": a[3],\n            \"uploaded_by_name\": a[4] or \"\",\n            \"created_at\": str(a[5]),\n        }\n        for a in attachment_rows\n    ]\n\n    watchers = [\n        {\n            \"name\": f\"{w[0]} {w[1]}\".strip(),\n            \"email\": w[2],\n            \"department\": w[3],\n            \"role\": role_label(list(w[5] or [\"user\"])),\n            \"roles\": list(w[5] or [\"user\"]),\n            \"created_at\": str(w[6]),\n        }\n        for w in watcher_rows\n    ]\n\n    watcher_candidates = [\n        {\n            \"name\": f\"{w[0]} {w[1]}\".strip(),\n            \"email\": w[2],\n            \"department\": w[3],\n            \"role\": role_label(list(w[5] or [\"user\"])),\n            \"roles\": list(w[5] or [\"user\"]),\n        }\n        for w in watcher_candidate_rows\n    ]\n\n    linked_tickets = []\n    for l in link_rows:\n        linked_id = l[1]\n        if is_staff(user) or can_view_ticket(user, linked_id):\n            linked_tickets.append({\n                \"id\": linked_id,\n                \"title\": l[2],\n                \"status\": l[3],\n                \"requester_name\": l[4] or \"\",\n                \"assigned_to_name\": l[5] or \"\",\n                \"relation_type\": l[6] or \"related\",\n                \"created_at\": str(l[8]),\n            })\n\n    conn2 = get_conn()\n    cur2 = conn2.cursor()\n    cur2.execute(\"\"\"\n        SELECT first_name, last_name, email, role, roles\n        FROM users\n        WHERE 'operator' = ANY(roles)\n        ORDER BY last_name, first_name\n    \"\"\")\n    operators = [\n        {\"name\": f\"{r[0]} {r[1]}\".strip(), \"email\": r[2], \"role\": role_label(list(r[4] or [\"user\"])), \"roles\": list(r[4] or [\"user\"])}\n        for r in cur2.fetchall()\n    ]\n    cur2.close()\n    conn2.close()\n\n    return jsonify({\n        \"ticket\": ticket,\n        \"comments\": comments,\n        \"events\": events,\n        \"attachments\": attachments,\n        \"watchers\": watchers,\n        \"linked_tickets\": linked_tickets,\n        \"meta\": {\"statuses\": STATUSES, \"operators\": operators, \"watcher_candidates\": watcher_candidates},\n    })\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/close\")\n@api_login_required\ndef api_close_ticket(user, ticket_id):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    def parse_int(value, default=0):\n        try:\n            return int(value)\n        except Exception:\n            return default\n\n    hours = max(0, parse_int(request.form.get(\"resolution_hours\"), 0))\n    minutes = max(0, min(59, parse_int(request.form.get(\"resolution_minutes\"), 0)))\n    total_minutes = hours * 60 + minutes\n    resolution_summary = clean(request.form.get(\"resolution_summary\"))\n    visibility = clean(request.form.get(\"visibility\")) or \"public\"\n\n    if visibility not in (\"public\", \"internal\"):\n        visibility = \"public\"\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT status FROM tickets WHERE id = %s\", (ticket_id,))\n    row = cur.fetchone()\n    if not row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n\n    old_status = row[0]\n    if old_status == \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Zgłoszenie jest już zamknięte i dostępne tylko do odczytu.\"}), 400\n\n    uploaded_file = request.files.get(\"file\")\n    attachment_id = None\n    original_filename = None\n\n    if uploaded_file and uploaded_file.filename:\n        original_filename = uploaded_file.filename or \"\"\n        safe_filename = secure_filename(original_filename)\n\n        if not safe_filename:\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Nieprawidłowa nazwa pliku.\"}), 400\n\n        if not allowed_attachment(safe_filename):\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Niedozwolony typ pliku.\"}), 400\n\n        file_bytes = uploaded_file.read()\n        size_bytes = len(file_bytes)\n\n        if size_bytes <= 0:\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Pusty plik.\"}), 400\n\n        if size_bytes > MAX_ATTACHMENT_SIZE:\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Plik jest za duży. Maksymalny rozmiar to 10 MB.\"}), 400\n\n        ticket_dir = os.path.join(ATTACHMENTS_DIR, str(ticket_id))\n        os.makedirs(ticket_dir, exist_ok=True)\n\n        stored_basename = f\"{uuid.uuid4().hex}_{safe_filename}\"\n        stored_filename = f\"{ticket_id}/{stored_basename}\"\n        target_path = attachment_path(stored_filename)\n\n        with open(target_path, \"wb\") as f:\n            f.write(file_bytes)\n\n        cur.execute(\"\"\"\n            INSERT INTO attachments (\n                ticket_id,\n                original_filename,\n                stored_filename,\n                content_type,\n                size_bytes,\n                uploaded_by_email,\n                uploaded_by_name\n            )\n            VALUES (%s, %s, %s, %s, %s, %s, %s)\n            RETURNING id\n        \"\"\", (\n            ticket_id,\n            original_filename,\n            stored_filename,\n            uploaded_file.content_type,\n            size_bytes,\n            user[\"email\"],\n            user[\"name\"],\n        ))\n        attachment_id = cur.fetchone()[0]\n\n    cur.execute(\"\"\"\n        UPDATE tickets\n        SET status = 'Zamknięte',\n            updated_at = NOW(),\n            closed_at = NOW(),\n            closed_by_email = %s,\n            resolution_minutes = %s,\n            resolution_summary = %s\n        WHERE id = %s\n    \"\"\", (user[\"email\"], total_minutes if total_minutes > 0 else None, resolution_summary or None, ticket_id))\n\n    time_text = \"\"\n    if total_minutes > 0:\n        h = total_minutes // 60\n        m = total_minutes % 60\n        if h and m:\n            time_text = f\" Czas rozwiązania: {h}h {m}m.\"\n        elif h:\n            time_text = f\" Czas rozwiązania: {h}h.\"\n        else:\n            time_text = f\" Czas rozwiązania: {m}m.\"\n\n    add_ticket_event(\n        cur,\n        ticket_id,\n        user,\n        \"ticket_closed\",\n        f\"Zgłoszenie zamknięte. Status zmieniony z {old_status} na Zamknięte.{time_text}\"\n    )\n\n    if resolution_summary:\n        cur.execute(\"\"\"\n            INSERT INTO comments (ticket_id, author, content, visibility)\n            VALUES (%s, %s, %s, %s)\n        \"\"\", (ticket_id, user[\"name\"], resolution_summary, visibility))\n        add_ticket_event(\n            cur,\n            ticket_id,\n            user,\n            \"internal_note_added\" if visibility == \"internal\" else \"comment_added\",\n            \"Dodano notatkę końcową przy zamknięciu zgłoszenia.\" if visibility == \"internal\" else \"Dodano komentarz końcowy przy zamknięciu zgłoszenia.\"\n        )\n\n    if attachment_id:\n        add_ticket_event(cur, ticket_id, user, \"attachment_added\", f\"Dodano załącznik przy zamknięciu: {original_filename}\")\n\n    log_audit(cur, user, \"ticket_closed\", \"ticket\", ticket_id, {\n        \"old_status\": old_status,\n        \"resolution_minutes\": total_minutes if total_minutes > 0 else None,\n        \"comment_visibility\": visibility if resolution_summary else None,\n        \"attachment_id\": attachment_id,\n        \"attachment_filename\": original_filename,\n    })\n\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"status_changed\",\n        f\"Zgłoszenie #{ticket_id} zostało zamknięte.\",\n        actor_email=user[\"email\"],\n    )\n\n    if resolution_summary and visibility == \"internal\":\n        create_ticket_notifications(\n            cur,\n            ticket_id,\n            \"internal_note_added\",\n            f\"Dodano notatkę wewnętrzną przy zamknięciu zgłoszenia #{ticket_id}.\",\n            actor_email=user[\"email\"],\n            staff_only=True,\n        )\n    elif resolution_summary:\n        create_ticket_notifications(\n            cur,\n            ticket_id,\n            \"comment_added\",\n            f\"Dodano komentarz końcowy przy zamknięciu zgłoszenia #{ticket_id}.\",\n            actor_email=user[\"email\"],\n        )\n\n    if attachment_id:\n        create_ticket_notifications(\n            cur,\n            ticket_id,\n            \"attachment_added\",\n            f\"Dodano załącznik przy zamknięciu zgłoszenia #{ticket_id}: {original_filename}.\",\n            actor_email=user[\"email\"],\n        )\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} zamknął zgłoszenie #{ticket_id}\", \"status_changed\", ticket_id)\n    return jsonify({\"status\": \"ok\", \"ticket_status\": \"Zamknięte\", \"attachment_id\": attachment_id})\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/reopen\")\n@api_login_required\ndef api_reopen_ticket(user, ticket_id):\n    if not is_admin(user):\n        return jsonify({\"error\": \"admin required\"}), 403\n\n    payload = request.get_json(silent=True) or {}\n    reason = clean(payload.get(\"reason\"))\n\n    if not reason:\n        return jsonify({\"error\": \"Powód ponownego otwarcia jest wymagany.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT status FROM tickets WHERE id = %s\", (ticket_id,))\n    row = cur.fetchone()\n\n    if not row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n\n    old_status = row[0]\n\n    if old_status != \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Tylko zamknięte zgłoszenie można otworzyć ponownie.\"}), 400\n\n    cur.execute(\"\"\"\n        UPDATE tickets\n        SET status = 'Otwarte',\n            updated_at = NOW()\n        WHERE id = %s\n    \"\"\", (ticket_id,))\n\n    add_ticket_event(\n        cur,\n        ticket_id,\n        user,\n        \"ticket_reopened\",\n        f\"Zgłoszenie otwarte ponownie. Powód: {reason}\"\n    )\n\n    log_audit(cur, user, \"ticket_reopened\", \"ticket\", ticket_id, {\n        \"old_status\": old_status,\n        \"new_status\": \"Otwarte\",\n        \"reason\": reason,\n    })\n\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"status_changed\",\n        f\"Zgłoszenie #{ticket_id} zostało otwarte ponownie. Powód: {reason}\",\n        actor_email=user[\"email\"],\n    )\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} otworzył ponownie zgłoszenie #{ticket_id}\", \"status_changed\", ticket_id)\n    return jsonify({\"status\": \"ok\", \"ticket_status\": \"Otwarte\"})\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/status\")\n@api_login_required\ndef api_update_status(user, ticket_id):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    payload = request.get_json(silent=True) or {}\n    status = clean(payload.get(\"status\")) or \"Nowe\"\n    if status not in STATUSES:\n        return jsonify({\"error\": \"Nieprawidłowy status.\"}), 400\n    if status == \"Zamknięte\":\n        return jsonify({\"error\": \"Do zamykania zgłoszenia użyj formularza zamknięcia.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    ok, old_status, error_code = ensure_ticket_mutable(cur, ticket_id)\n    if not ok:\n        cur.close()\n        conn.close()\n        return old_status, error_code\n    cur.execute(\"UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s\", (status, ticket_id))\n    add_ticket_event(cur, ticket_id, user, \"status_changed\", f\"Status zmieniony z {old_status} na {status}\")\n    log_audit(cur, user, \"ticket_status_changed\", \"ticket\", ticket_id, {\n        \"old_status\": old_status,\n        \"new_status\": status,\n    })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"status_changed\",\n        f\"Status zgłoszenia #{ticket_id} zmieniono z {old_status} na {status}.\",\n        actor_email=user[\"email\"],\n    )\n    conn.commit()\n    cur.close()\n    conn.close()\n    publish_event(f\"{user['name']} zmienił status zgłoszenia #{ticket_id} z {old_status} na {status}\", \"status_changed\", ticket_id)\n    return jsonify({\"status\": \"ok\"})\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/assign\")\n@api_login_required\ndef api_assign_ticket(user, ticket_id):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    payload = request.get_json(silent=True) or {}\n    assigned_to_email = clean(payload.get(\"assigned_to_email\")).lower()\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT assigned_to_email, status FROM tickets WHERE id = %s\", (ticket_id,))\n    ticket_row = cur.fetchone()\n    if not ticket_row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n    if ticket_row[1] == \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Zgłoszenie jest zamknięte i dostępne tylko do odczytu.\"}), 400\n\n    old_assigned = ticket_row[0]\n\n    assigned_to_name = \"Nieprzypisane\"\n    if assigned_to_email:\n        cur.execute(\"\"\"\n            SELECT first_name, last_name, email, roles\n            FROM users\n            WHERE lower(email) = %s AND 'operator' = ANY(roles)\n        \"\"\", (assigned_to_email,))\n        operator_row = cur.fetchone()\n        if not operator_row:\n            cur.close()\n            conn.close()\n            return jsonify({\"error\": \"Można przypisać tylko do operatora.\"}), 400\n        assigned_to_email = operator_row[2]\n        assigned_to_name = f\"{operator_row[0]} {operator_row[1]}\".strip()\n\n    cur.execute(\"\"\"\n        UPDATE tickets\n        SET assigned_to_email = %s, updated_at = NOW()\n        WHERE id = %s\n    \"\"\", (assigned_to_email or None, ticket_id))\n\n    if assigned_to_email:\n        add_ticket_watcher(cur, ticket_id, assigned_to_email, user[\"email\"])\n\n    assignment_message = f\"Przypisanie zmienione z {old_assigned or 'Nieprzypisane'} na {assigned_to_name}\"\n    add_ticket_event(\n        cur,\n        ticket_id,\n        user,\n        \"assignment_changed\",\n        assignment_message\n    )\n    log_audit(cur, user, \"ticket_assigned\", \"ticket\", ticket_id, {\n        \"old_assigned_to_email\": old_assigned,\n        \"new_assigned_to_email\": assigned_to_email or None,\n        \"new_assigned_to_name\": assigned_to_name,\n    })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"assignment_changed\",\n        f\"Zmieniono przypisanie zgłoszenia #{ticket_id}: {assigned_to_name}.\",\n        actor_email=user[\"email\"],\n    )\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} przypisał zgłoszenie #{ticket_id} do: {assigned_to_name}\", \"assignment_changed\", ticket_id)\n    return jsonify({\"status\": \"ok\"})\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/watchers\")\n@api_login_required\ndef api_add_watcher(user, ticket_id):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    payload = request.get_json(silent=True) or {}\n    watcher_email = clean(payload.get(\"user_email\") or payload.get(\"email\")).lower()\n    if not watcher_email:\n        return jsonify({\"error\": \"Wybierz obserwatora.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT title, status FROM tickets WHERE id = %s\", (ticket_id,))\n    ticket_row = cur.fetchone()\n    if not ticket_row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n    if ticket_row[1] == \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Zgłoszenie jest zamknięte i dostępne tylko do odczytu.\"}), 400\n\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email, roles\n        FROM users\n        WHERE lower(email) = %s\n    \"\"\", (watcher_email,))\n    watcher_row = cur.fetchone()\n    if not watcher_row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie znaleziono użytkownika.\"}), 404\n\n    watcher_email = watcher_row[2]\n    watcher_name = f\"{watcher_row[0]} {watcher_row[1]}\".strip()\n\n    add_ticket_watcher(cur, ticket_id, watcher_email, user[\"email\"])\n    add_ticket_event(cur, ticket_id, user, \"watcher_added\", f\"Dodano obserwatora: {watcher_name}\")\n    log_audit(cur, user, \"ticket_watcher_added\", \"ticket\", ticket_id, {\n        \"watcher_email\": watcher_email,\n        \"watcher_name\": watcher_name,\n    })\n    create_notifications(\n        cur,\n        {watcher_email},\n        ticket_id,\n        \"watcher_added\",\n        f\"Dodano Cię jako obserwatora zgłoszenia #{ticket_id}: {ticket_row[0]}.\",\n        actor_email=user[\"email\"],\n    )\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} dodał obserwatora do zgłoszenia #{ticket_id}: {watcher_name}\", \"watcher_changed\", ticket_id)\n    return jsonify({\"status\": \"ok\"}), 201\n\n\n@app.delete(\"/api/tickets/<int:ticket_id>/watchers/<path:watcher_email>\")\n@api_login_required\ndef api_remove_watcher(user, ticket_id, watcher_email):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    watcher_email = clean(watcher_email).lower()\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"SELECT assigned_to_email, status FROM tickets WHERE id = %s\", (ticket_id,))\n    ticket_row = cur.fetchone()\n    if not ticket_row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n    if ticket_row[1] == \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Zgłoszenie jest zamknięte i dostępne tylko do odczytu.\"}), 400\n\n    if ticket_row[0] and watcher_email == ticket_row[0].lower():\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Przypisany operator pozostaje obserwatorem zgłoszenia.\"}), 400\n\n    cur.execute(\"\"\"\n        SELECT first_name, last_name, email\n        FROM users\n        WHERE lower(email) = %s\n    \"\"\", (watcher_email,))\n    watcher_row = cur.fetchone()\n    watcher_name = watcher_email\n    if watcher_row:\n        watcher_email = watcher_row[2]\n        watcher_name = f\"{watcher_row[0]} {watcher_row[1]}\".strip()\n\n    cur.execute(\"\"\"\n        DELETE FROM ticket_watchers\n        WHERE ticket_id = %s AND lower(user_email) = %s\n    \"\"\", (ticket_id, watcher_email.lower()))\n    add_ticket_event(cur, ticket_id, user, \"watcher_removed\", f\"Usunięto obserwatora: {watcher_name}\")\n    log_audit(cur, user, \"ticket_watcher_removed\", \"ticket\", ticket_id, {\n        \"watcher_email\": watcher_email,\n        \"watcher_name\": watcher_name,\n    })\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} usunął obserwatora ze zgłoszenia #{ticket_id}: {watcher_name}\", \"watcher_changed\", ticket_id)\n    return jsonify({\"status\": \"ok\"})\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/links\")\n@api_login_required\ndef api_add_ticket_link(user, ticket_id):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    payload = request.get_json(silent=True) or {}\n    linked_ticket_id_raw = payload.get(\"linked_ticket_id\") or payload.get(\"ticket_id\")\n    try:\n        linked_ticket_id = int(linked_ticket_id_raw)\n    except Exception:\n        return jsonify({\"error\": \"Podaj poprawne ID zgłoszenia.\"}), 400\n\n    if linked_ticket_id == ticket_id:\n        return jsonify({\"error\": \"Nie można powiązać zgłoszenia z samym sobą.\"}), 400\n\n    relation_type = clean(payload.get(\"relation_type\")) or \"related\"\n    if relation_type not in (\"related\",):\n        relation_type = \"related\"\n\n    a_id = min(ticket_id, linked_ticket_id)\n    b_id = max(ticket_id, linked_ticket_id)\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT id, title, status\n        FROM tickets\n        WHERE id IN (%s, %s)\n    \"\"\", (ticket_id, linked_ticket_id))\n    rows = cur.fetchall()\n    titles = {r[0]: r[1] for r in rows}\n    statuses = {r[0]: r[2] for r in rows}\n    if ticket_id not in titles or linked_ticket_id not in titles:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie znaleziono jednego ze zgłoszeń.\"}), 404\n    if statuses.get(ticket_id) == \"Zamknięte\" or statuses.get(linked_ticket_id) == \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie można zmieniać powiązań zamkniętego zgłoszenia.\"}), 400\n\n    cur.execute(\"\"\"\n        INSERT INTO ticket_links (ticket_id, linked_ticket_id, relation_type, created_by_email)\n        VALUES (%s, %s, %s, %s)\n        ON CONFLICT (ticket_id, linked_ticket_id, relation_type) DO NOTHING\n        RETURNING id\n    \"\"\", (a_id, b_id, relation_type, user[\"email\"]))\n    inserted = cur.fetchone()\n\n    if not inserted:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Te zgłoszenia są już powiązane.\"}), 409\n\n    add_ticket_event(\n        cur,\n        ticket_id,\n        user,\n        \"ticket_link_added\",\n        f\"Powiązano ze zgłoszeniem #{linked_ticket_id}: {titles[linked_ticket_id]}\"\n    )\n    add_ticket_event(\n        cur,\n        linked_ticket_id,\n        user,\n        \"ticket_link_added\",\n        f\"Powiązano ze zgłoszeniem #{ticket_id}: {titles[ticket_id]}\"\n    )\n    log_audit(cur, user, \"ticket_link_added\", \"ticket\", ticket_id, {\n        \"linked_ticket_id\": linked_ticket_id,\n        \"ticket_title\": titles[ticket_id],\n        \"linked_ticket_title\": titles[linked_ticket_id],\n        \"relation_type\": relation_type,\n    })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"ticket_link_changed\",\n        f\"Zgłoszenie #{ticket_id}: {titles[ticket_id]} powiązano ze zgłoszeniem #{linked_ticket_id}: {titles[linked_ticket_id]}.\",\n        actor_email=user[\"email\"],\n    )\n    create_ticket_notifications(\n        cur,\n        linked_ticket_id,\n        \"ticket_link_changed\",\n        f\"Zgłoszenie #{linked_ticket_id}: {titles[linked_ticket_id]} powiązano ze zgłoszeniem #{ticket_id}: {titles[ticket_id]}.\",\n        actor_email=user[\"email\"],\n    )\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} powiązał zgłoszenie #{ticket_id} ze zgłoszeniem #{linked_ticket_id}\", \"ticket_link_changed\", ticket_id)\n    publish_event(f\"{user['name']} powiązał zgłoszenie #{linked_ticket_id} ze zgłoszeniem #{ticket_id}\", \"ticket_link_changed\", linked_ticket_id)\n    return jsonify({\"status\": \"ok\"}), 201\n\n\n@app.delete(\"/api/tickets/<int:ticket_id>/links/<int:linked_ticket_id>\")\n@api_login_required\ndef api_remove_ticket_link(user, ticket_id, linked_ticket_id):\n    if not is_staff(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    if linked_ticket_id == ticket_id:\n        return jsonify({\"error\": \"Nieprawidłowe powiązanie.\"}), 400\n\n    a_id = min(ticket_id, linked_ticket_id)\n    b_id = max(ticket_id, linked_ticket_id)\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT id, title, status\n        FROM tickets\n        WHERE id IN (%s, %s)\n    \"\"\", (ticket_id, linked_ticket_id))\n    rows = cur.fetchall()\n    titles = {r[0]: r[1] for r in rows}\n    statuses = {r[0]: r[2] for r in rows}\n    if ticket_id not in titles or linked_ticket_id not in titles:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie znaleziono jednego ze zgłoszeń.\"}), 404\n    if statuses.get(ticket_id) == \"Zamknięte\" or statuses.get(linked_ticket_id) == \"Zamknięte\":\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Nie można zmieniać powiązań zamkniętego zgłoszenia.\"}), 400\n\n    cur.execute(\"\"\"\n        DELETE FROM ticket_links\n        WHERE ticket_id = %s AND linked_ticket_id = %s AND relation_type = 'related'\n    \"\"\", (a_id, b_id))\n\n    if cur.rowcount == 0:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"Powiązanie nie istnieje.\"}), 404\n\n    add_ticket_event(\n        cur,\n        ticket_id,\n        user,\n        \"ticket_link_removed\",\n        f\"Usunięto powiązanie ze zgłoszeniem #{linked_ticket_id}: {titles[linked_ticket_id]}\"\n    )\n    add_ticket_event(\n        cur,\n        linked_ticket_id,\n        user,\n        \"ticket_link_removed\",\n        f\"Usunięto powiązanie ze zgłoszeniem #{ticket_id}: {titles[ticket_id]}\"\n    )\n    log_audit(cur, user, \"ticket_link_removed\", \"ticket\", ticket_id, {\n        \"linked_ticket_id\": linked_ticket_id,\n        \"ticket_title\": titles[ticket_id],\n        \"linked_ticket_title\": titles[linked_ticket_id],\n    })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"ticket_link_changed\",\n        f\"Usunięto powiązanie zgłoszenia #{ticket_id}: {titles[ticket_id]} ze zgłoszeniem #{linked_ticket_id}: {titles[linked_ticket_id]}.\",\n        actor_email=user[\"email\"],\n    )\n    create_ticket_notifications(\n        cur,\n        linked_ticket_id,\n        \"ticket_link_changed\",\n        f\"Usunięto powiązanie zgłoszenia #{linked_ticket_id}: {titles[linked_ticket_id]} ze zgłoszeniem #{ticket_id}: {titles[ticket_id]}.\",\n        actor_email=user[\"email\"],\n    )\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} usunął powiązanie zgłoszenia #{ticket_id} ze zgłoszeniem #{linked_ticket_id}\", \"ticket_link_changed\", ticket_id)\n    publish_event(f\"{user['name']} usunął powiązanie zgłoszenia #{linked_ticket_id} ze zgłoszeniem #{ticket_id}\", \"ticket_link_changed\", linked_ticket_id)\n    return jsonify({\"status\": \"ok\"})\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/comments\")\n@api_login_required\ndef api_add_comment(user, ticket_id):\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    payload = request.get_json(silent=True) or {}\n    content = clean(payload.get(\"content\"))\n    visibility = clean(payload.get(\"visibility\")) or \"public\"\n\n    if not is_staff(user):\n        visibility = \"public\"\n\n    if visibility not in (\"public\", \"internal\"):\n        visibility = \"public\"\n\n    if not content:\n        return jsonify({\"error\": \"content is required\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    ok, ticket_status, error_code = ensure_ticket_mutable(cur, ticket_id)\n    if not ok:\n        cur.close()\n        conn.close()\n        return ticket_status, error_code\n\n    event_type = \"internal_note_added\" if visibility == \"internal\" else \"comment_added\"\n    event_message = (\n        f\"Dodano notatkę wewnętrzną: {content[:120]}\"\n        if visibility == \"internal\"\n        else f\"Dodano komentarz publiczny: {content[:120]}\"\n    )\n\n    cur.execute(\"\"\"\n        INSERT INTO comments (ticket_id, author, content, visibility)\n        VALUES (%s, %s, %s, %s)\n    \"\"\", (ticket_id, user[\"name\"], content, visibility))\n    cur.execute(\"UPDATE tickets SET updated_at = NOW() WHERE id = %s\", (ticket_id,))\n    add_ticket_event(cur, ticket_id, user, event_type, event_message)\n    if visibility == \"internal\":\n        log_audit(cur, user, \"internal_note_added\", \"ticket\", ticket_id, {\n            \"content_preview\": content[:120],\n        })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        event_type,\n        (\n            f\"Dodano notatkę wewnętrzną do zgłoszenia #{ticket_id}.\"\n            if visibility == \"internal\"\n            else f\"Dodano komentarz do zgłoszenia #{ticket_id}.\"\n        ),\n        actor_email=user[\"email\"],\n        staff_only=(visibility == \"internal\"),\n    )\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    if visibility == \"public\":\n        publish_event(f\"{user['name']} dodał komentarz do zgłoszenia #{ticket_id}\", \"comment_added\", ticket_id)\n    else:\n        # Nie publikujemy treści notatki wewnętrznej globalnie do zwykłych użytkowników.\n        # Widok operatorów/adminów odświeży się po wejściu w zgłoszenie albo po kolejnej akcji.\n        publish_event(f\"{user['name']} dodał notatkę wewnętrzną do zgłoszenia #{ticket_id}\", \"internal_note_added\", ticket_id, staff_only=True)\n\n    return jsonify({\"status\": \"ok\", \"visibility\": visibility})\n\n\n@app.get(\"/api/tickets/<int:ticket_id>/attachments\")\n@api_login_required\ndef api_ticket_attachments(user, ticket_id):\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT id, original_filename, content_type, size_bytes, uploaded_by_name, created_at\n        FROM attachments\n        WHERE ticket_id = %s\n        ORDER BY id DESC\n    \"\"\", (ticket_id,))\n    rows = cur.fetchall()\n    cur.close()\n    conn.close()\n\n    return jsonify({\n        \"attachments\": [\n            {\n                \"id\": r[0],\n                \"original_filename\": r[1],\n                \"content_type\": r[2] or \"\",\n                \"size_bytes\": r[3],\n                \"uploaded_by_name\": r[4] or \"\",\n                \"created_at\": str(r[5]),\n            }\n            for r in rows\n        ]\n    })\n\n\n@app.post(\"/api/tickets/<int:ticket_id>/attachments\")\n@api_login_required\ndef api_upload_attachment(user, ticket_id):\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    if \"file\" not in request.files:\n        return jsonify({\"error\": \"Brak pliku.\"}), 400\n\n    uploaded_file = request.files[\"file\"]\n    original_filename = uploaded_file.filename or \"\"\n    safe_filename = secure_filename(original_filename)\n\n    if not safe_filename:\n        return jsonify({\"error\": \"Nieprawidłowa nazwa pliku.\"}), 400\n\n    if not allowed_attachment(safe_filename):\n        return jsonify({\"error\": \"Niedozwolony typ pliku.\"}), 400\n\n    file_bytes = uploaded_file.read()\n    size_bytes = len(file_bytes)\n\n    if size_bytes <= 0:\n        return jsonify({\"error\": \"Pusty plik.\"}), 400\n\n    if size_bytes > MAX_ATTACHMENT_SIZE:\n        return jsonify({\"error\": \"Plik jest za duży. Maksymalny rozmiar to 10 MB.\"}), 400\n\n    conn = get_conn()\n    cur = conn.cursor()\n    ok, ticket_status, error_code = ensure_ticket_mutable(cur, ticket_id)\n    if not ok:\n        cur.close()\n        conn.close()\n        return ticket_status, error_code\n\n    ticket_dir = os.path.join(ATTACHMENTS_DIR, str(ticket_id))\n    os.makedirs(ticket_dir, exist_ok=True)\n\n    stored_basename = f\"{uuid.uuid4().hex}_{safe_filename}\"\n    stored_filename = f\"{ticket_id}/{stored_basename}\"\n    target_path = attachment_path(stored_filename)\n\n    with open(target_path, \"wb\") as f:\n        f.write(file_bytes)\n\n    cur.execute(\"\"\"\n        INSERT INTO attachments (\n            ticket_id,\n            original_filename,\n            stored_filename,\n            content_type,\n            size_bytes,\n            uploaded_by_email,\n            uploaded_by_name\n        )\n        VALUES (%s, %s, %s, %s, %s, %s, %s)\n        RETURNING id\n    \"\"\", (\n        ticket_id,\n        original_filename,\n        stored_filename,\n        uploaded_file.content_type,\n        size_bytes,\n        user[\"email\"],\n        user[\"name\"],\n    ))\n    attachment_id = cur.fetchone()[0]\n\n    cur.execute(\"UPDATE tickets SET updated_at = NOW() WHERE id = %s\", (ticket_id,))\n    add_ticket_event(cur, ticket_id, user, \"attachment_added\", f\"Dodano załącznik: {original_filename}\")\n    log_audit(cur, user, \"attachment_added\", \"ticket\", ticket_id, {\n        \"attachment_id\": attachment_id,\n        \"original_filename\": original_filename,\n        \"size_bytes\": size_bytes,\n    })\n    create_ticket_notifications(\n        cur,\n        ticket_id,\n        \"attachment_added\",\n        f\"Dodano załącznik do zgłoszenia #{ticket_id}: {original_filename}.\",\n        actor_email=user[\"email\"],\n    )\n\n    conn.commit()\n    cur.close()\n    conn.close()\n\n    publish_event(f\"{user['name']} dodał załącznik do zgłoszenia #{ticket_id}: {original_filename}\", \"attachment_added\", ticket_id)\n    return jsonify({\"status\": \"ok\", \"attachment_id\": attachment_id}), 201\n\n\n@app.get(\"/api/attachments/<int:attachment_id>/download\")\n@api_login_required\ndef api_download_attachment(user, attachment_id):\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT ticket_id, original_filename, stored_filename, content_type\n        FROM attachments\n        WHERE id = %s\n    \"\"\", (attachment_id,))\n    row = cur.fetchone()\n    cur.close()\n    conn.close()\n\n    if not row:\n        return jsonify({\"error\": \"not found\"}), 404\n\n    ticket_id, original_filename, stored_filename, content_type = row\n\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n\n    try:\n        target_path = attachment_path(stored_filename)\n    except ValueError:\n        return jsonify({\"error\": \"invalid attachment path\"}), 400\n\n    if not os.path.exists(target_path):\n        return jsonify({\"error\": \"file not found\"}), 404\n\n    return send_file(\n        target_path,\n        as_attachment=True,\n        download_name=original_filename,\n        mimetype=content_type or \"application/octet-stream\",\n    )\n"
