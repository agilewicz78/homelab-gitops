            SELECT t.id, t.title, t.description, t.requester_name, t.requester_email, t.department,
                   t.category, COALESCE(t.subcategory, 'Inne') AS subcategory, t.priority, t.status, t.created_at, t.updated_at, t.assigned_to_email,
                   COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
                   t.sla_due_at,
                   t.resolution_minutes,
                   t.closed_at,
