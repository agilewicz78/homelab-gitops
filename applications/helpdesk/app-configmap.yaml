    def get_conn():
        return psycopg2.connect(
            host=DB_HOST,
            port=DB_PORT,
            dbname=DB_NAME,
            user=DB_USER,
            password=DB_PASSWORD,
        )

    def init_db():
        for _ in range(40):
            try:
                conn = get_conn()
                cur = conn.cursor()

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS users (
                        id SERIAL PRIMARY KEY,
                        first_name TEXT NOT NULL,
                        last_name TEXT NOT NULL,
                        email TEXT UNIQUE NOT NULL,
                        department TEXT NOT NULL,
                        role TEXT NOT NULL DEFAULT 'user',
                        password_hash TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS first_name TEXT")
                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS last_name TEXT")
                cur.execute("""
                    SELECT EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_name = 'users' AND column_name = 'full_name'
                    )
                """)
                has_full_name = cur.fetchone()[0]
                if has_full_name:
                    cur.execute("""
                        UPDATE users
                        SET
                          first_name = COALESCE(NULLIF(first_name, ''), split_part(full_name, ' ', 1)),
                          last_name = COALESCE(
                            NULLIF(last_name, ''),
                            NULLIF(trim(substr(full_name, length(split_part(full_name, ' ', 1)) + 1)), ''),
                            '-'
                          )
                        WHERE first_name IS NULL OR first_name = '' OR last_name IS NULL OR last_name = ''
                    """)
                    cur.execute("ALTER TABLE users DROP COLUMN IF EXISTS full_name")
                cur.execute("UPDATE users SET first_name = 'Nieznane' WHERE first_name IS NULL OR first_name = ''")
                cur.execute("UPDATE users SET last_name = '-' WHERE last_name IS NULL OR last_name = ''")

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS user_sessions (
                        sid TEXT PRIMARY KEY,
                        user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,
                        created_at TIMESTAMP DEFAULT NOW(),
                        last_seen TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS tickets (
                        id SERIAL PRIMARY KEY,
                        title TEXT NOT NULL,
                        description TEXT NOT NULL,
                        requester_name TEXT NOT NULL,
                        requester_email TEXT NOT NULL,
                        department TEXT NOT NULL,
                        category TEXT NOT NULL,
                        priority TEXT NOT NULL,
                        status TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW(),
                        updated_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS comments (
                        id SERIAL PRIMARY KEY,
                        ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,
                        author TEXT NOT NULL,
                        content TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                password_hash = generate_password_hash(INITIAL_PASSWORD)
                for first_name, last_name, email, department, role in SEED_USERS:
                    cur.execute("""
                        INSERT INTO users (first_name, last_name, email, department, role, password_hash)
                        VALUES (%s, %s, %s, %s, %s, %s)
                        ON CONFLICT (email) DO NOTHING
                    """, (first_name, last_name, email, department, role, password_hash))

                cur.execute("SELECT COUNT(*) FROM tickets")
                count = cur.fetchone()[0]
                if count == 0:
                    for ticket in SEED_TICKETS:
                        cur.execute("""
                            INSERT INTO tickets (
                                title, description, requester_name, requester_email,
                                department, category, priority, status
                            )
                            VALUES (%s, %s, %s, %s, %s, %s, %s, %s)
                        """, ticket)

                conn.commit()
                cur.close()
                conn.close()
                return
            except Exception as e:
                print(f"Waiting for database: {e}", flush=True)
                time.sleep(1)
        raise RuntimeError("Database unavailable")

    init_db()

    def esc(value):
        return html.escape(str(value or ""))

    def clean(value):
        return str(value or "").strip()

    def get_sid_from_request():
        return request.headers.get("X-Helpdesk-Session", "").strip()

    def get_user_by_sid(sid):
        if not sid:
            return None
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT u.first_name, u.last_name, u.email, u.department, u.role
            FROM user_sessions s
            JOIN users u ON u.email = s.user_email
            WHERE s.sid = %s
        """, (sid,))
        row = cur.fetchone()
        if row:
            cur.execute("UPDATE user_sessions SET last_seen = NOW() WHERE sid = %s", (sid,))
            conn.commit()
        cur.close()
        conn.close()
        if not row:
            return None
        return {
            "first_name": row[0],
            "last_name": row[1],
            "name": f"{row[0]} {row[1]}".strip(),
            "email": row[2],
            "department": row[3],
            "role": row[4],
        }

    def current_user():
        return get_user_by_sid(get_sid_from_request())

    def api_login_required(fn):
        @wraps(fn)
        def wrapper(*args, **kwargs):
            user = current_user()
            if not user:
                return jsonify({"error": "unauthorized"}), 401
            return fn(user, *args, **kwargs)
        return wrapper

    def is_admin(user):
        return bool(user and user.get("role") == "admin")

    def publish_event(message, event_type="info", ticket_id=None):
        global last_live_event
        last_live_event = {
            "id": str(uuid.uuid4()),
            "type": event_type,
            "message": message,
            "ticket_id": ticket_id,
            "timestamp": time.strftime("%Y-%m-%d %H:%M:%S"),
        }

    def api_admin_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not is_admin(user):
                return jsonify({"error": "admin required"}), 403
            return fn(user, *args, **kwargs)
        return wrapper

