    : \"forbidden\"}), 403\n    payload = request.get_json(silent=True) or {}\n    content = clean(payload.get(\"content\"))\n    visibility = clean(payload.get(\"visibility\")) or \"public\"\n    if not is_staff(user):\n        visibility = \"public\"\n    if visibility not in (\"public\", \"internal\"):\n        visibility = \"public\"\n    if not content:\n        return jsonify({\"error\": \"content is required\"}), 400\n    conn = get_conn()\n    cur = conn.cursor()\n    ok, ticket_status, error_code = ensure_ticket_mutable(cur, ticket_id)\n    if not ok:\n        cur.close()\n        conn.close()\n        return ticket_status, error_code\n    event_type = \"internal_note_added\" if visibility == \"internal\" else \"comment_added\"\n    event_message = (\n        f\"Dodano notatkę wewnętrzną: {content[:120]}\"\n        if visibility == \"internal\"\n        else f\"Dodano komentarz publiczny: {content[:120]}\"\n    )\n    cur.execute(\"\"\"\n        INSERT INTO comments (ticket_id,\
