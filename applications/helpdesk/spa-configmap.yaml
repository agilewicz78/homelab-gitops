                <td>${e.ticket_id ? `<button class="btn-link" onclick="renderTicket(${Number(e.ticket_id)})">#${e.ticket_id}</button>` : "-"}<br><span class="muted">${esc(e.ticket_title || "")}</span></td>
                <td>${esc(e.event_type || "-")}<br><span class="muted">${esc(e.current_status || "-")}${e.event_new_status ? " → " + esc(e.event_new_status) : ""}</span></td>
                <td>${esc(e.actor_name || e.actor_email || "System")}<br><span class="muted">${esc(e.actor_email || "")}</span></td>
                <td>${e.matched ? `<span class="status-badge status-new">Dopasowana</span>` : `<span class="status-badge status-closed">Niedopasowana</span>`}</td>
                <td>
                  <div>${esc(workflowRuleExecutionActionSummary(e.actions_executed))}</div>
                  <details style="margin-top:6px"><summary>Szczegóły akcji</summary>${workflowRuleExecutionActionDetails(e.actions_executed)}</details>
                </td>
                <td>${esc(e.reason || "")}</td>
                <td>${esc(e.created_at || "")}</td>
              </tr>
            `).join("");
            const content = document.getElementById("workflowRuleExecutionContent");
            if (content) {
              content.innerHTML = `<table><thead><tr><th>Reguła / workflow</th><th>Zgłoszenie</th><th>Zdarzenie / status</th><th>Wykonawca</th><th>Wynik</th><th>Akcje</th><th>Powód</th><th>Data</th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="muted">Brak wpisów logu.</td></tr>`}</tbody></table>`;
            }
          } catch (err) {
            const content = document.getElementById("workflowRuleExecutionContent");
            const msg = err && err.name === "AbortError" ? "Przekroczono czas oczekiwania na odpowiedź API logu." : (err && err.message ? err.message : String(err));
            if (content) {
              content.innerHTML = `<div class="error"><strong>Nie udało się załadować logu automatyzacji.</strong><br>${esc(msg)}</div>`;
            } else {
              appEl.innerHTML = `<section class="card"><button class="btn-secondary" onclick="${backTarget}">${backLabel}</button><h2>Błąd logu automatyzacji</h2><p class="error">${esc(msg)}</p></section>`;
            }
          }
        }
