        function workflowRuleExecutionActionSummary(actions) {{
          if (!actions) return "—";
          if (typeof actions === "string") return actions;
          if (!Array.isArray(actions)) return JSON.stringify(actions);
          if (!actions.length) return "—";
          return actions.map(a => {{
            const type = a.action_type || "akcja";
            const result = a.result || "";
            if (type === "change_status" && a.result === "executed") return `zmiana statusu: ${{a.old_status || "?"}} → ${{a.new_status || "?"}}`;
            if (type === "change_status") return `zmiana statusu: ${{result}} ${{a.reason ? "(" + a.reason + ")" : ""}}`;
            if (type === "notify") return `powiadomienie: ${{result}}`;
            if (type === "add_history") return `historia: ${{result}}`;
            return `${{type}}: ${{result}}`;
          }}).join("; ");
        }}
