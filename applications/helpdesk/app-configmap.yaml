    import os
    import time
    import html
    import psycopg2
    from flask import Flask, request, redirect, Response

    app = Flask(__name__)

    DB_HOST = os.getenv("DB_HOST", "helpdesk-postgres")
    DB_PORT = os.getenv("DB_PORT", "5432")
    DB_NAME = os.getenv("POSTGRES_DB", "helpdeskdb")
    DB_USER = os.getenv("POSTGRES_USER", "helpdeskuser")
    DB_PASSWORD = os.getenv("POSTGRES_PASSWORD")

    DEPARTMENTS = [
