            <section class="card">
              <h3>Komentarze</h3>
              ${{comments}}
              <form id="commentForm">
                <label>Komentarz</label>
                <textarea name="content" required></textarea>
                ${{canWorkTickets(me) ? `
                  <div class="switch-row">
                    <div>
                      <strong>Notatka wewnętrzna</strong>
                      <small>Widoczna tylko dla operatorów i administratorów.</small>
