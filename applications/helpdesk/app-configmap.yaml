    def normalize_single_workflow_automation_payload(payload, steps, workflow_category="*", workflow_subcategory="*"):
        normalized = normalize_workflow_automations(
            {"automations": [payload or {}]},
            steps,
            workflow_category=workflow_category,
            workflow_subcategory=workflow_subcategory,
        )
        if not normalized:
            return None, "Nieprawidłowa reguła automatyzacji workflow albo brak poprawnych akcji."
        return normalized[0], None
    def insert_workflow_automation(cur, workflow_id, item):
