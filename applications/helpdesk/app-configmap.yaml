    def can_view_ticket(user, ticket_id):
        if not user:
            return False

        # Operatorzy i admini mogą widzieć wszystkie zgłoszenia oraz ich załączniki.
        if is_staff(user):
            return True

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT requester_email, assigned_to_email
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        row = cur.fetchone()
        cur.close()
        conn.close()

        if not row:
            return False

        requester_email, assigned_to_email = row
        user_email = (user.get("email") or "").lower()

        return bool(
            user_email
            and (
                user_email == (requester_email or "").lower()
                or user_email == (assigned_to_email or "").lower()
            )
        )

    @app.get("/api/tickets/<int:ticket_id>")
    @api_login_required
    def api_ticket_detail(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT t.id, t.title, t.description, t.requester_name, t.requester_email, t.department,
                   t.category, t.priority, t.status, t.created_at, t.updated_at, t.assigned_to_email,
                   COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
                   t.sla_due_at
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            WHERE t.id = %s
        """, (ticket_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404

        if is_staff(user):
            cur.execute("""
                SELECT author, content, created_at, COALESCE(visibility, 'public') AS visibility
                FROM comments
                WHERE ticket_id = %s
                ORDER BY id ASC
            """, (ticket_id,))
        else:
            cur.execute("""
                SELECT author, content, created_at, COALESCE(visibility, 'public') AS visibility
                FROM comments
                WHERE ticket_id = %s
                  AND COALESCE(visibility, 'public') = 'public'
                ORDER BY id ASC
            """, (ticket_id,))
        comment_rows = cur.fetchall()

        cur.execute("""
            SELECT actor_name, event_type, message, created_at
            FROM ticket_events
            WHERE ticket_id = %s
            ORDER BY id ASC
        """, (ticket_id,))
        event_rows = cur.fetchall()

        cur.execute("""
            SELECT id, original_filename, content_type, size_bytes, uploaded_by_name, created_at
            FROM attachments
            WHERE ticket_id = %s
            ORDER BY id DESC
        """, (ticket_id,))
        attachment_rows = cur.fetchall()

        cur.close()
        conn.close()

        ticket = {
            "id": row[0],
            "title": row[1],
            "description": row[2],
            "requester_name": row[3],
            "requester_email": row[4],
            "department": row[5],
            "category": row[6],
            "priority": row[7],
            "status": row[8],
            "created_at": str(row[9]),
            "updated_at": str(row[10]),
            "assigned_to_email": row[11],
            "assigned_to_name": row[12],
            "sla_due_at": str(row[13]) if row[13] else "",
            "sla_state": sla_state(row[13], row[8]),
        }
        comments = [
            {"author": c[0], "content": c[1], "created_at": str(c[2]), "visibility": c[3] or "public"}
            for c in comment_rows
        ]
        events = [
            {"actor_name": e[0], "event_type": e[1], "message": e[2], "created_at": str(e[3])}
            for e in event_rows
        ]
        attachments = [
            {
                "id": a[0],
                "original_filename": a[1],
                "content_type": a[2] or "",
                "size_bytes": a[3],
                "uploaded_by_name": a[4] or "",
                "created_at": str(a[5]),
            }
            for a in attachment_rows
        ]

        conn2 = get_conn()
        cur2 = conn2.cursor()
        cur2.execute("""
            SELECT first_name, last_name, email, role, roles
            FROM users
            WHERE 'operator' = ANY(roles)
            ORDER BY last_name, first_name
        """)
        operators = [
            {"name": f"{r[0]} {r[1]}".strip(), "email": r[2], "role": role_label(list(r[4] or ["user"])), "roles": list(r[4] or ["user"])}
            for r in cur2.fetchall()
        ]
        cur2.close()
        conn2.close()

        return jsonify({
            "ticket": ticket,
            "comments": comments,
            "events": events,
            "attachments": attachments,
            "meta": {"statuses": STATUSES, "operators": operators},
        })

    @app.post("/api/tickets/<int:ticket_id>/status")
    @api_login_required
    def api_update_status(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        status = clean(payload.get("status")) or "Nowe"
        if status not in STATUSES:
            return jsonify({"error": "Nieprawidłowy status."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT status FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        old_status = row[0]
        cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (status, ticket_id))
        add_ticket_event(cur, ticket_id, user, "status_changed", f"Status zmieniony z {old_status} na {status}")
        create_ticket_notifications(
            cur,
            ticket_id,
            "status_changed",
            f"Status zgłoszenia #{ticket_id} zmieniono z {old_status} na {status}.",
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} zmienił status zgłoszenia #{ticket_id} z {old_status} na {status}", "status_changed", ticket_id)
        return jsonify({"status": "ok"})


    @app.post("/api/tickets/<int:ticket_id>/assign")
    @api_login_required
    def api_assign_ticket(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403

        payload = request.get_json(silent=True) or {}
        assigned_to_email = clean(payload.get("assigned_to_email")).lower()

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT assigned_to_email FROM tickets WHERE id = %s", (ticket_id,))
        ticket_row = cur.fetchone()
        if not ticket_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404

        old_assigned = ticket_row[0]

        assigned_to_name = "Nieprzypisane"
        if assigned_to_email:
            cur.execute("""
                SELECT first_name, last_name, email, roles
                FROM users
                WHERE lower(email) = %s AND 'operator' = ANY(roles)
            """, (assigned_to_email,))
            operator_row = cur.fetchone()
            if not operator_row:
                cur.close()
                conn.close()
                return jsonify({"error": "Można przypisać tylko do operatora."}), 400
            assigned_to_email = operator_row[2]
            assigned_to_name = f"{operator_row[0]} {operator_row[1]}".strip()

        cur.execute("""
            UPDATE tickets
            SET assigned_to_email = %s, updated_at = NOW()
            WHERE id = %s
        """, (assigned_to_email or None, ticket_id))

        assignment_message = f"Przypisanie zmienione z {old_assigned or 'Nieprzypisane'} na {assigned_to_name}"
        add_ticket_event(
            cur,
            ticket_id,
            user,
            "assignment_changed",
            assignment_message
        )
        create_ticket_notifications(
            cur,
            ticket_id,
            "assignment_changed",
            f"Zmieniono przypisanie zgłoszenia #{ticket_id}: {assigned_to_name}.",
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()

        publish_event(f"{user['name']} przypisał zgłoszenie #{ticket_id} do: {assigned_to_name}", "assignment_changed", ticket_id)
        return jsonify({"status": "ok"})

    @app.post("/api/tickets/<int:ticket_id>/comments")
    @api_login_required
    def api_add_comment(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        content = clean(payload.get("content"))
        visibility = clean(payload.get("visibility")) or "public"

        if not is_staff(user):
            visibility = "public"

        if visibility not in ("public", "internal"):
            visibility = "public"

        if not content:
            return jsonify({"error": "content is required"}), 400

        event_type = "internal_note_added" if visibility == "internal" else "comment_added"
        event_message = (
            f"Dodano notatkę wewnętrzną: {content[:120]}"
            if visibility == "internal"
            else f"Dodano komentarz publiczny: {content[:120]}"
        )

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            INSERT INTO comments (ticket_id, author, content, visibility)
            VALUES (%s, %s, %s, %s)
        """, (ticket_id, user["name"], content, visibility))
        cur.execute("UPDATE tickets SET updated_at = NOW() WHERE id = %s", (ticket_id,))
        add_ticket_event(cur, ticket_id, user, event_type, event_message)
        create_ticket_notifications(
            cur,
            ticket_id,
            event_type,
            (
                f"Dodano notatkę wewnętrzną do zgłoszenia #{ticket_id}."
                if visibility == "internal"
                else f"Dodano komentarz do zgłoszenia #{ticket_id}."
            ),
            actor_email=user["email"],
            staff_only=(visibility == "internal"),
        )
        conn.commit()
        cur.close()
        conn.close()

        if visibility == "public":
            publish_event(f"{user['name']} dodał komentarz do zgłoszenia #{ticket_id}", "comment_added", ticket_id)
        else:
            # Nie publikujemy treści notatki wewnętrznej globalnie do zwykłych użytkowników.
            # Widok operatorów/adminów odświeży się po wejściu w zgłoszenie albo po kolejnej akcji.
            publish_event(f"{user['name']} dodał notatkę wewnętrzną do zgłoszenia #{ticket_id}", "internal_note_added", ticket_id, staff_only=True)

        return jsonify({"status": "ok", "visibility": visibility})


