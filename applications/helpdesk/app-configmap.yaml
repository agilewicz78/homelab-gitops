        async function saveWorkflowAutomationRuleForm(e) {{
          e.preventDefault();
          const rule = workflowAutomationRuleFromForm(e.target);
          if (!rule.actions || !rule.actions.length) {{
            alert("Dodaj przynajmniej jedną poprawną akcję reguły.");
