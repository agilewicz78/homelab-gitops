    # Zapisuje uporządkowaną historię zmian statusu zgłoszenia.
    def add_ticket_status_history(
        cur,
        ticket_id,
        user,
        old_status,
        new_status,
        workflow_rule_names=None,
        required_comment=False,
        required_attachment=False,
        comment_validated=False,
        attachment_validated=False,
        source="manual",
    ):
        """Zapisuje uporządkowaną historię zmiany statusu zgłoszenia."""
        if old_status == new_status:
            return
        if isinstance(workflow_rule_names, (list, tuple, set)):
            workflow_rule_names = ", ".join([str(x) for x in workflow_rule_names if x])
        cur.execute("""
            INSERT INTO ticket_status_history (
                ticket_id,
                old_status,
                new_status,
                changed_by_email,
                changed_by_name,
                workflow_rule_names,
                required_comment,
                required_attachment,
                comment_validated,
                attachment_validated,
                source
            )
            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
        """, (
            ticket_id,
            old_status,
            new_status,
            user.get("email") if user else None,
            user.get("name") if user else "System",
            workflow_rule_names or "",
            bool(required_comment),
            bool(required_attachment),
            bool(comment_validated),
            bool(attachment_validated),
            source or "manual",
        ))
    
