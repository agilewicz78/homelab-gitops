apiVersion: v1
kind: ConfigMap
metadata:
  name: fotobudka-app
  namespace: fotobudka
data:
  app.py: |
    import base64
    import io
    import re
    import time
    from pathlib import Path

    import cv2
    import numpy as np
    from flask import Flask, jsonify, request, send_from_directory, Response
    from PIL import Image, ImageOps, ImageEnhance, ImageDraw, ImageFont

    DATA_DIR = Path("/data")
    PHOTOS_DIR = DATA_DIR / "photos"
    PHOTOS_DIR.mkdir(parents=True, exist_ok=True)

    app = Flask(__name__)

    def data_url_to_image(data_url: str) -> Image.Image:
        if "," not in data_url:
            raise ValueError("Invalid data URL")
        _, encoded = data_url.split(",", 1)
        raw = base64.b64decode(encoded)
        return Image.open(io.BytesIO(raw)).convert("RGB")

    def image_to_data_url(img: Image.Image) -> str:
        buf = io.BytesIO()
        img.save(buf, format="PNG")
        encoded = base64.b64encode(buf.getvalue()).decode("utf-8")
        return f"data:image/png;base64,{encoded}"

    def add_event_overlay(img: Image.Image, style_name: str) -> Image.Image:
        img = img.copy()
        draw = ImageDraw.Draw(img, "RGBA")
        w, h = img.size
        margin = max(14, w // 45)
        border_w = max(4, w // 220)

        draw.rounded_rectangle(
            (margin, margin, w - margin, h - margin),
            radius=max(16, w // 40),
            outline=(34, 197, 94, 230),
            width=border_w
        )

        top_h = max(64, h // 9)
        bottom_h = max(54, h // 10)

        draw.rectangle((0, 0, w, top_h), fill=(15, 23, 42, 150))
        draw.rectangle((0, h - bottom_h, w, h), fill=(15, 23, 42, 150))

        font = ImageFont.load_default()
        draw.text((margin * 1.6, margin * 1.4), "Olsztyn Green Festival", fill=(240, 253, 244, 255), font=font)
        draw.text((margin * 1.6, h - bottom_h + 14), f"Fotobudka • styl: {style_name}", fill=(240, 253, 244, 255), font=font)
        return img

    def filter_cartoon(img: Image.Image) -> Image.Image:
        arr = cv2.cvtColor(np.array(img), cv2.COLOR_RGB2BGR)
        gray = cv2.cvtColor(arr, cv2.COLOR_BGR2GRAY)
        gray = cv2.medianBlur(gray, 5)
        edges = cv2.adaptiveThreshold(gray, 255, cv2.ADAPTIVE_THRESH_MEAN_C, cv2.THRESH_BINARY, 9, 7)
        color = cv2.bilateralFilter(arr, 9, 250, 250)
        cartoon = cv2.bitwise_and(color, color, mask=edges)
        return Image.fromarray(cv2.cvtColor(cartoon, cv2.COLOR_BGR2RGB))

    def filter_manga(img: Image.Image) -> Image.Image:
        gray = ImageOps.grayscale(img)
        gray = ImageEnhance.Contrast(gray).enhance(2.0)
        arr = np.array(gray)
        edges = 255 - cv2.Canny(arr, 80, 180)
        base = cv2.adaptiveThreshold(arr, 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C, cv2.THRESH_BINARY, 13, 2)
        manga = cv2.bitwise_and(base, edges)
        out = Image.fromarray(manga).convert("RGB")
        return out

    def filter_medieval(img: Image.Image) -> Image.Image:
        gray = ImageOps.grayscale(img)
        sepia = ImageOps.colorize(gray, "#4b3521", "#ead6a7")
        sepia = ImageEnhance.Contrast(sepia).enhance(0.95)
        sepia = ImageEnhance.Color(sepia).enhance(0.8)

        w, h = sepia.size
        draw = ImageDraw.Draw(sepia, "RGBA")

        # prosty ornament / pergaminowa ramka
        frame = max(12, w // 35)
        draw.rectangle((frame, frame, w - frame, h - frame), outline=(92, 59, 26, 220), width=max(3, w // 250))
        draw.rectangle((frame * 2, frame * 2, w - frame * 2, h - frame * 2), outline=(149, 94, 38, 180), width=2)

        return sepia

    def filter_lego(img: Image.Image) -> Image.Image:
        tile = 20
        small_w = max(1, img.width // tile)
        small_h = max(1, img.height // tile)

        small = img.resize((small_w, small_h), Image.Resampling.BILINEAR)
        small = small.quantize(colors=24).convert("RGB")

        canvas = Image.new("RGB", (small_w * tile, small_h * tile), (255, 255, 255))
        draw = ImageDraw.Draw(canvas)

        px = small.load()
        for y in range(small_h):
            for x in range(small_w):
                c = px[x, y]
                x0 = x * tile
                y0 = y * tile
                x1 = x0 + tile
                y1 = y0 + tile

                draw.rectangle((x0, y0, x1, y1), fill=c)

                stud_fill = tuple(min(255, int(v * 1.12)) for v in c)
                stud_outline = tuple(max(0, int(v * 0.78)) for v in c)
                draw.ellipse(
                    (x0 + tile * 0.22, y0 + tile * 0.18, x0 + tile * 0.78, y0 + tile * 0.74),
                    fill=stud_fill,
                    outline=stud_outline
                )

        return canvas.resize(img.size, Image.Resampling.NEAREST)

    STYLE_MAP = {
        "original": lambda x: x,
        "cartoon": filter_cartoon,
        "manga": filter_manga,
        "medieval": filter_medieval,
        "lego": filter_lego,
    }

    INDEX_HTML = """
    <!doctype html>
    <html lang="pl">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Fotobudka – Olsztyn Green Festival Edition</title>
      <style>
        :root {
          --bg: #0b1220;
          --card: #111827;
          --card2: #1f2937;
          --text: #f8fafc;
          --muted: #94a3b8;
          --accent: #22c55e;
          --accent2: #38bdf8;
          --border: rgba(148,163,184,.24);
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: Inter, system-ui, sans-serif;
          background:
            radial-gradient(circle at top left, rgba(34,197,94,.18), transparent 35%),
            radial-gradient(circle at bottom right, rgba(56,189,248,.14), transparent 35%),
            var(--bg);
          color: var(--text);
        }
        .page { width: min(1220px, 94vw); margin: 0 auto; padding: 36px 0; }
        header {
          display: flex; justify-content: space-between; align-items: start; gap: 20px; margin-bottom: 24px;
        }
        h1 { margin: 0 0 8px; font-size: clamp(34px, 5vw, 56px); line-height: 1; letter-spacing: -.04em; }
        .subtitle { margin: 0; color: var(--muted); }
        .badge {
          border: 1px solid var(--border); border-radius: 999px; padding: 10px 14px;
          background: rgba(15,23,42,.66); color: var(--muted);
        }
        .badge span { color: var(--accent); font-weight: 700; }
        .layout {
          display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px;
        }
        .card {
          background: linear-gradient(180deg, rgba(17,24,39,.96), rgba(15,23,42,.96));
          border: 1px solid var(--border); border-radius: 24px; padding: 20px;
        }
        .video-wrap, .preview {
          background: #020617; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.05);
        }
        .video-wrap { aspect-ratio: 16/10; display: grid; place-items: center; }
        .preview { aspect-ratio: 4/3; display: grid; place-items: center; }
        video, img, canvas { width: 100%; height: 100%; object-fit: cover; }
        video { transform: scaleX(-1); }
        .empty { color: var(--muted); text-align: center; padding: 24px; }
        .controls {
          display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 16px;
        }
        button, select, a.btn {
          border: 1px solid var(--border); background: var(--card2); color: var(--text);
          border-radius: 14px; padding: 13px 14px; font-weight: 700; text-decoration: none; text-align: center; cursor: pointer;
        }
        button.primary { background: linear-gradient(135deg, #16a34a, #38bdf8); border-color: transparent; }
        button.danger { background: rgba(239,68,68,.14); border-color: rgba(239,68,68,.3); }
        button:disabled, a.disabled { opacity: .45; pointer-events: none; cursor: not-allowed; }
        .status, .note { color: var(--muted); font-size: 14px; margin-top: 14px; }
        .status strong { color: var(--accent2); }
        .gallery {
          margin-top: 20px;
          display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 14px;
        }
        .photo-card {
          border: 1px solid var(--border); background: rgba(15,23,42,.72); border-radius: 16px; overflow: hidden;
        }
        .photo-card img { display: block; aspect-ratio: 4/3; object-fit: cover; }
        .photo-card .meta { padding: 10px; font-size: 13px; color: var(--muted); }
        @media (max-width: 920px) {
          header { flex-direction: column; }
          .layout { grid-template-columns: 1fr; }
          .controls { grid-template-columns: 1fr; }
        }
      </style>
    </head>
    <body>
      <main class="page">
        <header>
          <div>
            <h1>Fotobudka Event Edition</h1>
            <p class="subtitle">Olsztyn Green Festival • zapis zdjęć na Longhorn • stylizacje eventowe</p>
          </div>
          <div class="badge">Storage: <span>Longhorn PVC</span></div>
        </header>

        <section class="layout">
          <section class="card">
            <div class="video-wrap">
              <video id="video" autoplay playsinline muted></video>
              <div id="cameraEmpty" class="empty">Kliknij „Uruchom kamerę”, aby rozpocząć.</div>
            </div>

            <div class="controls">
              <button id="startBtn" class="primary">Uruchom kamerę</button>
              <button id="shotBtn" disabled>Zrób zdjęcie</button>
              <select id="styleSelect">
                <option value="original">Original</option>
                <option value="manga">Manga</option>
                <option value="medieval">Średniowiecze</option>
                <option value="lego">Klocki Lego</option>
                <option value="cartoon">Cartoon</option>
              </select>
              <button id="renderBtn" disabled>Przetwórz</button>
              <button id="saveBtn" disabled>Zapisz na Longhorn</button>
              <button id="stopBtn" class="danger" disabled>Zatrzymaj kamerę</button>
            </div>

            <div id="status" class="status">Status: <strong>gotowe</strong></div>
          </section>

          <aside class="card">
            <h2 style="margin-top:0">Podgląd</h2>
            <div class="preview">
              <canvas id="canvas" style="display:none"></canvas>
              <img id="photo" alt="Podgląd zdjęcia" style="display:none" />
              <div id="photoEmpty" class="empty">Brak zdjęcia.</div>
            </div>

            <div class="controls">
              <a id="downloadLink" class="btn disabled" href="#" download="fotobudka-event.png">Pobierz PNG</a>
              <button id="clearBtn">Wyczyść</button>
              <button id="refreshBtn">Odśwież galerię</button>
            </div>

            <div class="note">
              Zdjęcie jest przetwarzane po stronie backendu i może zostać zapisane
              do galerii na PVC Longhorn.
            </div>
          </aside>
        </section>

        <section class="card" style="margin-top:20px">
          <h2 style="margin-top:0">Galeria</h2>
          <div id="gallery" class="gallery"></div>
        </section>
      </main>

      <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const photo = document.getElementById("photo");
        const startBtn = document.getElementById("startBtn");
        const shotBtn = document.getElementById("shotBtn");
        const stopBtn = document.getElementById("stopBtn");
        const renderBtn = document.getElementById("renderBtn");
        const saveBtn = document.getElementById("saveBtn");
        const clearBtn = document.getElementById("clearBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const styleSelect = document.getElementById("styleSelect");
        const downloadLink = document.getElementById("downloadLink");
        const cameraEmpty = document.getElementById("cameraEmpty");
        const photoEmpty = document.getElementById("photoEmpty");
        const statusEl = document.getElementById("status");
        const galleryEl = document.getElementById("gallery");

        let stream = null;
        let originalData = null;
        let processedData = null;

        function setStatus(text) {
          statusEl.innerHTML = `Status: <strong>${text}</strong>`;
        }

        function setCameraButtons(active) {
          startBtn.disabled = active;
          stopBtn.disabled = !active;
          shotBtn.disabled = !active;
        }

        startBtn.addEventListener("click", async () => {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
              audio: false
            });
            video.srcObject = stream;
            video.style.display = "block";
            cameraEmpty.style.display = "none";
            setCameraButtons(true);
            setStatus("kamera uruchomiona");
          } catch (e) {
            console.error(e);
            setStatus("brak dostępu do kamery");
            alert("Nie udało się uruchomić kamery. Sprawdź zgodę przeglądarki i HTTPS.");
          }
        });

        stopBtn.addEventListener("click", () => {
          if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
          }
          video.srcObject = null;
          video.style.display = "none";
          cameraEmpty.style.display = "block";
          setCameraButtons(false);
          setStatus("kamera zatrzymana");
        });

        shotBtn.addEventListener("click", () => {
          const width = video.videoWidth || 1280;
          const height = video.videoHeight || 720;

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");

          ctx.translate(width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, width, height);

          originalData = canvas.toDataURL("image/png");
          processedData = originalData;

          photo.src = processedData;
          photo.style.display = "block";
          photoEmpty.style.display = "none";
          downloadLink.href = processedData;
          downloadLink.classList.remove("disabled");
          renderBtn.disabled = false;
          saveBtn.disabled = false;
          setStatus("zdjęcie gotowe");
        });

        renderBtn.addEventListener("click", async () => {
          if (!originalData) return;

          renderBtn.disabled = true;
          setStatus("przetwarzanie zdjęcia...");

          const res = await fetch("/api/render", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image: originalData,
              style: styleSelect.value
            })
          });

          renderBtn.disabled = false;

          if (!res.ok) {
            setStatus("błąd przetwarzania");
            alert("Nie udało się przetworzyć zdjęcia.");
            return;
          }

          const data = await res.json();
          processedData = data.image;
          photo.src = processedData;
          downloadLink.href = processedData;
          downloadLink.classList.remove("disabled");
          saveBtn.disabled = false;
          setStatus(`gotowe: ${styleSelect.value}`);
        });

        saveBtn.addEventListener("click", async () => {
          if (!processedData) return;

          saveBtn.disabled = true;
          setStatus("zapis na Longhorn...");

          const res = await fetch("/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image: processedData,
              style: styleSelect.value
            })
          });

          saveBtn.disabled = false;

          if (!res.ok) {
            setStatus("błąd zapisu");
            alert("Nie udało się zapisać zdjęcia.");
            return;
          }

          const data = await res.json();
          setStatus(`zapisano: ${data.filename}`);
          await loadGallery();
        });

        clearBtn.addEventListener("click", () => {
          originalData = null;
          processedData = null;
          photo.removeAttribute("src");
          photo.style.display = "none";
          photoEmpty.style.display = "block";
          downloadLink.href = "#";
          downloadLink.classList.add("disabled");
          renderBtn.disabled = true;
          saveBtn.disabled = true;
          setStatus("wyczyszczono podgląd");
        });

        refreshBtn.addEventListener("click", loadGallery);

        async function loadGallery() {
          const res = await fetch("/api/photos");
          const photos = await res.json();

          if (!photos.length) {
            galleryEl.innerHTML = '<div class="empty">Brak zapisanych zdjęć.</div>';
            return;
          }

          galleryEl.innerHTML = photos.map(item => `
            <div class="photo-card">
              <img src="/photos/${item.file}" alt="${item.file}" loading="lazy">
              <div class="meta">
                <div><strong>${item.style}</strong></div>
                <div>${item.file}</div>
              </div>
            </div>
          `).join("");
        }

        video.style.display = "none";
        setCameraButtons(false);
        loadGallery();
      </script>
    </body>
    </html>
    """

    @app.get("/")
    def index():
        return Response(INDEX_HTML, mimetype="text/html")

    @app.get("/healthz")
    def healthz():
        return jsonify({"status": "ok"})

    @app.post("/api/render")
    def render_image():
        payload = request.get_json(silent=True) or {}
        image_data = payload.get("image")
        style = payload.get("style", "original")

        if not image_data:
            return jsonify({"error": "missing image"}), 400

        try:
            img = data_url_to_image(image_data)
            transform = STYLE_MAP.get(style, STYLE_MAP["original"])
            out = transform(img)
            out = add_event_overlay(out, style)
            return jsonify({"image": image_to_data_url(out)})
        except Exception as e:
            return jsonify({"error": str(e)}), 500

    @app.post("/api/save")
    def save_image():
        payload = request.get_json(silent=True) or {}
        image_data = payload.get("image")
        style = payload.get("style", "original")

        if not image_data:
            return jsonify({"error": "missing image"}), 400

        try:
            img = data_url_to_image(image_data)
            filename = f"ogf-{style}-{int(time.time())}.png"
            path = PHOTOS_DIR / filename
            img.save(path, format="PNG")
            return jsonify({"filename": filename})
        except Exception as e:
            return jsonify({"error": str(e)}), 500

    @app.get("/api/photos")
    def list_photos():
        items = []
        for p in sorted(PHOTOS_DIR.glob("*.png"), reverse=True):
            m = re.match(r"^ogf-([a-zA-Z0-9_-]+)-\d+\.png$", p.name)
            style = m.group(1) if m else "unknown"
            items.append({"file": p.name, "style": style})
        return jsonify(items)

    @app.get("/photos/<path:filename>")
    def get_photo(filename):
        return send_from_directory(PHOTOS_DIR, filename)
