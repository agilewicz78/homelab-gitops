    @app.put("/api/admin/workflows/<int:workflow_id>")
    @api_login_required
    def api_admin_update_workflow(user, workflow_id):
        if not can_manage_workflow_backend(user):
            return api_forbidden("Brak uprawnienia do zarządzania workflow.", "workflow.manage")
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT workflow_key, is_default FROM workflow_definitions WHERE id = %s", (workflow_id,))
        existing = cur.fetchone()
        if not existing:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        payload = request.get_json(silent=True) or {}
        data, error = normalize_workflow_payload(payload, existing_key=existing[0])
        if error:
            cur.close()
            conn.close()
            return jsonify({"error": error}), 400
        operator_emails = normalize_workflow_operator_emails(payload)
        try:
            operator_emails = validate_workflow_operator_emails(cur, operator_emails)
        except ValueError as exc:
            cur.close()
            conn.close()
            return jsonify({"error": str(exc)}), 400
        if existing[1] and not data["is_default"]:
            cur.execute("SELECT COUNT(*) FROM workflow_definitions WHERE is_default = TRUE AND id <> %s", (workflow_id,))
            if cur.fetchone()[0] == 0:
                cur.close()
                conn.close()
                return jsonify({"error": "Musi istnieć jeden workflow domyślny."}), 400
        if data["is_default"]:
            cur.execute("UPDATE workflow_definitions SET is_default = FALSE WHERE id <> %s", (workflow_id,))
        cur.execute("""
            UPDATE workflow_definitions
            SET name = %s,
                category = %s,
                subcategory = %s,
                is_default = %s,
                is_active = %s,
                updated_at = NOW()
            WHERE id = %s
        """, (
            data["name"], data["category"], data["subcategory"],
            data["is_default"], data["is_active"], workflow_id,
        ))
        if data["category"] != "*":
            cur.execute("""
                UPDATE workflow_automations
                SET condition_category = '*',
                    condition_category_operator = 'eq'
                WHERE workflow_id = %s
            """, (workflow_id,))
        if data["subcategory"] != "*":
            cur.execute("""
                UPDATE workflow_automations
                SET condition_subcategory = '*',
                    condition_subcategory_operator = 'eq'
                WHERE workflow_id = %s
            """, (workflow_id,))
        cur.execute("DELETE FROM workflow_steps WHERE workflow_id = %s", (workflow_id,))
        for idx, step_name in enumerate(data["steps"], start=1):
            cur.execute("""
                INSERT INTO workflow_steps (workflow_id, step_name, step_order, is_final)
                VALUES (%s, %s, %s, %s)
            """, (workflow_id, step_name, idx, step_name == "Zamknięte"))
        replace_workflow_operators(cur, workflow_id, operator_emails)
        # Reguły automatyzacji są zarządzane osobnymi endpointami CRUD.
