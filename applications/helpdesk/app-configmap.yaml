        async function renderNewTicket() {{
          currentView = {{ name: "new-ticket", ticketId: null }};
          const me = await loadMe();
          if (!me) return;
          const metaRes = await api("/api/meta");
          const meta = await metaRes.json();
          appEl.innerHTML = `
            <section class="card">
              <h2>Nowe zgłoszenie</h2>
              <form id="ticketForm">
                <label>Tytuł problemu</label>
                <input id="new-ticket-title" name="title" required placeholder="Np. Outlook nie odbiera poczty">
                <label>Opis</label>
                <textarea id="new-ticket-description" name="description" required placeholder="Opisz problem, komunikat błędu, od kiedy występuje..."></textarea>
                <div class="grid">
                  <div><label>Zgłaszający</label><input value="${{esc(me.name)}}" disabled></div>
                  <div><label>E-mail</label><input value="${{esc(me.email)}}" disabled></div>
                </div>
                <div class="grid">
                  <div><label>Dział</label><input value="${{esc(me.department)}}" disabled></div>
                  <div>
                    <label>Kategoria</label>
                    <select id="new-ticket-category" name="category">
                      ${{meta.categories.map(x => `<option>${{esc(x)}}</option>`).join("")}}
                    </select>
                  </div>
                </div>
                <div class="grid">
                  <div>
                    <label>Podkategoria</label>
                    <select id="new-ticket-subcategory" name="subcategory"></select>
                  </div>
                </div>
                <label>Priorytet</label>
                <select name="priority">${{meta.priorities.map(x => `<option ${{x === "Normalny" ? "selected" : ""}}>${{esc(x)}}</option>`).join("")}}</select>
                <div id="newTicketKnowledgeSuggestions" class="hidden"></div>
                <label>Załączniki opcjonalne</label>
                <input type="file" name="attachments" multiple accept=".png,.jpg,.jpeg,.gif,.pdf,.txt,.log,.csv,.xlsx,.docx">
                <p class="muted">Możesz dodać screenshot, PDF, log lub dokument. Maksymalnie 10 MB na plik. Załączniki zostaną zapisane automatycznie po kliknięciu „Utwórz zgłoszenie”.</p>
                <button type="submit">Utwórz zgłoszenie</button>
                <button type="button" class="btn-secondary" onclick="renderHome()">Anuluj</button>
              </form>
            </section>`;
          updateSubcategorySelect(meta);
          document.getElementById("new-ticket-title").addEventListener("input", scheduleNewTicketKnowledgeSuggestions);
          document.getElementById("new-ticket-description").addEventListener("input", scheduleNewTicketKnowledgeSuggestions);
          document.getElementById("new-ticket-category").addEventListener("change", () => {{
            updateSubcategorySelect(meta);
            scheduleNewTicketKnowledgeSuggestions();
          }});
          document.getElementById("new-ticket-subcategory").addEventListener("change", scheduleNewTicketKnowledgeSuggestions);
          document.getElementById("ticketForm").addEventListener("submit", createTicket);
        }}
        function scheduleNewTicketKnowledgeSuggestions() {{
          clearTimeout(knowledgeSuggestionTimer);
          knowledgeSuggestionTimer = setTimeout(loadNewTicketKnowledgeSuggestions, 450);
        }}
        async function loadNewTicketKnowledgeSuggestions() {{
          const form = document.getElementById("ticketForm");
          const panel = document.getElementById("newTicketKnowledgeSuggestions");
          if (!form || !panel) return;
          const formData = new FormData(form);
          const title = String(formData.get("title") || "").trim();
          const description = String(formData.get("description") || "").trim();
          if (`${{title}} ${{description}}`.trim().length < 12) {{
            knowledgeSuggestionRequest += 1;
            panel.classList.add("hidden");
            panel.innerHTML = "";
            return;
          }}
          const requestId = ++knowledgeSuggestionRequest;
          const params = new URLSearchParams({{
            title,
            description,
            category: String(formData.get("category") || ""),
            subcategory: String(formData.get("subcategory") || "")
          }});
          const res = await api(`/api/knowledge-suggestions?${{params.toString()}}`);
          if (!res || requestId !== knowledgeSuggestionRequest) return;
          if (!res.ok) {{
            panel.classList.add("hidden");
            panel.innerHTML = "";
            return;
          }}
          const data = await res.json();
          const suggestions = data.suggestions || [];
          if (!suggestions.length) {{
            panel.classList.add("hidden");
            panel.innerHTML = "";
            return;
          }}
          panel.innerHTML = `
            <section class="panel-soft knowledge-card">
              <h3>Możliwe rozwiązania przed utworzeniem zgłoszenia</h3>
              <p class="muted">Sprawdź poniższe instrukcje. Jeśli któraś pomoże, nie musisz wysyłać zgłoszenia.</p>
              ${{suggestions.map(article => `
                <details class="card">
                  <summary><strong>#${{article.id}} · ${{esc(article.title)}}</strong> · ${{article.score}}% dopasowania</summary>
                  <div class="incident-meta">
                    <span class="chip">${{esc(article.category)}}</span>
                    <span class="chip">${{esc(article.subcategory)}}</span>
                    ${{(article.reasons || []).map(reason => `<span class="chip">${{esc(reason)}}</span>`).join("")}}
                  </div>
                  <p><strong>Opis problemu:</strong> ${{esc(article.problem)}}</p>
                  <div class="knowledge-solution"><strong>Rozwiązanie:</strong><br>${{esc(article.solution)}}</div>
                </details>
              `).join("")}}
            </section>
          `;
          panel.classList.remove("hidden");
        }}
        async function createTicket(event) {{
          event.preventDefault();
          clearTimeout(knowledgeSuggestionTimer);
          knowledgeSuggestionRequest += 1;
          const form = event.target;
          const formData = new FormData(form);
          const files = formData.getAll("attachments").filter(file => file && file.name);
          const payload = {{
            title: formData.get("title") || "",
            description: formData.get("description") || "",
            category: formData.get("category") || "",
            subcategory: formData.get("subcategory") || "Inne",
            priority: formData.get("priority") || "Normalny"
          }};
          suppressNextLiveRefresh = true;
          const res = await api("/api/tickets", {{ method: "POST", body: JSON.stringify(payload) }});
          if (!res) return;
          if (!res.ok) {{ alert("Nie udało się utworzyć zgłoszenia."); return; }}
          const created = await res.json();
          const ticketId = created.id;
          if (files.length > 0) {{
            for (const file of files) {{
              const uploadData = new FormData();
              uploadData.append("file", file);
              const uploadRes = await fetch(`/api/tickets/${{ticketId}}/attachments`, {{
                method: "POST",
                headers: {{ "X-Helpdesk-Session": getSid() }},
                body: uploadData
              }});
              if (!uploadRes.ok) {{
                const err = await uploadRes.json().catch(() => ({{ error: "Nie udało się dodać załącznika." }}));
                showToast("Zgłoszenie utworzone, ale nie dodano załącznika", err.error || "Błąd uploadu");
              }}
            }}
          }}
          showToast("Zgłoszenie zostało utworzone", files.length ? `Dodano załączniki: ${{files.length}}` : "");
          await renderHome();
        }}
        async function renderTicket(id, fromLive = false) {{
          currentView = {{ name: "ticket", ticketId: Number(id) }};
          const me = await loadMe();
          if (!me) return;
          const res = await api(`/api/tickets/${{id}}`);
          if (!res) return;
          if (!res.ok) {{ appEl.innerHTML = `<section class="card"><h2>Brak dostępu albo brak zgłoszenia</h2></section>`; return; }}
          const data = await res.json();
          const t = data.ticket;
          const isClosed = t.status === "Zamknięte";
          const canCreateKnowledgeArticle = canWorkTickets(me)
            && isClosed
            && !data.knowledge_article;
          knowledgeArticleContext = canCreateKnowledgeArticle ? {{
            mode: "create",
            sourceTicketId: t.id,
            title: `Rozwiązanie: ${{t.title}}`,
            problem: t.description,
            solution: t.resolution_summary,
            category: t.category,
            subcategory: t.subcategory,
            categories: data.meta.categories || [],
            subcategories: data.meta.subcategories || {{}}
