    \ * 1024\nALLOWED_ATTACHMENT_EXTENSIONS = {\n    \"png\", \"jpg\", \"jpeg\", \"gif\", \"pdf\", \"txt\", \"log\", \"csv\", \"xlsx\", \"docx\"\n}\nINITIAL_PASSWORD = \"Incoprp123!\"\nDEPARTMENTS = [\n    \"HR\",\n    \"Finanse\",\n    \"Sprzedaż\",\n    \"Marketing\",\n    \"Obsługa klienta\",\n    \"Administracja\",\n    \"IT\",\n    \"Zarząd\",\n    \"Logistyka\",\n    \"Księgowość\",\n]\nSUBCATEGORIES = {\n    \"Komputer i laptop\": [\n        \"Wolne działanie\",\n        \"Awaria sprzętu\",\n        \"Aktualizacja systemu\",\n        \"Oprogramowanie\",\n        \"Stacja dokująca / monitor\",\n        \"Inne\",\n    ],\n    \"Poczta e-mail\": [\n        \"Outlook\",\n        \"Webmail\",\n        \"Skrzynka współdzielona\",\n        \"Spam / phishing\",\n        \"Załączniki\",\n        \"Inne\",\n    ],\n    \"Drukarki i skanery\": [\n        \"Brak wydruku\",\n        \"Brak tonera\",\n        \"Skanowanie\",\n        \"Kolejka wydruku\",\n        \"Sterownik\",\n        \"Inne\"\
    ,\n    ],\n    \"Microsoft 365 / Office\": [\n        \"Word\",\n        \"Excel\",\n        \"Teams\",\n        \"OneDrive\",\n        \"SharePoint\",\n        \"Licencja\",\n        \"Inne\",\n    ],\n    \"Sieć i Wi-Fi\": [\n        \"Brak połączenia\",\n        \"Słaby zasięg\",\n        \"DNS / dostęp do stron\",\n        \"LAN / kabel\",\n        \"Inne\",\n    ],\n    \"VPN i praca zdalna\": [\n        \"Brak połączenia\",\n        \"MFA\",\n        \"Wolne połączenie\",\n        \"Certyfikat\",\n        \"Dostęp z domu\",\n        \"Inne\",\n    ],\n    \"Konta i hasła\": [\n        \"Reset hasła\",\n        \"Blokada konta\",\n        \"MFA\",\n        \"Uprawnienia\",\n        \"Nowe konto\",\n        \"Inne\",\n    ],\n    \"Telefon / Teams / wideokonferencje\": [\n        \"Mikrofon\",\n        \"Kamera\",\n        \"Słuchawki\",\n        \"Połączenia Teams\",\n        \"Telefon służbowy\",\n        \"Inne\",\n    ],\n    \"Dostępy do systemów\": [\n        \"Nowy dostęp\"\
    ,\n        \"Brak dostępu\",\n        \"Zmiana uprawnień\",\n        \"Folder sieciowy\",\n        \"Aplikacja biznesowa\",\n        \"Inne\",\n    ],\n    \"Sprzęt biurowy\": [\n        \"Klawiatura / mysz\",\n        \"Monitor\",\n        \"Telefon\",\n        \"Akcesoria\",\n        \"Inne\",\n    ],\n    \"Inne\": [\n        \"Inne\",\n    ],\n}\nCATEGORIES = list(SUBCATEGORIES.keys())\nPRIORITIES = [\"Niski\", \"Normalny\", \"Wysoki\", \"Krytyczny\"]\nSTANDARD_STATUSES = [\n    \"Nowe\",\n    \"Otwarte\",\n    \"W trakcie\",\n    \"Oczekuje na użytkownika\",\n    \"Oczekuje na dostawcę\",\n    \"Rozwiązane\",\n    \"Zamknięte\",\n]\nWORKFLOWS = {\n    \"default\": {\n        \"name\": \"Standardowy workflow zgłoszenia\",\n        \"match\": {\"category\": \"*\", \"subcategory\": \"*\"},\n        \"statuses\": STANDARD_STATUSES,\n    },\n    \"hardware_repair\": {\n        \"name\": \"Naprawa sprzętu komputerowego\",\n        \"match\": {\"category\": \"Komputer i laptop\", \"subcategory\"\
    : \"Awaria sprzętu\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Diagnostyka\",\n            \"W naprawie\",\n            \"Oczekuje na części\",\n            \"Oczekuje na użytkownika\",\n            \"Rozwiązane\",\n            \"Zamknięte\",\n        ],\n    },\n    \"computer_support\": {\n        \"name\": \"Wsparcie komputera i laptopa\",\n        \"match\": {\"category\": \"Komputer i laptop\", \"subcategory\": \"*\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Diagnostyka\",\n            \"W trakcie\",\n            \"Oczekuje na użytkownika\",\n            \"Rozwiązane\",\n            \"Zamknięte\",\n        ],\n    },\n    \"system_access\": {\n        \"name\": \"Wniosek o dostęp do systemu\",\n        \"match\": {\"category\": \"Dostępy do systemów\", \"subcategory\": \"*\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Weryfikacja wniosku\",\n            \"Oczekuje na akceptację\",\n            \"Zaakceptowane\",\n\
    \            \"W realizacji\",\n            \"Zrealizowane\",\n            \"Zamknięte\",\n        ],\n    },\n    \"printer_support\": {\n        \"name\": \"Obsługa drukarek i skanerów\",\n        \"match\": {\"category\": \"Drukarki i skanery\", \"subcategory\": \"*\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Diagnostyka\",\n            \"W trakcie\",\n            \"Oczekuje na dostawcę\",\n            \"Oczekuje na użytkownika\",\n            \"Rozwiązane\",\n            \"Zamknięte\",\n        ],\n    },\n    \"vpn_remote_work\": {\n        \"name\": \"VPN i praca zdalna\",\n        \"match\": {\"category\": \"VPN i praca zdalna\", \"subcategory\": \"*\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Analiza\",\n            \"W trakcie\",\n            \"Oczekuje na użytkownika\",\n            \"Rozwiązane\",\n            \"Zamknięte\",\n        ],\n    },\n    \"email_support\": {\n        \"name\": \"Obsługa poczty e-mail\",\n        \"\
    match\": {\"category\": \"Poczta e-mail\", \"subcategory\": \"*\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Analiza\",\n            \"W trakcie\",\n            \"Oczekuje na użytkownika\",\n            \"Rozwiązane\",\n            \"Zamknięte\",\n        ],\n    },\n    \"account_password\": {\n        \"name\": \"Konta, hasła i MFA\",\n        \"match\": {\"category\": \"Konta i hasła\", \"subcategory\": \"*\"},\n        \"statuses\": [\n            \"Nowe\",\n            \"Weryfikacja\",\n            \"W realizacji\",\n            \"Oczekuje na użytkownika\",\n            \"Zrealizowane\",\n            \"Zamknięte\",\n        ],\n    },\n}\ndef default_automation_target(statuses, preferred):\n    for candidate in preferred:\n        if candidate in statuses:\n            return candidate\n    for candidate in statuses:\n        if candidate not in (\"Nowe\", \"Zamknięte\", \"Rozwiązane\", \"Zrealizowane\"):\n            return candidate\n    return statuses[0]\
    \ if statuses else \"Nowe\"\ndef seed_workflow_automations(cur, workflow_id, statuses):\n    cur.execute(\"SELECT COUNT(*) FROM workflow_automations WHERE workflow_id = %s\", (workflow_id,))\n    if cur.fetchone()[0] > 0:\n        return\n    initial_status = statuses[0] if statuses else \"Nowe\"\n    user_target = default_automation_target(statuses, (\"Otwarte\", \"W trakcie\", \"Diagnostyka\", \"W realizacji\", \"Nowe\"))\n    staff_target = default_automation_target(statuses, (\"W trakcie\", \"Diagnostyka\", \"Weryfikacja wniosku\", \"Analiza\", \"W realizacji\", \"Otwarte\"))\n    defaults = [\n        (\"Status początkowy\", \"ticket_created\", None, None, None, \"*\", \"change_status\", initial_status, True, True, 10),\n        (\"Użytkownik odpowiedział\", \"comment_added\", \"Oczekuje na użytkownika\", \"user\", \"public\", \"*\", \"change_status\", user_target, True, True, 20),\n        (\"Operator rozpoczął obsługę\", \"comment_added\", \"Nowe\", \"staff\", \"*\", \"*\", \"\
    change_status\", staff_target, True, True, 30),\n    ]\n    for name, event_type, condition_status, condition_role, condition_visibility, assigned_state, action_type, action_status, is_active, stop_processing, priority in defaults:\n        if action_status and action_status in statuses:\n            cur.execute(\"\"\"\n                INSERT INTO workflow_automations (\n                    workflow_id, name, event_type, condition_status, condition_to_status, condition_role,\n                    condition_comment_visibility, assigned_state, action_type, action_status,\n                    is_active, stop_processing, priority\n                )\n                VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)\n                RETURNING id\n            \"\"\", (\n                workflow_id, name, event_type, condition_status, None, condition_role,\n                condition_visibility, assigned_state, action_type, action_status,\n                is_active, stop_processing,\
    \ priority,\n            ))\n            automation_id = cur.fetchone()[0]\n            cur.execute(\"\"\"\n                INSERT INTO workflow_automation_actions (\n                    automation_id, action_order, action_type, action_value, is_active\n                )\n                VALUES (%s, 1, %s, %s, TRUE)\n            \"\"\", (automation_id, action_type, action_status))\ndef seed_workflows(cur):\n    for key, workflow in WORKFLOWS.items():\n        match = workflow.get(\"match\") or {}\n        category = match.get(\"category\") or \"*\"\n        subcategory = match.get(\"subcategory\") or \"*\"\n        name = workflow.get(\"name\") or key\n        is_default = (key == \"default\")\n        cur.execute(\"\"\"\n            INSERT INTO workflow_definitions (\n                workflow_key, name, category, subcategory, is_default, is_active\n            )\n            VALUES (%s, %s, %s, %s, %s, TRUE)\n            ON CONFLICT (workflow_key) DO NOTHING\n        \"\"\", (key, name,\
    \ category, subcategory, is_default))\n        cur.execute(\"SELECT id FROM workflow_definitions WHERE workflow_key = %s\", (key,))\n        row = cur.fetchone()\n        if not row:\n            continue\n        workflow_id = row[0]\n        cur.execute(\"SELECT COUNT(*) FROM workflow_steps WHERE workflow_id = %s\", (workflow_id,))\n        statuses = list(workflow.get(\"statuses\") or STANDARD_STATUSES)\n        if cur.fetchone()[0] == 0:\n            for idx, step_name in enumerate(statuses, start=1):\n                cur.execute(\"\"\"\n                    INSERT INTO workflow_steps (workflow_id, step_name, step_order, is_final)\n                    VALUES (%s, %s, %s, %s)\n                    ON CONFLICT (workflow_id, step_name) DO NOTHING\n                \"\"\", (workflow_id, step_name, idx, step_name == \"Zamknięte\"))\n        seed_workflow_automations(cur, workflow_id, statuses)\ndef db_workflow_statuses(workflow_key):\n    workflow_key = clean(workflow_key) or \"default\"\
    \n    try:\n        conn = get_conn()\n        cur = conn.cursor()\n        cur.execute(\"\"\"\n            SELECT ws.step_name\n            FROM workflow_definitions wd\n            JOIN workflow_steps ws ON ws.workflow_id = wd.id\n            WHERE wd.workflow_key = %s\n              AND wd.is_active = TRUE\n            ORDER BY ws.step_order ASC, ws.id ASC\n        \"\"\", (workflow_key,))\n        rows = [r[0] for r in cur.fetchall()]\n        cur.close()\n        conn.close()\n        if rows:\n            if \"Zamknięte\" not in rows:\n                rows.append(\"Zamknięte\")\n            return rows\n    except Exception:\n        pass\n    return None\ndef workflow_statuses(workflow_key):\n    db_statuses = db_workflow_statuses(workflow_key)\n    if db_statuses:\n        return db_statuses\n    workflow = WORKFLOWS.get(workflow_key) or WORKFLOWS[\"default\"]\n    statuses = list(workflow.get(\"statuses\") or STANDARD_STATUSES)\n    if \"Zamknięte\" not in statuses:\n      \
    \  statuses.append(\"Zamknięte\")\n    return statuses\ndef all_statuses():\n    values = []\n    try:\n        conn = get_conn()\n        cur = conn.cursor()\n        cur.execute(\"\"\"\n            SELECT DISTINCT ws.step_name\n            FROM workflow_steps ws\n            JOIN workflow_definitions wd ON wd.id = ws.workflow_id\n            WHERE wd.is_active = TRUE\n            ORDER BY ws.step_name\n        \"\"\")\n        for (status,) in cur.fetchall():\n            if status not in values:\n                values.append(status)\n        cur.close()\n        conn.close()\n    except Exception:\n        values = []\n    for workflow in WORKFLOWS.values():\n        for status in workflow.get(\"statuses\") or STANDARD_STATUSES:\n            if status not in values:\n                values.append(status)\n    if \"Zamknięte\" not in values:\n        values.append(\"Zamknięte\")\n    return values\ndef choose_workflow(category, subcategory):\n    category = str(category or \"\").strip()\n\
    \    subcategory = str(subcategory or \"\").strip() or \"Inne\"\n    try:\n        conn = get_conn()\n        cur = conn.cursor()\n        cur.execute(\"\"\"\n            SELECT workflow_key, name\n            FROM workflow_definitions\n            WHERE is_active = TRUE\n              AND category = %s\n              AND subcategory = %s\n            ORDER BY is_default ASC, id ASC\n            LIMIT 1\n        \"\"\", (category, subcategory))\n        row = cur.fetchone()\n        if not row:\n            cur.execute(\"\"\"\n                SELECT workflow_key, name\n                FROM workflow_definitions\n                WHERE is_active = TRUE\n                  AND category = %s\n                  AND subcategory = '*'\n                ORDER BY is_default ASC, id ASC\n                LIMIT 1\n            \"\"\", (category,))\n            row = cur.fetchone()\n        if not row:\n            cur.execute(\"\"\"\n                SELECT workflow_key, name\n                FROM workflow_definitions\n\
    \                WHERE is_active = TRUE\n                  AND is_default = TRUE\n                ORDER BY id ASC\n                LIMIT 1\n            \"\"\")\n            row = cur.fetchone()\n        cur.close()\n        conn.close()\n        if row:\n            return row[0], row[1]\n    except Exception:\n        pass\n    for key, workflow in WORKFLOWS.items():\n        if key == \"default\":\n            continue\n        match = workflow.get(\"match\") or {}\n        if match.get(\"category\") == category and match.get(\"subcategory\") == subcategory:\n            return key, workflow[\"name\"]\n    for key, workflow in WORKFLOWS.items():\n        if key == \"default\":\n            continue\n        match = workflow.get(\"match\") or {}\n        if match.get(\"category\") == category and match.get(\"subcategory\") == \"*\":\n            return key, workflow[\"name\"]\n    return \"default\", WORKFLOWS[\"default\"][\"name\"]\ndef reopen_status_for_workflow(workflow_key):\n \
    \   statuses = workflow_statuses(workflow_key)\n    if \"Otwarte\" in statuses:\n        return \"Otwarte\"\n    if \"Nowe\" in statuses:\n        return \"Nowe\"\n    for status in statuses:\n        if status != \"Zamknięte\":\n            return status\n    return \"Nowe\"\ndef workflow_key_from_name(name):\n    value = clean(name).lower()\n    replacements = {\n        \"ą\": \"a\", \"ć\": \"c\", \"ę\": \"e\", \"ł\": \"l\", \"ń\": \"n\",\n        \"ó\": \"o\", \"ś\": \"s\", \"ż\": \"z\", \"ź\": \"z\",\n    }\n    for src, dst in replacements.items():\n        value = value.replace(src, dst)\n    value = re_sub_non_alnum(value)\n    return value or f\"workflow_{uuid.uuid4().hex[:8]}\"\ndef re_sub_non_alnum(value):\n    import re\n    value = re.sub(r\"[^a-z0-9]+\", \"_\", value)\n    value = re.sub(r\"_+\", \"_\", value).strip(\"_\")\n    return value\nSTATUSES = all_statuses()\nSLA_HOURS = {\n    \"Krytyczny\": 4,\n    \"Wysoki\": 8,\n    \"Normalny\": 48,\n    \"Niski\": 120,\n\
    }\nVALID_ROLES = [\"user\", \"operator\", \"admin\"]\nSEED_USERS = [\n    (\"Anna\", \"Kowalska\", \"anna.kowalska@incoprp.local\", \"HR\", \"user\"),\n    (\"Piotr\", \"Nowak\", \"piotr.nowak@incoprp.local\", \"Finanse\", \"user\"),\n    (\"Magdalena\", \"Zielińska\", \"magdalena.zielinska@incoprp.local\", \"Sprzedaż\", \"user\"),\n    (\"Tomasz\", \"Wiśniewski\", \"tomasz.wisniewski@incoprp.local\", \"Marketing\", \"user\"),\n    (\"Karolina\", \"Wójcik\", \"karolina.wojcik@incoprp.local\", \"Obsługa klienta\", \"user\"),\n    (\"Joanna\", \"Lewandowska\", \"joanna.lewandowska@incoprp.local\", \"Księgowość\", \"user\"),\n    (\"Helpdesk\", \"Operator\", \"operator@incoprp.local\", \"IT\", \"operator\"),\n    (\"Helpdesk\", \"Admin\", \"admin@incoprp.local\", \"IT\", \"admin\"),\n]\nSEED_TICKETS = [\n    (\n        \"Outlook nie odbiera poczty\",\n        \"Od rana Outlook nie synchronizuje nowych wiadomości. Webmail działa, ale aplikacja pokazuje błąd połączenia.\",\n        \"Anna\
    \ Kowalska\",\n        \"anna.kowalska@incoprp.local\",\n        \"HR\",\n        \"Poczta e-mail\",\n        \"Wysoki\",\n        \"Otwarte\",\n    ),\n    (\n        \"Drukarka w księgowości nie drukuje faktur\",\n        \"Drukarka pokazuje zadania w kolejce, ale nic nie wychodzi. Problem dotyczy faktur PDF.\",\n        \"Joanna Lewandowska\",\n        \"joanna.lewandowska@incoprp.local\",\n        \"Księgowość\",\n        \"Drukarki i skanery\",\n        \"Wysoki\",\n        \"W trakcie\",\n    ),\n    (\n        \"Problem z połączeniem VPN z domu\",\n        \"Po wpisaniu hasła VPN rozłącza się po kilku sekundach. Problem występuje od ostatniej aktualizacji laptopa.\",\n        \"Piotr Nowak\",\n        \"piotr.nowak@incoprp.local\",\n        \"Finanse\",\n        \"VPN i praca zdalna\",\n        \"Normalny\",\n        \"Nowe\",\n    ),\n    (\n        \"Teams nie wykrywa mikrofonu\",\n        \"Podczas spotkań w Teams mikrofon nie jest dostępny, mimo że działa w ustawieniach systemu.\"\
    ,\n        \"Tomasz Wiśniewski\",\n        \"tomasz.wisniewski@incoprp.local\",\n        \"Marketing\",\n        \"Telefon / Teams / wideokonferencje\",\n        \"Normalny\",\n        \"Oczekuje na użytkownika\",\n    ),\n    (\n        \"Brak dostępu do folderu Sprzedaż\",\n        \"Po zmianie stanowiska użytkownik nie widzi folderu współdzielonego Sprzedaż na dysku sieciowym.\",\n        \"Magdalena Zielińska\",\n        \"magdalena.zielinska@incoprp.local\",\n        \"Sprzedaż\",\n        \"Dostępy do systemów\",\n        \"Wysoki\",\n        \"Otwarte\",\n    ),\n    (\n        \"Laptop działa bardzo wolno po aktualizacji\",\n        \"Po ostatniej aktualizacji systemu laptop uruchamia się długo, a Excel i Outlook zawieszają się kilka razy dziennie.\",\n        \"Karolina Wójcik\",\n        \"karolina.wojcik@incoprp.local\",\n        \"Obsługa klienta\",\n        \"Komputer i laptop\",\n        \"Normalny\",\n        \"Nowe\",\n    ),\n]\ndef get_conn():\n    return psycopg2.connect(\n\
    \        host=DB_HOST,\n        port=DB_PORT,\n        dbname=DB_NAME,\n        user=DB_USER,\n        password=DB_PASSWORD,\n    )\ndef init_db():\n    for _ in range(40):\n        try:\n            conn = get_conn()\n            cur = conn.cursor()\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS users (\n                    id SERIAL PRIMARY KEY,\n                    first_name TEXT NOT NULL,\n                    last_name TEXT NOT NULL,\n                    email TEXT UNIQUE NOT NULL,\n                    department TEXT NOT NULL,\n                    role TEXT NOT NULL DEFAULT 'user',\n                    password_hash TEXT NOT NULL,\n                    created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n            cur.execute(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS first_name TEXT\")\n            cur.execute(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS last_name TEXT\")\n            cur.execute(\"\"\"\n                SELECT\
    \ EXISTS (\n                  SELECT 1\n                  FROM information_schema.columns\n                  WHERE table_name = 'users' AND column_name = 'full_name'\n                )\n            \"\"\")\n            has_full_name = cur.fetchone()[0]\n            if has_full_name:\n                cur.execute(\"\"\"\n                    UPDATE users\n                    SET\n                      first_name = COALESCE(NULLIF(first_name, ''), split_part(full_name, ' ', 1)),\n                      last_name = COALESCE(\n                        NULLIF(last_name, ''),\n                        NULLIF(trim(substr(full_name, length(split_part(full_name, ' ', 1)) + 1)), ''),\n                        '-'\n                      )\n                    WHERE first_name IS NULL OR first_name = '' OR last_name IS NULL OR last_name = ''\n                \"\"\")\n                cur.execute(\"ALTER TABLE users DROP COLUMN IF EXISTS full_name\")\n            cur.execute(\"UPDATE users SET first_name\
    \ = 'Nieznane' WHERE first_name IS NULL OR first_name = ''\")\n            cur.execute(\"UPDATE users SET last_name = '-' WHERE last_name IS NULL OR last_name = ''\")\n            cur.execute(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS roles TEXT[]\")\n            cur.execute(\"UPDATE users SET role = 'operator' WHERE role = 'agent'\")\n            cur.execute(\"\"\"\n                UPDATE users\n                SET first_name = 'Helpdesk', last_name = 'Operator'\n                WHERE email IN ('agent@incoprp.local', 'operator@incoprp.local')\n                  AND lower(first_name) = 'helpdesk'\n            \"\"\")\n            cur.execute(\"\"\"\n                UPDATE users\n                SET roles = CASE\n                    WHEN role = 'admin' THEN ARRAY['user','admin','operator']\n                    WHEN role = 'operator' THEN ARRAY['user','operator']\n                    ELSE ARRAY['user']\n                END\n                WHERE roles IS NULL OR array_length(roles, 1)\
    \ IS NULL\n            \"\"\")\n            cur.execute(\"UPDATE users SET roles = ARRAY['user'] WHERE NOT ('user' = ANY(roles))\")\n            cur.execute(\"\"\"\n                UPDATE users\n                SET role = CASE\n                    WHEN 'admin' = ANY(roles) THEN 'admin'\n                    WHEN 'operator' = ANY(roles) THEN 'operator'\n                    ELSE 'user'\n                END\n            \"\"\")\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS user_sessions (\n                    sid TEXT PRIMARY KEY,\n                    user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,\n                    created_at TIMESTAMP DEFAULT NOW(),\n                    last_seen TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n            cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS tickets (\n                    id SERIAL PRIMARY KEY,\n                    title TEXT NOT NULL,\n                   \
