    @app.post("/api/login")
    def api_login():
        payload = request.get_json(silent=True) or {}
        email = clean(payload.get("email")).lower()
        password = str(payload.get("password") or "")

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT first_name, last_name, email, department, role, password_hash, roles
            FROM users
            WHERE lower(email) = %s
        """, (email,))
        user = cur.fetchone()
        if not user:
            cur.close()
            conn.close()
            return jsonify({"error": "invalid credentials"}), 401

        first_name, last_name, user_email, department, role, password_hash, roles = user
        roles = list(roles or ["user"])
        if not check_password_hash(password_hash, password):
            cur.close()
            conn.close()
            return jsonify({"error": "invalid credentials"}), 401

        sid = str(uuid.uuid4())
        cur.execute("INSERT INTO user_sessions (sid, user_email) VALUES (%s, %s)", (sid, user_email))
        conn.commit()
        cur.close()
        conn.close()

        return jsonify({
            "sid": sid,
            "user": {
                "first_name": first_name,
                "last_name": last_name,
                "name": f"{first_name} {last_name}".strip(),
                "email": user_email,
                "department": department,
                "role": role_label(roles),
                "roles": roles,
            }
        })

    @app.post("/api/logout")
    def api_logout():
        sid = get_sid_from_request()
        if sid:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("DELETE FROM user_sessions WHERE sid = %s", (sid,))
            conn.commit()
