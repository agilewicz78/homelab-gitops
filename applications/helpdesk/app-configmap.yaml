                  <button type="button" class="btn-secondary btn-small" onclick="duplicateWorkflowAutomationRule(${{idx}}); return false;">Utwórz kopię roboczą</button>
                  <button type="button" class="btn-danger btn-small" onclick="deleteWorkflowAutomationRule(${{idx}}); return false;">Usuń</button>
                </div>
              </div>
              ${{workflowAutomationRuleDiagram(rule)}}
            </div>
          `;
        }}
