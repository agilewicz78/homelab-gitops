            if (!["comment_added", "user_comment_added", "staff_comment_added"].includes(rule.event_type)
                && hasSpecificValue(rule.condition_comment_visibility)) {{
              addIssue("error", "Warunek typu komentarza nie pasuje do zdarzenia", `„${{rule.name || `Reguła ${{item.index + 1}}`}}” sprawdza widoczność komentarza, ale zdarzenie nie jest komentarzem.`, [item.index]);
            }}
          }});
          for (let left = 0; left < activeRules.length; left += 1) {{
            for (let right = left + 1; right < activeRules.length; right += 1) {{
              const first = activeRules[left];
              const second = activeRules[right];
              if (workflowAutomationConditionFingerprint(first.rule) !== workflowAutomationConditionFingerprint(second.rule)) continue;
              const ordered = [first, second].sort((a, b) =>
                Number(a.rule.priority || 100) - Number(b.rule.priority || 100) || a.index - b.index
              );
              const earlier = ordered[0];
              const later = ordered[1];
              const earlierName = earlier.rule.name || `Reguła ${{earlier.index + 1}}`;
              const laterName = later.rule.name || `Reguła ${{later.index + 1}}`;
              const firstTargets = workflowAutomationRuleActions(first.rule)
                .filter(action => action.is_active !== false && action.action_type === "change_status")
                .map(action => action.action_value)
                .filter(Boolean);
              const secondTargets = workflowAutomationRuleActions(second.rule)
                .filter(action => action.is_active !== false && action.action_type === "change_status")
                .map(action => action.action_value)
                .filter(Boolean);
              const conflictingTargets = firstTargets.some(target => secondTargets.some(other => other !== target));
              if (conflictingTargets) {{
                addIssue("error", "Sprzeczna zmiana statusu", `„${{earlierName}}” i „${{laterName}}” mają te same warunki, ale ustawiają różne statusy.`, [first.index, second.index]);
              }}
              if (earlier.rule.stop_processing !== false) {{
                addIssue("error", "Późniejsza reguła jest zasłonięta", `„${{earlierName}}” pasuje do tych samych danych i zatrzymuje przetwarzanie, dlatego „${{laterName}}” nie zostanie wykonana.`, [earlier.index, later.index]);
              }} else if (Number(first.rule.priority || 100) === Number(second.rule.priority || 100)) {{
                addIssue("warning", "Dwie reguły mają te same warunki i priorytet", `„${{earlierName}}” i „${{laterName}}” mogą wykonać się w kolejności zależnej od czasu utworzenia. Nadaj im różne priorytety.`, [first.index, second.index]);
              }} else {{
                addIssue("warning", "Dwie aktywne reguły mają te same warunki", `„${{earlierName}}” i „${{laterName}}” mogą wykonać się dla tego samego zdarzenia. Sprawdź, czy jest to zamierzone.`, [first.index, second.index]);
              }}
            }}
          }}
          return {{
            active: activeRules.length,
            drafts: source.length - activeRules.length,
            errors: issues.filter(issue => issue.severity === "error").length,
            warnings: issues.filter(issue => issue.severity === "warning").length,
            issues,
          }};
        }}
        function workflowAutomationSafetyPanel(rules) {{
          const report = workflowAutomationSafetyReport(rules);
          const healthy = report.errors === 0 && report.warnings === 0;
          const issueRows = report.issues.map(issue => `
            <div class="${{issue.severity === "error" ? "error" : "readonly-box"}}" style="margin-top:8px">
              <strong>${{esc(issue.title)}}</strong>
              <div style="margin-top:4px">${{esc(issue.detail)}}</div>
            </div>
          `).join("");
          return `
            <div class="panel-soft" style="margin:10px 0 14px">
              <div class="ticket-section-title">
                <div>
                  <strong>Kontrola bezpieczeństwa automatyzacji</strong>
                  <div class="attachment-upload-hint">Sprawdza typowe konflikty przed włączeniem reguł. Nie wykonuje żadnych akcji na zgłoszeniach.</div>
                </div>
                <span class="status-badge ${{healthy ? "status-new" : report.errors ? "status-closed" : "status-wait"}}">
                  ${{healthy ? "Brak problemów" : `${{report.errors}} błędów · ${{report.warnings}} ostrzeżeń`}}
                </span>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                ${{workflowAutomationRuleBadge(`Aktywne: ${{report.active}}`)}}
                ${{workflowAutomationRuleBadge(`Wersje robocze: ${{report.drafts}}`)}}
              </div>
              ${{issueRows || `<div class="success" style="margin-top:8px">Aktywne reguły nie mają wykrytych konfliktów.</div>`}}
            </div>
          `;
        }}
        function workflowAutomationDiagramConditions(rule) {{
          const conditions = [];
          const add = (label, operator, rawValue, displayValue = rawValue) => {{
            if (!rawValue || rawValue === "*" || rawValue === "any") return;
            conditions.push(`${{label}} ${{workflowConditionOperatorLabel(operator || "eq")}} ${{displayValue}}`);
          }};
          add("Status bieżący", rule.condition_status_operator, rule.condition_status);
          if (rule.event_type === "status_changed") {{
            add("Status docelowy", rule.condition_to_status_operator, rule.condition_to_status);
          }}
          add("Rola wykonawcy", rule.condition_role_operator, rule.condition_role, workflowAutomationRoleLabel(rule.condition_role));
          if (["comment_added", "user_comment_added", "staff_comment_added"].includes(rule.event_type)) {{
            add("Komentarz", rule.condition_comment_visibility_operator, rule.condition_comment_visibility, workflowAutomationVisibilityLabel(rule.condition_comment_visibility));
          }}
          add("Przypisanie", rule.assigned_state_operator, rule.assigned_state, workflowAutomationAssignedLabel(rule.assigned_state));
          add("Priorytet", rule.condition_priority_operator, rule.condition_priority);
          add("Kategoria", rule.condition_category_operator, rule.condition_category);
          add("Podkategoria", rule.condition_subcategory_operator, rule.condition_subcategory);
          add("SLA", rule.condition_sla_state_operator, rule.condition_sla_state, workflowAutomationSlaConditionLabel(rule.condition_sla_state));
          return conditions;
        }}
        function workflowAutomationDiagramNode(kind, kicker, title, items = []) {{
          const list = items.length
            ? `<ul>${{items.map(item => `<li>${{esc(item)}}</li>`).join("")}}</ul>`
            : "";
          return `
            <div class="workflow-diagram-node ${{kind}}">
              <span class="workflow-diagram-kicker">${{esc(kicker)}}</span>
              <strong>${{esc(title)}}</strong>
              ${{list}}
            </div>
          `;
        }}
        function workflowAutomationRuleDiagram(rule) {{
          const conditions = workflowAutomationDiagramConditions(rule);
          const requirements = workflowAutomationRuleActions(rule)
            .filter(action => ["require_comment", "require_attachment"].includes(action.action_type))
            .map(action => workflowAutomationActionSummary(action));
          const actions = workflowAutomationRuleAfterActions(rule)
            .map(action => workflowAutomationActionSummary(action));
          const nodes = [
            workflowAutomationDiagramNode(
              "event",
              "Zdarzenie",
              workflowAutomationRuleEventLabel(rule.event_type),
              [workflowAutomationRuleWhenText(rule)]
            ),
            workflowAutomationDiagramNode(
              "condition",
              "Warunki: ORAZ",
              conditions.length ? "Wszystkie warunki muszą pasować" : "Bez dodatkowych warunków",
              conditions
            ),
          ];
          if (requirements.length) {{
            nodes.push(workflowAutomationDiagramNode(
              "requirement",
              "Wymagania",
              "Sprawdź przed wykonaniem",
              requirements
            ));
          }}
          nodes.push(workflowAutomationDiagramNode(
            "action",
            "Akcje",
            actions.length ? "Wykonaj po kolei" : "Brak dodatkowych akcji",
            actions
          ));
          return `
            <div class="workflow-diagram-lane">
              ${{nodes.map((node, idx) => `${{idx ? `<div class="workflow-diagram-arrow" aria-hidden="true">→</div>` : ""}}${{node}}`).join("")}}
            </div>
            <div class="workflow-diagram-note">
              Reguła ma priorytet ${{Number(rule.priority || 100)}} i ${{rule.stop_processing !== false ? "zatrzymuje" : "nie zatrzymuje"}} kolejne reguły po wykonaniu.
            </div>
          `;
        }}
        function workflowAutomationRuleDiagramCard(rule, idx) {{
          const activeBadge = rule.is_active !== false
