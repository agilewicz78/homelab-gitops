service:
  type: ClusterIP

tls:
  force: true

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  hosts:
    - host: portainer.lab.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portainer-lab-local-tls
      hosts:
        - portainer.lab.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
