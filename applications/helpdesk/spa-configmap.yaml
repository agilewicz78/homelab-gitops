          if (status === "Rozwiązane") return "Operator oznaczył sprawę jako rozwiązaną. Sprawdź rozwiązanie i potwierdź, czy problem faktycznie zniknął.";
          if (status === "Oczekuje na użytkownika") return "Czekamy na Twoją odpowiedź. Dodaj publiczny komentarz albo załącznik, żeby operator mógł iść dalej.";
          if (Number(ticket.active_incident_count || 0) > 0) return "Sprawa jest obsługiwana w ramach incydentu zbiorczego. Aktualizacje będą pojawiać się w komentarzach.";
          if (!ticket.assigned_to_name) return "Zgłoszenie czeka na przypisanie operatora. Nie musisz tworzyć kolejnego zgłoszenia.";
          if (!ticket.first_response_at) return "Operator ma zgłoszenie w kolejce i powinien udzielić pierwszej odpowiedzi zgodnie z SLA.";
          return `Zgłoszenie obsługuje ${ticket.assigned_to_name}. Kolejne informacje pojawią się w komentarzach i powiadomieniach.`;
