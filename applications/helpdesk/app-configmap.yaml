                  <div><label>Poziom</label><select name="severity">${{(data.meta?.severities || []).map(s => `<option ${{s === "SEV2" ? "selected" : ""}}>${{esc(s)}}</option>`).join("")}}</select></div>
                  <div><label>Dowódca incydentu</label><select name="commander_email"><option value="">Ja</option>${{commanderOptions}}</select></div>
