    \ndef get_conn():\n    return psycopg2.connect(\n        host=DB_HOST,\n     \
    \   port=DB_PORT,\n        dbname=DB_NAME,\n        user=DB_USER,\n        password=DB_PASSWORD,\n\
    \    )\n\ndef init_db():\n    for _ in range(40):\n        try:\n            conn\
    \ = get_conn()\n            cur = conn.cursor()\n\n            cur.execute(\"\"\
    \"\n                CREATE TABLE IF NOT EXISTS users (\n                    id\
    \ SERIAL PRIMARY KEY,\n                    first_name TEXT NOT NULL,\n       \
    \             last_name TEXT NOT NULL,\n                    email TEXT UNIQUE\
    \ NOT NULL,\n                    department TEXT NOT NULL,\n                 \
    \   role TEXT NOT NULL DEFAULT 'user',\n                    password_hash TEXT\
    \ NOT NULL,\n                    created_at TIMESTAMP DEFAULT NOW()\n        \
    \        );\n            \"\"\")\n\n            cur.execute(\"ALTER TABLE users\
    \ ADD COLUMN IF NOT EXISTS first_name TEXT\")\n            cur.execute(\"ALTER\
    \ TABLE users ADD COLUMN IF NOT EXISTS last_name TEXT\")\n            cur.execute(\"\
    \"\"\n                SELECT EXISTS (\n                  SELECT 1\n          \
    \        FROM information_schema.columns\n                  WHERE table_name =\
    \ 'users' AND column_name = 'full_name'\n                )\n            \"\"\"\
    )\n            has_full_name = cur.fetchone()[0]\n            if has_full_name:\n\
    \                cur.execute(\"\"\"\n                    UPDATE users\n      \
    \              SET\n                      first_name = COALESCE(NULLIF(first_name,\
    \ ''), split_part(full_name, ' ', 1)),\n                      last_name = COALESCE(\n\
    \                        NULLIF(last_name, ''),\n                        NULLIF(trim(substr(full_name,\
    \ length(split_part(full_name, ' ', 1)) + 1)), ''),\n                        '-'\n\
    \                      )\n                    WHERE first_name IS NULL OR first_name\
    \ = '' OR last_name IS NULL OR last_name = ''\n                \"\"\")\n     \
    \           cur.execute(\"ALTER TABLE users DROP COLUMN IF EXISTS full_name\"\
    )\n            cur.execute(\"UPDATE users SET first_name = 'Nieznane' WHERE first_name\
    \ IS NULL OR first_name = ''\")\n            cur.execute(\"UPDATE users SET last_name\
    \ = '-' WHERE last_name IS NULL OR last_name = ''\")\n\n            cur.execute(\"\
    \"\"\n                CREATE TABLE IF NOT EXISTS user_sessions (\n           \
    \         sid TEXT PRIMARY KEY,\n                    user_email TEXT NOT NULL\
    \ REFERENCES users(email) ON DELETE CASCADE,\n                    created_at TIMESTAMP\
    \ DEFAULT NOW(),\n                    last_seen TIMESTAMP DEFAULT NOW()\n    \
    \            );\n            \"\"\")\n\n            cur.execute(\"\"\"\n     \
    \           CREATE TABLE IF NOT EXISTS tickets (\n                    id SERIAL\
    \ PRIMARY KEY,\n                    title TEXT NOT NULL,\n                   \
    \ description TEXT NOT NULL,\n                    requester_name TEXT NOT NULL,\n\
    \                    requester_email TEXT NOT NULL,\n                    department\
    \ TEXT NOT NULL,\n                    category TEXT NOT NULL,\n              \
    \      priority TEXT NOT NULL,\n                    status TEXT NOT NULL,\n  \
    \                  created_at TIMESTAMP DEFAULT NOW(),\n                    updated_at\
    \ TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\")\n\n       \
    \     cur.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS comments\
    \ (\n                    id SERIAL PRIMARY KEY,\n                    ticket_id\
    \ INTEGER REFERENCES tickets(id) ON DELETE CASCADE,\n                    author\
    \ TEXT NOT NULL,\n                    content TEXT NOT NULL,\n               \
    \     created_at TIMESTAMP DEFAULT NOW()\n                );\n            \"\"\
    \")\n\n            cur.execute(\"\"\"\n                ALTER TABLE tickets\n \
    \               ADD COLUMN IF NOT EXISTS assigned_to_email TEXT REFERENCES users(email)\
    \ ON DELETE SET NULL\n            \"\"\")\n            cur.execute(\"\"\"\n  \
    \              ALTER TABLE tickets\n                ADD COLUMN IF NOT EXISTS sla_due_at\
    \ TIMESTAMP\n            \"\"\")\n            cur.execute(\"\"\"\n           \
    \     UPDATE tickets\n                SET sla_due_at = created_at + CASE priority\n\
    \                    WHEN 'Krytyczny' THEN INTERVAL '4 hours'\n              \
    \      WHEN 'Wysoki' THEN INTERVAL '8 hours'\n                    WHEN 'Normalny'\
    \ THEN INTERVAL '48 hours'\n                    WHEN 'Niski' THEN INTERVAL '120\
    \ hours'\n                    ELSE INTERVAL '48 hours'\n                END\n\
    \                WHERE sla_due_at IS NULL\n            \"\"\")\n            cur.execute(\"\
    \"\"\n                CREATE TABLE IF NOT EXISTS ticket_events (\n           \
    \         id SERIAL PRIMARY KEY,\n                    ticket_id INTEGER REFERENCES\
    \ tickets(id) ON DELETE CASCADE,\n                    actor_email TEXT,\n    \
    \                actor_name TEXT,\n                    event_type TEXT NOT NULL,\n\
    \                    message TEXT NOT NULL,\n                    created_at TIMESTAMP\
    \ DEFAULT NOW()\n                );\n            \"\"\")\n\n            password_hash\
    \ = generate_password_hash(INITIAL_PASSWORD)\n            for first_name, last_name,\
    \ email, department, role in SEED_USERS:\n                cur.execute(\"\"\"\n\
    \                    INSERT INTO users (first_name, last_name, email, department,\
