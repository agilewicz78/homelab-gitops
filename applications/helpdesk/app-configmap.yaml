        parts.append(workflow_condition_text("Przypisanie", item.get("assigned_state_operator"), item.get("assigned_state"), "dowolne"))
        parts.append(workflow_condition_text("Priorytet", item.get("condition_priority_operator"), item.get("condition_priority"), "dowolny"))
        if workflow_category and workflow_category != "*" and workflow_wildcard_value(item.get("condition_category")):
            parts.append(f"Kategoria: {workflow_category} (z workflow)")
        else:
