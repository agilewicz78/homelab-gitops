        payload, error = service_payload_from_request(request.get_json(silent=True) or {})
        if error:
            return jsonify({"error": error}), 400
        conn = get_conn()
        cur = conn.cursor()
        if payload["owner_email"]:
            cur.execute("SELECT 1 FROM users WHERE lower(email) = lower(%s)", (payload["owner_email"],))
