              <td><span class="pill ${priorityClass(t.priority)}">${esc(t.priority)}</span></td>
              <td><span class="pill ${statusClass(t.status)}">${esc(t.status)}</span></td>
              <td>${t.assigned_to_name ? esc(t.assigned_to_name) : '<span class="muted">Nieprzypisane</span>'}</td>
