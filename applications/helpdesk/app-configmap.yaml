        if severity not in INCIDENT_SEVERITIES or status not in INCIDENT_STATUSES:
            return jsonify({"error": "Nieprawidłowy poziom SEV lub status."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT status FROM incidents WHERE id = %s", (incident_id,))
        current = cur.fetchone()
        if not current:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        resolved_commander_email, commander_name = incident_commander(cur, commander_email)
        if commander_email and not resolved_commander_email:
            cur.close()
            conn.close()
            return jsonify({"error": "Dowódca incydentu musi być operatorem lub administratorem."}), 400
        cur.execute("""
            UPDATE incidents
            SET title = %s,
                summary = %s,
                impact = %s,
                severity = %s,
                status = %s,
                commander_email = %s,
                commander_name = %s,
                updated_at = NOW(),
                resolved_at = CASE
                  WHEN %s = 'resolved' THEN COALESCE(resolved_at, NOW())
                  ELSE NULL
                END
            WHERE id = %s
        """, (
            title, summary, impact, severity, status,
            resolved_commander_email, commander_name,
