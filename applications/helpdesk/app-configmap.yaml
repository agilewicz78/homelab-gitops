    \ 201\n@app.get(\"/api/attachments/<int:attachment_id>/download\")\n@api_login_required\ndef api_download_attachment(user, attachment_id):\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT ticket_id, original_filename, stored_filename, content_type\n        FROM attachments\n        WHERE id = %s\n    \"\"\", (attachment_id,))\n    row = cur.fetchone()\n    cur.close()\n    conn.close()\n    if not row:\n        return jsonify({\"error\": \"not found\"}), 404\n    ticket_id, original_filename, stored_filename, content_type = row\n    if not can_view_ticket(user, ticket_id):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    try:\n        target_path = attachment_path(stored_filename)\n    except ValueError:\n        return jsonify({\"error\": \"invalid attachment path\"}), 400\n    if not os.path.exists(target_path):\n        return jsonify({\"error\": \"file not found\"}), 404\n    return send_file(\n        target_path,\n        as_attachment=True,\n\
