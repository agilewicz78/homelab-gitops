                  condition_status: rule.condition_status || "",
                  condition_to_status: rule.condition_to_status || "",
                  condition_role: rule.condition_role || "*",
                  condition_comment_visibility: rule.condition_comment_visibility || "*",
                  assigned_state: rule.assigned_state || "*",
                  condition_priority: rule.condition_priority || "*",
                  condition_category: rule.condition_category || "*",
                  condition_subcategory: rule.condition_subcategory || "*",
                  condition_sla_state: rule.condition_sla_state || "*",
                  condition_status_operator: rule.condition_status_operator || "eq",
                  condition_to_status_operator: rule.condition_to_status_operator || "eq",
                  condition_role_operator: rule.condition_role_operator || "eq",
                  condition_comment_visibility_operator: rule.condition_comment_visibility_operator || "eq",
                  assigned_state_operator: rule.assigned_state_operator || "eq",
                  condition_priority_operator: rule.condition_priority_operator || "eq",
                  condition_category_operator: rule.condition_category_operator || "eq",
                  condition_subcategory_operator: rule.condition_subcategory_operator || "eq",
                  condition_sla_state_operator: rule.condition_sla_state_operator || "eq",
                  action_type: (workflowAutomationRuleActions(rule)[0]?.action_type) || rule.action_type || "change_status",
                  action_status: (workflowAutomationRuleActions(rule)[0]?.action_value) || rule.action_status || "",
                  actions: workflowAutomationRuleActions(rule).map((action, idx) => ({
                    action_type: action.action_type || "change_status",
                    action_value: action.action_value || "",
                    is_active: action.is_active !== false,
                    action_order: Number(action.action_order || (idx + 1)),
                  })),
                  is_active: rule.is_active !== false,
                  stop_processing: rule.stop_processing !== false,
                  priority: Number(rule.priority || 100),
                }))
                .filter(rule => !!rule.event_type && Array.isArray(rule.actions) && rule.actions.length > 0);
            }
            const endpoint = editing ? `/api/admin/workflows/${workflow.id}` : "/api/admin/workflows";
            const method = editing ? "PUT" : "POST";
            const res = await api(endpoint, { method, body: JSON.stringify(payload) });
            const msg = document.getElementById("workflowMessage");
            const err = document.getElementById("workflowError");
            msg.classList.add("hidden");
            err.classList.add("hidden");
            if (!res || !res.ok) {
