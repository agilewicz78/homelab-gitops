    SPA_HTML = f"""
    <!doctype html>
    <html lang="pl">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>INCoprp Helpdesk</title>
      <style>{CSS}</style>
    </head>
    <body>
      <main class="page">
        <header>
          <div>
            <h1>INCoprp Helpdesk</h1>
            <p class="subtitle">Centrum zgłoszeń IT dla pracowników biurowych.</p>
          </div>
          <div class="header-actions">
            <div id="userBadge" class="badge">Ładowanie...</div>
            <div class="notification-wrapper">
              <button id="notificationButton" class="notification-btn" onclick="toggleNotifications(); return false;">
                🔔 Powiadomienia <span id="notificationCount" class="notification-count hidden">0</span>
              </button>
              <div id="notificationPanel" class="notification-panel hidden">
                <div class="notification-panel-header">
                  <h3>Powiadomienia</h3>
                  <button class="btn-secondary btn-small" onclick="markAllNotificationsRead(); return false;">Oznacz wszystkie</button>
                </div>
                <div id="notificationList" class="notification-list">
                  <p class="muted">Brak powiadomień.</p>
                </div>
              </div>
            </div>
            <div id="livePanel" class="live-panel">
              <div class="live-row"><span>WebSocket</span><span id="wsStatus" class="live-value ws-disconnected">disconnected</span></div>
              <div class="live-row"><span>Aktywni</span><span id="wsClients" class="live-value">-</span></div>
              <div class="live-row"><span>Czas serwera</span><span id="wsTime" class="live-value">-</span></div>
              <div class="live-row"><span>Ostatnie zdarzenie</span><span id="wsEvent" class="live-value">-</span></div>
            </div>
          </div>
        </header>
        <div id="app"></div>
      </main>

      <div id="toast" class="toast"></div>

      <script>
        const appEl = document.getElementById("app");
        const userBadge = document.getElementById("userBadge");
        const notificationButton = document.getElementById("notificationButton");
        const notificationCount = document.getElementById("notificationCount");
        const notificationPanel = document.getElementById("notificationPanel");
        const notificationList = document.getElementById("notificationList");
        const wsStatus = document.getElementById("wsStatus");
        const wsClients = document.getElementById("wsClients");
        const wsTime = document.getElementById("wsTime");
        const wsEvent = document.getElementById("wsEvent");
        let liveSocket = null;
        let liveReconnectTimer = null;
        let lastLiveEventId = null;
        let currentView = {{ name: "home", ticketId: null }};
        let suppressNextLiveRefresh = false;

        function getSid() {{ return sessionStorage.getItem("helpdesk_sid") || ""; }}
        function setSid(sid) {{ sessionStorage.setItem("helpdesk_sid", sid); }}
        function clearSid() {{ sessionStorage.removeItem("helpdesk_sid"); }}

        async function api(path, options = {{}}) {{
          const headers = options.headers || {{}};
          headers["X-Helpdesk-Session"] = getSid();
          if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
          const res = await fetch(path, {{ ...options, headers }});
          if (res.status === 401) {{
            clearSid();
            window.location.href = "/login";
            return null;
          }}
          return res;
        }}

        function esc(value) {{
          return String(value ?? "").replace(/[&<>"']/g, ch => ({{
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
          }}[ch]));
        }}




        function formatBytes(bytes) {{
          const value = Number(bytes || 0);
          if (value < 1024) return value + " B";
          if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " KB";
          return (value / (1024 * 1024)).toFixed(1) + " MB";
        }}

        async function downloadAttachment(id, filename) {{
          const res = await fetch(`/api/attachments/${{id}}/download`, {{
            headers: {{ "X-Helpdesk-Session": getSid() }}
          }});
          if (res.status === 401) {{
            clearSid();
            window.location.href = "/login";
            return;
          }}
          if (!res.ok) {{
            alert("Nie udało się pobrać załącznika.");
            return;
          }}
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename || "attachment";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }}

        function showToast(message, details = "") {{
          const toast = document.getElementById("toast");
          if (!toast) return;

          const small = details ? "<small>" + esc(details) + "</small>" : "";
          toast.innerHTML = "<div>" + esc(message) + "</div>" + small;

          toast.classList.add("show");

          clearTimeout(window.__helpdeskToastTimer);
          window.__helpdeskToastTimer = setTimeout(() => {{
            toast.classList.remove("show");
          }}, 4200);
        }}

        function notificationTypeLabel(type) {{
          const map = {{
            ticket_created: "Nowe zgłoszenie",
            status_changed: "Zmiana statusu",
            comment_added: "Komentarz",
            internal_note_added: "Notatka wewnętrzna",
            assignment_changed: "Przypisanie",
            attachment_added: "Załącznik"
          }};
          return map[type] || "Powiadomienie";
        }}

        async function loadNotifications() {{
          if (!getSid()) return;
          const res = await api("/api/notifications");
          if (!res || !res.ok) return;
          const data = await res.json();
          const unread = Number(data.unread_count || 0);

          notificationCount.textContent = unread;
          notificationCount.classList.toggle("hidden", unread <= 0);
          notificationButton.classList.toggle("has-unread", unread > 0);

          const items = data.notifications || [];
          if (!items.length) {{
            notificationList.innerHTML = `<p class="muted">Brak powiadomień.</p>`;
            return;
          }}

          notificationList.innerHTML = items.map(n => `
            <button class="notification-item ${{n.is_read ? "" : "unread"}}" onclick="openNotification(${{n.id}}, ${{n.ticket_id || "null"}}); return false;">
              <div class="notification-message">${{esc(n.message)}}</div>
              <div class="notification-meta">${{esc(notificationTypeLabel(n.type))}} · ${{esc(n.created_at)}}${{n.is_read ? "" : " · nieprzeczytane"}}</div>
            </button>
          `).join("");
        }}

        function toggleNotifications() {{
          notificationPanel.classList.toggle("hidden");
          if (!notificationPanel.classList.contains("hidden")) loadNotifications();
        }}

        async function openNotification(id, ticketId) {{
          await api(`/api/notifications/${{id}}/read`, {{ method: "POST" }});
          await loadNotifications();
          notificationPanel.classList.add("hidden");
          if (ticketId) {{
            await renderTicket(ticketId);
          }}
        }}

        async function markAllNotificationsRead() {{
          await api("/api/notifications/read-all", {{ method: "POST" }});
          await loadNotifications();
        }}

        function priorityClass(priority) {{ return "priority-" + String(priority || "").replaceAll(" ", "-"); }}

        function hasRole(user, role) {{
          return Array.isArray(user?.roles) && user.roles.includes(role);
        }}
        function isAdmin(user) {{ return hasRole(user, "admin"); }}
        function isOperator(user) {{ return hasRole(user, "operator"); }}
        function canWorkTickets(user) {{
          return !!(user && (isOperator(user) || isAdmin(user)));
        }}
        function roleBadges(roles) {{
          const list = Array.isArray(roles) && roles.length ? roles : ["user"];
          return list.map(r => `<span class="pill">${{esc(r)}}</span>`).join(" ");
        }}

        function slaClass(state) {{
          const map = {{
            "ok": "sla-ok",
            "warning": "sla-warning",
            "overdue": "sla-overdue",
            "done": "sla-done",
            "none": "sla-none"
          }};
          return map[state] || "sla-none";
        }}

        function slaLabel(state) {{
          const map = {{
            "ok": "SLA OK",
            "warning": "Blisko SLA",
            "overdue": "SLA przekroczone",
            "done": "Zakończone",
            "none": "Brak SLA"
          }};
          return map[state] || "Brak SLA";
        }}

        function statusClass(status) {{
          return "status-" + String(status || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replaceAll("ł", "l")
            .replaceAll("Ł", "L")
            .replace(/[^a-zA-Z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
        }}
        function setWsStatus(text, connected) {{
          wsStatus.textContent = text;
          wsStatus.className = connected ? "live-value ws-connected" : "live-value ws-disconnected";
        }}

        function connectLive() {{
          const sid = getSid();
          if (!sid) return;
          if (liveSocket && (liveSocket.readyState === WebSocket.OPEN || liveSocket.readyState === WebSocket.CONNECTING)) return;

          const scheme = window.location.protocol === "https:" ? "wss" : "ws";
          liveSocket = new WebSocket(`${{scheme}}://${{window.location.host}}/ws`);
          setWsStatus("connecting", false);

          liveSocket.onopen = () => {{
            setWsStatus("connected", true);
            liveSocket.send(JSON.stringify({{ type: "auth", sid }}));
          }};

          liveSocket.onmessage = (event) => {{
            const data = JSON.parse(event.data);
            handleLivePayload(data);
          }};

          liveSocket.onclose = () => {{
            setWsStatus("disconnected", false);
            if (getSid()) {{
              clearTimeout(liveReconnectTimer);
              liveReconnectTimer = setTimeout(connectLive, 2000);
            }}
          }};

          liveSocket.onerror = () => {{
            try {{ liveSocket.close(); }} catch (e) {{}}
          }};
        }}

        async function handleLivePayload(data) {{
          wsClients.textContent = data.active_clients ?? "-";
          wsTime.textContent = data.server_time ?? "-";

          const liveEvent = data.event || null;
          wsEvent.textContent = liveEvent?.message || data.message || "-";

          if (!liveEvent || !liveEvent.id || liveEvent.id === lastLiveEventId) return;
          lastLiveEventId = liveEvent.id;

          await loadNotifications();

          if (!["ticket_created", "status_changed", "comment_added", "internal_note_added", "assignment_changed", "attachment_added"].includes(liveEvent.type)) return;

          if (liveEvent.type === "status_changed" && !suppressNextLiveRefresh) {{
            showToast(
              "Zmieniono status zgłoszenia #" + liveEvent.ticket_id,
              liveEvent.message || ""
            );
          }}

          if (liveEvent.type === "internal_note_added" && !suppressNextLiveRefresh) {{
            showToast(
              "Dodano notatkę wewnętrzną do zgłoszenia #" + liveEvent.ticket_id,
              liveEvent.message || ""
            );
          }}

          if (suppressNextLiveRefresh) {{
            suppressNextLiveRefresh = false;
            return;
          }}

          if (currentView.name === "ticket" && Number(currentView.ticketId) === Number(liveEvent.ticket_id)) {{
            await renderTicket(liveEvent.ticket_id, true);
            return;
          }}

          if (currentView.name === "home") {{
            await renderHome(loadStatusFilters(), true);
          }}
        }}

        function disconnectLive() {{
          clearTimeout(liveReconnectTimer);
          if (liveSocket) {{
            try {{ liveSocket.close(); }} catch (e) {{}}
          }}
          liveSocket = null;
          setWsStatus("disconnected", false);
          wsClients.textContent = "-";
          wsTime.textContent = "-";
          wsEvent.textContent = "-";
        }}

        function loadStatusFilters() {{
          try {{ return JSON.parse(sessionStorage.getItem("helpdesk_status_filters") || "[]"); }}
          catch {{ return []; }}
        }}
        function saveStatusFilters(filters) {{
          sessionStorage.setItem("helpdesk_status_filters", JSON.stringify(filters));
        }}
        function loadAssignedFilter(user = null) {{
          const stored = sessionStorage.getItem("helpdesk_assigned_filter");
          if (stored) return stored;
          if (user && canWorkTickets(user) && isOperator(user)) return "me";
          if (user && canWorkTickets(user)) return "all";
          return "all";
        }}
        function saveAssignedFilter(value) {{ sessionStorage.setItem("helpdesk_assigned_filter", value || "all"); }}
        function loadPriorityFilter() {{ return sessionStorage.getItem("helpdesk_priority_filter") || "all"; }}
        function savePriorityFilter(value) {{ sessionStorage.setItem("helpdesk_priority_filter", value || "all"); }}
        function loadSlaFilter() {{ return sessionStorage.getItem("helpdesk_sla_filter") || "all"; }}
        function saveSlaFilter(value) {{ sessionStorage.setItem("helpdesk_sla_filter", value || "all"); }}
        function loadTicketSearch() {{ return sessionStorage.getItem("helpdesk_ticket_search") || ""; }}
        function saveTicketSearch(value) {{ sessionStorage.setItem("helpdesk_ticket_search", value || ""); }}
        function loadTicketSort() {{ return sessionStorage.getItem("helpdesk_ticket_sort") || "created_at"; }}
        function saveTicketSort(value) {{ sessionStorage.setItem("helpdesk_ticket_sort", value || "created_at"); }}
        function loadTicketOrder() {{ return sessionStorage.getItem("helpdesk_ticket_order") || "desc"; }}
        function saveTicketOrder(value) {{ sessionStorage.setItem("helpdesk_ticket_order", value || "desc"); }}
        function loadTicketPage() {{ return Number(sessionStorage.getItem("helpdesk_ticket_page") || "1") || 1; }}
        function saveTicketPage(value) {{ sessionStorage.setItem("helpdesk_ticket_page", String(Math.max(1, Number(value) || 1))); }}
        function loadTicketPageSize() {{ return Number(sessionStorage.getItem("helpdesk_ticket_page_size") || "10") || 10; }}
        function saveTicketPageSize(value) {{ sessionStorage.setItem("helpdesk_ticket_page_size", String(Number(value) || 10)); }}
        function resetTicketPage() {{ saveTicketPage(1); }}

        function toggleStatusFilter(status) {{
          const filters = loadStatusFilters();
          const next = filters.includes(status) ? filters.filter(s => s !== status) : filters.concat([status]);
          saveStatusFilters(next);
          resetTicketPage();
          renderHome(next);
        }}
        function clearStatusFilters() {{
          saveStatusFilters([]);
          resetTicketPage();
          renderHome([]);
        }}
        function setAssignedFilter(value) {{ saveAssignedFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}
        function setPriorityFilter(value) {{ savePriorityFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}
        function setSlaFilter(value) {{ saveSlaFilter(value); resetTicketPage(); renderHome(loadStatusFilters()); }}
        function applyTicketSearch(event) {{
          if (event) event.preventDefault();
          const input = document.getElementById("ticket-search-input");
          saveTicketSearch(input ? input.value.trim() : "");
          resetTicketPage();
          renderHome(loadStatusFilters());
        }}
        function setTicketSort(value) {{ saveTicketSort(value); resetTicketPage(); renderHome(loadStatusFilters()); }}
        function setTicketOrder(value) {{ saveTicketOrder(value); resetTicketPage(); renderHome(loadStatusFilters()); }}
        function setTicketPageSize(value) {{ saveTicketPageSize(value); resetTicketPage(); renderHome(loadStatusFilters()); }}
        function goTicketPage(page) {{ saveTicketPage(page); renderHome(loadStatusFilters()); }}

        function buildPaginationButtons(pagination) {{
          const page = Number(pagination.page || 1);
          const totalPages = Number(pagination.total_pages || 1);
          const buttons = [];

          function addButton(label, targetPage, disabled = false, active = false) {{
            buttons.push(`
              <button
                class="pagination-btn ${{active ? "active" : ""}}"
                ${{disabled ? "disabled" : ""}}
                onclick="goTicketPage(${{targetPage}})"
              >${{label}}</button>
            `);
          }}

          addButton("«", 1, page <= 1);
          addButton("‹", Math.max(1, page - 1), page <= 1);

          const candidates = [1, totalPages, page - 2, page - 1, page, page + 1, page + 2]
            .filter(p => p >= 1 && p <= totalPages);
          const pages = [...new Set(candidates)].sort((a, b) => a - b);

          let previous = 0;
          for (const p of pages) {{
            if (previous && p - previous > 1) {{
              buttons.push(`<span class="pagination-ellipsis">…</span>`);
            }}
            addButton(String(p), p, false, p === page);
            previous = p;
          }}

          addButton("›", Math.min(totalPages, page + 1), page >= totalPages);
          addButton("»", totalPages, page >= totalPages);

          return buttons.join("");
        }}
        function clearAllFilters() {{
          saveStatusFilters([]);
          savePriorityFilter("all");
          saveSlaFilter("all");
          saveTicketSearch("");
          saveTicketSort("created_at");
          saveTicketOrder("desc");
          saveTicketPageSize(10);
          saveTicketPage(1);
          sessionStorage.removeItem("helpdesk_assigned_filter");
          renderHome([]);
        }}

        function statusFilterLabel(filters) {{
          if (!filters || !filters.length) return "Wszystkie statusy";
          if (filters.length === 1) return filters[0];
          return `${{filters.length}} statusy: ${{filters.join(", ")}}`;
        }}
        function assignedFilterLabel(value, operators) {{
          if (value === "me") return "Moje zgłoszenia";
          if (value === "all") return "Wszystkie";
          if (value === "unassigned") return "Nieprzypisane";
          const op = (operators || []).find(o => String(o.email).toLowerCase() === String(value).toLowerCase());
          return op ? op.name : value;
        }}
        function slaFilterLabel(value) {{
          const map = {{ all: "Wszystkie SLA", ok: "OK", warning: "Blisko terminu", overdue: "Przekroczone", done: "Zakończone", none: "Brak SLA" }};
          return map[value] || "Wszystkie SLA";
        }}

