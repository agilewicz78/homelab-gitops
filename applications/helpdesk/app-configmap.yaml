        return {"status": "ok"}

    @app.get("/login")
    def login_form():
        error = request.args.get("error")
        error_html = "<p class='muted'>Nieprawidłowy e-mail albo hasło.</p>" if error else ""

        content = f"""
        <section class="card login-box">
