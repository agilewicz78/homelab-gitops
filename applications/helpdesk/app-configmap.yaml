          const labels = {{
            change_status: "Zmień status",
            change_priority: "Zmień priorytet",
            assign_user: "Przypisz operatora",
            assign_least_loaded_operator: "Przypisz najmniej obciążonego operatora",
            add_workflow_operators_as_watchers: "Dodaj operatorów workflow jako obserwatorów",
            add_watcher: "Dodaj obserwatora",
            notify: "Wyślij powiadomienie",
            add_history: "Dodaj wpis do historii",
            add_system_comment: "Dodaj komentarz systemowy",
            require_comment: "Wymagaj komentarza",
            require_attachment: "Wymagaj załącznika"
          }};
          return labels[type] || type || "Akcja";
        }}
        function workflowRuleExecutionResultLabel(result) {{
          const labels = {{
            executed: "wykonano",
            skipped: "pominięto",
            blocked: "zablokowano",
            validation_ok: "warunek spełniony",
            validation_failed: "warunek niespełniony",
            not_required: "niewymagane"
          }};
          return labels[result] || result || "—";
        }}
        function workflowRuleExecutionActionSummary(actions) {{
          if (!actions) return "—";
          if (typeof actions === "string") return actions;
          if (!Array.isArray(actions)) return JSON.stringify(actions);
          if (!actions.length) return "—";
          return actions.map(a => {{
            const type = a.action_type || "akcja";
            const result = workflowRuleExecutionResultLabel(a.result || "");
            if (type === "change_status" && a.result === "executed") return `Zmień status: ${{a.old_status || "?"}} → ${{a.new_status || "?"}}`;
            if (type === "change_status") return `Zmień status: ${{result}}${{a.reason ? " (" + a.reason + ")" : ""}}`;
            if (type === "change_priority") return `Zmień priorytet: ${{a.old_priority || "?"}} → ${{a.new_priority || a.action_value || "?"}}`;
            if (type === "require_comment") return `Wymagaj komentarza: ${{result}}`;
            if (type === "require_attachment") return `Wymagaj załącznika: ${{result}}`;
            return `${{workflowRuleExecutionActionLabel(type)}}: ${{result}}`;
          }}).join("; ");
        }}
        function workflowRuleExecutionActionDetails(actions) {{
          if (!actions) return "";
          if (typeof actions === "string") return `<pre class="log-details">${{esc(actions)}}</pre>`;
          if (!Array.isArray(actions) || !actions.length) return `<span class="muted">Brak akcji.</span>`;
          return `<ol class="compact-list">${{actions.map(a => {{
            const type = a.action_type || "akcja";
            const result = workflowRuleExecutionResultLabel(a.result || "");
            const details = Object.entries(a || {{}})
              .filter(([k]) => !["action_type", "result"].includes(k))
              .map(([k, v]) => `<div><span class="muted">${{esc(k)}}:</span> ${{esc(typeof v === "object" ? JSON.stringify(v) : String(v ?? ""))}}</div>`)
              .join("");
            return `<li><strong>${{esc(workflowRuleExecutionActionLabel(type))}}</strong> — ${{esc(result)}}${{details ? `<div class="muted" style="margin-top:4px">${{details}}</div>` : ""}}</li>`;
          }}).join("")}}</ol>`;
        }}
        function workflowAutomationCenterRiskBadge(risk) {{
          const level = risk?.level || "low";
          const cls = level === "high" ? "status-closed" : level === "medium" ? "status-wait" : "status-new";
          const label = level === "high" ? "Wysokie ryzyko" : level === "medium" ? "Średnie ryzyko" : "Niskie ryzyko";
          return `<span class="status-badge ${{cls}}">${{esc(label)}}</span>`;
        }}
        function workflowAutomationCenterStatusOptions(steps, selected, includeEmpty = true) {{
          const values = includeEmpty ? [""] : [];
          for (const step of steps || []) {{
            const value = typeof step === "string" ? step : (step.step_name || "");
            if (value && !values.includes(value)) values.push(value);
          }}
          if (selected && !values.includes(selected)) values.push(selected);
          return values.map(v => `<option value="${{esc(v)}}" ${{v === selected ? "selected" : ""}}>${{v ? esc(v) : "— brak zmiany —"}}</option>`).join("");
        }}
        function workflowAutomationCenterSampleValues() {{
          const value = id => document.getElementById(id)?.value || "";
          const checked = id => document.getElementById(id)?.checked ? "1" : "0";
          return {{
            event_type: value("wacEventType"),
            current_status: value("wacCurrentStatus"),
            event_new_status: value("wacEventNewStatus"),
            actor_role: value("wacActorRole"),
            comment_visibility: value("wacCommentVisibility"),
            assigned_state: value("wacAssignedState"),
            priority: value("wacPriority"),
            category: value("wacCategory"),
            subcategory: value("wacSubcategory"),
            sla_state: value("wacSlaState"),
            operator_added_comment: checked("wacOperatorAddedComment"),
            operator_added_attachment: checked("wacOperatorAddedAttachment"),
          }};
        }}
        function workflowAutomationCenterRoleCondition(sample) {{
          const eventType = sample.event_type || "comment_added";
          const role = sample.actor_role || "*";
          if (eventType === "user_comment_added") return "user";
          if (eventType === "staff_comment_added") return "staff";
          return role === "staff" ? "staff" : role || "*";
        }}
        function workflowAutomationCenterInheritedCondition(workflowValue, sampleValue) {{
          const workflowScope = String(workflowValue || "*");
          const value = String(sampleValue || "*");
          if (workflowScope !== "*" && workflowScope === value) return "*";
          return value || "*";
        }}
        function workflowAutomationCenterDefaultAction(sample) {{
          const eventType = sample.event_type || "comment_added";
          if (eventType !== "status_changed" && sample.event_new_status) {{
            return {{
              action_type: "change_status",
              action_value: sample.event_new_status,
              is_active: true,
              action_order: 1,
            }};
          }}
          return {{
            action_type: "add_history",
            action_value: "Reguła utworzona z symulacji Centrum automatyzacji. Uzupełnij akcje przed aktywacją.",
            is_active: true,
            action_order: 1,
          }};
        }}
        function workflowAutomationCenterDraftRule(workflow, sample) {{
          workflow = workflow || {{}};
          sample = sample || {{}};
          const eventType = sample.event_type || "comment_added";
          const isCommentEvent = ["comment_added", "user_comment_added", "staff_comment_added"].includes(eventType);
          const defaultAction = workflowAutomationCenterDefaultAction(sample);
          return {{
            id: null,
            name: `Z symulacji: ${{workflowAutomationRuleEventLabel(eventType)}}`,
            event_type: eventType,
            condition_status: sample.current_status || "",
            condition_to_status: eventType === "status_changed" ? (sample.event_new_status || "") : "",
            condition_role: workflowAutomationCenterRoleCondition(sample),
            condition_comment_visibility: isCommentEvent ? (sample.comment_visibility || "*") : "*",
            assigned_state: sample.assigned_state || "*",
            condition_priority: sample.priority || "*",
            condition_category: workflowAutomationCenterInheritedCondition(workflow.category, sample.category),
            condition_subcategory: workflowAutomationCenterInheritedCondition(workflow.subcategory, sample.subcategory),
            condition_sla_state: sample.sla_state || "*",
            condition_status_operator: "eq",
            condition_to_status_operator: "eq",
            condition_role_operator: "eq",
            condition_comment_visibility_operator: "eq",
            assigned_state_operator: "eq",
            condition_priority_operator: "eq",
            condition_category_operator: "eq",
            condition_subcategory_operator: "eq",
            condition_sla_state_operator: "eq",
            action_type: defaultAction.action_type,
            action_status: defaultAction.action_value,
            actions: [defaultAction],
            is_active: false,
            stop_processing: true,
            priority: 100,
          }};
