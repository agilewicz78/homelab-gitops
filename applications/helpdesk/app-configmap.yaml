            showToast("Dodano załącznik do zgłoszenia #" + id);
            await renderTicket(id);
          }});

          const commentForm = document.getElementById("commentForm");
          commentForm.addEventListener("submit", async (e) => {{
            e.preventDefault();
            const payload = Object.fromEntries(new FormData(commentForm).entries());
            const internalToggle = document.getElementById("comment-internal");
            payload.visibility = internalToggle && internalToggle.checked ? "internal" : "public";
