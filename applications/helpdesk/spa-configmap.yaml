        function focusRequirementSection(kind) {
          const targetId = kind === "comment" ? "commentsSection" : (kind === "attachment" ? "attachmentsSection" : null);
          if (!targetId) return;
          const target = document.getElementById(targetId);
          if (!target) return;
          target.scrollIntoView({ behavior: "smooth", block: "center" });
          target.classList.remove("section-focus");
          void target.offsetWidth;
          target.classList.add("section-focus");
        }
        function renderStatusRequirementsBox(info) {
          const panel = document.getElementById("statusRequirementsPanel");
          if (!panel) return;
          const required = info.required || [];
          const missing = info.missing_requirements || info.missing || [];
          const ruleNames = info.rule_names || [];
          const requested = info.requested_status || "";
          if (!required.length) {
            panel.innerHTML = `<div class="requirement-box ok"><strong>Brak dodatkowych wymagań.</strong><br><span class="muted">Status można zmienić na „${esc(requested)}” bez dodatkowego komentarza lub załącznika.</span></div>`;
            return;
          }
          const rows = [];
          if (required.includes("comment")) {
            rows.push(`<li><strong>Komentarz:</strong> ${info.comment_validated ? "spełniono — dodano nowy komentarz dla bieżącego statusu." : "wymagany — dodaj nowy komentarz w sekcji Komentarze."}</li>`);
          }
          if (required.includes("attachment")) {
            rows.push(`<li><strong>Załącznik:</strong> ${info.attachment_validated ? "spełniono — dodano nowy załącznik dla bieżącego statusu." : "wymagany — dodaj nowy plik w sekcji Załączniki."}</li>`);
          }
          const cls = missing.length ? "blocked" : "ok";
          const title = missing.length ? "Zmiana statusu będzie zablokowana." : "Wymagania spełnione.";
          const guidance = info.guidance || (missing.length ? "Uzupełnij brakujące elementy przed kliknięciem „Zapisz status”." : "Możesz zapisać zmianę statusu.");
          const buttons = missing.length ? `
            <div class="requirement-actions">
              ${missing.includes("comment") ? `<button type="button" class="btn-secondary btn-small" onclick="focusRequirementSection('comment')">Przejdź do komentarzy</button>` : ""}
              ${missing.includes("attachment") ? `<button type="button" class="btn-secondary btn-small" onclick="focusRequirementSection('attachment')">Przejdź do załączników</button>` : ""}
            </div>` : "";
          panel.innerHTML = `
            <div class="requirement-box ${cls}">
              <strong>${title}</strong><br>
              <span class="muted">Przejście do statusu: <strong>${esc(requested)}</strong></span>
              ${ruleNames.length ? `<div class="muted">Reguła: ${esc(ruleNames.join(", "))}</div>` : ""}
              <ul class="requirement-list">${rows.join("")}</ul>
              <div class="muted">${esc(guidance)}</div>
              ${buttons}
            </div>`;
        }
        async function loadStatusRequirements(ticketId) {
          const select = document.getElementById("statusSelect");
          const panel = document.getElementById("statusRequirementsPanel");
          if (!select || !panel) return;
          const status = select.value || "";
          if (!status) return;
          panel.innerHTML = `<div class="requirement-box neutral">Sprawdzam wymagania workflow...</div>`;
          const res = await api(`/api/tickets/${ticketId}/status-requirements?status=${encodeURIComponent(status)}`);
          if (!res || !res.ok) {
            panel.innerHTML = `<div class="requirement-box blocked"><strong>Nie udało się sprawdzić wymagań.</strong><br><span class="muted">Spróbuj odświeżyć zgłoszenie.</span></div>`;
            return;
          }
          const info = await res.json();
          renderStatusRequirementsBox(info);
        }
        async function removeTicketLink(ticketId, linkedTicketId) {
          if (!confirm("Usunąć powiązanie z tym zgłoszeniem?")) return;
          suppressNextLiveRefresh = true;
          const res = await api(`/api/tickets/${ticketId}/links/${linkedTicketId}`, { method: "DELETE" });
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({ error: "Nie udało się usunąć powiązania." })) : { error: "Nie udało się usunąć powiązania." };
            alert(err.error || "Nie udało się usunąć powiązania.");
            return;
          }
          showToast("Usunięto powiązanie ze zgłoszenia #" + ticketId);
          await renderTicket(ticketId);
        }
        async function linkSuggestedTicket(ticketId, linkedTicketId) {
          suppressNextLiveRefresh = true;
          const res = await api(`/api/tickets/${ticketId}/links`, {
            method: "POST",
            body: JSON.stringify({ linked_ticket_id: linkedTicketId })
          });
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({})) : {};
            alert(err.error || "Nie udało się powiązać sugerowanego zgłoszenia.");
            return;
          }
          showToast(`Powiązano zgłoszenie #${ticketId} ze zgłoszeniem #${linkedTicketId}`);
          await renderTicket(ticketId);
        }
        async function linkSuggestedIncident(ticketId, incidentId) {
          suppressNextLiveRefresh = true;
          const res = await api(`/api/incidents/${incidentId}/tickets`, {
            method: "POST",
            body: JSON.stringify({ ticket_id: ticketId })
          });
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({})) : {};
            alert(err.error || "Nie udało się powiązać zgłoszenia z sugerowanym incydentem.");
            return;
          }
          showToast(`Powiązano zgłoszenie #${ticketId} z incydentem #${incidentId}`);
          await renderTicket(ticketId);
        }
        async function removeWatcher(ticketId, email) {
          if (!confirm("Usunąć obserwatora z tego zgłoszenia?")) return;
          suppressNextLiveRefresh = true;
          const res = await api(`/api/tickets/${ticketId}/watchers/${encodeURIComponent(email)}`, { method: "DELETE" });
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({ error: "Nie udało się usunąć obserwatora." })) : { error: "Nie udało się usunąć obserwatora." };
            alert(err.error || "Nie udało się usunąć obserwatora.");
            return;
          }
          showToast("Usunięto obserwatora ze zgłoszenia #" + ticketId);
          await renderTicket(ticketId);
        }
        const incidentFromTicketsForm = document.getElementById("incidentFromTicketsForm");
        if (incidentFromTicketsForm) {
          incidentFromTicketsForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!incidentCreationContext) return;
            const ticketIds = Array.from(
              document.querySelectorAll('#incidentFromTicketsList input[type="checkbox"]:checked')
            ).map(input => Number(input.dataset.ticketId)).filter(Boolean);
            if (ticketIds.length < 2) {
              alert("Wybierz co najmniej dwa zgłoszenia.");
              return;
            }
            if (!confirm(`Utworzyć incydent i powiązać ${ticketIds.length} zgłoszenia?`)) return;
            const payload = Object.fromEntries(new FormData(incidentFromTicketsForm).entries());
            payload.ticket_ids = ticketIds;
            payload.source_ticket_id = incidentCreationContext.sourceTicketId;
            suppressNextLiveRefresh = true;
            const res = await api("/api/incidents", {
              method: "POST",
              body: JSON.stringify(payload)
            });
            if (!res || !res.ok) {
              suppressNextLiveRefresh = false;
              const err = res ? await res.json().catch(() => ({})) : {};
              alert(err.error || "Nie udało się utworzyć incydentu z powiązanych zgłoszeń.");
              return;
            }
            const created = await res.json();
            closeIncidentFromTicketsModal();
            incidentCreationContext = null;
            showToast(`Utworzono incydent #${created.id}`, `Powiązano zgłoszenia: ${created.linked_ticket_count}`);
            await renderIncident(created.id);
          });
        }
        const knowledgeArticleForm = document.getElementById("knowledgeArticleForm");
        if (knowledgeArticleForm) {
          knowledgeArticleForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const context = knowledgeArticleContext;
            if (!context) return;
            const payload = Object.fromEntries(new FormData(knowledgeArticleForm).entries());
            if (context.mode === "create" && context.sourceTicketId) {
              payload.source_ticket_id = context.sourceTicketId;
            }
            const isEdit = context.mode === "edit" && context.article?.id;
            const endpoint = isEdit
              ? `/api/knowledge-articles/${context.article.id}`
              : "/api/knowledge-articles";
            suppressNextLiveRefresh = true;
            const res = await api(endpoint, {
              method: isEdit ? "PUT" : "POST",
              body: JSON.stringify(payload)
            });
            if (!res || !res.ok) {
              suppressNextLiveRefresh = false;
              const err = res ? await res.json().catch(() => ({})) : {};
              if (res?.status === 409 && err.article_id) {
                closeKnowledgeArticleModal();
                showToast("Artykuł już istnieje", `Otwieram artykuł #${err.article_id}.`);
                await renderKnowledgeArticle(err.article_id);
                return;
              }
              alert(err.error || "Nie udało się zapisać artykułu bazy wiedzy.");
              return;
            }
            const result = await res.json();
            const articleId = isEdit ? context.article.id : result.id;
            closeKnowledgeArticleModal();
            showToast(
              isEdit ? `Zaktualizowano artykuł #${articleId}` : `Utworzono artykuł #${articleId}`,
              knowledgeStatusLabel(payload.status)
            );
            await renderKnowledgeArticle(articleId);
          });
        }
        const closeTicketForm = document.getElementById("closeTicketForm");
        if (closeTicketForm) {
          closeTicketForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!closeTicketId) return;
            const formData = new FormData(closeTicketForm);
            const internalToggle = document.getElementById("close-comment-internal");
            formData.set("visibility", internalToggle && internalToggle.checked ? "internal" : "public");
            suppressNextLiveRefresh = true;
            const res = await fetch(`/api/tickets/${closeTicketId}/close`, {
              method: "POST",
              headers: { "X-Helpdesk-Session": getSid() },
              body: formData
            });
            if (res.status === 401) {
              clearSid();
              window.location.href = "/login";
              return;
            }
            if (!res.ok) {
              suppressNextLiveRefresh = false;
              const err = await res.json().catch(() => ({ error: "Nie udało się zamknąć zgłoszenia." }));
              alert(err.error || "Nie udało się zamknąć zgłoszenia.");
              return;
            }
            const closedId = closeTicketId;
            closeCloseTicketModal();
            showToast("Zgłoszenie #" + closedId + " zostało zamknięte");
            await renderTicket(closedId);
          });
        }
        const reopenTicketForm = document.getElementById("reopenTicketForm");
        if (reopenTicketForm) {
          reopenTicketForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!reopenTicketId) return;
            const payload = Object.fromEntries(new FormData(reopenTicketForm).entries());
            payload.reason = String(payload.reason || "").trim();
            if (!payload.reason) {
              alert("Podaj powód ponownego otwarcia zgłoszenia.");
              return;
            }
            suppressNextLiveRefresh = true;
            const res = await api(`/api/tickets/${reopenTicketId}/reopen`, { method: "POST", body: JSON.stringify(payload) });
            if (!res || !res.ok) {
              suppressNextLiveRefresh = false;
              const err = res ? await res.json().catch(() => ({ error: "Nie udało się otworzyć zgłoszenia ponownie." })) : { error: "Nie udało się otworzyć zgłoszenia ponownie." };
              alert(err.error || "Nie udało się otworzyć zgłoszenia ponownie.");
              return;
            }
            const reopenedId = reopenTicketId;
            closeReopenTicketModal();
            showToast("Zgłoszenie #" + reopenedId + " zostało otwarte ponownie");
            await renderTicket(reopenedId);
          });
        }
        renderStart();
      </script>
    </body>
    </html>
