      .workflow-condition-row { display: grid; grid-template-columns: minmax(150px, .8fr) minmax(130px, .65fr) minmax(190px, 1fr) auto; gap: 8px; align-items: end; padding: 12px; border: 1px solid rgba(56,189,248,.32); border-radius: 15px; background: rgba(2,132,199,.08); }
