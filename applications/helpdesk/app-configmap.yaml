                condition_category_operator, condition_subcategory_operator, condition_sla_state_operator,
                action_type, action_status, is_active, stop_processing, priority
            )
            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s)
            RETURNING id
        """, (
            workflow_id,
            item.get("name") or "Reguła workflow",
            item.get("event_type"),
            item.get("condition_status"),
            item.get("condition_to_status"),
            item.get("condition_role"),
            item.get("condition_comment_visibility"),
