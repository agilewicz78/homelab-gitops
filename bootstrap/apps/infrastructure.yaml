apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: homelab-infra

  source:
    repoURL: https://github.com/agilewicz78/homelab-gitops.git
    targetRevision: main
    path: infrastructure
    directory:
      recurse: true
      exclude: 'manual/portainer/portainer-values.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: tools

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
