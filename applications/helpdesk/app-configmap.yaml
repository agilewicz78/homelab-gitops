    )\n\ninit_db()\n\ndef esc(value):\n    return html.escape(str(value or \"\"))\n\
    \ndef clean(value):\n    return str(value or \"\").strip()\n\n\ndef sla_due_for_priority(priority):\n\
    \    return datetime.now() + timedelta(hours=SLA_HOURS.get(priority, 48))\n\n\
    def sla_state(sla_due_at, status):\n    if not sla_due_at:\n        return \"\
    none\"\n    if status in (\"Rozwiązane\", \"Zamknięte\"):\n        return \"done\"\
    \n    now = datetime.now()\n    if sla_due_at < now:\n        return \"overdue\"\
    \n    if sla_due_at - now <= timedelta(hours=4):\n        return \"warning\"\n\
    \    return \"ok\"\n\ndef event_message(actor_name, text):\n    return f\"{actor_name}:\
    \ {text}\"\n\ndef add_ticket_event(cur, ticket_id, user, event_type, message):\n\
    \    cur.execute(\"\"\"\n        INSERT INTO ticket_events (ticket_id, actor_email,\
    \ actor_name, event_type, message)\n        VALUES (%s, %s, %s, %s, %s)\n    \"\
    \"\", (\n        ticket_id,\n        user.get(\"email\") if user else None,\n\
    \        user.get(\"name\") if user else \"System\",\n        event_type,\n  \
    \      message,\n    ))\n\ndef get_sid_from_request():\n    return request.headers.get(\"\
    X-Helpdesk-Session\", \"\").strip()\n\ndef get_user_by_sid(sid):\n    if not sid:\n\
    \        return None\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\
    \"\"\n        SELECT u.first_name, u.last_name, u.email, u.department, u.role\n\
    \        FROM user_sessions s\n        JOIN users u ON u.email = s.user_email\n\
    \        WHERE s.sid = %s\n    \"\"\", (sid,))\n    row = cur.fetchone()\n   \
    \ if row:\n        cur.execute(\"UPDATE user_sessions SET last_seen = NOW() WHERE\
    \ sid = %s\", (sid,))\n        conn.commit()\n    cur.close()\n    conn.close()\n\
    \    if not row:\n        return None\n    return {\n        \"first_name\": row[0],\n\
    \        \"last_name\": row[1],\n        \"name\": f\"{row[0]} {row[1]}\".strip(),\n\
    \        \"email\": row[2],\n        \"department\": row[3],\n        \"role\"\
    : row[4],\n    }\n\ndef current_user():\n    return get_user_by_sid(get_sid_from_request())\n\
    \ndef api_login_required(fn):\n    @wraps(fn)\n    def wrapper(*args, **kwargs):\n\
    \        user = current_user()\n        if not user:\n            return jsonify({\"\
    error\": \"unauthorized\"}), 401\n        return fn(user, *args, **kwargs)\n \
    \   return wrapper\n\ndef is_admin(user):\n    return bool(user and user.get(\"\
    role\") == \"admin\")\n\ndef is_staff(user):\n    return bool(user and user.get(\"\
    role\") in (\"agent\", \"admin\"))\n\ndef publish_event(message, event_type=\"\
    info\", ticket_id=None):\n    global last_live_event\n    last_live_event = {\n\
    \        \"id\": str(uuid.uuid4()),\n        \"type\": event_type,\n        \"\
    message\": message,\n        \"ticket_id\": ticket_id,\n        \"timestamp\"\
    : time.strftime(\"%Y-%m-%d %H:%M:%S\"),\n    }\n\ndef api_admin_required(fn):\n\
    \    @wraps(fn)\n    def wrapper(user, *args, **kwargs):\n        if not is_admin(user):\n\
    \            return jsonify({\"error\": \"admin required\"}), 403\n        return\
    \ fn(user, *args, **kwargs)\n    return wrapper\n\ndef api_staff_required(fn):\n\
    \    @wraps(fn)\n    def wrapper(user, *args, **kwargs):\n        if not is_staff(user):\n\
    \            return jsonify({\"error\": \"agent or admin required\"}), 403\n \
    \       return fn(user, *args, **kwargs)\n    return wrapper\n\ndef public_html(body):\n\
    \    return f\"\"\"\n    <!doctype html>\n    <html lang=\"pl\">\n    <head>\n\
