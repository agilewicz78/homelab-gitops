    def normalize_workflow_payload(payload, existing_key=None):
        name = clean(payload.get("name"))
        category = clean(payload.get("category")) or "*"
        subcategory = clean(payload.get("subcategory")) or "*"
        workflow_key = clean(payload.get("workflow_key")) or existing_key or workflow_key_from_name(name)
        is_default = bool(payload.get("is_default"))
        is_active = bool(payload.get("is_active", True))
        raw_steps = payload.get("steps")
        if isinstance(raw_steps, str):
            steps = [clean(x) for x in raw_steps.replace("\r", "").split("\n")]
        elif isinstance(raw_steps, list):
            steps = [clean(x.get("step_name") if isinstance(x, dict) else x) for x in raw_steps]
        else:
            steps = []
        steps = [s for s in steps if s]
        unique_steps = []
        for step in steps:
            if step not in unique_steps:
                unique_steps.append(step)
        if "Nowe" not in unique_steps:
            unique_steps.insert(0, "Nowe")
        if "Zamknięte" not in unique_steps:
            unique_steps.append("Zamknięte")
        if not name:
            return None, "Nazwa workflow jest wymagana."
        if category != "*" and category not in CATEGORIES:
            return None, "Nieprawidłowa kategoria."
        if category == "*":
            subcategory = "*"
        elif subcategory != "*" and subcategory not in SUBCATEGORIES.get(category, ["Inne"]):
            return None, "Nieprawidłowa podkategoria."
        if len(unique_steps) < 2:
            return None, "Workflow musi mieć co najmniej dwa kroki."
        automations = normalize_workflow_automations(payload, unique_steps)
        return {
            "workflow_key": workflow_key,
            "name": name,
            "category": category,
            "subcategory": subcategory,
            "is_default": is_default,
            "is_active": is_active,
            "steps": unique_steps,
            "automations": automations,
        }, None
