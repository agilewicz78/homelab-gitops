        .subtitle { font-size: 15px; }
        table {
          display: block;
          width: 100%;
          overflow-x: auto;
          white-space: nowrap;
          -webkit-overflow-scrolling: touch;
        }
        th, td { padding: 10px; }
        .notification-panel {
          position: fixed;
          top: 74px;
          left: 10px;
          right: 10px;
          width: auto;
          max-height: calc(100vh - 94px);
          overflow: auto;
        }
        .notification-panel-header,
        .modal-header { flex-direction: column; align-items: stretch; }
        .operator-command-row .quick-search { flex-basis: 100%; }
        .workflow-diagram-lane { flex-direction: column; overflow-x: visible; }
