    SPA_HTML_PATH = os.getenv("SPA_HTML_PATH", "/app/spa.html")
    def load_spa_html():
        try:
            with open(SPA_HTML_PATH, "r", encoding="utf-8") as handle:
                return handle.read()
        except OSError as exc:
            return public_html(f"""
            <section class="card">
              <h2>Helpdesk UI could not be loaded</h2>
              <p class="error">Missing SPA file: {exc}</p>
            </section>
            """)
    SPA_HTML = load_spa_html()
