    def all_permission_codes():
        """Zwraca pełną listę znanych kodów uprawnień w stabilnej kolejności."""
        codes = []
        for role in VALID_ROLES:
            for code in ROLE_PERMISSION_CODES.get(role, set()):
                if code not in codes:
                    codes.append(code)
        return codes
    
    
    def ensure_role_permissions_schema(cur):
        """Tworzy i uzupełnia tabelę edytowalnych uprawnień ról.
    
        Tabela przechowuje bezpośrednie uprawnienia danej roli. Dziedziczenie ról
        nadal jest obsługiwane w kodzie przez ROLE_INHERITANCE.
        """
        cur.execute("""
            CREATE TABLE IF NOT EXISTS role_permissions (
                role_key TEXT NOT NULL,
                permission_code TEXT NOT NULL,
                enabled BOOLEAN NOT NULL DEFAULT TRUE,
                updated_at TIMESTAMP DEFAULT NOW(),
                PRIMARY KEY (role_key, permission_code)
            );
        """)
        cur.execute("ALTER TABLE role_permissions ADD COLUMN IF NOT EXISTS enabled BOOLEAN NOT NULL DEFAULT TRUE")
        cur.execute("ALTER TABLE role_permissions ADD COLUMN IF NOT EXISTS updated_at TIMESTAMP DEFAULT NOW()")
        for role_key, codes in ROLE_PERMISSION_CODES.items():
            for code in sorted(codes):
                cur.execute("""
                    INSERT INTO role_permissions (role_key, permission_code, enabled, updated_at)
                    VALUES (%s, %s, TRUE, NOW())
                    ON CONFLICT (role_key, permission_code) DO NOTHING
                """, (role_key, code))
            for code in LOCKED_ROLE_PERMISSION_CODES.get(role_key, set()):
                cur.execute("""
                    INSERT INTO role_permissions (role_key, permission_code, enabled, updated_at)
                    VALUES (%s, %s, TRUE, NOW())
                    ON CONFLICT (role_key, permission_code) DO UPDATE
                    SET enabled = TRUE, updated_at = NOW()
                """, (role_key, code))
    
    
    def invalidate_role_permission_cache():
        with role_permission_cache_lock:
            role_permission_cache["expires_at"] = 0.0
            role_permission_cache["codes"] = {}


    def role_permission_codes_by_role():
        now = time.monotonic()
        with role_permission_cache_lock:
            if now < role_permission_cache["expires_at"]:
                return {
                    key: set(codes)
                    for key, codes in role_permission_cache["codes"].items()
                }

            conn = None
            cur = None
            try:
                conn = get_conn()
                cur = conn.cursor()
                cur.execute("""
                    SELECT role_key, permission_code
                    FROM role_permissions
                    WHERE enabled = TRUE
                """)
                codes_by_role = {role: set() for role in VALID_ROLES}
                for role_key, permission_code in cur.fetchall():
                    if role_key in codes_by_role:
                        codes_by_role[role_key].add(permission_code)
                for role_key, locked_codes in LOCKED_ROLE_PERMISSION_CODES.items():
                    codes_by_role.setdefault(role_key, set()).update(locked_codes)
                role_permission_cache["codes"] = {
                    key: set(codes)
                    for key, codes in codes_by_role.items()
                }
                role_permission_cache["expires_at"] = (
                    now + ROLE_PERMISSION_CACHE_TTL_SECONDS
                )
                return codes_by_role
            except Exception as exc:
                print(f"role permissions fallback: {exc}", flush=True)
                return {
                    role: (
                        set(ROLE_PERMISSION_CODES.get(role, set()))
                        | LOCKED_ROLE_PERMISSION_CODES.get(role, set())
                    )
                    for role in VALID_ROLES
                }
            finally:
                if cur:
                    cur.close()
                if conn:
                    conn.close()


    def role_direct_permission_codes(role_key):
        """Zwraca aktywne bezpośrednie uprawnienia roli z bazy.
    
        Jeśli tabela nie istnieje albo baza chwilowo nie odpowiada, funkcja wraca do
        statycznych wartości z ROLE_PERMISSION_CODES, żeby nie zablokować logowania.
        """
        role_key = clean(role_key)
        if role_key not in VALID_ROLES:
            return set()
        return set(role_permission_codes_by_role().get(role_key, set()))
    
    
