      .resolution-box { margin: 14px 0; padding: 14px; border: 1px solid rgba(34,197,94,.35); border-radius: 16px; background: rgba(34,197,94,.08); }
      .readonly-box { margin-top: 16px; padding: 14px; border: 1px solid rgba(148,163,184,.35); border-radius: 16px; background: rgba(148,163,184,.10); color: var(--text); }
      .readonly-box span { color: var(--muted); }
      .dashboard-section-title { margin: 4px 0 14px; color: var(--muted); font-size: 14px; }
      .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
      .dashboard-card { border: 1px solid var(--border); background: rgba(31,41,55,.65); border-radius: 18px; padding: 16px; cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
      .dashboard-card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,.55); background: rgba(31,41,55,.88); }
      .dashboard-card.active { border-color: rgba(34,197,94,.75); background: linear-gradient(135deg, rgba(2,132,199,.30), rgba(34,197,94,.22)); box-shadow: 0 14px 28px rgba(0,0,0,.22); }
      .dashboard-card .num { font-size: 34px; font-weight: 900; line-height: 1; }
