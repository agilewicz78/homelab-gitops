        function serviceQualityMetric(label, value, hint) {
          return `
            <div class="dashboard-card">
              <div class="num">${esc(value ?? "0")}</div>
              <div class="label">${esc(label)}</div>
              <div class="muted">${esc(hint || "")}</div>
            </div>
          `;
        }
    
        function serviceQualityMinutes(minutes) {
          const value = Number(minutes || 0);
          if (!value) return "brak";
          const hours = Math.floor(value / 60);
          const rest = value % 60;
          if (hours && rest) return `${hours}h ${rest}m`;
          if (hours) return `${hours}h`;
          return `${rest}m`;
        }
    
        function serviceQualitySignal(service, quality) {
          const summary = quality?.summary || {};
          const tickets30 = Number(summary.tickets_30_days || 0);
          const tickets90 = Number(summary.tickets_90_days || 0);
          const incidents90 = Number(summary.incidents_90_days || 0);
          const overdue30 = Number(summary.overdue_30_days || 0);
          if (incidents90 >= 2) {
            return "Usługa ma powtarzające się incydenty w ostatnich 90 dniach. Warto zaplanować analizę przyczyny źródłowej i działania zapobiegawcze.";
          }
          if (tickets30 >= 10 || (tickets90 >= 20 && isProblematicService(service))) {
            return "Widać podwyższony wolumen zgłoszeń. To dobry kandydat do przeglądu jakości usługi i aktualizacji bazy wiedzy.";
          }
          if (overdue30 > 0) {
            return "Są zgłoszenia po SLA. Sprawdź, czy usługa nie wymaga innego priorytetu, workflow albo właściciela.";
          }
          if (tickets30 > 0) {
            return "Usługa generuje zgłoszenia, ale bez silnego sygnału powtarzalnego incydentu. Obserwuj trend i najczęstsze objawy.";
          }
          return "W ostatnich 30 dniach nie widać większego obciążenia tej usługi.";
        }
    
        function serviceQualityTrendBars(trend = []) {
          const max = Math.max(1, ...((trend || []).map(item => Number(item.count || 0))));
          const rows = (trend || []).map(item => {
            const count = Number(item.count || 0);
            return `
              <div class="dashboard-row">
                <strong>${esc(item.day || "")}</strong>
                <span class="count">${count}</span>
                <div class="dashboard-bar"><span style="width:${Math.round((count / max) * 100)}%"></span></div>
              </div>
            `;
          }).join("");
          return rows || `<p class="muted">Brak danych trendu.</p>`;
        }
    
        function serviceQualityTopList(items = [], emptyText = "Brak danych.") {
          const rows = (items || []).map(item => `
            <div class="watcher-item">
              <div>
                <strong>${esc(item.label || "-")}</strong>
                <div class="watcher-meta">${Number(item.count || 0)} zgłoszeń</div>
              </div>
              <span class="counter">${Number(item.count || 0)}</span>
            </div>
          `).join("");
          return rows || `<p class="muted">${esc(emptyText)}</p>`;
        }
    
        function serviceQualityPanel(service, quality = {}) {
