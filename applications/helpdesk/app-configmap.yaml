        function setWsStatus(text, connected) {{
          wsStatus.textContent = text;
          wsStatus.className = connected ? "live-value ws-connected" : "live-value ws-disconnected";
        }}
        function connectLive() {{
          const sid = getSid();
          if (!sid) return;
          if (liveSocket && (liveSocket.readyState === WebSocket.OPEN || liveSocket.readyState === WebSocket.CONNECTING)) return;
          const scheme = window.location.protocol === "https:" ? "wss" : "ws";
          liveSocket = new WebSocket(`${{scheme}}://${{window.location.host}}/ws`);
          setWsStatus("connecting", false);
          liveSocket.onopen = () => {{
            setWsStatus("connected", true);
            liveSocket.send(JSON.stringify({{ type: "auth", sid }}));
          }};
          liveSocket.onmessage = (event) => {{
            const data = JSON.parse(event.data);
            handleLivePayload(data);
          }};
          liveSocket.onclose = () => {{
            setWsStatus("disconnected", false);
            if (getSid()) {{
              clearTimeout(liveReconnectTimer);
              liveReconnectTimer = setTimeout(connectLive, 2000);
            }}
          }};
          liveSocket.onerror = () => {{
            try {{ liveSocket.close(); }} catch (e) {{}}
          }};
        }}
        async function handleLivePayload(data) {{
          wsClients.textContent = data.active_clients ?? "-";
          wsTime.textContent = data.server_time ?? "-";
          const liveEvent = data.event || null;
          wsEvent.textContent = liveEvent?.message || data.message || "-";
          if (!liveEvent || !liveEvent.id || liveEvent.id === lastLiveEventId) return;
          lastLiveEventId = liveEvent.id;
          await loadNotifications();
          const refreshEvents = [
            "ticket_created",
            "status_changed",
            "auto_status_changed",
            "workflow_rule_status_changed",
            "workflow_rule_notification",
            "workflow_rule_history",
            "comment_added",
            "internal_note_added",
            "assignment_changed",
            "attachment_added",
            "watcher_changed",
            "ticket_link_changed",
            "ticket_closed",
            "ticket_reopened"
          ];
          if (!refreshEvents.includes(liveEvent.type)) return;
          if (["status_changed", "auto_status_changed", "workflow_rule_status_changed", "ticket_closed", "ticket_reopened"].includes(liveEvent.type) && !suppressNextLiveRefresh) {{
            showToast(
              "Zmieniono status zgłoszenia #" + liveEvent.ticket_id,
              liveEvent.message || ""
            );
          }}
          if (liveEvent.type === "internal_note_added" && !suppressNextLiveRefresh) {{
            showToast(
              "Dodano notatkę wewnętrzną do zgłoszenia #" + liveEvent.ticket_id,
              liveEvent.message || ""
            );
          }}
          const shouldSuppress = suppressNextLiveRefresh;
          if (suppressNextLiveRefresh) {{
            suppressNextLiveRefresh = false;
          }}
          // Nawet gdy pomijamy popup po własnej akcji, odświeżamy aktywny widok,
          // żeby lista zgłoszeń, dashboard i kalendarz SLA dostały aktualny status.
          if (currentView.name === "ticket" && Number(currentView.ticketId) === Number(liveEvent.ticket_id)) {{
            await renderTicket(liveEvent.ticket_id, true);
            return;
          }}
          if (currentView.name === "home") {{
            await renderHome(loadStatusFilters(), true);
          }}
          if (currentView.name === "dashboard") {{
            await renderDashboard();
          }}
          if (currentView.name === "sla-calendar") {{
            await renderSlaCalendar();
          }}
        }}
        function disconnectLive() {{
          clearTimeout(liveReconnectTimer);
          if (liveSocket) {{
            try {{ liveSocket.close(); }} catch (e) {{}}
          }}
          liveSocket = null;
          setWsStatus("disconnected", false);
          wsClients.textContent = "-";
          wsTime.textContent = "-";
          wsEvent.textContent = "-";
        }}
        function loadStatusFilters() {{
          try {{ return JSON.parse(sessionStorage.getItem("helpdesk_status_filters") || "[]"); }}
          catch {{ return []; }}
        }}
        function saveStatusFilters(filters) {{
