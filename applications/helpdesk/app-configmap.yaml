    # Publikuje zdarzenia live przez WebSocket do aktywnych klientów.
    def publish_event(message, event_type="info", ticket_id=None, staff_only=False, ticket_ids=None):
        global last_live_event
        event = {
            "id": str(uuid.uuid4()),
            "type": event_type,
            "message": message,
            "ticket_id": ticket_id,
            "ticket_ids": sorted({int(item) for item in (ticket_ids or []) if item}),
            "timestamp": time.strftime("%Y-%m-%d %H:%M:%S"),
            "staff_only": staff_only,
        }
        with live_state_condition:
            last_live_event = event
            live_state_condition.notify_all()
    def staff_notification_recipients(cur):
