        except ValueError as exc:
            cur.close()
            conn.close()
            return jsonify({"error": str(exc)}), 400
        if data["is_default"]:
            cur.execute("UPDATE workflow_definitions SET is_default = FALSE")
        cur.execute("""
            INSERT INTO workflow_definitions (
                workflow_key, name, category, subcategory, is_default, is_active, updated_at
            )
            VALUES (%s, %s, %s, %s, %s, %s, NOW())
