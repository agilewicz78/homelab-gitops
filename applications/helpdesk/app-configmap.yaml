    def get_conn():
        return psycopg2.connect(
            host=DB_HOST,
            port=DB_PORT,
            dbname=DB_NAME,
            user=DB_USER,
            password=DB_PASSWORD,
        )

    def init_db():
        for _ in range(40):
            try:
                conn = get_conn()
                cur = conn.cursor()

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS users (
                        id SERIAL PRIMARY KEY,
                        full_name TEXT NOT NULL,
                        email TEXT UNIQUE NOT NULL,
                        department TEXT NOT NULL,
                        role TEXT NOT NULL DEFAULT 'user',
                        password_hash TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS tickets (
                        id SERIAL PRIMARY KEY,
                        title TEXT NOT NULL,
                        description TEXT NOT NULL,
                        requester_name TEXT NOT NULL,
                        requester_email TEXT NOT NULL,
                        department TEXT NOT NULL,
                        category TEXT NOT NULL,
                        priority TEXT NOT NULL,
                        status TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW(),
                        updated_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS comments (
                        id SERIAL PRIMARY KEY,
                        ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,
                        author TEXT NOT NULL,
                        content TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                password_hash = generate_password_hash(INITIAL_PASSWORD)

                for full_name, email, department, role in SEED_USERS:
                    cur.execute("""
                        INSERT INTO users (full_name, email, department, role, password_hash)
                        VALUES (%s, %s, %s, %s, %s)
                        ON CONFLICT (email) DO NOTHING
                    """, (full_name, email, department, role, password_hash))

                cur.execute("SELECT COUNT(*) FROM tickets")
                count = cur.fetchone()[0]

                if count == 0:
                    for ticket in SEED_TICKETS:
                        cur.execute("""
                            INSERT INTO tickets (
                                title,
                                description,
                                requester_name,
                                requester_email,
                                department,
                                category,
                                priority,
                                status
                            )
                            VALUES (%s, %s, %s, %s, %s, %s, %s, %s)
                        """, ticket)

                conn.commit()
                cur.close()
                conn.close()
                return
            except Exception as e:
                print(f"Waiting for database: {e}", flush=True)
                time.sleep(2)

        raise RuntimeError("Database unavailable")

    init_db()

    def esc(value):
        return html.escape(str(value or ""))

    def options(values, selected=None):
        result = ""
        for value in values:
            selected_attr = " selected" if value == selected else ""
            result += f'<option value="{esc(value)}"{selected_attr}>{esc(value)}</option>'
        return result

    def current_user():
        if "user_email" not in session:
            return None
        return {
            "email": session.get("user_email"),
            "name": session.get("user_name"),
            "department": session.get("user_department"),
            "role": session.get("user_role"),
        }

    def login_required(fn):
        @wraps(fn)
        def wrapper(*args, **kwargs):
            if not current_user():
                return redirect("/login")
            return fn(*args, **kwargs)
        return wrapper

    def is_admin():
        user = current_user()
        return bool(user and user["role"] == "admin")

