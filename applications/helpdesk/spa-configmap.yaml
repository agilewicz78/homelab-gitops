          return `<button type="button" class="${classes}" onclick="${onclick}">${esc(label)}</button>`;
        }
        function ticketRecommendationCard(title, reason, actionHtml = "", tone = "info") {
          const safeTone = ["warning", "danger", "success"].includes(tone) ? tone : "info";
          return `
            <div class="panel-soft ticket-recommendation ticket-recommendation-${safeTone}">
              <strong>${esc(title)}</strong>
              <div class="attachment-upload-hint" style="margin-top:6px">${esc(reason)}</div>
              ${actionHtml ? `<div class="ticket-recommendation-actions">${actionHtml}</div>` : ""}
            </div>
          `;
        }
        function ticketOperatorRecommendations(ticket, articles = [], similarTickets = [], incidents = [], options = {}) {
          const currentIncidents = options.currentIncidents || [];
          const linkedTickets = options.linkedTickets || [];
          const activeCurrentIncidents = currentIncidents.filter(i => i.status !== "resolved");
          const currentUserEmail = String(options.currentUserEmail || "").toLowerCase();
          const assignedToEmail = String(ticket.assigned_to_email || "").toLowerCase();
          const isClosed = !!options.isClosed;
          const service = ticket.service || null;
          const recommendations = [];
          const add = (title, reason, actionHtml = "", tone = "info") => {
            recommendations.push(ticketRecommendationCard(title, reason, actionHtml, tone));
          };
    
          if (activeCurrentIncidents.length) {
            const incident = activeCurrentIncidents[0];
            add(
              "Prowadź komunikację przez incydent",
              `Zgłoszenie jest już częścią aktywnego incydentu #${incident.id}. Najlepiej aktualizować komunikat incydentu, żeby wszystkie powiązane zgłoszenia dostały spójną informację.`,
              ticketRecommendationButton("Otwórz incydent", `renderIncident(${Number(incident.id)})`, true),
              "success"
            );
          }
    
          if (!isClosed && service && ["degraded", "outage", "maintenance"].includes(service.status)) {
            add(
              "Sprawdź status usługi IT",
              `Usługa „${service.name}” ma status: ${service.status_label || service.status}. To może oznaczać, że zgłoszenie jest częścią szerszego problemu lub planowanych prac.`,
              incidents.length
                ? ticketRecommendationButton("Pokaż możliwe incydenty", "focusTicketContextSection('ticketContextPossibleIncidents')", true)
                : ticketRecommendationButton("Pokaż podobne zgłoszenia", "focusTicketContextSection('ticketContextSimilarTickets')"),
              service.status === "outage" ? "danger" : "warning"
            );
          }
    
          if (!isClosed && !activeCurrentIncidents.length && incidents.length) {
            const incident = incidents[0];
            const scoreText = Number(incident.score || 0) ? `${incident.score}% dopasowania` : "najlepsze dostępne dopasowanie";
            add(
              "Podepnij do istniejącego incydentu",
              `${incident.severity || "SEV"} #${incident.id} · ${incident.title || "bez tytułu"} ma ${scoreText}. Jeśli to ten sam problem, jedno podpięcie oszczędzi osobną komunikację w zgłoszeniu.`,
              ticketRecommendationButton("Pokaż możliwe incydenty", "focusTicketContextSection('ticketContextPossibleIncidents')", true),
              "warning"
            );
          }
    
          const relatedSignalCount = similarTickets.length + linkedTickets.length;
          if (!isClosed && !incidents.length && relatedSignalCount >= 3) {
            const action = options.canCreateIncident
              ? ticketRecommendationButton("Utwórz incydent", "openIncidentFromTicketsModal()", true)
              : ticketRecommendationButton("Pokaż podobne zgłoszenia", "focusTicketContextSection('ticketContextSimilarTickets')", true);
            add(
              "Rozważ incydent zbiorczy",
              `Widać ${relatedSignalCount} powiązane lub podobne zgłoszenia. To może być szerszy problem, więc warto zebrać komunikację w jednym incydencie.`,
              action,
              "warning"
            );
          }
    
          const firstResponseOverdue = ticket.first_response_state === "overdue";
          const resolutionOverdue = ticket.sla_state === "overdue";
          const firstResponseWarning = ticket.first_response_state === "warning";
          const resolutionWarning = ticket.sla_state === "warning";
          if (!isClosed && (firstResponseOverdue || resolutionOverdue)) {
            const scope = firstResponseOverdue && resolutionOverdue
              ? "pierwsza odpowiedź i rozwiązanie są po SLA"
              : (firstResponseOverdue ? "pierwsza odpowiedź jest po SLA" : "rozwiązanie jest po SLA");
            add(
              "Zareaguj priorytetowo",
              `SLA wymaga uwagi: ${scope}. Najpierw dodaj publiczną odpowiedź albo aktualizację statusu, potem wykonaj kolejne kroki techniczne.`,
              ticketRecommendationButton("Przejdź do komentarzy", "focusTicketContextSection('commentsSection')", true),
              "danger"
            );
          } else if (!isClosed && (firstResponseWarning || resolutionWarning)) {
            add(
              "Dopilnuj SLA",
              "Termin SLA zbliża się do granicy. Warto zaplanować następną odpowiedź, zanim zgłoszenie trafi do puli pilnych.",
              ticketRecommendationButton("Przejdź do komentarzy", "focusTicketContextSection('commentsSection')"),
              "warning"
            );
          }
    
          if (!isClosed && options.currentUserCanBeAssigned && currentUserEmail && !assignedToEmail) {
            add(
              "Przypisz zgłoszenie do siebie",
              "Zgłoszenie nie ma operatora. Przypisanie porządkuje kolejkę i daje użytkownikowi jasny sygnał, kto prowadzi sprawę.",
              ticketRecommendationButton("Przypisz do mnie", `assignTicketToMe(${Number(ticket.id)}, '${esc(currentUserEmail)}')`)
            );
          }
    
          if (articles.length) {
            const article = articles[0];
            const scoreText = Number(article.score || 0) ? `${article.score}% dopasowania` : "najlepsze dopasowanie";
            add(
              "Sprawdź artykuł bazy wiedzy",
              `Najlepiej pasuje artykuł #${article.id} · ${article.title || "bez tytułu"} (${scoreText}). Może dać gotowy kierunek odpowiedzi albo rozwiązania.`,
              ticketRecommendationButton("Otwórz artykuł", `renderKnowledgeArticle(${Number(article.id)})`),
              "success"
            );
          }
    
          if (!isClosed && similarTickets.length && relatedSignalCount < 3) {
            add(
              "Powiąż podobne zgłoszenia",
              `Znaleziono ${similarTickets.length} podobne zgłoszenie od innych użytkowników. Powiązanie ułatwi późniejszą analizę i ewentualne utworzenie incydentu.`,
              ticketRecommendationButton("Pokaż podobne zgłoszenia", "focusTicketContextSection('ticketContextSimilarTickets')")
            );
          }
    
          if (options.canCreateKnowledgeArticle) {
            add(
              "Zamień rozwiązanie w artykuł KB",
              "Zgłoszenie jest zamknięte i może zostać wykorzystane jako gotowa instrukcja dla podobnych problemów w przyszłości.",
              ticketRecommendationButton("Utwórz artykuł KB", "openKnowledgeArticleModal()"),
              "success"
            );
          }
    
          if (!recommendations.length) {
            add(
              "Obsłuż standardowo",
              "Nie ma mocnych sygnałów o incydencie, pilnym SLA ani pasującym artykule. Poprowadź zgłoszenie normalnie i uzupełnij kontekst, jeśli pojawi się powtarzalny wzorzec.",
              ticketRecommendationButton("Przejdź do komentarzy", "focusTicketContextSection('commentsSection')")
            );
          }
    
          return `<div class="ticket-recommendation-list">${recommendations.slice(0, 4).join("")}</div>`;
        }
        function ticketContextSituationPanel(ticket) {
          const service = ticket.service || null;
          const firstResponseText = ticket.first_response_at
            ? `reakcja: ${ticket.first_response_at}`
            : (ticket.first_response_due_at || "brak terminu");
          const resolutionText = ticket.sla_due_at || "brak terminu";
          return `
            <div class="panel-soft">
              <strong>Sytuacja</strong>
              <div class="ticket-context-grid">
                <div class="ticket-context-row">
                  <span class="ticket-context-label">Status</span>
                  <span class="ticket-context-value"><span class="pill ${statusClass(ticket.status)}">${esc(ticket.status || "-")}</span></span>
                </div>
                <div class="ticket-context-row">
                  <span class="ticket-context-label">Usługa IT</span>
                  <span class="ticket-context-value">
                    ${service ? esc(service.name) : "Nie wskazano"}
                    ${service ? `<div class="ticket-context-mini">${esc(service.status_label || service.status)} · ${esc(service.criticality_label || service.criticality)}${service.owner_name ? " · właściciel: " + esc(service.owner_name) : ""}</div>` : ""}
                  </span>
                </div>
                <div class="ticket-context-row">
                  <span class="ticket-context-label">Priorytet</span>
                  <span class="ticket-context-value"><span class="pill ${priorityClass(ticket.priority)}">${esc(ticket.priority || "-")}</span></span>
                </div>
                <div class="ticket-context-row">
                  <span class="ticket-context-label">SLA reakcji</span>
                  <span class="ticket-context-value">
                    <span class="sla-badge ${slaClass(ticket.first_response_state)}">${slaLabel(ticket.first_response_state)}</span>
                    <div class="ticket-context-mini">${esc(firstResponseText)}</div>
                  </span>
                </div>
                <div class="ticket-context-row">
                  <span class="ticket-context-label">SLA rozwiązania</span>
                  <span class="ticket-context-value">
                    <span class="sla-badge ${slaClass(ticket.sla_state)}">${slaLabel(ticket.sla_state)}</span>
                    <div class="ticket-context-mini">${esc(resolutionText)}</div>
                  </span>
                </div>
                <div class="ticket-context-row">
                  <span class="ticket-context-label">Operator</span>
                  <span class="ticket-context-value">${esc(ticket.assigned_to_name || "Nieprzypisane")}</span>
                </div>
              </div>
            </div>
          `;
        }
        function ticketContextCurrentIncidentList(incidents = [], limit = 3) {
          if (!incidents.length) return `<p class="muted">Brak powiązanego incydentu.</p>`;
          const visible = incidents.slice(0, limit);
          return `
            <div class="watcher-list">${visible.map(i => `
              <div class="watcher-item incident-relation ${incidentSeverityClass(i.severity)}">
                <div>
                  <strong>Incydent #${i.id} · ${esc(i.title)}</strong>
                  <div class="watcher-meta">
                    <span class="pill">${esc(i.severity)}</span>
                    · <span class="pill">${esc(incidentStatusLabel(i.status))}</span>
                    · ${incidentTicketCountLabel(i.affected_ticket_count)}
                  </div>
                  ${i.latest_public_update ? `<div class="ticket-context-mini">Ostatni komunikat: ${esc(i.latest_public_update)}</div>` : ""}
                </div>
                <button class="btn-secondary btn-small" onclick="renderIncident(${i.id})">Otwórz</button>
              </div>
            `).join("")}</div>
            ${incidents.length > limit ? `<p class="muted">I jeszcze ${incidents.length - limit} powiązanych incydentów.</p>` : ""}
          `;
        }
        function ticketContextLinkedTicketList(linkedTickets = [], limit = 3) {
          if (!linkedTickets.length) return `<p class="muted">Brak bezpośrednio powiązanych zgłoszeń.</p>`;
          const visible = linkedTickets.slice(0, limit);
          return `
            <div class="watcher-list">${visible.map(l => `
              <div class="watcher-item">
                <div>
                  <strong><a href="#" onclick="renderTicket(${l.id}); return false;">#${l.id} · ${esc(l.title)}</a></strong>
                  <div class="watcher-meta">
                    <span class="pill ${statusClass(l.status)}">${esc(l.status)}</span>
                    ${l.assigned_to_name ? " · " + esc(l.assigned_to_name) : ""}
                    ${l.requester_name ? " · zgłaszający: " + esc(l.requester_name) : ""}
                  </div>
                </div>
                <button class="btn-secondary btn-small" onclick="renderTicket(${l.id})">Otwórz</button>
              </div>
            `).join("")}</div>
            ${linkedTickets.length > limit ? `<p class="muted">I jeszcze ${linkedTickets.length - limit} powiązanych zgłoszeń.</p>` : ""}
          `;
        }
        function renderTicketContextPanel(ticket, articles = [], similarTickets = [], incidents = [], options = {}) {
          const currentIncidents = options.currentIncidents || [];
          const linkedTickets = options.linkedTickets || [];
          const total = articles.length + similarTickets.length + incidents.length + currentIncidents.length + linkedTickets.length;
          return `
            <section class="card ticket-assistant-card ticket-context-card">
              <div class="ticket-section-title">
                <div>
                  <h3>Panel kontekstu zgłoszenia</h3>
                  <div class="attachment-upload-hint">Etap 3: rekomendacje operatora, sytuacja, powiązania, podobne zgłoszenia i pasujące artykuły w jednym miejscu.</div>
                </div>
                <span class="counter">${total}</span>
              </div>
              ${ticketContextSituationPanel(ticket)}
              ${ticketContextQuickActions(ticket, Object.assign({ suggestedIncidentCount: incidents.length }, options))}
              <details open>
                <summary><strong>Rekomendacje operatora</strong></summary>
                ${ticketOperatorRecommendations(ticket, articles, similarTickets, incidents, Object.assign({ currentIncidents, linkedTickets }, options))}
              </details>
              <details open>
                <summary><strong>Powiązany incydent</strong> · ${currentIncidents.length}</summary>
                ${ticketContextCurrentIncidentList(currentIncidents)}
              </details>
              <details id="ticketContextPossibleIncidents" open>
                <summary><strong>Możliwe incydenty</strong> · ${incidents.length}</summary>
                ${ticketAssistantIncidentList(ticket, incidents)}
              </details>
              <details open>
                <summary><strong>Powiązane zgłoszenia</strong> · ${linkedTickets.length}</summary>
                ${ticketContextLinkedTicketList(linkedTickets)}
              </details>
              <details id="ticketContextSimilarTickets" open>
                <summary><strong>Podobne zgłoszenia</strong> · ${similarTickets.length}</summary>
                ${ticketAssistantSimilarTicketList(ticket, similarTickets)}
              </details>
              <details id="ticketContextKnowledgeArticles" open>
                <summary><strong>Artykuły bazy wiedzy</strong> · ${articles.length}</summary>
                ${ticketAssistantArticleList(articles)}
              </details>
              <details>
                <summary><strong>Uzasadnienie rekomendacji</strong></summary>
                <div class="panel-soft" style="margin-top:10px">
                  <strong>Krótka diagnoza</strong>
                  <div class="attachment-upload-hint" style="margin-top:6px">${esc(ticketAssistantDiagnosis(ticket, articles, similarTickets, incidents))}</div>
                </div>
                <div class="ticket-summary-grid" style="margin-top:12px">
                  <div class="ticket-summary-item"><span class="label">Sugerowany priorytet</span><span class="value">${esc(ticketAssistantPriorityHint(ticket, similarTickets, incidents))}</span></div>
                  <div class="ticket-summary-item"><span class="label">Sugerowany workflow</span><span class="value">${esc(ticketAssistantWorkflowHint(ticket, articles, similarTickets))}</span></div>
                </div>
              </details>
            </section>
          `;
        }
        function renderTicketAssistantPanel(ticket, articles = [], similarTickets = [], incidents = [], options = {}) {
          return renderTicketContextPanel(ticket, articles, similarTickets, incidents, options);
        }
        function userPortalTicketStatusPanel(ticket, data) {
          const incidents = data?.incidents || [];
          const hasIncident = incidents.some(i => i.status !== "resolved");
          const enrichedTicket = Object.assign({}, ticket, { active_incident_count: hasIncident ? incidents.length : 0 });
          const nextStep = userPortalNextStep(enrichedTicket);
          const primaryAction = ticket.status === "Oczekuje na użytkownika" && ticket.status !== "Zamknięte"
            ? `<button class="btn-secondary btn-small" onclick="focusUserCommentBox()">Odpowiedz w komentarzu</button>`
            : `<button class="btn-secondary btn-small" onclick="renderUserPortal()">Otwórz portal użytkownika</button>`;
          return `
            <section class="card user-ticket-next-step">
              <div class="ticket-section-title">
                <div>
                  <h3>Co się teraz dzieje?</h3>
                  <div class="attachment-upload-hint">Proste podsumowanie dla osoby zgłaszającej.</div>
                </div>
                ${primaryAction}
              </div>
              <div class="panel-soft">
                <strong>${esc(nextStep)}</strong>
                <div class="attachment-upload-hint" style="margin-top:8px">
                  Operator: ${esc(ticket.assigned_to_name || "jeszcze nieprzypisane")} ·
                  Pierwsza reakcja: ${esc(ticket.first_response_at || ticket.first_response_due_at || "brak terminu")} ·
                  SLA rozwiązania: ${esc(ticket.sla_due_at || "brak terminu")}
                </div>
                ${hasIncident ? `<div class="attachment-upload-hint" style="margin-top:6px">To zgłoszenie jest częścią aktywnego incydentu. Publiczne komunikaty incydentu pojawią się w komentarzach.</div>` : ""}
              </div>
              ${resolutionFeedbackPanel(ticket)}
            </section>
          `;
        }
        async function renderUserPortal(fromLive = false) {
          currentView = { name: "user-portal", ticketId: null };
          const me = await loadMe();
          if (!me) return;
          if (!canViewUserPortal(me)) {
            appEl.innerHTML = `<section class="card"><h2>Brak dostępu</h2><p class="muted">Portal użytkownika wymaga dostępu do własnych zgłoszeń.</p></section>`;
            return;
          }
          if (!fromLive) {
            appEl.innerHTML = `<section class="card"><h2>Portal użytkownika</h2><p class="muted">Ładuję Twoje zgłoszenia, powiadomienia i podpowiedzi...</p></section>`;
          }
          const res = await api("/api/user-portal");
          if (!res) return;
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            appEl.innerHTML = `<section class="card"><h2>Nie udało się pobrać portalu użytkownika</h2><p class="error">${esc(data.error || "Nieznany błąd")}</p></section>`;
            return;
          }
          const summary = data.summary || {};
          const sections = data.sections || {};
          appEl.innerHTML = `
            <section class="card">
              <button class="btn-secondary" onclick="renderHome()">← Lista zgłoszeń</button>
              <h2>Portal użytkownika</h2>
              <p class="muted">Jedno miejsce do sprawdzenia, co dzieje się z Twoimi zgłoszeniami. Widok odświeża się przez WebSocket i korzysta z powiadomień Helpdesku.</p>
              <div class="actions">
                <button onclick="renderNewTicket()">Nowe zgłoszenie</button>
                <button class="btn-secondary" onclick="renderHome()">Moje zgłoszenia</button>
                <button class="btn-secondary" onclick="renderKnowledgeArticles()">Baza wiedzy</button>
                <button class="btn-secondary" onclick="toggleNotifications()">Powiadomienia</button>
              </div>
              <div class="attachment-upload-hint" style="margin-top:10px">Ostatnie odświeżenie: ${esc(data.generated_at || "")}</div>
            </section>
            <section class="dashboard-grid">
              ${userPortalMetric("Otwarte", summary.open_tickets, "Twoje aktywne zgłoszenia.", "renderHome([])")}
              ${userPortalMetric("Czeka na mnie", summary.waiting_for_user, "Zgłoszenia wymagające Twojej odpowiedzi.", "renderUserPortal()")}
              ${userPortalMetric("Obsługiwane", summary.waiting_for_support, "Sprawy po stronie helpdesku.", "renderHome([])")}
              ${userPortalMetric("Incydenty", summary.active_incident_tickets, "Twoje zgłoszenia w aktywnych incydentach.", "renderUserPortal()")}
              ${userPortalMetric("Powiadomienia", summary.unread_notifications, "Nieprzeczytane komunikaty.", "toggleNotifications()")}
            </section>
            ${userPortalServiceStatusPanel(data.services || [])}
            <div class="grid">
              ${userPortalTicketSection("Czekają na moją odpowiedź", sections.waiting_for_user || [], "Nie masz zgłoszeń, które wymagają Twojej odpowiedzi.")}
              ${userPortalTicketSection("Moje aktywne zgłoszenia", sections.active_tickets || [], "Brak aktywnych zgłoszeń.", `<button class="btn-secondary btn-small" onclick="renderNewTicket()">Nowe zgłoszenie</button>`)}
            </div>
            <div class="grid">
              ${userPortalIncidentList(sections.incident_tickets || [])}
              ${userPortalTicketSection("Ostatnio zamknięte", sections.recent_closed || [], "Brak ostatnio zamkniętych zgłoszeń.")}
            </div>
            <div class="grid">
              ${userPortalKnowledgeList(data.knowledge_articles || [])}
              ${userPortalNotificationList(data.notifications || [], summary.unread_notifications || 0)}
            </div>
          `;
        }
        function operatorCenterMetric(label, value, hint, action = "") {
          const click = action ? ` onclick="${action}"` : "";
          return `
            <div class="dashboard-card"${click}>
              <div class="num">${Number(value || 0)}</div>
              <div class="label">${esc(label)}</div>
              ${hint ? `<div class="muted">${esc(hint)}</div>` : ""}
            </div>
          `;
        }
        function operatorCenterSignals(ticket) {
          const signals = Array.isArray(ticket.signals) ? ticket.signals : [];
          return signals.length
