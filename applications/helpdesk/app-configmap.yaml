    @app.get("/api/services/<int:service_id>/context")
    @api_login_required
    @api_staff_required
    def api_service_context(user, service_id):
        if not can_view_service_catalog_backend(user):
            return api_forbidden("Brak uprawnienia do katalogu usług IT.", "service_catalog.view")
        conn = get_conn()
        cur = conn.cursor()
        services = fetch_service_catalog_rows(
            cur,
            include_inactive=can_manage_service_catalog_backend(user),
            user_visible_only=False,
        )
        service = next((item for item in services if int(item["id"]) == int(service_id)), None)
        if not service:
            cur.close()
            conn.close()
            return jsonify({"error": "Usługa nie istnieje albo nie jest widoczna."}), 404

        cur.execute("""
            SELECT
              COUNT(*) FILTER (WHERE t.created_at >= NOW() - INTERVAL '7 days') AS last_7_days,
              COUNT(*) FILTER (WHERE t.created_at >= NOW() - INTERVAL '30 days') AS last_30_days,
              COUNT(*) FILTER (WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')) AS open_tickets,
              COUNT(*) FILTER (
                WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')
                  AND t.priority IN ('Wysoki', 'Krytyczny')
              ) AS high_priority_open,
              COUNT(*) FILTER (
                WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')
                  AND t.first_response_at IS NULL
              ) AS without_first_response,
              COUNT(*) FILTER (
                WHERE t.status NOT IN ('Rozwiązane', 'Zamknięte')
                  AND t.sla_due_at IS NOT NULL
                  AND t.sla_due_at < NOW()
              ) AS overdue_sla
            FROM tickets t
            WHERE t.service_id = %s
        """, (service_id,))
        summary_row = cur.fetchone()
        summary = {
            "last_7_days": int(summary_row[0] or 0),
            "last_30_days": int(summary_row[1] or 0),
            "open_tickets": int(summary_row[2] or 0),
            "high_priority_open": int(summary_row[3] or 0),
            "without_first_response": int(summary_row[4] or 0),
            "overdue_sla": int(summary_row[5] or 0),
        }

        def service_context_ticket_payload(row):
            return {
                "id": row[0],
                "title": row[1],
                "requester_name": row[2],
                "requester_email": row[3],
                "department": row[4],
                "category": row[5],
                "subcategory": row[6] or "Inne",
                "priority": row[7],
                "status": row[8],
                "assigned_to_email": row[9] or "",
                "assigned_to_name": row[10] or "",
                "created_at": str(row[11]),
                "updated_at": str(row[12]),
                "sla_due_at": str(row[13]) if row[13] else "",
                "first_response_due_at": str(row[14]) if row[14] else "",
                "first_response_at": str(row[15]) if row[15] else "",
                "active_incident_count": int(row[16] or 0),
                "sla_state": sla_state(row[13], row[8]),
                "first_response_state": first_response_state(row[14], row[15], row[8]),
            }

        cur.execute("""
            SELECT
              t.id, t.title, t.requester_name, t.requester_email, t.department,
              t.category, COALESCE(t.subcategory, 'Inne') AS subcategory,
              t.priority, t.status, t.assigned_to_email,
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
              t.created_at, t.updated_at, t.sla_due_at, t.first_response_due_at, t.first_response_at,
              (
                SELECT COUNT(*)
                FROM incident_tickets it
                JOIN incidents i ON i.id = it.incident_id
                WHERE it.ticket_id = t.id
                  AND i.status <> 'resolved'
              ) AS active_incident_count
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            WHERE t.service_id = %s
              AND t.status NOT IN ('Rozwiązane', 'Zamknięte')
            ORDER BY
              CASE t.priority WHEN 'Krytyczny' THEN 1 WHEN 'Wysoki' THEN 2 WHEN 'Normalny' THEN 3 WHEN 'Niski' THEN 4 ELSE 5 END,
              t.updated_at DESC,
              t.id DESC
            LIMIT 10
        """, (service_id,))
        active_tickets = [service_context_ticket_payload(row) for row in cur.fetchall()]

        cur.execute("""
            SELECT
              t.id, t.title, t.requester_name, t.requester_email, t.department,
              t.category, COALESCE(t.subcategory, 'Inne') AS subcategory,
              t.priority, t.status, t.assigned_to_email,
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
              t.created_at, t.updated_at, t.sla_due_at, t.first_response_due_at, t.first_response_at,
              (
                SELECT COUNT(*)
                FROM incident_tickets it
                JOIN incidents i ON i.id = it.incident_id
                WHERE it.ticket_id = t.id
                  AND i.status <> 'resolved'
              ) AS active_incident_count
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            WHERE t.service_id = %s
            ORDER BY t.updated_at DESC, t.id DESC
            LIMIT 8
        """, (service_id,))
        recent_tickets = [service_context_ticket_payload(row) for row in cur.fetchall()]

        cur.execute("""
            SELECT
              i.id, i.title, i.summary, COALESCE(i.impact, ''),
              i.severity, i.status,
              COALESCE(i.commander_email, ''),
              COALESCE(i.commander_name, i.commander_email, ''),
              i.updated_at,
              COUNT(DISTINCT it.ticket_id) AS ticket_count,
              COUNT(DISTINCT NULLIF(t.department, '')) AS department_count
            FROM incidents i
            JOIN incident_tickets it ON it.incident_id = i.id
            JOIN tickets t ON t.id = it.ticket_id
            WHERE t.service_id = %s
              AND i.status <> 'resolved'
            GROUP BY i.id
            ORDER BY
              CASE i.severity WHEN 'SEV1' THEN 1 WHEN 'SEV2' THEN 2 WHEN 'SEV3' THEN 3 ELSE 4 END,
              i.updated_at DESC
            LIMIT 8
        """, (service_id,))
        active_incidents = [{
            "id": row[0],
            "title": row[1],
            "summary": row[2],
            "impact": row[3],
            "severity": row[4],
            "status": row[5],
            "commander_email": row[6],
            "commander_name": row[7],
            "updated_at": str(row[8]) if row[8] else "",
            "ticket_count": int(row[9] or 0),
            "department_count": int(row[10] or 0),
        } for row in cur.fetchall()]

        cur.execute("""
            SELECT
              COUNT(*) FILTER (WHERE t.created_at >= NOW() - INTERVAL '90 days') AS tickets_90_days,
              COUNT(*) FILTER (WHERE t.created_at >= NOW() - INTERVAL '30 days') AS tickets_30_days,
              COUNT(*) FILTER (WHERE t.created_at >= NOW() - INTERVAL '7 days') AS tickets_7_days,
              COUNT(*) FILTER (
                WHERE t.updated_at >= NOW() - INTERVAL '30 days'
                  AND t.status IN ('Rozwiązane', 'Zamknięte')
              ) AS resolved_30_days,
              COALESCE(
                ROUND(AVG(t.resolution_minutes) FILTER (
                  WHERE t.resolution_minutes IS NOT NULL
                    AND t.updated_at >= NOW() - INTERVAL '90 days'
                ))::INT,
                0
              ) AS avg_resolution_minutes_90_days,
              COUNT(*) FILTER (
                WHERE t.created_at >= NOW() - INTERVAL '30 days'
                  AND t.priority IN ('Wysoki', 'Krytyczny')
              ) AS high_priority_30_days,
              COUNT(*) FILTER (
                WHERE t.created_at >= NOW() - INTERVAL '30 days'
                  AND t.status NOT IN ('Rozwiązane', 'Zamknięte')
                  AND t.sla_due_at IS NOT NULL
                  AND t.sla_due_at < NOW()
              ) AS overdue_30_days
            FROM tickets t
            WHERE t.service_id = %s
        """, (service_id,))
        quality_row = cur.fetchone()
        cur.execute("""
            SELECT COUNT(DISTINCT i.id)
            FROM incidents i
            JOIN incident_tickets it ON it.incident_id = i.id
            JOIN tickets t ON t.id = it.ticket_id
            WHERE t.service_id = %s
              AND i.created_at >= NOW() - INTERVAL '90 days'
        """, (service_id,))
        incidents_90_days = int(cur.fetchone()[0] or 0)
        quality_summary = {
            "tickets_90_days": int(quality_row[0] or 0),
            "tickets_30_days": int(quality_row[1] or 0),
            "tickets_7_days": int(quality_row[2] or 0),
            "resolved_30_days": int(quality_row[3] or 0),
            "avg_resolution_minutes_90_days": int(quality_row[4] or 0),
            "high_priority_30_days": int(quality_row[5] or 0),
            "overdue_30_days": int(quality_row[6] or 0),
            "incidents_90_days": incidents_90_days,
        }

        cur.execute("""
            WITH days AS (
              SELECT generate_series(
                (CURRENT_DATE - INTERVAL '13 days')::date,
                CURRENT_DATE,
                INTERVAL '1 day'
              )::date AS day
            )
            SELECT
              to_char(days.day, 'YYYY-MM-DD') AS day,
              COUNT(t.id) AS ticket_count
            FROM days
            LEFT JOIN tickets t
              ON t.service_id = %s
             AND t.created_at::date = days.day
            GROUP BY days.day
            ORDER BY days.day
        """, (service_id,))
        trend_14_days = [{
            "day": row[0],
            "count": int(row[1] or 0),
        } for row in cur.fetchall()]

        cur.execute("""
            SELECT
              COALESCE(NULLIF(t.department, ''), 'Brak działu') AS department,
              COUNT(*) AS ticket_count
            FROM tickets t
            WHERE t.service_id = %s
              AND t.created_at >= NOW() - INTERVAL '90 days'
            GROUP BY 1
            ORDER BY ticket_count DESC, department ASC
            LIMIT 6
        """, (service_id,))
        top_departments = [{
            "label": row[0],
            "count": int(row[1] or 0),
        } for row in cur.fetchall()]

        cur.execute("""
            SELECT
              t.title,
              COALESCE(t.description, '')
            FROM tickets t
            WHERE t.service_id = %s
              AND t.created_at >= NOW() - INTERVAL '90 days'
            ORDER BY t.created_at DESC, t.id DESC
            LIMIT 200
        """, (service_id,))
        symptom_counts = {}
        for title, description in cur.fetchall():
            for token in similarity_tokens(title, description):
                if token.isdigit():
                    continue
                symptom_counts[token] = symptom_counts.get(token, 0) + 1
        top_symptoms = [
            {"label": token, "count": count}
            for token, count in sorted(
                symptom_counts.items(),
                key=lambda item: (-item[1], item[0]),
            )[:8]
        ]

        quality = {
            "summary": quality_summary,
            "trend_14_days": trend_14_days,
            "top_departments": top_departments,
            "top_symptoms": top_symptoms,
        }

        cur.close()
        conn.close()
        return jsonify({
            "service": service,
            "summary": summary,
            "active_tickets": active_tickets,
            "recent_tickets": recent_tickets,
            "active_incidents": active_incidents,
            "quality": quality,
        })

    def service_incident_default_severity(service, ticket_rows):
        ticket_count = len(ticket_rows or [])
        priorities = {ticket.get("priority") for ticket in (ticket_rows or [])}
        status = service.get("status") or "operational"
        criticality = service.get("criticality") or "medium"
        if (
            status == "outage"
            or criticality == "critical"
            or "Krytyczny" in priorities
            or ticket_count >= 15
        ):
            return "SEV1"
        if (
            status in ("degraded", "maintenance")
            or criticality == "high"
            or "Wysoki" in priorities
            or ticket_count >= 5
        ):
            return "SEV2"
        return "SEV3"

