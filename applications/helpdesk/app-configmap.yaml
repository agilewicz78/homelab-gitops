                          <span class="muted">${{esc(item.updated_at)}}</span>
                        </div>
                      `).join("")}}
                    </div>
                  ` : ""}}
                </section>
              ` : ""}}
              <p class="muted">Utworzono: ${{esc(article.created_at)}} · aktualizacja: ${{esc(article.updated_at)}} · ${{esc(article.updated_by_name || article.created_by_name)}}</p>
