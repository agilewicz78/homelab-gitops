                  <option value="">Nieprzypisane</option>
                  ${data.meta.operators.map(a => `<option value="${esc(a.email)}" ${a.email === t.assigned_to_email ? "selected" : ""}>${esc(a.name)} (${esc(a.role)})</option>`).join("")}
                </select>
                <button type="submit">Zapisz przypisanie</button>
