        async function assignTicketToMe(ticketId, email) {
          if (!email) {
            showToast("Nie można przypisać zgłoszenia", "Brakuje adresu e-mail aktualnego operatora.");
            return;
          }
          suppressNextLiveRefresh = true;
          const res = await api(`/api/tickets/${ticketId}/assign`, {
            method: "POST",
            body: JSON.stringify({ assigned_to_email: email })
          });
          if (!res || !res.ok) {
            suppressNextLiveRefresh = false;
            const err = res ? await res.json().catch(() => ({ error: "Nie udało się przypisać zgłoszenia." })) : { error: "Nie udało się przypisać zgłoszenia." };
            alert(err.error || "Nie udało się przypisać zgłoszenia.");
            return;
          }
          showToast("Przypisano zgłoszenie do Ciebie", `Zgłoszenie #${ticketId} trafiło do Twojej kolejki.`);
          await renderTicket(ticketId);
        }
        function ticketContextQuickActions(ticket, options = {}) {
          const currentUserEmail = String(options.currentUserEmail || "").toLowerCase();
          const assignedToEmail = String(ticket.assigned_to_email || "").toLowerCase();
          const isClosed = !!options.isClosed;
          const actions = [];
          if (!isClosed && options.currentUserCanBeAssigned && currentUserEmail && assignedToEmail !== currentUserEmail) {
            actions.push(`<button type="button" class="btn-secondary btn-small" onclick="assignTicketToMe(${ticket.id}, '${esc(currentUserEmail)}')">Przypisz do mnie</button>`);
          }
          if (!isClosed) {
            actions.push(`<button type="button" class="btn-secondary btn-small" onclick="prepareRequestUserInfo(${ticket.id})">Poproś o informacje</button>`);
            actions.push(`<button type="button" class="btn-secondary btn-small" onclick="focusTicketLinkForm()">Dodaj powiązanie</button>`);
          }
          if (!isClosed && Number(options.suggestedIncidentCount || 0) > 0) {
            actions.push(`<button type="button" class="btn-secondary btn-small" onclick="focusTicketContextSection('ticketContextPossibleIncidents')">Podepnij do incydentu</button>`);
          }
          if (!isClosed && options.canCreateIncident) {
            actions.push(`<button type="button" onclick="openIncidentFromTicketsModal()">Utwórz incydent</button>`);
          }
          if (options.canCreateKnowledgeArticle) {
            actions.push(`<button type="button" onclick="openKnowledgeArticleModal()">Utwórz artykuł KB</button>`);
          }
          if (!actions.length) return "";
          return `
            <div class="panel-soft">
              <strong>Szybkie akcje</strong>
              <div class="attachment-upload-hint" style="margin-top:6px">Skróty korzystają z istniejących formularzy i akcji zgłoszenia.</div>
              <div class="ticket-context-actions">${actions.join("")}</div>
            </div>
          `;
        }
