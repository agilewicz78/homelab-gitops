                return jsonify({
                    "error": "Wszystkie aktywne zgłoszenia tej usługi są już powiązane z aktywnym incydentem.",
                }), 400
            return jsonify({
                "error": "Brak aktywnych zgłoszeń tej usługi do powiązania z incydentem.",
            }), 400

        severity = clean(payload.get("severity")) or service_incident_default_severity(service, ticket_rows)
        if severity not in INCIDENT_SEVERITIES:
            cur.close()
            conn.close()
            return jsonify({"error": "Nieprawidłowy poziom SEV."}), 400
        commander_email = clean(payload.get("commander_email")).lower()
        resolved_commander_email, commander_name = incident_commander(cur, commander_email)
        if commander_email and not resolved_commander_email:
            cur.close()
            conn.close()
            return jsonify({"error": "Dowódca incydentu musi być operatorem lub administratorem."}), 400
        if not resolved_commander_email:
            resolved_commander_email = user["email"]
            commander_name = user["name"]

        ticket_count = len(ticket_rows)
        service_name = service.get("name") or "Usługa IT"
        title = clean(payload.get("title")) or f"Incydent: {service_name}"
        summary = clean(payload.get("summary")) or (
            f"Usługa {service_name} ma {ticket_count} aktywnych zgłoszeń "
            "wymagających wspólnej obsługi."
        )
        impact = clean(payload.get("impact")) or (
            f"Problem dotyczy usługi {service_name} "
            f"({service.get('category') or '-'} / {service.get('subcategory') or 'Inne'})."
        )
        user_status_summary = clean(payload.get("user_status_summary")) or (
            f"Helpdesk obsługuje problem z usługą {service_name} jako incydent zbiorczy."
        )
        user_current_action = clean(payload.get("user_current_action")) or (
            "Analizujemy zgłoszenia, potwierdzamy zakres wpływu i ustalamy przyczynę problemu."
        )
        next_update_hint = clean(payload.get("next_update_hint")) or (
            "Kolejna aktualizacja pojawi się po potwierdzeniu wpływu albo przyczyny."
        )

        cur.execute("""
            INSERT INTO incidents (
              title, summary, impact, severity, status,
              commander_email, commander_name, created_by_email, created_by_name,
              user_status_summary, user_current_action, next_update_hint
            )
            VALUES (%s, %s, %s, %s, 'investigating', %s, %s, %s, %s, %s, %s, %s)
            RETURNING id
        """, (
            title, summary, impact, severity,
            resolved_commander_email, commander_name,
            user["email"], user["name"],
            user_status_summary, user_current_action, next_update_hint,
        ))
        incident_id = cur.fetchone()[0]
        cur.execute("""
            INSERT INTO incident_updates (
              incident_id, update_type, message, is_public,
              created_by_email, created_by_name
            )
            VALUES (%s, 'created_from_service', %s, FALSE, %s, %s)
        """, (
            incident_id,
            f"Utworzono incydent {severity} z usługi {service_name}. Powiązano {ticket_count} zgłoszeń.",
            user["email"],
            user["name"],
        ))
        ticket_ids = []
        for ticket in ticket_rows:
            ticket_id = int(ticket["id"])
            ticket_ids.append(ticket_id)
            cur.execute("""
                INSERT INTO incident_tickets (incident_id, ticket_id, linked_by_email)
                VALUES (%s, %s, %s)
            """, (incident_id, ticket_id, user["email"]))
            public_comment = (
                f"Twoje zgłoszenie zostało powiązane z incydentem "
                f"{severity} #{incident_id}: {title}. "
                f"Incydent utworzono z kontekstu usługi {service_name}. "
                "Dalsze publiczne aktualizacje operatora będą automatycznie "
                "dodawane do tego zgłoszenia."
            )
            cur.execute("""
                INSERT INTO comments (
                  ticket_id, author, author_email, content, visibility
                )
                VALUES (%s, %s, %s, %s, %s)
            """, (
                ticket_id,
                f"Incident Command Center · {user['name']}",
                user["email"],
                public_comment,
                "public",
            ))
            mark_first_response_if_needed(cur, ticket_id, user)
            cur.execute(
                "UPDATE tickets SET updated_at = NOW() WHERE id = %s",
                (ticket_id,),
            )
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "incident_linked",
                f"Zgłoszenie powiązano z incydentem #{incident_id}: {title}",
            )
            create_ticket_notifications(
                cur,
                ticket_id,
                "incident_linked",
                f"Zgłoszenie #{ticket_id} powiązano z incydentem #{incident_id}: {title}",
                actor_email=user["email"],
            )
        log_audit(cur, user, "incident_created_from_service", "incident", incident_id, {
            "service_id": service_id,
            "service_name": service_name,
            "severity": severity,
            "ticket_ids": ticket_ids,
            "active_ticket_count": active_ticket_count,
            "skipped_existing_incident_count": skipped_existing_incident_count,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"{user['name']} utworzył incydent #{incident_id} z usługi {service_name}",
            "incident_created",
            None,
            staff_only=False,
            ticket_ids=ticket_ids,
        )
        return jsonify({
            "id": incident_id,
            "severity": severity,
            "linked_ticket_count": len(ticket_ids),
            "active_ticket_count": active_ticket_count,
            "skipped_existing_incident_count": skipped_existing_incident_count,
        }), 201

    def service_payload_from_request(payload):
        name = clean(payload.get("name"))
        service_key = normalize_service_key(payload.get("service_key") or name)
        description = clean(payload.get("description"))
        category = clean(payload.get("category"))
        subcategory = clean(payload.get("subcategory")) or "Inne"
        owner_email = clean(payload.get("owner_email")) or None
        status = clean(payload.get("status")) or "operational"
        criticality = clean(payload.get("criticality")) or "medium"
        default_priority = clean(payload.get("default_priority")) or "Normalny"
        user_visible = bool(payload.get("user_visible", True))
        is_active = bool(payload.get("is_active", True))
        if not name:
            return None, "Nazwa usługi jest wymagana."
        if category not in CATEGORIES:
            return None, "Nieprawidłowa kategoria usługi."
        if subcategory not in SUBCATEGORIES.get(category, ["Inne"]):
            return None, "Nieprawidłowa podkategoria usługi."
        if status not in SERVICE_STATUSES:
            return None, "Nieprawidłowy status usługi."
        if criticality not in SERVICE_CRITICALITIES:
            return None, "Nieprawidłowa krytyczność usługi."
        if default_priority not in PRIORITIES:
            return None, "Nieprawidłowy domyślny priorytet usługi."
        return {
            "service_key": service_key,
            "name": name,
            "description": description,
            "category": category,
            "subcategory": subcategory,
            "owner_email": owner_email,
            "status": status,
            "criticality": criticality,
            "default_priority": default_priority,
            "user_visible": user_visible,
            "is_active": is_active,
        }, None

