        function updateWorkflowSubcategoryOptions(meta, selectedCategory, selectedSubcategory = "*") {{
          const select = document.getElementById("workflowSubcategorySelect");
          if (!select) return;
          const subcategories = selectedCategory === "*"
            ? ["*"]
            : ["*", ...(meta.subcategories[selectedCategory] || ["Inne"])];
          select.innerHTML = subcategories.map(s => `
            <option value="${{esc(s)}}" ${{s === selectedSubcategory ? "selected" : ""}}>
              ${{s === "*" ? "Dowolna podkategoria" : esc(s)}}
            </option>
          `).join("");
        }}
        let workflowFormStage = 1;
        function workflowFormInvalidField(stage) {{
          const section = document.querySelector(`[data-workflow-stage="${{stage}}"]`);
          if (!section) return null;
          return Array.from(section.querySelectorAll("input, select, textarea"))
            .find(field => typeof field.checkValidity === "function" && !field.checkValidity()) || null;
        }}
        function setWorkflowFormStage(stage, skipValidation = false) {{
          const targetStage = Math.max(1, Math.min(Number(stage) || 1, 4));
          if (!skipValidation && targetStage > workflowFormStage) {{
            for (let currentStage = workflowFormStage; currentStage < targetStage; currentStage += 1) {{
              const invalidField = workflowFormInvalidField(currentStage);
              if (invalidField) {{
                setWorkflowFormStage(currentStage, true);
                invalidField.reportValidity();
                return;
              }}
            }}
          }}
          workflowFormStage = targetStage;
          document.querySelectorAll("[data-workflow-stage]").forEach(section => {{
            section.classList.toggle("hidden", Number(section.dataset.workflowStage) !== workflowFormStage);
          }});
          document.querySelectorAll("[data-workflow-step]").forEach(button => {{
            const active = Number(button.dataset.workflowStep) === workflowFormStage;
            button.setAttribute("aria-current", active ? "step" : "false");
          }});
          const back = document.getElementById("workflowStageBack");
          const next = document.getElementById("workflowStageNext");
          const save = document.getElementById("workflowSaveButton");
          if (back) back.classList.toggle("hidden", workflowFormStage === 1);
          if (next) next.classList.toggle("hidden", workflowFormStage === 4);
          if (save) save.classList.toggle("hidden", workflowFormStage !== 4);
          document.getElementById("workflowFormTop")?.scrollIntoView({{ behavior: "smooth", block: "start" }});
        }}
        function workflowFormStageButton(stage, title, description) {{
          return `
            <button type="button" class="workflow-wizard-step" data-workflow-step="${{stage}}" onclick="setWorkflowFormStage(${{stage}}); return false;">
              <strong>${{stage}}. ${{esc(title)}}</strong>
              <small>${{esc(description)}}</small>
            </button>
          `;
        }}
