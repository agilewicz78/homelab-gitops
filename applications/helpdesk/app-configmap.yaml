    # Normalizuje listę akcji reguły workflow zapisaną z formularza.
    def normalize_workflow_automation_actions(item, steps):
        valid_actions = {"change_status", "change_priority", "add_workflow_watchers", "add_system_comment", "notify", "add_history", "require_comment", "require_attachment"}
        raw_actions = item.get("actions")
        if isinstance(raw_actions, str):
            try:
                raw_actions = json.loads(raw_actions)
            except Exception:
                raw_actions = []
        if not isinstance(raw_actions, list) or not raw_actions:
            raw_actions = [{
                "action_type": item.get("action_type") or "change_status",
                "action_value": item.get("action_status") or item.get("action_value"),
                "is_active": True,
                "action_order": 1,
            }]
        actions = []
        for idx, action in enumerate(raw_actions):
            if not isinstance(action, dict):
                continue
            action_type = clean(action.get("action_type")) or "change_status"
            action_value = clean(action.get("action_value"))
            if not action_value:
                action_value = clean(action.get("action_status"))
            if action_type not in valid_actions:
                continue
            if action_type == "change_status":
                if not action_value or action_value not in steps:
                    continue
            elif action_type == "change_priority":
                if not action_value or action_value not in PRIORITIES:
                    continue
            elif action_type == "add_system_comment":
                action_value = action_value or "Reguła workflow została wykonana."
            else:
                action_value = action_value or None
            try:
                action_order = int(action.get("action_order", idx + 1))
            except Exception:
                action_order = idx + 1
            actions.append({
                "action_type": action_type,
                "action_value": action_value,
                "is_active": bool(action.get("is_active", True)),
                "action_order": max(1, min(action_order, 9999)),
            })
        return actions
    def normalize_workflow_automations(payload, steps, workflow_category="*", workflow_subcategory="*"):
        raw = payload.get("automations") or []
        if isinstance(raw, str):
            try:
                raw = json.loads(raw)
            except Exception:
                raw = []
        normalized = []
        valid_events = {
            "ticket_created",
            "comment_added",
            "user_comment_added",
            "staff_comment_added",
            "attachment_added",
            "status_changed",
            "ticket_assigned",
        }
        valid_roles = {"user", "staff", "operator", "admin", "*", "any", ""}
        valid_visibility = {"public", "internal", "*", "any", ""}
        valid_assigned_states = {"*", "any", "assigned", "unassigned", ""}
        valid_sla_states = {"*", "any", "ok", "warning", "overdue", "done", "none", ""}
        workflow_category = clean(workflow_category) or "*"
        workflow_subcategory = clean(workflow_subcategory) or "*"
        for item in raw:
            if not isinstance(item, dict):
                continue
            name = clean(item.get("name")) or "Reguła workflow"
            event_type = clean(item.get("event_type"))

            # Statusy mogą być podane jako konkretna nazwa kroku albo jako wildcard.
            # Ujednolicamy zapis tak, żeby formularz, API i symulator nie traktowały
            # pustej wartości jako dosłownego statusu "None".
            condition_status = clean(item.get("condition_status"))
            condition_to_status = clean(item.get("condition_to_status"))
            if condition_status == "any":
                condition_status = "*"
            if condition_to_status == "any":
                condition_to_status = "*"
            condition_status = condition_status or None
            condition_to_status = condition_to_status or None

            condition_role = clean(item.get("condition_role")) or None
            condition_visibility = clean(item.get("condition_comment_visibility")) or None
            assigned_state = clean(item.get("assigned_state")) or "*"
            condition_priority = clean(item.get("condition_priority")) or "*"
            condition_category = clean(item.get("condition_category")) or "*"
            condition_subcategory = clean(item.get("condition_subcategory")) or "*"
            condition_sla_state = clean(item.get("condition_sla_state")) or "*"
            condition_status_operator = normalize_workflow_condition_operator(item.get("condition_status_operator"))
            condition_to_status_operator = normalize_workflow_condition_operator(item.get("condition_to_status_operator"))
            condition_role_operator = normalize_workflow_condition_operator(item.get("condition_role_operator"))
            condition_comment_visibility_operator = normalize_workflow_condition_operator(item.get("condition_comment_visibility_operator"))
            assigned_state_operator = normalize_workflow_condition_operator(item.get("assigned_state_operator"))
            condition_priority_operator = normalize_workflow_condition_operator(item.get("condition_priority_operator"))
            condition_category_operator = normalize_workflow_condition_operator(item.get("condition_category_operator"))
            condition_subcategory_operator = normalize_workflow_condition_operator(item.get("condition_subcategory_operator"))
            condition_sla_state_operator = normalize_workflow_condition_operator(item.get("condition_sla_state_operator"))
            is_active = bool(item.get("is_active", True))
            stop_processing = bool(item.get("stop_processing", True))
            try:
                priority = int(item.get("priority", 100))
            except Exception:
                priority = 100
            priority = max(1, min(priority, 9999))
            if event_type not in valid_events:
                continue
            if condition_role and condition_role not in valid_roles:
                condition_role = None
            if condition_role == "any":
                condition_role = "*"
            if condition_visibility and condition_visibility not in valid_visibility:
                condition_visibility = None
            if condition_visibility == "any":
                condition_visibility = "*"
            if assigned_state not in valid_assigned_states:
                assigned_state = "*"
            if assigned_state == "any":
                assigned_state = "*"
            if condition_priority not in (["*", "any", ""] + PRIORITIES):
                condition_priority = "*"
            if condition_priority == "any":
                condition_priority = "*"
            if condition_category not in (["*", "any", ""] + CATEGORIES):
                condition_category = "*"
            if condition_category == "any":
                condition_category = "*"
            valid_subcategories = set(["*", "any", "", "Inne"])
            for values in SUBCATEGORIES.values():
                valid_subcategories.update(values)
            if condition_subcategory not in valid_subcategories:
                condition_subcategory = "*"
            if condition_subcategory == "any":
                condition_subcategory = "*"
            # Zakres workflow jest już gwarantowany podczas przypisywania zgłoszenia.
            # Usuwamy jego duplikaty z reguły, aby nie mogła stać się sprzeczna.
            if workflow_category != "*":
                condition_category = "*"
                condition_category_operator = "eq"
                allowed_subcategories = set(SUBCATEGORIES.get(workflow_category, ["Inne"]))
                if workflow_subcategory == "*" and condition_subcategory not in ("*", "") and condition_subcategory not in allowed_subcategories:
                    condition_subcategory = "*"
                    condition_subcategory_operator = "eq"
            if workflow_subcategory != "*":
                condition_subcategory = "*"
                condition_subcategory_operator = "eq"
            if condition_sla_state not in valid_sla_states:
                condition_sla_state = "*"
            if condition_sla_state == "any":
                condition_sla_state = "*"
            # "*" oznacza dowolny status i jest poprawną wartością warunku.
            if condition_status and condition_status != "*" and condition_status not in steps:
                continue
            if condition_to_status and condition_to_status != "*" and condition_to_status not in steps:
                continue
            actions = normalize_workflow_automation_actions(item, steps)
            if not actions:
                continue
            primary = actions[0]
            normalized.append({
                "name": name,
                "event_type": event_type,
                "condition_status": condition_status,
                "condition_to_status": condition_to_status,
                "condition_role": condition_role,
                "condition_comment_visibility": condition_visibility,
                "assigned_state": assigned_state,
                "condition_priority": condition_priority,
                "condition_category": condition_category,
                "condition_subcategory": condition_subcategory,
                "condition_sla_state": condition_sla_state,
                "condition_status_operator": condition_status_operator,
                "condition_to_status_operator": condition_to_status_operator,
                "condition_role_operator": condition_role_operator,
                "condition_comment_visibility_operator": condition_comment_visibility_operator,
                "assigned_state_operator": assigned_state_operator,
                "condition_priority_operator": condition_priority_operator,
                "condition_category_operator": condition_category_operator,
                "condition_subcategory_operator": condition_subcategory_operator,
                "condition_sla_state_operator": condition_sla_state_operator,
                "action_type": primary.get("action_type") or "change_status",
                "action_status": primary.get("action_value"),
                "actions": actions,
                "is_active": is_active,
                "stop_processing": stop_processing,
                "priority": priority,
            })
        return normalized

