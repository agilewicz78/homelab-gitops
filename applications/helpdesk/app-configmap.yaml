          const existingRule = workflowAutomationEditingIndex === null ? null : workflowAutomationEditor[workflowAutomationEditingIndex];
          if (workflowId) {{
            const endpoint = existingRule && existingRule.id
              ? `/api/admin/workflows/${{workflowId}}/automations/${{existingRule.id}}`
              : `/api/admin/workflows/${{workflowId}}/automations`;
            const method = existingRule && existingRule.id ? "PUT" : "POST";
            const res = await api(endpoint, {{ method, body: JSON.stringify(rule) }});
            if (!res || !res.ok) {{
              const data = res ? await res.json().catch(() => ({{}})) : {{}};
              alert(data.error || "Nie udało się zapisać reguły automatyzacji.");
              return;
            }}
            const data = await res.json().catch(() => ({{}}));
            workflowAutomationEditor = Array.isArray(data.automations) ? data.automations : workflowAutomationEditor;
            if (workflowAutomationEditorWorkflow) workflowAutomationEditorWorkflow.automations = workflowAutomationEditor;
          }} else {{
