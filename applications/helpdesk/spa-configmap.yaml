                <select name="priority">${meta.priorities.map(x => `<option ${x === "Normalny" ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
                <div id="newTicketKnowledgeSuggestions" class="hidden"></div>
                <label>Załączniki opcjonalne</label>
                <input type="file" name="attachments" multiple accept=".png,.jpg,.jpeg,.gif,.pdf,.txt,.log,.csv,.xlsx,.docx">
                <p class="muted">Możesz dodać screenshot, PDF, log lub dokument. Maksymalnie 10 MB na plik. Załączniki zostaną zapisane automatycznie po kliknięciu „Utwórz zgłoszenie”.</p>
                <button type="submit">Utwórz zgłoszenie</button>
                <button type="button" class="btn-secondary" onclick="renderHome()">Anuluj</button>
              </form>
            </section>`;
          updateSubcategorySelect(meta);
          if (pendingNewTicketServiceId) {
            const serviceSelect = document.getElementById("new-ticket-service");
            if (serviceSelect) {
              serviceSelect.value = String(pendingNewTicketServiceId);
              applySelectedServiceToNewTicket(meta);
            }
            pendingNewTicketServiceId = null;
          }
          document.getElementById("new-ticket-service").addEventListener("change", () => {
            applySelectedServiceToNewTicket(meta);
            scheduleNewTicketKnowledgeSuggestions();
          });
          document.getElementById("new-ticket-title").addEventListener("input", scheduleNewTicketKnowledgeSuggestions);
          document.getElementById("new-ticket-description").addEventListener("input", scheduleNewTicketKnowledgeSuggestions);
          document.getElementById("new-ticket-category").addEventListener("change", () => {
            const serviceSelect = document.getElementById("new-ticket-service");
