      .workflow-diagram-arrow { flex: 0 0 30px; display: grid; place-items: center; color: #7dd3fc; font-size: 27px; font-weight: 900; }
      .workflow-diagram-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .incident-ticket-choice { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
      .incident-ticket-choice input[type="checkbox"] { width: auto; margin-top: 4px; }
