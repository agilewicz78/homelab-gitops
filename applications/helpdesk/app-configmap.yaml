        """

        return Response(layout(content), mimetype="text/html")

    @app.post("/login")
    def login_submit():
        email = request.form.get("email", "").strip().lower()
        password = request.form.get("password", "")

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT full_name, email, department, role, password_hash
            FROM users
            WHERE lower(email) = %s
        """, (email,))
        user = cur.fetchone()
        cur.close()
        conn.close()

        if not user:
            return redirect("/login?error=1")

        full_name, user_email, department, role, password_hash = user

        if not check_password_hash(password_hash, password):
            return redirect("/login?error=1")

        session["user_name"] = full_name
        session["user_email"] = user_email
        session["user_department"] = department
        session["user_role"] = role

        return redirect("/")

    @app.get("/logout")
    def logout():
        session.clear()
        return redirect("/login")

    @app.get("/")
    @login_required
    def index():
        user = current_user()

        conn = get_conn()
        cur = conn.cursor()

        if is_admin():
            where_sql = ""
            where_params = ()
        else:
            where_sql = "WHERE requester_email = %s"
            where_params = (user["email"],)

        cur.execute(f"""
            SELECT
              COUNT(*),
              COUNT(*) FILTER (WHERE status = 'Nowe'),
              COUNT(*) FILTER (WHERE status = 'W trakcie'),
              COUNT(*) FILTER (WHERE priority IN ('Wysoki', 'Krytyczny')),
              COUNT(*) FILTER (WHERE status IN ('Rozwiązane', 'Zamknięte'))
            FROM tickets
            {where_sql}
        """, where_params)
        total, new_count, in_progress, high_count, resolved_count = cur.fetchone()

        cur.execute(f"""
            SELECT id, title, requester_name, department, category, priority, status, created_at
            FROM tickets
            {where_sql}
            ORDER BY id DESC
        """, where_params)
        rows = cur.fetchall()

        cur.close()
        conn.close()

        table_rows = ""
        for row in rows:
            ticket_id, title, requester, department, category, priority, status, created_at = row
            priority_class = "priority-" + priority.replace(" ", "-")
            table_rows += f"""
            <tr>
              <td>#{ticket_id}</td>
              <td><a class="ticket-title" href="/tickets/{ticket_id}">{esc(title)}</a></td>
              <td>{esc(requester)}<br><span class="muted">{esc(department)}</span></td>
              <td>{esc(category)}</td>
              <td><span class="pill {esc(priority_class)}">{esc(priority)}</span></td>
              <td><span class="pill">{esc(status)}</span></td>
              <td class="muted">{esc(created_at)}</td>
            </tr>
            """

        scope_label = "Wszystkie zgłoszenia" if is_admin() else "Moje zgłoszenia"

        content = f"""
        <section class="stats">
          <div class="stat"><div class="num">{total}</div><div class="label">{scope_label}</div></div>
          <div class="stat"><div class="num">{new_count}</div><div class="label">Nowe</div></div>
          <div class="stat"><div class="num">{in_progress}</div><div class="label">W trakcie</div></div>
          <div class="stat"><div class="num">{high_count}</div><div class="label">Wysoki / Krytyczny</div></div>
          <div class="stat"><div class="num">{resolved_count}</div><div class="label">Rozwiązane / Zamknięte</div></div>
        </section>

        <section class="card">
          <a class="btn" href="/tickets/new">Nowe zgłoszenie</a>
        </section>

        <section class="card">
          <h2>{scope_label}</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Tytuł</th>
                <th>Zgłaszający</th>
                <th>Kategoria</th>
                <th>Priorytet</th>
                <th>Status</th>
                <th>Utworzono</th>
              </tr>
            </thead>
            <tbody>
              {table_rows}
            </tbody>
          </table>
        </section>
        """

        return Response(layout(content), mimetype="text/html")

    @app.get("/tickets/new")
