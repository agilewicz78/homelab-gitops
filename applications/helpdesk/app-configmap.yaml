        async function renderHome(statusFilters = loadStatusFilters(), fromLive = false) {{
          currentView = {{ name: "home", ticketId: null }};
          const me = await loadMe();
          if (!me) return;

          const filters = Array.isArray(statusFilters) ? statusFilters : [];
          saveStatusFilters(filters);

          const assignedFilter = canWorkTickets(me) ? loadAssignedFilter(me) : "all";
          const priorityFilter = loadPriorityFilter();
          const slaFilter = loadSlaFilter();
          const searchQuery = loadTicketSearch();
          const sortBy = loadTicketSort();
          const sortOrder = loadTicketOrder();
          const page = loadTicketPage();
          const pageSize = loadTicketPageSize();

          const params = new URLSearchParams();
          if (filters.length) params.set("statuses", filters.join(","));
          if (canWorkTickets(me)) params.set("assigned", assignedFilter);
          if (priorityFilter && priorityFilter !== "all") params.set("priority", priorityFilter);
          if (slaFilter && slaFilter !== "all") params.set("sla", slaFilter);
          if (searchQuery) params.set("q", searchQuery);
          params.set("sort", sortBy);
          params.set("order", sortOrder);
          params.set("page", String(page));
          params.set("page_size", String(pageSize));

          const query = params.toString() ? `?${{params.toString()}}` : "";
          const res = await api(`/api/tickets${{query}}`);
          if (!res) return;
          const data = await res.json();
          if (!res.ok) {{
            appEl.innerHTML = `<section class="card"><h2>Błąd pobierania zgłoszeń</h2><p class="error">${{esc(data.error || "Nieznany błąd")}}</p></section>`;
            return;
          }}

          const scope = canWorkTickets(me) ? "Zgłoszenia" : "Moje zgłoszenia";
          const activeFilterCount = filters.length + (canWorkTickets(me) && assignedFilter !== "all" ? 1 : 0) + (priorityFilter !== "all" ? 1 : 0) + (slaFilter !== "all" ? 1 : 0) + (searchQuery ? 1 : 0);
          const filterSummary = [];
          if (filters.length) filterSummary.push(`status: ${{filters.join(", ")}}`);
          if (canWorkTickets(me) && assignedFilter !== "all") filterSummary.push(`operator: ${{assignedFilterLabel(assignedFilter, data.operators || [])}}`);
          if (priorityFilter !== "all") filterSummary.push(`priorytet: ${{priorityFilter}}`);
          if (slaFilter !== "all") filterSummary.push(`SLA: ${{slaFilterLabel(slaFilter)}}`);
          if (searchQuery) filterSummary.push(`szukaj: ${{searchQuery}}`);
          const filteredLabel = filterSummary.length ? ` · ${{filterSummary.join(" · ")}}` : "";
          const pagination = data.pagination || {{ page: 1, page_size: pageSize, total_pages: 1, total_filtered: data.tickets.length }};
          if (pagination.page !== page) saveTicketPage(pagination.page);

          const statusChecks = data.statuses.map(s => `
            <label class="combo-option">
              <input type="checkbox" ${{filters.includes(s) ? "checked" : ""}} onchange="toggleStatusFilter('${{esc(s)}}')">
              <span class="pill ${{statusClass(s)}}">${{esc(s)}}</span>
            </label>`).join("");

          const assignedSelect = canWorkTickets(me) ? `
            <div class="filter-field">
              <label>Przypisane do</label>
              <select onchange="setAssignedFilter(this.value)">
                <option value="me" ${{assignedFilter === "me" ? "selected" : ""}}>Moje zgłoszenia</option>
                <option value="all" ${{assignedFilter === "all" ? "selected" : ""}}>Wszystkie</option>
                <option value="unassigned" ${{assignedFilter === "unassigned" ? "selected" : ""}}>Nieprzypisane</option>
                ${{(data.operators || []).map(op => `<option value="${{esc(op.email)}}" ${{assignedFilter === op.email ? "selected" : ""}}>${{esc(op.name)}} · ${{esc(op.email)}}</option>`).join("")}}
              </select>
            </div>` : "";

          const prioritySelect = `
            <div class="filter-field">
              <label>Priorytet</label>
              <select onchange="setPriorityFilter(this.value)">
                <option value="all" ${{priorityFilter === "all" ? "selected" : ""}}>Wszystkie priorytety</option>
                ${{(data.priorities || []).map(p => `<option value="${{esc(p)}}" ${{priorityFilter === p ? "selected" : ""}}>${{esc(p)}}</option>`).join("")}}
              </select>
            </div>`;

          const slaSelect = `
            <div class="filter-field">
              <label>SLA</label>
              <select onchange="setSlaFilter(this.value)">
                <option value="all" ${{slaFilter === "all" ? "selected" : ""}}>Wszystkie SLA</option>
                <option value="ok" ${{slaFilter === "ok" ? "selected" : ""}}>OK</option>
                <option value="warning" ${{slaFilter === "warning" ? "selected" : ""}}>Blisko terminu</option>
                <option value="overdue" ${{slaFilter === "overdue" ? "selected" : ""}}>Przekroczone</option>
                <option value="done" ${{slaFilter === "done" ? "selected" : ""}}>Zakończone</option>
                <option value="none" ${{slaFilter === "none" ? "selected" : ""}}>Brak SLA</option>
              </select>
            </div>`;

          const searchSortControls = `
            <div class="filter-grid" style="margin-top:14px">
              <div class="filter-field" style="grid-column: span 2">
