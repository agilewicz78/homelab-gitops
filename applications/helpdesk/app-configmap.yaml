            appEl.innerHTML = `<section class="card"><button class="btn-secondary" onclick="${{backTarget}}">${{backLabel}}</button><h2>Centrum automatyzacji</h2><p class="error">${{esc(data.error || data.message || "Nie udało się pobrać Centrum automatyzacji.")}}</p></section>`;
