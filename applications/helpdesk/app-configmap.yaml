          if (listButton) listButton.setAttribute("aria-pressed", viewMode === "list" ? "true" : "false");
          if (diagramButton) diagramButton.setAttribute("aria-pressed", viewMode === "diagram" ? "true" : "false");
        }}
        function workflowAutomationTemplateStatus(workflow, preferred, fallback = "") {{
          const statuses = workflowStatuses(workflow);
          for (const candidate of preferred) {{
            if (statuses.includes(candidate)) return candidate;
          }}
          return fallback || statuses[0] || "";
        }}
        function workflowAutomationTemplateBase(overrides = {{}}) {{
          return {{
            ...workflowAutomationEmptyRule(),
            id: null,
            is_active: false,
            stop_processing: true,
            priority: ((workflowAutomationEditor.length + 1) * 10),
            ...overrides,
          }};
        }}
