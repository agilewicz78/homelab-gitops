        async function renderNewTicket() {{
          currentView = {{ name: "new-ticket", ticketId: null }};
          const me = await loadMe();
          if (!me) return;
          const metaRes = await api("/api/meta");
          const meta = await metaRes.json();
          appEl.innerHTML = `
            <section class="card">
              <h2>Nowe zgłoszenie</h2>
              <form id="ticketForm">
                <label>Tytuł problemu</label>
                <input name="title" required placeholder="Np. Outlook nie odbiera poczty">
                <label>Opis</label>
                <textarea name="description" required placeholder="Opisz problem, komunikat błędu, od kiedy występuje..."></textarea>
                <div class="grid">
                  <div><label>Zgłaszający</label><input value="${{esc(me.name)}}" disabled></div>
