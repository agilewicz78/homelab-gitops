        cur.execute("""
            INSERT INTO ticket_links (ticket_id, linked_ticket_id, relation_type, created_by_email)
            VALUES (%s, %s, %s, %s)
            ON CONFLICT (ticket_id, linked_ticket_id, relation_type) DO NOTHING
            RETURNING id
        """, (a_id, b_id, relation_type, user["email"]))
