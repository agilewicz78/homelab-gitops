        function workflowAutomationRuleActions(rule) {{
          const actions = Array.isArray(rule.actions) && rule.actions.length
            ? rule.actions
            : [{{
                action_type: rule.action_type || "change_status",
                action_value: rule.action_status || "",
                is_active: true,
                action_order: 1,
              }}];
          return actions
            .map((a, idx) => ({{
              action_type: a.action_type || "change_status",
              action_value: a.action_value || a.action_status || "",
              is_active: a.is_active !== false,
              action_order: Number(a.action_order || (idx + 1)),
            }}))
            .filter(a => a.is_active !== false);
        }}
        function workflowAutomationActionSummary(action) {{
          if ((action.action_type || "change_status") === "change_status") return `zmień status na „${{action.action_value || "—"}}”`;
          if (action.action_type === "notify") return "wyślij powiadomienie";
          if (action.action_type === "add_history") return "dodaj wpis do historii";
          return action.action_type || "akcja";
        }}
        function workflowAutomationActionTypeOptions(selected) {{
          return automationSelectOptions([
            {{ value: "change_status", label: "Zmień status" }},
            {{ value: "notify", label: "Wyślij powiadomienie" }},
            {{ value: "add_history", label: "Dodaj wpis do historii" }},
          ], selected || "change_status");
        }}
        function workflowAutomationRuleSummary(rule) {{
          const eventLabels = {{
            ticket_created: "utworzono zgłoszenie",
            comment_added: "dodano komentarz/notatkę",
            attachment_added: "dodano załącznik",
            status_changed: "zmieniono status",
          }};
          const roleLabels = {{ "*": "dowolna rola", user: "użytkownik", staff: "operator/admin", operator: "operator", admin: "admin" }};
          const visibilityLabels = {{ "*": "dowolny typ komentarza", public: "komentarz publiczny", internal: "notatka wewnętrzna" }};
          const assignedLabels = {{ "*": "dowolne przypisanie", assigned: "zgłoszenie przypisane", unassigned: "zgłoszenie nieprzypisane" }};
          const actionSummary = workflowAutomationRuleActions(rule)
            .map(action => workflowAutomationActionSummary(action))
            .join(", ");
          const parts = [
            `Gdy: ${{eventLabels[rule.event_type] || rule.event_type || "zdarzenie"}}`,
            rule.event_type === "status_changed"
              ? `${{rule.condition_status ? `z „${{rule.condition_status}}”` : "z dowolnego statusu"}} ${{rule.condition_to_status ? `na „${{rule.condition_to_status}}”` : "na dowolny status"}}`
              : (rule.condition_status ? `status = „${{rule.condition_status}}”` : "dowolny status"),
            roleLabels[rule.condition_role || "*"] || rule.condition_role,
            visibilityLabels[rule.condition_comment_visibility || "*"] || rule.condition_comment_visibility,
            assignedLabels[rule.assigned_state || "*"] || rule.assigned_state,
            `akcje: ${{actionSummary || "—"}}`,
            rule.stop_processing !== false ? "zatrzymaj dalsze reguły" : "kontynuuj kolejne reguły",
          ];
          return parts.filter(Boolean).join(" · ");
        }}
        function workflowAutomationRuleBadge(text) {{
          return `<span class="status-badge status-progress">${{esc(text || "")}}</span>`;
        }}
        function workflowAutomationRuleListItem(rule, idx) {{
          const activeBadge = rule.is_active !== false
            ? `<span class="status-badge status-new">Aktywna</span>`
            : `<span class="status-badge status-closed">Nieaktywna</span>`;
          const stopBadge = rule.stop_processing !== false
            ? `<span class="status-badge status-wait">Stop po wykonaniu</span>`
            : `<span class="status-badge status-open">Kontynuuj reguły</span>`;
          return `
            <div class="card workflow-rule-card" style="padding:12px;margin:10px 0">
              <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
                <div>
                  <h4 style="margin:0 0 6px">${{esc(rule.name || `Reguła ${{idx + 1}}`)}}</h4>
                  <div class="attachment-upload-hint">${{esc(workflowAutomationRuleSummary(rule))}}</div>
                  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
                    ${{activeBadge}}
                    ${{stopBadge}}
                    ${{workflowAutomationRuleBadge("Priorytet " + Number(rule.priority || 100))}}
                  </div>
                </div>
                <div class="actions">
                  <button type="button" class="btn-secondary btn-small" onclick="openWorkflowAutomationRuleForm(${{idx}})">Edytuj</button>
                  <button type="button" class="btn-danger btn-small" onclick="deleteWorkflowAutomationRule(${{idx}})">Usuń</button>
                </div>
              </div>
            </div>
          `;
        }}
        function renderWorkflowAutomationRules() {{
          const box = document.getElementById("workflowAutomationRules");
          if (!box) return;
          const rules = workflowAutomationEditor
