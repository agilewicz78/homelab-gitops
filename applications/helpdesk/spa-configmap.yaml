            : "";
        }
        function operatorCenterTicketCard(ticket) {
          const assigned = ticket.assigned_to_name || "Nieprzypisane";
          return `
            <button class="notification-card" onclick="renderTicket(${Number(ticket.id)}); return false;">
              <div class="notification-open">
                <div class="notification-ticket">#${Number(ticket.id)} · ${esc(ticket.title || "Bez tytułu")}</div>
                <div>
                  <span class="pill ${priorityClass(ticket.priority)}">${esc(ticket.priority || "-")}</span>
                  <span class="pill ${statusClass(ticket.status)}">${esc(ticket.status || "-")}</span>
                  <span class="sla-badge ${slaClass(ticket.sla_state)}">${slaLabel(ticket.sla_state)}</span>
                </div>
                <div class="notification-meta">
                  ${esc(ticket.requester_name || "-")} · ${esc(ticket.category || "-")} / ${esc(ticket.subcategory || "Inne")} · Operator: ${esc(assigned)}
                </div>
                ${operatorCenterSignals(ticket)}
              </div>
            </button>
          `;
        }
        function operatorCenterTicketSection(title, items, emptyText, actionHtml = "", tone = "") {
          const rows = (items || []).map(operatorCenterTicketCard).join("");
          const count = (items || []).length;
          const toneClass = tone ? ` ${tone}` : "";
          return `
            <section class="operator-work-card${toneClass}">
              <div class="ticket-section-title">
                <div>
                  <h3>${esc(title)}</h3>
                  <div class="attachment-upload-hint">${esc(emptyText)}</div>
                </div>
                <span class="counter">${Number(count || 0)}</span>
                ${actionHtml}
              </div>
              <div class="notification-list" style="margin-top:12px">
                ${rows || `<p class="muted">${esc(emptyText)}</p>`}
              </div>
            </section>
          `;
        }
        function operatorCenterIncidentList(items) {
          const rows = (items || []).map(item => `
            <button class="notification-card" onclick="renderIncident(${Number(item.id)}); return false;">
              <div class="notification-open">
                <div class="notification-ticket">${esc(item.severity || "SEV")} #${Number(item.id)} · ${esc(item.title || "Incydent")}</div>
                <div class="notification-meta">Status: ${esc(item.status || "-")} · zgłoszeń: ${Number(item.ticket_count || 0)} · aktualizacja: ${esc(item.updated_at || "")}</div>
              </div>
            </button>
          `).join("");
          return `
            <section class="card">
              <div class="ticket-section-title">
                <div>
                  <strong>Aktywne incydenty</strong>
                  <div class="attachment-upload-hint">Większe problemy, które mogą generować wiele zgłoszeń.</div>
                </div>
                <button class="btn-secondary btn-small" onclick="renderIncidents()">Otwórz incydenty</button>
              </div>
              <div class="notification-list" style="margin-top:12px">
