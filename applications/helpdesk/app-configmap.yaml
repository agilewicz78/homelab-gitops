    @app.post("/api/admin/workflows/<int:workflow_id>/automations/test")
    @api_login_required
    
    # Symuluje regułę workflow bez zapisu zmian w bazie.
    def api_admin_test_workflow_automation(user, workflow_id):
        """Testuje regułę workflow na przykładowych danych bez modyfikowania zgłoszenia."""
        if not is_admin(user):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        rule_payload = payload.get("rule") or {}
        sample = payload.get("sample") or {}
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT workflow_key, name, category, subcategory FROM workflow_definitions WHERE id = %s", (workflow_id,))
        workflow_row = cur.fetchone()
        if not workflow_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        steps = workflow_steps_for_id(cur, workflow_id)
        item, error = normalize_single_workflow_automation_payload(
            rule_payload,
            steps,
            workflow_category=workflow_row[2],
            workflow_subcategory=workflow_row[3],
        )
        cur.close()
        conn.close()
        if error:
            return jsonify({"error": error}), 400
    
        def sample_default_status(condition_value, fallback=""):
            """Zwraca przykładowy status do symulatora bez używania wildcarda jako realnego statusu."""
            value = clean(condition_value)
            if value in ("", "*", "any"):
                return fallback
            return value

        first_step = steps[0] if steps else "Nowe"
        actor_role = clean(sample.get("actor_role")) or item.get("condition_role") or "*"
        current_status = clean(sample.get("current_status")) or sample_default_status(item.get("condition_status"), first_step)
        event_new_status = clean(sample.get("event_new_status")) or sample_default_status(item.get("condition_to_status"), "")
        event_type = clean(sample.get("event_type")) or item.get("event_type") or "comment_added"
        visibility = clean(sample.get("comment_visibility")) or item.get("condition_comment_visibility") or "*"
        assigned_state = clean(sample.get("assigned_state")) or item.get("assigned_state") or "*"
        sample_priority = clean(sample.get("priority")) or item.get("condition_priority") or "*"
        sample_category = clean(sample.get("category")) or (workflow_row[2] if workflow_row[2] != "*" else item.get("condition_category")) or "*"
        sample_subcategory = clean(sample.get("subcategory")) or (workflow_row[3] if workflow_row[3] != "*" else item.get("condition_subcategory")) or "*"
        sample_sla_state = clean(sample.get("sla_state")) or item.get("condition_sla_state") or "*"
        operator_added_comment = bool(sample.get("operator_added_comment"))
        operator_added_attachment = bool(sample.get("operator_added_attachment"))
    
        def test_value_matches_condition(condition_value, sample_value, operator="eq"):
            condition_value = clean(condition_value)
            sample_value = clean(sample_value)
            if condition_value == "staff" and normalize_workflow_condition_operator(operator) == "eq":
                return sample_value in ("staff", "operator", "admin")
            if sample_value == "staff" and normalize_workflow_condition_operator(operator) == "eq":
                return condition_value in ("staff", "operator", "admin")
            return workflow_condition_matches_value(condition_value, sample_value, operator)
    
        event_aliases = [event_type]
        if event_type == "comment_added":
            event_aliases.extend(["user_comment_added", "staff_comment_added"])
        event_matches = item.get("event_type") in event_aliases or test_value_matches_condition(item.get("event_type"), event_type)
    
        matched = True
        reasons = []
        if not item.get("is_active"):
            matched = False
            reasons.append("Reguła jest nieaktywna.")
        if not event_matches:
            matched = False
            reasons.append(f"Zdarzenie nie pasuje: reguła oczekuje „{item.get('event_type')}”, a test ma „{event_type}”.")
        if not test_value_matches_condition(item.get("condition_status"), current_status, item.get("condition_status_operator")):
            matched = False
            reasons.append(f"Status bieżący nie pasuje: wymagany „{item.get('condition_status')}”, w teście „{current_status or '—'}”.")
        if not test_value_matches_condition(item.get("condition_to_status"), event_new_status, item.get("condition_to_status_operator")):
            matched = False
            reasons.append(f"Status docelowy nie pasuje: wymagany „{item.get('condition_to_status')}”, w teście „{event_new_status or '—'}”.")
        if not test_value_matches_condition(item.get("condition_role"), actor_role, item.get("condition_role_operator")):
            matched = False
            reasons.append(f"Rola nie pasuje: wymagana „{item.get('condition_role')}”, w teście „{actor_role}”.")
        if not test_value_matches_condition(item.get("condition_comment_visibility"), visibility, item.get("condition_comment_visibility_operator")):
            matched = False
            reasons.append(f"Typ komentarza nie pasuje: wymagany „{item.get('condition_comment_visibility')}”, w teście „{visibility}”.")
        if not test_value_matches_condition(item.get("assigned_state"), assigned_state, item.get("assigned_state_operator")):
            matched = False
            reasons.append(f"Przypisanie nie pasuje: wymagane „{item.get('assigned_state')}”, w teście „{assigned_state}”.")
        if not test_value_matches_condition(item.get("condition_priority"), sample_priority, item.get("condition_priority_operator")):
            matched = False
            reasons.append(f"Priorytet nie pasuje: wymagany „{item.get('condition_priority')}”, w teście „{sample_priority}”.")
        if not test_value_matches_condition(item.get("condition_category"), sample_category, item.get("condition_category_operator")):
            matched = False
            reasons.append(f"Kategoria nie pasuje: wymagana „{item.get('condition_category')}”, w teście „{sample_category}”.")
        if not test_value_matches_condition(item.get("condition_subcategory"), sample_subcategory, item.get("condition_subcategory_operator")):
            matched = False
            reasons.append(f"Podkategoria nie pasuje: wymagana „{item.get('condition_subcategory')}”, w teście „{sample_subcategory}”.")
        if not test_value_matches_condition(item.get("condition_sla_state"), sample_sla_state, item.get("condition_sla_state_operator")):
            matched = False
            reasons.append(f"SLA nie pasuje: wymagane „{item.get('condition_sla_state')}”, w teście „{sample_sla_state}”.")
    
        if matched and not reasons:
            reasons.append("Reguła zostanie wykonana dla podanych danych testowych.")
        elif not reasons:
            reasons.append("Reguła nie zostanie wykonana dla podanych danych testowych.")
    
        normalized_actions = sorted(item.get("actions") or [], key=lambda a: int(a.get("action_order") or 1))
        missing_requirements = []
        if matched:
            if any(a.get("is_active") is not False and a.get("action_type") == "require_comment" for a in normalized_actions) and not operator_added_comment:
                missing_requirements.append("comment")
            if any(a.get("is_active") is not False and a.get("action_type") == "require_attachment" for a in normalized_actions) and not operator_added_attachment:
                missing_requirements.append("attachment")
        blocked_by_validation = bool(missing_requirements)
    
        actions_preview = []
        effective_status = event_new_status or current_status
        available_statuses = steps or []
        for action in normalized_actions:
            action_type = action.get("action_type") or "change_status"
            value = action.get("action_value") or ""
            preview = {
                "action_type": action_type,
                "action_value": value,
                "would_execute": bool(matched and action.get("is_active") is not False and not blocked_by_validation),
                "would_block_operation": False,
                "result": "nie zostanie wykonana, bo reguła nie pasuje" if not matched else "wykona się",
            }
            if action.get("is_active") is False:
                preview["would_execute"] = False
                preview["result"] = "pominięta — akcja nieaktywna"
            elif action_type == "require_comment":
                if not matched:
                    preview["result"] = "nie zostanie sprawdzona, bo reguła nie pasuje"
                elif operator_added_comment:
                    preview["would_execute"] = True
                    preview["result"] = "spełniona — operator dodał nowy komentarz w obecnym statusie"
                else:
                    preview["would_execute"] = False
                    preview["would_block_operation"] = True
                    preview["result"] = "zablokowałaby operację — operator nie dodał nowego komentarza w obecnym statusie"
            elif action_type == "require_attachment":
                if not matched:
                    preview["result"] = "nie zostanie sprawdzona, bo reguła nie pasuje"
                elif operator_added_attachment:
                    preview["would_execute"] = True
                    preview["result"] = "spełniona — operator dodał nowy załącznik w obecnym statusie"
                else:
                    preview["would_execute"] = False
                    preview["would_block_operation"] = True
                    preview["result"] = "zablokowałaby operację — operator nie dodał nowego załącznika w obecnym statusie"
            elif blocked_by_validation:
                preview["would_execute"] = False
                preview["result"] = "nie wykona się, bo wcześniejsza walidacja blokuje operację"
            elif action_type == "change_status":
                if not value:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — brak statusu docelowego"
                elif available_statuses and value not in available_statuses:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — status nie istnieje w workflow"
                elif value == effective_status:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — status już ma tę wartość"
                elif matched:
                    preview["result"] = f"zmieniłaby status z „{effective_status}” na „{value}”"
                    effective_status = value
            elif action_type == "change_priority" and matched:
                if value not in PRIORITIES:
                    preview["would_execute"] = False
                    preview["result"] = "pominięta — nieprawidłowy priorytet docelowy"
                else:
                    preview["result"] = f"zmieniłaby priorytet zgłoszenia na „{value}”"
            elif action_type == "add_workflow_watchers" and matched:
                preview["result"] = "dodałaby operatorów przypisanych do workflow jako obserwatorów zgłoszenia"
            elif action_type == "add_system_comment" and matched:
                preview["result"] = f"dodałaby komentarz systemowy: „{value or 'Reguła workflow została wykonana.'}”"
            elif action_type == "notify" and matched:
                preview["result"] = "wysłałaby powiadomienie do uczestników zgłoszenia"
            elif action_type == "add_history" and matched:
                preview["result"] = "dodałaby wpis do historii zgłoszenia"
            actions_preview.append(preview)
    
        return jsonify({
            "matched": matched,
            "reasons": reasons,
            "actions_preview": actions_preview,
            "sample": {
                "event_type": event_type,
                "current_status": current_status,
                "event_new_status": event_new_status,
                "actor_role": actor_role,
                "comment_visibility": visibility,
                "assigned_state": assigned_state,
                "priority": sample_priority,
                "category": sample_category,
                "subcategory": sample_subcategory,
                "sla_state": sample_sla_state,
                "operator_added_comment": operator_added_comment,
                "operator_added_attachment": operator_added_attachment,
            },
            "missing_requirements": missing_requirements,
            "blocked_by_validation": blocked_by_validation,
            "final_status": effective_status,
            "rule": item,
        })
    
