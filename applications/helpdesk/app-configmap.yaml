          }};
          resultBox.innerHTML = `<p class="muted">Testuję regułę...</p>`;
          const res = await api(`/api/admin/workflows/${{workflowId}}/automations/test`, {{
            method: "POST",
            body: JSON.stringify({{ rule, sample }}),
          }});
          const data = res ? await res.json().catch(() => ({{}})) : {{}};
          if (!res || !res.ok) {{
            resultBox.innerHTML = `<p class="error">${{esc(data.error || "Nie udało się przetestować reguły.")}}</p>`;
            return;
          }}
          const statusClass = data.matched ? "success" : "error";
          const statusText = data.matched ? "Reguła zostanie wykonana." : "Reguła nie zostanie wykonana.";
          const reasons = (data.reasons || []).map(r => `<li>${{esc(r)}}</li>`).join("");
          const actions = (data.actions_preview || []).map(a => `
            <li>
              <strong>${{esc(workflowAutomationActionSummary({{ action_type: a.action_type, action_value: a.action_value }}))}}</strong><br>
              <span class="muted">${{esc(a.result || "")}}</span>
            </li>
          `).join("");
          const missing = (data.missing_requirements || []).map(x => x === "comment" ? "komentarz" : x === "attachment" ? "załącznik" : x).join(", ");
          resultBox.innerHTML = `
