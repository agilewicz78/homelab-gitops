    @app.delete("/api/admin/workflows/<int:workflow_id>/automations/<int:automation_id>")
    @api_login_required
    def api_admin_delete_workflow_automation(user, workflow_id, automation_id):
        if not can_manage_workflow_backend(user):
            return api_forbidden("Brak uprawnienia do zarządzania workflow.", "workflow.manage")
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT workflow_key, name FROM workflow_definitions WHERE id = %s", (workflow_id,))
        workflow_row = cur.fetchone()
        if not workflow_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        cur.execute("SELECT name FROM workflow_automations WHERE id = %s AND workflow_id = %s", (automation_id, workflow_id))
        automation_row = cur.fetchone()
        if not automation_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        existing_automation = next(
            (entry for entry in workflow_automation_entries(cur, workflow_id) if entry.get("id") == automation_id),
            None,
        )
        cur.execute("DELETE FROM workflow_automations WHERE id = %s AND workflow_id = %s", (automation_id, workflow_id))
        log_audit(cur, user, "workflow_automation_deleted", "workflow", workflow_id, {
            "workflow_key": workflow_row[0],
            "workflow_name": workflow_row[1],
            "automation_id": automation_id,
            "automation_name": automation_row[0],
            "before": workflow_automation_audit_snapshot(existing_automation),
        })
        conn.commit()
        automations = workflow_automation_entries(cur, workflow_id)
        cur.close()
        conn.close()
        return jsonify({"status": "ok", "automations": automations})
