    def workflow_operator_entries(cur, workflow_id):
        cur.execute("""
            SELECT
                wo.user_email,
                COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), wo.user_email) AS name
            FROM workflow_operators wo
            LEFT JOIN users u ON lower(u.email) = lower(wo.user_email)
            WHERE wo.workflow_id = %s
            ORDER BY lower(COALESCE(NULLIF(trim(COALESCE(u.first_name,'') || ' ' || COALESCE(u.last_name,'')), ''), wo.user_email)), lower(wo.user_email)
        """, (workflow_id,))
