              ${{attachmentList}}
              <form id="attachmentForm" enctype="multipart/form-data">
                <label>Dodaj załącznik</label>
                <input type="file" name="file" required>
                <div class="attachment-upload-hint">Dozwolone: png, jpg, jpeg, gif, pdf, txt, log, csv, xlsx, docx. Maksymalnie 10 MB.</div>
                <button type="submit">Dodaj załącznik</button>
