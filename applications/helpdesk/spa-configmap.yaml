        function serviceCatalogMetrics(services = []) {
          const active = services.filter(service => service.is_active !== false);
          const unstable = active.filter(service => ["degraded", "outage", "maintenance"].includes(service.status));
          const openTickets = active.reduce((sum, service) => sum + Number(service.open_ticket_count || 0), 0);
          const activeIncidents = active.reduce((sum, service) => sum + Number(service.active_incident_count || 0), 0);
          return `
            <div class="stats">
              <div class="stat"><div class="num">${active.length}</div><div class="label">Aktywne usługi</div></div>
              <div class="stat"><div class="num">${unstable.length}</div><div class="label">Usługi z komunikatem</div></div>
              <div class="stat"><div class="num">${openTickets}</div><div class="label">Otwarte zgłoszenia usług</div></div>
              <div class="stat"><div class="num">${activeIncidents}</div><div class="label">Aktywne incydenty usług</div></div>
            </div>
          `;
        }
    
        function serviceContextMetric(label, value, hint) {
          return `
            <div class="dashboard-card">
              <div class="num">${Number(value || 0)}</div>
              <div class="label">${esc(label)}</div>
              <div class="muted">${esc(hint || "")}</div>
