          if (!workflowId) {{
            resultBox.innerHTML = `<p class="error">Najpierw zapisz workflow, dopiero potem można testować reguły zapisane w bazie.</p>`;
            return;
          }}
          const rule = workflowAutomationRuleFromForm(form);
          const sample = {{
            event_type: form.test_event_type.value || rule.event_type,
            current_status: form.test_current_status.value || rule.condition_status,
            event_new_status: form.test_event_new_status.value || rule.condition_to_status,
            actor_role: form.test_actor_role.value || "*",
            comment_visibility: form.test_comment_visibility.value || "*",
