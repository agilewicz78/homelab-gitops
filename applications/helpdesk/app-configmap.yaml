        async function saveSlaPolicies() {{
          const grouped = {{}};
          document.querySelectorAll(".sla-policy-input").forEach(input => {{
            const priority = input.dataset.priority;
            const field = input.dataset.field;
            if (!grouped[priority]) grouped[priority] = {{ priority }};
            grouped[priority][field] = Number(input.value || 0);
          }});
          const res = await api("/api/admin/sla-policies", {{ method: "POST", body: JSON.stringify({{ policies: Object.values(grouped) }}) }});
          const data = res ? await res.json().catch(() => ({{}})) : {{}};
          if (!res || !res.ok) {{
            alert(data.error || "Nie udało się zapisać polityk SLA.");
            return;
          }}
          showToast("Zapisano polityki SLA");
          await renderSlaCalendar();
        }}
