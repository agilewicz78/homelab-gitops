        function detectWorkView(me, filters, assignedFilter, priorityFilter, slaFilter, searchQuery) {{
          if (!canWorkTickets(me)) return "";
          const statusKey = (filters || []).join("|");
          const noPriority = priorityFilter === "all";
          const noSearch = !searchQuery;
          if (assignedFilter === "me" && !statusKey && noPriority && slaFilter === "all" && noSearch) return "queue";
          if (assignedFilter === "unassigned" && !statusKey && noPriority && slaFilter === "all" && noSearch) return "unassigned";
          if (assignedFilter === "all" && statusKey === "Nowe" && noPriority && slaFilter === "all" && noSearch) return "new";
          if (assignedFilter === "all" && !statusKey && noPriority && slaFilter === "overdue" && noSearch) return "overdue";
          if (assignedFilter === "all" && statusKey === "Oczekuje na użytkownika" && noPriority && slaFilter === "all" && noSearch) return "waiting_user";
          if (assignedFilter === "all" && !statusKey && noPriority && slaFilter === "all" && noSearch) return "all";
          return "";
        }}
