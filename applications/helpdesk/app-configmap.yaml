    def workflow_comment_event_type(user):
        return "staff_comment_added" if is_staff(user) else "user_comment_added"
    def workflow_actor_role(user):
        if is_admin(user):
            return "admin"
        if is_operator(user):
            return "operator"
        return "user"
    WORKFLOW_CONDITION_OPERATORS = {"eq", "neq", "contains", "not_contains", "empty", "not_empty"}
    WORKFLOW_CONDITION_OPERATOR_LABELS = {
        "eq": "równa się",
        "neq": "nie równa się",
        "contains": "zawiera",
        "not_contains": "nie zawiera",
        "empty": "jest puste",
        "not_empty": "nie jest puste",
    }
    def normalize_workflow_condition_operator(value):
        value = clean(value) or "eq"
        aliases = {
            "equals": "eq",
            "not_equals": "neq",
            "ne": "neq",
            "is_empty": "empty",
            "is_not_empty": "not_empty",
        }
        value = aliases.get(value, value)
        return value if value in WORKFLOW_CONDITION_OPERATORS else "eq"
    def workflow_condition_operator_label(operator):
        return WORKFLOW_CONDITION_OPERATOR_LABELS.get(normalize_workflow_condition_operator(operator), "równa się")
    
    # Porównuje wartość warunku workflow z użyciem operatora warunku.
    def workflow_condition_matches_value(condition_value, actual_value, operator="eq", wildcard_values=("", "*", "any")):
        """
        Porównuje warunek workflow z wartością rzeczywistą.

        Ważne: w konfiguracji workflow wartości:
        - pusty string "",
        - None zapisany w bazie,
        - "*",
        - "any"

        oznaczają "dowolna wartość". Dzięki temu formularz workflow,
        API zapisu reguły, symulator reguł i właściwy silnik workflow
        interpretują warunki w ten sam sposób.
        """
        operator = normalize_workflow_condition_operator(operator)
        condition_value = clean(condition_value)
        actual_value = clean(actual_value)
        if operator == "empty":
            return actual_value == ""
        if operator == "not_empty":
            return actual_value != ""
        if condition_value in wildcard_values:
            return True
        if operator == "eq":
            return condition_value == actual_value
        if operator == "neq":
            return condition_value != actual_value
        if operator == "contains":
            return condition_value.lower() in actual_value.lower()
        if operator == "not_contains":
            return condition_value.lower() not in actual_value.lower()
        return condition_value == actual_value
    
    # Sprawdza, czy reguła workflow pasuje do danego zdarzenia i kontekstu.
    def workflow_automation_match_result(item, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None, ticket_context=None):
        condition_status = item.get("condition_status")
        condition_status_operator = item.get("condition_status_operator") or "eq"
        if condition_status or normalize_workflow_condition_operator(condition_status_operator) in ("empty", "not_empty"):
            if not workflow_condition_matches_value(condition_status, current_status, condition_status_operator):
                return False, f"status źródłowy nie pasuje: warunek '{workflow_condition_operator_label(condition_status_operator)} {condition_status or ''}', otrzymano '{current_status or ''}'"
    
        condition_to_status = item.get("condition_to_status")
        condition_to_status_operator = item.get("condition_to_status_operator") or "eq"
        if condition_to_status or normalize_workflow_condition_operator(condition_to_status_operator) in ("empty", "not_empty"):
            if not workflow_condition_matches_value(condition_to_status, event_new_status or "", condition_to_status_operator):
                return False, f"status docelowy nie pasuje: warunek '{workflow_condition_operator_label(condition_to_status_operator)} {condition_to_status or ''}', otrzymano '{event_new_status or ''}'"
    
        condition_role = item.get("condition_role")
        actor_role = workflow_actor_role(user)
        condition_role_operator = item.get("condition_role_operator") or "eq"
        if condition_role and condition_role not in ("*", ""):
            allowed_roles = []
            if condition_role == "staff":
                allowed_roles = ["staff", "operator", "admin"]
            elif condition_role == "user":
                allowed_roles = ["user"]
            elif condition_role == "operator":
                allowed_roles = ["operator"]
            elif condition_role == "admin":
                allowed_roles = ["admin"]
            if condition_role_operator == "neq":
                if actor_role in allowed_roles:
                    return False, f"rola wykonawcy nie pasuje: warunek 'nie równa się {condition_role}', otrzymano {actor_role}"
            elif not workflow_condition_matches_value(condition_role, actor_role, condition_role_operator):
                if condition_role == "staff" and is_staff(user):
                    pass
                else:
                    return False, f"rola wykonawcy nie pasuje: warunek '{workflow_condition_operator_label(condition_role_operator)} {condition_role}', otrzymano {actor_role}"
    
        condition_visibility = item.get("condition_comment_visibility")
        condition_visibility_operator = item.get("condition_comment_visibility_operator") or "eq"
        if condition_visibility and condition_visibility not in ("*", ""):
            if not workflow_condition_matches_value(condition_visibility, visibility or "", condition_visibility_operator):
                return False, f"typ komentarza nie pasuje: warunek '{workflow_condition_operator_label(condition_visibility_operator)} {condition_visibility}', otrzymano '{visibility or ''}'"
    
        assigned_state = item.get("assigned_state") or "*"
        assigned_state_operator = item.get("assigned_state_operator") or "eq"
        has_assignee = bool(assigned_to_email)
        actual_assigned_state = "assigned" if has_assignee else "unassigned"
        if assigned_state and assigned_state not in ("*", "any", ""):
            if not workflow_condition_matches_value(assigned_state, actual_assigned_state, assigned_state_operator):
                return False, f"przypisanie zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(assigned_state_operator)} {assigned_state}', otrzymano '{actual_assigned_state}'"
    
        ticket_context = ticket_context or {}
        condition_priority = item.get("condition_priority") or "*"
        condition_priority_operator = item.get("condition_priority_operator") or "eq"
        if condition_priority and condition_priority not in ("*", "any", ""):
            ticket_priority = ticket_context.get("priority") or ""
            if not workflow_condition_matches_value(condition_priority, ticket_priority, condition_priority_operator):
                return False, f"priorytet zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_priority_operator)} {condition_priority}', otrzymano '{ticket_priority or ''}'"
    
        condition_category = item.get("condition_category") or "*"
        condition_category_operator = item.get("condition_category_operator") or "eq"
        if condition_category and condition_category not in ("*", "any", ""):
            ticket_category = ticket_context.get("category") or ""
            if not workflow_condition_matches_value(condition_category, ticket_category, condition_category_operator):
                return False, f"kategoria zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_category_operator)} {condition_category}', otrzymano '{ticket_category or ''}'"
    
        condition_subcategory = item.get("condition_subcategory") or "*"
        condition_subcategory_operator = item.get("condition_subcategory_operator") or "eq"
        if condition_subcategory and condition_subcategory not in ("*", "any", ""):
            ticket_subcategory = ticket_context.get("subcategory") or ""
            if not workflow_condition_matches_value(condition_subcategory, ticket_subcategory, condition_subcategory_operator):
                return False, f"podkategoria zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_subcategory_operator)} {condition_subcategory}', otrzymano '{ticket_subcategory or ''}'"
    
        condition_sla_state = item.get("condition_sla_state") or "*"
        condition_sla_state_operator = item.get("condition_sla_state_operator") or "eq"
        if condition_sla_state and condition_sla_state not in ("*", "any", ""):
            ticket_sla_state = ticket_context.get("sla_state") or ""
            if not workflow_condition_matches_value(condition_sla_state, ticket_sla_state, condition_sla_state_operator):
                return False, f"SLA zgłoszenia nie pasuje: warunek '{workflow_condition_operator_label(condition_sla_state_operator)} {condition_sla_state}', otrzymano '{ticket_sla_state or ''}'"
        return True, "reguła spełnia warunki"
    def workflow_automation_matches(item, current_status, user, visibility=None, assigned_to_email=None, event_new_status=None, ticket_context=None):
        matched, _reason = workflow_automation_match_result(item, current_status, user, visibility, assigned_to_email, event_new_status, ticket_context=ticket_context)
        return matched
