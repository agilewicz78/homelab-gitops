    @app.post("/api/tickets/<int:ticket_id>/close")
    @api_login_required
    def api_close_ticket(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        def parse_int(value, default=0):
            try:
                return int(value)
            except Exception:
                return default
        hours = max(0, parse_int(request.form.get("resolution_hours"), 0))
        minutes = max(0, min(59, parse_int(request.form.get("resolution_minutes"), 0)))
        total_minutes = hours * 60 + minutes
        resolution_summary = clean(request.form.get("resolution_summary"))
        visibility = clean(request.form.get("visibility")) or "public"
        if visibility not in ("public", "internal"):
            visibility = "public"
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT status FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        old_status = row[0]
        if old_status == "Zamknięte":
            cur.close()
            conn.close()
            return jsonify({"error": "Zgłoszenie jest już zamknięte i dostępne tylko do odczytu."}), 400
        uploaded_file = request.files.get("file")
        attachment_id = None
        original_filename = None
        if uploaded_file and uploaded_file.filename:
            original_filename = uploaded_file.filename or ""
            safe_filename = secure_filename(original_filename)
            if not safe_filename:
                cur.close()
                conn.close()
                return jsonify({"error": "Nieprawidłowa nazwa pliku."}), 400
            if not allowed_attachment(safe_filename):
                cur.close()
                conn.close()
                return jsonify({"error": "Niedozwolony typ pliku."}), 400
            file_bytes = uploaded_file.read()
            size_bytes = len(file_bytes)
            if size_bytes <= 0:
                cur.close()
                conn.close()
                return jsonify({"error": "Pusty plik."}), 400
            if size_bytes > MAX_ATTACHMENT_SIZE:
                cur.close()
                conn.close()
                return jsonify({"error": "Plik jest za duży. Maksymalny rozmiar to 10 MB."}), 400
            ticket_dir = os.path.join(ATTACHMENTS_DIR, str(ticket_id))
            os.makedirs(ticket_dir, exist_ok=True)
            stored_basename = f"{uuid.uuid4().hex}_{safe_filename}"
            stored_filename = f"{ticket_id}/{stored_basename}"
            target_path = attachment_path(stored_filename)
            with open(target_path, "wb") as f:
                f.write(file_bytes)
            cur.execute("""
                INSERT INTO attachments (
                    ticket_id,
                    original_filename,
                    stored_filename,
                    content_type,
                    size_bytes,
                    uploaded_by_email,
                    uploaded_by_name
                )
                VALUES (%s, %s, %s, %s, %s, %s, %s)
                RETURNING id
            """, (
                ticket_id,
                original_filename,
                stored_filename,
                uploaded_file.content_type,
                size_bytes,
                user["email"],
                user["name"],
            ))
            attachment_id = cur.fetchone()[0]
        cur.execute("""
            UPDATE tickets
            SET status = 'Zamknięte',
                updated_at = NOW(),
                closed_at = NOW(),
                closed_by_email = %s,
                resolution_minutes = %s,
                resolution_summary = %s
            WHERE id = %s
        """, (user["email"], total_minutes if total_minutes > 0 else None, resolution_summary or None, ticket_id))
        time_text = ""
        if total_minutes > 0:
            h = total_minutes // 60
            m = total_minutes % 60
            if h and m:
                time_text = f" Czas rozwiązania: {h}h {m}m."
            elif h:
                time_text = f" Czas rozwiązania: {h}h."
            else:
                time_text = f" Czas rozwiązania: {m}m."
        add_ticket_event(
            cur,
            ticket_id,
            user,
            "ticket_closed",
            f"Zgłoszenie zamknięte. Status zmieniony z {old_status} na Zamknięte.{time_text}"
        )
        if resolution_summary:
            cur.execute("""
                INSERT INTO comments (ticket_id, author, content, visibility)
                VALUES (%s, %s, %s, %s)
            """, (ticket_id, user["name"], resolution_summary, visibility))
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "internal_note_added" if visibility == "internal" else "comment_added",
                "Dodano notatkę końcową przy zamknięciu zgłoszenia." if visibility == "internal" else "Dodano komentarz końcowy przy zamknięciu zgłoszenia."
            )
        if attachment_id:
            add_ticket_event(cur, ticket_id, user, "attachment_added", f"Dodano załącznik przy zamknięciu: {original_filename}")
        log_audit(cur, user, "ticket_closed", "ticket", ticket_id, {
            "old_status": old_status,
            "resolution_minutes": total_minutes if total_minutes > 0 else None,
            "comment_visibility": visibility if resolution_summary else None,
            "attachment_id": attachment_id,
            "attachment_filename": original_filename,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "status_changed",
            f"Zgłoszenie #{ticket_id} zostało zamknięte.",
            actor_email=user["email"],
        )
        if resolution_summary and visibility == "internal":
            create_ticket_notifications(
                cur,
                ticket_id,
                "internal_note_added",
                f"Dodano notatkę wewnętrzną przy zamknięciu zgłoszenia #{ticket_id}.",
                actor_email=user["email"],
                staff_only=True,
            )
        elif resolution_summary:
            create_ticket_notifications(
                cur,
                ticket_id,
                "comment_added",
                f"Dodano komentarz końcowy przy zamknięciu zgłoszenia #{ticket_id}.",
                actor_email=user["email"],
            )
        if attachment_id:
            create_ticket_notifications(
                cur,
                ticket_id,
                "attachment_added",
                f"Dodano załącznik przy zamknięciu zgłoszenia #{ticket_id}: {original_filename}.",
                actor_email=user["email"],
            )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} zamknął zgłoszenie #{ticket_id}", "status_changed", ticket_id)
        return jsonify({"status": "ok", "ticket_status": "Zamknięte", "attachment_id": attachment_id})
    @app.post("/api/tickets/<int:ticket_id>/reopen")
    @api_login_required
    def api_reopen_ticket(user, ticket_id):
        if not is_admin(user):
            return jsonify({"error": "admin required"}), 403
        payload = request.get_json(silent=True) or {}
        reason = clean(payload.get("reason"))
        if not reason:
            return jsonify({"error": "Powód ponownego otwarcia jest wymagany."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT status FROM tickets WHERE id = %s", (ticket_id,))
