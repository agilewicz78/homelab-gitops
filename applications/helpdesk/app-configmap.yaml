                "event_new_status": execution[8],
                "created_at": str(execution[9]),
            })
        conn2 = get_conn()
        cur2 = conn2.cursor()
        cur2.execute("""
            SELECT first_name, last_name, email, role, roles
            FROM users
            WHERE 'operator' = ANY(roles)
            ORDER BY last_name, first_name
        """)
        operators = [
            {"name": f"{r[0]} {r[1]}".strip(), "email": r[2], "role": role_label(list(r[4] or ["user"])), "roles": list(r[4] or ["user"])}
            for r in cur2.fetchall()
        ]
        cur2.close()
        conn2.close()
        return jsonify({
            "ticket": ticket,
            "comments": comments,
            "events": events,
            "status_history": status_history,
            "attachments": attachments,
            "watchers": watchers,
            "linked_tickets": linked_tickets,
            "incidents": incidents,
            "suggestions": suggestions,
            "knowledge_article": knowledge_article,
            "automation_executions": automation_executions,
            "meta": {
                "statuses": workflow_statuses(ticket.get("workflow_key")),
                "operators": operators,
                "watcher_candidates": watcher_candidates,
                "incident_severities": INCIDENT_SEVERITIES,
                "categories": CATEGORIES,
                "subcategories": SUBCATEGORIES,
            },
        })
    @app.post("/api/tickets/<int:ticket_id>/resolution-feedback")
    @api_login_required

    # Decyzja użytkownika po statusie Rozwiązane: potwierdza zamknięcie albo odsyła sprawę do operatora.
    def api_ticket_resolution_feedback(user, ticket_id):
        if is_staff(user):
            return jsonify({"error": "Ocena rozwiązania jest akcją użytkownika zgłaszającego."}), 403
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        decision = clean(payload.get("decision")).lower()
        comment = clean(payload.get("comment"))
        if decision not in ("accepted", "rejected"):
            return jsonify({"error": "Nieprawidłowa decyzja. Użyj accepted albo rejected."}), 400
        if decision == "rejected" and len(comment) < 5:
            return jsonify({"error": "Przy odrzuceniu rozwiązania opisz krótko, co nadal nie działa."}), 400

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT status, COALESCE(workflow_key, 'default'), title, COALESCE(resolution_summary, '')
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        old_status, workflow_key, title, resolution_summary = row
        if old_status != "Rozwiązane":
            cur.close()
            conn.close()
            return jsonify({"error": "Ocenę rozwiązania można zapisać tylko dla zgłoszenia w statusie Rozwiązane."}), 400

        reopened_incident_ids = []
        reopened_incident_ticket_ids = []
        if decision == "accepted":
            target_status = "Zamknięte"
            feedback_comment = comment or "Użytkownik potwierdził, że problem został rozwiązany."
            cur.execute("""
                UPDATE tickets
                SET status = 'Zamknięte',
                    updated_at = NOW(),
                    closed_at = NOW(),
                    closed_by_email = %s,
                    resolution_summary = COALESCE(NULLIF(resolution_summary, ''), %s),
                    resolution_feedback_decision = %s,
                    resolution_feedback_comment = %s,
                    resolution_feedback_by_email = %s,
                    resolution_feedback_by_name = %s,
                    resolution_feedback_at = NOW()
                WHERE id = %s
            """, (
                user["email"],
                "Rozwiązanie potwierdzone przez użytkownika.",
                decision,
                feedback_comment,
                user["email"],
                user["name"],
                ticket_id,
            ))
            event_type = "resolution_feedback_accepted"
            event_text = f"Użytkownik potwierdził rozwiązanie zgłoszenia #{ticket_id}. Status zmieniono z Rozwiązane na Zamknięte."
            notification_text = f"Użytkownik potwierdził rozwiązanie zgłoszenia #{ticket_id}: {title}."
        else:
            target_status = resolution_feedback_reopen_status_for_workflow(workflow_key)
            feedback_comment = comment
            cur.execute("""
                UPDATE tickets
                SET status = %s,
                    updated_at = NOW(),
                    closed_at = NULL,
                    closed_by_email = NULL,
                    resolution_feedback_decision = %s,
                    resolution_feedback_comment = %s,
                    resolution_feedback_by_email = %s,
                    resolution_feedback_by_name = %s,
                    resolution_feedback_at = NOW()
                WHERE id = %s
            """, (
                target_status,
                decision,
                feedback_comment,
                user["email"],
                user["name"],
                ticket_id,
            ))
            event_type = "resolution_feedback_rejected"
            event_text = f"Użytkownik odrzucił rozwiązanie zgłoszenia #{ticket_id}. Status zmieniono z Rozwiązane na {target_status}."
            notification_text = f"Użytkownik zgłosił, że rozwiązanie zgłoszenia #{ticket_id} nie działa: {title}."
            reopened_incident_ids, reopened_incident_ticket_ids = reopen_resolved_incidents_for_ticket(
                cur,
                ticket_id,
                title,
                user,
            )

        comment_prefix = "Potwierdzenie rozwiązania" if decision == "accepted" else "Rozwiązanie nie pomogło"
        cur.execute("""
            INSERT INTO comments (ticket_id, author, author_email, content, visibility)
            VALUES (%s, %s, %s, %s, 'public')
        """, (ticket_id, user["name"], user["email"], f"{comment_prefix}: {feedback_comment}"))
        add_ticket_status_history(
            cur,
            ticket_id,
            user,
            old_status,
            target_status,
            source="user_resolution_feedback",
        )
        add_ticket_event(cur, ticket_id, user, event_type, event_text)
        add_ticket_event(cur, ticket_id, user, "comment_added", "Dodano publiczny komentarz z oceną rozwiązania.")
        log_audit(cur, user, event_type, "ticket", ticket_id, {
            "decision": decision,
            "old_status": old_status,
            "new_status": target_status,
            "comment": feedback_comment,
            "reopened_incident_ids": reopened_incident_ids,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            event_type,
            notification_text,
            actor_email=user["email"],
        )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(event_text, event_type, ticket_id)
        if reopened_incident_ids:
            publish_event(
                f"Użytkownik odrzucił rozwiązanie zgłoszenia #{ticket_id}. Incydent wrócił do monitorowania.",
                "incident_updated",
                None,
                staff_only=False,
                ticket_ids=reopened_incident_ticket_ids or [ticket_id],
            )
        return jsonify({
            "status": "ok",
            "ticket_status": target_status,
            "decision": decision,
            "reopened_incident_ids": reopened_incident_ids,
        })

    @app.post("/api/tickets/<int:ticket_id>/close")
    @api_login_required
    def api_close_ticket(user, ticket_id):
        if not is_staff(user):
            return jsonify({"error": "forbidden"}), 403
        def parse_int(value, default=0):
            try:
                return int(value)
            except Exception:
                return default
        hours = max(0, parse_int(request.form.get("resolution_hours"), 0))
        minutes = max(0, min(59, parse_int(request.form.get("resolution_minutes"), 0)))
        total_minutes = hours * 60 + minutes
        resolution_summary = clean(request.form.get("resolution_summary"))
        visibility = clean(request.form.get("visibility")) or "public"
        if visibility not in ("public", "internal"):
            visibility = "public"
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT status FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        old_status = row[0]
        if old_status == "Zamknięte":
            cur.close()
            conn.close()
            return jsonify({"error": "Zgłoszenie jest już zamknięte i dostępne tylko do odczytu."}), 400
        uploaded_file = request.files.get("file")
        attachment_id = None
        original_filename = None
        if uploaded_file and uploaded_file.filename:
            original_filename = uploaded_file.filename or ""
            safe_filename = secure_filename(original_filename)
            if not safe_filename:
                cur.close()
                conn.close()
                return jsonify({"error": "Nieprawidłowa nazwa pliku."}), 400
            if not allowed_attachment(safe_filename):
                cur.close()
                conn.close()
                return jsonify({"error": "Niedozwolony typ pliku."}), 400
            file_bytes = uploaded_file.read()
            size_bytes = len(file_bytes)
            if size_bytes <= 0:
                cur.close()
                conn.close()
                return jsonify({"error": "Pusty plik."}), 400
            if size_bytes > MAX_ATTACHMENT_SIZE:
                cur.close()
                conn.close()
                return jsonify({"error": "Plik jest za duży. Maksymalny rozmiar to 10 MB."}), 400
            ticket_dir = os.path.join(ATTACHMENTS_DIR, str(ticket_id))
            os.makedirs(ticket_dir, exist_ok=True)
            stored_basename = f"{uuid.uuid4().hex}_{safe_filename}"
            stored_filename = f"{ticket_id}/{stored_basename}"
            target_path = attachment_path(stored_filename)
            with open(target_path, "wb") as f:
                f.write(file_bytes)
            cur.execute("""
                INSERT INTO attachments (
                    ticket_id,
                    original_filename,
                    stored_filename,
                    content_type,
                    size_bytes,
                    uploaded_by_email,
                    uploaded_by_name
                )
                VALUES (%s, %s, %s, %s, %s, %s, %s)
                RETURNING id
            """, (
                ticket_id,
                original_filename,
                stored_filename,
                uploaded_file.content_type,
                size_bytes,
                user["email"],
                user["name"],
            ))
            attachment_id = cur.fetchone()[0]
        cur.execute("""
            UPDATE tickets
            SET status = 'Zamknięte',
                updated_at = NOW(),
                closed_at = NOW(),
                closed_by_email = %s,
                resolution_minutes = %s,
                resolution_summary = %s
            WHERE id = %s
        """, (user["email"], total_minutes if total_minutes > 0 else None, resolution_summary or None, ticket_id))
        time_text = ""
        if total_minutes > 0:
            h = total_minutes // 60
            m = total_minutes % 60
            if h and m:
                time_text = f" Czas rozwiązania: {h}h {m}m."
            elif h:
                time_text = f" Czas rozwiązania: {h}h."
            else:
                time_text = f" Czas rozwiązania: {m}m."
        add_ticket_status_history(
            cur,
            ticket_id,
            user,
            old_status,
            "Zamknięte",
            source="close_ticket",
        )
        add_ticket_event(
            cur,
            ticket_id,
            user,
            "ticket_closed",
            f"Zgłoszenie zamknięte. Status zmieniony z {old_status} na Zamknięte.{time_text}"
        )
        if resolution_summary:
            cur.execute("""
                INSERT INTO comments (ticket_id, author, author_email, content, visibility)
                VALUES (%s, %s, %s, %s, %s)
            """, (ticket_id, user["name"], user["email"], resolution_summary, visibility))
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "internal_note_added" if visibility == "internal" else "comment_added",
                "Dodano notatkę końcową przy zamknięciu zgłoszenia." if visibility == "internal" else "Dodano komentarz końcowy przy zamknięciu zgłoszenia."
            )
        if attachment_id:
            add_ticket_event(cur, ticket_id, user, "attachment_added", f"Dodano załącznik przy zamknięciu: {original_filename}")
        log_audit(cur, user, "ticket_closed", "ticket", ticket_id, {
            "old_status": old_status,
            "resolution_minutes": total_minutes if total_minutes > 0 else None,
            "comment_visibility": visibility if resolution_summary else None,
            "attachment_id": attachment_id,
            "attachment_filename": original_filename,
        })
        create_ticket_notifications(
            cur,
            ticket_id,
            "status_changed",
            f"Zgłoszenie #{ticket_id} zostało zamknięte.",
            actor_email=user["email"],
        )
        if resolution_summary and visibility == "internal":
            create_ticket_notifications(
                cur,
                ticket_id,
                "internal_note_added",
                f"Dodano notatkę wewnętrzną przy zamknięciu zgłoszenia #{ticket_id}.",
                actor_email=user["email"],
                staff_only=True,
            )
        elif resolution_summary:
            create_ticket_notifications(
                cur,
                ticket_id,
                "comment_added",
                f"Dodano komentarz końcowy przy zamknięciu zgłoszenia #{ticket_id}.",
                actor_email=user["email"],
            )
        if attachment_id:
            create_ticket_notifications(
                cur,
                ticket_id,
                "attachment_added",
                f"Dodano załącznik przy zamknięciu zgłoszenia #{ticket_id}: {original_filename}.",
                actor_email=user["email"],
            )
        conn.commit()
        cur.close()
        conn.close()
        publish_event(f"{user['name']} zamknął zgłoszenie #{ticket_id}", "status_changed", ticket_id)
        return jsonify({"status": "ok", "ticket_status": "Zamknięte", "attachment_id": attachment_id})
