              u.roles,
              tw.created_at
            FROM ticket_watchers tw
            JOIN users u ON lower(u.email) = lower(tw.user_email)
            WHERE tw.ticket_id = %s
            ORDER BY lower(u.last_name), lower(u.first_name), lower(u.email)
        """, (ticket_id,))
        watcher_rows = cur.fetchall()
        watcher_candidate_rows = []
        if is_staff(user):
            cur.execute("""
                SELECT first_name, last_name, email, department, role, roles
                FROM users
                ORDER BY lower(last_name), lower(first_name), lower(email)
            """)
            watcher_candidate_rows = cur.fetchall()
        cur.execute("""
            SELECT
              l.id,
              l.linked_id,
              t.title,
              t.status,
              t.requester_name,
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
              l.relation_type,
              l.created_by_email,
              l.created_at
            FROM (
              SELECT
                id,
