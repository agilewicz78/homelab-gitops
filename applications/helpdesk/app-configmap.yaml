              (
                SELECT COUNT(*)
                FROM incident_tickets affected
                WHERE affected.incident_id = i.id
              ) AS affected_ticket_count
            FROM incident_tickets it
            JOIN incidents i ON i.id = it.incident_id
            LEFT JOIN LATERAL (
              SELECT iu.message, iu.created_at
              FROM incident_updates iu
              WHERE iu.incident_id = i.id
                AND COALESCE(iu.is_public, FALSE) = TRUE
              ORDER BY iu.id DESC
              LIMIT 1
            ) latest_public ON TRUE
            WHERE it.ticket_id = %s
            ORDER BY
              CASE i.status WHEN 'resolved' THEN 2 ELSE 1 END,
              CASE i.severity WHEN 'SEV1' THEN 1 WHEN 'SEV2' THEN 2 WHEN 'SEV3' THEN 3 ELSE 4 END,
              i.updated_at DESC
        """, (ticket_id,))
        incident_rows = cur.fetchall()
