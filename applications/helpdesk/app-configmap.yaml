    @app.post("/api/incidents/<int:incident_id>/tasks/<int:task_id>/toggle")
    @api_login_required
    @api_staff_required
    def api_toggle_incident_task(user, incident_id, task_id):
        payload = request.get_json(silent=True) or {}
        target_status = clean(payload.get("status")) or "done"
        if target_status not in ("open", "done"):
            return jsonify({"error": "Nieprawidłowy status zadania."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT i.title, task.title, task.status
            FROM incident_tasks task
            JOIN incidents i ON i.id = task.incident_id
            WHERE task.incident_id = %s AND task.id = %s
        """, (incident_id, task_id))
        task_row = cur.fetchone()
        if not task_row:
            cur.close()
            conn.close()
            return jsonify({"error": "Nie znaleziono zadania incydentu."}), 404
        if target_status == "done":
            cur.execute("""
                UPDATE incident_tasks
                SET status = 'done',
                    completed_by_email = %s,
                    completed_by_name = %s,
                    completed_at = NOW()
                WHERE incident_id = %s AND id = %s
            """, (user["email"], user["name"], incident_id, task_id))
            update_type = "task_done"
            message = f"Zamknięto zadanie: {task_row[1]}"
        else:
            cur.execute("""
                UPDATE incident_tasks
                SET status = 'open',
                    completed_by_email = NULL,
                    completed_by_name = NULL,
                    completed_at = NULL
                WHERE incident_id = %s AND id = %s
            """, (incident_id, task_id))
            update_type = "task_reopened"
            message = f"Ponownie otwarto zadanie: {task_row[1]}"
        cur.execute("""
            INSERT INTO incident_updates (
              incident_id, update_type, message, is_public,
              created_by_email, created_by_name
            )
            VALUES (%s, %s, %s, FALSE, %s, %s)
        """, (
            incident_id, update_type, message,
            user["email"], user["name"],
        ))
        cur.execute(
            "UPDATE incidents SET updated_at = NOW() WHERE id = %s",
            (incident_id,),
        )
        log_audit(cur, user, "incident_task_toggled", "incident", incident_id, {
            "task_id": task_id,
            "status": target_status,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"{user['name']} zaktualizował zadanie incydentu #{incident_id}: {task_row[1]}",
            "incident_updated",
            None,
            staff_only=True,
        )
        return jsonify({"status": "ok", "task_status": target_status})

