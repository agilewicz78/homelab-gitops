            const res = await api(`/api/admin/workflows/${{workflowId}}/automations/${{rule.id}}`, {{ method: "DELETE" }});
            if (!res || !res.ok) {{
              const data = res ? await res.json().catch(() => ({{}})) : {{}};
              alert(data.error || "Nie udało się usunąć reguły automatyzacji.");
              return;
            }}
            const data = await res.json().catch(() => ({{}}));
