    email\") or \"\", ticket_id))\n    row = cur.fetchone()\n    cur.close()\n    conn.close()\n    if not row:\n        return False\n    requester_email, assigned_to_email, is_watcher = row\n    user_email = (user.get(\"email\") or \"\").lower()\n    return bool(\n        user_email\n        and (\n            user_email == (requester_email or \"\").lower()\n            or user_email == (assigned_to_email or \"\").lower()\n            or is_watcher\n        )\n    )\ndef get_ticket_status_for_update(cur, ticket_id):\n    cur.execute(\"SELECT status FROM tickets WHERE id = %s\", (ticket_id,))\n    row = cur.fetchone()\n    if not row:\n        return None\n    return row[0]\ndef ensure_ticket_mutable(cur, ticket_id):\n    status = get_ticket_status_for_update(cur, ticket_id)\n    if status is None:\n        return False, jsonify({\"error\": \"not found\"}), 404\n    if status == \"Zamknięte\":\n        return False, jsonify({\"error\": \"Zgłoszenie jest zamknięte i dostępne tylko do odczytu.\"\
    }), 400\n    return True, status, None\ndef workflow_first_active_status_after_new(statuses):\n    skipped = {\"Nowe\", \"Zamknięte\", \"Rozwiązane\", \"Zrealizowane\"}\n    for candidate in statuses:\n        if candidate not in skipped:\n            return candidate\n    return None\ndef apply_workflow_event_rules(cur, ticket_id, user, event_type, current_status, visibility=None, event_new_status=None):\n    \"\"\"\n    Elastyczne reguły workflow: zdarzenie + warunki + wiele akcji.\n    Obsługiwane akcje MVP: change_status, notify, add_history.\n    Każde dopasowanie reguły zapisujemy w workflow_rule_executions.\n    \"\"\"\n    if current_status == \"Zamknięte\":\n        return []\n    cur.execute(\"SELECT COALESCE(workflow_key, 'default'), assigned_to_email FROM tickets WHERE id = %s\", (ticket_id,))\n    row = cur.fetchone()\n    workflow_key = row[0] if row else \"default\"\n    assigned_to_email = row[1] if row else None\n    workflow_id = workflow_id_by_key(cur, workflow_key)\n\
    \    statuses = workflow_statuses(workflow_key)\n    rules = workflow_automations_for_event(cur, workflow_key, event_type, current_status, user, visibility, assigned_to_email, event_new_status)\n    executed = []\n    effective_status = event_new_status or current_status\n    for rule in rules:\n        rule_name = rule.get(\"name\") or \"Reguła workflow\"\n        action_executed = False\n        action_results = []\n        actions = rule.get(\"actions\") or [{\n            \"action_type\": rule.get(\"action_type\") or \"change_status\",\n            \"action_value\": rule.get(\"action_status\"),\n            \"is_active\": True,\n            \"action_order\": 1,\n        }]\n        for action in actions:\n            if action.get(\"is_active\") is False:\n                action_results.append({\n                    \"action_type\": action.get(\"action_type\") or \"change_status\",\n                    \"result\": \"skipped\",\n                    \"reason\": \"akcja nieaktywna\"\
