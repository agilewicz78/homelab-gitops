          );
        }});
        function incidentStatusLabel(status) {{
          return ({{
            investigating: "Badanie",
            identified: "Przyczyna zidentyfikowana",
            monitoring: "Monitorowanie",
            resolved: "Rozwiązany"
          }})[status] || status;
        }}
        function incidentSeverityClass(severity) {{
          return String(severity || "SEV4").toLowerCase();
        }}
        function incidentTicketCountLabel(count) {{
          const value = Math.max(0, Number(count) || 0);
          if (value === 1) return "1 powiązane zgłoszenie";
          const lastTwo = value % 100;
          const lastOne = value % 10;
          if (lastOne >= 2 && lastOne <= 4 && (lastTwo < 12 || lastTwo > 14)) {{
            return `${{value}} powiązane zgłoszenia`;
          }}
          return `${{value}} powiązanych zgłoszeń`;
        }}
        async function renderIncidents(filter = incidentListFilter) {{
