    def get_conn():
        return psycopg2.connect(
            host=DB_HOST,
            port=DB_PORT,
            dbname=DB_NAME,
            user=DB_USER,
            password=DB_PASSWORD,
        )

    def init_db():
        for _ in range(40):
            try:
                conn = get_conn()
                cur = conn.cursor()

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS users (
                        id SERIAL PRIMARY KEY,
                        first_name TEXT NOT NULL,
                        last_name TEXT NOT NULL,
                        email TEXT UNIQUE NOT NULL,
                        department TEXT NOT NULL,
                        role TEXT NOT NULL DEFAULT 'user',
                        password_hash TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS first_name TEXT")
                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS last_name TEXT")
                cur.execute("""
                    SELECT EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_name = 'users' AND column_name = 'full_name'
                    )
                """)
                has_full_name = cur.fetchone()[0]
                if has_full_name:
                    cur.execute("""
                        UPDATE users
                        SET
                          first_name = COALESCE(NULLIF(first_name, ''), split_part(full_name, ' ', 1)),
                          last_name = COALESCE(
                            NULLIF(last_name, ''),
                            NULLIF(trim(substr(full_name, length(split_part(full_name, ' ', 1)) + 1)), ''),
                            '-'
                          )
                        WHERE first_name IS NULL OR first_name = '' OR last_name IS NULL OR last_name = ''
                    """)
                    cur.execute("ALTER TABLE users DROP COLUMN IF EXISTS full_name")
                cur.execute("UPDATE users SET first_name = 'Nieznane' WHERE first_name IS NULL OR first_name = ''")
                cur.execute("UPDATE users SET last_name = '-' WHERE last_name IS NULL OR last_name = ''")

                cur.execute("ALTER TABLE users ADD COLUMN IF NOT EXISTS roles TEXT[]")
                cur.execute("UPDATE users SET role = 'operator' WHERE role = 'agent'")
                cur.execute("""
                    UPDATE users
                    SET first_name = 'Helpdesk', last_name = 'Operator'
                    WHERE email IN ('agent@incoprp.local', 'operator@incoprp.local')
                      AND lower(first_name) = 'helpdesk'
                """)
                cur.execute("""
                    UPDATE users
                    SET roles = CASE
                        WHEN role = 'admin' THEN ARRAY['user','admin','operator']
                        WHEN role = 'operator' THEN ARRAY['user','operator']
                        ELSE ARRAY['user']
                    END
                    WHERE roles IS NULL OR array_length(roles, 1) IS NULL
                """)
                cur.execute("UPDATE users SET roles = ARRAY['user'] WHERE NOT ('user' = ANY(roles))")
                cur.execute("""
                    UPDATE users
                    SET role = CASE
                        WHEN 'admin' = ANY(roles) THEN 'admin'
                        WHEN 'operator' = ANY(roles) THEN 'operator'
                        ELSE 'user'
                    END
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS user_sessions (
                        sid TEXT PRIMARY KEY,
                        user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,
                        created_at TIMESTAMP DEFAULT NOW(),
                        last_seen TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS tickets (
                        id SERIAL PRIMARY KEY,
                        title TEXT NOT NULL,
                        description TEXT NOT NULL,
                        requester_name TEXT NOT NULL,
                        requester_email TEXT NOT NULL,
                        department TEXT NOT NULL,
                        category TEXT NOT NULL,
                        priority TEXT NOT NULL,
                        status TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW(),
                        updated_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS comments (
                        id SERIAL PRIMARY KEY,
                        ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,
                        author TEXT NOT NULL,
                        content TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)
                cur.execute("""
                    ALTER TABLE comments
                    ADD COLUMN IF NOT EXISTS visibility TEXT DEFAULT 'public'
                """)
                cur.execute("""
                    UPDATE comments
                    SET visibility = 'public'
                    WHERE visibility IS NULL OR visibility NOT IN ('public', 'internal')
                """)

                cur.execute("""
                    ALTER TABLE tickets
                    ADD COLUMN IF NOT EXISTS assigned_to_email TEXT REFERENCES users(email) ON DELETE SET NULL
                """)
                cur.execute("""
                    ALTER TABLE tickets
                    ADD COLUMN IF NOT EXISTS sla_due_at TIMESTAMP
                """)
                cur.execute("""
                    UPDATE tickets
                    SET sla_due_at = created_at + CASE priority
                        WHEN 'Krytyczny' THEN INTERVAL '4 hours'
                        WHEN 'Wysoki' THEN INTERVAL '8 hours'
                        WHEN 'Normalny' THEN INTERVAL '48 hours'
                        WHEN 'Niski' THEN INTERVAL '120 hours'
                        ELSE INTERVAL '48 hours'
                    END
                    WHERE sla_due_at IS NULL
                """)
                cur.execute("""
                    CREATE TABLE IF NOT EXISTS ticket_events (
                        id SERIAL PRIMARY KEY,
                        ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,
                        actor_email TEXT,
                        actor_name TEXT,
                        event_type TEXT NOT NULL,
                        message TEXT NOT NULL,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS attachments (
                        id SERIAL PRIMARY KEY,
                        ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,
                        original_filename TEXT NOT NULL,
                        stored_filename TEXT NOT NULL,
                        content_type TEXT,
                        size_bytes INTEGER NOT NULL,
                        uploaded_by_email TEXT,
                        uploaded_by_name TEXT,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)

                cur.execute("""
                    CREATE TABLE IF NOT EXISTS notifications (
                        id SERIAL PRIMARY KEY,
                        user_email TEXT NOT NULL REFERENCES users(email) ON DELETE CASCADE,
                        ticket_id INTEGER REFERENCES tickets(id) ON DELETE CASCADE,
                        type TEXT NOT NULL,
                        message TEXT NOT NULL,
                        is_read BOOLEAN DEFAULT FALSE,
                        created_at TIMESTAMP DEFAULT NOW()
                    );
                """)


                password_hash = generate_password_hash(INITIAL_PASSWORD)
                for first_name, last_name, email, department, role in SEED_USERS:
                    cur.execute("""
                        INSERT INTO users (first_name, last_name, email, department, role, password_hash)
                        VALUES (%s, %s, %s, %s, %s, %s)
                        ON CONFLICT (email) DO NOTHING
                    """, (first_name, last_name, email, department, role, password_hash))

                    cur.execute("""
                        UPDATE users
                        SET roles = CASE
                            WHEN %s = 'admin' THEN ARRAY['user','admin','operator']
                            WHEN %s = 'operator' THEN ARRAY['user','operator']
                            ELSE ARRAY['user']
                        END,
                        role = CASE
                            WHEN %s = 'admin' THEN 'admin'
                            WHEN %s = 'operator' THEN 'operator'
                            ELSE 'user'
                        END
                        WHERE email = %s AND (roles IS NULL OR array_length(roles, 1) IS NULL)
                    """, (role, role, role, role, email))

                cur.execute("SELECT COUNT(*) FROM tickets")
                count = cur.fetchone()[0]
                if count == 0:
                    for ticket in SEED_TICKETS:
                        priority = ticket[6]
                        sla_due_at = datetime.now() + timedelta(hours=SLA_HOURS.get(priority, 48))
                        cur.execute("""
                            INSERT INTO tickets (
                                title, description, requester_name, requester_email,
                                department, category, priority, status, sla_due_at
                            )
                            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s)
                        """, ticket + (sla_due_at,))

                conn.commit()
                cur.close()
                conn.close()
                return
            except Exception as e:
                print(f"Waiting for database: {e}", flush=True)
                time.sleep(1)
        raise RuntimeError("Database unavailable")

    init_db()

    def esc(value):
        return html.escape(str(value or ""))

    def clean(value):
        return str(value or "").strip()


    def allowed_attachment(filename):
        if not filename or "." not in filename:
            return False
        ext = filename.rsplit(".", 1)[1].lower()
        return ext in ALLOWED_ATTACHMENT_EXTENSIONS

    def attachment_path(stored_filename):
        base = os.path.abspath(ATTACHMENTS_DIR)
        target = os.path.abspath(os.path.join(base, stored_filename))
        if not target.startswith(base + os.sep):
            raise ValueError("Invalid attachment path")
        return target


    def sla_due_for_priority(priority):
        return datetime.now() + timedelta(hours=SLA_HOURS.get(priority, 48))

    def sla_state(sla_due_at, status):
        if not sla_due_at:
            return "none"
        if status in ("Rozwiązane", "Zamknięte"):
            return "done"
        now = datetime.now()
        if sla_due_at < now:
            return "overdue"
        if sla_due_at - now <= timedelta(hours=4):
            return "warning"
        return "ok"

    def event_message(actor_name, text):
        return f"{actor_name}: {text}"

    def add_ticket_event(cur, ticket_id, user, event_type, message):
        cur.execute("""
            INSERT INTO ticket_events (ticket_id, actor_email, actor_name, event_type, message)
            VALUES (%s, %s, %s, %s, %s)
        """, (
            ticket_id,
            user.get("email") if user else None,
            user.get("name") if user else "System",
            event_type,
            message,
        ))

    def get_sid_from_request():
        return request.headers.get("X-Helpdesk-Session", "").strip()

    def get_user_by_sid(sid):
        if not sid:
            return None
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT u.first_name, u.last_name, u.email, u.department, u.role, u.roles
            FROM user_sessions s
            JOIN users u ON u.email = s.user_email
            WHERE s.sid = %s
        """, (sid,))
        row = cur.fetchone()
        if row:
            cur.execute("UPDATE user_sessions SET last_seen = NOW() WHERE sid = %s", (sid,))
            conn.commit()
        cur.close()
        conn.close()
        if not row:
            return None
        return {
            "first_name": row[0],
            "last_name": row[1],
            "name": f"{row[0]} {row[1]}".strip(),
            "email": row[2],
            "department": row[3],
            "role": row[4],
            "roles": list(row[5] or ["user"]),
        }

    def current_user():
        return get_user_by_sid(get_sid_from_request())

    def api_login_required(fn):
        @wraps(fn)
        def wrapper(*args, **kwargs):
            user = current_user()
            if not user:
                return jsonify({"error": "unauthorized"}), 401
            return fn(user, *args, **kwargs)
        return wrapper

    def has_role(user, role):
        if not user:
            return False
        roles = user.get("roles") or []
        if isinstance(roles, str):
            roles = [roles]
        return role in roles

    def role_label(roles):
        roles = roles or ["user"]
        if "admin" in roles:
            return "admin"
        if "operator" in roles:
            return "operator"
        return "user"

    def normalize_roles(raw_roles):
        if raw_roles is None:
            roles = ["user"]
        elif isinstance(raw_roles, list):
            roles = [clean(r) for r in raw_roles]
        else:
            roles = [clean(raw_roles)]
        roles = [r for r in roles if r in VALID_ROLES]
        if "user" not in roles:
            roles.insert(0, "user")
        # keep stable order
        return [r for r in VALID_ROLES if r in roles]

    def is_admin(user):
        return has_role(user, "admin")

    def is_operator(user):
        return has_role(user, "operator")

    def is_staff(user):
        return bool(user and (is_operator(user) or is_admin(user)))

    def publish_event(message, event_type="info", ticket_id=None, staff_only=False):
        global last_live_event
        last_live_event = {
            "id": str(uuid.uuid4()),
            "type": event_type,
            "message": message,
            "ticket_id": ticket_id,
            "timestamp": time.strftime("%Y-%m-%d %H:%M:%S"),
            "staff_only": staff_only,
        }

    def staff_notification_recipients(cur):
        cur.execute("""
            SELECT email
            FROM users
            WHERE roles IS NOT NULL
              AND ('operator' = ANY(roles) OR 'admin' = ANY(roles))
        """)
        return {row[0] for row in cur.fetchall() if row and row[0]}


    def ticket_notification_recipients(cur, ticket_id, include_requester=True, include_assigned=True, include_staff=True):
        recipients = set()
        cur.execute("""
            SELECT requester_email, assigned_to_email
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        row = cur.fetchone()

        if row:
            requester_email, assigned_to_email = row
            if include_requester and requester_email:
                recipients.add(requester_email)
            if include_assigned and assigned_to_email:
                recipients.add(assigned_to_email)

        if include_staff:
            recipients.update(staff_notification_recipients(cur))

        return recipients


    def create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=None):
        for email in sorted({email for email in recipients if email}):
            if actor_email and email == actor_email:
                continue
            cur.execute("""
                INSERT INTO notifications (user_email, ticket_id, type, message)
                VALUES (%s, %s, %s, %s)
            """, (email, ticket_id, event_type, message))


    def create_ticket_notifications(cur, ticket_id, event_type, message, actor_email=None, staff_only=False):
        recipients = ticket_notification_recipients(
            cur,
            ticket_id,
            include_requester=not staff_only,
            include_assigned=True,
            include_staff=True,
        )
        create_notifications(cur, recipients, ticket_id, event_type, message, actor_email=actor_email)


    def api_admin_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not is_admin(user):
                return jsonify({"error": "admin required"}), 403
            return fn(user, *args, **kwargs)
        return wrapper

    def api_staff_required(fn):
        @wraps(fn)
        def wrapper(user, *args, **kwargs):
            if not is_staff(user):
                return jsonify({"error": "operator or admin required"}), 403
            return fn(user, *args, **kwargs)
        return wrapper

