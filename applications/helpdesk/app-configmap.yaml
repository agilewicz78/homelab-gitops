    @app.get("/api/tickets")
    @api_login_required
    def api_tickets(user):
        status_filter = clean(request.args.get("status"))
        if status_filter and status_filter not in STATUSES:
            return jsonify({"error": "invalid status filter"}), 400

        conn = get_conn()
        cur = conn.cursor()

        base_clauses = []
        base_params = []

        if not is_admin(user):
            base_clauses.append("requester_email = %s")
            base_params.append(user["email"])

        base_where_sql = "WHERE " + " AND ".join(base_clauses) if base_clauses else ""

        filtered_clauses = list(base_clauses)
        filtered_params = list(base_params)
        if status_filter:
            filtered_clauses.append("status = %s")
            filtered_params.append(status_filter)

        filtered_where_sql = "WHERE " + " AND ".join(filtered_clauses) if filtered_clauses else ""

        cur.execute(f"""
            SELECT
              COUNT(*),
              COUNT(*) FILTER (WHERE status = 'Nowe'),
              COUNT(*) FILTER (WHERE status = 'W trakcie'),
              COUNT(*) FILTER (WHERE priority IN ('Wysoki', 'Krytyczny')),
              COUNT(*) FILTER (WHERE status IN ('Rozwiązane', 'Zamknięte'))
            FROM tickets
            {base_where_sql}
        """, tuple(base_params))
        total, new_count, in_progress, high_count, resolved_count = cur.fetchone()

        cur.execute(f"""
            SELECT id, title, requester_name, requester_email, department, category,
                   priority, status, created_at, updated_at
            FROM tickets
            {filtered_where_sql}
            ORDER BY id DESC
        """, tuple(filtered_params))
        rows = cur.fetchall()
        cur.close()
        conn.close()

        tickets = []
        for row in rows:
            tickets.append({
                "id": row[0],
                "title": row[1],
                "requester_name": row[2],
                "requester_email": row[3],
                "department": row[4],
                "category": row[5],
                "priority": row[6],
                "status": row[7],
                "created_at": str(row[8]),
                "updated_at": str(row[9]),
            })

        return jsonify({
            "stats": {
                "total": total,
                "new": new_count,
                "in_progress": in_progress,
                "high": high_count,
                "resolved": resolved_count,
            },
            "tickets": tickets,
            "statuses": STATUSES,
            "selected_status": status_filter,
        })

    @app.post("/api/tickets")
    @api_login_required
    def api_create_ticket(user):
        payload = request.get_json(silent=True) or {}
        title = clean(payload.get("title"))
        description = clean(payload.get("description"))
        category = clean(payload.get("category"))
        priority = clean(payload.get("priority")) or "Normalny"

        if not title or not description:
            return jsonify({"error": "title and description are required"}), 400

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            INSERT INTO tickets (
                title, description, requester_name, requester_email,
                department, category, priority, status
            )
            VALUES (%s, %s, %s, %s, %s, %s, %s, 'Nowe')
            RETURNING id
        """, (
            title, description, user["name"], user["email"],
            user["department"], category, priority,
        ))
        ticket_id = cur.fetchone()[0]
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"id": ticket_id}), 201

    def can_view_ticket(user, ticket_id):
        if is_admin(user):
            return True
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT requester_email FROM tickets WHERE id = %s", (ticket_id,))
        row = cur.fetchone()
        cur.close()
        conn.close()
        return bool(row and row[0] == user["email"])

    @app.get("/api/tickets/<int:ticket_id>")
    @api_login_required
    def api_ticket_detail(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT id, title, description, requester_name, requester_email, department,
                   category, priority, status, created_at, updated_at
            FROM tickets
            WHERE id = %s
        """, (ticket_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404

        cur.execute("""
            SELECT author, content, created_at
            FROM comments
            WHERE ticket_id = %s
            ORDER BY id ASC
        """, (ticket_id,))
        comment_rows = cur.fetchall()
        cur.close()
        conn.close()

        ticket = {
            "id": row[0],
            "title": row[1],
            "description": row[2],
            "requester_name": row[3],
            "requester_email": row[4],
            "department": row[5],
            "category": row[6],
            "priority": row[7],
            "status": row[8],
            "created_at": str(row[9]),
            "updated_at": str(row[10]),
        }
        comments = [
            {"author": c[0], "content": c[1], "created_at": str(c[2])}
            for c in comment_rows
        ]
        return jsonify({
            "ticket": ticket,
            "comments": comments,
            "meta": {"statuses": STATUSES},
        })

    @app.post("/api/tickets/<int:ticket_id>/status")
    @api_login_required
    def api_update_status(user, ticket_id):
        if not is_admin(user):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        status = clean(payload.get("status")) or "Nowe"
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("UPDATE tickets SET status = %s, updated_at = NOW() WHERE id = %s", (status, ticket_id))
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"status": "ok"})

    @app.post("/api/tickets/<int:ticket_id>/comments")
    @api_login_required
    def api_add_comment(user, ticket_id):
        if not can_view_ticket(user, ticket_id):
            return jsonify({"error": "forbidden"}), 403
        payload = request.get_json(silent=True) or {}
        content = clean(payload.get("content"))
        if not content:
            return jsonify({"error": "content is required"}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            INSERT INTO comments (ticket_id, author, content)
            VALUES (%s, %s, %s)
        """, (ticket_id, user["name"], content))
        cur.execute("UPDATE tickets SET updated_at = NOW() WHERE id = %s", (ticket_id,))
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"status": "ok"})
