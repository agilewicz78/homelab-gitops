                        </label>
                        ${statusChecks}
                      </div>
                    </details>
                  </div>
                  ${assignedSelect}
                  ${prioritySelect}
                  ${categorySelect}
                  ${subcategorySelect}
                  ${slaSelect}
                  ${firstResponseSelect}
                  <div class="filter-field">
                    <label>&nbsp;</label>
                    <button class="btn-secondary" onclick="clearAllFilters()">Wyczyść filtry</button>
                  </div>
                </div>
                ${dateRequesterControls}
                ${searchSortControls}
                <div class="active-filter-count">Aktywne filtry: ${activeFilterCount}${canWorkTickets(me) ? ` · domyślnie operator widzi: ${assignedFilterLabel(loadAssignedFilter(me), data.operators || [])}` : ""}</div>
              </div>
            </section>
            <section class="card">
              <h2>${scope}${filteredLabel}</h2>
              ${pageControls}
              <table>
                <thead><tr><th>ID</th><th>Tytuł</th><th>Zgłaszający</th><th>Kategoria</th><th>Priorytet</th><th>Status</th><th>Przypisane do</th><th>SLA</th><th>Utworzono</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
              ${pageControls}
            </section>`;
          appEl.innerHTML = canViewOperatorCenter(me)
            ? renderWorkspaceShell(me, "tickets", homeContent)
            : homeContent;
        }
        async function renderNewTicket() {
