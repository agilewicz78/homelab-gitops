              ${{canWorkTickets(me) ? `<button class="btn-secondary" onclick="renderDashboard()">Dashboard</button>` : ""}}
              ${{canWorkTickets(me) ? `<button class="btn-secondary" onclick="renderIncidents()">Incident Command Center</button>` : ""}}
              ${{isAdmin(me) ? `<button class="btn-secondary" onclick="renderAdminUsers()">Zarządzanie użytkownikami</button> <button class="btn-secondary" onclick="renderAdminWorkflows()">Workflow</button> <button class="btn-secondary" onclick="renderAudit()">Audyt</button>` : ""}}
