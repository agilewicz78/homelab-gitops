    @api_login_required
    def api_knowledge_article_detail(user, article_id):
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT
              ka.id, ka.title, ka.problem, ka.solution,
              ka.category, ka.subcategory, ka.status,
              ka.source_ticket_id,
              COALESCE(ka.created_by_name, ''),
              COALESCE(ka.updated_by_name, ka.created_by_name, ''),
              ka.created_at, ka.updated_at, ka.published_at
            FROM knowledge_articles ka
            WHERE ka.id = %s
        """, (article_id,))
        row = cur.fetchone()
        if not row or (not is_staff(user) and row[6] != "published"):
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        article = {
            "id": row[0],
            "title": row[1],
            "problem": row[2],
            "solution": row[3],
            "category": row[4],
            "subcategory": row[5],
            "status": row[6],
            "source_ticket_id": row[7] if is_staff(user) else None,
            "created_by_name": row[8],
            "updated_by_name": row[9],
            "created_at": str(row[10]),
            "updated_at": str(row[11]),
            "published_at": str(row[12]) if row[12] else "",
        }
        cur.execute("""
            SELECT
              COUNT(*) FILTER (WHERE helpful = TRUE),
              COUNT(*) FILTER (WHERE helpful = FALSE),
              BOOL_OR(helpful) FILTER (WHERE lower(user_email) = lower(%s)),
              MAX(reason_code) FILTER (WHERE lower(user_email) = lower(%s)),
              MAX(reason_comment) FILTER (WHERE lower(user_email) = lower(%s))
            FROM knowledge_article_feedback
            WHERE article_id = %s
        """, (user["email"], user["email"], user["email"], article_id))
        feedback_row = cur.fetchone()
        reason_counts = []
        reason_comments = []
        if is_staff(user):
            cur.execute("""
                SELECT reason_code, COUNT(*)
                FROM knowledge_article_feedback
                WHERE article_id = %s
                  AND helpful = FALSE
                  AND reason_code IS NOT NULL
                GROUP BY reason_code
                ORDER BY COUNT(*) DESC, reason_code
            """, (article_id,))
            reason_counts = [{
                "code": reason[0],
                "label": KNOWLEDGE_FEEDBACK_REASONS.get(reason[0], reason[0]),
                "count": int(reason[1] or 0),
            } for reason in cur.fetchall()]
            cur.execute("""
                SELECT reason_code, reason_comment, updated_at
                FROM knowledge_article_feedback
                WHERE article_id = %s
                  AND helpful = FALSE
                  AND COALESCE(reason_comment, '') <> ''
                ORDER BY updated_at DESC
                LIMIT 20
            """, (article_id,))
            reason_comments = [{
                "reason_code": comment[0],
                "reason_label": KNOWLEDGE_FEEDBACK_REASONS.get(comment[0], comment[0]),
                "comment": comment[1],
                "updated_at": str(comment[2]),
            } for comment in cur.fetchall()]
        cur.close()
        conn.close()
        return jsonify({
            "article": article,
            "feedback": {
                "helpful": int(feedback_row[0] or 0),
                "not_helpful": int(feedback_row[1] or 0),
                "my_feedback": feedback_row[2],
                "my_reason": feedback_row[3] or "",
                "my_comment": feedback_row[4] or "",
                "reason_counts": reason_counts,
                "reason_comments": reason_comments,
            },
            "meta": {
                "categories": CATEGORIES,
                "subcategories": SUBCATEGORIES,
                "statuses": KNOWLEDGE_STATUSES,
                "feedback_reasons": [
                    {"code": code, "label": label}
                    for code, label in KNOWLEDGE_FEEDBACK_REASONS.items()
                ],
            },
        })

    @app.get("/api/knowledge-suggestions")
    @api_login_required
    def api_knowledge_suggestions(user):
        title = clean(request.args.get("title"))
        description = clean(request.args.get("description"))
        category = clean(request.args.get("category"))
        subcategory = clean(request.args.get("subcategory"))
        if len(f"{title} {description}".strip()) < 12:
            return jsonify({"suggestions": []})
        source_tokens = similarity_tokens(title, description)
        if not source_tokens:
            return jsonify({"suggestions": []})
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT id, title, problem, solution, category, subcategory, updated_at
            FROM knowledge_articles
            WHERE status = 'published'
            ORDER BY updated_at DESC
            LIMIT 100
        """)
        suggestions = []
        for article in cur.fetchall():
            score, reasons = similarity_score(
                source_tokens,
                similarity_tokens(article[1], article[2], article[3]),
                same_category=bool(category) and clean(article[4]).lower() == category.lower(),
                same_subcategory=bool(subcategory) and clean(article[5]).lower() == subcategory.lower(),
            )
            if score < 40:
                continue
            suggestions.append({
                "id": article[0],
                "title": article[1],
                "problem": article[2],
                "solution": article[3],
                "category": article[4],
                "subcategory": article[5],
                "updated_at": str(article[6]),
                "score": score,
                "reasons": reasons,
            })
        suggestions.sort(
            key=lambda item: (item["score"], item["updated_at"]),
            reverse=True,
        )
        cur.close()
        conn.close()
        return jsonify({"suggestions": suggestions[:3]})

    @app.post("/api/knowledge-articles/<int:article_id>/feedback")
    @api_login_required
    def api_knowledge_article_feedback(user, article_id):
        payload = request.get_json(silent=True) or {}
        helpful = payload.get("helpful")
        if not isinstance(helpful, bool):
            return jsonify({"error": "Ocena musi mieć wartość Pomogło lub Nie pomogło."}), 400
        reason_code = clean(payload.get("reason_code"))
        reason_comment = clean(payload.get("reason_comment"))[:500]
        if helpful:
            reason_code = None
            reason_comment = None
        elif reason_code not in KNOWLEDGE_FEEDBACK_REASONS:
            return jsonify({"error": "Wybierz powód, dlaczego artykuł nie pomógł."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute(
            "SELECT status, source_ticket_id FROM knowledge_articles WHERE id = %s",
            (article_id,),
        )
        article = cur.fetchone()
        if not article:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        if article[0] != "published":
            cur.close()
            conn.close()
            return jsonify({"error": "Można oceniać tylko opublikowane artykuły."}), 400
        cur.execute("""
            INSERT INTO knowledge_article_feedback (
              article_id, user_email, helpful, reason_code, reason_comment,
              created_at, updated_at
            )
            VALUES (%s, %s, %s, %s, %s, NOW(), NOW())
            ON CONFLICT (article_id, user_email) DO UPDATE
            SET helpful = EXCLUDED.helpful,
                reason_code = EXCLUDED.reason_code,
                reason_comment = EXCLUDED.reason_comment,
                updated_at = NOW()
        """, (article_id, user["email"], helpful, reason_code, reason_comment))
        log_audit(cur, user, "knowledge_article_feedback", "knowledge_article", article_id, {
            "helpful": helpful,
            "reason_code": reason_code,
        })
        cur.execute("""
            SELECT
              COUNT(*) FILTER (WHERE helpful = TRUE),
              COUNT(*) FILTER (WHERE helpful = FALSE)
            FROM knowledge_article_feedback
            WHERE article_id = %s
        """, (article_id,))
        counts = cur.fetchone()
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"Zaktualizowano ocenę artykułu bazy wiedzy #{article_id}.",
            "knowledge_article_changed",
            article[1],
            staff_only=False,
        )
        return jsonify({
            "helpful": int(counts[0] or 0),
            "not_helpful": int(counts[1] or 0),
            "my_feedback": helpful,
            "my_reason": reason_code or "",
            "my_comment": reason_comment or "",
        })

    @app.post("/api/knowledge-articles")
    @api_login_required
    @api_staff_required
    def api_create_knowledge_article(user):
        payload = request.get_json(silent=True) or {}
        source_ticket_id_raw = payload.get("source_ticket_id")
        try:
            source_ticket_id = int(source_ticket_id_raw) if source_ticket_id_raw else None
        except Exception:
            return jsonify({"error": "Nieprawidłowe ID zgłoszenia źródłowego."}), 400
        conn = get_conn()
        cur = conn.cursor()
        source_ticket = None
        if source_ticket_id:
            cur.execute("""
                SELECT title, description, category, COALESCE(subcategory, 'Inne'),
                       status, COALESCE(resolution_summary, '')
                FROM tickets
                WHERE id = %s
            """, (source_ticket_id,))
            source_ticket = cur.fetchone()
            if not source_ticket:
                cur.close()
                conn.close()
                return jsonify({"error": "Nie znaleziono zgłoszenia źródłowego."}), 404
            if source_ticket[4] != "Zamknięte":
                cur.close()
                conn.close()
                return jsonify({
                    "error": "Artykuł można utworzyć tylko z zamkniętego zgłoszenia.",
                }), 400
            cur.execute(
                "SELECT id FROM knowledge_articles WHERE source_ticket_id = %s",
                (source_ticket_id,),
            )
            existing = cur.fetchone()
            if existing:
                cur.close()
                conn.close()
                return jsonify({
                    "error": "Dla tego zgłoszenia istnieje już artykuł.",
                    "article_id": existing[0],
                }), 409
        title = clean(payload.get("title")) or (
            f"Rozwiązanie: {source_ticket[0]}" if source_ticket else ""
        )
        problem = clean(payload.get("problem")) or (
            source_ticket[1] if source_ticket else ""
        )
        solution = clean(payload.get("solution")) or (
            source_ticket[5] if source_ticket else ""
        )
        category = clean(payload.get("category")) or (
            source_ticket[2] if source_ticket else ""
        )
        subcategory = clean(payload.get("subcategory")) or (
            source_ticket[3] if source_ticket else "Inne"
        )
        status = clean(payload.get("status")) or "draft"
        if not title or not problem or not solution:
            cur.close()
            conn.close()
            return jsonify({"error": "Tytuł, opis problemu i rozwiązanie są wymagane."}), 400
        if category not in CATEGORIES or subcategory not in SUBCATEGORIES.get(category, []):
            cur.close()
            conn.close()
            return jsonify({"error": "Nieprawidłowa kategoria lub podkategoria."}), 400
        if status not in KNOWLEDGE_STATUSES:
            cur.close()
            conn.close()
            return jsonify({"error": "Nieprawidłowy status artykułu."}), 400
        cur.execute("""
            INSERT INTO knowledge_articles (
              title, problem, solution, category, subcategory, status,
              source_ticket_id, created_by_email, created_by_name,
              updated_by_email, updated_by_name, published_at
            )
            VALUES (
              %s, %s, %s, %s, %s, %s,
              %s, %s, %s, %s, %s,
              CASE WHEN %s = 'published' THEN NOW() ELSE NULL END
            )
            RETURNING id
        """, (
            title, problem, solution, category, subcategory, status,
            source_ticket_id, user["email"], user["name"],
            user["email"], user["name"], status,
        ))
        article_id = cur.fetchone()[0]
        if source_ticket_id:
            add_ticket_event(
                cur,
                source_ticket_id,
                user,
                "knowledge_article_created",
                f"Utworzono artykuł bazy wiedzy #{article_id}: {title}",
            )
        log_audit(cur, user, "knowledge_article_created", "knowledge_article", article_id, {
            "title": title,
            "status": status,
            "source_ticket_id": source_ticket_id,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"{user['name']} utworzył artykuł bazy wiedzy #{article_id}: {title}",
            "knowledge_article_changed",
            source_ticket_id,
            staff_only=status != "published",
        )
        return jsonify({"id": article_id, "status": status}), 201

