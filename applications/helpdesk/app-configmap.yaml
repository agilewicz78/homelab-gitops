    @app.get("/api/workflow-rule-executions")
    @app.get("/api/admin/workflow-rule-executions")
    @api_login_required
    
    # Lista logów wykonania reguł workflow z filtrami.
    def api_admin_workflow_rule_executions(user):
        if not can_view_workflow_logs_backend(user):
            return api_forbidden("Brak uprawnienia do logu automatyzacji workflow.", "workflow.view_logs")
        def parse_int(value, default=1):
            try:
                return int(str(value or "").strip())
            except Exception:
                return default
        workflow_id = request.args.get("workflow_id", "").strip()
        ticket_id = request.args.get("ticket_id", "").strip().lstrip("#")
        automation_id = request.args.get("automation_id", "").strip()
        q = request.args.get("q", "").strip()
        matched_filter = request.args.get("matched", "all").strip() or "all"
        event_type_filter = request.args.get("event_type", "all").strip() or "all"
        actor_filter = request.args.get("actor", "").strip()
        date_from = request.args.get("date_from", "").strip()
        date_to = request.args.get("date_to", "").strip()
        page = max(1, parse_int(request.args.get("page"), 1))
        page_size = min(100, max(10, parse_int(request.args.get("page_size"), 25)))
        clauses = []
        params = []
        if workflow_id.isdigit():
            clauses.append("wre.workflow_id = %s")
            params.append(int(workflow_id))
        if ticket_id.isdigit():
            clauses.append("wre.ticket_id = %s")
            params.append(int(ticket_id))
        if automation_id.isdigit():
            clauses.append("wre.automation_id = %s")
            params.append(int(automation_id))
        if matched_filter in ("matched", "true", "1"):
            clauses.append("COALESCE(wre.matched, TRUE) = TRUE")
        elif matched_filter in ("skipped", "false", "0"):
            clauses.append("COALESCE(wre.matched, TRUE) = FALSE")
        if event_type_filter and event_type_filter != "all":
            clauses.append("wre.event_type = %s")
            params.append(event_type_filter)
        if actor_filter:
            like = f"%{actor_filter}%"
            clauses.append("(COALESCE(wre.actor_name, '') ILIKE %s OR COALESCE(wre.actor_email, '') ILIKE %s)")
            params.extend([like, like])
        if date_from:
            clauses.append("wre.created_at >= %s::date")
            params.append(date_from)
        if date_to:
            clauses.append("wre.created_at < (%s::date + INTERVAL '1 day')")
            params.append(date_to)
        if q:
            like = f"%{q}%"
            clauses.append("(" + " OR ".join([
                "COALESCE(wa.name, '') ILIKE %s",
                "COALESCE(wd.name, '') ILIKE %s",
                "COALESCE(t.title, '') ILIKE %s",
                "COALESCE(wre.event_type, '') ILIKE %s",
                "COALESCE(wre.reason, '') ILIKE %s",
                "COALESCE(wre.actions_executed, '') ILIKE %s",
            ]) + ")")
            params.extend([like] * 6)
        where_sql = "WHERE " + " AND ".join(clauses) if clauses else ""
        conn = None
        cur = None
        try:
            conn = get_conn()
            cur = conn.cursor()
            cur.execute("SET LOCAL statement_timeout = '5000ms'")
            cur.execute(f"""
                SELECT COUNT(*)
                FROM workflow_rule_executions wre
                LEFT JOIN workflow_automations wa ON wa.id = wre.automation_id
                LEFT JOIN workflow_definitions wd ON wd.id = wre.workflow_id
                LEFT JOIN tickets t ON t.id = wre.ticket_id
                {where_sql}
            """, tuple(params))
            total = cur.fetchone()[0] or 0
            total_pages = max(1, (total + page_size - 1) // page_size)
            if page > total_pages:
                page = total_pages
            offset = (page - 1) * page_size
            cur.execute(f"""
                SELECT
                    wre.id,
                    wre.automation_id,
                    COALESCE(wa.name, 'Reguła usunięta') AS automation_name,
                    wre.workflow_id,
                    COALESCE(wd.name, wre.workflow_key, 'Workflow usunięty') AS workflow_name,
                    COALESCE(wd.workflow_key, wre.workflow_key, '') AS workflow_key,
                    wre.ticket_id,
                    COALESCE(t.title, '') AS ticket_title,
                    COALESCE(wre.event_type, '') AS event_type,
                    COALESCE(wre.matched, TRUE) AS matched,
                    COALESCE(wre.actions_executed, '[]') AS actions_executed,
                    COALESCE(wre.reason, '') AS reason,
                    COALESCE(wre.actor_email, '') AS actor_email,
                    COALESCE(wre.actor_name, '') AS actor_name,
                    COALESCE(wre.current_status, '') AS current_status,
                    COALESCE(wre.event_new_status, '') AS event_new_status,
                    COALESCE(wre.created_at, NOW()) AS created_at
                FROM workflow_rule_executions wre
                LEFT JOIN workflow_automations wa ON wa.id = wre.automation_id
                LEFT JOIN workflow_definitions wd ON wd.id = wre.workflow_id
                LEFT JOIN tickets t ON t.id = wre.ticket_id
                {where_sql}
                ORDER BY wre.id DESC
                LIMIT %s OFFSET %s
            """, tuple(params + [page_size, offset]))
            rows = cur.fetchall()
            items = []
            for r in rows:
                actions_raw = r[10] or "[]"
                if isinstance(actions_raw, str):
                    try:
                        actions = json.loads(actions_raw)
                    except Exception:
                        actions = actions_raw
                else:
                    actions = actions_raw
                items.append({
                    "id": r[0],
                    "automation_id": r[1],
                    "automation_name": r[2],
                    "workflow_id": r[3],
                    "workflow_name": r[4],
                    "workflow_key": r[5],
                    "ticket_id": r[6],
                    "ticket_title": r[7],
                    "event_type": r[8],
                    "matched": bool(r[9]),
                    "actions_executed": actions,
                    "reason": r[11],
                    "actor_email": r[12],
                    "actor_name": r[13],
                    "current_status": r[14],
                    "event_new_status": r[15],
                    "created_at": str(r[16]),
                })
            return jsonify({
                "executions": items,
                "pagination": {
                    "page": page,
                    "page_size": page_size,
                    "total_filtered": total,
                    "total_pages": total_pages,
                },
                "filters": {
                    "workflow_id": workflow_id,
                    "ticket_id": ticket_id,
                    "automation_id": automation_id,
                    "q": q,
                    "matched": matched_filter,
                    "event_type": event_type_filter,
                    "actor": actor_filter,
                    "date_from": date_from,
                    "date_to": date_to,
                },
            })
        except Exception as e:
            try:
                if conn:
                    conn.rollback()
            except Exception:
                pass
            print("workflow rule executions API error:", repr(e), flush=True)
            return jsonify({
                "error": "Nie udało się pobrać logu automatyzacji.",
                "details": str(e),
            }), 500
        finally:
            try:
                if cur:
                    cur.close()
            except Exception:
                pass
            try:
                if conn:
                    conn.close()
            except Exception:
                pass
    
