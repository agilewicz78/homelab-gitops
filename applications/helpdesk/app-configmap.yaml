        function workflowStepsText(workflow) {{
          return (workflow.steps || []).map(s => s.step_name || s).join("\\n");
        }}
        function workflowMatchLabel(workflow) {{
          const category = workflow.category === "*" ? "dowolna kategoria" : workflow.category;
          const subcategory = workflow.subcategory === "*" ? "dowolna podkategoria" : workflow.subcategory;
          return `${{esc(category)}} / ${{esc(subcategory)}}`;
        }}
        function workflowAutomation(workflow, eventType) {{
          return (workflow.automations || []).find(a => a.event_type === eventType && a.is_active !== false) || {{}};
        }}
        function workflowStatusOptions(workflow, selected, includeEmpty = false) {{
          const steps = (workflow.steps || []).map(s => s.step_name || s).filter(Boolean);
          const values = includeEmpty ? [""] : [];
          for (const step of steps) {{
            if (!values.includes(step)) values.push(step);
          }}
          return values.map(v => `
            <option value="${{esc(v)}}" ${{v === selected ? "selected" : ""}}>${{v ? esc(v) : "— brak —"}}</option>
          `).join("");
        }}
        let workflowAutomationEditor = [];
        let workflowAutomationEditorWorkflow = null;
        function automationSelectOptions(options, selected) {{
          return options.map(o => {{
            const value = typeof o === "string" ? o : o.value;
            const label = typeof o === "string" ? o : o.label;
            return `<option value="${{esc(value)}}" ${{value === selected ? "selected" : ""}}>${{esc(label)}}</option>`;
          }}).join("");
        }}
        function workflowDefaultAutomationRules(workflow) {{
          const existing = Array.isArray(workflow.automations) ? workflow.automations : [];
          if (existing.length) return existing.map((r, idx) => {{
            const actions = Array.isArray(r.actions) && r.actions.length
              ? r.actions.map((a, aidx) => ({{
                  action_type: a.action_type || "change_status",
                  action_value: a.action_value || a.action_status || "",
                  is_active: a.is_active !== false,
                  action_order: Number(a.action_order || (aidx + 1)),
                }}))
              : [{{
                  action_type: r.action_type || "change_status",
                  action_value: r.action_status || "",
                  is_active: true,
                  action_order: 1,
                }}];
            return {{
              name: r.name || `Reguła ${{idx + 1}}`,
              event_type: r.event_type || "comment_added",
              condition_status: r.condition_status || "",
              condition_to_status: r.condition_to_status || "",
              condition_role: r.condition_role || "*",
              condition_comment_visibility: r.condition_comment_visibility || "*",
              assigned_state: r.assigned_state || "*",
              action_type: actions[0]?.action_type || "change_status",
              action_status: actions[0]?.action_value || "",
              actions,
              is_active: r.is_active !== false,
              stop_processing: r.stop_processing !== false,
              priority: Number(r.priority || ((idx + 1) * 10)),
            }};
          }});
          return [
            {{
              name: "Status początkowy",
              event_type: "ticket_created",
              condition_status: "",
              condition_to_status: "",
              condition_role: "*",
              condition_comment_visibility: "*",
              action_type: "change_status",
              action_status: "Nowe",
              actions: [{{ action_type: "change_status", action_value: "Nowe", is_active: true, action_order: 1 }}],
              is_active: true,
              stop_processing: true,
              assigned_state: "*",
              priority: 10,
            }},
            {{
              name: "Użytkownik odpowiedział",
              event_type: "comment_added",
              condition_status: "Oczekuje na użytkownika",
              condition_to_status: "",
              condition_role: "user",
              condition_comment_visibility: "public",
              action_type: "change_status",
              action_status: "Otwarte",
              actions: [{{ action_type: "change_status", action_value: "Otwarte", is_active: true, action_order: 1 }}],
              is_active: true,
              stop_processing: true,
              assigned_state: "*",
