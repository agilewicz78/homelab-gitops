name: Bash checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck

      - name: Test HTTP status matching
        shell: bash
        run: |
          set -euo pipefail

          script="scripts/helpdesk-k8s-gitops-smoke-v40.sh"
          expected='[[ "${SLA_HTTP_CODE}" =~ ^(2[0-9]{2}|401|403)$ ]]'
          grep -Fq "$expected" "$script"

          for code in 200 204 299 401 403; do
            [[ "$code" =~ ^(2[0-9]{2}|401|403)$ ]]
          done

          for code in 000 404 500 2401 4030; do
            if [[ "$code" =~ ^(2[0-9]{2}|401|403)$ ]]; then
              echo "Unexpected match for HTTP code: $code" >&2
              exit 1
            fi
          done

      - name: Check Helpdesk database optimizations
        run: python scripts/check_helpdesk_optimizations.py

      - name: Check Helpdesk incident flow
        run: python scripts/check_helpdesk_incident_flow.py

      - name: Check Helpdesk similar-item suggestions
        run: python scripts/check_helpdesk_similarity.py

      - name: Check Helpdesk frontend syntax
        run: node scripts/check_helpdesk_frontend.js
