    @api_login_required\n@api_admin_required\ndef api_audit(user):\n    q = clean(request.args.get(\"q\") or \"\")\n    action_filter = clean(request.args.get(\"action\") or \"all\")\n    actor_filter = clean(request.args.get(\"actor\") or \"all\")\n    try:\n        page = max(1, int(request.args.get(\"page\", \"1\")))\n    except ValueError:\n        page = 1\n    try:\n        page_size = int(request.args.get(\"page_size\", \"25\"))\n    except ValueError:\n        page_size = 25\n    if page_size not in (25, 50, 100):\n        page_size = 25\n    clauses = []\n    params = []\n    if action_filter and action_filter != \"all\":\n        clauses.append(\"action = %s\")\n        params.append(action_filter)\n    if actor_filter and actor_filter != \"all\":\n        clauses.append(\"lower(actor_email) = lower(%s)\")\n        params.append(actor_filter)\n    if q:\n        like = f\"%{q.lower()}%\"\n        clauses.append(\"\"\"(\n            lower(coalesce(actor_email, '')) LIKE %s\n   \
    \         OR lower(coalesce(actor_name, '')) LIKE %s\n            OR lower(coalesce(action, '')) LIKE %s\n            OR lower(coalesce(target_type, '')) LIKE %s\n            OR lower(coalesce(target_id, '')) LIKE %s\n            OR lower(coalesce(details, '')) LIKE %s\n        )\"\"\")\n        params.extend([like, like, like, like, like, like])\n    where_sql = (\"WHERE \" + \" AND \".join(clauses)) if clauses else \"\"\n    offset = (page - 1) * page_size\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(f\"SELECT COUNT(*) FROM audit_log {where_sql}\", params)\n    total = cur.fetchone()[0]\n    total_pages = max(1, (total + page_size - 1) // page_size)\n    if page > total_pages:\n        page = total_pages\n        offset = (page - 1) * page_size\n    cur.execute(f\"\"\"\n        SELECT id, actor_email, actor_name, action, target_type, target_id, details, created_at\n        FROM audit_log\n        {where_sql}\n        ORDER BY created_at DESC, id DESC\n        LIMIT\
    \ %s OFFSET %s\n    \"\"\", params + [page_size, offset])\n    rows = cur.fetchall()\n    cur.execute(\"\"\"\n        SELECT DISTINCT action\n        FROM audit_log\n        ORDER BY action\n    \"\"\")\n    actions = [r[0] for r in cur.fetchall()]\n    cur.execute(\"\"\"\n        SELECT DISTINCT actor_email\n        FROM audit_log\n        WHERE actor_email IS NOT NULL AND actor_email <> ''\n        ORDER BY actor_email\n    \"\"\")\n    actors = [r[0] for r in cur.fetchall()]\n    cur.close()\n    conn.close()\n    return jsonify({\n        \"audit\": [\n            {\n                \"id\": r[0],\n                \"actor_email\": r[1] or \"\",\n                \"actor_name\": r[2] or \"System\",\n                \"action\": r[3],\n                \"target_type\": r[4],\n                \"target_id\": r[5] or \"\",\n                \"details\": r[6] or \"\",\n                \"created_at\": str(r[7]),\n            }\n            for r in rows\n        ],\n        \"actions\": actions,\n\
    \        \"actors\": actors,\n        \"pagination\": {\n            \"page\": page,\n            \"page_size\": page_size,\n            \"total_filtered\": total,\n            \"total_pages\": total_pages,\n        },\n        \"filters\": {\n            \"q\": q,\n            \"action\": action_filter,\n            \"actor\": actor_filter,\n        },\n    })\n@app.get(\"/api/workflows\")\n@app.get(\"/api/admin/workflows\")\n@api_login_required\ndef api_admin_workflows(user):\n    if not is_admin(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT\n            wd.id,\n            wd.workflow_key,\n            wd.name,\n            wd.category,\n            wd.subcategory,\n            wd.is_default,\n            wd.is_active,\n            wd.created_at,\n            wd.updated_at,\n            COUNT(t.id) AS ticket_count\n        FROM workflow_definitions wd\n        LEFT JOIN tickets\
    \ t ON t.workflow_key = wd.workflow_key\n        GROUP BY wd.id\n        ORDER BY wd.is_default DESC, lower(wd.name)\n    \"\"\")\n    workflows = []\n    for r in cur.fetchall():\n        operators = workflow_operator_entries(cur, r[0])\n        automations = workflow_automation_entries(cur, r[0])\n        workflows.append({\n            \"id\": r[0],\n            \"workflow_key\": r[1],\n            \"name\": r[2],\n            \"category\": r[3],\n            \"subcategory\": r[4],\n            \"is_default\": bool(r[5]),\n            \"is_active\": bool(r[6]),\n            \"created_at\": str(r[7]),\n            \"updated_at\": str(r[8]),\n            \"ticket_count\": int(r[9] or 0),\n            \"operators\": operators,\n            \"operator_emails\": [o[\"email\"] for o in operators],\n            \"automations\": automations,\n        })\n    cur.close()\n    conn.close()\n    return jsonify({\"workflows\": workflows})\n@app.get(\"/api/workflows/<int:workflow_id>\")\n@app.get(\"\
    /api/admin/workflows/<int:workflow_id>\")\n@api_login_required\ndef api_admin_workflow_detail(user, workflow_id):\n    if not is_admin(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    conn = get_conn()\n    cur = conn.cursor()\n    cur.execute(\"\"\"\n        SELECT id, workflow_key, name, category, subcategory, is_default, is_active, created_at, updated_at\n        FROM workflow_definitions\n        WHERE id = %s\n    \"\"\", (workflow_id,))\n    row = cur.fetchone()\n    if not row:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": \"not found\"}), 404\n    cur.execute(\"\"\"\n        SELECT id, step_name, step_order, is_final\n        FROM workflow_steps\n        WHERE workflow_id = %s\n        ORDER BY step_order ASC, id ASC\n    \"\"\", (workflow_id,))\n    steps = [\n        {\"id\": s[0], \"step_name\": s[1], \"step_order\": s[2], \"is_final\": bool(s[3])}\n        for s in cur.fetchall()\n    ]\n    cur.execute(\"SELECT COUNT(*)\
    \ FROM tickets WHERE workflow_key = %s\", (row[1],))\n    ticket_count = cur.fetchone()[0]\n    operators = workflow_operator_entries(cur, row[0])\n    automations = workflow_automation_entries(cur, row[0])\n    cur.close()\n    conn.close()\n    return jsonify({\n        \"id\": row[0],\n        \"workflow_key\": row[1],\n        \"name\": row[2],\n        \"category\": row[3],\n        \"subcategory\": row[4],\n        \"is_default\": bool(row[5]),\n        \"is_active\": bool(row[6]),\n        \"created_at\": str(row[7]),\n        \"updated_at\": str(row[8]),\n        \"ticket_count\": int(ticket_count or 0),\n        \"steps\": steps,\n        \"operators\": operators,\n        \"operator_emails\": [o[\"email\"] for o in operators],\n        \"automations\": automations,\n    })\ndef normalize_workflow_payload(payload, existing_key=None):\n    name = clean(payload.get(\"name\"))\n    category = clean(payload.get(\"category\")) or \"*\"\n    subcategory = clean(payload.get(\"subcategory\"\
    )) or \"*\"\n    workflow_key = clean(payload.get(\"workflow_key\")) or existing_key or workflow_key_from_name(name)\n    is_default = bool(payload.get(\"is_default\"))\n    is_active = bool(payload.get(\"is_active\", True))\n    raw_steps = payload.get(\"steps\")\n    if isinstance(raw_steps, str):\n        steps = [clean(x) for x in raw_steps.replace(\"\\r\", \"\").split(\"\\n\")]\n    elif isinstance(raw_steps, list):\n        steps = [clean(x.get(\"step_name\") if isinstance(x, dict) else x) for x in raw_steps]\n    else:\n        steps = []\n    steps = [s for s in steps if s]\n    unique_steps = []\n    for step in steps:\n        if step not in unique_steps:\n            unique_steps.append(step)\n    if \"Nowe\" not in unique_steps:\n        unique_steps.insert(0, \"Nowe\")\n    if \"Zamknięte\" not in unique_steps:\n        unique_steps.append(\"Zamknięte\")\n    if not name:\n        return None, \"Nazwa workflow jest wymagana.\"\n    if category != \"*\" and category not in\
    \ CATEGORIES:\n        return None, \"Nieprawidłowa kategoria.\"\n    if category == \"*\":\n        subcategory = \"*\"\n    elif subcategory != \"*\" and subcategory not in SUBCATEGORIES.get(category, [\"Inne\"]):\n        return None, \"Nieprawidłowa podkategoria.\"\n    if len(unique_steps) < 2:\n        return None, \"Workflow musi mieć co najmniej dwa kroki.\"\n    automations = normalize_workflow_automations(payload, unique_steps)\n    return {\n        \"workflow_key\": workflow_key,\n        \"name\": name,\n        \"category\": category,\n        \"subcategory\": subcategory,\n        \"is_default\": is_default,\n        \"is_active\": is_active,\n        \"steps\": unique_steps,\n        \"automations\": automations,\n    }, None\n@app.post(\"/api/workflows\")\n@app.post(\"/api/admin/workflows\")\n@api_login_required\ndef api_admin_create_workflow(user):\n    if not is_admin(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    payload = request.get_json(silent=True)\
    \ or {}\n    data, error = normalize_workflow_payload(payload)\n    if error:\n        return jsonify({\"error\": error}), 400\n    conn = get_conn()\n    cur = conn.cursor()\n    operator_emails = normalize_workflow_operator_emails(payload)\n    try:\n        operator_emails = validate_workflow_operator_emails(cur, operator_emails)\n    except ValueError as exc:\n        cur.close()\n        conn.close()\n        return jsonify({\"error\": str(exc)}), 400\n    if data[\"is_default\"]:\n        cur.execute(\"UPDATE workflow_definitions SET is_default = FALSE\")\n    cur.execute(\"\"\"\n        INSERT INTO workflow_definitions (\n            workflow_key, name, category, subcategory, is_default, is_active, updated_at\n        )\n        VALUES (%s, %s, %s, %s, %s, %s, NOW())\n        RETURNING id\n    \"\"\", (\n        data[\"workflow_key\"], data[\"name\"], data[\"category\"], data[\"subcategory\"],\n        data[\"is_default\"], data[\"is_active\"],\n    ))\n    workflow_id = cur.fetchone()[0]\n\
    \    for idx, step_name in enumerate(data[\"steps\"], start=1):\n        cur.execute(\"\"\"\n            INSERT INTO workflow_steps (workflow_id, step_name, step_order, is_final)\n            VALUES (%s, %s, %s, %s)\n        \"\"\", (workflow_id, step_name, idx, step_name == \"Zamknięte\"))\n    replace_workflow_operators(cur, workflow_id, operator_emails)\n    replace_workflow_automations(cur, workflow_id, data.get(\"automations\") or [])\n    audit_details = dict(data)\n    audit_details[\"operator_emails\"] = operator_emails\n    log_audit(cur, user, \"workflow_created\", \"workflow\", workflow_id, audit_details)\n    conn.commit()\n    cur.close()\n    conn.close()\n    return jsonify({\"id\": workflow_id}), 201\n@app.put(\"/api/workflows/<int:workflow_id>\")\n@app.put(\"/api/admin/workflows/<int:workflow_id>\")\n@api_login_required\ndef api_admin_update_workflow(user, workflow_id):\n    if not is_admin(user):\n        return jsonify({\"error\": \"forbidden\"}), 403\n    conn = get_conn()\n\
