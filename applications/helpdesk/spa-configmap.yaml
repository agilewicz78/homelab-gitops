        async function renderWorkflowRuleExecutions(workflowId = "", page = 1, explicitFilters = null) {
          const backTarget = workflowId ? `renderWorkflowManagement(${Number(workflowId)})` : "renderAdminWorkflows()";
          const backLabel = workflowId ? "← Proces" : "← Workflow";
          try {
            const me = await loadMe();
            if (!me || !isAdmin(me)) {
              appEl.innerHTML = `<section class="card"><h2>Brak dostępu</h2><p class="muted">Log automatyzacji jest dostępny tylko dla administratora.</p></section>`;
              return;
            }
            const filters = explicitFilters || workflowRuleExecutionFilterValues(workflowId);
            const params = new URLSearchParams();
            params.set("page", String(page || 1));
            params.set("page_size", "25");
            if (filters.workflow_id) params.set("workflow_id", String(filters.workflow_id));
            if (filters.q) params.set("q", filters.q);
            if (filters.ticket_id) params.set("ticket_id", String(filters.ticket_id).replace(/^#/, ""));
            if (filters.event_type && filters.event_type !== "all") params.set("event_type", filters.event_type);
            if (filters.matched && filters.matched !== "all") params.set("matched", filters.matched);
            if (filters.actor) params.set("actor", filters.actor);
            if (filters.date_from) params.set("date_from", filters.date_from);
            if (filters.date_to) params.set("date_to", filters.date_to);
            appEl.innerHTML = workflowRuleExecutionsShell(workflowId, filters, { page: page || 1, total_pages: 1, total_filtered: "—" });
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            let res;
            try {
              res = await fetch(`/api/admin/workflow-rule-executions?${params.toString()}`, { headers: { "X-Helpdesk-Session": getSid() }, signal: controller.signal });
            } finally {
              clearTimeout(timer);
            }
            if (res.status === 401) {
              clearSid();
              window.location.href = "/login";
              return;
            }
            let data = {};
            try { data = await res.json(); } catch (e) { data = { error: "Endpoint logu nie zwrócił poprawnego JSON." }; }
            if (!res.ok) {
              const msg = data.error || data.details || "Nie udało się pobrać logu automatyzacji.";
              const content = document.getElementById("workflowRuleExecutionContent");
              if (content) content.innerHTML = `<div class="error"><strong>Błąd pobierania logu automatyzacji.</strong><br>${esc(msg)}</div><p class="muted">Sprawdź logi poda: <code>kubectl logs -n helpdesk deploy/helpdesk-app --tail=200</code></p>`;
              return;
            }
            const returnedFilters = data.filters || filters || {};
            const pagination = data.pagination || { page: 1, total_pages: 1, total_filtered: 0 };
            appEl.innerHTML = workflowRuleExecutionsShell(workflowId, returnedFilters, pagination);
            const rows = (data.executions || []).map(e => `
