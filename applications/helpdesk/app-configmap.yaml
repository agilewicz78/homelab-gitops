            "tickets": tickets,
            "updates": updates,
            "tasks": tasks,
            "task_summary": task_summary,
            "timeline": timeline,
            "resolution_check": resolution_check,
            "meta": {
                "severities": INCIDENT_SEVERITIES,
                "statuses": INCIDENT_STATUSES,
                "commanders": commanders,
            },
        })

    @app.put("/api/incidents/<int:incident_id>")
    @api_login_required
    @api_staff_required
    def api_update_incident(user, incident_id):
        payload = request.get_json(silent=True) or {}
        title = clean(payload.get("title"))
        summary = clean(payload.get("summary"))
        impact = clean(payload.get("impact"))
        user_status_summary_provided = "user_status_summary" in payload
        user_current_action_provided = "user_current_action" in payload
        next_update_hint_provided = "next_update_hint" in payload
        user_status_summary = clean(payload.get("user_status_summary"))
        user_current_action = clean(payload.get("user_current_action"))
        next_update_hint = clean(payload.get("next_update_hint"))
        severity = clean(payload.get("severity"))
        status = clean(payload.get("status"))
        commander_email = clean(payload.get("commander_email")).lower()
        resolution_override = bool(payload.get("resolution_override"))
        resolve_linked_tickets = bool(payload.get("resolve_linked_tickets"))
        if not title or not summary:
            return jsonify({"error": "Tytuł i opis incydentu są wymagane."}), 400
        if severity not in INCIDENT_SEVERITIES or status not in INCIDENT_STATUSES:
            return jsonify({"error": "Nieprawidłowy poziom SEV lub status."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT status,
                   COALESCE(user_status_summary, ''),
                   COALESCE(user_current_action, ''),
                   COALESCE(next_update_hint, '')
            FROM incidents
            WHERE id = %s
        """, (incident_id,))
        current = cur.fetchone()
        if not current:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        if not user_status_summary_provided:
            user_status_summary = current[1]
        if not user_current_action_provided:
            user_current_action = current[2]
        if not next_update_hint_provided:
            next_update_hint = current[3]
        resolved_commander_email, commander_name = incident_commander(cur, commander_email)
        if commander_email and not resolved_commander_email:
            cur.close()
            conn.close()
            return jsonify({"error": "Dowódca incydentu musi być operatorem lub administratorem."}), 400
        resolution_check = None
        if current[0] != "resolved" and status == "resolved":
            resolution_check = incident_resolution_check(cur, incident_id)
            if resolution_check["warnings"] and not resolution_override:
                cur.close()
                conn.close()
                return jsonify({
                    "error": "Kontrola zamknięcia incydentu wymaga potwierdzenia.",
                    "requires_resolution_override": True,
                    "resolution_check": resolution_check,
                }), 409
        cur.execute("""
            UPDATE incidents
            SET title = %s,
                summary = %s,
                impact = %s,
                severity = %s,
                status = %s,
                user_status_summary = %s,
                user_current_action = %s,
                next_update_hint = %s,
                commander_email = %s,
                commander_name = %s,
                updated_at = NOW(),
                resolved_at = CASE
                  WHEN %s = 'resolved' THEN COALESCE(resolved_at, NOW())
                  ELSE NULL
                END
            WHERE id = %s
        """, (
            title, summary, impact, severity, status,
            user_status_summary, user_current_action, next_update_hint,
            resolved_commander_email, commander_name,
            status, incident_id,
        ))
        if current[0] != status:
            cur.execute("""
                INSERT INTO incident_updates (
                  incident_id, update_type, message, is_public,
                  created_by_email, created_by_name
                )
                VALUES (%s, 'status', %s, FALSE, %s, %s)
            """, (
                incident_id,
                f"Status zmieniono: {current[0]} → {status}",
                user["email"],
                user["name"],
            ))
            if status == "resolved" and resolution_check:
                if resolution_check["warnings"]:
                    check_message = (
                        "Kontrola zamknięcia: operator zamknął incydent mimo ostrzeżeń: "
                        + "; ".join(resolution_check["warnings"])
                    )
                else:
                    check_message = "Kontrola zamknięcia: wszystkie warunki wyglądają poprawnie."
                cur.execute("""
                    INSERT INTO incident_updates (
                      incident_id, update_type, message, is_public,
                      created_by_email, created_by_name
                    )
                    VALUES (%s, 'resolution_check', %s, FALSE, %s, %s)
                """, (
                    incident_id,
                    check_message,
                    user["email"],
                    user["name"],
                ))
        user_panel_changed = (
            current[1] != user_status_summary
            or current[2] != user_current_action
            or current[3] != next_update_hint
        )
        user_visible_changed = current[0] != status or user_panel_changed
        user_visible_ticket_ids = []
        if user_visible_changed:
            cur.execute("""
                SELECT ticket_id
                FROM incident_tickets
                WHERE incident_id = %s
            """, (incident_id,))
            user_visible_ticket_ids = [row[0] for row in cur.fetchall()]
        if user_panel_changed:
            panel_parts = [
                f"Co wiemy: {user_status_summary}" if user_status_summary else "",
                f"Co robimy: {user_current_action}" if user_current_action else "",
                f"Kolejna aktualizacja: {next_update_hint}" if next_update_hint else "",
            ]
            panel_message = "Zaktualizowano status dla użytkowników. " + " ".join(
                part for part in panel_parts if part
            )
            cur.execute("""
                INSERT INTO incident_updates (
                  incident_id, update_type, message, is_public,
                  created_by_email, created_by_name
                )
                VALUES (%s, 'user_status', %s, FALSE, %s, %s)
            """, (
                incident_id,
                panel_message.strip(),
                user["email"],
                user["name"],
            ))
        resolved_linked_ticket_ids = []
        if status == "resolved" and resolve_linked_tickets:
            resolved_linked_ticket_ids = resolve_incident_active_tickets(
                cur,
                incident_id,
                title,
                user,
            )
            if resolved_linked_ticket_ids:
                cur.execute("""
                    INSERT INTO incident_updates (
                      incident_id, update_type, message, is_public,
                      created_by_email, created_by_name
                    )
                    VALUES (%s, 'linked_tickets_resolved', %s, FALSE, %s, %s)
                """, (
                    incident_id,
                    f"Oznaczono jako Rozwiązane {len(resolved_linked_ticket_ids)} aktywnych zgłoszeń powiązanych z incydentem.",
                    user["email"],
                    user["name"],
                ))
        log_audit(cur, user, "incident_updated", "incident", incident_id, {
            "severity": severity,
            "status": status,
            "commander_email": resolved_commander_email,
            "resolution_override": resolution_override,
            "resolve_linked_tickets": resolve_linked_tickets,
            "resolved_linked_ticket_ids": resolved_linked_ticket_ids,
            "resolution_check": resolution_check,
            "user_status_summary": user_status_summary,
            "user_current_action": user_current_action,
            "next_update_hint": next_update_hint,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_ticket_ids = sorted(set(resolved_linked_ticket_ids + user_visible_ticket_ids))
        publish_event(
            f"{user['name']} zaktualizował incydent #{incident_id}: {title}",
            "incident_updated",
            None,
            staff_only=not bool(publish_ticket_ids),
            ticket_ids=publish_ticket_ids or None,
        )
        return jsonify({
            "status": "ok",
            "resolution_check": resolution_check,
            "resolved_linked_ticket_count": len(resolved_linked_ticket_ids),
            "resolved_linked_ticket_ids": resolved_linked_ticket_ids,
        })

    @app.post("/api/incidents/<int:incident_id>/updates")
    @api_login_required
    @api_staff_required
    def api_add_incident_update(user, incident_id):
        payload = request.get_json(silent=True) or {}
        message = clean(payload.get("message"))
        update_type = clean(payload.get("update_type")) or "update"
        is_public = bool(payload.get("is_public"))
        if not message:
            return jsonify({"error": "Treść komunikatu jest wymagana."}), 400
        if update_type not in ("update", "investigation", "mitigation", "resolution"):
            return jsonify({"error": "Nieprawidłowy typ komunikatu."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT title FROM incidents WHERE id = %s", (incident_id,))
        incident_row = cur.fetchone()
        if not incident_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        cur.execute("""
            INSERT INTO incident_updates (
              incident_id, update_type, message, is_public,
              created_by_email, created_by_name
            )
            VALUES (%s, %s, %s, %s, %s, %s)
        """, (
            incident_id, update_type, message, is_public,
            user["email"], user["name"],
        ))
        cur.execute("""
            SELECT ticket_id
            FROM incident_tickets
            WHERE incident_id = %s
        """, (incident_id,))
        ticket_ids = [ticket[0] for ticket in cur.fetchall()]
        cur.execute(
            "UPDATE incidents SET updated_at = NOW() WHERE id = %s",
            (incident_id,),
        )
        public_comments_created = 0
        for ticket_id in ticket_ids:
            if is_public:
                public_comment = (
                    f"Incydent #{incident_id} ({incident_row[0]}): {message}"
                )
                cur.execute("""
                    INSERT INTO comments (
                      ticket_id, author, author_email, content, visibility
                    )
                    VALUES (%s, %s, %s, %s, %s)
                """, (
                    ticket_id,
                    f"Incident Command Center · {user['name']}",
                    user["email"],
                    public_comment,
                    "public",
                ))
                public_comments_created += 1
                mark_first_response_if_needed(cur, ticket_id, user)
                cur.execute(
                    "UPDATE tickets SET updated_at = NOW() WHERE id = %s",
                    (ticket_id,),
                )
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "incident_update",
                f"Incydent #{incident_id}: {message}",
            )
            if is_public:
                create_ticket_notifications(
                    cur,
                    ticket_id,
                    "incident_update",
                    f"Aktualizacja incydentu #{incident_id} ({incident_row[0]}): {message}",
                    actor_email=user["email"],
                )
        log_audit(cur, user, "incident_update_added", "incident", incident_id, {
            "update_type": update_type,
            "is_public": is_public,
            "ticket_count": len(ticket_ids),
            "public_comments_created": public_comments_created,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"Nowy komunikat incydentu #{incident_id}: {message}",
            "incident_update",
            None,
            staff_only=not is_public,
            ticket_ids=ticket_ids if is_public else None,
        )
        return jsonify({
            "status": "ok",
            "linked_ticket_count": len(ticket_ids),
            "public_comments_created": public_comments_created,
        }), 201

