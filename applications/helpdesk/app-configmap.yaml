          appEl.innerHTML = `<section class="card"><button class="btn-secondary" onclick="${{backTarget}}">${{backLabel}}</button><h2>Centrum automatyzacji</h2><p class="muted">Ładuję reguły i symulację...</p></section>`;
          const suffix = params.toString() ? `?${{params.toString()}}` : "";
          const res = await api(`/api/admin/workflows/${{workflowId}}/automation-center${{suffix}}`);
