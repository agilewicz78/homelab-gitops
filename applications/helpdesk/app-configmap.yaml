    @sock.route("/ws")

    # Endpoint WebSocket utrzymujący live status aplikacji.
    def websocket(ws):
        client_id = id(ws)
        user = None
        try:
            raw = ws.receive()
            auth = json.loads(raw or "{}")
            sid = clean(auth.get("sid"))
            user = get_user_by_sid(sid)
            if not user:
                ws.send(json.dumps({"error": "unauthorized"}))
                return
            with live_state_condition:
                active_ws_clients.add(client_id)
            publish_event(f"{user['name']} połączony z live helpdesk", "presence")
            has_sent_payload = False
            while True:
                with live_state_condition:
                    if has_sent_payload:
                        live_state_condition.wait(timeout=WS_HEARTBEAT_SECONDS)
                    event = last_live_event
                    active_client_count = len(active_ws_clients)
                if event and not is_staff(user):
                    if event.get("staff_only"):
                        event = None
                    elif event.get("ticket_id") and not can_view_ticket(user, event["ticket_id"]):
                        event = None
                    elif event.get("ticket_ids"):
                        visible_ticket_ids = [
                            ticket_id
                            for ticket_id in event["ticket_ids"]
                            if can_view_ticket(user, ticket_id)
                        ]
                        if not visible_ticket_ids:
                            event = None
                        else:
                            event = dict(event)
                            event["ticket_ids"] = visible_ticket_ids
                ws.send(json.dumps({
                    "server_time": time.strftime("%Y-%m-%d %H:%M:%S"),
                    "active_clients": active_client_count,
                    "user": {
                        "name": user["name"],
                        "email": user["email"],
                        "role": user["role"],
                        "roles": user.get("roles", ["user"]),
                    },
                    "event": event,
                }))
                has_sent_payload = True
        except Exception:
            pass
        finally:
            with live_state_condition:
                active_ws_clients.discard(client_id)
                live_state_condition.notify_all()
