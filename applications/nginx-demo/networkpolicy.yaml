apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-demo-network-policy
  namespace: nginx-demo
spec:
  podSelector:
    matchLabels:
      app: nginx-demo
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: 192.168.239.0/24
      ports:
        - protocol: TCP
          port: 80

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
