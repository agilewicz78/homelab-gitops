    @app.get("/api/reports.csv")
    @api_login_required

    # Eksport raportów do CSV.
    def api_reports_csv(user):
        if not has_permission(user, "reports.export_csv"):
            return api_forbidden("Brak uprawnienia do eksportu raportów CSV.", "reports.export_csv")

        report = build_reports_payload(request.args.get("from"), request.args.get("to"))
        output = io.StringIO()
        output.write("﻿")
        writer = csv.writer(output, delimiter=";", lineterminator=chr(10))

        writer.writerow(["Raport helpdesk"])
        writer.writerow(["Zakres od", report.get("date_from")])
        writer.writerow(["Zakres do", report.get("date_to")])
        writer.writerow([])

        writer.writerow(["Podsumowanie", "Wartość"])
        summary_labels = [
            ("Utworzone", "created"),
            ("Rozwiązane / zamknięte", "resolved"),
            ("Otwarte teraz", "open_now"),
            ("Przekroczone SLA teraz", "overdue_sla_now"),
            ("Średnia pierwsza reakcja [h]", "avg_first_response_hours"),
            ("Średni czas rozwiązania [h]", "avg_resolution_hours"),
            ("Wszystkie zgłoszenia teraz", "total_now"),
        ]
        for label, key in summary_labels:
            value = report.get("summary", {}).get(key)
            writer.writerow([label, "" if value is None else value])
        writer.writerow([])

        def write_group(title, rows):
            writer.writerow([title])
            writer.writerow(["Etykieta", "Wartość filtra", "Liczba"])
            if rows:
                for row in rows:
                    writer.writerow([row.get("label", ""), row.get("value", ""), row.get("count", 0)])
            else:
                writer.writerow(["Brak danych", "", 0])
            writer.writerow([])

        write_group("Utworzone według priorytetu", report.get("by_priority") or [])
        write_group("Utworzone według kategorii", report.get("by_category") or [])
        write_group("Aktualny stan według statusu", report.get("by_status") or [])
        write_group("Aktualny stan według operatora", report.get("by_operator") or [])

        writer.writerow(["Trend dzienny"])
        writer.writerow(["Dzień", "Utworzone", "Rozwiązane / zamknięte"])
        for row in report.get("by_day") or []:
            writer.writerow([row.get("day", ""), row.get("created", 0), row.get("resolved", 0)])

        filename = f"helpdesk-raport-{report.get('date_from')}-{report.get('date_to')}.csv"
        return Response(
            output.getvalue(),
            mimetype="text/csv; charset=utf-8",
            headers={"Content-Disposition": f"attachment; filename={filename}"},
        )

    @app.get("/api/sla-calendar")
    @api_login_required

    # Kalendarz SLA i zgłoszenia według terminów.
    def api_sla_calendar(user):
        if not can_view_sla_backend(user):
            return api_forbidden("Brak uprawnienia do kalendarza SLA.", "sla.view")
        conn = get_conn()
        cur = conn.cursor()
        params = []
        where = [
            "t.sla_due_at IS NOT NULL",
            "t.status NOT IN ('Rozwiązane', 'Zamknięte')",
        ]
        scope = "admin" if is_admin(user) else "operator"
        if not is_admin(user):
            where.append("(lower(COALESCE(t.assigned_to_email, '')) = lower(%s) OR t.assigned_to_email IS NULL OR t.assigned_to_email = '')")
            params.append(user.get("email") or "")
        cur.execute(f"""
            SELECT
              t.id,
              t.title,
              t.status,
              t.priority,
              t.sla_due_at,
              t.assigned_to_email,
              COALESCE(NULLIF(trim(concat(u.first_name, ' ', u.last_name)), ''), t.assigned_to_email) AS assigned_to_name,
              t.requester_name,
              t.category,
              COALESCE(t.subcategory, 'Inne') AS subcategory
            FROM tickets t
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            WHERE {' AND '.join(where)}
            ORDER BY t.sla_due_at ASC, t.id ASC
        """, tuple(params))
        rows = cur.fetchall()
        cur.close()
        conn.close()
        now = datetime.now()
        today = now.date()
        tomorrow = today + timedelta(days=1)
        next_7 = today + timedelta(days=7)
        next_30 = today + timedelta(days=30)
        result = {
            "scope": scope,
            "overdue": [],
            "today": [],
            "tomorrow": [],
            "next_7_days": [],
            "next_30_days": [],
        }
        def row_to_dict(row):
            due_at = row[4]
            return {
                "id": row[0],
                "title": row[1],
                "status": row[2],
                "priority": row[3],
                "sla_due_at": str(due_at) if due_at else None,
                "sla_state": sla_state(due_at, row[2]),
                "assigned_to_email": row[5],
                "assigned_to_name": row[6],
                "requester_name": row[7],
                "category": row[8],
                "subcategory": row[9],
            }
        for row in rows:
            due_at = row[4]
            item = row_to_dict(row)
            if not due_at:
                continue
            due_date = due_at.date()
            if due_at < now:
                result["overdue"].append(item)
            elif due_date == today:
                result["today"].append(item)
            elif due_date == tomorrow:
                result["tomorrow"].append(item)
            elif due_date <= next_7:
                result["next_7_days"].append(item)
            elif due_date <= next_30:
                result["next_30_days"].append(item)
        result["counts"] = {
            "overdue": len(result["overdue"]),
            "today": len(result["today"]),
            "tomorrow": len(result["tomorrow"]),
            "next_7_days": len(result["next_7_days"]),
            "next_30_days": len(result["next_30_days"]),
        }
        cur = get_conn().cursor()
        try:
            cur.execute("""
                SELECT priority, first_response_hours, resolution_hours, warning_hours
                FROM sla_policies
                ORDER BY CASE priority WHEN 'Krytyczny' THEN 1 WHEN 'Wysoki' THEN 2 WHEN 'Normalny' THEN 3 WHEN 'Niski' THEN 4 ELSE 99 END
            """)
            result["policies"] = [
                {"priority": r[0], "first_response_hours": r[1], "resolution_hours": r[2], "warning_hours": r[3]}
                for r in cur.fetchall()
            ]
        except Exception:
            result["policies"] = []
        finally:
            try:
                cur.connection.close()
            except Exception:
                pass
        return jsonify(result)
