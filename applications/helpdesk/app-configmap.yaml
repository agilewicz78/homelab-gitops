                ${{workflowManagementMetric("Kontrola reguł", safetyLabel)}}
              </div>
              <div class="attachment-upload-hint" style="margin-top:10px">Operatorzy workflow: ${{operatorNames}}</div>
            </section>
            <div class="grid two">
              ${{workflowManagementCard(
