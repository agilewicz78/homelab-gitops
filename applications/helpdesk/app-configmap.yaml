              <p class="muted">Skonfiguruj proces w czterech krótkich krokach. Ustawienia techniczne są dostępne, ale nie przeszkadzają w podstawowej konfiguracji.</p>
              <div class="workflow-wizard-steps">
                ${{workflowFormStageButton(1, "Podstawy", "Nazwa i dopasowanie")}}
                ${{workflowFormStageButton(2, "Statusy", "Kolejność obsługi")}}
                ${{workflowFormStageButton(3, "Zespół", "Operatorzy workflow")}}
                ${{workflowFormStageButton(4, "Automatyzacje", "Reguły i testy")}}
              </div>
              <p id="workflowMessage" class="success hidden">Zapisano workflow.</p>
              <p id="workflowError" class="error hidden">Nie udało się zapisać workflow.</p>
              <form id="workflowForm" novalidate>
                <section class="workflow-form-stage" data-workflow-stage="1">
                  <div class="workflow-form-stage-header">
                    <h3>Podstawowe informacje</h3>
                    <p class="muted">Określ nazwę procesu i zgłoszenia, dla których ma być używany.</p>
                  </div>
                  <label>Nazwa workflow</label>
                  <input name="name" value="${{esc(workflow.name)}}" required placeholder="np. Naprawa sprzętu komputerowego">
                  <div class="grid">
                    <div>
                      <label>Kategoria</label>
                      <select id="workflowCategorySelect" name="category">${{categoryOptions}}</select>
                    </div>
                    <div>
                      <label>Podkategoria</label>
                      <select id="workflowSubcategorySelect" name="subcategory"></select>
                    </div>
                  </div>
                  <details class="card workflow-advanced-settings">
                    <summary>Ustawienia zaawansowane</summary>
                    <div style="margin-top:12px">
                      <label>Klucz techniczny workflow</label>
                      <input name="workflow_key" value="${{esc(workflow.workflow_key)}}" ${{editing ? "disabled" : ""}} placeholder="automatycznie z nazwy, jeśli zostawisz puste">
                      <div class="attachment-upload-hint">Po utworzeniu klucz pozostaje stały, aby istniejące zgłoszenia zachowały powiązanie.</div>
                      <label><input type="checkbox" name="is_active" ${{workflow.is_active ? "checked" : ""}}> Workflow aktywny</label>
                      <label><input type="checkbox" name="is_default" ${{workflow.is_default ? "checked" : ""}}> Workflow domyślny</label>
                      <div class="attachment-upload-hint">Workflow domyślny jest używany, gdy żadna kategoria ani podkategoria nie pasuje.</div>
                    </div>
                  </details>
                </section>

                <section class="workflow-form-stage hidden" data-workflow-stage="2">
                  <div class="workflow-form-stage-header">
                    <h3>Statusy i kolejność obsługi</h3>
                    <p class="muted">Każdy status wpisz w osobnej linii, w kolejności widocznej dla operatora.</p>
                  </div>
                  <textarea name="steps" rows="10" required>${{esc(workflowStepsText(workflow))}}</textarea>
                  <div class="attachment-upload-hint">System automatycznie dopilnuje, żeby workflow miał statusy „Nowe” i „Zamknięte”.</div>
                  ${{editing && workflow.ticket_count > 0 ? `
                    <div class="readonly-box">
                      Ten workflow jest używany przez <strong>${{workflow.ticket_count}}</strong> zgłoszeń.
                      Zmiana nazw lub usunięcie statusów wpłynie na ich dalszą obsługę.
                    </div>
                  ` : ""}}
                </section>

                <section class="workflow-form-stage hidden" data-workflow-stage="3">
                  <div class="workflow-form-stage-header">
                    <h3>Zespół odpowiedzialny za workflow</h3>
                    <p class="muted">Wybierz osoby, które mają obserwować nowe zgłoszenia należące do tego procesu.</p>
                  </div>
                  <div class="card" style="padding:12px;margin-bottom:12px">
                    <div class="attachment-upload-hint">Operatorzy workflow zostaną dodani jako obserwatorzy. Przypisanie konkretnego wykonawcy nadal jest osobną decyzją.</div>
                    ${{operatorOptions}}
                  </div>
                </section>

                <section class="workflow-form-stage hidden" data-workflow-stage="4">
                  <div class="workflow-form-stage-header">
                    <h3>Automatyzacje</h3>
                    <p class="muted">Zacznij od szablonu lub dodaj własną regułę. Nowe reguły są wersjami roboczymi, dopóki ich nie przetestujesz i nie aktywujesz.</p>
                  </div>
                  ${{!editing ? `
                    <div class="readonly-box">
                      Najpierw utwórz workflow przyciskiem „Zapisz workflow”. Po zapisaniu wrócisz do tego etapu i przetestujesz reguły na serwerze.
                    </div>
                  ` : ""}}
                  <div class="workflow-view-switch">
                    <button id="workflowAutomationListViewButton" type="button" class="btn-secondary btn-small" onclick="setWorkflowAutomationViewMode('list'); return false;">Prosta lista</button>
                    <button id="workflowAutomationDiagramViewButton" type="button" class="btn-secondary btn-small" onclick="setWorkflowAutomationViewMode('diagram'); return false;">Diagram techniczny</button>
                  </div>
                  <div id="workflowAutomationSafety"></div>
                  <div id="workflowAutomationRules"></div>
                  <button type="button" onclick="openWorkflowAutomationTemplatePicker(); return false;">Dodaj z szablonu</button>
                  <button type="button" class="btn-secondary btn-small" onclick="openWorkflowAutomationRuleForm(); return false;">Dodaj własną regułę</button>
                  <details class="card workflow-advanced-settings" style="margin-top:12px">
                    <summary>Jak działają diagramy i priorytety?</summary>
                    <div class="attachment-upload-hint" style="margin-top:10px">
                      Lista i diagram pokazują te same reguły. Warunki są łączone przez ORAZ, a niższy numer priorytetu oznacza wcześniejsze wykonanie. Do zmiany aktywnej reguły najlepiej użyć kopii roboczej.
                    </div>
                  </details>
                </section>

                <div class="workflow-wizard-actions">
                  <button id="workflowStageBack" type="button" class="btn-secondary hidden" onclick="setWorkflowFormStage(workflowFormStage - 1); return false;">← Wstecz</button>
                  <div class="actions">
                    <button id="workflowStageNext" type="button" onclick="setWorkflowFormStage(workflowFormStage + 1); return false;">Dalej →</button>
                    <button id="workflowSaveButton" type="submit" class="hidden">Zapisz workflow</button>
                    <button type="button" class="btn-secondary" onclick="${{backTarget}}">Anuluj</button>
                  </div>
                </div>
              </form>
              <div id="workflowAutomationRuleModal" class="modal-backdrop hidden"></div>
            </section>
          `;
          updateWorkflowSubcategoryOptions(meta, workflow.category, workflow.subcategory);
          workflow.meta = meta;
          workflowAutomationEditorWorkflow = workflow;
          workflowAutomationEditor = workflowDefaultAutomationRules(workflow);
          renderWorkflowAutomationRules();
          setWorkflowFormStage(draftAutomationRule && editing ? 4 : initialStage, true);
          document.getElementById("workflowCategorySelect").addEventListener("change", (e) => {{
            updateWorkflowSubcategoryOptions(meta, e.target.value, "*");
            if (workflowAutomationEditorWorkflow) {{
              workflowAutomationEditorWorkflow.category = e.target.value;
              workflowAutomationEditorWorkflow.subcategory = document.getElementById("workflowSubcategorySelect")?.value || "*";
            }}
          }});
          document.getElementById("workflowSubcategorySelect").addEventListener("change", (e) => {{
            if (workflowAutomationEditorWorkflow) workflowAutomationEditorWorkflow.subcategory = e.target.value;
          }});
          if (draftAutomationRule && editing) {{
            setWorkflowFormStage(4, true);
            openWorkflowAutomationRuleForm(null, draftAutomationRule);
          }}
          document.getElementById("workflowForm").addEventListener("submit", async (e) => {{
            e.preventDefault();
            for (let stage = 1; stage <= 4; stage += 1) {{
              const invalidField = workflowFormInvalidField(stage);
              if (invalidField) {{
                setWorkflowFormStage(stage, true);
                invalidField.reportValidity();
                return;
              }}
            }}
            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());
            payload.is_active = formData.get("is_active") === "on";
            payload.is_default = formData.get("is_default") === "on";
            payload.steps = payload.steps || "";
            payload.operator_emails = Array.from(document.querySelectorAll('input[name="operator_emails"]:checked')).map(cb => cb.value);
            if (!editing) {{
              payload.automations = workflowAutomationEditor
                .map(rule => ({{
                  name: rule.name || "Reguła workflow",
                  event_type: rule.event_type || "comment_added",
                  condition_status: rule.condition_status || "",
                  condition_to_status: rule.condition_to_status || "",
                  condition_role: rule.condition_role || "*",
                  condition_comment_visibility: rule.condition_comment_visibility || "*",
                  assigned_state: rule.assigned_state || "*",
                  condition_priority: rule.condition_priority || "*",
                  condition_category: rule.condition_category || "*",
                  condition_subcategory: rule.condition_subcategory || "*",
                  condition_sla_state: rule.condition_sla_state || "*",
                  condition_status_operator: rule.condition_status_operator || "eq",
                  condition_to_status_operator: rule.condition_to_status_operator || "eq",
                  condition_role_operator: rule.condition_role_operator || "eq",
                  condition_comment_visibility_operator: rule.condition_comment_visibility_operator || "eq",
                  assigned_state_operator: rule.assigned_state_operator || "eq",
                  condition_priority_operator: rule.condition_priority_operator || "eq",
                  condition_category_operator: rule.condition_category_operator || "eq",
                  condition_subcategory_operator: rule.condition_subcategory_operator || "eq",
                  condition_sla_state_operator: rule.condition_sla_state_operator || "eq",
                  action_type: (workflowAutomationRuleActions(rule)[0]?.action_type) || rule.action_type || "change_status",
                  action_status: (workflowAutomationRuleActions(rule)[0]?.action_value) || rule.action_status || "",
                  actions: workflowAutomationRuleActions(rule).map((action, idx) => ({{
                    action_type: action.action_type || "change_status",
                    action_value: action.action_value || "",
                    is_active: action.is_active !== false,
                    action_order: Number(action.action_order || (idx + 1)),
                  }})),
                  is_active: rule.is_active !== false,
                  stop_processing: rule.stop_processing !== false,
                  priority: Number(rule.priority || 100),
                }}))
                .filter(rule => !!rule.event_type && Array.isArray(rule.actions) && rule.actions.length > 0);
            }}
            const endpoint = editing ? `/api/admin/workflows/${{workflow.id}}` : "/api/admin/workflows";
            const method = editing ? "PUT" : "POST";
            const res = await api(endpoint, {{ method, body: JSON.stringify(payload) }});
            const msg = document.getElementById("workflowMessage");
            const err = document.getElementById("workflowError");
            msg.classList.add("hidden");
            err.classList.add("hidden");
            if (!res || !res.ok) {{
              const data = res ? await res.json().catch(() => ({{}})) : {{}};
              err.textContent = data.error || "Nie udało się zapisać workflow.";
              err.classList.remove("hidden");
              return;
            }}
            msg.classList.remove("hidden");
            setTimeout(() => {{
              if (editing) renderWorkflowManagement(workflow.id);
              else renderAdminWorkflows();
            }}, 600);
          }});
        }}
        async function deleteAdminWorkflow(workflowId, ticketCount = 0) {{
          const message = ticketCount > 0
            ? "Ten workflow jest używany przez zgłoszenia, więc zostanie dezaktywowany. Kontynuować?"
            : "Usunąć workflow? Tej operacji nie można cofnąć.";
          if (!confirm(message)) return;
          const res = await api(`/api/admin/workflows/${{workflowId}}`, {{ method: "DELETE" }});
          if (!res || !res.ok) {{
            const data = res ? await res.json().catch(() => ({{}})) : {{}};
            alert(data.error || "Nie udało się usunąć/dezaktywować workflow.");
            return;
          }}
          await renderAdminWorkflows();
        }}
        function auditActionLabel(action) {{
          const map = {{
            "user_created": "Utworzono użytkownika",
            "user_updated": "Zmieniono użytkownika / role",
            "user_password_reset": "Zresetowano hasło",
            "user_deleted": "Usunięto użytkownika",
            "ticket_status_changed": "Zmieniono status zgłoszenia",
            "ticket_assigned": "Przypisano zgłoszenie",
            "ticket_watcher_added": "Dodano obserwatora",
            "ticket_watcher_removed": "Usunięto obserwatora",
            "internal_note_added": "Dodano notatkę wewnętrzną",
            "attachment_added": "Dodano załącznik",
            "workflow_created": "Utworzono workflow",
            "workflow_updated": "Zmieniono workflow",
            "workflow_deactivated": "Dezaktywowano workflow",
            "workflow_deleted": "Usunięto workflow",
            "workflow_watchers_added": "Dodano operatorów workflow jako obserwatorów",
            "ticket_status_auto_changed": "Automatyczna zmiana statusu",
            "sla_policies_updated": "Zmieniono polityki SLA",
            "sla_check_run": "Sprawdzono SLA",
            "sla_first_response": "Pierwsza reakcja SLA"
          }};
          return map[action] || action;
        }}
        function formatAuditDetails(details) {{
          if (!details) return "";
          try {{
            const parsed = JSON.parse(details);
            return Object.entries(parsed)
              .map(([key, value]) => `<div><span class="muted">${{esc(key)}}:</span> ${{esc(Array.isArray(value) ? value.join(", ") : String(value ?? ""))}}</div>`)
              .join("");
          }} catch (e) {{
            return esc(details);
          }}
        }}
        function auditPaginationControls(pagination) {{
          const page = Number(pagination.page || 1);
          const totalPages = Number(pagination.total_pages || 1);
          const disabledPrev = page <= 1 ? "disabled" : "";
          const disabledNext = page >= totalPages ? "disabled" : "";
          return `
            <div class="pagination">
              <div class="pagination-info">
                <strong>Wyświetlanie audytu</strong><br>
                <span>Strona ${{page}} z ${{totalPages}} · rekordów: ${{pagination.total_filtered || 0}}</span>
              </div>
              <div class="pagination-pages">
                <button class="btn-secondary btn-small" ${{disabledPrev}} onclick="renderAudit(1)">« Pierwsza</button>
                <button class="btn-secondary btn-small" ${{disabledPrev}} onclick="renderAudit(${{Math.max(1, page - 1)}})">‹ Poprzednia</button>
                <button class="btn-secondary btn-small" ${{disabledNext}} onclick="renderAudit(${{Math.min(totalPages, page + 1)}})">Następna ›</button>
                <button class="btn-secondary btn-small" ${{disabledNext}} onclick="renderAudit(${{totalPages}})">Ostatnia »</button>
              </div>
            </div>
          `;
        }}
        async function renderAudit(page = 1) {{
          currentView = {{ name: "audit", ticketId: null }};
          const me = await loadMe();
          if (!me) return;
          if (!canViewAudit(me)) {{
            appEl.innerHTML = `<section class="card"><h2>Brak dostępu</h2><p class="muted">Audyt wymaga uprawnienia audit.view.</p></section>`;
            return;
          }}
          const q = sessionStorage.getItem("helpdesk_audit_q") || "";
          const action = sessionStorage.getItem("helpdesk_audit_action") || "all";
          const actor = sessionStorage.getItem("helpdesk_audit_actor") || "all";
          const pageSize = sessionStorage.getItem("helpdesk_audit_page_size") || "25";
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (action && action !== "all") params.set("action", action);
          if (actor && actor !== "all") params.set("actor", actor);
          params.set("page", String(page));
          params.set("page_size", String(pageSize));
          const res = await api(`/api/audit?${{params.toString()}}`);
          if (!res) return;
          const data = await res.json();
          if (!res.ok) {{
            appEl.innerHTML = `<section class="card"><h2>Błąd pobierania audytu</h2><p class="error">${{esc(data.error || "Nieznany błąd")}}</p></section>`;
            return;
          }}
          const rows = (data.audit || []).length
            ? data.audit.map(a => `
              <tr>
                <td class="muted">#${{a.id}}<br>${{esc(a.created_at)}}</td>
                <td><strong>${{esc(a.actor_name || "System")}}</strong><br><span class="muted">${{esc(a.actor_email || "")}}</span></td>
                <td><span class="pill">${{esc(auditActionLabel(a.action))}}</span><br><span class="muted">${{esc(a.action)}}</span></td>
                <td>${{esc(a.target_type)}}<br><span class="muted">${{esc(a.target_id || "")}}</span></td>
                <td>${{formatAuditDetails(a.details)}}</td>
              </tr>
            `).join("")
            : `<tr><td colspan="5" class="muted">Brak wpisów audytu dla wybranych filtrów.</td></tr>`;
          const actionOptions = [`<option value="all">Wszystkie akcje</option>`]
            .concat((data.actions || []).map(a => `<option value="${{esc(a)}}" ${{a === action ? "selected" : ""}}>${{esc(auditActionLabel(a))}}</option>`))
            .join("");
          const actorOptions = [`<option value="all">Wszyscy aktorzy</option>`]
            .concat((data.actors || []).map(a => `<option value="${{esc(a)}}" ${{a === actor ? "selected" : ""}}>${{esc(a)}}</option>`))
            .join("");
          appEl.innerHTML = `
            <section class="card">
              <button class="btn-secondary" onclick="renderHome()">← Lista zgłoszeń</button>
              <h2>Audyt działań</h2>
              <p class="muted">Ślad działań administracyjnych i operatorskich: użytkownicy, role, przypisania, obserwatorzy, statusy, notatki wewnętrzne i załączniki.</p>
            </section>
            <section class="card">
              <h3>Filtry audytu</h3>
              <div class="filter-grid">
                <div class="filter-field" style="grid-column: span 2">
                  <label>Szukaj</label>
                  <form id="auditSearchForm" style="display:flex; gap:8px">
                    <input id="audit-search-input" value="${{esc(q)}}" placeholder="e-mail, akcja, obiekt, szczegóły..." style="margin-top:0">
                    <button type="submit" style="margin-top:0">Szukaj</button>
                  </form>
                </div>
                <div class="filter-field">
                  <label>Akcja</label>
                  <select id="audit-action-filter">${{actionOptions}}</select>
                </div>
                <div class="filter-field">
                  <label>Aktor</label>
                  <select id="audit-actor-filter">${{actorOptions}}</select>
                </div>
                <div class="filter-field">
                  <label>Na stronie</label>
                  <select id="audit-page-size">
                    <option value="25" ${{String(pageSize) === "25" ? "selected" : ""}}>25</option>
                    <option value="50" ${{String(pageSize) === "50" ? "selected" : ""}}>50</option>
                    <option value="100" ${{String(pageSize) === "100" ? "selected" : ""}}>100</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label>&nbsp;</label>
                  <button class="btn-secondary" onclick="clearAuditFilters()">Wyczyść filtry</button>
                  <button class="btn-secondary" onclick="exportAuditCsv()" style="margin-left:8px">Eksport CSV</button>
                </div>
              </div>
            </section>
            <section class="card">
              <h3>Wpisy audytu</h3>
              ${{auditPaginationControls(data.pagination || {{ page: 1, total_pages: 1, total_filtered: 0 }})}}
              <table>
                <thead>
                  <tr><th>ID / czas</th><th>Aktor</th><th>Akcja</th><th>Obiekt</th><th>Szczegóły</th></tr>
                </thead>
                <tbody>${{rows}}</tbody>
              </table>
              ${{auditPaginationControls(data.pagination || {{ page: 1, total_pages: 1, total_filtered: 0 }})}}
            </section>
          `;
          document.getElementById("auditSearchForm").addEventListener("submit", (e) => {{
            e.preventDefault();
            sessionStorage.setItem("helpdesk_audit_q", document.getElementById("audit-search-input").value.trim());
            renderAudit(1);
          }});
          document.getElementById("audit-action-filter").addEventListener("change", (e) => {{
            sessionStorage.setItem("helpdesk_audit_action", e.target.value);
            renderAudit(1);
          }});
          document.getElementById("audit-actor-filter").addEventListener("change", (e) => {{
            sessionStorage.setItem("helpdesk_audit_actor", e.target.value);
            renderAudit(1);
          }});
          document.getElementById("audit-page-size").addEventListener("change", (e) => {{
            sessionStorage.setItem("helpdesk_audit_page_size", e.target.value);
            renderAudit(1);
          }});
        }}
        function clearAuditFilters() {{
          sessionStorage.removeItem("helpdesk_audit_q");
          sessionStorage.removeItem("helpdesk_audit_action");
          sessionStorage.removeItem("helpdesk_audit_actor");
          sessionStorage.removeItem("helpdesk_audit_page_size");
          renderAudit(1);
        }}
        function exportAuditCsv() {{
          const q = sessionStorage.getItem("helpdesk_audit_q") || "";
          const action = sessionStorage.getItem("helpdesk_audit_action") || "all";
          const actor = sessionStorage.getItem("helpdesk_audit_actor") || "all";
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (action && action !== "all") params.set("action", action);
          if (actor && actor !== "all") params.set("actor", actor);
          window.location.href = `/api/audit.csv?${{params.toString()}}`;
        }}
        function knowledgeStatusLabel(status) {{
          return ({{
            draft: "Szkic",
            published: "Opublikowany",
            archived: "Archiwalny"
          }})[status] || status;
        }}
        function knowledgeQualityLabel(quality) {{
          return ({{
            needs_review: "Wymaga poprawy",
            unrated: "Bez ocen"
          }})[quality] || quality;
        }}
        async function renderKnowledgeArticles() {{
          currentView = {{ name: "knowledge", ticketId: null }};
          const me = await loadMe();
          if (!me) return;
          const query = sessionStorage.getItem("helpdesk_knowledge_q") || "";
          const status = sessionStorage.getItem("helpdesk_knowledge_status") || "all";
          const quality = sessionStorage.getItem("helpdesk_knowledge_quality") || "all";
          const params = new URLSearchParams();
          if (query) params.set("q", query);
          if (canWorkTickets(me) && status !== "all") params.set("status", status);
          if (canWorkTickets(me) && quality !== "all") params.set("quality", quality);
          const res = await api(`/api/knowledge-articles?${{params.toString()}}`);
          if (!res || !res.ok) {{
            appEl.innerHTML = `<section class="card"><h2>Nie udało się pobrać bazy wiedzy</h2></section>`;
            return;
          }}
          const data = await res.json();
          const articles = data.articles || [];
          const statusFilter = canWorkTickets(me) ? `
            <div class="filter-field">
              <label>Status</label>
              <select id="knowledgeStatusFilter">
                <option value="all" ${{status === "all" ? "selected" : ""}}>Wszystkie</option>
                ${{(data.meta?.statuses || []).map(value =>
                  `<option value="${{esc(value)}}" ${{status === value ? "selected" : ""}}>${{esc(knowledgeStatusLabel(value))}}</option>`
                ).join("")}}
              </select>
            </div>` : "";
          const qualityFilter = canWorkTickets(me) ? `
            <div class="filter-field">
              <label>Jakość</label>
              <select id="knowledgeQualityFilter">
                <option value="all" ${{quality === "all" ? "selected" : ""}}>Wszystkie</option>
                ${{(data.meta?.quality_filters || []).map(value =>
                  `<option value="${{esc(value)}}" ${{quality === value ? "selected" : ""}}>${{esc(knowledgeQualityLabel(value))}}</option>`
                ).join("")}}
              </select>
            </div>` : "";
          const cards = articles.length ? articles.map(article => `
            <section class="card knowledge-card" onclick="renderKnowledgeArticle(${{article.id}})">
              <div class="ticket-section-title">
                <h3>#${{article.id}} · ${{esc(article.title)}}</h3>
                <span class="pill">${{esc(knowledgeStatusLabel(article.status))}}</span>
              </div>
              <div class="incident-meta">
                <span class="chip">${{esc(article.category)}}</span>
                <span class="chip">${{esc(article.subcategory)}}</span>
                ${{article.source_ticket_id ? `<span class="chip">Źródło: #${{article.source_ticket_id}}</span>` : ""}}
                ${{canWorkTickets(me) ? `<span class="chip">Pomogło: ${{article.helpful_count || 0}}</span>` : ""}}
