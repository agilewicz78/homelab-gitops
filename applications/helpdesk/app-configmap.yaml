        is_public = bool(payload.get("is_public"))
        if not message:
            return jsonify({"error": "Treść komunikatu jest wymagana."}), 400
        if update_type not in ("update", "investigation", "mitigation", "resolution"):
            return jsonify({"error": "Nieprawidłowy typ komunikatu."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT title FROM incidents WHERE id = %s", (incident_id,))
        incident_row = cur.fetchone()
        if not incident_row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        cur.execute("""
            INSERT INTO incident_updates (
              incident_id, update_type, message, is_public,
              created_by_email, created_by_name
            )
            VALUES (%s, %s, %s, %s, %s, %s)
        """, (
            incident_id, update_type, message, is_public,
            user["email"], user["name"],
        ))
        cur.execute("""
            SELECT ticket_id
            FROM incident_tickets
            WHERE incident_id = %s
        """, (incident_id,))
        ticket_ids = [ticket[0] for ticket in cur.fetchall()]
        cur.execute(
            "UPDATE incidents SET updated_at = NOW() WHERE id = %s",
            (incident_id,),
        )
        public_comments_created = 0
        for ticket_id in ticket_ids:
            if is_public:
                public_comment = (
                    f"Incydent #{incident_id} ({incident_row[0]}): {message}"
                )
                cur.execute("""
                    INSERT INTO comments (
                      ticket_id, author, author_email, content, visibility
                    )
                    VALUES (%s, %s, %s, %s, %s)
                """, (
                    ticket_id,
                    f"Incident Command Center · {user['name']}",
                    user["email"],
                    public_comment,
                    "public",
                ))
                public_comments_created += 1
                mark_first_response_if_needed(cur, ticket_id, user)
                cur.execute(
                    "UPDATE tickets SET updated_at = NOW() WHERE id = %s",
                    (ticket_id,),
                )
            add_ticket_event(
                cur,
                ticket_id,
                user,
                "incident_update",
                f"Incydent #{incident_id}: {message}",
            )
            if is_public:
                create_ticket_notifications(
                    cur,
                    ticket_id,
                    "incident_update",
                    f"Aktualizacja incydentu #{incident_id} ({incident_row[0]}): {message}",
                    actor_email=user["email"],
                )
        log_audit(cur, user, "incident_update_added", "incident", incident_id, {
            "update_type": update_type,
            "is_public": is_public,
            "ticket_count": len(ticket_ids),
            "public_comments_created": public_comments_created,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"Nowy komunikat incydentu #{incident_id}: {message}",
            "incident_update",
            None,
            staff_only=not is_public,
            ticket_ids=ticket_ids if is_public else None,
        )
        return jsonify({
            "status": "ok",
            "linked_ticket_count": len(ticket_ids),
            "public_comments_created": public_comments_created,
        }), 201

    @app.post("/api/incidents/<int:incident_id>/tickets")
    @api_login_required
    @api_staff_required
    def api_link_incident_ticket(user, incident_id):
        payload = request.get_json(silent=True) or {}
        try:
            ticket_id = int(payload.get("ticket_id"))
        except Exception:
            return jsonify({"error": "Podaj poprawne ID zgłoszenia."}), 400
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT title, severity
            FROM incidents
            WHERE id = %s
        """, (incident_id,))
        incident_row = cur.fetchone()
        cur.execute("SELECT title FROM tickets WHERE id = %s", (ticket_id,))
        ticket_row = cur.fetchone()
        if not incident_row or not ticket_row:
            cur.close()
            conn.close()
            return jsonify({"error": "Nie znaleziono incydentu albo zgłoszenia."}), 404
        cur.execute("""
            INSERT INTO incident_tickets (incident_id, ticket_id, linked_by_email)
            VALUES (%s, %s, %s)
            ON CONFLICT (incident_id, ticket_id) DO NOTHING
        """, (incident_id, ticket_id, user["email"]))
        if not cur.rowcount:
            cur.close()
            conn.close()
            return jsonify({"error": "Zgłoszenie jest już powiązane z tym incydentem."}), 409
        cur.execute("""
            SELECT message, created_at
            FROM incident_updates
            WHERE incident_id = %s
              AND COALESCE(is_public, FALSE) = TRUE
            ORDER BY id DESC
            LIMIT 1
        """, (incident_id,))
        latest_public_update = cur.fetchone()
        public_comment = (
            f"Twoje zgłoszenie zostało powiązane z incydentem "
            f"{incident_row[1]} #{incident_id}: {incident_row[0]}. "
            "Dalsze publiczne aktualizacje operatora będą automatycznie "
            "dodawane do tego zgłoszenia."
        )
        if latest_public_update:
            public_comment += (
                f"\n\nOstatnia publiczna aktualizacja "
                f"({latest_public_update[1]}): {latest_public_update[0]}"
            )
        cur.execute("""
            INSERT INTO comments (
              ticket_id, author, author_email, content, visibility
            )
            VALUES (%s, %s, %s, %s, %s)
        """, (
            ticket_id,
            f"Incident Command Center · {user['name']}",
            user["email"],
            public_comment,
            "public",
        ))
        mark_first_response_if_needed(cur, ticket_id, user)
        cur.execute(
            "UPDATE tickets SET updated_at = NOW() WHERE id = %s",
            (ticket_id,),
        )
        cur.execute("""
            INSERT INTO incident_updates (
              incident_id, update_type, message, is_public,
              created_by_email, created_by_name
            )
            VALUES (%s, 'ticket_linked', %s, FALSE, %s, %s)
        """, (
            incident_id,
            f"Powiązano zgłoszenie #{ticket_id}: {ticket_row[0]}",
            user["email"],
            user["name"],
        ))
        add_ticket_event(
            cur,
            ticket_id,
            user,
            "incident_linked",
            f"Zgłoszenie powiązano z incydentem #{incident_id}: {incident_row[0]}",
        )
        create_ticket_notifications(
            cur,
            ticket_id,
            "incident_linked",
            f"Zgłoszenie #{ticket_id} powiązano z incydentem #{incident_id}: {incident_row[0]}",
            actor_email=user["email"],
        )
        log_audit(cur, user, "incident_ticket_linked", "incident", incident_id, {
            "ticket_id": ticket_id,
        })
        conn.commit()
        cur.close()
        conn.close()
        publish_event(
            f"Powiązano zgłoszenie #{ticket_id} z incydentem #{incident_id}",
            "incident_ticket_linked",
            ticket_id,
        )
        return jsonify({
            "status": "ok",
            "public_comment_created": True,
        }), 201

