    @app.get("/api/admin/workflows/<int:workflow_id>/automation-center")
    @api_login_required

    # Centrum automatyzacji: opisuje reguły workflow i symuluje ich działanie.
    def api_admin_workflow_automation_center(user, workflow_id):
        if not can_manage_workflow_backend(user):
            return api_forbidden("Brak uprawnienia do zarządzania workflow.", "workflow.manage")
        conn = get_conn()
        cur = conn.cursor()
        cur.execute("""
            SELECT id, workflow_key, name, category, subcategory, is_default, is_active, created_at, updated_at
            FROM workflow_definitions
            WHERE id = %s
        """, (workflow_id,))
        row = cur.fetchone()
        if not row:
            cur.close()
            conn.close()
            return jsonify({"error": "not found"}), 404
        steps = workflow_steps_for_id(cur, workflow_id)
        operators = workflow_operator_entries(cur, workflow_id)
        automations = workflow_automation_entries(cur, workflow_id)
        first_step = steps[0] if steps else "Nowe"
        next_step = steps[1] if len(steps) > 1 else ""
        workflow_category = row[3] or "*"
        workflow_subcategory = row[4] or "*"
        default_category = workflow_category if workflow_category != "*" else (CATEGORIES[0] if CATEGORIES else "*")
        if workflow_subcategory != "*":
            default_subcategory = workflow_subcategory
        elif default_category != "*":
            default_subcategory = (SUBCATEGORIES.get(default_category) or ["Inne"])[0]
        else:
            default_subcategory = "*"
        sample = {
            "event_type": clean(request.args.get("event_type")) or "comment_added",
            "current_status": clean(request.args.get("current_status")) or first_step,
            "event_new_status": clean(request.args.get("event_new_status")) or "",
            "actor_role": clean(request.args.get("actor_role")) or "operator",
            "comment_visibility": clean(request.args.get("comment_visibility")) or "public",
            "assigned_state": clean(request.args.get("assigned_state")) or "unassigned",
            "priority": clean(request.args.get("priority")) or "Normalny",
            "category": clean(request.args.get("category")) or default_category,
            "subcategory": clean(request.args.get("subcategory")) or default_subcategory,
            "sla_state": clean(request.args.get("sla_state")) or "ok",
            "operator_added_comment": str(request.args.get("operator_added_comment", "")).lower() in ("1", "true", "yes", "on"),
            "operator_added_attachment": str(request.args.get("operator_added_attachment", "")).lower() in ("1", "true", "yes", "on"),
        }
        if sample["event_type"] == "status_changed" and not sample["event_new_status"]:
            sample["event_new_status"] = next_step or sample["current_status"]
        sample_user = workflow_simulation_user(sample["actor_role"])
        assigned_to_email = "operator@simulation.local" if sample["assigned_state"] == "assigned" else None
        ticket_context = {
            "priority": sample["priority"],
            "category": sample["category"],
            "subcategory": sample["subcategory"],
            "sla_state": sample["sla_state"],
        }
        rules = []
        matched_rules = 0
        for item in automations:
            matched = False
            reasons = []
            if item.get("is_active") is False:
                reasons.append("Reguła jest nieaktywna.")
            elif not workflow_rule_event_matches(item, sample["event_type"], sample_user):
                reasons.append(f"Zdarzenie nie pasuje: reguła czeka na „{workflow_event_label(item.get('event_type'))}”.")
            else:
                matched, reason = workflow_automation_match_result(
                    item,
                    sample["current_status"],
                    sample_user,
                    sample["comment_visibility"],
                    assigned_to_email,
                    sample["event_new_status"],
                    ticket_context=ticket_context,
                )
                reasons.append(reason)
            previews, missing_requirements, final_status = workflow_automation_actions_preview(
                item,
                matched,
                sample["current_status"],
                sample["event_new_status"],
                steps,
                sample,
            )
            if matched:
                matched_rules += 1
            risk = workflow_automation_risk(item, workflow_category, workflow_subcategory)
            enriched = dict(item)
            enriched.update({
                "condition_summary": workflow_automation_condition_summary(item, workflow_category, workflow_subcategory),
                "action_summary": "; ".join(workflow_automation_action_summaries(item)) or "brak aktywnych akcji",
                "risk": risk,
                "simulation": {
                    "matched": matched,
                    "reasons": reasons,
                    "actions_preview": previews,
                    "missing_requirements": missing_requirements,
                    "blocked_by_validation": bool(missing_requirements),
                    "final_status": final_status,
                },
            })
            rules.append(enriched)
        cur.execute("""
            SELECT
                wre.id,
                wre.automation_id,
                COALESCE(wa.name, 'Reguła usunięta') AS automation_name,
                wre.ticket_id,
                COALESCE(t.title, '') AS ticket_title,
                COALESCE(wre.event_type, '') AS event_type,
                COALESCE(wre.matched, TRUE) AS matched,
                COALESCE(wre.reason, '') AS reason,
                COALESCE(wre.actions_executed, '[]') AS actions_executed,
                COALESCE(wre.created_at, NOW()) AS created_at
            FROM workflow_rule_executions wre
            LEFT JOIN workflow_automations wa ON wa.id = wre.automation_id
            LEFT JOIN tickets t ON t.id = wre.ticket_id
            WHERE wre.workflow_id = %s
            ORDER BY wre.id DESC
            LIMIT 5
        """, (workflow_id,))
        recent_executions = []
        for r in cur.fetchall():
            actions_raw = r[8] or "[]"
            if isinstance(actions_raw, str):
                try:
                    actions = json.loads(actions_raw)
                except Exception:
                    actions = actions_raw
            else:
                actions = actions_raw
            recent_executions.append({
                "id": r[0],
                "automation_id": r[1],
                "automation_name": r[2],
                "ticket_id": r[3],
                "ticket_title": r[4],
                "event_type": r[5],
                "matched": bool(r[6]),
                "reason": r[7],
                "actions_executed": actions,
                "created_at": str(r[9]),
            })
        cur.close()
        conn.close()
        risk_counts = {
            "high": sum(1 for r in rules if r["risk"]["level"] == "high"),
            "medium": sum(1 for r in rules if r["risk"]["level"] == "medium"),
            "low": sum(1 for r in rules if r["risk"]["level"] == "low"),
        }
        return jsonify({
            "workflow": {
                "id": row[0],
                "workflow_key": row[1],
                "name": row[2],
                "category": workflow_category,
                "subcategory": workflow_subcategory,
                "is_default": bool(row[5]),
                "is_active": bool(row[6]),
                "created_at": str(row[7]),
                "updated_at": str(row[8]),
            },
            "steps": [{"step_name": step} for step in steps],
            "operators": operators,
            "rules": rules,
            "sample": sample,
            "recent_executions": recent_executions,
            "summary": {
                "rules_total": len(rules),
                "active_rules": sum(1 for r in rules if r.get("is_active") is not False),
                "matched_rules": matched_rules,
                "risk_counts": risk_counts,
                "recent_executions": len(recent_executions),
            },
        })
    def normalize_workflow_payload(payload, existing_key=None):
        name = clean(payload.get("name"))
        category = clean(payload.get("category")) or "*"
        subcategory = clean(payload.get("subcategory")) or "*"
        workflow_key = clean(payload.get("workflow_key")) or existing_key or workflow_key_from_name(name)
        is_default = bool(payload.get("is_default"))
        is_active = bool(payload.get("is_active", True))
        raw_steps = payload.get("steps")
        if isinstance(raw_steps, str):
            steps = [clean(x) for x in raw_steps.replace(chr(13), "").split(chr(10))]
        elif isinstance(raw_steps, list):
            steps = [clean(x.get("step_name") if isinstance(x, dict) else x) for x in raw_steps]
        else:
            steps = []
        steps = [s for s in steps if s]
        unique_steps = []
        for step in steps:
            if step not in unique_steps:
                unique_steps.append(step)
        if "Nowe" not in unique_steps:
            unique_steps.insert(0, "Nowe")
        if "Zamknięte" not in unique_steps:
            unique_steps.append("Zamknięte")
        if not name:
            return None, "Nazwa workflow jest wymagana."
        if category != "*" and category not in CATEGORIES:
            return None, "Nieprawidłowa kategoria."
        if category == "*":
            subcategory = "*"
        elif subcategory != "*" and subcategory not in SUBCATEGORIES.get(category, ["Inne"]):
            return None, "Nieprawidłowa podkategoria."
        if len(unique_steps) < 2:
            return None, "Workflow musi mieć co najmniej dwa kroki."
        automations = normalize_workflow_automations(
            payload,
            unique_steps,
            workflow_category=category,
            workflow_subcategory=subcategory,
        )
        return {
            "workflow_key": workflow_key,
            "name": name,
            "category": category,
            "subcategory": subcategory,
            "is_default": is_default,
            "is_active": is_active,
            "steps": unique_steps,
            "automations": automations,
        }, None
