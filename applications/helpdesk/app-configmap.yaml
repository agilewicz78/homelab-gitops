        payload = request.get_json(silent=True) or {}
        data, error = normalize_workflow_payload(payload)
        if error:
            return jsonify({"error": error}), 400
        conn = get_conn()
        cur = conn.cursor()
        operator_emails = normalize_workflow_operator_emails(payload)
        try:
            operator_emails = validate_workflow_operator_emails(cur, operator_emails)
        except ValueError as exc:
            cur.close()
            conn.close()
            return jsonify({"error": str(exc)}), 400
        if data["is_default"]:
            cur.execute("UPDATE workflow_definitions SET is_default = FALSE")
        cur.execute("""
            INSERT INTO workflow_definitions (
                workflow_key, name, category, subcategory, is_default, is_active, updated_at
            )
            VALUES (%s, %s, %s, %s, %s, %s, NOW())
            RETURNING id
        """, (
            data["workflow_key"], data["name"], data["category"], data["subcategory"],
            data["is_default"], data["is_active"],
        ))
        workflow_id = cur.fetchone()[0]
        for idx, step_name in enumerate(data["steps"], start=1):
            cur.execute("""
                INSERT INTO workflow_steps (workflow_id, step_name, step_order, is_final)
                VALUES (%s, %s, %s, %s)
            """, (workflow_id, step_name, idx, step_name == "Zamknięte"))
        replace_workflow_operators(cur, workflow_id, operator_emails)
        if "automations" in payload:
            replace_workflow_automations(cur, workflow_id, data.get("automations") or [])
        audit_details = dict(data)
        audit_details["operator_emails"] = operator_emails
        log_audit(cur, user, "workflow_created", "workflow", workflow_id, audit_details)
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"id": workflow_id}), 201
