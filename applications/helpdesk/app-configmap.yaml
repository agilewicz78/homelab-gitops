                END AS linked_id
              FROM ticket_links
              WHERE ticket_id = %s OR linked_ticket_id = %s
            ) l
            JOIN tickets t ON t.id = l.linked_id
            LEFT JOIN users u ON lower(u.email) = lower(t.assigned_to_email)
            ORDER BY l.created_at DESC
        """, (ticket_id, ticket_id, ticket_id))
        link_rows = cur.fetchall()
        cur.close()
        conn.close()
        ticket = {
            "id": row[0],
            "title": row[1],
            "description": row[2],
            "requester_name": row[3],
            "requester_email": row[4],
            "department": row[5],
            "category": row[6],
            "subcategory": row[7],
            "priority": row[8],
            "status": row[9],
            "created_at": str(row[10]),
            "updated_at": str(row[11]),
            "assigned_to_email": row[12],
            "assigned_to_name": row[13],
            "sla_due_at": str(row[14]) if row[14] else "",
            "resolution_minutes": row[15],
            "closed_at": str(row[16]) if row[16] else "",
            "closed_by_email": row[17] or "",
            "closed_by_name": row[18] or "",
            "resolution_summary": row[19] or "",
            "workflow_key": row[20] or "default",
            "workflow_name": row[21] or WORKFLOWS["default"]["name"],
            "sla_state": sla_state(row[14], row[9]),
        }
        comments = [
            {"author": c[0], "content": c[1], "created_at": str(c[2]), "visibility": c[3] or "public"}
            for c in comment_rows
        ]
        events = [
            {"actor_name": e[0], "event_type": e[1], "message": e[2], "created_at": str(e[3])}
            for e in event_rows
        ]
        attachments = [
            {
                "id": a[0],
                "original_filename": a[1],
                "content_type": a[2] or "",
                "size_bytes": a[3],
                "uploaded_by_name": a[4] or "",
                "created_at": str(a[5]),
