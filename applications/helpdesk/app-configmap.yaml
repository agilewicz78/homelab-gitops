        target_email = clean(email).lower()
        payload = request.get_json(silent=True) or {}
        first_name = clean(payload.get("first_name"))
        last_name = clean(payload.get("last_name"))
        department = clean(payload.get("department"))
        role = clean(payload.get("role")) or "user"

        if not first_name or not last_name:
            return jsonify({"error": "Imię i nazwisko są wymagane."}), 400
        if department not in DEPARTMENTS:
            return jsonify({"error": "Nieprawidłowy dział."}), 400
        if role not in ("user", "admin"):
            return jsonify({"error": "Nieprawidłowa rola."}), 400

        conn = get_conn()
        cur = conn.cursor()
        cur.execute("SELECT role FROM users WHERE lower(email) = %s", (target_email,))
        row = cur.fetchone()
