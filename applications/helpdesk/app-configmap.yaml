        }}
        function loadAssignedFilter(user = null) {{
          const stored = sessionStorage.getItem("helpdesk_assigned_filter");
          if (stored) return stored;
          if (user && canWorkTickets(user) && isOperator(user)) return "me";
          if (user && canWorkTickets(user)) return "all";
          return "all";
        }}
        function saveAssignedFilter(value) {{ sessionStorage.setItem("helpdesk_assigned_filter", value || "all"); }}
        function loadPriorityFilter() {{ return sessionStorage.getItem("helpdesk_priority_filter") || "all"; }}
        function savePriorityFilter(value) {{ sessionStorage.setItem("helpdesk_priority_filter", value || "all"); }}
        function loadSlaFilter() {{ return sessionStorage.getItem("helpdesk_sla_filter") || "all"; }}
        function saveSlaFilter(value) {{ sessionStorage.setItem("helpdesk_sla_filter", value || "all"); }}
        function loadTicketSearch() {{ return sessionStorage.getItem("helpdesk_ticket_search") || ""; }}
        function saveTicketSearch(value) {{ sessionStorage.setItem("helpdesk_ticket_search", value || ""); }}
        function loadTicketSort() {{ return sessionStorage.getItem("helpdesk_ticket_sort") || "created_at"; }}
        function saveTicketSort(value) {{ sessionStorage.setItem("helpdesk_ticket_sort", value || "created_at"); }}
        function loadTicketOrder() {{ return sessionStorage.getItem("helpdesk_ticket_order") || "desc"; }}
        function saveTicketOrder(value) {{ sessionStorage.setItem("helpdesk_ticket_order", value || "desc"); }}
        function loadTicketPage() {{ return Number(sessionStorage.getItem("helpdesk_ticket_page") || "1") || 1; }}
        function saveTicketPage(value) {{ sessionStorage.setItem("helpdesk_ticket_page", String(Math.max(1, Number(value) || 1))); }}
        function loadTicketPageSize() {{ return Number(sessionStorage.getItem("helpdesk_ticket_page_size") || "10") || 10; }}
        function saveTicketPageSize(value) {{ sessionStorage.setItem("helpdesk_ticket_page_size", String(Number(value) || 10)); }}
        function resetTicketPage() {{ saveTicketPage(1); }}
        function toggleStatusFilter(status) {{
          const filters = loadStatusFilters();
          const next = filters.includes(status) ? filters.filter(s => s !== status) : filters.concat([status]);
          saveStatusFilters(next);
          resetTicketPage();
          renderHome(next);
        }}
