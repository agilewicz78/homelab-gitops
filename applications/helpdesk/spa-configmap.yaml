      .workflow-condition-add { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; margin-top: 12px; }
      .workflow-condition-add > div { min-width: 260px; flex: 1; }
      .workflow-condition-sentence { margin-top: 14px; padding: 13px 14px; border-left: 4px solid #38bdf8; border-radius: 10px; background: rgba(56,189,248,.10); line-height: 1.5; }
      .workflow-condition-event-hint { margin-top: 10px; }
      .workflow-condition-warning { margin-top: 10px; padding: 11px 13px; border: 1px solid rgba(251,191,36,.45); border-radius: 12px; background: rgba(245,158,11,.12); color: #fde68a; }
      .workflow-condition-scope { margin: 12px 0; padding: 13px 14px; border: 1px solid rgba(34,197,94,.34); border-radius: 14px; background: rgba(34,197,94,.08); line-height: 1.5; }
      @media (max-width: 760px) {
        .workflow-wizard-steps { grid-template-columns: 1fr 1fr; }
        .workflow-condition-row { grid-template-columns: 1fr; }
      }
      .workflow-diagram-card { padding: 16px; margin: 12px 0; }
      .workflow-diagram-header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
      .workflow-diagram-lane { display: flex; gap: 10px; align-items: stretch; overflow-x: auto; padding: 6px 2px 12px; }
      .workflow-diagram-node { flex: 0 0 210px; min-height: 120px; border: 1px solid var(--border); border-radius: 16px; padding: 13px; background: rgba(15,23,42,.78); }
      .workflow-diagram-node.event { border-color: rgba(56,189,248,.55); background: rgba(2,132,199,.12); }
      .workflow-diagram-node.condition { border-color: rgba(250,204,21,.48); background: rgba(250,204,21,.08); }
      .workflow-diagram-node.requirement { border-color: rgba(244,114,182,.48); background: rgba(190,24,93,.10); }
      .workflow-diagram-node.action { border-color: rgba(34,197,94,.48); background: rgba(34,197,94,.09); }
      .workflow-diagram-kicker { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
      .workflow-diagram-node strong { display: block; line-height: 1.35; }
